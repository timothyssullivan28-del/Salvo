rden matter more than speculative next moves.","business":"COMPLETED Friday, Nov. 20: Dow −949.73 (−1.93%) to 48,147.33; Nasdaq Composite −1,261.47 (−5.28%) to 22,617.73. The AI sell-off overwhelms Thursday’s IPO optimism. Chip rules and a threatened overseas-data-center tax leave policy uncertainty, while the Roundup settlement and GTA sales figures carry distinct legal and company-estimate caveats.","sports":"BYU needed three overtimes, Iowa’s defense took over, and Alabama won with its backup quarterback; all six displayed football scores are final. None guarantees a playoff place. MacKinnon’s longer estimate, Harrell’s hospitalization and Mays’ IR move carry no invented recovery dates.","bigpicture":"The climate draft and proposed Ukraine financing show how far announcements can remain from implementation; Somalia’s diplomatic rupture is already an official action. Internal party choices do not complete January’s congressional votes or settle AI rules. A self-produced series, a paused auction and a film review each require a different evidentiary lens."},"sections":{"top":[{"id":"story-n21e-5","headline":"FBI investigates apparent intrusion into national crime database","summary":"AP, CNN and Fox independently cite sources describing an apparent breach of the National Crime Information Center. The FBI declined comment to AP; the access route and compromised information remain unclear. This database incident is not proof that the recent airline, banking and software outages share one cause.","sources":["Other"],"signal":"Watch","links":[{"label":"apnews.com — 3:52 PM EST, November 21, 2026; checked Saturday evening","url":"https://apnews.com/article/fbi-database-ncic-hack-d066cff87a64a564db0a00172c124972"},{"label":"Fox — Nov. 21; separately sourced NCIC report","url":"https://www.foxnews.com/politics/fbi-probes-second-cyberattack-months-hackers-breach-key-crime-database-sources-say"},{"label":"CNN — updated Nov. 21; crime-database reporting","url":"https://www.cnn.com/2026/11/20/politics/fbi-hacked-again-target-crime-database"},{"label":"Drudge — aggregator; Gulf-attack-led framing and FBI link checked Nov. 21 evening","url":"https://www.drudgereport.com/"}]},{"id":"story-n21e-4","headline":"Mexico says cartel capture operation left 11 people dead","summary":"Mexico’s defense ministry says seven alleged gunmen and four soldiers died in the operation that captured Fausto Isidro Meza Flores in Sinaloa. AP reports from Guasave and CNN corroborates the arrest reporting. The alleged cartel leader was flown to Mexico City; criminal accusations are not convictions.","sources":["Other"],"signal":"Watch","links":[{"label":"apnews.com — 4:50 PM EST, November 21, 2026; checked Saturday evening","url":"https://apnews.com/article/mexico-cartels-el-chapo-isidro-sinaloa-violence-7301b67a1b1b974bc6bd20c9d030ce07"},{"label":"CNN — Nov. 21; arrest reporting and geolocated video","url":"https://www.cnn.com/2026/11/21/americas/el-chapo-isidro-mexico-fbi-wanted-hnk-intl"}]},{"id":"story-n21e-2","headline":"Trump orders contractors to coordinate congressional responses","summary":"CNN reports Friday’s executive order directs federal contractors to notify the White House of congressional information requests and coordinate responses, including executive-privilege claims. Jamie Raskin calls it unlawful; the administration argues confidentiality protects government operations. Neither position is a court ruling on this new order.","sources":["CNN"],"signal":"Watch","links":[{"label":"cnn.com — Nov 21, 2026, 4:36 PM ET; checked Saturday evening","url":"https://www.cnn.com/2026/11/21/politics/trump-executive-order-federal-contractors-congressional-requests"}]},{"id":"story-n21e-1","headline":"Divided appeals court rejects proxy-vote quorum in spending-law case","summary":"CNN reports a 9–8 Fifth Circuit ruling Friday found proxy votes insufficient for a constitutional quorum in passage of the 2022 omnibus. The relief concerns enforcement of pregnancy-accommodation requirements against Texas; the opinion stresses its narrow scope. Do not read it as an immediate nationwide cancellation of all spending under that law.","sources":["CNN"],"signal":"Watch","links":[{"label":"cnn.com — Nov 21, 2026, 3:58 PM ET; checked Saturday evening","url":"https://www.cnn.com/2026/11/21/politics/biden-funding-bill-unconstitutional-appeals-court"}]},{"id":"story-n21e-8","headline":"Virginia confirms its first measles-associated death of 2026","summary":"A child under five who tested positive has died, Virginia’s health department announced Friday; AP’s Saturday report corroborates the notice. Officials withheld further personal details. The primary release urges vaccination and says two MMR doses are about 97% effective at preventing measles; it does not disclose this child’s vaccination history.","sources":["Other"],"signal":"Watch","links":[{"label":"apnews.com — 5:07 PM EST, November 21, 2026; checked Saturday evening","url":"https://apnews.com/article/measles-child-dies-virginia-e0c572252ece06a106cbe4d890e9fd70"},{"label":"Virginia Department of Health — primary Nov. 20 death announcement","url":"https://www.vdh.virginia.gov/news/public-relations-contacts/2026-news-releases/vdh-1st-measles-death-2026/"}]},{"id":"story-n21e-7","headline":"East Coast storm threatens holiday travel after Florida flooding","summary":"CNN’s Saturday afternoon update forecasts rain and gusty winds spreading north through Sunday, with potential airport and road delays. AP separately reports rising central Florida waters despite easing rainfall. Later Thanksgiving-week storm details remain uncertain; a forecast of disruption is not a confirmed cancellation of every flight.","sources":["CNN"],"signal":"Watch","links":[{"label":"cnn.com — Nov 21, 2026, 4:28 PM ET; checked Saturday evening","url":"https://www.cnn.com/2026/11/20/weather/florida-floods-storm-kyle-thanksgiving-travel-climate"},{"label":"AP — updated Nov. 21; Florida flooding and rescue reporting","url":"https://apnews.com/article/extreme-weather-flooding-florida-california-storms-46b14622b3ad77c32eb0182bfe8bc9f4"}]},{"id":"story-n21e-6","headline":"Maritime records show increased attacks around Strait of Hormuz","summary":"ABC News reports UKMTO counted 31 attacks in October and about 19 in November through Nov. 18; the IMO uses a different confirmation threshold. Both datasets indicate increased attacks. Experts attribute strategic aims to Iran, but those assessments do not independently establish responsibility for every incident.","sources":["Other"],"signal":"Watch","links":[{"label":"abcnews.com — Nov. 21, 2026, 6:03 a.m.; incident data through Nov. 18; checked Saturday evening","url":"https://abcnews.com/International/strait-hormuz-attacks-increased-highest-level-iran-war/story?id=138304456"}]},{"id":"story-n21m-1","headline":"Court pause still blocks Army’s Iowa chemical detonation plan","summary":"CNN’s Saturday explainer says the emergency court stay has halted destruction of unstable lead azide amid fears of airborne contamination. The Army argues detonation is the safest disposal option; residents challenge the risks. A proposed Monday operation is not an authorization to proceed while the stay remains in force.","sources":["CNN"],"signal":"Watch","links":[{"label":"cnn.com — Nov. 21, 2026, 6:00 a.m.; court pause, not completed disposal; checked Saturday evening","url":"https://www.cnn.com/2026/11/21/us/iowa-army-detonation-what-we-know"}]},{"id":"story-n21m-6","headline":"Navy says carrier will retain Doris Miller name","summary":"CNN quotes the acting Navy secretary’s spokesperson saying there is no intention to rename the carrier after Trump. Earlier discussions did not become an announced name change. The ship remains slated to honor the Pearl Harbor sailor; a separate possible Medal of Honor still requires approval.","sources":["CNN"],"signal":"Watch","links":[{"label":"cnn.com — Nov. 20, 2026; on-record Navy statement rechecked Saturday; checked Saturday evening","url":"https://www.cnn.com/2026/11/20/politics/navy-wont-rename-carrier-for-trump"}]},{"id":"story-n21e-3","headline":"NCIS confirms investigation of retired Marine Bradley Kasal","summary":"The Naval Criminal Investigative Service confirmed an investigation to AP Friday but did not disclose the allegations. The school district says Kasal formerly worked as a high-school ROTC assistant and is no longer employed there. The inquiry is not a charge or finding of guilt, and AP reports he did not respond to requests for comment.","sources":["Other"],"signal":"Watch","links":[{"label":"apnews.com — 9:13 PM EST, November 20, 2026; checked Saturday evening","url":"https://apnews.com/article/marine-veteran-navy-investigation-bradley-kasal-ae9ff8d3f63dc93f7ed123c801f39051"}]}],"usa":[{"id":"story-n21e-9","headline":"Texas defends execution procedure; witness describes severe distress","summary":"CNN’s AP report quotes the state saying Reinaldo Dennes’s Thursday execution followed procedure, while his spiritual adviser describes screams and apparent suffering. The account documents failed early IV attempts and disputed interpretations, not an independent medical finding that the procedure was painless.","sources":["CNN"],"signal":"Watch","links":[{"label":"cnn.com — Nov 21, 2026, 8:47 AM ET; checked Saturday evening","url":"https://www.cnn.com/2026/11/21/us/texas-execution-reinaldo-dennes-controversy"},{"label":"AP — original witness and state-official reporting","url":"https://apnews.com/article/execution-problems-texas-dennes-97fa4efb70b3a0b0a47935cd79a5a6af"}]},{"id":"story-n21e-13","headline":"Fourteen charged in alleged $22.5 million freight-theft scheme","summary":"CNN and a Justice Department release describe charges over dozens of Southern California train burglaries from 2024 through August 2026. Prosecutors allege stolen shoes, tools and other cargo were resold. Thursday’s indictment is an accusation; it does not establish every defendan ile two officers face obstruction and misconduct charges. The family’s civil-case evidence prompted renewed scrutiny. Indictments are not convictions; the underlying shooting is not a new Saturday incident.","sources":["Other"],"signal":"Watch","links":[{"label":"apnews.com — 1:05 PM EST, November 20, 2026; checked Saturday evening","url":"https://apnews.com/article/road-rage-chase-shooting-scott-spivey-381dee57dc0ebcc49cb19d11dc270c96"}]},{"id":"story-n20e-9","headline":"Pulp-mill safety findings face company challenge after 11 deaths","summary":"Washington investigators allege extensive violations before May’s deadly tank rupture at Nippon Dynawave, AP reports. Proposed penalties exceed $10 million; the company disputes the findings and plans an appeal. Friday’s regulatory findings are distinct from any later criminal prosecution.","sources":["Other"],"signal":"Watch","links":[{"label":"apnews.com — 8:16 PM EST, November 20, 2026; checked Saturday evening","url":"https://apnews.com/article/chemical-tank-pulp-mill-fatal-longview-nippon-6af77574d682b601568412cf9b3570f2"}]},{"id":"story-n20e-6","headline":"Palisades arson conviction moves case toward March sentencing","summary":"AP’s Friday-night report says Jonathan Rinderknecht was convicted on two federal arson-related counts after an earlier mistrial. The fire killed 12 people. Sentencing is scheduled for March 17, 2027; the defense says it will review options, so no prison term from that hearing has yet been imposed.","sources":["Other"],"signal":"Watch","links":[{"label":"apnews.com — 8:44 PM EST, November 20, 2026; checked Saturday evening","url":"https://apnews.com/article/california-palisades-fire-trial-ab04eb0ebafd314e62b8d9edfe648c75"}]},{"id":"story-n20e-16","headline":"Former Jackson mayor receives prison term for bribery","summary":"AP reports Chokwe Antar Lumumba was sentenced Friday to more than three years after pleading guilty in a scheme involving FBI operatives posing as developers. The sentence is a completed courtroom outcome, not merely an indictment. It does not decide the remaining defendants’ cases.","sources":["Other"],"signal":"Watch","links":[{"label":"apnews.com — 4:50 PM EST, November 20, 2026; checked Saturday evening","url":"https://apnews.com/article/mississippi-bribery-scheme-mayor-jackson-chokwe-lumumba-6b947e54a29f8a4b936e4c0d037af7d0"}]},{"id":"story-n21e-14","headline":"Maine family challenges town’s treatment of metal rooster statues","summary":"AP’s Nov. 19 report describes a federal lawsuit alleging Ogunquit wrongly treated metal roosters as prohibited advertising rather than artwork comforting an autistic child. The disagreement raises disability and speech questions, but those allegations have not become a final court victory.","sources":["Other"],"signal":"Watch","links":[{"label":"apnews.com — Nov. 19, 2026, 12:22 p.m. EST; older unresolved civil-rights case; checked Saturday evening","url":"https://apnews.com/article/maine-ogunquit-rooster-autism-96a1d0ee1bba50d278b6a250248bb77b"}]},{"id":"story-n21e-12","headline":"Florida surgeon sentenced to death for lawyer’s murder","summary":"AP reports a judge sentenced former plastic surgeon Tomasz Kosowski to death after his conviction for killing lawyer Steven Cozzi. The sentence is a trial-court outcome, not a statement that all possible appeals are exhausted. This is separate from the disputed Texas execution procedure.","sources":["Other"],"signal":"Watch","links":[{"label":"apnews.com — Nov. 20, 2026; sentencing report; checked Saturday evening","url":"https://apnews.com/article/lawyer-killed-missing-body-everglades-florida-375759675034efdcfbb11441d49994b9"}]}],"boston":[{"id":"story-n21e-16","headline":"Boston Saturday: Bruins opening state unconfirmed; Celtics 10 p.m.","summary":"At 7:08:37 p.m. EST, NHL displayed Washington–Bruins 0–0, 20:00 in the first, with no recorded events; ESPN earlier remained pregame. The unadvanced opening clock does not independently confirm puck drop, so a reliable in-progress state is unavailable. Celtics at Sacramento UPCOMING at 10 p.m. EST. Patriots on bye; Red Sox offseason. Neither played Friday; Wednesday’s Bruins 4–1 win at Detroit and Celtics 105–101 loss at Denver remain FINAL. Tonight’s Celtics absences are detailed below.","sources":["Other"],"signal":"Watch","links":[{"label":"espn.com — Nov. 21 evening game-state check; checked Saturday evening","url":"https://www.espn.com/nhl/game/_/gameId/401892758/capitals-bruins"},{"label":"ESPN — Celtics–Kings tonight 10 p.m. EST","url":"https://www.espn.com/nba/game/_/gameId/401910028/celtics-kings"},{"label":"NHL — official Capitals–Bruins gamecenter; final-build status checked","url":"https://www.nhl.com/gamecenter/wsh-vs-bos/2026/11/21/2026020363"},{"label":"Patriots — official bye and next fixture","url":"https://www.patriots.com/schedule/"},{"label":"Red Sox — official offseason schedule","url":"https://www.mlb.com/redsox/schedule/2026-11"}]},{"id":"story-n21e-19","headline":"Celtics rule out Tatum, White and Robinson for Sacramento","summary":"ESPN’s game report lists Jayson Tatum out for rest, Derrick White out with a shoulder injury and Mitchell Robinson out with illness; MassLive independently confirms all three. Tonight’s 10 p.m. EST game remains upcoming. Estimated return dates are not medical clearance or guarantees they play Sunday.","sources":["Other"],"signal":"Watch","links":[{"label":"espn.com — Nov. 21, 2026; Saturday injury-report check; checked Saturday evening","url":"https://www.espn.com/nba/game/_/gameId/401910028/celtics-kings"},{"label":"MassLive — Nov. 21; all three listed OUT","url":"https://www.masslive.com/celtics/2026/11/jayson-tatum-mitchell-robinson-downgraded-for-kings-game-saturday.html"}]},{"id":"story-n21e-18","headline":"Lindholm’s faceoff work gives Bruins late-game control","summary":"Globe’s Saturday notebook says Elias Lindholm entered play with 269 faceoff wins and a 62.3% success rate. His late draws helped protect Wed
