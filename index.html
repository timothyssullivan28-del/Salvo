<script id="briefing" type="application/json">{"date":"2026-09-27","lastUpdated":"September 27, 2026, 4:06 p.m. EDT Boston","dek":"The Iran standoff, a deadly Northeast nor’easter, two Pacific hurricanes, fresh violence in South Africa and an incident near a U.S.-used British air base lead this Sunday Boston edition.","take":"Fox and Reuters both report Trump expects more Iran talks, but Reuters says Tehran has not received formal rejection; Fox also reports an Iranian shipping authority’s Hormuz warning, an attributed threat. CNN’s latest update centers the deadly nor’easter, while Drudge leads with the storm and Hawaii and is an aggregator, not an independent reporting source.","sectionTakes":{"top":"Fox and Reuters both report Trump expects more Iran talks, but Reuters says Tehran has not received formal rejection; Fox also reports an Iranian shipping authority’s Hormuz warning, an attributed threat. CNN’s latest update centers the deadly nor’easter, while Drudge leads with the storm and Hawaii and is an aggregator, not an independent reporting source.","usa":"The Pittsburgh attack, Ole Miss student deaths and Evanston detention remain under investigation or dispute. USDA’s recall is an official safety notice; the Meta jury finding leaves penalties pending, while TikTok settled before trial. The Sixth Circuit ruling is limited to the case before it, and a temporary White House press-pass order did not end the separate travel-pool dispute.","boston":"Virginia Tech beat Boston College 21–14 Saturday, the only previous-night Boston-area final in these cards; the Red Sox, Patriots, Bruins and Celtics did not play Saturday. Sunday, Jacksonville beat New England 35–6; the Cubs led Boston 3–2 in the fourth inning of the rescheduled Tropicana Field finale at the latest ESPN check, with that game still in progress. Washington’s 3–2 overtime win was Friday’s Bruins preseason final; Celtics camp news, not a game result.","business":"Friday, Sept. 25’s U.S. close (latest completed session): the Dow Jones Industrial Average rose 478.64 points (+0.93%) to 51,828.62; the Nasdaq Composite gained 129.34 points (+0.48%) to 27,068.72. AI-linked shares helped drive gains despite elevated Treasury yields and oil; U.S. cash markets are closed Sunday. The other cards cover cloud and software deals, patent litigation, reported takeover talks and AI policy debate, not completed mergers or enacted legislation.","world":"Reuters reports deadly flooding in India and Nepal, while CNN says organizers report at least six missing after a separate Nepal avalanche; the latter count remains provisional. Other cards cover violence, health, aviation, legal and electoral developments. Casualty counts, official warnings and unresolved claims are attributed.","sports":"Florida’s 52–28 upset of No. 4 Ole Miss added to Saturday’s college-football upsets, alongside Texas’ 20–17 win, Iowa’s 20–19 last-second victory over Michigan and Ohio State’s 42–19 win. Other cards cover NFL availability, the upcoming WNBA playoff opener, baseball, a completed NBA trade and league news. No Boston teams, auto racing or international soccer are included.","politics":"The DOJ election-monitor plan and the House Democrats’ oversight agenda are prospective; neither establishes wrongdoing, and the latter depends on a future House majority. Separate Ohio and California court actions address different election-administration questions. The remaining cards track midterm campaigning, a disputed New Jersey ethics report and an unresolved funding fight.","entertainment":"Swift’s expanded album is out, while the VMAs and “Patient Zero” video are scheduled for Sunday night. Netflix’s “A Different World” sequel has premiered, and the restored “9 to 5” re-release is upcoming in October. Sheeran’s Gillette dates were canceled; the Paramount challenge is a court filing, and Macklemore’s aid tour is an announcement, not a completed event."},"sections":{"top":[{"id":"top-iran-war-vote-proposal","headline":"Trump expects more Iran talks this week, but Tehran says it still awaits formal U.S. rejection","summary":"President Donald Trump said Sunday he expects more talks this week, while Iranian Foreign Minister Abbas Araqchi says mediators have not formally conveyed Washington’s rejection of Tehran’s seven-day Hormuz proposal. Iran’s president says Tehran can discuss nuclear limits and inspections, though the sides dispute the offer’s terms; no deal or ceasefire is in place. Fox’s later live coverage reports a Persian Gulf Strait Authority warning against routes it deems unauthorized, an attributed threat rather than a confirmed attack or new enforcement action.","sources":["Fox","CNN","Other"],"signal":"Watch","links":[{"label":"Reuters: Iran awaits U.S. response as Trump expects more talks","url":"https://www.reuters.com/world/asia-pacific/iran-insists-diplomatic-solution-after-trump-rejects-peace-plan-2026-09-26/"},{"label":"Fox News: live Iran updates (Sept. 27)","url":"https://www.foxnews.com/live-news/iran-war-strait-of-hormuz-donald-trump-09-27-26"},{"label":"Iran Strait Authority statement cited by Fox","url":"https://twitter.com/PGSA_IRAN/status/2103958900961591679"},{"label":"CNN: Trump rejects latest Hormuz proposal","url":"https://www.cnn.com/2026/09/26/middleeast/trump-rejects-iran-proposal-hormuz-intl"}]},{"id":"top-noreaster-new-jersey-flooding","headline":"Nor’easter continues flooding Northeast coasts as tens of thousands remain without power","summary":"CNN’s tracker, updated 3:40 p.m. EDT Sunday, says the storm continues to bring wind, heavy rain and massive waves to the Northeast, with showers possible into Monday and conditions expected to improve as it weakens. CNN reported one person killed and four injured in Saturday’s wind impacts and said tens of thousands remained without power; coastal and high-tide flooding risks continue.","sources":["CNN","Drudge","Other"],"signal":"Watch","links":[{"label":"CNN: nor’easter live tracker (updated 3:40 p.m. EDT)","url":"https://www.cnn.com/2026/09/26/weather/live-news/noreaster-weekend-storm"},{"label":"AP: Sunday storm impacts and outages","url":"https://www.pbs.org/newshour/nation/powerful-noreaster-floods-northeast-leaves-over-130000-without-power-as-high-tides-threaten-coast"},{"label":"Drudge Report: current front page (aggregator)","url":"https://www.drudgereport.com/"}]},{"id":"top-hurricane-polo-mexico","headline":"Category 3 Hurricane Polo strengthens to 125 mph; warnings cover Baja before Monday approach","summary":"The National Hurricane Center’s 11 a.m. EDT Sunday advisory reported 125-mph sustained winds and hurricane warnings along portions of both Baja California Sur coasts, with a Monday approach forecast. NHC expects dangerous wind, storm surge and 4–8 inches of rain, locally up to 12 inches, with life-threatening flooding and mudslides possible; these are forecasts, not reported landfall impacts.","sources":["Other"],"signal":"Watch","links":[{"label":"NHC Hurricane Polo advisory No. 28 (11 a.m. EDT Sunday)","url":"https://www.nhc.noaa.gov/mobile/text/refresh/MIATCPEP2+html/427474.shtml"},{"label":"Reuters: Polo threatens Mexico; landfall expected Monday","url":"https://www.reuters.com/business/environment/category-3-hurricane-polo-threatens-mexicos-coast-landfall-expected-monday-2026-09-27/"}]},{"id":"top-pacific-hurricanes","headline":"Hurricane Nolo holds at 105 mph south of Hawaiʻi; flooding threat eases but dangerous surf remains","summary":"The NHC’s 11 a.m. EDT Sunday advisory put Nolo about 260 miles southwest of South Point with 105-mph winds, moving west; no coastal watches or warnings were in effect, and the center was forecast to stay well south of the main Hawaiian Islands. Rain and flood threats were diminishing on the Big Island, but dangerous surf and rip currents persisted, with NHC forecasting possible strengthening over open water.","sources":["Other"],"signal":"Watch","links":[{"label":"NHC Hurricane Nolo advisory No. 28 (5 a.m. HST Sunday)","url":"https://www.nhc.noaa.gov/mobile/text/refresh/HFOTCPCP2+html/251152.shtml"},{"label":"AP: Hurricane Nolo skirts Hawaii; remaining hazards","url":"https://apnews.com/article/hurricane-nolo-hawaii-polo-mexico-e92145be4b564484025132cdf3d0de90"}]},{"id":"top-fairford-base-arrests","headline":"UK counter-terror police investigate after five men are arrested near U.S.-used RAF Fairford","summary":"Reuters and AP report five men were arrested on suspicion of preparing a terrorist act and explosives offenses near RAF Fairford, which hosts U.S. Air Force personnel. Police evacuated local residents and bomb-disposal specialists examined vehicles; no motive or connection to the Iran conflict has been established.","links":[{"label":"Reuters: five men arrested near RAF Fairford","url":"https://www.reuters.com/world/uk/uk-police-arrest-5-by-air-base-under-terrorism-act-2026-09-27/"},{"label":"AP: Fairford arrests and investigation","url":"https://apnews.com/article/britain-explosives-us-air-base-fairford-49495441036e78763e106bbeadd1e839"}],"signal":"Watch","sources":["CNN","Other"]},{"id":"top-south-africa-twin-shootings","headline":"CNN reports 31 killed in three South African shootings as police hunt suspects","summary":"CNN’s refreshed Sunday report, citing police, says 17 people were killed in Wedela, 10 in Lwandle and four in a third shooting in Khayelitsha; no suspects had been arrested. AP and Reuters earlier reported the first two attacks as 27 dead, while the added Khayelitsha deaths were still under a separate investigation; suggested business or gang motives are not established.","links":[{"label":"CNN: updated report on three shootings (Sept. 27)","url":"https://www.cnn.com/2026/09/27/africa/south-africa-shooting-tavern-intl-hnk"},{"label":"Reuters: police report 27 killed in two shootings","url":"https://www.reuters.com/world/africa/south-africa-police-launch-manhunt-after-17-killed-tavern-shooting-2026-09-27/"},{"label":"AP: two township shootings killed at least 27","url":"https://www.bozemandailychronicle.com/wire/international/separate-mass-shootings-in-south-africa-townships-leave-at-least-27-people-dead/article_347edb58-3801-566e-8b83-5f0403d3a17a.html"}],"signal":"Watch","sources":["CNN","Other"]},{"id":"top-trump-xi-summit","headline":"Trump–Xi summit yields a reported $30 billion tariff arrangement, but rates and product details remain pending","summary":"Fox reports the White House described a reciprocal tariff-reduction agreement covering $30 billion in non-sensitive goods, with rates and a full product list still unpublished. Reuters reports China’s Foreign Ministry described an eight-point consensus that also includes an AI dialogue and trade council, while CNN’s summit coverage centers on Beijing’s push to shape global AI. The accounts differ in emphasis; the implementation details have not been fully disclosed.","sources":["Fox","CNN","Drudge","Other"],"signal":"Split","links":[{"label":"Fox News: reported $30B tariff arrangement","url":"https://www.foxnews.com/politics/us-china-strike-deal-lower-tariffs-30b-goods-trump-xi-washington-summit"},{"label":"Reuters: China’s account of summit outcomes","url":"https://www.reuters.com/world/china/china-us-agree-30-billion-tariff-cut-ai-dialogue-during-xi-visit-2026-09-26/"},{"label":"CNN: China’s global AI pitch","url":"https://www.cnn.com/2026/09/26/tech/us-china-ai-explainer-intl"},{"label":"Drudge Report: current front page (aggregator)","url":"https://www.drudgereport.com/"}]},{"id":"top-supreme-court-save-database","headline":"Supreme Court lets states use an expanded federal SAVE database for voter checks while litigation continues","summary":"The Supreme Court blocked a lower-court order that had barred states from using an expanded federal immigration database for broad citizenship checks of voter registrations. Reuters says the database’s overall error rate is unknown, and voting-rights groups cite eligible citizens who were incorrectly flagged. The emergency ruling permits checks while litigation continues; it does not establish widespread noncitizen voting.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Supreme Court ruling","url":"https://www.reuters.com/world/supreme-court-restores-trumps-mass-voter-verification-system-2026-09-25/"},{"label":"AP: database ruling","url":"https://apnews.com/article/save-database-noncitizen-voters-trump-supreme-court-412e12f5a492dd20e407812f30f7c139"}]},{"id":"top-supreme-court-missouri-map","headline":"Supreme Court again blocks Missouri from using the Trump-backed congressional map in the 2026 midterms","summary":"The Supreme Court rejected the Republican-backed map for a third time, leaving Missouri on track to use its 2022 congressional districts in November, according to AP and Reuters. This is a consequential election-law ruling, not a prediction about any race, and follows a fast-moving series of court orders.","sources":["Fox","Other"],"signal":"Consensus","links":[{"label":"Reuters: third Supreme Court block","url":"https://www.reuters.com/world/us-supreme-court-bars-republican-drawn-map-missouri-third-time-2026-09-25/"},{"label":"AP: Supreme Court rejects Missouri map","url":"https://apnews.com/article/supreme-court-missouri-redistricting-congressional-map-3f43ba5f47681ea759115fbc250712d4"},{"label":"Fox News: Supreme Court decision","url":"https://www.foxnews.com/politics/supreme-court-blocks-missouri-from-using-new-congressional-map-2026-election"}]},{"id":"top-russia-attacks-ukraine-sept27","headline":"Russian attacks kill three in Ukrainian cities as Kyiv reports damage across several districts","summary":"Reuters reports local officials said two people were killed by glide bombs near a family support center in Sumy and one driver died in a drone strike in Kharkiv; a Kyiv apartment block was hit and one person wounded. Casualties and damage are attributed to Ukrainian authorities, and both sides deny targeting civilians.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Sunday attacks kill three across Ukrainian cities","url":"https://www.reuters.com/world/russian-attacks-kills-three-ukrainian-cities-strikes-hit-kyiv-districts-2026-09-27/"}]}],"usa":[{"id":"usa-pittsburgh-doctor-killed","headline":"Pittsburgh pediatrician Idris Evans is killed in a home attack; his wife is critically injured, officials say","summary":"Police say a man entered the home and stabbed Evans and his wife while they slept; the suspect was detained. The investigation is ongoing, and the attack account is attributed to law enforcement.","sources":["CNN","Fox","Other"],"signal":"Consensus","links":[{"label":"CNN: Pittsburgh investigation","url":"https://www.cnn.com/2026/09/25/us/pittsburgh-doctor-idris-evans-stabbing-home"},{"label":"PennLive: local report","url":"https://www.pennlive.com/crime/2026/09/upmc-childrens-hospital-physician-killed-in-stabbing-suspect-detained.html"}]},{"id":"usa-copenhaver-death","headline":"James Copenhaver, wounded in the 2024 Butler rally shooting, dies from injury complications","summary":"Copenhaver, 76, was one of two people wounded when a gunman opened fire at then-candidate Donald Trump’s Pennsylvania rally in July 2024. His lawyer said he died from complications related to those injuries; the death brings renewed attention to the attack’s victims.","sources":["Fox","Other"],"signal":"Consensus","links":[{"label":"AP: Copenhaver’s death","url":"https://apnews.com/article/james-copenhaver-trump-rally-butler-dies-00866b37ad8db967b4ebf6582c756bcd"},{"label":"CBS Pittsburgh","url":"https://www.cbsnews.com/pittsburgh/news/jim-copenhaver-trump-rally-assassination-attempt-victim-dies/"},{"label":"Fox News","url":"https://www.foxnews.com/politics/james-copenhaver-man-shot-trump-butler-rally-dies-complications-from-injuries-report"}]},{"id":"usa-ole-miss-deaths","headline":"Two Ole Miss student deaths remain under investigation; kratom found at the scene does not establish a cause","summary":"Authorities are investigating the deaths of two students, and reporting says kratom was found at the scene. Investigators have not established that the substance caused either death; the cases remain under investigation.","sources":["CNN","Fox","Other"],"signal":"Watch","links":[{"label":"AP: deaths and kratom","url":"https://apnews.com/article/kratom-mississippi-deaths-students-5c4d6429e65b573b2667119a8f860ddb"},{"label":"CNN: Ole Miss deaths","url":"https://www.cnn.com/2026/09/24/us/ole-miss-student-deaths-wwk"},{"label":"Fox News","url":"https://www.foxnews.com/us/ole-miss-victim-identified-narcotics-task-force-probes-two-student-deaths"}]},{"id":"usa-evanston-ice-detention","headline":"U.S. citizen says ICE agents mistakenly detained and injured him in Evanston","summary":"A U.S. citizen says immigration agents wrongly detained and injured him; local police and the man have offered accounts of the encounter. The claim is disputed and under scrutiny, not a court finding about the agents’ conduct.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"CNN: Evanston detention","url":"https://www.cnn.com/2026/09/24/us/ice-us-citizen-detained-evanston"},{"label":"AP: local account","url":"https://apnews.com/article/chicago-illinois-ice-immigration-agents-evanston-police-2e07d80e8d96685489e914880a4e4d5"}]},{"id":"usa-usda-meat-recall","headline":"USDA recalls more than 167,000 pounds of meat produced without federal inspection","summary":"The Food Safety and Inspection Service says Star Meat Delivery recalled raw pork, beef and goat products that were produced without federal inspection. Check the agency’s recall notice for affected labels, lot details and handling instructions.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"USDA-FSIS recall notice","url":"https://www.fsis.usda.gov/recalls-alerts/star-meat-delivery-inc--recalls-raw-pork-beef-and-goat-products-produced-without"},{"label":"CNN: recall coverage","url":"https://www.cnn.com/2026/09/24/us/meat-recall-usda-star-meat-delivery-hnk"}]},{"id":"usa-meta-cambridge-analytica-jury","headline":"New Mexico jury finds Meta misled users about Facebook data practices in Cambridge Analytica case","summary":"A Santa Fe jury found 26 of 29 statements identified by New Mexico to be misleading, including statements about data practices, hate speech and misinformation; it rejected some other claims. The verdict concerns a state case arising from the Cambridge Analytica scandal. A judge will determine civil penalties, so the verdict is not a final damages award or a finding that Facebook sold every user’s data.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: jury verdict","url":"https://www.reuters.com/business/meta-misled-consumers-case-over-cambridge-analytica-scandal-new-mexico-jury-says-2026-09-25/"},{"label":"AP: case background and trial","url":"https://apnews.com/article/facebook-meta-new-mexico-privacy-lawsuit-8b414eb0a14d58d7cdc6ae752e25dcb0"}]},{"id":"usa-lincoln-sailor-mental-health","headline":"Navy says eight USS Lincoln carrier-group sailors attempted suicide during deployment","summary":"The Navy disclosed eight suicide attempts among sailors assigned to the USS Abraham Lincoln carrier group during deployment. The report raises questions about the strain of service; it does not identify individual sailors, and care resources are available through military and civilian crisis services.","sources":["Other"],"signal":"Watch","links":[{"label":"AP: Navy disclosure","url":"https://apnews.com/article/uss-lincoln-aircraft-carrier-suicide-attempts-iran-7bb8316aa4fd67e6d2c8b34c029eebda"}]},{"id":"usa-tiktok-alabama-settlement","headline":"TikTok settles Alabama’s teen-harm lawsuit on eve of the first state trial over the claims","summary":"Reuters reports TikTok and ByteDance reached a settlement with Alabama over allegations that the platform was designed to addict children and that the companies misled consumers about safety. The Alabama attorney general’s office says the state will receive at least $100 million within 45 days, with potential payments up to $300 million if conditions are met. This is a settlement before trial, not a court finding that every allegation was proven.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Alabama settlement and terms","url":"https://www.reuters.com/world/us/tiktok-settles-with-alabama-ahead-first-state-trial-over-claims-teen-harms-2026-09-25/"}]},{"id":"usa-kalshi-sixth-circuit-ruling","headline":"Appeals court says states may regulate Kalshi sports-event contracts under gambling laws","summary":"Reuters reports the 6th U.S. Circuit Court of Appeals ruled that Ohio and Tennessee gambling laws were not preempted by federal law and that Kalshi had not shown its sports-event contracts were swaps subject exclusively to Commodity Futures Trading Commission regulation. The ruling is a circuit-court decision; broader litigation and regulatory questions remain.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: 6th Circuit ruling","url":"https://www.reuters.com/business/finance/us-appeals-court-rules-against-kalshi-says-states-can-regulate-prediction-2026-09-25/"}]},{"id":"top-white-house-press-access","headline":"White House leaves CNN off Air Force One for Trump’s Tennessee trip despite a temporary order restoring its press access","summary":"CNN and AP report the network was left off President Donald Trump’s Saturday travel pool for a Tennessee college-football trip. A judge’s separate, temporary 14-day order restored White House press passes for CNN, MS NOW and Politico, but the travel-pool dispute continues. The temporary restoration is not a final ruling on the outlets’ First Amendment claims.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"CNN: Air Force One travel-pool exclusion","url":"https://www.cnn.com/2026/09/25/politics/white-house-blocks-cnn-air-force-one-travel-pool"},{"label":"Reuter e Jaguars improved to 2–1.","links":[{"label":"ESPN: final score, play-by-play and box score","url":"https://www.espn.com/nfl/game/_/gameId/401872957/patriots-jaguars"},{"label":"NFL: Patriots–Jaguars game center","url":"https://www.nfl.com/games/patriots-at-jaguars-2026-reg-3"}],"signal":"Watch","sources":["Other"]},{"id":"boston-bruins-capitals-overtime-final","headline":"Capitals beat Bruins 3–2 in overtime in Friday’s preseason final; Boston had Saturday off","summary":"Washington defeated Boston 3–2 in overtime Friday, Sept. 25. The Bruins’ official camp schedule listed no practice Saturday, Sept. 26, and no Saturday game is implied here; the final is from Friday, not the previous night.","links":[{"label":"ESPN: Bruins–Capitals recap and final","url":"https://www.espn.com/nhl/recap/_/gameId/401879360"},{"label":"NHL: official Bruins training-camp schedule","url":"https://www.nhl.com/bruins/news/bruins-announce-roster-and-schedule-for-2026-training-camp"}],"signal":"Consensus","sources":["Other"]},{"id":"boston-celtics-training-camp-roster","headline":"Celtics set a 21-player training-camp roster ahead of media day","summary":"Boston’s 21-player camp group includes five tryout players as the club begins preparations for 2026–27. This is team news; the Celtics did not play Saturday night.","links":[{"label":"Celtics: official roster breakdown","url":"https://www.nba.com/celtics/news/sidebar-offseason-2026-27-roster-breakdown-the-backcourt"},{"label":"Boston Herald: 21-player training-camp roster","url":"https://www.bostonherald.com/2026/09/25/celtics-unveil-training-camp-roster-including-five-tryout-players/"}],"signal":"Consensus","sources":["Other"]}],"business":[{"id":"business-friday-market-close","headline":"Friday’s U.S. close: Dow adds 478.64 points and Nasdaq 129.34; markets are closed for the weekend","summary":"Friday, Sept. 25 was the latest completed U.S. market session. The Dow closed at 51,828.62, up 478.64 points (0.93%), and the Nasdaq Composite closed at 27,068.72, up 129.34 points (0.48%); Reuters reports the percentages and AP supplies the exact point advances. AI-linked shares helped drive gains even as Treasury yields and oil kept investors wary. These are completed Friday closes, not live Sunday market levels.","sources":["Other"],"signal":"Consensus","links":[{"label":"Reuters: Wall Street close and drivers (Sept. 25)","url":"https://www.reuters.com/business/wall-st-futures-gain-ai-enthusiasm-eases-worries-over-higher-oil-prices-yields-2026-09-25/"},{"label":"AP: exact Dow and Nasdaq point moves (Sept. 25)","url":"https://apnews.com/article/wall-street-stocks-dow-nasdaq-36d06c7a598e03539e0e09bdf6b7ede2"}]},{"id":"business-akamai-anthropic-cloud-deal","headline":"Akamai signs seven-year $11.6 billion Anthropic cloud deal; warrant could give AI firm up to 5%","summary":"Akamai says Anthropic committed $11.6 billion over seven years for cloud services, with a warrant for up to a 5% stake; another $9 billion in services could trigger the remaining warrant portion. Akamai estimates about $5.5 billion in related capital spending and says its 2026 revenue outlook is unchanged. The commitment is large, but returns and the expansion remain prospective.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: deal, warrant and spending details","url":"https://www.reuters.com/technology/akamai-anthropic-sign-116-billion-cloud-services-deal-2026-09-24/"},{"label":"Reuters: Friday share move and market context","url":"https://www.reuters.com/business/wall-st-futures-gain-ai-enthusiasm-eases-worries-over-higher-oil-prices-yields-2026-09-25/"}]},{"id":"business-microsoft-copilot-rebuild","headline":"Microsoft rebuilds Copilot around Office apps, coding tools and an always-on AI agent","summary":"Microsoft added Word, Excel and PowerPoint integration, a natural-language coding tool and Autopilot, an AI “digital coworker.” Code and Autopilot were slated for previews later this month, not broad release; the company also added controls to help track enterprise AI costs. Shares rose about 3.7% Friday, Reuters reports.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Copilot product changes and rollout","url":"https://www.reuters.com/technology/microsoft-revamps-copilot-with-code-generation-agentic-ai-tools-2026-09-25/"},{"label":"Reuters: Microsoft shares and Friday market reaction","url":"https://www.reuters.com/business/wall-st-futures-gain-ai-enthusiasm-eases-worries-over-higher-oil-prices-yields-2026-09-25/"}]},{"id":"business-apple-taction-patent-verdict","headline":"Jury says Apple owes Taction more than $5.7 billion over haptic patents; Apple says it will appeal","summary":"A U.S. jury found Apple’s Taptic Engine infringed two Taction patents related to vibration feedback in iPhones and Apple Watches. Apple denies using Taction’s technology and said it will appeal; the verdict remains subject to that challenge.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: verdict and Apple’s response (Sept. 26)","url":"https://www.reuters.com/legal/litigation/us-jury-says-apple-owes-record-57-billion-haptic-technology-patent-case-2026-09-26/"}]},{"id":"business-nubank-monzo-talks","headline":"Report: Nubank in early talks on a possible Monzo combination at an £8–10 billion valuation","summary":"Reuters says Sky News reported that Nubank and Monzo are in early-stage talks about a potential combination; Monzo’s board is also considering a new funding round. The companies declined to comment, and no agreement has been announced. The valuation is Sky’s reported range, not a confirmed offer or deal value.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: reported Nubank–Monzo discussions (Sept. 26)","url":"https://www.reuters.com/business/finance/monzo-talks-sale-nubank-about-10-billion-valuation-sky-news-reports-2026-09-26/"}]},{"id":"business-gold-fields-northern-star","headline":"Gold Fields reportedly explored a Northern Star takeover, but the Australian miner rebuffed its approach","summary":"Bloomberg, as reported by Reuters, says Gold Fields approached Northern Star about a transaction and was rebuffed; Gold Fields is considering next steps. Neither company immediately commented to Reuters. No agreement or transaction terms have been announced.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: reported approach and response (Sept. 26)","url":"https://www.reuters.com/world/africa/gold-fields-expresses-interest-buying-northern-star-bloomberg-reports-2026-09-26/"}]},{"id":"business-gates-ai-safeguards-call","headline":"Bill Gates calls for U.S. AI-safety laws as tech leaders urge safeguards beyond self-regulation","summary":"Reuters reports Gates said legislation and monitoring should complement industry safeguards; he argued regulation need not stifle the sector. Trump and other opponents say new restrictions could advantage China, and no new law or policy has been enacted; reported AI-safety concerns remain a subject of debate.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Gates joins calls for AI safeguards and legislation (Sept. 27)","url":"https://www.reuters.com/legal/litigation/bill-gates-joins-calls-ai-safeguards-including-legislation-2026-09-27/"}]}],"world":[{"id":"world-bangkok-flood-disaster-zone","headline":"Bangkok floodwaters recede after rain eases, but residents remain stranded","summary":"Reuters reports floodwaters receded in parts of Bangkok Sunday as rain eased, but some residents remained stranded in flooded neighborhoods. The Bangkok Metropolitan Administration said about 4,200 people were using 233 temporary shelters while officials pumped canals; lighter rain was expected, with thunderstorms forecast Monday.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Bangkok floodwaters recede, residents count losses (Sept. 27)","url":"https://www.reuters.com/business/environment/bangkok-floodwaters-recede-officials-race-drain-canals-2026-09-27/"},{"label":"AP: flooding and evacuation update","url":"https://apnews.com/article/thailand-bangkok-flooding-heavy-rain-acf2918cba2517227f7f7097caa786cb"}]},{"id":"world-pakistan-dera-ismail-khan-blast","headline":"Blast in Pakistan’s Dera Ismail Khan kills 11 and injures 30, emergency service says","summary":"Rescue 1122 said 11 people were killed and 30 injured in Saturday’s blast in northwestern Pakistan. The Tehreek-e-Taliban Pakistan claimed responsibility. The casualty count is attributed to the emergency service; the militant group’s claim has not been independently established.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: blast kills 11, injures 30","url":"https://www.reuters.com/world/asia-pacific/blast-pakistans-dera-ismail-khan-kills-11-injures-30-2026-09-26/"}]},{"id":"world-catania-airport-etna-ash","headline":"Catania airport keeps arrivals suspended until midnight Sunday as Etna ash and weather disrupt flights","summary":"Reuters reports the airport operator said flights at Sicily’s Catania hub remained suspended Sunday after volcanic ash entered the atmosphere; the suspension was extended until midnight. The operational update is current as of Sunday morning and does not establish that the airport will remain closed afterward.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Catania airport extends suspension to midnight Sunday","url":"https://www.reuters.com/business/environment/italys-catania-airport-keeps-flights-suspended-until-midnight-due-etna-ash-2026-09-27/"}]},{"id":"world-india-voter-roll-software-review","headline":"India’s Election Commission orders a review of voter-roll software after report of disputed changes","summary":"The Election Commission ordered a review after a newspaper reported that senior commissioners questioned changes to voter lists that allegedly excluded millions. Opposition parties allege manipulation to benefit Prime Minister Narendra Modi’s BJP; the Commission says its actions were lawful and differences normal. A review is under way, and manipulation is not established.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Election Commission orders software review","url":"https://www.reuters.com/world/india/indias-election-commission-orders-review-voter-roll-changes-2026-09-26/"}]},{"id":"world-congo-ebola-health-staff","headline":"WHO says Congo lacks health workers as Ebola outbreak remains uncontrolled in some provinces","summary":"WHO says treatment centers are short of staff and cases have surged in North Kivu, even as case counts fell in some other provinces. The agency describes a fast-moving outbreak with uneven transmission, not a uniform rise across the country.","sources":["Other"],"signal":"Watch","links":[{"label":"PBS/AP: WHO warning","url":"https://www.pbs.org/newshour/health/congo-faces-health-worker-shortage-as-ebola-remains-out-of-control-who-says"},{"label":"WHO Africa updates","url":"https://www.afro.who.int/health-topics/ebola-virus-disease"}]},{"id":"world-quebec-helicopter-crash","headline":"Helicopter crash southeast of Montreal kills all four occupants, Quebec police say","summary":"Reuters and CBC report that Sûreté du Québec said all four occupants died after a helicopter crashed near Sainte-Brigide-d’Iberville on Saturday afternoon. Police had not released the aircraft’s ownership, origin or purpose by the 7 p.m. EDT update; Canada’s Transportation Safety Board is deploying investigators.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: four killed in Quebec helicopter crash (6:23 p.m. EDT)","url":"https://www.reuters.com/world/americas/helicopter-crash-kills-four-quebec-2026-09-26/"},{"label":"CBC: four occupants die near Montreal","url":"https://www.cbc.ca/news/canada/montreal/quebec-helicopter-crash-9.7359866"}]},{"id":"top-athens-building-explosion-six-dead","headline":"Athens building explosion kills six, including four Americans, officials say; cause remains under investigation","summary":"Greek fire brigade officials said six people died after a two-story building in Athens’ Plaka district collapsed following Friday’s explosion; U.S. officials said four victims were Americans. The mayor suggested a possible gas-infrastructure link, but investigators have not established the cause.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: six dead, including four Americans","url":"https://www.reuters.com/world/one-dead-5-missing-after-explosion-destroys-building-athens-2026-09-26/"},{"label":"ABC News: six killed in Athens blast","url":"https://abcnews.com/International/6-dead-after-explosion-collapses-building-athens/story?id=136779969"}]},{"id":"world-nepal-himlung-avalanche-missing","headline":"At least six Nepalese expedition crew are missing after avalanche at Himlung Himal base camp, CNN reports","summary":"CNN reports that expedition organizers said at least six Nepalese crew members were missing after an avalanche hit Himlung Himal base camp while staff prepared for an expedition. The number remains provisional, and heavy rain and limited communications are complicating rescue efforts; CNN had not independently confirmed the toll.","sources":["CNN"],"signal":"Watch","links":[{"label":"CNN: avalanche leaves crew missing in Nepal (Sept. 27)","url":"https://www.cnn.com/2026/09/27/asia/nepal-avalanche-missing-intl-hnk"}]},{"id":"world-swiss-neutrality-vote","headline":"Swiss voters reject a constitutional plan to tighten neutrality rules by about 70%","summary":"Final results reported by Reuters show voters in every canton rejected an initiative that would have barred Switzerland from imposing economic sanctions or cooperating with NATO except under narrow conditions. The Swiss government said its neutral status remains unchanged; the vote rejects this specific proposed constitutional rule, not neutrality itself.","sources":["Other"],"signal":"Consensus","links":[{"label":"Reuters: final Swiss neutrality citizenship requirement for voter registration","summary":"Reuters reported the federal appeals court revived Ohio’s documentary-citizenship requirement while litigation proceeds. This is a court order about state registration rules, not evidence that noncitizens voted in significant numbers.","sources":["Other"],"signal":"Consensus","links":[{"label":"Reuters: appeals court ruling","url":"https://www.reuters.com/legal/government/us-appeals-court-reinstates-ohio-law-requiring-voters-prove-citizenship-2026-09-24/"}]},{"id":"politics-california-ballots","headline":"California Supreme Court orders Riverside County sheriff to return 650,000 seized ballots","summary":"AP reports California’s high court ordered a sheriff to return ballots seized from a 2025 special election. The ruling concerns the legality and custody of the ballots; it does not change the certified result or substantiate claims of fraud.","sources":["Other"],"signal":"Consensus","links":[{"label":"AP: California ballot order","url":"https://apnews.com/article/sheriff-ballots-seized-california-supreme-court-e77a7eda321df80fa69da835e925e5b0"}]},{"id":"politics-new-jersey-lt-governor-resigns","headline":"New Jersey Lt. Gov. Dale Caldwell resigns after investigation found ethical violations; he disputes the report","summary":"New Jersey’s governor said Dale Caldwell resigned Friday after an independent report found ethical violations; Caldwell disputes the report and is exploring legal remedies. The findings and allegations are attributed, not a criminal conviction.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: resignation and investigation","url":"https://www.reuters.com/world/us/new-jerseys-lieutenant-governor-resigns-amid-sexual-harassment-findings-2026-09-25/"},{"label":"NBC News: report and resignation","url":"https://www.nbcnews.com/politics/politics-news/new-jersey-lieutenant-governor-resigns-ethics-report-rcna599885"}]},{"id":"politics-michigan-doorstep-midterms","headline":"Republican door-knockers pitch a Democrats-as-extremists message in a close Michigan race, Reuters reports","summary":"Reuters accompanied Americans for Prosperity Action canvassers mobilizing voters for Republican Mike Rogers in a competitive Michigan Senate race. The Sept. 26 report describes one campaign strategy and voter reactions, not a poll or an election result.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Michigan door-to-door campaign","url":"https://www.reuters.com/world/us/michigan-doorsteps-republicans-sell-democrats-as-extremists-message-with-mixed-2026-09-26/"}]},{"id":"politics-trump-pocket-rescission-800m","headline":"Trump seeks to withhold more than $800 million in Congress-approved funds; Sen. Susan Collins calls move illegal","summary":"Reuters reported the White House is using a rarely used “pocket rescission” to withhold more than $800 million in Congress-approved funds. The administration says it is cutting waste; Sen. Susan Collins calls the move illegal. The separation-of-powers dispute remains unresolved.","sources":["Other"],"signal":"Split","links":[{"label":"Reuters: pocket rescission and Collins response","url":"https://www.reuters.com/legal/government/trump-seeks-withhold-800-million-congress-approved-funds-2026-09-26/"},{"label":"ABC News: White House order and Collins response","url":"https://abcnews.com/Politics/white-house-orders-800m-funds-rescinded-collins-calls/story?id=136772703"}]}],"entertainment":[{"id":"entertainment-taylor-swift-encore","headline":"Taylor Swift releases “The Life of a Showgirl: The Encore” and announces the “Patient Zero” video","summary":"Swift’s expanded release arrived Friday with additional songs; the “Patient Zero” music video is scheduled to premiere during Sunday’s VMAs. The album is out, while the video remains a future event.","sources":["Other"],"signal":"Consensus","links":[{"label":"AP: Swift release","url":"https://apnews.com/article/taylor-swift-new-music-patient-zero-934935f049893d0567713bea516f2c0c"},{"label":"Variety: album and video","url":"https://variety.com/2026/music/news/taylor-swift-reveals-life-of-showgirl-encore-new-songs-1236872982/"},{"label":"Variety: video details","url":"https://variety.com/2026/music/news/taylor-swift-patient-zero-music-video-dakota-johnson-colin-farrell-1236874206/"}]},{"id":"entertainment-different-world-netflix","headline":"Netflix’s “A Different World” sequel premieres with the original HBCU setting in focus","summary":"The sequel to the 1980s campus sitcom is available on Netflix Friday, bringing a new generation to the fictional Hillman College setting. The premiere is confirmed; audience response is not yet known.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"CNN: sequel premiere","url":"https://www.cnn.com/2026/09/24/entertainment/a-different-world-reboot-netflix"},{"label":"AP: sequel","url":"https://apnews.com/article/a-different-world-sequel-f0f23537d211e084dfb53999c3a4a367"}]},{"id":"entertainment-paramount-wbd-settlement-challenge","headline":"Merger opponents ask a court to reject Paramount’s settlement tied to its Warner Bros. bid","summary":"Variety reports opponents urged a court to reject a settlement connected to Paramount’s proposed Warner Bros. bid. The filing is an argument for the judge to consider; it is not a ruling on the merger or a completed acquisition.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety: court challenge","url":"https://variety.com/2026/tv/global/block-the-merger-amicus-brief-reject-settlement-1236875410/"},{"label":"Variety: settlement terms","url":"https://variety.com/2026/film/news/paramount-states-settlement-terms-warner-bros-1236871264/"}]},{"id":"entertainment-macklemore-charity-tour","headline":"Macklemore announces a tour supporting Palestinian aid organizations","summary":"Macklemore says proceeds from his planned “Free Palestine” shows will support aid organizations. The tour announcement is confirmed; the performances and any eventual distributions have not yet occurred.","sources":["Other"],"signal":"Watch","links":[{"label":"AP: tour announcement","url":"https://apnews.com/article/macklemore-free-palestine-shows-ed-sheeran-65a65a362e530dfe739ddb626dc16d23"},{"label":"Variety: tour details","url":"https://variety.com/2026/music/news/macklemore-free-palestine-tour-1236874352/"}]},{"id":"entertainment-dolly-9-to-5-restoration","headline":"Restored “9 to 5” returns to U.S. theaters Oct. 9–15, with proceeds supporting Dolly Parton’s foundation","summary":"Deadline reports 20th Century Studios will bring the newly restored 1980 comedy starring Dolly Parton, Jane Fonda and Lily Tomlin back to theaters for a one-week run beginning Oct. 9. Disney says net proceeds from U.S. ticket sales will benefit the Dollywood Foundation; screenings are upcoming, not underway.","links":[{"label":"Deadline: restored “9 to 5” theatrical run and charity","url":"https://deadline.com/2026/09/9-to-5-return-screening-dolly-parton-charity-1237113711/"},{"label":"Fox 59: Oct. 9–15 theatrical dates","url":"https://fox59.com/news/national-world/dolly-partons-classic-9-to-5-returning-to-theaters-for-limited-run/"}],"signal":"Watch","sources":["Other"]},{"id":"entertainment-ed-sheeran-gillette-canceled","headline":"Ed Sheeran cancels Friday and Saturday Gillette Stadium shows as nor’easter approaches","summary":"Gillette Stadium and the promoter announced that Ed Sheeran’s Foxborough shows scheduled for Sept. 25–26 were canceled because of the nor’easter. The venue’s notice says refunds are available through the point of purchase; no replacement dates were announced in the cited notice.","sources":["Other"],"signal":"Consensus","links":[{"label":"Gillette Stadium official cancellation notice","url":"https://www.gillettestadium.com/events/ed-sheeran-loop-tour/"},{"label":"NBC Boston/AP: cancellation report","url":"https://www.nbcboston.com/news/local/ed-sheeran-gillette-stadium-loop-tour/4020701/"}]},{"id":"entertainment-vmas-sunday-guide","headline":"The 2026 VMAs air Sunday night as Taylor Swift seeks a record-setting milestone and Madonna leads nominations","summary":"AP’s event guide says the Sept. 27 ceremony is scheduled for 7:30 p.m. Eastern on CBS and MTV, with Taylor Swift positioned for a new career record if the announced honor is awarded. This is a preview, not a completed ceremony or award result.","sources":["Other"],"signal":"Watch","links":[{"label":"AP: 2026 MTV VMAs guide","url":"https://apnews.com/article/mtv-video-music-awards-2026-guide-711f84857a0d65730696adf0ebdfa9a8"},{"label":"MTV: VMA show information","url":"https://www.mtv.com/vma"}]}]},"researchNotes":["Fresh public-web research was conducted for the Sunday Sept. 27, 2026, 4 p.m. EDT Boston refresh. Fox News’ current Iran live file and homepage, CNN’s homepage and its nor’easter tracker updated 3:40 p.m. EDT, and the Drudge Report front page were opened and compared. Drudge’s lead links emphasized the storm and Hawaii; Drudge is an aggregator, not an independent reporting source.","Fox’s Sunday Iran live file reports President Trump expects more talks this week and says an Iranian maritime authority warned shipowners against routes it calls unauthorized. The warning is attributed to that authority and Fox’s live file; it is not evidence of a new attack or confirmed enforcement action. Reuters says Iran’s foreign minister has not received a formal U.S. rejection through mediators, while Fox separately reports Iran’s president is open to discussing nuclear limits and inspections.","CNN’s nor’easter tracker was updated at 3:40 p.m. EDT Sunday: it reported one death and four wind-related injuries from Saturday, tens of thousands still without power, continuing coastal impacts, and showers possible into Monday; conditions are expected to improve as the storm weakens. An exact 4 p.m. outage total was not stated in the opened CNN update, so the edition uses its qualitative current count rather than carrying forward the morning’s 130,000-plus figure.","CNN reported Sunday that organizers said at least six Nepalese crew members were missing after an avalanche at Himlung Himal base camp. The count remains provisional; CNN had not independently confirmed it, and heavy rain and limited communications were hampering rescue efforts. A separate second-source report was not located during this search.","Boston games were checked against ESPN live score pages at approximately 4:03–4:05 p.m. EDT. ESPN marked Jacksonville’s 35–6 win over New England final; it showed the Cubs leading Boston 3–2 in the fourth inning, still in progress, at the last check. The Red Sox score is explicitly not presented as final.","Boston College’s 21–14 loss to Virginia Tech Saturday was the previous-night Boston-area final in the cards; the Red Sox, Patriots, Bruins and Celtics did not play Saturday. Sunday’s Patriots–Jaguars game is reported final (35–6 Jaguars), and the relocated Cubs–Red Sox finale is reported live (Cubs 3–2 in the fourth at last check). The Bruins item expressly dates Friday’s overtime loss, and the Celtics card is training-camp news.","Friday, Sept. 25 was the latest completed U.S. market session. Reuters and AP verify Friday’s exact Dow and Nasdaq closing levels and point moves; Reuters reports the percentages. U.S. cash markets are closed Sunday, and the business Tell explicitly presents Friday as the latest completed session.","All tabs retain the required order and counts (10/10/5/7/10/9/7/7). Story membership is unique with labeled source links; General Sports excludes Boston teams, auto racing and international soccer. Tells use only cards on their own tab and are concise (2–4 sentences)."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'Boston-area professional and major-college sports only.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, or international soccer.',business:'7 unique business/markets stories; close figures refer to the latest completed U.S. session.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
