<script id="briefing" type="application/json">{"date":"2026-09-25","lastUpdated":"September 25, 2026, 4:00 p.m. EDT Boston","dek":"Trump–Xi summit readout, Hurricane Nolo’s growing threat to Hawaii, deadly Russian strikes on Kyiv, Middle East escalation and late-day U.S. court rulings lead Friday’s 4 p.m. briefing.","take":"Across the summit coverage, Trump and Xi ended their visit without a clearly disclosed breakthrough on core disputes, though CNN reports the trade truce was extended and Reuters says further trade details are due Monday. Fox foregrounds symbolic diplomacy and security, including Iran; CNN calls the visit “heavy on pomp, light on substance”; Drudge’s front-page selection emphasizes summit backlash and election-related conflict, but provides no independent summit reporting. Drudge is an aggregator, not independent confirmation. NHC reports Nolo’s winds reached 105 mph in its 8:35 a.m. HST update, while rain totals remain forecasts; Reuters reports seven killed in Kyiv. Distinguish claims, attributed casualty reports and forecasts from settled outcomes.","sectionTakes":{"top":"Across the summit coverage, Trump and Xi ended their visit without a clearly disclosed breakthrough on core disputes, though CNN reports the trade truce was extended and Reuters says further trade details are due Monday. Fox foregrounds symbolic diplomacy and security, including Iran; CNN calls the visit “heavy on pomp, light on substance”; Drudge’s front-page selection emphasizes summit backlash and election-related conflict, but provides no independent summit reporting. Drudge is an aggregator, not independent confirmation. NHC reports Nolo’s winds reached 105 mph in its 8:35 a.m. HST update, while rain totals remain forecasts; Reuters reports seven killed in Kyiv. Distinguish claims, attributed casualty reports and forecasts from settled outcomes.","usa":"The U.S. section ranges from a Pittsburgh killing and two student deaths under investigation to a citizen’s disputed account of ICE detention, a nor’easter, flight disruption and Navy disclosures. It also includes a USDA recall, the upcoming TikTok trial and a new 6th Circuit ruling on Kalshi. Allegations remain attributed, causes are not presumed, storm and flight conditions are time-sensitive, and a circuit ruling is not a nationwide resolution of every prediction-market dispute.","world":"This tab covers renewed Tigray fighting, Congo’s Ebola response, Yemen’s hunger emergency, U.N. diplomacy, Kyiv strikes, the Tanganyika capsizing, Nepal’s recovery, India’s coal proposal, Nordic aircraft monitoring, Sri Lanka’s judicial amendment and Colombia’s extradition. Conflicting or developing casualty counts, official statements and allegations are attributed; proposals are not adopted policy, and a poll or appeal is not a final outcome.","politics":"This tab covers campaign strategy, election administration and legal or messaging disputes—not enacted policy where none has occurred. The DOJ monitor deployment is prospective; paid-creator coverage raises attribution concerns without proving every item deceptive; Ohio’s registration rule and California’s ballot order are separate court actions. Midterm analysis is not a poll, and a government-funded ad is not by itself proof of an election-law violation.","sports":"Atlanta’s 35–14 win over Green Bay is final. NFL injury and availability reports can change; the WNBA bracket is set but its Aces–Fever series has not begun; Presidents Cup coverage here is limited to the opening session and schedule, not a final result. The former trainer faces allegations, not a finding of guilt. This tab excludes Boston teams, auto racing and international soccer.","boston":"The first two stories are verified Thursday-night finals: the Red Sox lost 1–0 to Cleveland and the Bruins lost 2–0 to Philadelphia (preseason). The Patriots and Celtics did not play Thursday night, so no score is implied. Friday’s Red Sox–Cubs Game 1 then finished with Boston winning 4–3; Game 2 and the Bruins–Capitals preseason game were still scheduled for later Friday at the 4 p.m. update. The remaining cards are current Patriots and Celtics roster news.","entertainment":"Taylor Swift’s expanded release is out, Netflix’s “A Different World” sequel has premiered, and Ed Sheeran’s two Gillette Stadium concerts were canceled because of the impending nor’easter. The Paramount-related court request remains pending; Macklemore’s aid-tour plans are not proof of distributions; “Black Doves” and “Dragon Tattoo” are first-look or casting updates. Announcements, cancellations and future events are clearly distinguished."},"sections":{"top":[{"id":"top-trump-xi-summit","headline":"Trump and Xi end Washington visit with ceremony; core disputes remain and trade details are pending","summary":"Trump and Xi closed the three-day visit Friday with tea and a National Archives tour. CNN reports they extended a trade truce and exchanged gifts and praise; Reuters says details of limited trade arrangements are due Monday, while Taiwan remains a central unresolved issue. Fox highlights the symbolic final stop and strategic rivalry; CNN’s analysis calls the summit heavy on pomp and light on substance. Drudge’s front page emphasizes backlash and broader economic and political anxieties, not an independent summit account. No comprehensive new trade agreement or resolution of the core disputes was publicly announced.","sources":["Fox","CNN","Drudge","Other"],"signal":"Split","links":[{"label":"Reuters: summit wrap-up","url":"https://www.reuters.com/world/china/trump-wrap-up-xi-summit-with-tour-us-archives-2026-09-25/"},{"label":"Reuters: trade update","url":"https://www.reuters.com/world/china/details-us-china-trade-talks-come-monday-says-greer-2026-09-25/"},{"label":"CNN: summit analysis","url":"https://www.cnn.com/2026/09/25/world/xi-dc-trump-analysis-intl-hnk"},{"label":"Fox News: symbolic final stop","url":"https://www.foxnews.com/politics/xi-caps-trump-state-visit-symbolic-final-stop-before-leaving-washington"},{"label":"Drudge Report front page","url":"https://www.drudgereport.com/"}]},{"id":"top-pacific-hurricanes","headline":"Hurricane Nolo strengthens to 105 mph as Hawaii faces forecast rain up to 25 inches","summary":"The National Hurricane Center’s 8:35 a.m. HST update reported that Hurricane Hunter data showed Nolo strengthening to 105-mph sustained winds, making it a Category 2 hurricane; the center was about 185 miles south of South Point. The latest retrieved public advisory (20A, 8 a.m. HST) lists a hurricane watch and tropical-storm warning for Hawaii County and a tropical-storm watch for Maui County, with forecast rainfall of 10–15 inches on eastern and southern Big Island areas and locally up to 25 inches. Those are forecasts, not observed totals; the next routine advisory package was due at 11 a.m. HST (5 p.m. EDT).","sources":["Other"],"signal":"Watch","links":[{"label":"NHC 8:35 a.m. HST update","url":"https://www.nhc.noaa.gov/text/refresh/HFOTCUCP2+shtml/251839.shtml"},{"label":"NHC Public Advisory 20A","url":"https://www.nhc.noaa.gov/text/refresh/HFOTCPCP2+shtml/251758.shtml"},{"label":"AP: Nolo and Polo","url":"https://apnews.com/article/hurricane-nolo-hawaii-polo-mexico-e92145be4b564484025132cdf3d0de90"}]},{"id":"top-iran-war-vote-proposal","headline":"Senate rejects Iran war-powers measure as Tehran says it offered a seven-day Hormuz proposal","summary":"Reuters reports the Senate rejected a resolution directing President Trump to end the war or seek congressional authorization; the 50–49 vote did not enact a new war authorization. Iran’s foreign minister says Tehran offered a seven-day plan to reopen the Strait of Hormuz and restart talks. The proposal is an Iranian claim, not an agreed ceasefire or deal.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Senate vote","url":"https://www.reuters.com/world/us/us-democrats-tee-up-pre-election-war-powers-vote-some-republicans-break-with-2026-09-24/"},{"label":"CBS News: Iran war updates","url":"https://www.cbsnews.com/live-updates/iran-war-trump-un-speech-annihilate-threat-talks-resume/"},{"label":"Financial Times: proposal","url":"https://www.ft.com/content/917a9cba-6afd-4ba3-8742-2b7601ecc2ba?syn-25a6b1a6=1"}]},{"id":"top-china-intel-iran","headline":"CNN reports U.S. intelligence sources allege Chinese-linked data helped Iran target U.S. sites","summary":"CNN cites four U.S. sources describing intelligence assessments that Chinese-linked satellite imagery and data aided Iranian targeting; it also reports officials disagree about the extent and whether Beijing directed the support. Separately, the U.S. ambassador to China says Trump told Xi that assistance to Iran was unacceptable. The allegation has not been independently established, and Chinese and Iranian officials did not respond to CNN before publication.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"CNN: intelligence report","url":"https://www.cnn.com/2026/09/25/politics/china-intelligence-iran-targeting-hormuz"},{"label":"Reuters: ambassador’s statement","url":"https://www.reuters.com/world/us/trump-told-xi-that-china-helping-iran-is-unacceptable-us-ambassador-says-2026-09-25/"}]},{"id":"top-saudi-houthi-attacks","headline":"Saudi Arabia says it intercepted six missiles after Houthis claimed attacks on Riyadh and Aramco sites","summary":"Saudi officials say the kingdom intercepted six missiles as Yemen’s Iran-aligned Houthis claimed attacks on Riyadh and Aramco facilities in Yanbu. Reuters and AP report the competing accounts; the Houthi claims are not independently confirmed, and the sources do not establish damage at the alleged targets.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: regional response","url":"https://www.reuters.com/world/middle-east/allies-unite-behind-saudi-arabia-houthis-step-up-attacks-2026-09-25/"},{"label":"Reuters: Houthi claims","url":"https://www.reuters.com/world/middle-east/houthis-say-they-attacked-riyadh-aramco-facilities-yanbu-2026-09-24/"},{"label":"AP: regional developments","url":"https://apnews.com/article/yemen-saudi-arabia-houthis-missiles-d19776cf1a68b45d28b1402f3a47b8cd"}]},{"id":"top-white-house-press-access","headline":"Judge restores CNN, MS NOW and Politico access for 14 days, but the White House press-ban case continues","summary":"Reuters says the administration complied with a temporary order restoring the three outlets’ credentials, but the judge has not decided their First Amendment claim and the outlets face a September 28 deadline to seek a preliminary injunction. The order is temporary, not a final ruling on the press-freedom dispute.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"Reuters: what comes next","url":"https://www.reuters.com/legal/government/why-court-fight-over-white-house-media-ban-isnt-over-2026-09-25/"},{"label":"AP live coverage","url":"https://apnews.com/live/trump-xi-china-summit-media-ban-news-updates-09-25-2026"},{"label":"CNN live coverage","url":"https://www.cnn.com/2026/09/24/politics/live-news/white-house-press-ban-lawsuit"}]},{"id":"top-pakistan-afghanistan-strikes","headline":"Pakistan says it struck 10 locations in Afghanistan after alleged drone attacks; Kabul disputes blame","summary":"Pakistan says it hit 10 sites after alleged cross-border drone attacks; Afghanistan’s Taliban government disputes Pakistan’s account. AP and Reuters describe competing claims amid renewed clashes, and attribution of the drone attacks remains contested.","sources":["Other"],"signal":"Watch","links":[{"label":"AP: border fighting","url":"https://apnews.com/article/pakistan-afghanistan-border-fighting-66402ffe6fc48608ea4c32a099774c4c"},{"label":"Reuters: background","url":"https://www.reuters.com/world/asia-pacific/what-has-turned-afghan-taliban-pakistan-partners-foes-2026-09-25/"}]},{"id":"top-kyiv-russian-strikes","headline":"Russian strikes kill seven in Kyiv as Ukraine’s largest steel plant halts production","summary":"Reuters reports local authorities said Russian strikes killed seven people in Kyiv, including a 14-year-old boy. Separately, ArcelorMittal said repeated strikes had damaged its Kryvyi Rih steel plant and it would not restart production for now. The Kyiv toll and plant decision are attributed to the reporting and company; this is not a claim that all Ukrainian steel production stopped.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Kyiv strikes and plant shutdown","url":"https://www.reuters.com/world/europe/russian-drone-hits-central-kyiv-killing-child-injuring-least-seven-people-2026-09-25/"}]},{"id":"top-supreme-court-save-database","headline":"Supreme Court revives expanded SAVE database for voter checks while the legal challenge continues","summary":"The Supreme Court blocked a lower-court order that had barred state officials from using the revamped federal immigration database for sweeping citizenship checks of voter registrations. Reuters reports the database’s overall error rate is unknown and voting-rights groups cite wrongly flagged eligible citizens. The emergency ruling permits the database’s use while litigation continues; it is not proof of widespread noncitizen voting.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Supreme Court ruling","url":"https://www.reuters.com/world/supreme-court-restores-trumps-mass-voter-verification-system-2026-09-25/"},{"label":"NPR: database ruling","url":"https://www.houstonpublicmedia.org/npr/2026/09/25/nx-s1-5976804/the-supreme-court-revives-a-controversial-data-system-for-citizenship-checks/"}]},{"id":"top-congo-boat-disaster","headline":"Lake Tanganyika boat disaster leaves casualty figures unsettled after at least 41 deaths were reported","summary":"An AP report citing provincial authorities said at least 41 people died and 49 were rescued after a boat traveling from Tanzania to Congo capsized Thursday. In a Friday update, Reuters cited an official saying 43 people survived and more than 40 remained missing. The evolving official counts differ; the cause was not yet reported.","sources":["Other"],"signal":"Watch","links":[{"label":"AP report via WTOP","url":"https://wtop.com/world/2026/09/boat-heading-from-tanzania-to-congo-on-lake-tanganyika-capsizes-leaving-at-least-41-dead-2/"},{"label":"Reuters: more than 40 missing","url":"https://www.reuters.com/world/africa/more-than-40-missing-after-congo-passenger-boat-sinks-official-says-2026-09-25/"}]}],"usa":[{"id":"usa-pittsburgh-doctor-killed","headline":"Pittsburgh pediatrician Idris Evans is killed in a home attack; his wife is critically injured, officials say","summary":"Authorities say a man entered the home and stabbed the physician and his wife while they slept; the suspect was detained. The investigation is ongoing, and the account of the attack is attributed to law enforcement.","sources":["CNN","Fox","Other"],"signal":"Consensus","links":[{"label":"CNN: Pittsburgh investigation","url":"https://www.cnn.com/2026/09/25/us/pittsburgh-doctor-idris-evans-stabbing-home"},{"label":"PennLive: local report","url":"https://www.pennlive.com/crime/2026/09/upmc-childrens-hospital-physician-killed-in-stabbing-suspect-detained.html"}]},{"id":"usa-copenhaver-death","headline":"James Copenhaver, wounded in the 2024 Butler rally shooting, dies from injury complications","summary":"Copenhaver, 76, was one of two people wounded when a gunman opened fire at then-candidate Donald Trump’s Pennsylvania rally in July 2024. His lawyer said he died from complications related to those injuries; the death brings renewed attention to the attack’s victims.","sources":["Fox","Other"],"signal":"Consensus","links":[{"label":"AP: Copenhaver’s death","url":"https://apnews.com/article/james-copenhaver-trump-rally-butler-dies-00866b37ad8db967b4ebf6582c756bcd"},{"label":"CBS Pittsburgh","url":"https://www.cbsnews.com/pittsburgh/news/jim-copenhaver-trump-rally-assassination-attempt-victim-dies/"},{"label":"Fox News","url":"https://www.foxnews.com/politics/james-copenhaver-man-shot-trump-butler-rally-dies-complications-from-injuries-report"}]},{"id":"usa-ole-miss-deaths","headline":"Two Ole Miss student deaths remain under investigation; kratom found at the scene does not establish a cause","summary":"Authorities are investigating the deaths of two students, and reporting says kratom was found at the scene. Investigators have not established that the substance caused either death; the cases remain under investigation.","sources":["CNN","Fox","Other"],"signal":"Watch","links":[{"label":"AP: deaths and kratom","url":"https://apnews.com/article/kratom-mississippi-deaths-students-5c4d6429e65b573b2667119a8f860ddb"},{"label":"CNN: Ole Miss deaths","url":"https://www.cnn.com/2026/09/24/us/ole-miss-student-deaths-wwk"},{"label":"Fox News","url":"https://www.foxnews.com/us/ole-miss-victim-identified-narcotics-task-force-probes-two-student-deaths"}]},{"id":"usa-evanston-ice-detention","headline":"U.S. citizen says ICE agents mistakenly detained and injured him in Evanston","summary":"A U.S. citizen says immigration agents wrongly detained and injured him; local police and the man have offered accounts of the encounter. The claim is disputed and under scrutiny, not a court finding about the agents’ conduct.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"CNN: Evanston detention","url":"https://www.cnn.com/2026/09/24/us/ice-us-citizen-detained-evanston"},{"label":"AP: local account","url":"https://apnews.com/article/chicago-illinois-ice-immigration-agents-evanston-police-2e07d80e8d96685489e914880a4e4d5"}]},{"id":"usa-noreaster-coastal-flooding","headline":"Nor’easter brings Mid-Atlantic coastal flooding as stronger New England impacts remain forecast","summary":"CNN reports coastal flooding from the storm along the Mid-Atlantic, while the highest New England rain, wind and wave impacts are still forecast. The expected regional effects should not be mistaken for observed damage everywhere.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"CNN: storm report","url":"https://www.cnn.com/2026/09/24/weather/noreaster-coastal-storm-forecast-climate"},{"label":"The Washington Post forecast","url":"https://www.washingtonpost.com/weather/2026/09/24/track-where-potent-noreaster-will-bring-heavy-rain-winds-waves/"}]},{"id":"usa-usda-meat-recall","headline":"USDA recalls more than 167,000 pounds of meat produced without federal inspection","summary":"The Food Safety and Inspection Service says Star Meat Delivery recalled raw pork, beef and goat products that were produced without federal inspection. Check the agency’s recall notice for affected labels, lot details and handling instructions.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"USDA-FSIS recall notice","url":"https://www.fsis.usda.gov/recalls-alerts/star-meat-delivery-inc--recalls-raw-pork-beef-and-goat-products-produced-without"},{"label":"CNN: recall coverage","url":"https://www.cnn.com/2026/09/24/us/meat-recall-usda-star-meat-delivery-hnk"}]},{"id":"usa-ny-air-traffic-disruption","headline":"Air-traffic-control problems disrupt hundreds of flights at New York-area airports","summary":"AP reports disruptions involving flights at LaGuardia, Newark and JFK after air-traffic-control problems. Travelers should check directly with carriers and the FAA for current status; delays can change through the day.","sources":["Other"],"signal":"Watch","links":[{"label":"AP: flight disruptions","url":"https://apnews.com/article/faa-flights-laguardia-newark-jfk-airport-05e563809c8f954e175dfb93b9cf781d"}]},{"id":"usa-lincoln-sailor-mental-health","headline":"Navy says eight USS Lincoln carrier-group sailors attempted suicide during deployment","summary":"The Navy disclosed eight suicide attempts among sailors assigned to the USS Abraham Lincoln carrier group during deployment. The report raises questions about the strain of service; it does not identify individual sailors, and care resources are available through military and civilian crisis services.","sources":["Other"],"signal":"Watch","links":[{"label":"AP: Navy disclosure","url":"https://apnews.com/article/uss-lincoln-aircraft-carrier-suicide-attempts-iran-7bb8316aa4fd67e6d2c8b34c029eebda"}]},{"id":"usa-tiktok-alabama-trial","headline":"First U.S. state trial over TikTok’s alleged effect on teen mental health is set to begin Monday","summary":"Reuters reports an Alabama case will test claims that TikTok’s design harmed young users. The trial has not yet begun, and its allegations are not findings that the platform caused any particular injury.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: trial preview","url":"https://www.reuters.com/world/us/first-us-trial-against-tiktok-test-claims-platform-fueled-teen-mental-health-2026-09-25/"}]},{"id":"usa-kalshi-sixth-circuit-ruling","headline":"Appeals court says states may regulate Kalshi sports-event contracts under gambling laws","summary":"Reuters reports the 6th U.S. Circuit Court of Appeals ruled that Ohio and Tennessee gambling laws were not preempted by federal law and that Kalshi had not shown its sports-event contracts were swaps subject exclusively to Commodity Futures Trading Commission regulation. The ruling is a circuit-court decision; broader litigation and regulatory questions remain.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: 6th Circuit ruling","url":"https://www.reuters.com/business/finance/us-appeals-court-rules-against-kalshi-says-states-can-regulate-prediction-2026-09-25/"}]}],"world":[{"id":"world-ethiopia-tigray-fighting","headline":"Renewed fighting in Ethiopia’s Tigray region threatens the 2022 peace agreement","summary":"AP and Reuters report renewed clashes between federal forces and Tigrayan fighters, with former adversaries aligning against the federal government. The violence is fresh, but it does not mean the 2022 accord has formally collapsed {"id":"entertainment-taylor-swift-encore","headline":"Taylor Swift releases “The Life of a Showgirl: The Encore” and announces the “Patient Zero” video","summary":"Swift’s expanded release arrived Friday with additional songs; the “Patient Zero” music video is scheduled to premiere during Sunday’s VMAs. The album is out, while the video remains a future event.","sources":["Other"],"signal":"Consensus","links":[{"label":"AP: Swift release","url":"https://apnews.com/article/taylor-swift-new-music-patient-zero-934935f049893d0567713bea516f2c0c"},{"label":"Variety: album and video","url":"https://variety.com/2026/music/news/taylor-swift-reveals-life-of-showgirl-encore-new-songs-1236872982/"},{"label":"Variety: video details","url":"https://variety.com/2026/music/news/taylor-swift-patient-zero-music-video-dakota-johnson-colin-farrell-1236874206/"}]},{"id":"entertainment-different-world-netflix","headline":"Netflix’s “A Different World” sequel premieres with the original HBCU setting in focus","summary":"The sequel to the 1980s campus sitcom is available on Netflix Friday, bringing a new generation to the fictional Hillman College setting. The premiere is confirmed; audience response is not yet known.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"CNN: sequel premiere","url":"https://www.cnn.com/2026/09/24/entertainment/a-different-world-reboot-netflix"},{"label":"AP: sequel","url":"https://apnews.com/article/a-different-world-sequel-f0f23537d211e084dfb53999c3a4a367"}]},{"id":"entertainment-paramount-wbd-settlement-challenge","headline":"Merger opponents ask a court to reject Paramount’s settlement tied to its Warner Bros. bid","summary":"Variety reports opponents urged a court to reject a settlement connected to Paramount’s proposed Warner Bros. bid. The filing is an argument for the judge to consider; it is not a ruling on the merger or a completed acquisition.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety: court challenge","url":"h ran cancels Friday and Saturday Gillette Stadium shows as nor’easter approaches","summary":"Gillette Stadium and the promoter announced that Sheeran’s two Foxborough concerts scheduled for Sept. 25–26 were canceled because of the impending nor’easter. The venue says refunds are available through the point of purchase; no replacement dates were announced in the cited notice.","sources":["Other"],"signal":"Consensus","links":[{"label":"Gillette Stadium official cancellation notice","url":"https://www.gillettestadium.com/events/ed-sheeran-loop-tour/"},{"label":"NBC Boston/AP: cancellation report","url":"https://www.nbcboston.com/news/local/ed-sheeran-gillette-stadium-loop-tour/4020701/"}]}]},"researchNotes":["Fresh public-web research was conducted for the Friday, September 25, 2026, 4:00 p.m. EDT Boston edition. Fox News, CNN and the Drudge Report were compared at run time; direct articles and primary sources were checked where available, including Reuters and CNN on the Trump–Xi summit, Reuters on the Kyiv strikes and Colombia extradition, Reuters on the 6th Circuit ruling, and NOAA/NHC products on Hurricane Nolo.","The summit comparison distinguishes reporting from editorial selection: Reuters and CNN describe a visit ending with ceremony and limited public detail on trade, with key disputes unresolved; CNN reports an extension of the trade truce. Fox foregrounds symbolic diplomacy and security/Iran framing. Drudge’s front-page selection emphasizes mortgage and consumer anxieties, election/database disputes and summit backlash/political spectacle. Drudge is an aggregator, not independent confirmation.","NHC’s page at its 20:05 UTC update listed Hurricane Nolo; a tropical-cyclone update issued at 8:35 a.m. HST reported hurricane-hunter data showing 105-mph sustained winds (Category 2) and 978-mb pressure. Public Advisory 20A at 8:00 a.m. HST listed Hawaii County’s hurricane watch and tropical-storm warning, Maui County’s tropical-storm watch, and forecast rainfall of 10–15 inches in eastern/southern Big Island areas with locally 25 inches. These rainfall amounts are forecasts, not observed totals. The next routine forecast package was due at 11:00 a.m. HST (5:00 p.m. EDT), after this edition time.","Reuters reports seven deaths in Kyiv, including a 14-year-old, and separately reports ArcelorMittal’s decision not to restart its Kryvyi Rih facility after repeated strikes. Casualty reporting is attributed to local authorities; the plant decision is attributed to the company. No second independent article was found in the inspected results at refresh time.","Reuters reports three police sources said Colombia extradited an accused FARC dissident leader to the U.S.; the alleged drug-trafficking role remains an allegation. Reuters reports the 6th Circuit’s Kalshi decision concerning Ohio and Tennessee gambling laws; the decision is a circuit-court ruling, not a final nationwide resolution of all prediction-market questions.","Boston score check: official MLB and ESPN scoreboards confirm Thursday’s Guardians 1, Red Sox 0 and ESPN confirms Thursday’s Flyers 2, Bruins 0 preseason final. Patriots and Celtics did not play Thursday night. ESPN confirms Friday’s Red Sox–Cubs Game 1 ended Boston 4, Chicago 3; Game 2 and Bruins–Capitals were still scheduled later Friday at the 4 p.m. update. No later score is implied.","The Ed Sheeran cancellation is linked to the official Gillette Stadium notice and an NBC Boston/AP report. It is an entertainment event, not a Boston sports story.","All stories use unique IDs/headlines and include direct source links. Forecasts, allegations, attributed claims, legal rulings, plans and pending proceedings are distinguished from confirmed completed outcomes. Sports excludes Boston teams, auto racing and international soccer; Boston-area teams appear only in Boston Sports."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['world','World'],['politics','Politics'],['sports','Sports'],['boston','Boston Sports'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated in Top News.',world:'10 world stories not repeated in Top News.',sports:'No Boston teams, auto racing, or international soccer.',boston:'Boston teams and local sports only.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
</body></html>
