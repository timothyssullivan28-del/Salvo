<script id="briefing" type="application/json">{"date":"2026-09-28","lastUpdated":"September 28, 2026, 10:12:10 a.m. EDT Boston","dek":"Iran talks remain unresolved as floods threaten communities in Asia and the Northeast, and Hurricane Polo approaches Baja California.","take":"Fox’s live feed frames Trump’s rejection of Iran’s Hormuz proposal around renewed-strike risk; CNN reports Tehran is still awaiting a definitive answer and foregrounds the nor’easter’s human toll, while Drudge’s lead links to AP’s coastal-flooding report. Coverage converges on stalled diplomacy and continuing storm danger, but spotlights different risks: war and energy disruption versus immediate flood impacts. Drudge is an aggregator, not an independent reporting source.","sectionTakes":{"top":"Fox’s live feed frames Trump’s rejection of Iran’s Hormuz proposal around renewed-strike risk; CNN reports Tehran is still awaiting a definitive answer and foregrounds the nor’easter’s human toll, while Drudge’s lead links to AP’s coastal-flooding report. Coverage converges on stalled diplomacy and continuing storm danger, but spotlights different risks: war and energy disruption versus immediate flood impacts. Drudge is an aggregator, not an independent reporting source.","usa":"Monday’s Detroit shooting and taxpayer-funded campaign-ad report lead the domestic cards, while earlier cases have different evidentiary status: a jury verdict and appellate ruling are completed, but campus deaths and a homicide remain under investigation. Recall details, military mental-health reporting and settlement terms are attributed to their sources.","boston":"No game is scheduled Monday for the Red Sox, Patriots, Bruins or Celtics: Boston’s Sunday baseball and football finals were losses, while the Bruins’ season opener is upcoming Tuesday; Boston College’s 21–14 loss was Saturday. Celtics camp opens Tuesday, but the team has no Monday game.","business":"Friday, Sept. 25 close—the latest completed U.S. session: Dow +4 tions could follow this week, while Iranian officials say they await a formal response through mediators. The terms remain unresolved, with the key energy route still at risk.","sources":["Fox","CNN","Other"],"signal":"Split","links":[{"label":"Fox News live coverage","url":"https://www.foxnews.com/live-news/iran-war-strait-of-hormuz-donald-trump-09-27-26"},{"label":"CNN report","url":"https://www.cnn.com/2026/09/26/middleeast/trump-rejects-iran-proposal-hormuz-intl"},{"label":"AP live updates","url":"https://apnews.com/live/trump-midterm-elections-xi-china-news-updates-09-28-2026"},{"label":"Reuters report","url":"https://www.reuters.com/world/asia-pacific/iran-insists-diplomatic-solution-after-trump-rejects-peace-plan-2026-09-26/"}]},{"id":"top-noreaster-new-jersey-flooding","headline":"Nor’easter lingers over the Northeast as high tides sustain coastal flooding and outages","summary":"Monday updates from AP and CNN describe a slow-moving storm still bringing coastal flooding, with rain and wind easing in some areas while high tides and power disruptions continue. Death and injury figures are attributed to officials and emergency reports.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"AP News","url":"https://apnews.com/article/noreaster-storm-death-northeast-f4b86959733c021315e87ea1ed58459b"},{"label":"CNN storm update","url":"https://www.cnn.com/2026/09/26/weather/live-news/noreaster-weekend-storm"}]},{"id":"top-hurricane-polo-mexico","headline":"Hurricane Polo threatens Baja California with dangerous wind and flooding, forecasters warn","summary":"The National Hurricane Center and AP forecast Polo nearing Baja California on Monday, with damaging winds, storm surge and heavy rain possible. Forecasts can change; residents should follow current official advisories.","sources":["Other"],"signal":"Watch","links":[{"label":"AP News forecast","url":"https://apnews.com/article/hurricane-polo-nolo-mexico-hawaii-baja-california-6b5958cfb0e5f5c7ebbd14065a863d90"},{"label":"National Hurricane Center advisory","url":"https://www.nhc.noaa.gov/mobile/text/refresh/MIATCDEP2+html/280854.shtml"}]},{"id":"top-netanyahu-abu-dhabi-visit","headline":"Israeli official says Netanyahu made an undisclosed weekend visit to Abu Dhabi","summary":"A senior Israeli official told Reuters that Prime Minister Benjamin Netanyahu met UAE President Sheikh Mohammed bin Zayed in Abu Dhabi on Sunday. The trip was unannounced; the report confirms the meeting but does not describe a concluded agreement.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters","url":"https://www.reuters.com/world/middle-east/israels-netanyahu-visited-abu-dhabi-sunday-israeli-official-says-2026-09-27/"},{"label":"AP News live updates","url":"https://apnews.com/live/trump-midterm-elections-xi-china-news-updates-09-28-2026"}]},{"id":"top-fairford-base-arrests","headline":"Five men arrested near RAF Fairford in suspected terror probe; any Iran link remains unconfirmed","summary":"British police arrested five men near a U.S.-used air base on suspicion of terrorism and explosives offenses. Authorities have not established a motive or an Iran connection; the investigation is ongoing.","sources":["Fox","CNN","Other"],"signal":"Watch","links":[{"label":"AP News","url":"https://apnews.com/article/britain-explosives-us-air-base-fairford-49495441036e78763e106bbeadd1e839"},{"label":"Fox News live coverage","url":"https://www.foxnews.com/live-news/iran-war-strait-of-hormuz-donald-trump-09-27-26"},{"label":"CNN eyewitness report","url":"https://www.cnn.com/2026/09/28/world/video/eyewitness-talks-to-cnn-about-raf-terror-plot-intldsk"}]},{"id":"top-trump-xi-summit","headline":"U.S. and China announce reciprocal tariff cuts covering $60 billion in goods","summary":"CNN reports the two governments released reciprocal product lists after the leaders’ meeting, covering $60 billion in trade. The announcement is distinct from implementation, whose timing and terms will determine the practical effect.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"CNN report","url":"https://www.cnn.com/2026/09/28/business/us-china-tariff-cuts-60-billion-intl"},{"label":"AP News live updates","url":"https://apnews.com/live/trump-midterm-elections-xi-china-news-updates-09-28-2026"}]},{"id":"top-south-africa-twin-shootings","headline":"South African authorities raise weekend mass-shooting death toll to 28","summary":"Authorities raised the combined death toll from two weekend mass shootings near Johannesburg and Cape Town to 28 on Monday; police separately reported 18 deaths in the tavern attack near Johannesburg. Investigations continue, and the totals remain official counts.","sources":["Other"],"signal":"Watch","links":[{"label":"AP News","url":"https://www.winnipegfreepress.com/world/2026/09/28/south-africas-death-toll-from-weekend-mass-shootings-rises-to-28-after-another-victim-dies"},{"label":"Reuters on the tavern shooting","url":"https://www.reuters.com/world/africa/south-african-police-death-toll-weekend-tavern-shooting-rises-18-2026-09-28/"}]},{"id":"top-bangkok-flood-disaster-zone","headline":"Thailand floods leave more than 580,000 homes affected as Bangkok residents shelter","summary":"Reuters reports residents wading through deep water and thousands sheltering in Bangkok; Thai authorities say flooding since Sept. 16 has killed at least eight people and disrupted more than 580,000 homes. The casualty count is official and the damage estimate remains an estimate.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters","url":"https://www.reuters.com/business/environment/thousands-huddle-bangkok-shelters-thai-flood-damages-seen-320-mln-2026-09-28/"},{"label":"AP News update","url":"https://apnews.com/article/thailand-rain-floods-bangkok-airport-7a58485fa6f04454e0292aa30a2834e1"}]},{"id":"top-russia-attacks-ukraine-sept27","headline":"Russian drone strike hits Kyiv science academy; local authorities report at least one death","summary":"Reuters reports Russian jet-drones struck across Ukraine on Monday, including Kyiv’s National Academy of Sciences, where local authorities said at least one person was killed. The casualty figure is attributed to Ukrainian authorities.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters","url":"https://www.reuters.com/world/europe/kyiv-science-academy-hit-russian-jet-drones-strike-across-ukraine-2026-09-28/"}]},{"id":"top-india-floods-uttar-pradesh","headline":"Officials say at least 62 people died in heavy rain and flooding in northern India","summary":"The Associated Press reports days of rain and flooding in Uttar Pradesh have killed at least 62 people, according to officials. Rescue and damage reporting is continuing.","sources":["Other"],"signal":"Watch","links":[{"label":"AP News","url":"https://apnews.com/article/india-uttar-pradesh-floods-bb581ea0f9fde75a5f99a7f0d5d5dd25"},{"label":"Associated Press report","url":"https://www.the-journal.com/articles/associated-press/heavy-rain-and-flooding-kill-at-least-62-in-northern-india/"}]}],"usa":[{"id":"usa-pittsburgh-doctor-killed","headline":"Pittsburgh pediatrician Idris Evans is killed in a home attack; his wife is critically injured, officials say","summary":"Police say a man entered the home and stabbed Evans and his wife while they slept; the suspect was detained. The investigation is ongoing, and the attack account is attributed to law enforcement.","sources":["CNN","Fox","Other"],"signal":"Consensus","links":[{"label":"CNN: Pittsburgh investigation","url":"https://www.cnn.com/2026/09/25/us/pittsburgh-doctor-idris-evans-stabbing-home"},{"label":"PennLive: local report","url":"https://www.pennlive.com/crime/2026/09/upmc-childrens-hospital-physician-killed-in-stabbing-suspect-detained.html"}]},{"id":"usa-copenhaver-death","headline":"James Copenhaver, wounded in the 2024 Butler rally shooting, dies from injury complications","summary":"Copenhaver, 76, was one of two people wounded when a gunman opened fire at then-candidate Donald Trump’s Pennsylvania rally in July 2024. His lawyer said he died from complications related to those injuries; the death brings renewed attention to the attack’s victims.","sources":["Fox","Other"],"signal":"Consensus","links":[{"label":"AP: Copenhaver’s death","url":"https://apnews.com/article/james-copenhaver-trump-rally-butler-dies-00866b37ad8db967b4ebf6582c756bcd"},{"label":"CBS Pittsburgh","url":"https://www.cbsnews.com/pittsburgh/news/jim-copenhaver-trump-rally-assassination-attempt-victim-dies/"},{"label":"Fox News","url":"https://www.foxnews.com/politics/james-copenhaver-man-shot-trump-butler-rally-dies-complications-from-injuries-report"}]},{"id":"usa-ole-miss-deaths","headline":"Two Ole Miss student deaths remain under investigation; kratom found at the scene does not establish a cause","summary":"Authorities are investigating the deaths of two students, and reporting says kratom was found at the scene. Investigators have not established that the substance caused either death; the cases remain under investigation.","sources":["CNN","Fox","Other"],"signal":"Watch","links":[{"label":"AP: deaths and kratom","url":"https://apnews.com/article/kratom-mississippi-deaths-students-5c4d6429e65b573b2667119a8f860ddb"},{"label":"CNN: Ole Miss deaths","url":"https://www.cnn.com/2026/09/24/us/ole-miss-student-deaths-wwk"},{"label":"Fox News","url":"https://www.foxnews.com/us/ole-miss-victim-identified-narcotics-task-force-probes-two-student-deaths"}]},{"id":"usa-usda-meat-recall","headline":"USDA recalls more than 167,000 pounds of meat produced without federal inspection","summary":"The Food Safety and Inspection Service says Star Meat Delivery recalled raw pork, beef and goat products that were produced without federal inspection. Check the agency’s recall notice for affected labels, lot details and handling instructions.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"USDA-FSIS recall notice","url":"https://www.fsis.usda.gov/recalls-alerts/star-meat-delivery-inc--recalls-raw-pork-beef-and-goat-products-produced-without"},{"label":"CNN: recall coverage","url":"https://www.cnn.com/2026/09/24/us/meat-recall-usda-star-meat-delivery-hnk"}]},{"id":"usa-meta-cambridge-analytica-jury","headline":"New Mexico jury finds Meta misled users about Facebook data practices in Cambridge Analytica case","summary":"A Santa Fe jury found 26 of 29 statements identified by New Mexico to be misleading, including statements about data practices, hate speech and misinformation; it rejected some other claims. The verdict concerns a state case arising from the Cambridge Analytica scandal. A judge will determine civil penalties, so the verdict is not a final damages award or a finding that Facebook sold every user’s data.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: jury verdict","url":"https://www.reuters.com/business/meta-misled-consumers-case-over-cambridge-analytica-scandal-new-mexico-jury-says-2026-09-25/"},{"label":"AP: case background and trial","url":"https://apnews.com/article/facebook-meta-new-mexico-privacy-lawsuit-8b414eb0a14d58d7cdc6ae752e25dcb0"}]},{"id":"usa-lincoln-sailor-mental-health","headline":"Navy says eight USS Lincoln carrier-group sailors attempted suicide during deployment","summary":"The Navy disclosed eight suicide attempts among sailors assigned to the USS Abraham Lincoln carrier group during deployment. The report raises questions about the strain of service; it does not identify individual sailors, and care resources are available through military and civilian crisis services.","sources":["Other"],"signal":"Watch","links":[{"label":"AP: Navy disclosure","url":"https://apnews.com/article/uss-lincoln-aircraft-carrier-suicide-attempts-iran-7bb8316aa4fd67e6d2c8b34c029eebda"}]},{"id":"usa-tiktok-alabama-settlement","headline":"TikTok settles Alabama’s teen-harm lawsuit on eve of the first state trial over the claims","summary":"Reuters reports TikTok and ByteDance reached a settlement with Alabama over allegations that the platform was designed to addict children and that the companies misled consumers about safety. The Alabama attorney general’s office says the state will receive at least $100 million within 45 days, with potential payments up to $300 million if conditions are met. This is a settlement before trial, not a court finding that every allegation was proven.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Alabama settlement and terms","url":"https://www.reuters.com/world/us/tiktok-settles-with-alabama-ahead-first-state-trial-over-claims-teen-harms-2026-09-25/"}]},{"id":"usa-kalshi-sixth-circuit-ruling","headline":"Appeals court says states may regulate Kalshi sports-event contracts under gambling laws","summary":"Reuters reports the 6th U.S. Circuit Court of Appeals ruled that Ohio and Tennessee gambling laws were not preempted by federal law and that Kalshi had not shown its sports-event contracts were swaps subject exclusively to Commodity Futures Trading Commission regulation. The ruling is a circuit-court decision; broader litigation and regulatory questions remain.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: 6th Circuit ruling","url":"https://www.reuters.com/business/finance/us-appeals-court-rules-against-kalshi-says-states-can-regulate-prediction-2026-09-25/"}]},{"id":"usa-detroit-after-hours-shooting","headline":"Three people killed and four injured in Detroit after-hours shooting, police say","summary":"Police said an argument preceded Sunday morning’s shooting at an after-hours club. The investigation is ongoing; the casualty figures are attributed to authorities.","sources":["Other"],"signal":"Watch","links":[{"label":"AP News","url":"https://apnews.com/article/shooting-crime-detroit-ef32bed9c42cdd6e1e2fc3ade37cca3b"},{"label":"CBS News","url":"https://www.cbsnews.com/news/detroit-after-hours-club-shooting-september-27-2026/"}]},{"id":"usa  yet occurred.","sources":["Other"],"signal":"Watch","links":[{"label":"AP: tour announcement","url":"https://apnews.com/article/macklemore-free-palestine-shows-ed-sheeran-65a65a362e530dfe739ddb626dc16d23"},{"label":"Variety: tour details","url":"https://variety.com/2026/music/news/macklemore-free-palestine-tour-1236874352/"}]},{"id":"entertainment-dolly-9-to-5-restoration","headline":"Restored “9 to 5” returns to U.S. theaters Oct. 9–15, with proceeds supporting Dolly Parton’s foundation","summary":"Deadline reports 20th Century Studios will bring the newly restored 1980 comedy starring Dolly Parton, Jane Fonda and Lily Tomlin back to theaters for a one-week run beginning Oct. 9. Disney says net proceeds from U.S. ticket sales will benefit the Dollywood Foundation; screenings are upcoming, not underway.","links":[{"label":"Deadline: restored “9 to 5” theatrical run and charity","url":"https://deadline.com/2026/09/9-to-5-return-screening-dolly-parton-charity-1237113711/"},{"label":"Fox 59: Oct. 9–15 theatrical dates","url":"https://fox59.com/news/national-world/dolly-partons-classic-9-to-5-returning-to-theaters-for-limited-run/"}],"signal":"Watch","sources":["Other"]},{"id":"entertainment-ed-sheeran-gillette-canceled","headline":"Ed Sheeran cancels Friday and Saturday Gillette Stadium shows as nor’easter approaches","summary":"Gillette Stadium and the promoter announced that Ed Sheeran’s Foxborough shows scheduled for Sept. 25–26 were canceled because of the nor’easter. The venue’s notice says refunds are available through the point of purchase; no replacement dates were announced in the cited notice.","sources":["Other"],"signal":"Consensus","links":[{"label":"Gillette Stadium official cancellation notice","url":"https://www.gillettestadium.com/events/ed-sheeran-loop-tour/"},{"label":"NBC Boston/AP: cancellation report","url":"https://www.nbcboston.com/news/local/ed-sheeran-gillette-stadium-loop-tour/4020701/"}]},{"id":"entertainment-vmas-results","headline":"Taylor Swift wins three VMAs including Video of the Year; Madonna leads the night with seven awards","summary":"Taylor Swift’s “The Fate of Ophelia” won Video of the Year at Sunday’s MTV VMAs; Swift collected three trophies, dedicated the top award to Dolly Parton and reached 33 career VMAs. Madonna led the night with seven wins, according to Reuters’ results report.","sources":["Other"],"signal":"Consensus","links":[{"label":"Reuters: Taylor Swift makes VMAs history and dedicates award to Dolly Parton (Sept. 28)","url":"https://www.reuters.com/business/media-telecom/madonna-sabrina-carpenter-lisa-win-mtvs-video-music-awards-2026-09-28/"},{"label":"The Hollywood Reporter: full 2026 VMAs winners list","url":"https://www.hollywoodreporter.com/lists/mtv-vmas-2026-winners-list/"}]}]},"researchNotes":["Edition refreshed Monday, Sept. 28, 2026, at September 28, 2026, 10:12:10 a.m. EDT Boston using fresh public-web research. Fox News, CNN and Drudge were compared; Drudge is treated as a headline aggregator, not an independent reporting source.","Monday Boston checks: no Red Sox, Patriots, Bruins or Celtics game scheduled on Sept. 28. Sunday finals: Cubs 6–2 Red Sox and Jaguars 35–6 Patriots; BC lost 21–14 Saturday. The Red Sox play AL Wild Card Game 1 at the Yankees Tuesday Sept. 29 at 8 p.m. EDT; Bruins open Tuesday Sept. 29 at 8 p.m.; Patriots visit Buffalo Sunday Oct. 4 at 1 p.m.; Celtics camp opens Tuesday Sept. 29.","Latest completed U.S. session is Friday, Sept. 25, 2026: Dow +478.64 points (+0.93%) to 51,828.62; Nasdaq +129.34 (+0.48%) to 27,068.72 (AP, CNBC and Reuters cross-check). Monday is a regular trading day; Reuters reported opening losses of 180.1 Dow points (0.35%) and 133.0 Nasdaq points (0.49%), not a close.","Attributed official casualty counts, forecasts, allegations, court actions, analyst outlooks, and proposed/planned projects remain distinguished from independently confirmed outcomes. Older World reports are dated in the headlines."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'Boston-area professional and major-college sports only.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, or international soccer.',business:'7 unique business/markets stories; close figures refer to the latest completed U.S. session.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
