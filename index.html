ves and AP confirms closing levels and point changes, while CNN’s market table cross-checks percentages. Stocks rose after weak payrolls reduced near-term rate-hike bets, but the Dow fell for the week; no weekend trading is implied.","world":"Saturday’s sharpest international updates are Russian strikes on Kyiv bridges and a late report that Yemen’s government-aligned forces say they are striking Houthis in Sanaa. North Korea’s missile account and claims about the Oman tanker and other conflict events remain attributed, while the wider regional and security stories carry separate caveats.","sports":"Official MLB results confirm 3–0 and 5–3 Division Series openers; Alabama, Iowa and Notre Dame also posted Saturday football wins. The remaining cards cover the WNBA, NFL discipline and roster news, excluding Boston teams, auto racing and international soccer.","politics":"A late Reuters report says the White House formed an AI task force led by Jay Clayton, while the Ohio campaign appearance and the Cotton daylight-saving dispute add midterm and policy friction. Proposed rules, campaign narratives and pending litigation are not final outcomes.","entertainment":"Friday’s preliminary box-office estimates put Digger behind Verity; weekend totals remain subject to revision. The other cards cover a conditional Paramount–Warner transaction, Disney licensing and layoffs, Peacock programming, Warner executive plans and Miranda Lambert’s album."},"sections":{"top":[{"id":"top-odesa-cargo-ship-strike-oct3","headline":"Oct. 3: Russian attack hits cargo ship in Ukraine’s Odesa port, killing one, Ukraine says","summary":"Ukraine’s seaports administration said a Russian attack struck a Liberian-flagged cargo ship at a Black Sea port in Odesa, killing one person, injuring three and prompting evacuation of 13 others. Reuters attributes the toll to the Ukrainian agency; the report describes the port strike and its consequences, not an independently verified casualty count.","sources":[" for Jed York, Oct. 2","url":"https://www.nbcnews.com/news/us-news/49ers-owner-jed-york-suspended-six-games-ohio-arrest-rcna601188"},{"label":"AP report — York suspended and fined, Oct. 2","url":"https://bleacherreport.com/articles/25505913-49ers-owner-jed-york-suspended-for-6-games-after-his-arrest-prostitution-sting"}]},{"id":"sports-joey-porter-dallas-trade-oct3","headline":"Oct. 1 trade update: Cowboys acquire cornerback Joey Porter Jr. from Steelers","summary":"Dallas acquired Porter after contract negotiations stalled, with Pittsburgh receiving a second- and sixth-round pick, the NFL reports. The 26-year-old is expected to join the Cowboys’ secondary; trade impact will depend on his health and performance.","sources":["Other"],"signal":"Watch","links":[{"label":"NFL — official trade report and terms","url":"https://www.nfl.com/news/steelers-trading-cb-joey-porter-jr-to-cowboys-in-exchange-for-second-sixth-round-picks"},{"label":"The Athletic — Porter trade and Sunday outlook, Oct. 3","url":"https://www.nytimes.com/athletic/7654156/2026/10/03/nfl-insider-joey-porter-jr-trade-puka-nacua-jayden-daniels/"}]},{"id":"sports-capitals-tuch-debut-oct3","headline":"Oct. 3: Alex Tuch scores twice in Capitals debut as defending champion Carolina loses again","summary":"Reuters’ NHL roundup says Tuch scored two goals in his Washington debut as the Capitals handed the Hurricanes their second straight loss. The early-season result is a notable rematch, not a playoff elimination or a change in standings leadership.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — NHL roundup: Tuch and Capitals beat Hurricanes, Oct. 3","url":"https://www.reuters.com/sports/nhl-roundup-alex-tuch-caps-send-champ-hurricanes-2nd-straight-loss--flm-2026-10-03/"}]},{"id":"sports-ravens-hendrickson-out-oct3","headline":"Oct. 2: Ravens edge rusher Trey Hendrickson to miss Sunday after finger procedure","summary":"Baltimore said Hendrickson will not play against Tennessee after undergoing a procedure on his finger, AP reports. The team has not provided a return date in the report, and his absence is limited to the upcoming game unless updated.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — Ravens’ Hendrickson to miss Titans game, Oct. 2","url":"https://www.westernslopenow.com/sports/ap-ravens-trey-hendrickson-to-miss-game-against-titans-after-having-a-procedure-on-his-finger/"}]}],"politics":[{"id":"politics-trump-ai-safeguards-oct3","headline":"Oct. 3, 6:46 p.m. EDT: Reuters says Trump tapped Jay Clayton to lead AI task force, citing WSJ","summary":"Reuters reported, citing the Wall Street Journal, that the White House created a task force led by SEC Chair Jay Clayton to assess AI risks and opportunities and recommend the federal government’s role, with a report due in 120 days. This is a review process, not a new regulation; Reuters earlier described the administration’s reliance on voluntary safeguards.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — Jay Clayton to lead AI task force, citing WSJ, Oct. 3, 6:46 p.m. EDT","url":"https://www.reuters.com/world/us/jay-clayton-lead-trumps-ai-task-force-deliver-report-120-days-wsj-reports-2026-10-03/"},{"label":"Reuters — Trump sticks with voluntary AI safeguards, Oct. 3","url":"https://www.reuters.com/legal/litigation/public-fears-ai-grow-trump-digs-voluntary-safeguards-2026-10-03/"}]},{"id":"politics-trump-cotton-phone-post-oct3","headline":"Oct. 3: Trump posts Sen. Tom Cotton’s number amid daylight-saving bill dispute, CNN reports","summary":"CNN reports President Trump criticized Republican Sen. Tom Cotton in a series of Saturday posts and accused him of holding up a daylight-saving bill. The dispute does not establish that Cotton alone controls the bill’s prospects, and Congress has not enacted the change.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"CNN — Trump and Cotton clash over daylight-saving bill, Oct. 3","url":"https://www.cnn.com/2026/10/03/politics/trump-tom-cotton-phone-number-daylight-saving"},{"label":"Fox News — Trump posts senator’s phone number, Oct. 3","url":"https://www.foxnews.com/politics/trump-drops-republican-senators-phone-number-social-post-fury-stalled-bill"}]},{"id":"politics-trump-ohio-rally-senate-race-oct3","headline":"Oct. 3 update: Trump rallies for Sen. Jon Husted in a competitive Ohio race against Sherrod Brown","summary":"The Associated Press reported Saturday that Trump rallied in Ohio to boost Republican Sen. Jon Husted against Democrat Sherrod Brown, one of several competitive Senate contests. The campaign appearance is not evidence of an election outcome; Reuters had previewed the rally and described economic pressure on the race.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — Trump rallies in Ohio for Jon Husted, Oct. 3","url":"https://apnews.com/article/trump-ohio-husted-brown-senate-f1ae89feb3eccd7d8eb49e1c2e14f6dd"},{"label":"Reuters — Trump campaigns in Ohio as GOP defends Senate seat, Oct. 3","url":"https://www.reuters.com/world/us/trump-speak-ohio-rally-republicans-defend-senate-seat-close-race-2026-10-03/"}]},{"id":"politics-gop-senate-funds-kansas-oct3","headline":"Oct. 2: Senate GOP campaign group shifts resources from North Carolina to Kansas","summary":"The Senate Republicans’ main campaign-spending group is redirecting money toward Kansas while reducing its planned spending in North Carolina, AP reports. The tactical move is not proof either race is safe, and November results remain uncertain.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — Senate GOP redirects spending to Kansas, Oct. 2","url":"https://apnews.com/article/senate-republicans-campaign-spending-kansas-north-carolina-72a0a3ff32c3626396f72ba77dc0264f"}]},{"id":"politics-fbi-patel-report-oct3","headline":"Oct. 3: FBI commissions classified internal “Patel Report” on where agency fell short, AP reports","summary":"AP reports the FBI commissioned a classified internal review, called the “Patel Report,” examining instances when the bureau fell short. The report’s scope and findings are not publicly established in the available account; its commissioning is not itself proof of misconduct or completed conclusions.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — FBI commissions classified internal “Patel Report,” Oct. 3","url":"https://apnews.com/article/fbi-kash-patel-report-trump-cbae3feb679d826d8b409fbc142d1581"}]},{"id":"politics-epa-power-plant-lawsuit-oct3","headline":"Oct. 1: New York leads 25 states and cities challenging EPA power-plant rule repeal","summary":"The coalition argues the EPA failed to account for alternative approaches and health and climate costs when it repealed 2024 greenhouse-gas limits. The suit begins litigation and is not a court decision on the agency’s authority or the rule’s future.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — states challenge EPA power-plant repeal, Oct. 1","url":"https://www.reuters.com/legal/litigation/new-york-20-states-sue-epa-block-power-plant-carbon-rule-repeal-2026-10-01/"}]},{"id":"politics-kennedy-center-proposal-oct3","headline":"Oct. 2: Bipartisan lawmakers move to block demolition of the Kennedy Center","summary":"Members of both parties introduced a measure aimed at preventing demolition of the arts institution, Reuters reports. The proposal has not become law and does not resolve separate governance and legal disputes around the center.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — bipartisan bid to block Kennedy Center demolition, Oct. 2","url":"https://www.reuters.com/legal/government/bipartisan-members-congress-move-block-demolition-kennedy-center-2026-10-02/"}]}],"entertainment":[{"id":"entertainment-skydance-merger-name-oct3","headline":"Oct. 2–3: Proposed Paramount–Warner company would use Skydance name and bundle, not merge, streamers","summary":"If the Paramount Skydance–Warner Bros. Discovery merger closes, David Ellison says the combined company would use the Skydance name; Deadline reports HBO Max and Paramount+ would remain separate but be sold in a bundle. Both are attributed plans contingent on a transaction that has not closed, not finalized customer terms.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — proposed name for combined company, Oct. 2","url":"https://www.reuters.com/legal/transactional/david-ellison-says-combined-paramount-warner-bros-discovery-will-be-named-2026-10-02/"},{"label":"Variety — name announcement, Oct. 2","url":"https://variety.com/2026/tv/news/name-of-paramount-warner-bros-unveiled-skydance-1236893761/"},{"label":"Deadline — reported HBO Max/Paramount+ bundle plan, Oct. 3","url":"https://deadline.com/2026/10/skydance-hbo-max-paramount-streaming-bundle-1237145362/"}]},{"id":"entertainment-warner-film-execs-exit-oct3","headline":"Oct. 2: Warner Bros. film chiefs reportedly expected to leave if Paramount deal closes","summary":"The Hollywood Reporter and TheWrap say Michael De Luca and Pamela Abdy are expected to exit after the Paramount Skydance merger closes. The transaction has not closed, so departure timing and their next roles remain contingent and attributed to trade reporting.","sources":["Other"],"signal":"Watch","links":[{"label":"The Hollywood Reporter — Warner Bros. film chiefs’ expected exit, Oct. 2","url":"https://www.hollywoodreporter.com/movies/movie-news/michael-de-luca-pamela-abdy-warner-bros-1236720848/"},{"label":"Deadline — De Luca and Abdy’s reported next steps","url":"https://deadline.com/2026/10/michael-de-luca-pamela-abdy-exit-warner-bros-paramount-merger-1237145206/"}]},{"id":"entertainment-disney-netflix-licensing-oct3","headline":"Oct. 2: Disney licenses titles including “Ice Age,” “Felicity” and “Elio” to Netflix","summary":"Variety reports Disney licensed a slate of films and series to Netflix, including all five Ice Age movies, Elio, Felicity, Will Trent and Percy Jackson and the Olympians. The agreement expands Netflix’s catalog but does not transfer ownership of the titles or signal a Disney streaming exit.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — Disney licenses titles to Netflix, Oct. 2","url":"https://variety.com/2026/tv/news/disney-licenses-titles-netflix-ice-age-movies-will-trent-percy-jackson-and-the-olympians-felicity-1236897256/"}]},{"id":"entertainment-disney-layoffs-oct3","headline":"Oct. 3: Disney president calls layoffs “extremely painful” but necessary","summary":"Disney president Dana Walden defended recent job reductions as painful but necessary in remarks reported by Yahoo Finance. The comments describe management’s rationale, not a new headcount figure or evidence that further layoffs are complete.","sources":["Other"],"signal":"Watch","links":[{"label":"Yahoo Finance — Disney president on layoffs, Oct. 3","url":"https://finance.yahoo.com/media-advertising/articles/disney-president-says-layoffs-extremely-094448360.html"}]},{"id":"entertainment-fast-furious-peacock-order-oct3","headline":"Oct. 2: Peacock orders “Fast & Furious” television adaptation","summary":"Variety reports Peacock has formally ordered a series based on the franchise and is targeting a 2028 premiere. That is a series order and target window, not a released program or a fixed launch date.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — Peacock orders “Fast & Furious” series, Oct. 2","url":"https://au.variety.com/2026/tv/news/fast-furious-tv-show-peacock-2028-40935/"}]},{"id":"entertainment-digger-boxoffice-oct3","headline":"Oct. 3: “Digger” earns $3.4 million on opening day as “Verity” leads Friday box office, Variety reports","summary":"Variety’s Oct. 3 report says Tom Cruise’s Digger earned about $3.4 million Friday, including previews, while Verity led Friday with $15.1 million. These are early daily figures; weekend totals, final performance and profitability remain unsettled.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — Friday box office, Oct. 3","url":"https://variety.com/2026/film/box-office/box-office-digger-verity-resident-evil-primetime-1236895074/"},{"label":"Forbes — early Digger opening projections, Oct. 2","url":"https://www.forbes.com/sites/timlammers/2026/10/02/digger-tom-cruise-film-eyes-dismal-10-million-opening-weekend-at-box-office/"}]},{"id":"entertainment-miranda-lambert-album-oct3","headline":"Oct. 3: Miranda Lambert returns with country-disco album “Crisco,” AP reports","summary":"AP’s Oct. 3 music feature profiles Miranda Lambert’s new album “Crisco,” describing its country-disco direction and quoting the singer on its joyful tone. The coverage is an artist/album feature, not a claim about chart performance or a confirmed release-week sales result.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — Miranda Lambert returns with “Crisco,” Oct. 3","url":"https://apnews.com/article/miranda-lambert-crisco-670c88368e68e3f62ede48edf93e5177"}]}]},"researchNotes":["Freshly checked Fox live coverage, CNN headline pages and Drudge Report for current framing; Drudge links to other reporting and is treated as an aggregator, not an independent source.","Late verified updates include Reuters reporting at 6:40 p.m. EDT on Yemen strikes, 6:13 p.m. EDT on North Korea’s missile announcement, and 6:46 p.m. EDT on a new AI task force; the latter cites the Wall Street Journal. Reuters updated its Riyadh fire story to include a Houthi claim, which Saudi authorities had not confirmed.","Rechecked Boston Globe sports headlines, WEEI/Audacy, NHL Gamecenter, MLB, Patriots, Red Sox and Celtics schedules. Boston Globe pages expose current headlines but some full stories are paywalled; WEEI page extraction returned mostly schedule/navigation rather than full article text.","At the status check, Bruins–Wild remained scheduled for 8:00 p.m. EDT with official NHL pregame listing; Red Sox, Patriots and Celtics had no Saturday game. No Bruins live score was reported.","Saturday cash markets were closed; Friday, Oct. 2 was the latest completed U.S. session. Reuters exact closes/moves were cross-checked against CNN’s market table; no live or premarket snapshot was used.","Official MLB scores showed completed 3–0 White Sox and 5–3 Dodgers postseason wins; only finals are included in the general Sports result card."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, or international soccer.',business:'7 unique business/markets stories; on trading days at 7 a.m. show timestamped indicative Dow and Nasdaq-100 futures, clearly not cash indexes; on weekends and market holidays state cash markets are closed and show no live/premarket snapshot, while identifying the latest completed session. At 10 a.m. and 1 p.m. on trading days show timestamped Dow and Nasdaq Composite cash-index levels, point and percentage moves, and any provider delay; at 4 p.m. show timestamped closing moves as confirmed or clearly preliminary; at 7 p.m. use confirmed closes.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
