: Bipartisan lawmakers move to block proposed Kennedy Center demolition","summary":"Members of both parties introduced legislation seeking to prevent demolition of the Kennedy Center, Reuters reports. The proposal must advance through Congress; no final disposition has been reached.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — lawmakers seek to block Kennedy Center demolition, Oct. 2","url":"https://www.reuters.com/legal/government/bipartisan-members-congress-move-block-demolition-kennedy-center-2026-10-02/"}]}],"entertainment":[{"id":"entertainment-digger-boxoffice-oct5","headline":"Oct. 5 weekend estimates: “Verity” leads near $32.7M; “Digger” opens around $8M","summary":"Sunday estimates put “Verity” around $32.7 million and “Digger” around $8 million, Deadline reported. Monday studio estimates may revise totals; these are not final audited grosses.","sources":["Other"],"signal":"Watch","links":[{"label":"Deadline — weekend box-office estimates, Oct. 4","url":"https://deadline.com/2026/10/box-office-verity-digger-1237145435/"}]},{"id":"entertainment-paramount-warner-settlement-oct4","headline":"Oct. 4: Judge approves Paramount settlement with states in Warner takeover case","summary":"A federal judge approved Paramount’s settlement with states, removing a legal hurdle to its proposed Warner Bros. Discovery purchase, AP reports. The merger is still pending and had not closed at the time of the report.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — judge approves Paramount settlement, Oct. 4","url":"https://apnews.com/article/paramount-warner-bros-discovery-takeover-f30a8a9a4d26393177bc1af5bff1e990"}]},{"id":"entertainment-taylor-swift-snl-cameo-oct3","headline":"Oct. 3: Taylor Swift surprises viewers with cameo in Dakota Johnson’s SNL monologue","summary":"Swift appeared during Johnson’s opening monologue on Saturday Night Live, Variety reports, drawing attention during the live broadcast. The cameo was a one-time appearance, not an announced series role.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — Taylor Swift’s SNL cameo, Oct. 3","url":"https://variety.com/2026/music/news/taylor-swift-snl-cameo-dakota-johnson-saturday-night-live-1236898411/"}]},{"id":"entertainment-warner-film-execs-conditional-oct2","headline":"Oct. 2 report: Warner Bros. film chiefs expected to depart if Paramount deal closes","summary":"The Hollywood Reporter says film executives Michael De Luca and Pamela Abdy are expected to leave if Paramount’s proposed acquisition closes. Their departure is reported as conditional; the transaction remains pending.","sources":["Other"],"signal":"Watch","links":[{"label":"The Hollywood Reporter — Warner film executives’ reported plans, Oct. 2","url":"https://www.hollywoodreporter.com/movies/movie-news/michael-de-luca-pamela-abdy-warner-bros-1236720848/"}]},{"id":"entertainment-disney-netflix-licensing-oct2","headline":"Oct. 2: Disney licenses a slate of films and series to Netflix","summary":"Disney licensed titles including “Ice Age,” “Felicity” and “Elio” to Netflix, Variety reports, as the companies expand third-party distribution. The licensing agreement concerns selected titles, not a sale of Disney’s platforms.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — Disney licenses titles to Netflix, Oct. 2","url":"https://variety.com/2026/tv/news/disney-licenses-titles-netflix-ice-age-movies-will-trent-percy-jackson-and-the-olympians-felicity-1236897256/"}]},{"id":"entertainment-disney-layoffs-oct3","headline":"Oct. 3: Disney president calls layoffs “extremely painful” but necessary","summary":"Disney’s president described recent cuts as painful but required as the company restructures, in remarks reported by Yahoo Finance. The comments explain management’s view but do not quantify additional planned layoffs.","sources":["Other"],"signal":"Watch","links":[{"label":"Yahoo Finance — Disney president comments on layoffs, Oct. 3","url":"https://finance.yahoo.com/media-advertising/articles/disney-president-says-layoffs-extremely-094448360.html"}]},{"id":"entertainment-fast-furious-peacock-oct2","headline":"Oct. 2: Peacock orders a “Fast & Furious” television adaptation","summary":"Peacock ordered a TV adaptation of the “Fast & Furious” franchise, Variety reports, extending the film property into streaming. The report does not provide a confirmed release date beyond a planned 2028 window.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — Peacock orders “Fast & Furious” series, Oct. 2","url":"https://au.variety.com/2026/tv/news/fast-furious-tv-show-peacock-2028-40935/"}]}]},"researchNotes":["Re-researched and reranked eight sections for the Oct. 5 morning edition. Cross-checked current Fox News, CNN and Drudge Report framing and examined Reuters, AP, official sources and direct reporting where available; Drudge is an aggregator, not independent reporting.","Markets Insider premarket futures table shows Monday Oct. 5 Dow Jones futures 51,386.00 (−91.00, −0.18%) at 7:04:59 a.m. EDT and Nasdaq-100 futures 30,991.50 (−70.25, −0.23%) at 7:04:58 a.m. EDT. Values are indicative futures, not cash-index points or an official close. Friday Oct. 2 latest completed-session values: Dow 51,176.96 (+250.40, +0.49%); Nasdaq Composite 27,190.86 (+319.27, +1.19%).","Boston team status checked at the timestamped build minute. Patriots–Bills remains Sunday final, New England 29–26; Patriots next play Las Vegas Oct. 11 at 1 p.m. EDT. Bruins–Ottawa is scheduled Monday 7:30 p.m.; no Red Sox or Celtics Monday game, with Celtics preseason at Cleveland Oct. 8. Bruins–Wild ended Saturday Minnesota 4–1; Red Sox were eliminated in a 2–0 Yankees Wild Card sweep.","Boston Globe access is partly paywalled; excerpts and headlines were used where available. WEEI/Audacy yielded navigation, schedules and audio metadata more often than full article text; that limitation is disclosed in the Boston Tell.","Brazil tally updated to completed first-round results; Russia laboratory worker death remains an unconfirmed infection (not confirmed plague); Nantucket search suspension is not a confirmed recovery; alleged crimes, military claims and the FlyDubai cockpit account remain attributed."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, or international soccer.',business:'7 unique business/markets stories; on trading days at 7 a.m. show timestamped indicative Dow and Nasdaq-100 futures, clearly not cash indexes; on weekends and market holidays state cash markets are closed and show no live/premarket snapshot, while identifying the latest completed session. At 10 a.m. and 1 p.m. on trading days show timestamped Dow and Nasdaq Composite cash-index levels, point and percentage moves, and any provider delay; at 4 p.m. show timestamped closing moves as confirmed or clearly preliminary; at 7 p.m. use confirmed closes.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
