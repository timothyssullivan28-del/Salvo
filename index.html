 Iran’s seven-day proposal and conditions","url":"https://apnews.com/article/iran-us-war-negotiations-strait-hormuz-d8b9749fee99a11dd77513d326b824b6"},{"label":"Fox News: live Iran coverage","url":"https://www.foxnews.com/live-news/iran-war-strait-hormuz-trump-talks-oil-gas-prices-midterms-09-26-26"}]},{"id":"top-pacific-hurricanes","headline":"Hurricane Nolo holds at 105 mph south of Hawaii as watches remain and life-threatening rain is forecast","summary":"The latest verified National Hurricane Center advisory available by 7 a.m. EDT (Advisory #23, issued 11 p.m. HST Friday) puts Nolo near 105 mph and nearly stationary about 145 miles south of South Point. A hurricane watch and tropical-storm warning remain for Hawaii County; Maui County is under a tropical-storm watch. Forecasters project 8–12 inches of rain in eastern and southern parts of the Big Island, isolated totals up to 16 inches, and possible major-hurricane strengthening. Rainfall and strengthening are forecasts, not observed totals; the center was forecast to remain south and southwest of the main islands.","sources":["Other"],"signal":"Watch","links":[{"label":"NHC Advisory #23 (11 p.m. HST Friday)","url":"https://www.nhc.noaa.gov/text/refresh/HFOTCPCP2+shtml/260850.shtml"},{"label":"NHC forecast discussion #23","url":"https://www.nhc.noaa.gov/text/refresh/HFOTCDCP2+shtml/260851.shtml"},{"label":"Hawaii Emergency Management Agency updates","url":"https://dod.hawaii.gov/hiema/tropical-storm-nolo-updates/"},{"label":"NPR: Nolo and Hawaii flood risk","url":"https://www.npr.org/2026/09/25/nx-s1-5981082/hurricane-nolo-hawaii"}]},{"id":"top-hurricane-polo-mexico","headline":"Category 5 Hurricane Polo packs 165-mph winds; NHC forecasts a powerful approach to Baja California Sur Monday","summary":"NHC Advisory #23, issued 2 a.m. MST Saturday, reports maximum sustained winds of 165 mph and a hurricane watch from Punta Eugenia to Santa Fe. The forecast calls for a northeast turn and approach to Baja California Sur Monday, with 4–8 inches of rain and isolated totals near 10 inches. Landfall and rainfall amounts are forecasts, not observed outcomes.","sources":["Other"],"signal":"Watch","links":[{"label":"NHC Advisory #23 (2 a.m. MST)","url":"https://www.nhc.noaa.gov/text/refresh/MIATCPEP2+shtml/260850.shtml"},{"label":"NHC forecast discussion #23","url":"https://www.nhc.noaa.gov/text/refresh/MIATCDEP2+shtml/260853.shtml"},{"label":"Reuters: Polo regains Category 5 strength","url":"https://www.reuters.com/business/environment/hurricane-polo-regains-category-5-strength-off-mexico-new-cyclone-threat-brews-2026-09-25/"},{"label":"AP: Pacific hurricanes threaten Hawaii and Mexico","url":"https://apnews.com/article/hurricane-nolo-hawaii-polo-mexico-e92145be4b564484025132cdf3d0de90"}]},{"id":"top-noreaster-new-jersey-flooding","headline":"Nor’easter floods New Jersey roads and some homes as the storm’s wind, rain and coastal-flood threat continues","summary":"AP reports flooded roads and homes in New Jersey as the storm’s first major impacts emerged; CNN’s Saturday coverage shows streets inundated. More severe wind, rain and coastal flooding in parts of New England remain forecast, not observed everywhere. Conditions and travel risks are changing through the weekend.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"AP: roads and homes flood in New Jersey","url":"https://apnews.com/article/noreaster-storm-cape-cod-new-england-4057bec1ced5c4883d36c30c778df410"},{"label":"CNN: Saturday storm update video","url":"https://www.cnn.com/2026/09/26/weather/video/coast-flooding-as-powerful-noreaster-hits-vrtc"},{"label":"CNN: Northeast storm coverage","url":"https://www.cnn.com/2026/09/24/weather/noreaster-coastal-storm-forecast-climate"}]},{"id":"top-trump-pocket-rescission-800m","headline":"Trump seeks to withhold more than $800 million in Congress-approved funds; Sen. Susan Collins calls move illegal","summary":"Reuters reports the White House is using a rarely used “pocket rescission” to withhold approved spending for immigration, race, education, refugee assistance, minority-business development and overseas conservation programs. The administration says it is cutting wasteful spending; Sen. Susan Collins, who chairs Appropriations, calls withholding the funds without congressional approval illegal. The dispute over the constitutional power of the purse remains unresolved.","sources":["Other"],"signal":"Split","links":[{"label":"Reuters: pocket rescission and Collins response","url":"https://www.reuters.com/legal/government/trump-seeks-withhold-800-million-congress-approved-funds-2026-09-26/"},{"label":"ABC News: White House order and Collins response","url":"https://abcnews.com/Politics/white-house-orders-800m-funds-rescinded-collins-calls/story?id=136772703"}]},{"id":"top-kyiv-russian-strikes","headline":"Russian strikes kill seven in Kyiv, officials say, as Ukraine’s largest steel plant halts production","summary":"Reuters reports Kyiv authorities said seven people were killed Friday, including a 14-year-old boy. ArcelorMittal said repeated strikes made it unsafe to resume production at its Kryvyi Rih plant, Ukraine’s largest steelmaker. The death toll is attributed to local authorities and the shutdown to the company; it does not mean all Ukrainian steel production has stopped.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Kyiv deaths and steel-plant shutdown","url":"https://www.reuters.com/world/europe/russian-drone-hits-central-kyiv-killing-child-injuring-least-seven-people-2026-09-25/"}]},{"id":"top-saudi-houthi-attacks","headline":"Saudi-led coalition says it intercepted two Houthi missiles and two drones aimed at Saudi targets","summary":"The Saudi-led coalition said it intercepted two ballistic missiles headed toward Khamis Mushait and two drones headed toward Riyadh early Saturday, Reuters reports. The coalition’s account was posted on X; it did not provide further details, and the report does not establish damage at the alleged targets. Saudi, Turkish and Pakistani military chiefs also met in Riyadh amid the widening regional conflict.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Saudi coalition reports interceptions","url":"https://www.reuters.com/world/middle-east/saudi-says-it-intercepted-2-drones-launched-by-houthis-towards-riyadh-2026-09-26/"},{"label":"Reuters: Iran proposal and regional attacks","url":"https://www.reuters.com/world/middle-east/iran-awaits-us-move-after-wsj-report-says-trump-rejects-peace-plan-2026-09-26/"}]},{"id":"top-white-house-press-access","headline":"White House leaves CNN out of the Air Force One press pool for Trump’s Tennessee trip despite a temporary access order","summary":"CNN and AP report the network will not travel with President Donald Trump on Saturday’s Tennessee trip; Reuters says the Washington Post reported the decision. A judge’s separate 14-day order restored White House press passes for CNN, MS NOW and Politico, but the travel-pool dispute is continuing. The development is not a final ruling on the outlets’ First Amendment claims.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"CNN: Air Force One travel-pool exclusion","url":"https://www.cnn.com/2026/09/25/politics/white-house-blocks-cnn-air-force-one-travel-pool"},{"label":"Reuters: White House blocks CNN from flight","url":"https://www.reuters.com/business/media-telecom/white-house-blocks-cnn-air-force-one-trip-washington-post-reports-2026-09-26/"},{"label":"AP: CNN left off Saturday trip","url":"https://apnews.com/article/white-house-media-ban-cnn-network-pool-c32504981ee2f5b3c137e57d9d36f33e"},{"label":"Reuters: judge’s temporary access order","url":"https://www.reuters.com/world/judge-lifts-trumps-white-house-ban-cnn-ms-now-politico-2026-09-24/"}]},{"id":"top-supreme-court-save-database","headline":"Supreme Court lets states use expanded federal SAVE database for voter checks while litigation continues","summary":"The Supreme Court blocked a lower-court order that had barred states from using an expanded federal immigration database for broad citizenship checks of voter registrations. Reuters reports the database’s overall error rate is unknown and voting-rights groups cite eligible citizens flagged incorrectly. The emergency ruling allows checks while litigation continues; it does not establish widespread noncitizen voting.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Supreme Court ruling","url":"https://www.reuters.com/world/supreme-court-restores-trumps-mass-voter-verification-system-2026-09-25/"},{"label":"AP: database ruling","url":"https://apnews.com/article/save-database-noncitizen-voters-trump-supreme-court-412e12f5a492dd20e407812f30f7c139"}]}],"usa":[{"id":"usa-pittsburgh-doctor-killed","headline":"Pittsburgh pediatrician Idris Evans is killed in a home attack; his wife is critically injured, officials say","summary":"Authorities say a man entered the home and stabbed the physician and his wife while they slept; the suspect was detained. The investigation is ongoing, and the account of the attack is attributed to law enforcement.","sources":["CNN","Fox","Other"],"signal":"Consensus","links":[{"label":"CNN: Pittsburgh investigation","url":"https://www.cnn.com/2026/09/25/us/pittsburgh-doctor-idris-evans-stabbing-home"},{"label":"PennLive: local report","url":"https://www.pennlive.com/crime/2026/09/upmc-childrens-hospital-physician-killed-in-stabbing-suspect-detained.html"}]},{"id":"usa-copenhaver-death","headline":"James Copenhaver, wounded in the 2024 Butler rally shooting, dies from injury complications","summary":"Copenhaver, 76, was one of two people wounded when a gunman opened fire at then-candidate Donald Trump’s Pennsylvania rally in July 2024. His lawyer said he died from complications related to those injuries; the death brings renewed attention to the attack’s victims.","sources":["Fox","Other"],"signal":"Consensus","links":[{"label":"AP: Copenhaver’s death","url":"https://apnews.com/article/james-copenhaver-trump-rally-butler-dies-00866b37ad8db967b4ebf6582c756bcd"},{"label":"CBS Pittsburgh","url":"https://www.cbsnews.com/pittsburgh/news/jim-copenhaver-trump-rally-assassination-attempt-victim-dies/"},{"label":"Fox News","url":"https://www.foxnews.com/politics/james-copenhaver-man-shot-trump-butler-rally-dies-complications-from-injuries-report"}]},{"id":"usa-ole-miss-deaths","headline":"Two Ole Miss student deaths remain under investigation; kratom found at the scene does not establish a cause","summary":"Authorities are investigating the deaths of two students, and reporting says kratom was found at the scene. Investigators have not established that the substance caused either death; the cases remain under investigation.","sources":["CNN","Fox","Other"],"signal":"Watch","links":[{"label":"AP: deaths and kratom","url":"https://apnews.com/article/kratom-mississippi-deaths-students-5c4d6429e65b573b2667119a8f860ddb"},{"label":"CNN: Ole Miss deaths","url":"https://www.cnn.com/2026/09/24/us/ole-miss-student-deaths-wwk"},{"label":"Fox News","url":"https://www.foxnews.com/us/ole-miss-victim-identified-narcotics-task-force-probes-two-student-deaths"}]},{"id":"usa-evanston-ice-detention","headline":"U.S. citizen says ICE agents mistakenly detained and injured him in Evanston","summary":"A U.S. citizen says immigration agents wrongly detained and injured him; local police and the man have offered accounts of the encounter. The claim is disputed and under scrutiny, not a court finding about the agents’ conduct.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"CNN: Evanston detention","url":"https://www.cnn.com/2026/09/24/us/ice-us-citizen-detained-evanston"},{"label":"AP: local account","url":"https://apnews.com/article/chicago-illinois-ice-immigration-agents-evanston-police-2e07d80e8d96685489e914880a4e4d5"}]},{"id":"usa-usda-meat-recall","headline":"USDA recalls more than 167,000 pounds of meat produced risis services.","sources":["Other"],"signal":"Watch","links":[{"label":"AP: Navy disclosure","url":"https://apnews.com/article/uss-lincoln-aircraft-carrier-suicide-attempts-iran-7bb8316aa4fd67e6d2c8b34c029eebda"}]},{"id":"usa-tiktok-alabama-settlement","headline":"TikTok settles Alabama’s teen-harm lawsuit on eve of the first state trial over the claims","summary":"Reuters reports TikTok and ByteDance reached a settlement with Alabama over allegations that the platform was designed to addict children and that the companies misled consumers about safety. The Alabama attorney general’s office says the state will receive at least $100 million within 45 days, with potential payments up to $300 million if conditions are met. This is a settlement before trial, not a court finding that every allegation was proven.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Alabama settlement and terms","url":"https://www.reuters.com/world/us/tiktok-settles-with-alabama-ahead-first-state-trial-over-claims-teen-harms-2026-09-25/"}]},{"id":"usa-kalshi-sixth-circuit-ruling","headline":"Appeals court says states may regulate Kalshi sports-event contracts under gambling laws","summary":"Reuters reports the 6th U.S. Circuit Court of Appeals ruled that Ohio and Tennessee gambling laws were not preempted by federal law and that Kalshi had not shown its sports-event contracts were swaps subject exclusively to Commodity Futures Trading Commission regulation. The ruling is a circuit-court decision; broader litigation and regulatory questions remain.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: 6th Circuit ruling","url":"https://www.reuters.com/business/finance/us-appeals-court-rules-against-kalshi-says-states-can-regulate-prediction-2026-09-25/"}]},{"id":"usa-tasia-fortune-investigation","headline":"Mississippi police say Tasia Fortune’s hanging was staged after her death in a drug dispute","summary":"An Associated Press report says a Jackson police detecti  reserve after a broken ankle","summary":"New England placed Onwenu on injured reserve after his ankle injury, sidelining a key offensive lineman. The roster transaction was announced Sept. 22; the Patriots’ next game is scheduled for Sunday against Jacksonville.","sources":["Other"],"signal":"Consensus","links":[{"label":"Patriots official announcement","url":"https://www.patriots.com/news/patriots-place-ol-mike-onwenu-on-injured-reserve-make-additional-roster-moves"},{"label":"Boston.com report","url":"https://www.boston.com/sports/new-england-patriots/2026/09/22/patriots-place-offensive-lineman-mike-onwenu-on-injured-reserve/"}]},{"id":"boston-celtics-training-camp-roster","headline":"Celtics finalize a 21-player training-camp roster ahead of media day","summary":"Boston’s camp roster includes 21 players as the team prepares for the 2026–27 season. The roster announcement is current team news; no Celtics game was played Thursday night.","sources":["Other"],"signal":"Consensus","links":[{"label":"CelticsWire roster report","url":"https://celticswire.usatoday.com/story/sports/nba/celtics/2026/09/24/full-celtics-21-man-roster-set-for-training-camp/91930501007/"},{"label":"Celtics official roster","url":"https://www.nba.com/celtics/news/sidebar-offseason-2026-27-roster-breakdown-the-backcourt"}]},{"id":"boston-college-virginia-tech-saturday-preview","headline":"Boston College hosts Virginia Tech in Saturday’s noon ACC game at Alumni Stadium","summary":"Boston College’s official schedule lists Virginia Tech at Alumni Stadium for Saturday, Sept. 26, at noon EDT. The game had not started by this 7 a.m. edition, so no result is implied.","sources":["Other"],"signal":"Watch","links":[{"label":"Boston College: official football schedule","url":"https://bceagles.com/sports/football/schedule"},{"label":"ESPN: Virginia Tech at Boston College preview","url":"https://www.espn.com/college-football/preview/_/gameId/401858242"}]}],"entertainment":[{"id":"entertainment-taylor-swift-encore","headline":"Taylor Swift releases “The Life of a Showgirl: The Encore” and announces the “Patient Zero” video","summary":"Swift’s expanded release arrived Friday with additional songs; the “Patient Zero” music video is scheduled to premiere during Sunday’s VMAs. The album is out, while the video remains a future event.","sources":["Other"],"signal":"Consensus","links":[{"label":"AP: Swift release","url":"https://apnews.com/article/taylor-swift-new-music-patient-zero-934935f049893d0567713bea516f2c0c"},{"label":"Variety: album and video","url":"https://variety.com/2026/music/news/taylor-swift-reveals-life-of-showgirl-encore-new-songs-1236872982/"},{"label":"Variety: video details","url":"https://variety.com/2026/music/news/taylor-swift-patient-zero-music-video-dakota-johnson-colin-farrell-1236874206/"}]},{"id":"entertainment-different-world-netflix","headline":"Netflix’s “A Different World” sequel premieres with the original HBCU setting in focus","summary":"The sequel to the 1980s campus sitcom is available on Netflix Friday, bringing a new generation to the fictional Hillman College setting. The premiere is confirmed; audience response is not yet known.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"CNN: sequel premiere","url":"https://www.cnn.com/2026/09/24/entertainment/a-different-world-reboot-netflix"},{"label":"AP: sequel","url":"https://apnews.com/article/a-different-world-sequel-f0f23537d211e084dfb53999c3a4a367"}]},{"id":"entertainment-paramount-wbd-settlement-challenge","headline":"Merger opponents ask a court to reject Paramount’s settlement tied to its Warner Bros. bid","summary":"Variety reports opponents urged a court to reject a settlement connected to Paramount’s proposed Warner Bros. bid. The filing is an argument for the judge to consider; it is not a ruling on the merger or a completed acquisition.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety: court challenge","url":"https://variety.com/2026/tv/global/block-the-merger-amicus-brief-reject-settlement-1236875410/"},{"label":"Variety: settlement terms","url":"https://variety.com/2026/film/news/paramount-states-settlement-terms-warner-bros-1236871264/"}]},{"id":"entertainment-macklemore-charity-tour","headline":"Macklemore announces a tour supporting Palestinian aid organizations","summary":"Macklemore says proceeds from his planned “Free Palestine” shows will support aid organizations. The tour announcement is confirmed; the performances and any eventual distributions have not yet occurred.","sources":["Other"],"signal":"Watch","links":[{"label":"AP: tour announcement","url":"https://apnews.com/article/macklemore-free-palestine-shows-ed-sheeran-65a65a362e530dfe739ddb626dc16d23"},{"label":"Variety: tour details","url":"https://variety.com/2026/music/news/macklemore-free-palestine-tour-1236874352/"}]},{"id":"entertainment-black-doves-first-look","headline":"Netflix releases a first look at season two of “Black Doves”","summary":"The streamer released an early look at the second season, with Keira Knightley returning. This is a promotional preview; no season-two premiere date was announced in the cited report.","sources":["Other"],"signal":"Consensus","links":[{"label":"Variety: first look","url":"https://variety.com/2026/tv/news/black-doves-season-2-trailer-netflix-keira-knightley-1236874496/"}]},{"id":"entertainment-ed-sheeran-gillette-canceled","headline":"Ed Sheeran cancels Friday and Saturday Gillette Stadium shows as nor’easter approaches","summary":"Gillette Stadium and the promoter announced that Sheeran’s two Foxborough concerts scheduled for Sept. 25–26 were canceled because of the impending nor’easter. The venue says refunds are available through the point of purchase; no replacement dates were announced in the cited notice.","sources":["Other"],"signal":"Consensus","links":[{"label":"Gillette Stadium official cancellation notice","url":"https://www.gillettestadium.com/events/ed-sheeran-loop-tour/"},{"label":"NBC Boston/AP: cancellation report","url":"https://www.nbcboston.com/news/local/ed-sheeran-gillette-stadium-loop-tour/4020701/"}]},{"id":"entertainment-vmas-sunday-guide","headline":"2026 MTV Video Music Awards are set for Sunday as Taylor Swift prepares to become the show’s most-awarded artist","summary":"The Associated Press’s event guide says the Sept. 27 show will give Swift the inaugural Artist Director Honors, which would break her tie with Beyoncé for most-awarded artist in VMA history. This is a preview and expected milestone, not a completed ceremony or award result.","sources":["Other"],"signal":"Watch","links":[{"label":"AP: 2026 MTV VMAs guide","url":"https://apnews.com/article/mtv-video-music-awards-2026-guide-711f84857a0d65730696adf0ebdfa9a8"},{"label":"MTV: VMA show information","url":"https://www.mtv.com/vma"}]}]},"researchNotes":["Fresh public-web research was conducted for the Saturday, September 26, 2026, 7:00 a.m. EDT Boston edition. The Fox News homepage, CNN homepage and Drudge Report front page were inspected; direct Reuters, AP, NOAA/NHC, PGA Tour, ESPN, MLB and Boston College sources were checked where available. Drudge is treated as an aggregator, not as independent reporting.","Fox led its Saturday homepage with the Iran proposal/reported rejection and possible renewed bombing, alongside Chinese support allegations and the Houthi threat. CNN led with the Northeast nor’easter and reported flooding, while also featuring China/AI and the White House Air Force One pool exclusion. Drudge carried the CNN restriction, a summit-pomp-versus-progress headline, the expanded SAVE voter database, planned DOJ election observers, storm coverage and economic/political links. The Top News Tell reflects these framing contrasts, not outlet placement as the story ranking.","China-U.S. summit: Reuters reported Saturday that China’s Foreign Ministry claimed an eight-point consensus including a $30 billion reciprocal tariff-reduction arrangement, an AI dialogue/incident channel and a trade council. Reuters noted that the U.S. Embassy had not yet responded. This is Beijing’s account of announced understandings; do not imply U.S. confirmation or that implementation is complete. Reuters’ earlier summit wrap said the three-day visit ended Friday with the two-month trade-truce extension but little detailed public progress.","Iran: Reuters reported Tehran said its seven-day proposal would reopen Hormuz and halt regional fighting, with Qatar mediating. The suggestion that Trump rejected it and privately anticipated resuming bombing after the midterms is attributed by Reuters to a Wall Street Journal report citing unnamed U.S. officials; an earlier U.S. official described mediated talks as positive. No deal is in force, and Iran’s stated position on nuclear concessions is attributed to Iranian officials.","Hurricane Nolo: NHC Advisory #23, issued 11:00 p.m. HST Friday (5:00 a.m. EDT Saturday), reports 105-mph winds, a nearly stationary center south of the Big Island, and active watches/warnings. It forecasts 8–12 inches of rain, locally 16 inches, in eastern/southern Big Island areas and possible major-hurricane strengthening. At the 7:00 a.m. EDT edition time, the next complete advisory listed was 5:00 a.m. HST (11:00 a.m. EDT), so #23 is the latest verified full advisory. Nolo’s rain, intensification and track details are forecasts, not observed totals or landfall.","Hurricane Polo: NHC Advisory #23, issued 2:00 a.m. MST Saturday (5:00 a.m. EDT), reports Category 5 intensity and maximum sustained winds of 165 mph, a hurricane watch for part of Baja California Sur, and a forecast powerful approach Monday. Rainfall of 4–8 inches with isolated 10-inch totals is a forecast. The next complete advisory was listed for 8:00 a.m. MST (11:00 a.m. EDT), after this edition time.","The nor’easter has caused observed flooding in New Jersey; the AP reports flooded roads and some homes and CNN displays Saturday street flooding. Stronger impacts farther north remain forecasts. Reuters reports Saudi coalition claims it intercepted two missiles and two drones Saturday; damage at the alleged targets was not independently established. Reuters attributes the Kyiv death toll of seven to local authorities; its article text gives differing injury totals, so the card omits a precise injury count and does not claim independent confirmation.","The $800-million federal spending story is a proposed/attempted pocket rescission: Reuters reports the White House cited its authority, while Sen. Susan Collins called withholding appropriated funds illegal. No court resolution is reported. CNN’s exclusion from the Air Force One pool is reported by CNN/AP; Reuters attributes its report to the Washington Post. A separate judge’s order temporarily restored White House press credentials and did not resolve the underlying First Amendment litigation.","International updates: Reuters reports nearly 300 mm of rain in Bangkok over 48 hours and a disaster-zone declaration; the main airport was operating normally. Greek officials told Reuters that two people had died and four were missing after Friday’s Athens building collapse; a gas-related cause remains unconfirmed. Reuters reports Venezuela’s interim president returned from the U.S. without announced concrete deals or an election date; a missing date is not a formal cancellation.","Boston scores: ESPN confirms the Red Sox beat the Cubs 4–3 in Friday Game 1 and 2–0 in Game 2; MLB’s official Game 2 story confirms the shutout. ESPN confirms the Bruins lost 3–2 in overtime to Washington in Friday preseason action. The Patriots and Celtics did not play Friday night; no score is implied. Boston College’s official schedule lists Virginia Tech at noon Saturday, after the 7:00 a.m. edition check. These two prior-night professional finals lead Boston Sports.","Sports/entertainment: PGA Tour’s official recap and Presidents Cup scoring confirm the International team won all five Friday foursomes and leads 7–3. ESPN/CBS confirm the Yankees won Game 2 6–3 for a doubleheader split. AP’s VMA guide is used as a dated preview of Sunday’s show, not a report of results. Taylor Swift’s release and Ed Sheeran cancellations are stated as completed events, while the Patient Zero video and VMA ceremony remain upcoming.","All seven sections were validated at Top News 10, USA 10, World 10, Politics 7, Sports 9, Boston Sports 5 and Entertainment 7. Each story has at least one direct HTTP(S) source link; story IDs and normalized headlines are unique across tabs. General Sports contains no Boston teams, auto racing or international soccer. Boston Sports starts with the Red Sox doubleheader sweep and Bruins overtime final."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['world','World'],['politics','Politics'],['sports','Sports'],['boston','Boston Sports'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated in Top News.',world:'10 world stories not repeated in Top News.',sports:'No Boston teams, auto racing, or international soccer.',boston:'Boston teams and local sports only.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
</body></html>
