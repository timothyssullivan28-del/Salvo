"],"signal":"Watch","links":[{"label":"AP — judge blocks Big Bend border project, Oct. 2","url":"https://apnews.com/article/border-immigration-texas-border-infrastructure-56ea4f79b989a4c894e1f2256bc0b886"},{"label":"CNN — Big Bend border-wall ruling, Oct. 2","url":"https://www.cnn.com/2026/10/02/us/big-bend-border-wall-judge-blocks"}]},{"id":"usa-ice-poll-sites-oct2","headline":"Oct. 2: Administration says it has no plan to send ICE officers to polling places","summary":"The administration told a federal court it has no plans to deploy ICE officers to polling locations, AP reports, as voting-rights advocates seek restrictions. That representation is not a final court ruling or a guarantee about every future law-enforcement decision.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — administration statement on ICE and polling sites, Oct. 2","url":"https://apnews.com/article/midterm-elections-immigration-officers-ice-voting-e43c1758ccd446eb441957b36f9e281f"},{"label":"CBS News — lawsuit over ICE at polling sites","url":"https://www.cbsnews.com/news/lawsuit-block-ice-agents-polling-sites/"}]},{"id":"usa-noncitizen-voting-law-ruling-oct1","headline":"Oct. 1: Federal judge finds a law criminalizing noncitizen voting unconstitutional","summary":"A federal judge ruled against a state law criminalizing noncitizen voting, Reuters and NBC News report, finding it unconstitutional. The decision concerns the challenged law and remains subject to the litigation process; it does not legalize noncitizen voting in federal elections.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — judge rules noncitizen-voting law unconstitutional, Oct. 1","url":"https://www.reuters.com/world/us-judge-finds-law-criminalizing-noncitizen-voting-unconstitutional-2026-10-01/"},{"label":"NBC News — federal ruling on voting law, Oct. 1","url":"https://www.nbcnews.com/politics/justice-department/judge-guts-noncitizen-voting-law-used-trump-administrations-election-p-rcna601026" cowboys-in-exchange-for-second-sixth-round-picks"},{"label":"The Athletic — Porter trade and Sunday outlook, Oct. 3","url":"https://www.nytimes.com/athletic/7654156/2026/10/03/nfl-insider-joey-porter-jr-trade-puka-nacua-jayden-daniels/"}]},{"id":"sports-capitals-tuch-debut-oct3","headline":"Oct. 3: Alex Tuch scores twice in Capitals debut as defending champion Carolina loses again","summary":"Reuters’ NHL roundup says Tuch scored two goals in his Washington debut as the Capitals handed the Hurricanes their second straight loss. The early-season result is a notable rematch, not a playoff elimination or a change in standings leadership.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — NHL roundup: Tuch and Capitals beat Hurricanes, Oct. 3","url":"https://www.reuters.com/sports/nhl-roundup-alex-tuch-caps-send-champ-hurricanes-2nd-straight-loss--flm-2026-10-03/"}]},{"id":"sports-alabama-mississippi-state-preview-oct3","headline":"Oct. 3 preview: No. 7 Alabama visits Mississippi State in a ranked SEC matchup","summary":"Alabama enters the Week 5 game unbeaten, and Mississippi State provides an early conference test, according to the Saturday schedule and matchup preview. Kickoff is listed for noon EDT; the game is UPCOMING at this 7 a.m. edition.","sources":["Other"],"signal":"Watch","links":[{"label":"ESPN — college football Week 5 schedule, Oct. 3","url":"https://www.espn.com/college-football/schedule/_/week/5/year/2026/seasontype/2"},{"label":"The Athletic — Week 5 top games, Oct. 2","url":"https://www.nytimes.com/athletic/7649308/2026/10/02/college-football-top-games-week-5/"}]},{"id":"sports-ohio-state-iowa-preview-oct3","headline":"Oct. 3 preview: No. 5 Ohio State faces Iowa in another high-stakes Big Ten game","summary":"The Week 5 national schedule spotlights Ohio State against Iowa, with rankings and conference position adding importance early in October. The game is scheduled for Saturday; this card is a preview and no result is yet available. ulators have resolved the broader debate.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — administration stance on AI safeguards, Oct. 3","url":"https://www.reuters.com/legal/litigation/public-fears-ai-grow-trump-digs-voluntary-safeguards-2026-10-03/"}]},{"id":"politics-trump-ohio-rally-senate-race-oct3","headline":"Oct. 3: Trump campaigns in Ohio as Republicans defend a close Senate race","summary":"Reuters reports the president is scheduled to campaign Saturday in Ohio, where Republicans are defending a closely contested Senate seat as they try to retain their narrow congressional majority. The rally is a campaign event; it does not establish who will win or how voters will respond.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — Trump to campaign in Ohio, Oct. 3","url":"https://www.reuters.com/world/us/trump-speak-ohio-rally-republicans-defend-senate-seat-close-race-2026-10-03/"}]},{"id":"politics-gop-senate-funds-kansas-oct3","headline":"Oct. 2: Senate GOP campaign group shifts resources from North Carolina to Kansas","summary":"The Senate Republicans’ main campaign-spending group is redirecting money toward Kansas while reducing its planned spending in North Carolina, AP reports. The tactical move is not proof either race is safe, and November results remain uncertain.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — Senate GOP redirects spending to Kansas, Oct. 2","url":"https://apnews.com/article/senate-republicans-campaign-spending-kansas-north-carolina-72a0a3ff32c3626396f72ba77dc0264f"}]},{"id":"politics-fbi-patel-report-oct3","headline":"Oct. 3: FBI commissions classified internal “Patel Report” on where agency fell short, AP reports","summary":"AP reports the FBI commissioned a classified internal review, called the “Patel Report,” examining instances when the bureau fell short. The report’s scope and findings are not publicly established in the available account; its commissioning is not itself proof of nal":"Watch","links":[{"label":"Reuters — states challenge EPA power-plant repeal, Oct. 1","url":"https://www.reuters.com/legal/litigation/new-york-20-states-sue-epa-block-power-plant-carbon-rule-repeal-2026-10-01/"}]}],"entertainment":[{"id":"entertainment-skydance-merger-name-oct3","headline":"Oct. 2–3: Proposed Paramount–Warner company would use Skydance name and bundle, not merge, streamers","summary":"If the Paramount Skydance–Warner Bros. Discovery merger closes, David Ellison says the combined company would use the Skydance name; Deadline reports HBO Max and Paramount+ would remain separate but be sold in a bundle. Both are attributed plans contingent on a transaction that has not closed, not finalized customer terms.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — proposed name for combined company, Oct. 2","url":"https://www.reuters.com/legal/transactional/david-ellison-says-combined-paramount-warner-bros-discovery-will-be-named-2026-10-02/"},{"label":"Variety — name announcement, Oct. 2","url":"https://variety.com/2026/tv/news/name-of-paramount-warner-bros-unveiled-skydance-1236893761/"},{"label":"Deadline — reported HBO Max/Paramount+ bundle plan, Oct. 3","url":"https://deadline.com/2026/10/skydance-hbo-max-paramount-streaming-bundle-1237145362/"}]},{"id":"entertainment-warner-film-execs-exit-oct3","headline":"Oct. 2: Warner Bros. film chiefs reportedly expected to leave if Paramount deal closes","summary":"The Hollywood Reporter and TheWrap say Michael De Luca and Pamela Abdy are expected to exit after the Paramount Skydance merger closes. The transaction has not closed, so departure timing and their next roles remain contingent and attributed to trade reporting.","sources":["Other"],"signal":"Watch","links":[{"label":"The Hollywood Reporter — Warner Bros. film chiefs’ expected exit, Oct. 2","url":"https://www.hollywoodreporter.com/movies/movie-news/michael-de-luca-pamela-abdy-warner-bros-1236720848/"},{"label":"Deadline — De Luca and Abdy’s reported next steps","url":"https://deadline.com/2026/10/michael-de-luca-pamela-abdy-exit-warner-bros-paramount-merger-1237145206/"}]},{"id":"entertainment-disney-netflix-licensing-oct3","headline":"Oct. 2: Disney licenses titles including “Ice Age,” “Felicity” and “Elio” to Netflix","summary":"Variety reports Disney licensed a slate of films and series to Netflix, including all five Ice Age movies, Elio, Felicity, Will Trent and Percy Jackson and the Olympians. The agreement expands Netflix’s catalog but does not transfer ownership of the titles or signal a Disney streaming exit.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — Disney licenses titles to Netflix, Oct. 2","url":"https://variety.com/2026/tv/news/disney-licenses-titles-netflix-ice-age-movies-will-trent-percy-jackson-and-the-olympians-felicity-1236897256/"}]},{"id":"entertainment-disney-layoffs-oct3","headline":"Oct. 3: Disney president calls layoffs “extremely painful” but necessary","summary":"Disney president Dana Walden defended recent job reductions as painful but necessary in remarks reported by Yahoo Finance. The comments describe management’s rationale, not a new headcount figure or evidence that further layoffs are complete.","sources":["Other"],"signal":"Watch","links":[{"label":"Yahoo Finance — Disney president on layoffs, Oct. 3","url":"https://finance.yahoo.com/media-advertising/articles/disney-president-says-layoffs-extremely-094448360.html"}]},{"id":"entertainment-fast-furious-peacock-order-oct3","headline":"Oct. 2: Peacock orders “Fast & Furious” television adaptation","summary":"Variety reports Peacock has formally ordered a series based on the franchise and is targeting a 2028 premiere. That is a series order and target window, not a released program or a fixed launch date.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — Peacock orders “Fast & Furious” series, Oct. 2","url":"https://au.variety.com/2026/tv/news/fast-furious-tv-show-peacock-2028-40935/"}]},{"id":"entertainment-eddie-murphy-chairman-oct3","headline":"Oct. 2: Eddie Murphy attached to Peacock drama “The Chairman”","summary":"The project is in development with Mad Men creator Matthew Weiner, trade reports say. Murphy’s attachment is announced, but no series order, production start or premiere date was confirmed.","sources":["Other"],"signal":"Watch","links":[{"label":"The Hollywood Reporter — Murphy’s Peacock drama, Oct. 2","url":"https://www.hollywoodreporter.com/tv/tv-news/eddie-murphy-star-the-chairman-peacock-1236720659/"},{"label":"Variety — “The Chairman” project details, Oct. 2","url":"https://au.variety.com/2026/tv/news/eddie-murphy-peacock-drama-matthew-weiner-40937/"}]},{"id":"entertainment-miranda-lambert-album-oct3","headline":"Oct. 3: Miranda Lambert returns with country-disco album “Crisco,” AP reports","summary":"AP’s Oct. 3 music feature profiles Miranda Lambert’s new album “Crisco,” describing its country-disco direction and quoting the singer on its joyful tone. The coverage is an artist/album feature, not a claim about chart performance or a confirmed release-week sales result.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — Miranda Lambert returns with “Crisco,” Oct. 3","url":"https://apnews.com/article/miranda-lambert-crisco-670c88368e68e3f62ede48edf93e5177"}]}]},"researchNotes":["Built Saturday, Oct. 3, 2026 with fresh public-web review and a complete re-ranking of all eight tabs since 7:23 a.m.; compared current Fox News, CNN and Drudge Report pages and opened source reporting where available. Drudge is treated as an aggregator, not an independent reporting source.","Business: Saturday cash markets are closed and no live/premarket snapshot is shown. Reuters and AP confirm Friday, Oct. 2 as the latest completed session: Dow 51,176.96, +250.40 (+0.49%); Nasdaq Composite 27,190.86, +319.27 (+1.19%). Reuters supplies precise percentages; AP confirms closing levels and point changes.","Boston Sports: official NHL gamecenter verified Bruins at Minnesota Saturday at 8:00 p.m. EDT, still UPCOMING, and Boston’s 4–3 overtime final at Winnipeg Friday; official Patriots schedule confirms at Buffalo Sunday at 1 p.m.; MLB schedule confirms no Saturday Red Sox game after Sept. 30 elimination; Celtics/Citadel pages confirm camp begins Sunday Oct. 4. Checked Boston Globe sports and WEEI/Audacy alongside official pages.","Freshness and attribution: new Oct. 3 reporting was prioritized, including the missing jet, Ohio plant closure, Guard arrest, updated international developments, Renault investment plan and FBI review. Older Oct. 1–2 items remain only where their pending legal, national or corporate significance persists; source dates, allegations, official/source counts, forecasts and unresolved proceedings are attributed."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, or international soccer.',business:'7 unique business/markets stories; on trading days at 7 a.m. show timestamped indicative Dow and Nasdaq-100 futures, clearly not cash indexes; on weekends and market holidays state cash markets are closed and show no live/premarket snapshot, while identifying the latest completed session. At 10 a.m. and 1 p.m. on trading days show timestamped Dow and Nasdaq Composite cash-index levels, point and percentage moves, and any provider delay; at 4 p.m. show timestamped closing moves as confirmed or clearly preliminary; at 7 p.m. use confirmed closes.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
