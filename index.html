com/nfl/game/_/gameId/401872965"}]},{"id":"sports-mlb-monday-alds-schedule-oct5","headline":"Oct. 5 MLB ALDS: White Sox–Guardians at 5 p.m.; Yankees–Rays at 8 p.m. ET","summary":"MLB lists Chicago at Cleveland at 5 p.m. ET and New York at Tampa Bay at 8 p.m. Monday. Both were UPCOMING at the 4 p.m. EDT check; Sunday’s series leads were Chicago 1–0 and Tampa Bay 1–0.","sources":["Other"],"signal":"Watch","links":[{"label":"MLB — official 2026 postseason schedule and bracket","url":"https://www.mlb.com/postseason"},{"label":"ESPN — 2026 playoff schedule, Oct. 5 slate","url":"https://www.espn.com/mlb/story/_/id/50022544/2026-mlb-playoffs-schedule-how-watch-postseason-world-series-bracket-standings"}]},{"id":"sports-mlb-nlds-results-oct4","headline":"Oct. 4 NLDS finals: Brewers edge Padres 4–3; Braves beat Dodgers 3–2 to even series","summary":"Milwaukee moved ahead 2–0 in its series with a second 4–3 win over San Diego, while Atlanta beat Los Angeles 3–2 to tie the Braves-Dodgers series 1–1, MLB’s postseason scoreboard shows.","sources":["Other"],"signal":"Consensus","links":[{"label":"MLB — official postseason scoreboard, Oct. 4","url":"https://www.mlb.com/postseason"}]},{"id":"sports-mnf-falcons-saints-oct5","headline":"Oct. 5 UPCOMING: Falcons visit Saints on Monday Night Football at 8:15 p.m. ET","summary":"Atlanta and New Orleans are scheduled for the Week 4 Monday Night Football matchup at 8:15 p.m. ET. No result or live status exists before kickoff.","sources":["Other"],"signal":"Watch","links":[{"label":"NFL — 2026 Week 4 schedule and MNF listing","url":"https://www.nfl.com/schedules"},{"label":"New Orleans Saints — Falcons at Saints, Oct. 5","url":"https://www.neworleanssaints.com/tickets/2026/falcons-at-saints-tickets-information-history-week-4-october-5-2026"}]},{"id":"sports-capitals-tuch-debut-oct3","headline":"Oct. 3 NHL: Alex Tuch scores twice in Capitals debut as Carolina loses again","summary":"Alex Tuch scored twice in his Washington debut as the Capitals defeated Carolina, Reuters reports. The NHL season is underway; the result is a Saturday final, not a live game.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — NHL roundup on Tuch and Capitals, Oct. 3","url":"https://www.reuters.com/sports/nhl-roundup-alex-tuch-caps-send-champ-hurricanes-2nd-straight-loss--flm-2026-10-03/"}]}],"politics":[{"id":"politics-cnn-midterm-map-oct5","headline":"Oct. 5 CNN analysis: Trump campaigns in red states as Democrats gain ground","summary":"CNN’s Monday analysis says Democrats are competitive in states Trump won in 2024 as Republicans defend once-safe territory, with voters focused on prices and Iran. Polls and campaign stops are snapshots—not forecasts—and the races remain undecided.","sources":["CNN"],"signal":"Watch","links":[{"label":"CNN — Trump fights on home turf as Democratic midterm hopes rise, Oct. 5","url":"https://www.cnn.com/2026/10/05/politics/trump-republicans-midterms-home-turf"}]},{"id":"politics-reuters-ipsos-approval-poll-oct5","headline":"Oct. 5 Reuters/Ipsos: Trump approval at 32%, a new low in the poll series","summary":"A Reuters/Ipsos poll put Trump’s approval at 32%, its lowest reading since his return to office, and found Hispanic voters souring on Republicans. Polling reflects respondents at a point in time, with sampling uncertainty; it is not an election forecast.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — Oct. 5 Reuters/Ipsos: Trump approval at 32%, a new low in the poll series","url":"https://www.reuters.com/world/us/trump-approval-record-low-hispanic-voters-sour-on-republicans-reutersipsos-poll-2026-10-05/"}]},{"id":"politics-dccc-red-to-blue-expansion-oct5","headline":"Oct. 5: Democrats add six House races to their “Red to Blue” target list","summary":"The Democratic Congressional Campaign Committee added six Republican-held districts to its target program as the party tries to expand its midterm battlefield, The Hill reports. The move signals campaign priorities, not a forecast or an endorsement by nonpartisan election analysts.","sources":["Other"],"signal":"Watch","links":[{"label":"The Hill — Oct. 5: Democrats add six House races to their “Red to Blue” target list","url":"https://thehill.com/homenews/campaign/6129845-democrats-house-race-targets-dccc-midterms/"}]},{"id":"politics-trump-super-intelligence-force-oct4","headline":"Oct. 4: Trump announces “Super Intelligence Force” as AI task-force rollout expands","summary":"Trump announced a proposed “Super Intelligence Force” to coordinate the federal AI response, while DNI Jay Clayton’s task-force leadership remains in place. The structure, remit and recommendations remain unsettled; the announcement is not an enacted policy.","sources":["Fox","Other"],"signal":"Watch","links":[{"label":"Fox News — Trump announces Super Intelligence Force, Oct. 4","url":"https://www.foxnews.com/politics/trump-launching-super-intelligence-force-ensure-american-dominance"}]},{"id":"politics-noem-donor-contract-report-oct4","headline":"Oct. 4 report: Noem agency awarded donor-linked firm a contract before she left office","summary":"The New York Times reports that Kristi Noem’s agency awarded a lucrative contract to a donor shortly before she departed. The report raises questions about timing and contracting; it is an allegation requiring attribution, not a government finding of misconduct.","sources":["Drudge","Other"],"signal":"Watch","links":[{"label":"New York Times — report on Noem agency contract, Oct. 4","url":"https://www.nytimes.com/2026/10/04/us/politics/kristi-noem-planes-donor.html"}]},{"id":"politics-democrats-posttrump-plan-oct4","headline":"Oct. 4 report: Democrats draft plans to constrain presidential power after Trump","summary":"The Washington Post reports Democratic lawmakers and legal experts are preparing proposals on emergency powers, Justice Department independence, White House changes and ethics. These are planning efforts, not enacted laws or agreed party policy.","sources":["Other"],"signal":"Watch","links":[{"label":"Washington Post — Democrats plan post-Trump government changes, Oct. 4","url":"https://www.washingtonpost.com/politics/2026/10/04/democrats-are-making-plans-clean-up-government-post-trump-era/"}]},{"id":"politics-trump-cotton-daylight-saving-oct3","headline":"Oct. 3: Trump posts Sen. Tom Cotton’s number amid daylight-saving bill dispute","summary":"CNN reports Trump posted Cotton’s phone number as the president and senator clashed over daylight-saving-time legislation. The dispute is political and procedural; Congress has not enacted a change.","sources":["CNN"],"signal":"Watch","links":[{"label":"CNN — Trump and Cotton clash over daylight-saving bill, Oct. 3","url":"https://www.cnn.com/2026/10/03/politics/trump-tom-cotton-phone-number-daylight-saving"}]}],"entertainment":[{"id":"entertainment-digger-boxoffice-oct5","headline":"Oct. 5 estimates: “Verity” opens at $32.6M as “Digger” posts Tom Cruise’s lowest debut in years","summary":"Deadline’s updated weekend estimate puts “Verity” at $32.6 million domestic and “Digger” at $8 million, the latter Tom Cruise’s lowest opening since 2007. Weekend grosses are studio estimates, not final audited totals.","sources":["Other"],"signal":"Watch","links":[{"label":"Deadline — updated weekend box-office estimates, Oct. 5","url":"https://deadline.com/2026/10/box-office-verity-digger-1237145435/"},{"label":"AP — “Verity” tops box office as “Digger” opens, Oct. 5","url":"https://www.wjtv.com/news/ap-on-cusp-of-merger-digger-bombs-for-warner-bros-verity-takes-no-1-at-box-office/"}]},{"id":"entertainment-paramount-warner-settlement-oct4","headline":"Oct. 5: Mark Thompson to remain CNN chief as Paramount–Warner deal nears Tuesday close","summary":"CNN and Variety reported Monday that Mark Thompson will remain at CNN after the Ellison-led company takes control of Warner Bros. Discovery, with the transaction expected to take effect Tuesday. The acquisition had not closed at this edition; the settlement cleared a legal step, not every remaining condition.","sources":["Other"],"signal":"Consensus","links":[{"label":"CNN — Mark Thompson to remain as Ellisons take control, Oct. 5","url":"https://www.cnn.com/2026/10/05/media/cnn-ellison-mark-thompson-paramount-skydance-wbd"},{"label":"Variety — Mark Thompson to remain at CNN after Warner buy, Oct. 5","url":"https://variety.com/2026/tv/news/mark-thompson-cnn-remain-ceo-skydance-1236899059/"},{"label":"AP — Paramount settlement approved; proposed deal still pending, Oct. 4","url":"https://apnews.com/article/paramount-warner-bros-discovery-takeover-f30a8a9a4d26393177bc1af5bff1e990"}]},{"id":"entertainment-karoline-leavitt-fox-contributor-oct5","headline":"Oct. 5: Former press secretary Karoline Leavitt to join Fox News as contributor","summary":"Fox News announced that former White House press secretary Karoline Leavitt will join the network as an on-air contributor beginning Nov. 1, multiple outlets report. The hiring announcement does not establish her future role in newsroom decisions or programming.","sources":["Other"],"signal":"Watch","links":[{"label":"The Hill — Oct. 5: Former press secretary Karoline Leavitt to join Fox News as contributor","url":"https://thehill.com/homenews/media/6129163-karoline-leavitt-joining-fox-news/"}]},{"id":"entertainment-anthony-mackie-macbeth-oct5","headline":"Oct. 5: Anthony Mackie to return to Broadway as Macbeth after 16-year absence","summary":"Mackie will star in a Broadway production of Shakespeare’s “Macbeth”; rehearsals are planned for February 2027, with previews expected in late March or early April, Deadline reports. The production has not yet opened and the schedule remains forward-looking.","sources":["Other"],"signal":"Watch","links":[{"label":"Deadline — Anthony Mackie prepares Broadway return as Macbeth, Oct. 5","url":"https://deadline.com/2026/10/anthony-mackie-macbeth-broadway-avengers-star-1237146358/"}]},{"id":"entertainment-itv-mipcom-slate-oct5","headline":"Oct. 5: ITV Studios takes 10 new formats to Mipcom, led by “The Chase Around the World”","summary":"ITV Studios has unveiled ten new unscripted formats for the Mipcom market, with “The Chase Around the World” leading the slate, Variety reports. The announcement is a programming and international-sales slate, not a confirmation that every title has a buyer or release date.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — ITV Studios Mipcom formats slate, Oct. 5","url":"https://variety.com/2026/tv/news/itv-studios-mipcom-formats-slate-the-chase-around-the-world-1236898689/"}]},{"id":"entertainment-canal-cinema-tax-oct5","headline":"Oct. 5: Canal+ threatens to pull $1.1 billion French cinema deal over proposed tax hike","summary":"Canal+ warned it could withdraw from its cinema financing agreement if France raises VAT on subscription services; Variety estimates the proposed change could cost the group about €200 million annually. The tax remains part of a proposed finance bill, not enacted law.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — Canal+ warns over French tax and cinema funding, Oct. 5","url":"https://variety.com/2026/film/global/frances-canal-1-1-billion-cinema-deal-tax-hike-1236898925/"}]},{"id":"entertainment-jack-odessa-casting-oct5","headline":"Oct. 5: Jack O’Connell and Odessa A’zion to star as flat-earthers in new film","summary":"Variety reports O’Connell and A’zion will lead “The End of the World as We Know It” for Studiocanal and Working Title, about flat-earth believers. The casting is announced; the project’s release date has not been specified in the report.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — O’Connell and A’zion cast in new film, Oct. 5","url":"https://variety.com/2026/film/global/jack-oconnell-odessa-azion-tend-of-the-world-as-we-know-it-1236897026/"}]}]},"researchNotes":["Edition researched and built at October 5, 2026, 4:20:49 p.m. EDT Boston; compared with the Monday Oct. 5, 1:21:04 p.m. EDT edition and re-ranked all eight tabs for developments and material updates.","Reuters updated its Monday closing report at 4:03 p.m. EDT but expressly labeled index moves preliminary: Dow 51,274.32, +94.59 (+0.18%); Nasdaq Composite 27,480.28, +289.42 (+1.06%). CNBC RT pages later showed different values at 4:08 p.m. EDT: Dow 51,267.90, +90.94 (+0.18%); Nasdaq 27,477.31, +286.446 (+1.05%), with at least a 15-minute delay. No exchange-certified final data were located at build; do not label either official. Friday, Oct. 2 is the prior completed confirmed session (Dow 51,176.96 +250.40/+0.49%; Nasdaq 27,190.86 +319.27/+1.19%).","Boston official NHL GameCenter checked at 4:20 p.m. EDT: Senators at Bruins remains UPCOMING for 7:30 p.m. EDT. Patriots–Bills final 29–26; Patriots.com Monday press conference checked. MLB/Red Sox schedule shows no Red Sox game after Yankees sweep 2–0. Celtics official schedule has no Oct. 5 game and lists Cleveland Oct. 8 at 7 p.m. ET.","Boston Globe checked for Patriots, Red Sox and Bruins/Celtics reporting; some article text is paywalled. WEEI/Audacy was checked via its latest Patriots/Bruins shows and team coverage; it commonly returned schedules, show listings and audio metadata rather than complete article text. Limits disclosed in Boston Tell.","Current Fox home page had a video-player network error but returned headline material; CNN home page currently featured the Russian lab-worker story, Dennis Hastert death and Nobel announcement. Drudge led with plague links and also selected Brazil, RAF bombers and Hormuz coverage; Drudge is an aggregator, not an independent reporting source.","New afternoon reporting includes Trump saying the U.S. would help Russia after the Siberian lab worker death (Reuters 4:03 p.m.; infection remains unconfirmed as plague), the Kirkuk attack (Reuters 3:44 p.m.), Dennis Hastert’s death, counter-drone tests at the border, and a pending foreign-agent charge against a California realtor.","Business companies refreshed with the proposed C.H. Robinson/RXO $5.8B acquisition, Schneider Electric/PTC $22.6B deal, Jio IPO plan, reported UK grocery talks, airBaltic workforce plan and OPEC+ output targets.","All casualty counts, polls, official assertions, battlefield claims, proposals, allegations, market figures marked preliminary and unclosed transactions retain source attribution and caveats."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, or international soccer.',business:'7 unique business/markets stories; on trading days at 7 a.m. show timestamped indicative Dow and Nasdaq-100 futures, clearly not cash indexes; on weekends and market holidays state cash markets are closed and show no live/premarket snapshot, while identifying the latest completed session. At 10 a.m. and 1 p.m. on trading days show timestamped Dow and Nasdaq Composite cash-index levels, point and percentage moves, and any provider delay; at 4 p.m. show timestamped closing moves as confirmed or clearly preliminary; at 7 p.m. use confirmed closes.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
