nvoy Jared Kushner meanwhile described talks as partly deadlocked and characterized Putin as wanting peace. These are competing leaders’ assessments, not a confirmed attack timetable or an agreed settlement.","sources":["Other"],"signal":"Watch","links":[{"label":"apnews.com — 10:50 AM EST, November 26, 2026; checked Thursday evening","url":"https://apnews.com/article/russia-ukraine-war-zelenskyy-power-122f7f187eea20d4d2b659692b4c4f1e"}]},{"id":"story-n26e-5","headline":"Congo reports more than 12,000 Ebola cases as fighting disrupts response","summary":"AP reports Thursday that Congo’s health ministry counts 12,021 confirmed cases, with nearly half fatal, while violence forces some responders to evacuate. The article’s chart identifies ministry data as of Nov. 24. These are reported surveillance figures, not an independently complete count, and conflict threatens both care and case detection.","sources":["Other"],"signal":"Watch","links":[{"label":"apnews.com — 4:22 AM EST, November 26, 2026; checked Thursday evening","url":"https://apnews.com/article/congo-ebola-outbreak-violence-0a0bc05d76d3278319472178a16be14b"}]},{"id":"story-n26e-4","headline":"Trading partners protest Washington’s new tariff plans","summary":"China, Japan and other partners rejected U.S. allegations of manufacturing overcapacity Thursday, AP reports. Beijing threatened protective measures; Japan formally protested. The proposed duties are expected early next year, not already collected Thursday, and threatened retaliation is not a completed new trade restriction.","sources":["Other"],"signal":"Watch","links":[{"label":"apnews.com — 9:13 AM EST, November 26, 2026; checked Thursday evening","url":"https://apnews.com/article/us-tariffs-china-japan-singapore-b94a693004ad8f9b5e78f7aafb196a71"}]},{"id":"story-n26m-3","headline":"Judge blocks early ABC license reviews; FCC disputes ruling","summary":"Judge Loren AliKhan granted temporary and preliminary relief on First Amendment grounds, finding ABC hargers Sunday, 4:05 p.m. EST; Red Sox remain in the offseason. Official and ESPN schedules were rechecked.","sources":["Other"],"signal":"Watch","links":[{"label":"espn.com — Nov. 26, 2026; current schedules and verified finals; checked Thursday evening","url":"https://www.espn.com/nhl/team/schedule/_/name/bos/boston-bruins"},{"label":"Bruins — Nov. 25; official 4–2 final and Friday 1 p.m. fixture; rechecked Thursday evening","url":"https://www.nhl.com/bruins/news/bruins-fall-4-2-to-the-jets-move-forward-and-take-the-positives"},{"label":"ESPN — Celtics results and Friday 8 p.m. schedule checked Nov. 26; rechecked Thursday evening","url":"https://www.espn.com/nba/team/schedule/_/name/bos/boston-celtics"},{"label":"NBA — official Celtics schedule checked Nov. 26; rechecked Thursday evening","url":"https://www.nba.com/celtics/schedule"},{"label":"Patriots — official Sunday 4:05 p.m. EST fixture; rechecked Thursday evening","url":"https://www.patriots.com/schedule/"},{"label":"MLB — Red Sox offseason transaction record; rechecked Thursday evening","url":"https://www.mlb.com/redsox/roster/transactions"}]},{"id":"story-n25e-23","headline":"Thursday Patriots report still lists Maye and A.J. Brown as nonparticipants","summary":"The official Nov. 26 report lists Drake Maye (fibula), A.J. Brown (hamstring), Carlton Davis (knee) and Walter Rouse (concussion protocol) as DNP, with Doubs and Vera-Tucker limited. Globe says the team was not scheduled to practice Thursday, so these report categories are not proof of a new on-field workout or final Sunday availability.","sources":["Other"],"signal":"Watch","links":[{"label":"patriots.com — Nov. 26, 2026; official Thursday injury-report section; checked Thursday evening","url":"https://www.patriots.com/news/week-12-injury-report-patriots-at-chargers"}]},{"id":"story-n26m-18","headline":"Doubs’s return opens a 21-day decision window, not activation","summary":"Globe’s Nov. 25 reporting and the official injury list confirm Romeo Dou
