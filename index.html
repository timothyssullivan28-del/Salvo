ull-price marketplace enrollees in 30 HealthCare.gov states are receiving checks, with most of the payments going to battleground states. The administration calls them fee refunds; claims about electoral effects are analysts’ projections, not established outcomes.","links":[{"label":"Reuters — ACA refunds and battleground states, Oct. 1","url":"https://www.reuters.com/legal/litigation/trumps-500-obamacare-rebate-checks-land-prime-political-battlegrounds-2026-10-01/"}],"sources":["Other"],"signal":"Watch"},{"id":"politics-epa-states-lawsuit-oct1","headline":"Oct. 1: New York leads 25 states and cities challenging EPA power-plant rule repeal","summary":"The coalition argues EPA failed to account for alternative approaches and health and climate costs when it repealed 2024 greenhouse-gas limits. The filing starts litigation and is not a court decision on the agency’s authority.","links":[{"label":"Reuters — states’ challenge to EPA repeal, Oct. 1","url":"https://www.reuters.com/legal/litigation/new-york-20-states-sue-epa-block-power-plant-carbon-rule-repeal-2026-10-01/"}],"sources":["Other"],"signal":"Watch"},{"id":"politics-government-ads-probe-oct1","headline":"Oct. 1: Democrats ask watchdogs to review Trump-featured taxpayer-funded ads","summary":"House Democrats asked the Government Accountability Office and Office of Special Counsel to examine whether the ads violate restrictions on political use of government funds. The request is not a finding of illegality; the administration and regulators have not resolved the dispute.","links":[{"label":"Reuters — watchdog requests on government ads, Oct. 1","url":"https://www.reuters.com/legal/government/democratic-lawmakers-seek-probe-us-government-ads-featuring-trump-2026-10-01/"}],"sources":["Other"],"signal":"Watch"},{"id":"politics-house-battleground-oct2","headline":"Oct. 2: Democrats broaden House battleground, reaching into Republican-held districts","summary":"The Washington Post reports Democratic groups are expanding their House campaign map into districts that backed Trump in 2024. This is a campaign strategy, not evidence that any seat has changed hands or that a November outcome is settled.","links":[{"label":"The Washington Post — Democrats expand House battleground, Oct. 2","url":"https://www.washingtonpost.com/politics/2026/10/02/democrats-expand-battleground-house-reaching-into-blood-red-districts/"}],"sources":["Other"],"signal":"Watch"}],"entertainment":[{"id":"entertainment-skydance-name-oct2","headline":"Oct. 2: Combined Paramount-Warner company to be called Skydance if merger closes, Reuters reports","summary":"Paramount Skydance CEO David Ellison said the combined company would use the Skydance name once its Warner Bros. Discovery merger closes, which Reuters says is expected next week. The deal has not yet closed, and reported talks about CNN leadership remain unresolved.","links":[{"label":"Reuters — planned name for combined company, Oct. 2","url":"https://www.reuters.com/legal/transactional/david-ellison-says-combined-paramount-warner-bros-discovery-will-be-named-2026-10-02/"},{"label":"Variety — CNN chief discussions, Oct. 1","url":"https://variety.com/2026/tv/news/paramount-cnn-chief-mark-thompson-discussions-1236894869/"}],"sources":["Other"],"signal":"Watch"},{"id":"entertainment-fast-furious-peacock-oct2","headline":"Oct. 2: Peacock orders “Fast & Furious” TV adaptation to series","summary":"Variety reports Peacock has formally ordered the franchise adaptation and is targeting a 2028 premiere. That is a series order and target window, not a released show or fixed launch date.","links":[{"label":"Variety — “Fast & Furious” series order, Oct. 2","url":"https://au.variety.com/2026/tv/news/fast-furious-tv-show-peacock-2028-40935/"}],"sources":["Other"],"signal":"Watch"},{"id":"entertainment-eddie-murphy-chairman-oct2","headline":"Oct. 2: Eddie Murphy attached to Peacock drama “The Chairman”","summary":"The project is in development with “Mad Men” creator Matthew Weiner, Variety and The Hollywood Reporter report. The casting and project are announced, but no series order, production start or premiere date was confirmed.","links":[{"label":"The Hollywood Reporter — Murphy’s scripted series, Oct. 2","url":"https://www.hollywoodreporter.com/tv/tv-news/eddie-murphy-star-the-chairman-peacock-1236720659/"},{"label":"Variety — project details, Oct. 2","url":"https://au.variety.com/2026/tv/news/eddie-murphy-peacock-drama-matthew-weiner-40937/"}],"sources":["Other"],"signal":"Watch"},{"id":"entertainment-fox-business-hosts-oct2","headline":"Oct. 2: Fox Business replaces Maria Bartiromo’s morning slot with roundtable show","summary":"Variety reports a “Big Money” roundtable will replace Bartiromo’s morning program. The change is a programming decision; Fox Business has not announced the ratings or audience effects of the new format.","links":[{"label":"Variety — Fox Business programming change, Oct. 2","url":"https://variety.com/2026/tv/news/fox-business-replaces-maria-bartiromo-big-money-roundtable-1236894763/"}],"sources":["Other"],"signal":"Watch"},{"id":"entertainment-kimmel-future-oct1","headline":"Oct. 1: Disney president Dana Walden addresses Jimmy Kimmel Live!’s future","summary":"Variety reports Walden discussed the ABC show’s future and the performance of Disney’s live-action “Moana.” The comments do not announce a renewal or cancellation of Kimmel’s program.","links":[{"label":"Variety — Walden on Kimmel and “Moana,” Oct. 1","url":"https://variety.com/2026/film/news/disney-dana-walden-jimmy-kimmel-abc-moana-box-office-1236894985/"}],"sources":["Other"],"signal":"Watch"},{"id":"entertainment-starz-verizon-blackout-oct1","headline":"Oct. 1: Starz service goes dark for Verizon Fios customers amid carriage dispute","summary":"Variety reports Starz channels and on-demand service were blacked out after negotiations failed to yield a distribution agreement. The companies blame each other and no new deal was announced in the report.","links":[{"label":"Variety — Starz-Verizon blackout, Oct. 1","url":"https://variety.com/2026/tv/news/starz-verizon-fios-negotiations-blacked-out-tonight-1236894418/"}],"sources":["Other"],"signal":"Watch"},{"id":"entertainment-sia-catalog-sale-oct1","headline":"Oct. 1: Sia sells half-share of music catalog in reported $180 million deal","summary":"Rolling Stone reports the singer sold a 50% stake in her catalog. The reported transaction is complete; the precise future royalty stream and how the artist’s remaining share will be managed were not detailed.","links":[{"label":"Rolling Stone — Sia catalog sale, Oct. 1","url":"https://www.rollingstone.com/music/music-news/sia-sells-50-percent-catalogue-180-million-1235635118/"}],"sources":["Other"],"signal":"Watch"}]},"researchNotes":["Fresh public-web research conducted Friday, October 2, 2026; Fox News and CNN coverage and the Drudge Report front page were compared at run time. Drudge is treated as an aggregator, not an independent reporting source.","Re-ranked every tab for the 10 a.m. Eastern edition, prioritizing material Oct. 2 developments and retaining older stories only when still consequential. Verified the September jobs release against the BLS primary release and Reuters coverage; all forecasts, official statements, reported allegations and pending proceedings are attributed.","CNBC Dow quote and Nasdaq.com official Nasdaq Composite index snapshot were checked for the 10 a.m. edition; CNBC lists the Dow last time, while Nasdaq.com shows the index snapshot time and says public Nasdaq index displays are delayed at least one minute. Live point changes are calculated against Oct. 1 close; AP/KARE11 and S&P Global support exact completed-session figures, with Reuters’ small Dow variance disclosed. Intraday readings are not closes.","Boston team schedules and results checked Friday morning: Bruins at Winnipeg upcoming at 8 p.m.; Patriots off today and next at Buffalo Sunday at 1 p.m.; Celtics off today and preseason begins Oct. 8; Red Sox eliminated Sept. 30. No live score was claimed.","Source dates are identified for older stories; no story is repeated across tabs. General Sports excludes Boston teams, auto racing and international soccer; Boston Sports is limited to the Red Sox, Patriots, Bruins and Celtics."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'Only the Red Sox, Patriots, Bruins and Celtics; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, or international soccer.',business:'7 unique business/markets stories; at 7 a.m. show timestamped indicative Dow and Nasdaq-100 futures, clearly not cash indexes; at 10 a.m. and 1 p.m. show timestamped Dow and Nasdaq Composite cash-index levels, point and percentage moves, and any provider delay; at 4 p.m. show timestamped closing moves as confirmed or clearly preliminary; at 7 p.m. use confirmed closes; state the date of the latest completed U.S. cash session.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
</body></html>
