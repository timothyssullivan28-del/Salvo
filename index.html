ers.com/legal/government/us-appeals-court-reinstates-ohio-law-requiring-voters-prove-citizenship-2026-09-24/"}]},{"id":"politics-california-ballots","headline":"Sept. 28: California Supreme Court orders Riverside County sheriff to return 650,000 seized ballots","summary":"The state high court ordered a sheriff to return ballots seized from a 2025 special election, AP reported. The ruling concerns ballot custody and legality; it does not alter the election result.","sources":["Other"],"signal":"Consensus","links":[{"label":"AP: California ballot order","url":"https://apnews.com/article/sheriff-ballots-seized-california-supreme-court-e77a7eda321df80fa69da835e925e5b0"}]},{"id":"politics-texas-gop-candidate-posts","headline":"Sept. 28: CNN review finds Texas GOP candidate posted calls for public executions","summary":"CNN’s KFile review reported that a Republican congressional candidate made social-media posts advocating public executions and containing racist language. The report attributes the posts to the candidate’s accounts; his campaign response should be consulted in the linked article.","sources":["CNN"],"signal":"Watch","links":[{"label":"CNN KFile: candidate’s past posts (Sept. 28)","url":"https://www.cnn.com/2026/09/28/politics/kfile-bo-french-tweets-executions"}]}],"entertainment":[{"id":"entertainment-vmas-results","headline":"Sept. 27 VMAs: Taylor Swift wins three awards and reaches 33 career trophies; Madonna leads","summary":"Swift’s “The Fate of Ophelia” won Video of the Year and she collected three trophies, reaching 33 career VMAs, Reuters reported Sept. 28. Madonna led the night with seven wins; results are complete.","sources":["Other"],"signal":"Consensus","links":[{"label":"Reuters: 2026 VMAs winners (Sept. 28)","url":"https://www.reuters.com/business/media-telecom/madonna-sabrina-carpenter-lisa-win-mtvs-video-music-awards-2026-09-28/"}]},{"id":"entertainment-vmas-ratings","headline":"Sept. 27 VMAs draw 8.43 million viewers, up 51% year over year, eturn to You”","summary":"Lohan will produce and star with Golding in the Netflix film, Deadline reported. Mark Waters is set to direct; the project is in production planning rather than a released title.","sources":["Other"],"signal":"Watch","links":[{"label":"Deadline: Netflix casts “Return to You” (Sept. 28)","url":"https://deadline.com/2026/09/lindsay-lohan-henry-golding-cast-netflix-film-return-to-you-1237115284/"}]},{"id":"entertainment-shawn-levy-disney-deal","headline":"Sept. 28: Shawn Levy and 21 Laps sign multi-year deal with Disney’s 20th Television","summary":"Levy’s production company signed an overall deal with Disney after leaving Netflix, Deadline reported Monday. The agreement concerns future development, not an announced individual series.","sources":["Other"],"signal":"Consensus","links":[{"label":"Deadline: Levy/Disney deal (Sept. 28)","url":"https://deadline.com/2026/09/shawn-levy-disney-20th-tc-overall-deal-leaving-netflix-1237115308/"}]},{"id":"entertainment-reacher-season-six","headline":"Sept. 28: Prime Video renews “Reacher” for season six as season five films","summary":"Prime Video renewed the series for a sixth season while production on season five continues, The Hollywood Reporter reported. The renewal is confirmed; no season-six premiere date was announced.","sources":["Other"],"signal":"Consensus","links":[{"label":"The Hollywood Reporter: “Reacher” renewal (Sept. 28)","url":"https://www.hollywoodreporter.com/tv/tv-news/reacher-renewed-season-6-prime-video-1236713657/"}]}]},"researchNotes":["Edition rebuilt for Monday, September 28, 2026 at 7:15 p.m. EDT Boston using fresh public-web research; sources and their actual dates are linked on cards.","Compared current Fox News, CNN and Drudge Report front-page framing; Drudge is treated as an aggregator rather than an independent reporting source.","The NHC 2 p.m. MST discussion forecasts Hurricane Polo landfall on Baja Monday evening and a second mainland Mexico landfall Tuesday; landfall is not described as confirmed.","Confirmed latest completed U.S. session: Monday, Sept. 28 Dow 51,481.51 (-347.11, -0.67%) and Nasdaq Composite 26,820.38 (-248.34, -0.92%).","Boston teams: no Red Sox, Patriots, Bruins or Celtics game scheduled Monday. Red Sox and Patriots Sunday results; Tuesday Red Sox and Bruins schedules checked. At 7:15 p.m. the Eagles-Bears game remains pregame, with 8:15 p.m. EDT kickoff.","Older retained articles show their actual Sept. 24–27 dates; no unchanged story is represented as newly published."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'Boston-area professional and major-college sports only.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, or international soccer.',business:'7 unique business/markets stories; close figures refer to the latest completed U.S. session.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
