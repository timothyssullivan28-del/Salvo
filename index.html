an to be prosecuted after the New York Times reported recruitment discussions involving Democratic operatives. AP and CNN describe the allegations; Peltola’s campaign denies involvement with either Sullivan campaign. Fox frames the alleged spoiler effort and legal obstacles prominently; neither allegations nor presidential demands establish a crime.","sources":["Other","CNN","Fox"],"signal":"Watch","links":[{"url":"https://apnews.com/article/alaska-peltola-senate-dan-sullivan-democrats-743677c9fb0d6696af7901504df2be3e","label":"AP — updated Oct. 28, 2026"},{"url":"https://www.cnn.com/2026/10/28/politics/dan-sullivan-alaska-senate-democrats","label":"CNN — Oct. 28 Alaska reporting and analysis"},{"url":"https://www.foxnews.com/politics/peltola-campaigns-alleged-dan-sullivan-spoiler-plot-takes-new-turn-doj-faces-major-legal-hurdle","label":"Fox News — Oct. 28 alleged spoiler plot; article access limited"}]},{"id":"top-chatbots-oct28eve","headline":"New York bans unsafe AI-companion behavior toward children","summary":"Gov. Kathy Hochul signed restrictions Wednesday defining a dozen prohibited features when companion chatbots interact with users under 18. The law takes effect Jan. 1 and permits attorney-general enforcement, including damages and shutdown remedies. AP situates the measure within expanding state regulation as Congress has done little to act.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/chatbots-ai-new-york-legislation-bans-children-03a4e090a7df1532838a5cb6f93a23ba","label":"AP — updated Oct. 28, 2026"}]},{"id":"top-peptides-oct28eve","headline":"HHS proposes easing access to unproven injectable peptides","summary":"A draft policy would direct FDA not to act against specialty pharmacies selling six wellness peptides without the usual safety-and-effectiveness approval. AP reports scientific staff opposed the change, citing six people familiar with deliberations. HHS argues it advances patient choice; the proposal has a ion.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/world/us/us-confirms-new-world-screwworm-dog-arizona-2026-10-28/","label":"Reuters — Oct. 28 USDA confirmation"}]},{"id":"usa-tides-oct28eve","headline":"King tides flood communities on both U.S. coasts","summary":"AP reports flooded streets, homes and businesses in California, Florida and the Carolinas, with some impacts possible into the weekend. Weather officials cited astronomical tides plus regional ocean and weather conditions. Parts of the Pacific Coast Highway closed after flooding; the Oct. 28 report distinguishes forecasts from damage already observed.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.wavy.com/news/national/ap-us-news/ap-king-tides-inundate-streets-and-flood-homes-and-businesses-along-both-us-coasts/","label":"AP via WAVY — updated Oct. 28, 6:34 p.m. EDT"}]},{"id":"usa-escape-oct28eve","headline":"Tennessee fugitive search continues after truck found in Illinois","summary":"Authorities said escaped convicted murderer Jacob Morley abandoned a stolen truck in Marion, Illinois, Tuesday. Police said Wednesday they had no credible tips placing him in the city afterward. AP’s new report examines the search and Tennessee prison-system failures; it does not report a capture.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/jacob-morley-escape-prison-tennessee-5e34b128a22ff503f6700c9393de8863","label":"AP — updated Oct. 28, 2026"}]},{"id":"usa-vegas-oct28eve","headline":"Police report details text that diverted United flight to Las Vegas","summary":"A passenger charged over a threatening text told police it was banter with a co-worker and denied intending harm. The Saturday flight returned to Las Vegas after a flight attendant alerted the crew. AP’s Wednesday update cites the police report; his lawyer says he plans to plead not guilty.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/las-vegas-flight-hijack-text-arrest-b1bd8912feda63a98a9cf4cc454b9480","label":"AP — updated Oct. 28, 2026"}]},{"id":"usa-bundy-oct28eve","headline":"DNA links Ted Bundy to another Utah teenager’s killing","summary":"Utah authorities said preserved evidence and modern DNA analysis establish Bundy’s responsibility for the 1974 killing of Melissa Ann Smith, 17. The announcement Tuesday came 52 years after her body was found. AP’s Oct. 28 update highlights the resolution of a long-open case, not a newly discovered victim’s death.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/ted-bundy-serial-killer-utah-murder-35e9ec578158e9025c027e5a89023332","label":"AP — updated Oct. 28, 2026"}]},{"id":"usa-dwarf-oct28eve","headline":"Astronomers identify possible dwarf planet beyond Pluto","summary":"Researchers using the Vera C. Rubin Observatory identified the icy object 2026 ED138, Reuters reports Wednesday. Its estimated size could qualify it as a dwarf planet, but additional observations are needed. The finding is a candidate designation rather than confirmed addition to the official dwarf-planet roster.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/science/possible-new-dwarf-planet-identified-orbiting-beyond-pluto-2026-10-28/","label":"Reuters — Oct. 28 research report"}]},{"id":"usa-james-deportation-oct27-eve","headline":"AP investigation finds records supporting detained man’s U.S. citizenship","summary":"AP’s Oct. 27 investigation found documents supporting lawyers’ and family claims that Phillip James was born in Florida, despite nearly 10 months of immigration detention. Homeland Security disputes his citizenship and alleges a fraudulent birth certificate without furnishing evidence to AP. The unresolved detention remains nationally significant; no release is newly reported.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/ice-immigration-wrongful-detention-indiana-31097 cipated fully despite a listed right-shoulder issue. These are practice designations, not final availability decisions for Sunday at Miami.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.patriots.com/news/week-8-injury-report-patriots-at-dolphins-x9227","label":"Patriots — official Oct. 28 injury report, 4:35 p.m. EDT"}]},{"id":"boston-ir-oct28eve","headline":"Patriots face difficult injured-reserve return decisions","summary":"The Globe’s Wednesday roster analysis weighs depth needs against limited return slots. Vrabel said position depth and need guide decisions; his official transcript says he did not expect eligible Greg Van Roten or Dell Pettus at that day’s practice. Availability remains unresolved; older reports disagree about activation accounting, so no precise remaining-slot tally is asserted.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.bostonglobe.com/2026/10/28/sports/patriots-injured-reserve-players-activation-nfl-football/","label":"Boston Globe — Oct. 28, 2026; subscription overlay"},{"url":"https://www.patriots.com/news/transcript-head-coach-mike-vrabel-press-conference-10-28","label":"Patriots — official Vrabel transcript, Oct. 28"}]},{"id":"boston-cte-oct28eve","headline":"Vrabel discusses football’s risks after new CTE research","summary":"Vrabel said Wednesday he understood football’s physical risks while urging continued efforts to make the sport safer and protect players’ lives after retirement. The official transcript corroborates the Globe’s account of his remarks. His acceptance of risk is not evidence that CTE is unavoidable or that current protections eliminate it.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.bostonglobe.com/2026/10/28/sports/mike-vrabel-cte-study-patriots/","label":"Boston Globe — Oct. 28, 2026; subscription overlay"},{"url":"https://www.patriots.com/news/transcript-head-coach-mike-vrabel-press-conference-10-28","label":"Patriots — Oct. 28 press-conference transcript"}]},{"id":"boston-carolina-loss-oct28","headline":"Bruins’ Carolina loss exposes puck-management and shot-generation problems","summary":"Boston managed only 15 shots in Tuesday’s 2–1 defeat, the Globe reports, as Carolina’s pressure disrupted its exits and passing lanes. The official recap credits Swayman with 28 saves and records Sturm’s concern about small details and possession. The analysis identifies a correction before Thursday at St. Louis, not a new injury.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.bostonglobe.com/2026/10/28/sports/nhl-bruins-analysis-hurricanes-game/","label":"Boston Globe — Oct. 28, 2026; subscription overlay"},{"url":"https://www.nhl.com/bruins/news/bruins-fall-2-1-to-hurricanes-learn-and-got-something-out-of-it-today","label":"Bruins/NHL — Oct. 27 final and coaching reaction"}]},{"id":"boston-adams-oct28eve","headline":"Riley Adams views Red Sox deal as route back to majors","summary":"In the Globe’s Oct. 27 interview, Adams says the opportunity to earn a major league role drove his decision to sign a minor league contract with a spring-training invitation. He spent 2026 at Triple-A with Washington. The move adds catching competition; it does not guarantee a roster spot or announce a new Wednesday signing.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.bostonglobe.com/2026/10/27/sports/riley-adams-catcher-red-sox/","label":"Boston Globe — Oct. 27 interview; readable text with subscription overlay"}]},{"id":"boston-brown-legacy-oct28eve","headline":"Globe analysis questions cost of Brown–Tatum friction to Celtics legacy","summary":"Chad Finn’s Oct. 27 column examines former Celtic Jaylen Brown’s public digs at Tatum and Boston after his move to Philadelphia. It contrasts the exchanges with their shared championship history and Tatum’s call to celebrate it. This is clearly labeled commentary on the Celtics relationship, not a fresh transaction or independently established account of private motives.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.bostonglobe.com/2026/10/27/sports/jaylen-brown-jayson-tatum-celtics/","label":"Boston Globe — Chad Finn commentary, Oct. 27; subscription overlay"}]}],"business":[{"id":"business-close-oct28eve","headline":"CONFIRMED Wednesday close: Dow +97.53; Nasdaq +72.04","summary":"Wednesday, Oct. 28, 4 p.m. EDT completed cash session: Dow 52,475.10, +97.53 (+0.19%); Nasdaq Composite 26,549.85, +72.04 (+0.27%). Reuters and CNBC independently matched levels and percentages; AP matched levels and point changes. These are confirmed closes, not futures, live quotes or preliminary estimates.","sources":["Other"],"signal":"Overlap","links":[{"url":"https://www.reuters.com/world/asia-pacific/nasdaq-futures-rise-sk-hynix-boosts-chips-before-fed-decision-earnings-2026-10-28/","label":"Reuters — Oct. 28 completed-session market report"},{"url":"https://www.cnbc.com/2026/10/27/stock-market-today-live-updates.html","label":"CNBC — Oct. 28 closing report"},{"url":"https://wtop.com/national/2026/10/how-major-us-stock-indexes-fared-wednesday-10-28-2026/","label":"AP via WTOP — how indexes fared Wednesday"}]},{"id":"business-microsoft-oct28eve","headline":"Microsoft cloud growth and outlook beat estimates","summary":"Reuters reports Azure revenue rose 48% to $33.17 billion, with overall quarterly revenue at $92.28 billion. Microsoft forecast stronger-than-expected next-quarter sales and cloud growth. Free cash flow benefited from capital spending below its projection, partly because capacity deliveries were delayed; after-hours share moves are separate from the cash-market close.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/business/retail-consumer/microsoft-beats-quarterly-cloud-revenue-estimates-2026-10-28/","label":"Reuters — Oct. 28 quarterly results and outlook"}]},{"id":"business-alphabet-oct28eve","headline":"Alphabet revenue grows 25% but misses expectations","summary": r ties. BGI rejects the allegations. AP places the action within expanding biotechnology trade controls; government claims and the company’s denial remain explicitly attributed.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/china-trump-biotech-forced-labor-bgi-genomics-92531b29092332a680fd7abff55a0f27","label":"AP — Oct. 28 trade restrictions and BGI response"}]},{"id":"business-cruise-oct28eve","headline":"Residential cruise pauses in Cambodia as fuel costs surge","summary":"Villa Vie Residences suspended its three-year voyage and required passengers to disembark, AP reports. The operator says sharply higher fuel costs made its losses unsustainable; Cambodian officials counted 203 passengers aboard. The ship has no certain departure date, illustrating an operating-cost shock rather than a confirmed bankruptcy.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/us-cambodia-cruise-ship-fuel-88fa620415d8e490cbe5a25ca5cb0691","label":"AP — updated Oct. 28, 2026"}]}],"world":[{"id":"world-brazil-oct28eve","headline":"Flávio Bolsonaro arrives in Miami after refusing Brazil defeat","summary":"AP reports the defeated presidential candidate and his family reached Miami Wednesday after traveling through Argentina and Ecuador. He continues to allege election fraud and political persecution. His claims do not overturn Lula’s victory; his passport compliance and the status of corruption-related proceedings remain separate unresolved questions.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/brazil-election-flavio-bolsonaro-ecuador-argentina-9fc1f409ed993403736dbae07bd74bd8","label":"AP — updated Oct. 28, 2026"}]},{"id":"world-ukraine-oct28eve","headline":"Localized Oleshky ceasefire holds its first day and night","summary":"Officials said a six-day humanitarian truce around the occupied southern Ukrainian city held initially, allowing preparations for aid and evacuation. AP reports continued Russian and Ukrainian attacks elsewhere. The limited operation is not a nationwide ceasefire or evidence that broader peace terms are agreed.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/russia-ukraine-ceasefire-melania-trump-0f135e71101c48ccd83927efeebf3347","label":"AP — updated Oct. 28, 2026"}]},{"id":"world-ship-oct28eve","headline":"Sea drones strike container ship off Bulgaria","summary":"The ship’s owner and Bulgaria’s government said drones hit a Greek-owned, Liberian-flagged vessel in the Black Sea Wednesday. Reuters reports the attacker was not established. The incident raises shipping concerns, but responsibility cannot be assigned from the available account.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/world/drones-hit-another-container-ship-off-bulgaria-defence-minister-says-2026-10-28/","label":"Reuters — Oct. 28 owner and Bulgarian government accounts"}]},{"id":"world-germany-oct28eve","headline":"Germany discloses arrests over alleged sabotage plot","summary":"Prosecutors said two Belarusian nationals were detained on suspicion of planning an arson attack on a building or critical infrastructure near Nuremberg. They described alleged work for a foreign entity but did not name a state. Der Spiegel linked the case to Russia; Reuters distinguishes that report from prosecutors’ confirmed disclosures.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/world/german-police-arrest-two-suspected-planning-sabotage-attacks-russia-spiegel-says-2026-10-28/","label":"Reuters — Oct. 28; arrests occurred Oct. 7"}]},{"id":"world-yemen-oct28eve","headline":"Houthis report 14 killed in Saudi-led strike on Yemen market","summary":"A Houthi health official said Wednesday’s strike in al-Hazm killed 14 people and wounded 15. AP also reports Yemen’s internationally recognized government accused the Houthis of hitting Aden airport. The toll and attack accounts are ning. It is an executive transition, not a completed arena opening or ownership change.","sources":["Other"],"signal":"Overlap","links":[{"url":"https://apnews.com/article/mavericks-rick-welts-160f1fe30657663fd3ca1c593b4e43b6","label":"AP — updated Oct. 28, 2026"}]},{"id":"sports-longo-oct28eve","headline":"Sam Houston fires Phil Longo after 1–7 start","summary":"The school dismissed its football coach Wednesday after a 3–17 overall record across his tenure, AP reports. Eric Raisbeck and Freddie Aughtry-Lindsay will serve as interim co-head coaches. The change is immediate; a permanent replacement has not been announced.","sources":["Other"],"signal":"Overlap","links":[{"url":"https://apnews.com/article/sam-houston-longo-8b5d48c7ef79f3172f1155443683598e","label":"AP — updated Oct. 28, 2026"}]}],"politics":[{"id":"politics-fec-oct28eve","headline":"FEC restores filing system after cyberattack obscured spending reports","summary":"Reuters reports the commission restored its electronic filing service Wednesday evening after nearly 41 hours offline. The interruption blocked last-minute campaign-finance disclosures; motive remains unestablished. The FEC does not administer elections, and the outage is not evidence that voting systems or ballots were compromised.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/world/us/cyberattack-concealed-political-spending-by-big-donors-before-us-midterm-2026-10-28/","label":"Reuters — Oct. 28 restored-service update"}]},{"id":"politics-lawsuit-oct28eve","headline":"Civil-rights groups sue to stop federal noncitizen-voter initiative","summary":"The ACLU and affiliates filed suit Wednesday alleging a federal investigative initiative intimidates naturalized citizens and relies on flawed eligibility data. They seek to end it and destroy resulting records. Reuters reports the allegations and prior subpoenas; a complaint is not a judicial finding of unlawful conduct.","sources":["Other"],"signal":"Watch","link "Watch","links":[{"url":"https://apnews.com/article/hayden-panettiere-overdose-investigation-closed-2f069d501f6dad02c775d1642de3f3c5","label":"AP — updated Oct. 28, 2026"}]},{"id":"entertainment-burns-oct28eve","headline":"Ken Burns wins inaugural $250,000 American-history prize","summary":"New York Historical announced Wednesday that Burns received the first David M. Rubenstein Prize for the Advancement of American History. The jury cited his documentaries’ contribution to public understanding. The award recognizes a body of work rather than announcing a new film release.","sources":["Other"],"signal":"Overlap","links":[{"url":"https://apnews.com/article/ken-burns-american-history-prize-014333eec5706a752df641defc2696c5","label":"AP — updated Oct. 28, 2026"}]},{"id":"entertainment-gentle-oct28eve","headline":"AP review: “Gentle Monster” tests the comfort of trusting loved ones","summary":"AP’s Wednesday review examines Marie Kreutzer’s film, starring Léa Seydoux and Laurence Rupp, as a drama about moral blindness within a seemingly loving family. Its assessment concerns the storytelling and the audience’s complicity. This is a critic’s judgment, not reported misconduct by the performers.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/gentle-monster-movie-review-918881df1a322ae09fc019c9fd0a57a5","label":"AP — updated Oct. 28, 2026"}]},{"id":"entertainment-comics-oct28eve","headline":"Comics Come Home lines up Mulaney, Stewart and Romano for anniversary","summary":"The Globe’s Oct. 28 feature previews the charity show’s 30th anniversary at TD Garden on Nov. 7. Denis Leary’s lineup includes John Mulaney, Jon Stewart, Ray Romano, Jimmy Fallon and Leslie Jones. The event supports the Cam Neely Foundation for Cancer Care; the show is upcoming, not a completed performance.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.bostonglobe.com/2026/10/28/arts/comics-come-home/","label":"Boston Globe — Oct. 28 arts feature; subscription overlay"}]}]},"researchNotes":{"cadence":"weekday evening — all eight tabs refreshed; none preserved","market":"Wednesday completed cash close independently matched by Reuters and CNBC; AP confirms levels and point changes","boston":"All four off Wednesday; Patriots preview dek differs from game widget and independent schedule; use 4:25 p.m. EST Nov. 1","access":"Globe partly readable beneath subscription overlays; WEEI/Audacy limited fresh full text; some NBA pages empty; Fox article access limited, homepage checked","baseline":"baseline-oct28-morning.json"}}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, international soccer, or WNBA coverage.',business:'7 unique business/markets stories refreshed only at 7 p.m. Eastern Monday through Friday, with independently confirmed figures for the latest completed U.S. cash session. Preserved unchanged at all other editions.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
