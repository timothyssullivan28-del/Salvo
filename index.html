acy. The statements are official positions, not proof of capabilities or a completed agreement.","sources":["CNN","Fox","Other"],"signal":"Split","links":[{"label":"Fox News — Iran war live updates, Oct. 19","url":"https://www.foxnews.com/live-news/iran-war-news-trump-israel-pentagon-october-19"},{"label":"Reuters — Araqchi calls for diplomacy, Oct. 19","url":"https://www.reuters.com/world/irans-araqchi-blames-us-strait-hormuz-tensions-calls-diplomacy-2026-10-19/"}]},{"id":"top-australia-mp-attack-oct19","headline":"Australian lawmaker critically injured in vehicle attack","summary":"Independent member of Parliament Helen Haines was critically injured after a vehicle attack in Wangaratta, Australian officials said. Reuters and CNN reported the attack; authorities had not established a full motive early Monday.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"Reuters — Australian MP critically injured, Oct. 19","url":"https://www.reuters.com/world/asia-pacific/australia-pm-says-independent-mp-helen-haines-has-been-attacked-2026-10-19/"},{"label":"CNN — Helen Haines attack, Oct. 19","url":"https://www.cnn.com/2026/10/19/australia/helen-haines-australian-mp-attack-wangaratta-intl"}]},{"id":"top-oregon-school-investigation-oct19","headline":"Bend investigators examine motive and response after elementary-school attack","summary":"Investigators continued reconstructing how a 16-year-old killed three children and a teacher before an armed parent stopped him. CNN and AP reported that a teacher also tried to disarm the attacker; motive remained unknown.","sources":["CNN","Fox","Other"],"signal":"Consensus","links":[{"label":"CNN — Bend investigation, Oct. 19","url":"https://www.cnn.com/2026/10/19/us/bend-oregon-silver-rail-shooting"},{"label":"AP — Bend elementary-school attack","url":"https://apnews.com/article/oregon-school-shooting-silver-rail-elementary-b0642ec5cd3da0db24227a2798e2c6ce"},{"label":"Fox News — U.S. coverage","url":"https://www.foxnews.co nd Ron Perlman, died at 81, The Hollywood Reporter said.","sources":["Other"],"signal":"Watch","links":[{"label":"Hollywood Reporter — Ron Koslow obituary, Oct. 19","url":"https://www.hollywoodreporter.com/tv/tv-news/ron-koslow-dead-beauty-and-beast-linda-hamilton-ron-perlman-1236735493/"}]},{"id":"entertainment-hollywood-terms-trade-oct19","headline":"Producers and agents press for stronger streaming terms","summary":"At MIPCOM, independent producers and agents argued that production incentives alone will not fix Hollywood’s economics and called for modernized ownership and revenue terms. Variety reported the debate; no new industry rule has been adopted.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — producers seek modern streaming terms, Oct. 19","url":"https://variety.com/2026/film/news/agents-indie-producers-fin-syn-incentives-1236914193/"}]}]},"researchNotes":["Fresh research completed for Top News, USA, Boston Sports and Sports at the Monday 7 a.m. limited edition.","Business, World, Politics and Entertainment cards, links and Tells preserved byte-for-byte from the latest eligible Friday 7 p.m. edition.","WEEI/Audacy and Boston Globe checked; Globe access was partly paywalled and WEEI full article text was limited.","Official Patriots, NHL, NBA and MLB sources checked for Monday status, recent finals and upcoming schedules."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, international soccer, or WNBA coverage.',business:'7 unique business/markets stories refreshed only at 7 p.m. Eastern Monday through Friday, with independently confirmed figures for the latest completed U.S. cash session. Preserved unchanged at all other editions.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
