<script id="briefing" type="application/json">{"date":"2026-11-01","lastUpdated":"November 1, 2026, 7:04:27 p.m. EST Boston","dek":"Sunday evening limited refresh: Top News, USA, Boston Sports and Sports freshly researched and re-ranked; Business, World, Politics and Entertainment preserve Friday evening’s verified cards, links, original dates and Tells.","take":"Sunday adds a deadly Florida jet crash, a Michigan Democratic defection and a judicial setback for DOJ in Alaska. Fox foregrounds the crash and Stevens’ endorsement; CNN emphasizes Democratic reaction and election litigation, while Drudge highlights the crash, prices and Trump criticism. They overlap on major events, not on the truth of every political allegation; Drudge is an aggregator, not an independent reporting source.","sectionTakes":{"top":"Sunday adds a deadly Florida jet crash, a Michigan Democratic defection and a judicial setback for DOJ in Alaska. Fox foregrounds the crash and Stevens’ endorsement; CNN emphasizes Democratic reaction and election litigation, while Drudge highlights the crash, prices and Trump criticism. They overlap on major events, not on the truth of every political allegation; Drudge is an aggregator, not an independent reporting source.","usa":"Open enrollment and promised farm aid bring immediate household decisions alongside Murphy’s hospitalization. Camera oversight, caregiver support and election preparedness remain substantive issues, while charges and interim abortion rulings are not verdicts or final legal resolutions. Older measles reporting retains its actual date.","boston":"The Celtics’ 108–97 win is final; the Patriots lead 24–13 in progress, checked 7:03:10 p.m. EST, with no final inferred. Whitlock’s option joins Gray’s departure and current four-team reporting, while Brown and Henderson are out. Globe text was partly readable beneath paywall elements; WEEI/Audacy was checked but fresh full text remained limited.","business":"CONFIRMED Friday, Oct. 30 close: Dow 51,770.31, −572.25 (−1.09%); Nasdaq 25,437.00, −747.73 (−2.86%), for the completed 4 p.m. EDT cash session, independently checked with AP and CNBC. AI-spending concerns and Intel’s outlook drove selling even as oil producers profited. SEC scrutiny is not a fraud finding, and prospective cannabis tax benefits are not realized refunds.","world":"Ethiopia’s attributed camp toll and Novaya Gazeta’s announced closure lead a page of distinct humanitarian and institutional pressures. Oleshky’s evacuation is local relief, not a general ceasefire; Poland’s confrontation remains a judicial-authority dispute. China’s bilateral outreach, Greenland’s airport and the pope’s AI appeal describe concrete developments without assuming promised outcomes.","sports":"Sunday’s completed NFL results and New York marathon winners replace Saturday’s recaps. Jackson’s surgery is confirmed by his coach, but a season-ending absence remains possible rather than certain. The AP poll is distinct from playoff selection, and no displayed win clinches a division.","politics":"Heavy advance voting and Musk’s spending show mobilization, not the final result. Trump’s restored rallies and Michigan’s ad dispute expose different campaign pressures, while Ohio’s ad withdrawal is not a legal judgment. Comey’s hearing produced no ruling, and AP’s fact check rejects specific viral claims rather than validating a broader fraud narrative.","entertainment":"Qualley and Antonoff’s filing and Ross’ partial charge dismissal are different legal stages, not fully concluded cases. Franklin and Daddy Yankee chart new musical directions, while the Stewart appreciation adds stage-career context. AddamsFest supplies timely Halloween culture, and the earlier-dated Gentle Monster review remains criticism of fiction."},"sections":{"top":[{"id":"top-plane-n1e","headline":"Duffy: All nine aboard jet killed in Palm Beach County crash","summary":"Transportation Secretary Sean Duffy said all nine people aboard the Learjet 60 died when it crashed Sunday, AP reports. DeSantis said there were no immediate reports of ground casualties. The FAA and NTSB are investigating; weather conditions and pilot reports do not yet establish the cause.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/palm-beach-plane-crash-ffdee609e7916ff7fcd178d2b8e69b39","label":"AP — Nov. 1, updated 6:43 p.m. EST"},{"url":"https://www.drudgereport.com/","label":"Drudge Report — Nov. 1 aggregation; not independent confirmation"}]},{"id":"top-stevens-n1e","headline":"Haley Stevens endorses Republican Mike Rogers, breaking Michigan Democratic unity","summary":"AP and CNN independently report Stevens endorsed Rogers Sunday after losing the Democratic primary to Abdul El-Sayed. Her top aide quit, and El-Sayed dismissed the defection as irrelevant to voters’ concerns. This is a completed endorsement, superseding Friday’s planned unity appearance, not evidence of how Michigan will vote.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/elsayed-michigan-stevens-democrats-unity-midterms-d7053bbd0ed2fd70756896c6e4b66a27","label":"AP — Nov. 1, updated 6:24 p.m. EST"},{"url":"https://www.cnn.com/2026/11/01/politics/live-news/midterm-election-congress","label":"CNN — Nov. 1 live coverage"},{"url":"https://www.foxnews.com/live-news/midterm-elections-2026-trump-iowa-kansas-november-1","label":"Fox News — Nov. 1 live coverage"}]},{"id":"top-alaska-n1e","headline":"Judge dismisses DOJ effort to block Alaska Senate certification; appeal follows","summary":"AP’s Nov. 1 report says a judge dismissed the lawsuit seeking to block certification if Republican Dan Sullivan loses. DOJ filed notice of appeal. The dispute concerns another candidate with the same name; accusations about a spoiler scheme remain allegations, and neither this ruling nor the appeal establishes an election outcome.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/alaska-senate-dan-sullivan-peltola-investigation-b35acffc8b55ef58679d9b8395760f98","label":"AP — Nov. 1, updated 4:19 p.m. EST"}]},{"id":"top-iran-n1e","headline":"Gulf residents brace for possible renewed Iran fighting after midterms","summary":"CNN’s updated Nov. 1 reporting describes uncertainty across Gulf states as Trump leaves open further strikes and Tehran threatens retaliation. Reuters video coverage independently records Trump saying “anything’s possible.” These are threats and contingency concerns, not confirmation of resumed strikes or a reopened Strait of Hormuz; the earlier reopening timetable remains unverified.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/31/middleeast/gulf-braces-us-midterms-intl","label":"CNN — updated Nov. 1, 3:53 p.m. EST"},{"url":"https://www.reuters.com/video/watch/idRW373428102026RP1/","label":"Reuters — Trump remarks; independently checked Nov. 1"}]},{"id":"top-shootings-n1e","headline":"Officials: Halloween-weekend shootings leave at least six dead across US","summary":"AP’s Sunday evening roundup reports at least six deaths and dozens of injuries in nightlife districts across several states. Dallas police reported four deaths and 15 injuries in Deep Ellum; the reporting also covers Birmingham. The figures are attributed official counts, not a finding that the separate attacks were connected.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/alabama-shooting-birmingham-22eb299b80705cae19e2e5b425459c63","label":"AP — Nov. 1, updated 6:38 p.m. EST"}]},{"id":"top-california-e30","headline":"DOJ official signals likely Supreme Court appeal over California mail ballots","summary":"Acting Deputy Attorney General Trent McCotter said Saturday the Supreme Court is probably the next step after an appeals court rejected emergency ballot segregation, Reuters reports. CNN reports Newsom’s new call for judges to scrutinize any efforts to seize election materials. A contemplated appeal is not a filed or granted Supreme Court order; the government’s noncitizen allegations remain disputed.","sources":["Other","CNN"],"signal":"Watch","links":[{"url":"https://www.reuters.com/legal/government/us-campaign-control-congress-enters-final-weekend-2026-10-31/","label":"Reuters — Oct. 31 court developments"},{"url":"https://www.cnn.com/2026/10/31/politics/live-news/midterm-election-congress","label":"CNN — Oct. 31 live updates"}]},{"id":"top-binance-oct30","headline":"FBI attributes more-than-$6 billion Binance theft to North Korea","summary":"The FBI said Saturday that North Korea was responsible and that stolen assets were being converted into ethereum, Reuters reports. That official attribution is a substantive advance beyond the earlier private-security assessment. The bureau expects additional laundering stages; neither its statement nor Binance’s promise to cover losses establishes that investigators have recovered all stolen funds.","sources":["Other","Drudge"],"signal":"Watch","links":[{"url":"https://www.reuters.com/world/fbi-links-north-korea-theft-6-billion-from-binance-2026-10-31/","label":"Reuters — Oct. 31 FBI statement"},{"url":"https://www.drudgereport.com/","label":"Drudge Report — aggregator checked Oct. 31 evening"}]},{"id":"top-wsj-e31","headline":"Judge dismisses Trump’s $10 billion Journal lawsuit with prejudice","summary":"Judge Darrin Gayles ruled Saturday that Trump again failed to show actual malice in the Journal’s reporting on his Epstein ties, AP and Reuters independently report. Dismissal with prejudice bars refiling the same claim in that court; it does not resolve every dispute about Epstein or eliminate ordinary appellate options. Trump has denied authorship of the disputed letter.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/trump-media-lawsuit-wall-street-journal-dismissed-f27c9fa832044f2f9edea9b1fbbba061","label":"AP — updated Oct. 31, 5:53 p.m. EDT"},{"url":"https://www.reuters.com/world/us-judge-dismisses-trumps-lawsuit-against-wall-street-journal-with-prejudice-2026-10-31/","label":"Reuters — Oct. 31"}]},{"id":"top-afghan-e31","headline":"Court documents describe planned Afghan deportations through Pakistan","summary":"AP’s Saturday update says the administration plans removals via Pakistan to Afghanistan, with flights potentially starting Monday. Reuters separately cites a U.S. official confirming the Pakistan route. Advocacy groups warn of Taliban retaliation; DHS declined to discuss future operations. These are reported plans and risks, not confirmation that the flights or onward removals have occurred.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/afghans-deportation-pakistan-trump-immigration-bfbc0e3dc2ee1c19fa5ec64d08468d98","label":"AP — updated Oct. 31, 6:40 p.m. EDT"},{"url":"https://www.reuters.com/legal/government/trump-administration-plans-deport-some-afghan-immigrants-afghanistan-2026-10-31/","label":"Reuters — Oct. 31 page; reporting dated Oct. 30"}]},{"id":"top-executive-n1","headline":"Reuters: White House prepares executive-action plans for possible divided government","summary":"A White House official and two people familiar with the plans told Reuters officials have prepared potential executive actions and responses to congressional investigations. The reported work covers immigration, tariffs, housing and spending. The White House rejects predictions of Republican losses; contingency planning is neither an election result nor proof every proposed action would be lawful.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/legal/government/trump-white-house-maps-path-govern-without-congress-if-democrats-win-2026-11-01/","label":"Reuters — Nov. 1; attributed contingency planning"}]}],"usa":[{"id":"usa-aca-n1e","headline":"ACA enrollment opens amid higher rates and tighter eligibility checks","summary":"AP’s Nov. 1 guide says marketplace enrollment begins Sunday in most states and runs through Jan. 15. The report describes expiring financial assistance, rising rates and stricter checks; details vary by state and household. Consumers should verify their own plan, subsidy eligibility and local deadline rather than assume last year’s coverage automatically remains the best option.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/trump-aca-obamacare-healthcare-insurance-032c364c133c4ff97f3d09c51c209253","label":"AP — Nov. 1, updated 12:11 p.m. EST"}]},{"id":"usa-murphy-n1e","headline":"Chris Murphy hospitalized after stroke; office says he is awake and alert","summary":"Murphy’s chief of staff says the Connecticut senator experienced arm numbness Saturday and was transferred to Johns Hopkins for monitoring, AP reports. His office says he is responding well and doctors are encouraged. Optimism about full recovery is attributed to his team, not a completed medical outcome.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/chris-murphy-stroke-senate-connecticut-61676279143ddcc6f0de5f058fc6495a","label":"AP — Nov. 1, updated 3:48 p.m. EST"}]},{"id":"usa-farmers-n1e","headline":"USDA promises more than $15 billion in farm initiatives before midterms","summary":"AP reports payments, loan guarantees and other initiatives announced in recent weeks, alongside separately planned safety-net payments. Economists interviewed say temporary support can help producers without resolving high input costs and uncertainty. Promised programs and guarantees are not equivalent to $15 billion already disbursed in cash.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/farmers-ranchers-midterms-agriculture-payments-trump-113757ded4631a2debfa184a36c4d85e","label":"AP — Nov. 1, updated 4:55 p.m. EST"}]},{"id":"usa-flock-n1","headline":"Atlanta backlash puts license-plate camera safeguards under scrutiny","summary":"CNN’s Sunday investigation describes a mistaken police stop and growing objections to Flock cameras in the company’s hometown. Police records say officers sought a different man with a similar car; the stopped driver was released after identification. The report raises oversight and privacy questions without establishing that every camera alert or police use is unlawful.","sources":["CNN"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/11/01/us/flock-cameras-atlanta-privacy-backlash","label":"CNN — Nov. 1, 6:30 a.m. EST"}]},{"id":"usa-caregivers-n1","headline":"Family caregivers describe being left without practical training","summary":"CNN’s Sunday health report follows caregivers who struggled with falls, bathing and complex medical tasks without hands-on instruction. Their experiences highlight gaps in support and training rather than establishing that every assistance program offers none. The story concerns unpaid and family care, not a newly enacted nationwide benefit.","sources":["CNN"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/11/01/health/no-training-for-family-caregivers-wellness","label":"CNN — Nov. 1, 6:30 a.m. EST"}]},{"id":"top-security-n1","headline":"Election officials warn of weakened federal threat-sharing before midterms","summary":"CNN’s Sunday reporting, based on interviews with nearly a dozen election-security experts, describes damaged communication channels and foreign influence threats. The administration has attempted to rebuild some election-security work after cuts. These are attributed assessments of preparedness, not evidence that a foreign actor changed votes or that Tuesday’s result is compromised.","sources":["CNN"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/11/01/politics/election-threats-federal-preparations","label":"CNN — Nov. 1, 5 a.m. EST"}]},{"id":"usa-racecalls-n1","headline":"How newsrooms will call midterm races before every ballot is counted","summary":"Reuters explains Sunday that AP calls a race when the trailing candidate cannot catch up, while Decision Desk HQ requires unanimous team agreement and senior approval. Different networks use their own models and data arrangements. A media projection is not official certification; close races may remain unresolved well after election night.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/business/media-telecom/how-us-news-organizations-will-make-midterm-race-calls-2026-11-01/","label":"Reuters — Nov. 1 race-call explainer"}]},{"id":"top-houston-e30","headline":"Attorney: Indicted Houston ICE officer will surrender Monday","summary":"Mario Alberto Morales plans to turn himself in Monday after Friday’s aggravated-assault indictment, his attorney told AP Saturday. Prosecutors allege he intentionally struck Miguel Parra Hernandez with an SUV; the defense calls it an accident. Hernandez is recovering from a broken leg while in federal custody. A surrender plan is not a completed booking or a conviction.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/houston-texas-ice-agent-charged-aggravated-assault-67bcdb11f7ed19aef2100e5c2a83f773","label":"AP — updated Oct. 31, 5:13 p.m. EDT"}]},{"id":"usa-idaho-e31","headline":"Appeals court pauses Idaho health-saving abortion ruling during appeal","summary":"Reuters reports a divided Ninth Circuit panel Friday stayed a judge’s ruling protecting health-saving abortions. The earlier relief had already been narrowed to the doctor who sued. The majority said the constitutional claim was unlikely to succeed; the dissent warned of serious health risks. This is interim appellate relief, not a final resolution of all Idaho emergency-care litigation.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/legal/government/us-court-lifts-ruling-requiring-idaho-allow-some-abortions-protect-womens-health-2026-10-30/","label":"Reuters — Oct. 30 court report"}]},{"id":"usa-measles-o31","headline":"Pennsylvania measles outbreak prompts new openness to vaccination","summary":"AP’s Friday field reporting describes a historic outbreak affecting Amish and conservative Mennonite communities, alongside increased willingness among some residents to receive vaccines. Attitudes vary across the communities and are not dictated by one universal religious prohibition. The reporting documents changing responses to a health emergency, not proof that transmission is contained.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/measles-outbreak-vaccination-amish-mennonite-pennsylvania-8f4fcd6e089e09a94c61a41d0ea474f4","label":"AP — Oct. 30, 12:13 p.m. EDT"}]}],"boston":[{"id":"boston-saturday-status-o31","headline":"Sunday Boston: Celtics beat Magic 108–97; Patriots lead Miami 24–13 in fourth","summary":"FINAL Sunday, Nov. 1: Celtics 108, Magic 97. LIVE — IN PROGRESS: Patriots 24, Dolphins 13, 9:15 remaining in the fourth quarter, checked 7:03:10 p.m. EST on ESPN; Globe independently reported 24–13 at 12:39 in the fourth. No final is inferred. Bruins and Red Sox are off today; Red Sox season is complete. FINAL Saturday, Oct. 31: Bruins 5, Blackhawks 4, OT; Celtics, Patriots and Red Sox did not play Saturday. FINAL Friday, Oct. 30: Celtics 125, Bulls 111.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.nba.com/game/bos-vs-orl-0022600154","label":"NBA — Nov. 1 official Celtics final"},{"url":"https://www.espn.com/nfl/game/_/gameId/401873034","label":"ESPN — live Patriots score checked 7:03:10 p.m. EST"},{"url":"https://www.bostonglobe.com/2026/11/01/sports/patriots-dolphins-live-score-news-updates/","label":"Boston Globe — Nov. 1 live updates"},{"url":"https://www.patriots.com/schedule/","label":"Patriots — official schedule"},{"url":"https://www.nhl.com/gamecenter/chi-vs-bos/2026/10/31/2026020217","label":"NHL — Oct. 31 Bruins final"}]},{"id":"boston-celtics-n1e","headline":"Tatum’s 32 points and late stops extend Celtics’ winning streak to five","summary":"The Globe reports Boston beat Orlando 108–97 Sunday behind 32 points from Tatum and key fourth-quarter defensive plays. The official NBA gamecenter and an independently opened CelticsBlog recap match the final. George added 17 points and eight assists; this is a completed win, not a prediction about the next game.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.bostonglobe.com/2026/11/01/sports/celtics-magic/","label":"Boston Globe — Nov. 1 recap"},{"url":"https://www.celticsblog.com/celtics-scores-results/149094/celtics-magic-recap-jayson-tatum-paul-george-neemias-queta","label":"CelticsBlog — Nov. 1 independent recap"}]},{"id":"boston-whitlock-n1e","headline":"Red Sox exercise Whitlock’s $8.25 million option for 2027","summary":"The Globe reports the Red Sox exercised Garrett Whitlock’s 2027 option Sunday, keeping their setup reliever under contract. It reports a 1.72 ERA in 2026 and rest prescribed for a fractured right tibia, with an otherwise normal offseason expected. The option decision is reported as complete; the medical outlook remains an expectation rather than proof of recovery.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.bostonglobe.com/2026/11/01/sports/red-sox-garrett-whitlock-team-option-2027/","label":"Boston Globe — Nov. 1 option decision"}]},{"id":"boston-brown-e30","headline":"Brown and Henderson ruled out; Patriots play without both in Miami","summary":"New England’s Saturday roster analysis confirms A.J. Brown (ankle/knee) and TreVeyon Henderson (illness) did not travel and were ruled out for Sunday. The team signed Lan Larison to its 53-man roster and elevated Ryan Miller from the practice squad. The Globe independently reports the downgrades. Friday’s questionable designations are superseded; no recovery date is promised.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.patriots.com/news/roster-analysis-patriots-downgrade-wr-a-j-brown-rb-treveyon-henderson-to-out-for-week-8-vs-dolphins","label":"Patriots — Oct. 31, 4 p.m."},{"url":"https://www.bostonglobe.com/2026/10/31/sports/patriots-aj-brown-treveyon-henderson-out-dolphins/","label":"Boston Globe — Oct. 31"},{"url":"https://www.audacy.com/weei/sports","label":"WEEI/Audacy — checked Oct. 31 evening; fresh full text limited"}]},{"id":"boston-bruins-rally-e31","headline":"Geekie’s late equalizer and Lindholm’s overtime goal rescue Bruins","summary":"Boston erased a 4–2 third-period deficit to beat Chicago 5–4 Saturday. Geekie tied it with 12 seconds left; Lindholm won it in overtime, AP’s ESPN recap and the Globe confirm. DiPietro kept Boston close despite a 41–32 shot disadvantage. Sturm welcomed the points but criticized slow starts and hesitant shooting; the rally does not erase those concerns.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.espn.com/nhl/recap/_/gameId/401892614","label":"AP via ESPN — Oct. 31 final"},{"url":"https://www.bostonglobe.com/2026/10/31/sports/bruins-blackhawks-game-score/","label":"Boston Globe — Oct. 31 postgame analysis"}]},{"id":"boston-pastrnak-n1","headline":"Pastrnak passes Bergeron for third on Bruins’ career goals list","summary":"Pastrnak scored his 428th goal for Boston in Saturday’s overtime win, moving one ahead of Patrice Bergeron, the Globe reports with an embedded Bruins announcement. His eighth goal this season leaves Phil Esposito’s 459 and John Bucyk’s 545 still ahead. The milestone is complete; projections about when he might pass either are not.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.bostonglobe.com/2026/10/31/sports/david-pastrnak-bruins-all-time-goals/","label":"Boston Globe — Oct. 31 milestone report"}]},{"id":"boston-gray-o31","headline":"Red Sox decline Sonny Gray’s $30 million option, making him a free agent","summary":"AP’s overnight contract roundup reports Boston declined Gray’s mutual option and owes a $5 million buyout payable in five annual installments. The decision opens a pitching-roster question rather than announcing a replacement signing. It is separate from Thursday’s Eaton and Cheng trades and from Durbin’s medical rehabilitation.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/alcantara-king-bichette-options-c94a7f278a2807dae923208951ce04df","label":"AP — updated Oct. 31, 12:46 a.m. EDT"}]},{"id":"boston-queta-e31","headline":"Queta acknowledges foul-control problem after steadier game against Chicago","summary":"The Globe’s Saturday notebook says Queta recognized that his late foul against Brooklyn helped force Tuesday’s overtime. He rebounded Friday with 13 points, six rebounds and one foul in 20 minutes against Chicago. The contrast is meaningful progress, not proof the recurring problem is fixed. Mazzulla’s criticism focuses on keeping a useful center available on the court.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.bostonglobe.com/2026/10/31/sports/celtics-neemias-queta-joe-mazzulla/","label":"Boston Globe — Oct. 31 notebook"}]},{"id":"boston-durbin-oct30","headline":"Durbin’s foot repair adds second operation to Red Sox offseason","summary":"Boston announced a partial excision of the fifth metatarsal base with tendon repair after Durbin’s earlier pinkie operation. MLB’s Thursday report says the foot injury predated the procedure and Boston expects a healthy start to 2027. An expected recovery is not completed rehabilitation.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.mlb.com/news/caleb-durbin-surgery-right-foot-fracture","label":"MLB — Oct. 29; rechecked Oct. 30"}]},{"id":"boston-tatum-rank-n1","headline":"Bob Ryan dissects ranking that places Tatum ninth among current NBA players","summary":"The Globe’s Sunday column examines USA Today’s top-100 list, which places Tatum ninth and also includes Derrick White, Payton Pritchard and Paul George. Ryan treats rankings as material for debate, not objective measurement. This is current Celtics analysis, not ue. AP and CNN independently report Friday’s announcement and the editors’ account of official pressure. The announced shutdown date should not be confused with a claim that all operations had already ended Friday.","sources":["Other","CNN"],"signal":"Watch","links":[{"url":"https://apnews.com/article/novaya-gazeta-muratov-russia-crackdown-putin-war-ukraine-f73ceb88bd2ef1c65e786a336e6e12db","label":"AP — updated Oct. 30, 11 a.m. EDT"},{"url":"https://www.cnn.com/2026/10/30/business/novaya-gazeta-russian-newspaper-shutdown-intl","label":"CNN — Oct. 30 independent report"}]},{"id":"world-oleshky-e30","headline":"Oleshky residents begin evacuation under rare joint relief operation","summary":"Reuters reports residents of the Russian-held town began leaving Friday through an arrangement involving both sides of the war. The operation offers localized humanitarian access after months of negotiations. It does not establish a wider ceasefire or resolve the war, despite political efforts to claim diplomatic credit.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/world/europe/why-is-evacuation-oleshky-by-russia-ukraine-happening-now-2026-10-30/","label":"Reuters — Oct. 30 reported explainer"}]},{"id":"world-poland-e30","headline":"Polish tribunal suspension dispute draws protests and police intervention","summary":"Police detained three people Friday as protesters challenged the court president’s suspension, AP reports. President Nawrocki cut short his Senegal flight to return. The confrontation reflects a dispute over judicial authority; protesters’ claims of wrongful suspension are not a settled legal judgment.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/poland-european-union-justice-protests-police-tribunal-67eda2e3a151e00038d85a5e894a2a72","label":"AP — updated Oct. 30, 4:15 p.m. EDT"}]},{"id":"world-germany-e30","headline":"Xi urges pragmatic German policy amid mounting EU trade friction","summary":"Xi nosis is attributed and not yet a confirmed recovery timetable.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/baltimore-ravens-qb-lamar-jackson-0baebd49f4865d674f0a877d39cd39d3","label":"AP — Nov. 1, updated 5:27 p.m. EST"}]},{"id":"sports-marathon-n1e","headline":"Chepkirui and debutant Almgren win New York City Marathon","summary":"AP reports Sheila Chepkirui won the women’s race in 2:24:36 and Andreas Almgren won his marathon debut. American Jessica McClain finished second in the women’s race. These are completed New York results, independently matched by the Globe’s race report.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/marathon-nyc-d0cb13c06ec5c5e72c40ae62b1e96218","label":"AP — Nov. 1, updated 2:40 p.m. EST"}]},{"id":"sports-lions-n1e","headline":"Lions hand Vikings first loss, 19–15, on late Goff-to-Williams score","summary":"AP reports Jared Goff threw the go-ahead seven-yard touchdown to Jameson Williams with 4:35 left Sunday. Detroit’s defense then held Minnesota to a three-and-out. The victory ends Minnesota’s unbeaten start; it does not settle the NFC North race.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/vikings-lions-score-ade801463750558ffd55a208fa261d2f","label":"AP — Nov. 1, updated 5:45 p.m. EST"}]},{"id":"sports-bengals-n1e","headline":"Burrow’s five touchdown passes and overtime run lift Bengals 43–36","summary":"AP reports Joe Burrow ran for the overtime touchdown as Cincinnati rallied past Tennessee Sunday. The Bengals won their third straight game, while Tennessee could not convert its answering overtime possession. The score is final, not an in-progress lead.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/titans-bengals-score-2467bd1f54600543ff6cbaa265fd6281","label":"AP — Nov. 1, updated 5:07 p.m. EST"}]},{"id":"sports-cards-n1e","headline":"Ryland rebounds from missed PAT to win Cardinals–Cowb ","headline":"Ramaswamy ad featuring Acton’s estranged mother comes off air","summary":"AP’s Thursday-night report says the Ohio Republican spent about a quarter of the initially announced amount before the ad stopped running. The report describes criticism of its use of Acton’s family history. The withdrawal is a campaign advertising change, not a court finding about the candidates’ claims.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/ohio-ramaswamy-ad-acton-mother-365745259579371f41122b184254fdde","label":"AP — updated Oct. 29, 10:46 p.m. EDT"}]},{"id":"politics-voting-facts-eve29","headline":"AP debunks ballot-envelope and poll-worker marking claims","summary":"AP’s Thursday fact check explains that Ventura County envelope holes serve accessibility and processing purposes rather than revealing votes to rig the election. It also addresses other viral voting-process claims. The explanations rebut the specific examples examined; a social-media allegation alone is not proof of invalid ballots.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/fact-check-midterms-election-voting-ballot-5933df3747ceaf6091324959d8b9c59b","label":"AP — updated Oct. 29, 1:38 p.m. EDT"}]}],"entertainment":[{"id":"ent-qualley-e30","headline":"Margaret Qualley and Jack Antonoff file for divorce","summary":"Court records show an uncontested matrimonial action filed Friday in Brooklyn after three years of marriage, AP reports. Qualley is the plaintiff and Antonoff the defendant. Filing is not a final divorce judgment, and the records do not establish a public explanation for the separation.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/antonoff-qualley-divorce-a853342b11bf53867e103680d7b861ba","label":"AP — updated Oct. 30, 6:44 p.m. EDT"}]},{"id":"ent-ross-e30","headline":"Prosecutors drop Rick Ross felony count; misdemeanor case continues","summary":"Miami-Dade prosecutors dropped battery by strangulation for insufficient evidence, AP reports Friday. Ross still faces a misdemeanor domestic-battery charge and has pleaded not guilty. Dismissal of one count does not mean the entire case ended or that the remaining allegation has been proven.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/rick-ross-arrest-miami-beach-florida-9c5bb3af32cd3381dd95bb64e8e31ebf","label":"AP — updated Oct. 30, 12:45 p.m. EDT"}]},{"id":"ent-kirk-e30","headline":"Kirk Franklin embraces a less apologetic turn on new album","summary":"In AP’s Friday interview, the gospel star discusses “I Am What I Am,” collaborations and criticism of his work with artists outside gospel. The 14th studio album frames his current artistic outlook. His reflections are the artist’s perspective, not a universal assessment of the record’s reception.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/kirk-franklin-interview-fa06a5ef09722713549309789ee34eb7","label":"AP — updated Oct. 30, 6:52 p.m. EDT"}]},{"id":"ent-yankee-e30","headline":"Daddy Yankee’s “La Postal” turns reggaeton toward a concept album about love","summary":"AP’s Friday review describes 15 tracks built around romantic, familial and spiritual love. The release marks another move after his retirement announcement and subsequent faith-centered work. The evaluation is criticism, not evidence of commercial performance or a return to every aspect of his old touring career.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/daddy-yankee-la-postal-music-review-a872077854a18726532a5840b2dc097b","label":"AP — updated Oct. 30, 11:07 a.m. EDT; music review"}]},{"id":"ent-stewart-e30","headline":"Stewart appreciation traces the stage career behind his screen fame","summary":"AP’s Friday appreciation revisits Patrick Stewart’s Shakespearean work and repeated returns to theater after “Star Trek” and “X-Men.” The perspective adds substantive career context following his death rather than recycling an unverified medical explanation. It is a critical remembrance, not a new cause-of-death report.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/patrick-stewart-shakespeare-theater-appreciation-9fe4ffe6024a270aad3a456ae26a11b7","label":"AP — updated Oct. 30, 11:38 a.m. EDT"}]},{"id":"ent-addams-e30","headline":"Westfield turns Charles Addams’ hometown into Halloween destination","summary":"AP’s Thursday feature describes AddamsFest, transformed storefronts and the New Jersey landmarks that inspired the cartoonist’s macabre style. The seasonal celebration has immediate Halloween relevance. It is a local cultural event, not an announcement of a new film or television production.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/addams-family-author-hometown-new-jersey-halloween-3af3a0164d3a20996e2beeb0effdee83","label":"AP — updated Oct. 29, 10:26 a.m. EDT"}]},{"id":"entertainment-gentle-oct28eve","headline":"“Gentle Monster” review examines denial inside a family drama","summary":"AP critic Lindsey Bahr’s Wednesday review highlights Léa Seydoux’s restrained performance in Marie Kreutzer’s film about a family confronted by a criminal investigation. The review questions the excuses people make for loved ones. These are assessments of fiction, not allegations about the actors or filmmakers.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/gentle-monster-movie-review-918881df1a322ae09fc019c9fd0a57a5","label":"AP — updated Oct. 28, 11:52 a.m. EDT; film review"}]}]},"researchNotes":["Sunday Nov. 1 evening weekend cadence; four eligible tabs researched/reranked, four preserved exactly from Friday evening. No market research; schedule unchanged. EST Boston UTC-5 after DST transition. Source URLs normalized and deduplicated before fetching.","Fox/CNN/Drudge checked at runtime. AP/CNN independently match Stevens endorsement; AP reports Florida crash official toll; Drudge aggregation is not independent confirmation. Alaska dismissal and DOJ appeal supersede earlier probe-only framing. Election outcomes, aircraft cause and renewed Iran strikes are not inferred.","Celtics 108–97 final verified official NBA plus Globe/CelticsBlog. Patriots live score and quarter explicitly time-stamped from ESPN with Globe corroboration of the earlier same-score state; never inferred final. Bruins/Red Sox off Sunday. Globe partly readable beneath paywall; WEEI/Audacy checked but limited fresh text.","All four refreshed tabs reranked against fresh coverage. Superseded duplicate rally and Birmingham-only cards removed; broader shootings report replaces the latter. Excluded stale Four Corners and Colorado hiking articles by actual dates. Sports exclusions enforced, including zero WNBA."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, international soccer, or WNBA coverage.',business:'7 unique business/markets stories refreshed only at 7 p.m. Eastern Monday through Friday, with independently confirmed figures for the latest completed U.S. cash session. Preserved unchanged at all other editions.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
