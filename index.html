een confirmed; Trump earlier said the United States would help Russia.","sources":["Fox","CNN","Other"],"signal":"Watch","links":[{"label":"Reuters — Trump says U.S. will help Russia after lab death, Oct. 5","url":"https://www.reuters.com/world/us/trump-says-us-will-help-russia-after-siberia-plague-institute-death-2026-10-05/"},{"label":"CNN — Russian lab worker dies after unknown infection; plague unconfirmed","url":"https://www.cnn.com/2026/10/04/europe/russia-laboratory-plague-accident-intl"},{"label":"Fox News — Russia lab death prompts U.S. monitoring, Oct. 5","url":"https://www.foxnews.com/world/mystery-death-russian-plague-lab-triggers-sweeping-precautions-us-watches-closely"},{"label":"Drudge Report — selected plague coverage (aggregator)","url":"https://www.drudgereport.com/"}]},{"id":"top-scotus-climate-arguments-oct5","headline":"Oct. 5: Supreme Court hears oil firms’ bid to block climate-liability suits; no ruling","summary":"The justices heard arguments in Exxon Mobil and Suncor’s challenge to Boulder-area climate-liability litigation. Several appeared skeptical of the companies’ arguments, according to The Hill; Justice Samuel Alito is recused, and the Court issued no decision.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"Reuters — Supreme Court weighs oil companies’ challenge, Oct. 5","url":"https://www.reuters.com/sustainability/cop/us-supreme-court-weighs-bid-by-oil-companies-avoid-climate-lawsuit-2026-10-05/"},{"label":"CNN — Court opens climate-liability case, Oct. 5","url":"https://www.cnn.com/2026/10/05/politics/climate-change-supreme-court-suncor-exxon-boulder"},{"label":"The Hill — justices appear skeptical during Oct. 5 arguments","url":"https://thehill.com/policy/energy-environment/6129978-oil-companies-supreme-court-skepticism/"}]},{"id":"top-yemen-houthi-offensive-oct5","headline":"Oct. 5: Yemen’s government opens campaign against Houthis near key shipping route","summary":"Saudi-backed Yemeni government forces report gains toward Mocha and Bab el-Mandeb as the government says it has begun a major operation against Houthi-held territory. Houthis separately claimed attacks on Saudi sites; battlefield control and the claimed strikes remain unverified or disputed.","signal":"Watch","sources":["Other"],"links":[{"label":"Reuters — Yemen government says forces gained near Bab el-Mandeb, Oct. 5","url":"https://www.reuters.com/world/yemeni-government-forces-seize-district-by-bab-el-mandeb-military-sources-say-2026-10-05/"},{"label":"CNN — Saudi-backed Yemeni forces attack Houthis near trade route, Oct. 4","url":"https://www.cnn.com/2026/10/04/middleeast/yemen-offensive-houthis-intl"},{"label":"Reuters — Yemen government launches major offensive, Oct. 4","url":"https://www.reuters.com/world/asia-pacific/head-yemens-presidential-council-announces-military-operations-retake-territory-2026-10-04/"}]},{"id":"top-brazil-complete-runoff-oct5","headline":"Oct. 5 update: Brazil runoff is set; Flávio Bolsonaro wins endorsements after first round","summary":"The completed first-round count puts Flávio Bolsonaro at 47.0% and President Luiz Inácio Lula da Silva at 45.1%, setting an Oct. 25 runoff. Reuters reports Bolsonaro later won endorsements from two right-wing rivals; neither candidate has won the runoff.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"Reuters — completed Brazil first-round results, Oct. 4","url":"https://www.reuters.com/graphics/BRAZIL-ELECTION/RESULTS/znpngxgarvl/"},{"label":"Reuters — Bolsonaro wins endorsements for runoff, Oct. 5","url":"https://www.reuters.com/world/americas/bolsonaro-wins-endorsements-right-wing-rivals-brazil-election-runoff-2026-10-05/"},{"label":"CNN — Brazil runoff and campaign context, Oct. 5","url":"https://www.cnn.com/2026/10/05/americas/brazil-election-runoff-takeaways-intl-hnk"}]},{"id":"top-us-mexico-border-shooting-claims-oct5","headline":"Oct. 5: Mexico seeks evidence after U.S. says Coast Guard personnel came under fire at border","summary":"U.S. Ambassador Ronald Johnson said shots were fired at Coast Guard personnel near the Texas–Tamaulipas border. Mexican President Claudia Sheinbaum said Mexican forces had detected no such incident and requested evidence; the competing accounts remain unresolved.","signal":"Watch","sources":["Other","Fox"],"links":[{"label":"Reuters — Mexico demands evidence of alleged border shots, Oct. 5","url":"https://www.reuters.com/world/mexico-demands-evidence-alleged-cross-border-shots-after-us-ambassador-comments-2026-10-05/"},{"label":"Al Jazeera — Mexico seeks evidence after border-shooting report, Oct. 5","url":"https://www.aljazeera.com/news/2026/10/5/mexico-seeks-evidence-of-border-shooting-that-prompted-us-troop-deployment"},{"label":"Fox News — Coast Guard personnel exchange gunfire at border","url":"https://www.foxnews.com/world/coast-guard-personnel-exchange-gunfire-shooters-us-mexico-border"}]},{"id":"top-nantucket-search-suspended-oct5","headline":"Oct. 5 update: Coast Guard search suspended with six still missing after Nantucket air-ambulance crash","summary":"The Coast Guard suspended its search Sunday after 66 hours; six occupants remain unaccounted for and a debris field was identified as belonging to the medical aircraft, BBC reports. Search suspension is not confirmed recovery or a final casualty determination.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"BBC — search ended after 66 hours, Oct. 5","url":"https://www.bbc.com/news/articles/cme3x85013llo"},{"label":"AP/NBC Boston — Coast Guard search update, Oct. 4","url":"https://www.nbcboston.com/news/local/boston-missing-plane-search-continues-coast-guard-to-provide-update/4025303/"}]},{"id":"top-b1-raf-bombers-ap-oct5","headline":"Oct. 5: U.S. Air Force withdraws bombers from RAF Fairford amid suspected attack probe","summary":"The U.S. Air Force withdrew its bombers from the British base after authorities’ suspected-attack investigation and arrests, AP reports. The investigation continues; arrests do not establish guilt or prove a planned attack.","sources":["Other","Drudge"],"signal":"Watch","links":[{"label":"AP — all bombers withdrawn from RAF Fairford, Oct. 5","url":"https://apnews.com/article/bombers-raf-fairford-iran-5280111d976b89a6245f277e8b899f8f"},{"label":"Reuters — B-1 bombers removed from UK base, Oct. 4","url":"https://www.reuters.com/world/uk/us-removes-b-1-bombers-uk-base-amid-security-concerns-2026-10-04/"}]},{"id":"top-nobel-medicine-2026-oct5","headline":"Oct. 5: Nobel Medicine Prize goes to Deisseroth, Hegemann and Nagel for optogenetics","summary":"The Nobel Assembly awarded Karl Deisseroth, Peter Hegemann and Georg Nagel the 2026 physiology-or-medicine prize for discoveries that made it possible to control individual nerve cells with light. The Nobel committee’s official announcement confirms the laureates and citation.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"Nobel Prize — official 2026 Medicine award announcement, Oct. 5","url":"https://www.nobelprize.org/prizes/medicine/2026/press-release/"},{"label":"Reuters — three scientists win 2026 Medicine Nobel, Oct. 5","url":"https://www.reuters.com/business/healthcare-pharmaceuticals/deisseroth-hegemann-nagelwin-2026-nobel-medicine-prize-2026-10-05/"}]},{"id":"top-dennis-hastert-dead-oct5","headline":"Oct. 5 AP: Former House Speaker Dennis Hastert dies at 84","summary":"Hastert, a Republican who served as House speaker from 1999 to 2007, died at 84, AP reports. His legacy is inseparable from his later guilty plea for structuring payments to conceal sexual abuse of a minor; the obituary distinguishes his political career from that criminal case.","sources":["Other"],"signal":"Consensus","links":[{"label":"AP — Oct. 5 AP: Former House Speaker Dennis Hastert dies at 84","url":"https://apnews.com/article/dennis-hastert-dead-obituary-4a04ca4b4c0741a38f4b4a7e0f2bc78c"}]},{"id":"top-spain-snap-election-oct5","headline":"Oct. 5: Spain’s Sánchez calls Nov. 29 snap election after housing-decree defeat","summary":"Prime Minister Pedro Sánchez called an early election after parliament rejected housing measures amid political pressure, Reuters reports. The vote is scheduled for Nov. 29; its result and the coalition balance remain unsettled.","sources":["Other","Drudge"],"signal":"Watch","links":[{"label":"Reuters — Sánchez calls Nov. 29 snap election, Oct. 5","url":"https://www.reuters.com/world/europe/spanish-pm-sanchez-calls-snap-election-november-29-2026-10-05/"}]}],"usa":[{"id":"usa-army-counterdrone-border-oct5","headline":"Oct. 5 Reuters: Army tests counter-drone systems near Mexico border","summary":"The U.S. Army tested counter-drone equipment near the Mexican border as officials cited 378 drone incursions in the prior 30 days, Reuters reports. The figure is officials’ count; the exercise does not establish that each incursion was cartel-operated or posed a confirmed threat.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — Oct. 5 Reuters: Army tests counter-drone systems near Mexico border","url":"https://www.reuters.com/business/aerospace-defense/us-army-tests-counter-drone-tech-mexican-border-cartel-drone-use-rises-2026-10-05/"}]},{"id":"usa-california-realtor-china-spying-charge-oct5","headline":"Oct. 5 Reuters: California realtor accused of spying on Taiwan president’s son for China","summary":"U.S. authorities say Wanying Zhang was arrested at Los Angeles International Airport and charged with acting as an unregistered Chinese agent after allegedly surveilling the Taiwanese president’s son. The allegations are pending and are not findings of guilt.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — Oct. 5 Reuters: California realtor accused of spying on Taiwan president’s son for China","url":"https://www.reuters.com/legal/litigation/us-accuses-california-woman-spying-china-surveilling-taiwan-leaders-son-2026-10-05/"}]},{"id":"usa-head-start-proposed-rule-oct5","headline":"Oct. 5 AP: proposed Head Start rule would ease federal limits on suspensions","summary":"The administration proposed removing federal restrictions on Head Start suspensions and expulsions, AP reports. The change is not final; advocates warn it could weaken safeguards for children with behavioral needs.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — proposed Head Start discipline-rule changes, Oct. 5","url":"https://apnews.com/article/head-start-preschool-trump-discipline-expel-suspend-9c659a0c2494cab6ef35e3853d1632e3"}]},{"id":"usa-iran-strike-wounded-soldiers-oct5","headline":"Oct. 5: Wounded U.S. troops describe care failures after deadly Iranian drone strike","summary":"U.S. service members seriously wounded in the March 1 Iranian drone strike at Port Shuaiba told AP that military care and benefits fell short; six troops died and dozens were wounded. Their accounts raise questions about readiness and care but remain attributed, not an official finding.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — wounded troops say medical system failed them, Oct. 5","url":"https://apnews.com/article/iran-war-soldiers-wounded-military-port-shuaiba-f867128532cb6746c26636c2dbaea2fb"},{"label":"AP — soldiers and Gold Star families press Army leadership, Oct. 5","url":"https://apnews.com/article/iran-war-port-shuaiba-attack-soldiers-29f34587c6361261f6e803aff6791e8f"}]},{"id":"usa-new-york-measles-emergency-oct5","headline":"Oct. 5: New York declares disaster emergency over measles outbreak","summary":"Gov. Kathy Hochul’s order follows 108 reported cases through Oct. 3, including 92 since July 15, Reuters reports. The emergency runs through Nov. 4; the case count is state-reported and the order is not a final outbreak investigation.","signal":"Watch","sources":["Other"],"links":[{"label":"Reuters — New York declares measles disaster emergency, Oct. 5","url":"https://www.reuters.com/business/healthcare-pharmaceuticals/new-york-declares-disaster-emergency-over-measles-outbreak-2026-10-05/"}]},{"id":"usa-cyclospora-mexican-lettuce-oct5","headline":"Oct. 5: FDA remains focused on lettuce supplier as Cyclospora outbreak investigation changes","summary":"Federal health officials said Monday they remain focused on lettuce from Taylor Farms as a source of a multistate Cyclospora outbreak despite an inaccurate test result, AP reports. Earlier inspections found the parasite at a Mexican farm; the investigation continues and no final source determination has been announced.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — FDA remains focused on lettuce supplier, Oct. 5","url":"https://apnews.com/article/cyclospora-lettuce-taco-bell-cdc-fda-77f2b6db56fbeddcae045a03ccf122c4"}]},{"id":"usa-cornell-investigation-oct4","headline":"Oct. 4: Prosecutor reopens Cornell rape-allegations investigation","summary":"A New York prosecutor reopened an investigation into rape allegations involving a Cornell student, AP reports, amid renewed scrutiny of the university’s handling of the matter. The allegations are under investigation and are not a court finding.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — prosecutor reopens Cornell investigation, Oct. 4","url":"https://apnews.com/article/cornell-rape-allegations-investigation-16f59e89ce97e3a40a8e672f7b3f374b"}]},{"id":"usa-baltimore-park-shooting-oct4","headline":"Oct. 4: 12-year-old girl killed and three adults wounded in Baltimore park shooting","summary":"Police said a 12-year-old girl was killed and three adults wounded in a shooting at a Baltimore park. Authorities have not announced a motive or arrest in the report.","sources":["Other"],"signal":"Watch","links":[{"label":"AP via ABC News — Baltimore park shooting, Oct. 4","url":"https://abcnews.com/US/wireStory/police-12-year-girl-fatally-shot-baltimore-park-136985255"}]},{"id":"top-georgia-homecoming-shooting-oct4","headline":"Oct. 4: Two killed in Georgia homecoming-party shooting; injury totals vary Giants 36, Cardinals 24 final recap, Oct. 4","url":"https://www.espn.com/nfl/recap/_/gameId/401872966"}]},{"id":"sports-colts-commanders-final-oct4","headline":"Oct. 4 FINAL: Colts rally past Commanders 30–13 in London","summary":"Indianapolis beat Washington 30–13 in the NFL’s London game, ESPN reports, improving its early-season record. The final score is verified by the game recap.","sources":["Other"],"signal":"Consensus","links":[{"label":"ESPN — Colts 30, Commanders 13 final, Oct. 4","url":"https://www.espn.com/nfl/game/_/gameId/401872965"}]},{"id":"sports-mlb-nlds-results-oct4","headline":"Oct. 4 NLDS finals: Brewers edge Padres 4–3; Braves beat Dodgers 3–2 to even series","summary":"Milwaukee moved ahead 2–0 in its series with a second 4–3 win over San Diego, while Atlanta beat Los Angeles 3–2 to tie the Braves-Dodgers series 1–1, MLB’s postseason scoreboard shows.","sources":["Other"],"signal":"Consensus","links":[{"label":"MLB — official postseason scoreboard, Oct. 4","url":"https://www.mlb.com/postseason"}]},{"id":"sports-alds-yankees-rays-upcoming-oct5","headline":"ALDS Game 2 UPCOMING: Yankees visit Rays at 8 p.m. ET with Tampa Bay ahead 1–0","summary":"The Yankees–Rays ALDS Game 2 is scheduled for 8 p.m. ET Monday, with Tampa Bay leading the best-of-five series 1–0 after the opener. Check the official MLB live scoreboard for any post-publication change.","signal":"Watch","sources":["Other"],"links":[{"label":"MLB — official postseason schedule and live scoreboard","url":"https://www.mlb.com/postseason"},{"label":"MLB — official live scores","url":"https://www.mlb.com/scores"}]},{"id":"sports-mnf-falcons-saints-oct5","headline":"Monday Night Football UPCOMING: Falcons at Saints, 8:15 p.m. ET","summary":"Atlanta visits New Orleans in Week 4’s Monday Night Football game, scheduled to kick off at 8:15 p.m. ET. The NFL schedule lists the contest for Monday, Oct. 5.","signal":"Watch","sources":["Other"],"links":[{"label":"NFL — official Week 4 schedule","url":"https://www.nfl.com/schedules/2026/by-week/week-4"},{"label":"NFL — Falcons at Saints game page","url":"https://www.nfl.com/games/falcons-at-saints-2026-reg-4"}]}],"politics":[{"id":"politics-cnn-midterm-map-oct5","headline":"Oct. 5: Trump campaigns in Nebraska as Republicans defend a red-state Senate seat","summary":"Trump took his midterm message to Nebraska, where Republicans face a competitive Senate contest and voters cite economic concerns, Reuters reports. The visit is a campaign event, not evidence of an election outcome.","sources":["CNN"],"signal":"Watch","links":[{"label":"Reuters — Trump heads to Nebraska as Republicans defend Senate seat, Oct. 5","url":"https://www.reuters.com/world/us/trump-heads-nebraska-republicans-defend-red-state-senate-seat-2026-10-05/"},{"label":"AP — Trump heads to Nebraska for GOP campaign, Oct. 5","url":"https://apnews.com/live/trump-nebraska-iran-war-midterm-election-news-updates-10-05-2026"}]},{"id":"politics-reuters-ipsos-approval-poll-oct5","headline":"Oct. 5 Reuters/Ipsos: Trump approval at 32%, a new low in the poll series","summary":"A Reuters/Ipsos poll put Trump’s approval at 32%, its lowest reading since his return to office, and found Hispanic voters souring on Republicans. Polling reflects respondents at a point in time, with sampling uncertainty; it is not an election forecast.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — Oct. 5 Reuters/Ipsos: Trump approval at 32%, a new low in the poll series","url":"https://www.reuters.com/world/us/trump-approval-record-low-hispanic-voters-sour-on-republicans-reutersipsos-poll-2026-10-05/"}]},{"id":"politics-dccc-red-to-blue-expansion-oct5","headline":"Oct. 5: Democrats add six House races to their “Red to Blue” target list","summary":"The Democratic Congressional Campaign Committee added six Republican-held districts to its target program as the party tries to expand its midterm battlefield, The Hill reports. The move signals campaign priorities, not a forecast or an endorsement by nonpartisan election analysts.","sources":["Other"],"signal":"Watch","links":[{"label":"The Hill — Oct. 5: Democrats add six House races to their “Red to Blue” target list","url":"https://thehill.com/homenews/campaign/6129845-democrats-house-race-targets-dccc-midterms/"}]},{"id":"politics-trump-super-intelligence-force-oct4","headline":"Oct. 4: Trump announces “Super Intelligence Force” as AI task-force rollout expands","summary":"Trump announced a proposed “Super Intelligence Force” to coordinate the federal AI response, while DNI Jay Clayton’s task-force leadership remains in place. The structure, remit and recommendations remain unsettled; the announcement is not an enacted policy.","sources":["Fox","Other"],"signal":"Watch","links":[{"label":"Fox News — Trump announces Super Intelligence Force, Oct. 4","url":"https://www.foxnews.com/politics/trump-launching-super-intelligence-force-ensure-american-dominance"}]},{"id":"politics-noem-donor-contract-report-oct4","headline":"Oct. 4 report: Noem agency awarded donor-linked firm a contract before she left office","summary":"The New York Times reports that Kristi Noem’s agency awarded a lucrative contract to a donor shortly before she departed. The report raises questions about timing and contracting; it is an allegation requiring attribution, not a government finding of misconduct.","sources":["Drudge","Other"],"signal":"Watch","links":[{"label":"New York Times — report on Noem agency contract, Oct. 4","url":"https://www.nytimes.com/2026/10/04/us/politics/kristi-noem-planes-donor.html"}]},{"id":"politics-democrats-posttrump-plan-oct4","headline":"Oct. 4 report: Democrats draft plans to constrain presidential power after Trump","summary":"The Washington Post reports Democratic lawmakers and legal experts are preparing proposals on emergency powers, Justice Department independence, White House changes and ethics. These are planning efforts, not enacted laws or agreed party policy.","sources":["Other"],"signal":"Watch","links":[{"label":"Washington Post — Democrats plan post-Trump government changes, Oct. 4","url":"https://www.washingtonpost.com/politics/2026/10/04/democrats-are-making-plans-clean-up-government-post-trump-era/"}]},{"id":"politics-trump-tv-ads-private-funds-oct5","headline":"Oct. 5: Trump says he will use private funds for TV ads after taxpayer-money criticism","summary":"Trump said he or his MAGA political committee would pay for television ads that had featured him and were funded by the government, after criticism over their timing before the November midterms, Reuters reports. The ads’ prior funding and future payment are separate questions; the statement does not resolve the legal dispute.","signal":"Watch","sources":["Other"],"links":[{"label":"Reuters — Trump says he will pay for TV ads after criticism, Oct. 5","url":"https://www.reuters.com/world/us/trump-says-will-pay-tv-ads-after-pushback-over-taxpayer-funding-close-election-2026-10-05/"},{"label":"CNBC — Trump says he and PAC will pay for government-funded ads, Oct. 5","url":"https://www.cnbc.com/2026/10/05/trump-ads-election.html"}]}],"entertainment":[{"id":"entertainment-digger-boxoffice-oct5","headline":"Oct. 5 estimates: “Verity” opens at $32.6M as “Digger” posts Tom Cruise’s lowest debut in years","summary":"Deadline’s updated weekend estimate puts “Verity” at $32.6 million domestic and “Digger” at $8 million, the latter Tom Cruise’s lowest opening since 2007. Weekend grosses are studio estimates, not final audited totals.","sources":["Other"],"signal":"Watch","links":[{"label":"Deadline — updated weekend box-office estimates, Oct. 5","url":"https://deadline.com/2026/10/box-office-verity-digger-1237145435/"},{"label":"AP — “Verity” tops box office as “Digger” opens, Oct. 5","url":"https://www.wjtv.com/news/ap-on-cusp-of-merger-digger-bombs-for-warner-bros-verity-takes-no-1-at-box-office/"}]},{"id":"entertainment-paramount-warner-settlement-oct4","headline":"Oct. 5: Paramount–Warner deal nears Tuesday close as Skydance names combined leadership","summary":"Deadline reports Skydance has outlined the leadership structure for the combined Paramount–Warner Bros. operation as the merger approaches an expected Tuesday close. The transaction has not yet closed; regulatory and closing steps remain.","sources":["Other"],"signal":"Consensus","links":[{"label":"Deadline — Skydance sets leadership structure before Paramount–WBD close, Oct. 5","url":"https://deadline.com/2026/10/paramount-wbd-executive-structure-org-chart-1237143859/"},{"label":"CNN — Mark Thompson to remain CNN chief as deal nears close, Oct. 5","url":"https://www.cnn.com/2026/10/05/media/mark-thompson-cnn-chief-paramount-warner-bros-deal"}]},{"id":"entertainment-karoline-leavitt-fox-contributor-oct5","headline":"Oct. 5: Former press secretary Karoline Leavitt to join Fox News as contributor","summary":"Fox News announced that former White House press secretary Karoline Leavitt will join the network as an on-air contributor beginning Nov. 1, multiple outlets report. The hiring announcement does not establish her future role in newsroom decisions or programming.","sources":["Other"],"signal":"Watch","links":[{"label":"The Hill — Oct. 5: Former press secretary Karoline Leavitt to join Fox News as contributor","url":"https://thehill.com/homenews/media/6129163-karoline-leavitt-joining-fox-news/"}]},{"id":"entertainment-anthony-mackie-macbeth-oct5","headline":"Oct. 5: Anthony Mackie to return to Broadway as Macbeth after 16-year absence","summary":"Mackie will star in a Broadway production of Shakespeare’s “Macbeth”; rehearsals are planned for February 2027, with previews expected in late March or early April, Deadline reports. The production has not yet opened and the schedule remains forward-looking.","sources":["Other"],"signal":"Watch","links":[{"label":"Deadline — Anthony Mackie prepares Broadway return as Macbeth, Oct. 5","url":"https://deadline.com/2026/10/anthony-mackie-macbeth-broadway-avengers-star-1237146358/"}]},{"id":"entertainment-itv-mipcom-slate-oct5","headline":"Oct. 5: ITV Studios takes 10 new formats to Mipcom, led by “The Chase Around the World”","summary":"ITV Studios has unveiled ten new unscripted formats for the Mipcom market, with “The Chase Around the World” leading the slate, Variety reports. The announcement is a programming and international-sales slate, not a confirmation that every title has a buyer or release date.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — ITV Studios Mipcom formats slate, Oct. 5","url":"https://variety.com/2026/tv/news/itv-studios-mipcom-formats-slate-the-chase-around-the-world-1236898689/"}]},{"id":"entertainment-canal-cinema-tax-oct5","headline":"Oct. 5: Canal+ threatens to pull $1.1 billion French cinema deal over proposed tax hike","summary":"Canal+ warned it could withdraw from its cinema financing agreement if France raises VAT on subscription services; Variety estimates the proposed change could cost the group about €200 million annually. The tax remains part of a proposed finance bill, not enacted law.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — Canal+ warns over French tax and cinema funding, Oct. 5","url":"https://variety.com/2026/film/global/frances-canal-1-1-billion-cinema-deal-tax-hike-1236898925/"}]},{"id":"entertainment-jack-odessa-casting-oct5","headline":"Oct. 5: Jack O’Connell and Odessa A’zion to star as flat-earthers in new film","summary":"Variety reports O’Connell and A’zion will lead “The End of the World as We Know It” for Studiocanal and Working Title, about flat-earth believers. The casting is announced; the project’s release date has not been specified in the report.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — O’Connell and A’zion cast in new film, Oct. 5","url":"https://variety.com/2026/film/global/jack-oconnell-odessa-azion-tend-of-the-world-as-we-know-it-1236897026/"}]}]},"researchNotes":["Freshly re-ranked all eight tabs for the Oct. 5, 7 p.m. EDT Boston edition; checked Fox News, CNN and Drudge, describing Drudge as an aggregator.","Cross-checked Monday confirmed Dow and Nasdaq close with Reuters and AP; AP supplies exact point moves and Reuters supplies precise percentages. Friday, Oct. 2 close used only as prior-session comparison.","Official NHL GameCenter checked at 7:18 p.m. EDT: Ottawa at Boston remains scheduled for 7:30 with no score or in-progress state displayed. Official MLB score check at 7:18 p.m. EDT: White Sox lead Guardians 4–2 in the middle of the sixth; refresh immediately before final build/publication.","Checked WEEI/Audacy and BostonGlobe.com; Globe paywall and WEEI metadata limitations are disclosed in the Boston Tell and card.","Official/primary sources used where available: NHL, MLB, NFL, NBA, Reuters, AP, Nobel Prize and IAEA; allegations and unresolved claims are attributed."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, or international soccer.',business:'7 unique business/markets stories; on trading days at 7 a.m. show timestamped indicative Dow and Nasdaq-100 futures, clearly not cash indexes; on weekends and market holidays state cash markets are closed and show no live/premarket snapshot, while identifying the latest completed session. At 10 a.m. and 1 p.m. on trading days show timestamped Dow and Nasdaq Composite cash-index levels, point and percentage moves, and any provider delay; at 4 p.m. show timestamped closing moves as confirmed or clearly preliminary; at 7 p.m. use confirmed closes.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
