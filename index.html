<script id="briefing" type="application/json">{"date":"2026-10-29","lastUpdated":"October 29, 2026, 7:07:39 a.m. EDT Boston","dek":"Thursday morning limited refresh: Top News, USA, Boston Sports and Sports researched and re-ranked; Business, World, Politics and Entertainment preserve Wednesday evening’s verified cards, links, original dates and Tells.","take":"Unfinished election processes, security risks and a deadly rail disaster outweigh campaign theater; Milwaukee’s title is a completed result. Fox foregrounds Alaska’s alleged spoiler scheme and the DHS leak, CNN leads with its new Senate polling, and Drudge emphasizes election-power anxieties alongside Israel’s count. These are different emphases, not a shared verdict: Drudge is an aggregator, not an independent reporting source, and allegations, polling and attack contingencies remain distinct from established outcomes.","sectionTakes":{"top":"Unfinished election processes, security risks and a deadly rail disaster outweigh campaign theater; Milwaukee’s title is a completed result. Fox foregrounds Alaska’s alleged spoiler scheme and the DHS leak, CNN leads with its new Senate polling, and Drudge emphasizes election-power anxieties alongside Israel’s count. These are different emphases, not a shared verdict: Drudge is an aggregator, not an independent reporting source, and allegations, polling and attack contingencies remain distinct from established outcomes.","usa":"New child-safety rules, Cornell’s active vote and threats to community safety lead alongside a completed fraud sentence. The Colorado search is unresolved, the shooting-plot and school-policy cases remain allegations, and the smoke study estimates exposure rather than diagnosing individuals. Fresh reporting on respite shortages shows why a nominal benefit need not mean accessible care.","boston":"Only the Bruins play Thursday, at St. Louis at 8 p.m. EDT; all four teams were off Wednesday. Brown’s denial and Vrabel’s fourth-down approach join the R ws."},"sections":{"top":[{"id":"top-israel-oct29","headline":"Israel awaits final count as election committee seeks interference inquiry","summary":"AP’s Thursday update says final results could arrive Thursday evening after absentee ballots are counted. The election committee asked Shin Bet to examine unspecified allegations of foreign funding, without endorsing their validity. No bloc has a clear majority; Likud’s separate vote-theft allegation still lacks specific supporting evidence. Netanyahu remains in office during the coalition uncertainty.","sources":["Other","Drudge"],"signal":"Watch","links":[{"url":"https://apnews.com/article/israel-elections-netanyahu-eisenkot-arab-results-9a0620a1314fdc127245ba1a7f0aa762","label":"AP — updated Oct. 29, 5:45 a.m. EDT"},{"url":"https://www.drudgereport.com/","label":"Drudge Report — aggregator checked Oct. 29 morning"}]},{"id":"top-spain-collision-oct28","headline":"Spain searches train wreckage after collision kills at least 68","summary":"Rescuers continued searching Thursday after a RENFE train struck a stopped IRYO train on the Madrid–Seville route. Castilla La Mancha’s regional government confirmed at least 68 deaths; AP’s late Wednesday report and Al Jazeera’s Thursday account match that toll. Rail services remain disrupted, and investigators have not established a final cause.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/train-accident-spain-4f65471a0e36f448d7ee9efe0768cd77","label":"AP — updated Oct. 28, 10:50 p.m. EDT"},{"url":"https://www.aljazeera.com/news/2026/10/29/rescue-teams-search-wreckage-for-survivors-after-train-crash-in-spain","label":"Al Jazeera — Oct. 29 rescue update"}]},{"id":"top-iran-oct28eve","headline":"AP: U.S. warns allies to prepare for possible Iran strikes after elections","summary":"Two diplomats told AP the U.S. urged allies to prepare for renewed strikes and possible Iranian retaliation against energy facilities and other infrastructure. They said Trump has not made a final decision; U.S. officials declined comment. AP’s late Wednesday update describes contingency warnings, not an announced attack or a settled timetable.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/trump-iran-strikes-midterm-elections-c7df622f1e87de6035173be8fb8c4add","label":"AP — updated Oct. 28, 10:58 p.m. EDT"}]},{"id":"top-alaska-oct28eve","headline":"Alaska spoiler controversy escalates as Trump demands prosecution","summary":"AP’s late Wednesday update reports Trump called for prosecution of Mary Peltola and a second candidate named Dan Sullivan after reporting about an alleged spoiler effort. Peltola’s campaign denied involvement with either Sullivan campaign. CNN’s Thursday homepage reports the governor ordered an investigation; those developments are not charges, findings of guilt or an election result.","sources":["Other","CNN"],"signal":"Watch","links":[{"url":"https://apnews.com/article/alaska-peltola-senate-dan-sullivan-democrats-743677c9fb0d6696af7901504df2be3e","label":"AP — updated Oct. 28, 9:58 p.m. EDT"},{"url":"https://www.cnn.com","label":"CNN — homepage checked Oct. 29 morning"}]},{"id":"top-dhs-oct29","headline":"DHS investigates potential employee-data breach after leak site publishes records","summary":"DHS told Fox it is aware of a potential breach and is working to address it. The leak publisher says the material covers more than 40,000 employees, including immigration and border personnel; Reuters separately reports the release and the department’s response. The dataset’s scope remains attributed, and this briefing does not reproduce personal information.","sources":["Fox","Other"],"signal":"Watch","links":[{"url":"https://www.foxnews.com/us/dhs-investigates-massive-data-breach-exposing-40000-employees-including-ice-border-patrol-agents","label":"Fox News — Oct. 28 report, checked Oct. 29"},{"url":"https://www.reuters.com/legal/government/leak-website-releases-data-tens-thousands-dhs-employees-2026-10-28/","label":"Reuters — Oct. 28 release report"}]},{"id":"top-polls-oct29","headline":"CNN polls show Democratic leads in Michigan and Texas; Maine and Kansas unclear","summary":"CNN’s new SSRS surveys put Democrats ahead among likely voters in Michigan and Texas, while finding no clear leader in Maine or Kansas. CNN says the four races illustrate a possible path to Senate control, not an assured majority. Polling estimates and uncertainty should not be read as completed votes or a forecast guaranteed to hold.","sources":["CNN"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/29/politics/cnn-polls-michigan-maine-texas-kansas-senate-races-midterms-vis","label":"CNN/SSRS — published Oct. 29, 5 a.m. EDT"}]},{"id":"top-okeefe-oct29","headline":"O’Keefe and Higby charged after Minnesota voting sting","summary":"Hennepin County prosecutors charged James O’Keefe and Cam Higby with unlawful voting and identity theft, alleging they used false names during an August primary sting. O’Keefe says they were acting as investigative journalists exposing vulnerabilities. The charges are allegations, not convictions; prosecutors say suspicious poll workers reported their behavior.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/voucher-voting-election-sting-undercover-e32e80590b59ca50adbb6751092e7435","label":"AP — updated Oct. 28, 10:24 p.m. EDT"}]},{"id":"top-tides-oct29","headline":"King tides flood neighborhoods on both U.S. coasts","summary":"AP documents flooded roads, homes and businesses in California, Florida and the Carolinas, with weather conditions amplifying this week’s astronomical high tides. Forecasters say some areas could face flooding into the weekend. The timing and severity vary locally; this is not a single nationwide evacuation order.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/king-tides-florida-california-carolina-flooding-bd3d4258b785f428fdbdb961c4355a67","label":"AP — updated Oct. 28, 6:32 p.m. EDT"}]},{"id":"top-labfire-oct29","headline":"Savannah River lab fire extinguished; site reports no detectable contamination","summary":"A Wednesday fire at Savannah River National Laboratory briefly triggered an emergency declaration and transport restrictions. AP’s late update says the fire was extinguished, normal operations resumed and the site reported no detectable contamination. Fox also covered the emergency; the earlier alert must not be mistaken for an ongoing uncontrolled fire.","sources":["Other","Fox"],"signal":"Watch","links":[{"url":"https://apnews.com/article/savannah-river-national-lab-fire-b9254960a7c54395ec50296198fec54f","label":"AP — updated Oct. 28, 11:10 p.m. EDT"},{"url":"https://www.foxnews.com/us/emergency-declared-south-carolina-nuclear-site-after-fire-erupts-lab","label":"Fox News — Oct. 28 emergency coverage"}]},{"id":"top-brewers-oct29","headline":"Brewers win first World Series, beating Rays 4–1 in Game 5","summary":"Milwaukee clinched its first championship Wednesday with a 4–1 victory over Tampa Bay, winning the series four games to one. AP and ESPN independently confirm the completed result. The title replaces the previous elimination-game preview; there is no World Series Game 6 scheduled.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/brewers-rays-world-series-game-5-971f9fb8cad75042fc7f9919dd91c159","label":"AP — updated Oct. 29, 2:06 a.m. EDT"},{"url":"https://www.espn.com/mlb/recap/_/gameId/401908046","label":"ESPN — Oct. 28 Game 5 final and recap"}]}],"usa":[{"id":"top-chatbots-oct28eve","headline":"New York signs restrictions on unsafe chatbot interactions with children","summary":"Gov. Kathy Hochul signed a law Wednesday prohibiting specified AI-companion behavior toward users under 18, including sexual content, encouragement of secrecy and suggestions that a chatbot is a real person. AP reports enforcement could include state lawsuits and monetary penalties. The law’s passage is established; its practical effects and industry compliance remain to be seen.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/chatbots-ai-new-york-legislation-bans-children-03a4e090a7df1532838a5cb6f93a23ba","label":"AP — updated Oct. 28, 6 p.m. EDT"}]},{"id":"usa-cornell-vote-oct28","headline":"Cornell faculty advance no-confidence vote after closed-door debate","summary":"AP obtained a recording of Wednesday’s Faculty Senate meeting over the administration’s handling of sexual-assault allegations. Faculty now vote electronically through Nov. 6 on the largely symbolic resolution; trustees retain authority over leadership. Debate and voting have advanced, but there is no result yet and the underlying allegations remain disputed.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/cornell-university-rape-case-kotlikoff-faculty-vote-04ce3714c997b15a90b738dba6b5abaf","label":"AP — updated Oct. 28, 9:08 p.m. EDT"}]},{"id":"usa-temple-oct29","headline":"Chicago-area Hindu community strengthens security after alleged shooting plot","summary":"AP’s Thursday reporting describes temple members preserving holiday gatherings while discussing increased vigilance after authorities said they thwarted a mass shooting. The accused man faces terrorist-threat and firearm charges and is due in court Friday. Community fears are documented; the criminal allegations have not been adjudicated.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/hindu-temple-shooting-south-asian-threat-8ed22e083a840922c356fbb60cb37325","label":"AP — updated Oct. 29, 3:13 a.m. EDT"}]},{"id":"usa-missing-oct29","headline":"Rescuers search Colorado peaks for two missing college students","summary":"About 60 volunteers, supported by helicopters, drones and dogs, have searched for Kaden Matsuda and Jackson Donlon after their weekend climbing trip encountered heavy snow. A collapsed tent was found without the students. AP’s Wednesday-night update says both remain missing; worsening weather could limit aerial searches, not establish their fate.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/colorado-ice-mountain-climbing-college-students-rescue-c88ce7c57c8e83e20b8a402915988663","label":"AP — updated Oct. 28, 9:48 p.m. EDT"}]},{"id":"usa-smoke-oct29","headline":"Study documents heavy-metal exposure from Los Angeles wildfire smoke","summary":"A study published Wednesday in Science Advances used detailed measurements of smoke from the 2025 Los Angeles fires to estimate exposure to toxic metals, including lead. AP reports that researchers distinguished emissions from burning structures and tracked changes over time. The exposure findings do not diagnose individual residents or establish a final count of illnesses.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/los-angeles-fires-2025-eaton-fire-air-pollution-smoke-b1d86fbb096940500a4c04c5d5bf82dd","label":"AP — updated Oct. 28, 2:03 p.m. EDT"}]},{"id":"usa-schoolplot-oct29","headline":"Georgia warrants detail alleged school-shooting plan and weapons arrangement","summary":"Warrants say three suspects had selected a date, discussed equipment and arranged access to weapons for an alleged attack at Cherokee High School. AP reports conspiracy charges after the FBI flagged threatening social-media posts. These are allegations in warrants and police accounts, not convictions or a completed attack.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/georgia-school-shooting-plot-arrests-c6751e11c9bde87e83ddf464f392c77c","label":"AP — updated Oct. 28, 4:44 p.m. EDT"}]},{"id":"usa-fraud-oct28eve","headline":"Minnesota food-fraud figure sentenced to 30 years","summary":"Salim Said received a 30-year federal prison sentence Wednesday after his 2025 conviction in the Feeding Our Future scheme. Prosecutors attributed $44 million in fraud to him and recruited participants; his lawyer disputed the government’s characterization of him as an architect. AP’s evening update records remorse at sentencing, a completed court action distinct from broader political claims.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/fraud-minnesota-feeding-our-future-sentencing-a195ef82b798fa66d89cd4a6ba7e23aa","label":"AP — updated Oct. 28, 7:35 p.m. EDT"}]},{"id":"usa-vegas-oct28eve","headline":"Passenger says “hijack” text that diverted United flight was coworker banter","summary":"AP’s follow-up identifies Dante Milne, charged after a flight attendant saw a threatening text on Saturday’s Las Vegas–Newark flight. Police say he described it as banter with a coworker; his lawyer says he plans to plead not guilty. The flight returned safely, while the intent and criminal case remain unresolved.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/las-vegas-flight-hijack-text-arrest-b1bd8912feda63a98a9cf4cc454b9480","label":"AP — updated Oct. 28, 6:20 p.m. EDT"}]},{"id":"usa-respite-oct29","headline":"Oregon families struggle to find youth respite care as programs close","summary":"AP’s Wednesday reporting describes scarce short-term supervised care for children with complex behavioral needs. Families and providers point to restrictive coverage and funding that does not meet operating costs. The report documents a service gap and caregiver pressure, not a newly funded statewide expansion.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/oregon-youth-respite-homes-funding-problems-c40bde3aca28a4077fa3d7acfd833b9d","label":"AP — updated Oct. 28, 5:01 p.m. EDT"}]},{"id":"usa-maryland-oct29","headline":"DOJ sues Maryland school district over transgender-student policies","summary":"Reuters reports DOJ alleges Anne Arundel County Public Schools violated federal parental-information protections; the district disputes the claims and says it has cooperated in good faith. The case was filed Tuesday, despite the article URL’s Oct. 28 date. A complaint does not establish that the policies violate the law.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/legal/government/us-justice-department-sues-maryland-school-district-over-transgender-policies-2026-10-28/","label":"Reuters — Oct. 27 dateline; URL dated Oct. 28"}]}],"boston":[{"id":"boston-thursday-status-oct29","headline":"Thursday Boston scoreboard: Bruins at Blues tonight; other three teams off","summary":"No Red Sox, Patriots, Bruins or Celtics game Wednesday, Oct. 28. UPCOMING Thursday, Oct. 29: Bruins at St. Louis, 8 p.m. EDT; Celtics, Patriots and Red Sox are off today. Red Sox season is complete. FINAL Tuesday, Oct. 27: Celtics 125, Nets 124 in overtime; Hurricanes 2, Bruins 1. UPCOMING Friday: Bulls at Celtics, 7:30 p.m. EDT. UPCOMING Sunday, Nov. 1: Patriots at Miami, 4:25 p.m. EST. FINAL Thursday, Oct. 22: Bears 30, Patriots 24. Official/ESPN schedules checked Thursday morning; no Boston game is in progress.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.espn.com/nhl/game/_/gameId/401892604/bruins-blues","label":"ESPN — Bruins/Blues upcoming game checked Oct. 29"},{"url":"https://www.espn.com/nba/team/schedule/_/name/bos","label":"ESPN — Celtics finals and schedule checked Oct. 29"},{"url":"https://www.patriots.com/schedule/","label":"Patriots — official 4:25 p.m. EST schedule checked Oct. 29"},{"url":"https://www.nhl.com/bruins/news/bruins-fall-2-1-to-hurricanes-learn-and-got-something-out-of-it-today","label":"Bruins/NHL — Oct. 27 official final"}]},{"id":"boston-brown-denial-oct29","headline":"Brown denies demanding Celtics trade; Scalabrine walks back report","summary":"Jaylen Brown said Wednesday he never demanded a trade or supplied ultimatums before leaving Boston. AP and the Globe report Brian Scalabrine walked back his earlier claim. Brown’s denial is the new development in the Celtics’ breakup story; the briefing does not treat the disputed original report as established fact.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/philadelphia-76ers-jaylen-brown-b545173ff5b23bc67f6084554ea1dcda","label":"AP — updated Oct. 28, 11:43 p.m. EDT"},{"url":"https://www.bostonglobe.com/2026/10/29/sports/nba-jaylen-brown-76ers-celtics-trade/","label":"Boston Globe — Oct. 29; partly paywalled"}]},{"id":"boston-fourthdown-oct29","headline":"Globe analysis links Vrabel’s fourth-down aggression with scoring surge","summary":"The Globe’s Thursday analysis says the Patriots have emphasized touchdowns rather than settling for short field goals, scoring 16 touchdowns across the past four games. Vrabel’s stated rationale is simply to score touchdowns. The accessible excerpt supports a tactical trend, not proof that every aggressive decision will work.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.bostonglobe.com/2026/10/29/sports/mike-vrabel-patriots-analysis-fourth-down/","label":"Boston Globe — Oct. 29 analysis; excerpt/paywall"}]},{"id":"boston-bell-oct28eve","headline":"Red Sox hiring Jason Bell to guide their outfield","summary":"The Globe reports that Boston is hiring the Astros coach as its outfield instructor, with other responsibilities still being determined. MLB Trade Rumors also cites MLB.com’s Brian McTaggart. Bell brings player-development experience to a young outfield; first- and third-base coaching assignments are not settled by this report.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.bostonglobe.com/2026/10/28/sports/jason-bell-red-sox-outfield/","label":"Boston Globe — Oct. 28, 2026; subscription overlay"},{"url":"https://www.mlbtraderumors.com/2026/10/red-sox-hire-astros-outfield-coach-jason-bell.html","label":"MLB Trade Rumors — Oct. 28; cites MLB.com and Globe"},{"url":"https://www.audacy.com/weei/sports","label":"WEEI/Audacy — checked Oct. 29 morning; limited fresh full text"}]},{"id":"boston-jacobs-oct28eve","headline":"Charlie Jacobs succeeds his father as Bruins governor","summary":"The Bruins announced Wednesday that CEO Charlie Jacobs immediately succeeds Jeremy Jacobs as club governor on the NHL’s Board of Governors. Jeremy held the role for 51 years; Charlie continues as CEO. The official announcement and Globe reporting describe a governance succession, not a sale of the franchise.","sources":["Other"],"signal":"Overlap","links":[{"url":"https://www.nhl.com/bruins/news/jeremy-m-jacobs-names-ceo-charlie-jacobs-as-governor-of-the-boston-bruins","label":"Bruins/NHL — Oct. 28 official announcement"},{"url":"https://www.bostonglobe.com/2026/10/28/sports/charlie-jacobs-bruins-governor/","label":"Boston Globe — Oct. 28, 2026; subscription overlay"}]},{"id":"boston-injury-oct28eve","headline":"Patriots list four limited Wednesday; Maye practices fully","summary":"The official Oct. 28 report lists A.J. Brown, Ben Brown, DaQuan Jones and Morgan Moses as limited, with no players marked as nonparticipants. Drake Maye participated fully despite a listed right-shoulder issue. These are practice designations, not final availability decisions for Sunday at Miami.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.patriots.com/news/week-8-injury-report-patriots-at-dolphins-x9227","label":"Patriots — official Oct. 28 injury report, 4:35 p.m. EDT"}]},{"id":"boston-ir-oct28eve","headline":"Patriots face difficult injured-reserve return decisions","summary":"The Globe’s Wednesday roster analysis weighs depth needs against limited return slots. Vrabel said position depth and need guide decisions; his official transcript says he did not expect eligible Greg Van Roten or Dell Pettus at that day’s practice. Availability remains unresolved; older reports disagree about activation accounting, so no precise remaining-slot tally is asserted.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.bo id unusually warm seas helped intensify it. Heavy rain remains an inland threat; full damage estimates will take longer than the initial landfall reports.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/cyclone-arnab-climate-dhange-india-andhra-pradesh-04ffc941aa559a55d1774795cd63017d","label":"AP — updated Oct. 28, 2026"}]},{"id":"world-bondi-oct28eve","headline":"Australian police charge man over alleged false massacre injury claim","summary":"Police say a man falsely claimed injury in last year’s Bondi Hanukkah attack to obtain victim compensation; he was released on bail. AP separately reports the alleged surviving attacker’s proceeding was postponed until next year. Neither the fraud allegation nor the terrorism charges are convictions.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/australia-sydney-hanukkah-bondi-massacre-fraud-9dfbb3076b452d92d5e53fd6afdc65fc","label":"AP — updated Oct. 28, 2026"}]},{"id":"world-libya-oct28eve","headline":"Libya’s eastern administration bars Iranian and Afghan entry","summary":"Reuters reports the eastern-based government announced the restrictions Wednesday without giving a reason. Its statement includes exemptions for accredited diplomats and some authorized professionals. Libya remains divided between rival administrations, so the order is not described as a unified national government’s policy.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/world/asia-pacific/libyas-eastern-administration-bars-entry-iranians-afghans-2026-10-28/","label":"Reuters — Oct. 28 eastern-government announcement"}]}],"sports":[{"id":"sports-edwards-oct28eve","headline":"Timberwolves set Edwards’ knee procedure for Thursday; return remains uncertain","summary":"President Tim Connelly says Anthony Edwards is scheduled for a right-knee cleanup procedure Thursday and the team expects no long-term concern. AP’s Wednesday update says the timetable will b 26"}]},{"id":"politics-bottoms-oct28eve","headline":"Bottoms emphasizes policy in bid to become first Black woman governor","summary":"AP’s Wednesday profile examines Keisha Lance Bottoms’ Georgia campaign against Republican Rick Jackson. She stresses economic policy and Medicaid expansion while countering attacks on her Atlanta mayoral record. The historic possibility is conditional on winning; no outcome or consensus voter judgment is claimed.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/georgia-governor-keisha-lance-bottoms-black-woman-a66cda3338b6fc571149546fa33bc320","label":"AP — updated Oct. 28, 2026"}]},{"id":"politics-ads-oct28eve","headline":"GOP anti-transgender ad spending reaches $183 million, AP tally says","summary":"AdImpact data provided to AP estimate Republican spending through Oct. 25 and about 217,000 television spots. The report examines a strategy intended to offset economic concerns. The figures describe ad purchases, not proof that voters share the message or that the campaign tactic will succeed.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/transgender-ads-midterms-republicans-cultural-economic-issues-5c43cf231930a02c1f51b7ddcd8d9448","label":"AP — updated Oct. 28, 2026"}]},{"id":"top-california-hearing-oct27-eve","headline":"Judge considers special master for California voter-roll dispute","summary":"At Tuesday’s hearing, Judge David O. Carter said independent review may be needed before deciding federal claims about alleged noncitizens on voter rolls. AP’s late Oct. 27 report says he had not settled the issue. The government’s roughly 20,000-person list is contested; it is not a confirmed count of unlawful votes.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/california-noncitizen-voting-trump-lawsuit-ballots-8f6e267a51c574716386f502b77f7ce0","label":"AP — updated Oct. 27, 10:34 p.m. EDT; pending litigation"}]}],"entertainment":[{"id":"entertainment-brand-oct28eve","headline":"Russell Brand takes witness stand in ongoing sexual-offense trial","summary":"Brand began testifying Wednesday after the prosecution finished its case at Southwark Crown Court. The Hollywood Reporter describes charges involving six women and a reduced attempted-indecent-assault count. The allegations remain before a jury; testimony and the start of the defense case are not a verdict.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.hollywoodreporter.com/news/general-news/russell-brand-trial-witness-stand-statement-evidence-rape-1236741680/","label":"The Hollywood Reporter — Oct. 28 trial report"},{"url":"https://apnews.com/article/russell-brand-trial-rape-sexual-assault-trial-bf206b34d730e6f1d63cc96f1e25ad72","label":"AP — Oct. 28 trial coverage"}]},{"id":"entertainment-panahi-oct28eve","headline":"Iran sentences filmmaker Jafar Panahi; appeal remains available","summary":"His lawyer told an Iranian news outlet that the director received five years and one month in prison plus confiscation of assets. A friend told AP the sentence was delivered Monday and Panahi had not been detained. AP’s Wednesday report says the precise current conviction was not specified; the sentence can be appealed.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/iran-director-panahi-convicted-tehran-fe256f249bfea03ca368125dcf0cfa0e","label":"AP — updated Oct. 28, 2026"}]},{"id":"entertainment-masterson-oct28eve","headline":"Appeals court upholds Danny Masterson’s rape convictions","summary":"A California panel unanimously rejected challenges to Masterson’s convictions and 30-years-to-life sentence Tuesday. His lawyers said they will seek state Supreme Court review. AP’s Oct. 27 report concerns a completed appellate ruling, while further review remains a planned legal step.","sources":["Other"],"signal":"Overlap","links":[{"url":"https://apnews.com/article/danny-masterson-rape-appeal-scientology-5b81a4f47107b0e626f90fd43aaa0dac","label":"AP — Oct. 27 appellate ruling"}]},{"id":"entertainment-panettiere-oct28eve","headline":"Greenville police close investigation into Panettiere’s death","summary":"Police said Wednesday their inquiry ended after the coroner ruled Hayden Panettiere’s August overdose accidental. AP notes it remained unclear whether federal authorities were conducting a separate investigation. Closure of the local case is not confirmation that every possible inquiry has ended.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/hayden-panettiere-overdose-investigation-closed-2f069d501f6dad02c775d1642de3f3c5","label":"AP — updated Oct. 28, 2026"}]},{"id":"entertainment-burns-oct28eve","headline":"Ken Burns wins inaugural $250,000 American-history prize","summary":"New York Historical announced Wednesday that Burns received the first David M. Rubenstein Prize for the Advancement of American History. The jury cited his documentaries’ contribution to public understanding. The award recognizes a body of work rather than announcing a new film release.","sources":["Other"],"signal":"Overlap","links":[{"url":"https://apnews.com/article/ken-burns-american-history-prize-014333eec5706a752df641defc2696c5","label":"AP — updated Oct. 28, 2026"}]},{"id":"entertainment-gentle-oct28eve","headline":"AP review: “Gentle Monster” tests the comfort of trusting loved ones","summary":"AP’s Wednesday review examines Marie Kreutzer’s film, starring Léa Seydoux and Laurence Rupp, as a drama about moral blindness within a seemingly loving family. Its assessment concerns the storytelling and the audience’s complicity. This is a critic’s judgment, not reported misconduct by the performers.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/gentle-monster-movie-review-918881df1a322ae09fc019c9fd0a57a5","label":"AP — updated Oct. 28, 2026"}]},{"id":"entertainment-comics-oct28eve","headline":"Comics Come Home lines up Mulaney, Stewart and Romano for anniversary","summary":"The Globe’s Oct. 28 feature previews the charity show’s 30th anniversary at TD Garden on Nov. 7. Denis Leary’s lineup includes John Mulaney, Jon Stewart, Ray Romano, Jimmy Fallon and Leslie Jones. The event supports the Cam Neely Foundation for Cancer Care; the show is upcoming, not a completed performance.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.bostonglobe.com/2026/10/28/arts/comics-come-home/","label":"Boston Globe — Oct. 28 arts feature; subscription overlay"}]}]},"researchNotes":["Thursday Oct. 29 morning limited refresh. Four eligible tabs researched/reranked; Business, World, Politics and Entertainment preserved exactly from Wednesday evening. No market research; schedule unchanged.","Fox, CNN and Drudge homepages checked this morning. Fox DHS article readable; Reuters independently reports the leak and attributed scope. Drudge is an aggregator, not independent confirmation. AP and Al Jazeera match the attributed Spain toll. AP and ESPN confirm the Brewers championship.","Boston official/ESPN schedules checked Thursday morning. All four off Wednesday; Bruins at St. Louis Thursday 8 p.m. EDT, Celtics host Bulls Friday 7:30 p.m. EDT; Patriots at Miami Sunday 4:25 p.m. EST. Tuesday finals Celtics 125–124 OT, Carolina 2–1; Red Sox season complete.","Globe and WEEI/Audacy checked. Globe access varies from substantive readable passages to excerpt/paywall overlays; WEEI hub has limited fresh full text. AP independently verifies Brown denial. Official Patriots Wednesday participation report is not Thursday practice status or a game designation.","Preserved Politics contains the California ballot story, so no duplicate California story was added to a refreshed tab. Existing Boston news was rechecked and reranked, with original dates preserved. New York effective-date precision omitted because AP and a governor search result differed.","No excluded General Sports stories selected. AP NASA homepage item proved dated Oct. 23 and was rejected rather than described as fresh."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, international soccer, or WNBA coverage.',business:'7 unique business/markets stories refreshed only at 7 p.m. Eastern Monday through Friday, with independently confirmed figures for the latest completed U.S. cash session. Preserved unchanged at all other editions.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
