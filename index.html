, Oct. 16","url":"https://variety.com/2026/film/news/the-julia-set-chase-infiniti-sony-pictures-classics-tiff-1236914143/"}]},{"id":"entertainment-street-fighter-weekend-oct17","headline":"“Street Fighter” heads toward roughly $30 million opening","summary":"Deadline’s early Saturday estimate put the video-game adaptation on course for about $30 million domestically after $4 million in Thursday previews. Weekend totals remain forecasts until finalized.","sources":["Other"],"signal":"Watch","links":[{"label":"Deadline — Saturday box-office projection, Oct. 17","url":"https://deadline.com/2026/10/box-office-street-fighter-you-can-see-everything-1237159320/"}]},{"id":"entertainment-fourth-wing-casting-oct17","headline":"Prime Video’s “Fourth Wing” adaptation finds Violet and Xaden","summary":"Deadline reported Esther McGregor and a co-lead were cast in the fantasy adaptation’s central roles. The casting is confirmed production news; release timing remains unsettled.","sources":["Other"],"signal":"Watch","links":[{"label":"Deadline — “Fourth Wing” lead casting, Oct. 17","url":"https://deadline.com/2026/10/xaden-violet-fourth-wing-cast-leads-prime-video-adaptation-1237156221/"}]},{"id":"entertainment-netflix-bajaria-exit-oct16","headline":"Bela Bajaria leaves Netflix as Peter Rice becomes content chief","summary":"Netflix said Bela Bajaria is leaving after a decade and Peter Rice will step in as chief content officer, Variety and The Hollywood Reporter reported Friday. The executive transition is confirmed; its effect on programming strategy remains unknown.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — Bajaria leaving Netflix, Oct. 16","url":"https://variety.com/2026/film/news/netflix-bela-bajaria-leaving-layoffs-1236913504/"},{"label":"Hollywood Reporter — Rice replaces Bajaria, Oct. 16","url":"https://www.hollywoodreporter.com/news/general-news/bela-bajaria-out-netflix-1236733291/"}]},{"id":"entertainment-bleecker-street-acquired-oct16","headline":"Outerlight Entertainment acquires Bleecker Street","summary":"Outerlight announced its acquisition of the independent distributor Bleecker Street. The transaction is a completed industry deal; future release strategy remains to be seen.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — Outerlight acquires Bleecker Street, Oct. 15","url":"https://variety.com/2026/film/news/bleecker-street-acquired-outerlight-entertainment-1236913143/"}]},{"id":"entertainment-zendaya-garland-a24-oct15","headline":"Zendaya boards Alex Garland’s new A24 science-fiction film","summary":"Variety reported that Zendaya will star in an untitled science-fiction feature written and directed by Alex Garland for A24. Plot details remain under wraps and production is planned for 2027.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — Zendaya and Alex Garland project, Oct. 15","url":"https://variety.com/2026/film/global/zendaya-to-star-in-alex-garland-sci-fi-film-a24-1236912811/"}]},{"id":"entertainment-it-welcome-season2-oct17","headline":"“It: Welcome to Derry” creator teases a different Pennywise for season two","summary":"Brad Caleb Kane said the next season would expand the series and present a different version of Pennywise. The remarks describe creative intent rather than a completed episode or release date.","sources":["Other"],"signal":"Watch","links":[{"label":"Deadline — season-two creative preview, Oct. 17","url":"https://deadline.com/2026/10/brad-caleb-kane-teases-it-welcome-to-derry-season-2-pennywise-1237166286/"}]}]},"researchNotes":["Fresh research completed across all eight tabs at the Saturday 7 a.m. edition build.","WEEI/Audacy and Boston Globe four-team hubs checked; Globe access was partly paywalled and WEEI article text was limited.","Friday close independently preserved from AP, CNBC and Reuters; no weekend futures or live cash quote is presented.","Official NBA, NHL, Patriots and MLB sources checked for Friday finals and Saturday/Sunday <script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, international soccer, or WNBA coverage.',business:'7 unique business/markets stories refreshed only at 7 p.m. Eastern Monday through Friday, with independently confirmed figures for the latest completed U.S. cash session. Preserved unchanged at all other editions.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
