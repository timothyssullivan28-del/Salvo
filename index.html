<script id="briefing" type="application/json">{"date":"2026-09-29","lastUpdated":"September 29, 2026, 7:09:03 p.m. EDT Boston","dek":"Tuesday, Sept. 29 — a refreshed eight-section edition with new late-day developments, current Boston game statuses, and confirmed U.S. market closes.","take":"Fox and CNN converge on the White House AI accord but frame it differently: Fox emphasizes voluntary industry self-policing and Trump’s “Super Intelligence” rebrand, while CNN stresses that the pact is nonbinding amid fresh safety concerns. Drudge links the agreement within a provocative, broader headline mix, but it is an aggregator rather than an independent reporting source. Elsewhere, Iran contacts remain exploratory, the Supreme Court deportation order is interim, and the Navy crash inquiry remains open.","sectionTakes":{"top":"Fox and CNN converge on the White House AI accord but frame it differently: Fox emphasizes voluntary industry self-policing and Trump’s “Super Intelligence” rebrand, while CNN stresses that the pact is nonbinding amid fresh safety concerns. Drudge links the agreement within a provocative, broader headline mix, but it is an aggregator rather than an independent reporting source. Elsewhere, Iran contacts remain exploratory, the Supreme Court deportation order is interim, and the Navy crash inquiry remains open.","usa":"The FBI breach prompted an unusually public appeal to hackers, while Boeing’s Navy fighter award and the U.S. exit from a European watchdog mark new consequential actions. America.gov, Cornell allegations and court matters remain subject to scrutiny, pending review or unresolved proceedings.","boston":"At the 7:09:03 p.m. EDT status check, Red Sox–Yankees and Rangers–Bruins remain upcoming at 8 p.m. EDT; neither game has started. The Patriots and Celtics have no Tuesday game, while Boston College’s latest listed result is its Sept. 26 loss to Virginia Tech.","business":"CONFIRMED Tuesday, Sept. 29 close — Dow 51,349.92, down 131.59 points (−0.26%); Nasdaq Composite 26,797.54, down 22.84 points (CNBC/Yahoo −0.09%; Reuters −0.08%). This is the latest completed U.S. session, with the point changes and closes matching across sources but a one-hundredth-point Nasdaq percentage discrepancy. Higher Treasury yields and weak confidence weighed on shares, while company results and a new weekend-trading plan were in focus.","world":"An Israeli strike killed a Hamas armed-wing commander as both sides traded accusations over ceasefire breaches; reported additional Gaza casualties remain attributed. Australia’s rate increase and the Myanmar airstrike toll stand alongside Malaysia’s contested repatriations, protests, flooding and regional security disputes.","sports":"At the 7:09:03 p.m. EDT check, Las Vegas leads Indiana 31–22 with 7:47 left in the second quarter; the game is explicitly in progress. Minnesota–New York is still upcoming at 8:30 p.m. EDT, while the other cards cover MLB labor, Monday’s completed NFL result and fresh league developments.","politics":"The federal judge has not yet ruled on the news outlets’ request to preserve White House access, and the temporary order expires Oct. 8. Jack Smith’s Senate testimony and the GAO opinion add new records to wider executive-power disputes, while other court cases and election controversies remain unresolved.","entertainment":"Today’s slate ranges from Dennis Haskins’ death and Disney job cuts to new or renewed screen projects, including Reacher and Carême. Casting, plans and renewals are not premiere dates unless one is explicitly announced."},"sections":{"top":[{"id":"top-ai-accord-sept29","headline":"Sept. 29: Trump and six tech CEOs publish voluntary AI safety accord after White House meeting","summary":"Reuters reports President Donald Trump and leaders of Google, Anthropic, Meta, OpenAI, X and NVIDIA signed a one-page accord calling for internal model controls, outside assessments and board oversight. The document calls itself a voluntary commitment, not a law; its proposed audits and safeguards cover risks including cyber, biological and chemical threats.","sources":["Fox","CNN","Drudge","Other"],"signal":"Consensus","links":[{"label":"Reuters, Sept. 29 — accord text","url":"https://www.reuters.com/world/us/trump-releases-ai-accord-with-tech-executives-2026-09-29/"},{"label":"AP, Sept. 29","url":"https://apnews.com/article/trump-ai-anthropic-musk-595796511f110fc006cca0d01329733e"},{"label":"CNN, updated 5:41 p.m. EDT","url":"https://www.cnn.com/2026/09/29/business/amodei-huang-karp-trump"},{"label":"Fox News live coverage, Sept. 29","url":"https://www.foxnews.com/live-news/trump-ai-white-house-meeting-september-29"},{"label":"Drudge Report — aggregator page, Sept. 29","url":"https://www.drudgereport.com/"}]},{"id":"top-iran-mediation-sept29","headline":"Updated Sept. 29: Iran says it remains open to mediated talks as Trump denies offering sanctions relief","summary":"Reuters reports Tehran remains open to mediated contacts while Trump denies offering sanctions relief; Washington separately announced new sanctions targeting Iran’s military supply chain. The public positions are attributed, and no agreement or end to the conflict has been reached.","sources":["Other"],"signal":"Split","links":[{"label":"Reuters, Sept. 29","url":"https://www.reuters.com/world/middle-east/trump-denies-offering-iran-sanctions-relief-tehran-says-ready-talks-2026-09-29/"},{"label":"AP, Sept. 29 — new sanctions","url":"https://apnews.com/article/iran-sanctions-treasury-trump-30db5eef515ed1d06591a0254292afdd"},{"label":"Fox News video, Sept. 29 — Iran proposal","url":"https://www.foxnews.com/video/6405770564112"}]},{"id":"top-sc-third-country-deportations","headline":"Sept. 29: Supreme Court interim order lets third-country deportations resume while challenge continues","summary":"The Supreme Court temporarily paused a lower-court order, allowing the administration to resume deportations to countries other than migrants’ own while the justices consider whether the policy is lawful. The order is interim, not a final ruling on the policy.","sources":["Other"],"signal":"Watch","links":[{"label":"AP via PBS NewsHour, Sept. 29, 3:31 p.m. EDT","url":"https://www.pbs.org/newshour/politics/supreme-court-lets-trump-continue-deporting-people-to-3rd-countries-while-justices-consider-policy"},{"label":"Reuters, Sept. 29","url":"https://www.yahoo.com/news/politics/articles/supreme-court-lets-trump-resume-190857993.html"}]},{"id":"top-hurricane-polo-baja","headline":"Updated Sept. 29: Hurricane Polo makes Baja landfall as forecasters warn of dangerous flooding","summary":"The Associated Press reports Polo made landfall in Baja California and forecasts life-threatening winds and flash flooding; remnants could also threaten the U.S. Southwest. The hazards are forecasts, not a confirmed final toll.","sources":["Other"],"signal":"Watch","links":[{"label":"AP, Sept. 29","url":"https://apnews.com/article/hurricane-polo-landfall-mexico-baja-california-rachel-db57554d97c70cd44b99df9ff0a41668"},{"label":"National Hurricane Center","url":"https://www.nhc.noaa.gov/"}]},{"id":"top-eisenhower-carrier-mishap","headline":"Updated Sept. 29: Navy jet crashes into Atlantic after reported equipment failure; two aviators eject","summary":"The Navy said an aircraft crashed into the Atlantic during carrier operations off Virginia after an equipment failure; two aviators ejected and four sailors were injured. AP and CNN report an investigation is underway, so the cause remains under inquiry.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"AP live update, Sept. 29, 2:10 p.m. EDT","url":"https://apnews.com/live/trump-cnn-media-midterm-elections-news-updates-09-29-2026#000001a0-ee3f-d4c3-afe0-feff5aa20000"},{"label":"CNN, Sept. 29","url":"https://www.cnn.com/2026/09/29/politics/aircraft-carrier-eisenhower-accident-hnk-ml"}]},{"id":"top-us-forces-exit-iraq","headline":"Sept. 29: U.S. forces complete withdrawal from Iraq after two decades","summary":"Reuters reports U.S. forces have completed their departure under a transition that changes the military relationship with Baghdad. Iranian officials called the move a victory, while analysts cited potential security risks; those are attributed assessments.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters, Sept. 29","url":"https://www.reuters.com/world/middle-east/us-forces-exit-iraq-after-two-decades-leaving-opening-iran-2026-09-29/"}]},{"id":"top-canada-import-ban","headline":"Sept. 29: U.S. ban on selected Canadian imports takes effect, affecting nearly $1 billion in goods","summary":"The Associated Press reports a U.S. ban covering selected Canadian alcohol, dairy products and motorcycles took effect Tuesday. It affects a small share of bilateral trade, but the move adds strain to the trade relationship.","links":[{"label":"AP, Sept. 29","url":"https://apnews.com/article/canada-us-trade-ban-tariffs-bdb4d9b946e98f84088c5c0f7f522588"},{"label":"Reuters background, Sept. 8","url":"https://www.reuters.com/business/autos-transportation/canadas-retaliatory-tariffs-take-effect-us-trade-talks-stall-2026-09-08/"}],"signal":"Split","sources":["Other"]},{"id":"top-pentagon-data-breach-sept29","headline":"Updated Sept. 29: Pentagon breach reportedly exposed personnel records tied to 2.76 million living people","summary":"A Defense Department official told ABC News that a breach at the Defense Manpower Data Center affected about 2.76 million living people and 294,000 deceased people. Reported records included sensitive personal data; the department’s investigation is ongoing.","sources":["Other"],"signal":"Watch","links":[{"label":"ABC News, Sept. 29","url":"https://abcnews.com/Politics/pentagon-breach-exposed-sensitive-data-3-million-people/story?id=136832909"},{"label":"Stars and Stripes, Sept. 29","url":"https://www.stripes.com/theaters/us/2026-09-29/data-breach-pentagon-personnel-records-23001764.html"}]},{"id":"top-clancy-status-hearing","headline":"Sept. 29: Clancy status hearing ends; next court date set for Nov. 2, no retrial scheduled","summary":"At Tuesday’s status hearing, the judge heard the defense request for a not-guilty finding; prosecutors said they have not decided whether to retry Lindsay Clancy. The next hearing is Nov. 2, and no retrial date has been set.","links":[{"label":"CNN live updates, Sept. 29","url":"https://www.cnn.com/2026/09/29/us/live-news/lindsay-clancy-hearing"},{"label":"Reuters, Sept. 29","url":"https://www.reuters.com/legal/government/lindsay-clancy-returns-court-key-hearing-after-us-murder-case-mistrial-2026-09-29/"}],"signal":"Watch","sources":["Other"]},{"id":"top-unhcr-funding-gap","headline":"Sept. 29: UNHCR warns funding shortfall could put 8.3 million people at risk of losing aid","summary":"The U.N. refugee agency says a $5.789 billion shortfall could put nearly 8.3 million refugees and forcibly displaced people at risk of losing assistance this year. That is the agency’s projection, as reported by Reuters, not a confirmed aid cut for each person.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters, Sept. 29","url":"https://www.reuters.com/world/un-agency-warns-funding-crisis-could-leave-83-million-people-without-aid-2026-09-29/"}]}],"usa":[{"id":"usa-fbi-data-breach","headline":"Updated Sept. 29: FBI official publicly urges ShinyHunters to contact bureau after employee-data breach","summary":"Reuters reports FBI Cyber Division chief Brett Leatherman warned the ShinyHunters hackers that investigators know how to find them and urged them to make contact. The breach reportedly exposed sensitive information about named bureau employees; its full scope remains under investigation.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters, Sept. 29 — FBI official’s appeal","url":"https://www.reuters.com/world/us/fbi-official-tells-shinyhunters-hackers-we-know-how-find-you-following-dutch-2026-09-29/"},{"label":"CNN, Sept. 28 — breach inquiry","url":"https://www.cnn.com/2026/09/28/politics/fbi-fallout-data-breach-hacking"},{"label":"New York Times, Sept. 28","url":"https://www.nytimes.com/2026/09/28/us/politics/fbi-shinyhunters-damage.html"}]},{"id":"usa-boeing-navy-faxx-sept29","headline":"Sept. 29: Boeing wins $20 billion development contract for Navy’s next-generation F/A-XX fighter","summary":"The Pentagon selected Boeing over Northrop Grumman for the development contract to build test aircraft, Reuters reports; the wider program could reach hundreds of billions over its life. First production jets are expected in the 2030s, and those estimates are not the current contract value.","sources":["Other"],"signal":"Consensus","links":[{"label":"Reuters, Sept. 29 — contract and program details","url":"https://www.reuters.com/business/autos-transportation/boeing-wins-us-navys-next-generation-fighter-contract-sources-say-2026-09-29/"}]},{"id":"usa-us-withdraws-greco-sept29","headline":"Sept. 29: Trump administration withdraws U.S. from European anti-corruption watchdog GRECO","summary":"The Council of Europe said the United States formally notified it that it would leave the Group of States against Corruption; a U.S. official confirmed the withdrawal, AP reports. The move fits the administration’s wider retreat from some multilateral organizations.","sources":["Other"],"signal":"Watch","links":[{"label":"AP via ABC News, Sept. 29, 4:39 p.m. EDT","url":"https://abcnews.com/US/wireStory/us-withdraws-european-anti-corruption-panel-latest-shift-136870520"},{"label":"AP, Sept. 29","url":"https://apnews.com/article/trump-corruption-council-of-europe-31f7f0e4bba7bf26dfc99cd2c3a20d16"}]},{"id":"usa-americagov-ai-launch","headline":"Sept. 29: America.gov’s new government-sourced AI answers change within moments of launch","summary":"The administration promoted America.gov as an AI-powered portal, but AP found some political answers shifted shortly after launch, including responses about the 2020 election and inauguration crowds. The changes are documented by AP; the site’s answers are not independent verification of contested political claims.","sources":["Other"],"signal":"Watch","links":[{"label":"AP, Sept. 29","url":"https://apnews.com/article/trump-americagov-website-ai-questions-answers-ff86fcb161c1fe89538d6ecb294ea353"},{"label":"PBS NewsHour, Sept. 29","url":"https://www.pbs.org/newshour/politics/watch-trump-launches-ai-powered-government-website-america-gov"}]},{"id":"usa-cornell-probe-reopened","headline":"Sept. 29: Prosecutors reopen Cornell investigation after accuser files lawsuit","summary":"A prosecutor reopened an investigation into an alleged 2024 sexual assault after a student filed suit, AP and CNN report. The allegations remain under investigation and are not established findings.","sources":["Other"],"signal":"Consensus","links":[{"label":"AP, Sept. 29","url":"https://apnews.com/article/cornell-rape-allegations-investigation-16f59e89ce97e3a40a8e672f7b3f374b"},{"label":"CNN, Sept. 29","url":"https://www.cnn.com/2026/09/29/us/cornell-university-rape-case-investigation-wwk"}]},{"id":"usa-supreme-court-new-term-docket","headline":"Sept. 29: Supreme Court weighs new-term cases on detention, prediction markets and school displays","summary":"Reuters reports the justices are considering whether to add cases involving Trump-era immigration detention, state regulation of prediction markets and a Texas Ten Commandments law to the term beginning next week. These are possible docket additions, not rulings on the merits.","links":[{"label":"Reuters, Sept. 29","url":"https://www.reuters.com/legal/government/us-supreme-court-mulls-immigrant-detention-gambling-ten-commandments-cases-2026-09-29/"}],"signal":"Watch","sources":["Other"]},{"id":"usa-apple-iceblock-removal","headline":"Sept. 29: Apple explains why it removed ICE-tracking apps from the App Store","summary":"Apple said it removed ICE-tracking applications, including ICEBlock, because of safety concerns after law-enforcement officials raised objections, CNN reports. The company’s explanation is attributed; the story does not establish that the apps caused a specific attack.","sources":["Other"],"signal":"Watch","links":[{"label":"CNN, Sept. 29","url":"https://www.cnn.com/2026/09/29/tech/apple-iceblock-app-removal-raskin"}]},{"id":"top-us-china-trade-lists","headline":"Sept. 28: U.S. and China publish lists of products that could qualify for tariff cuts","summary":"Washington and Beijing released reciprocal lists of goods that could be considered for tariff reductions, including coal and toys. AP and CNN describe an ongoing trade framework, not a completed tariff agreement.","sources":["Other"],"signal":"Consensus","links":[{"label":"AP, Sept. 28","url":"https://apnews.com/article/us-china-trade-tariffs-deal-trump-xi-f47781187c501e7c4f10a686fb2572e2"},{"label":"CNN, Sept. 28","url":"https://www.cnn.com/2026/09/28/business/us-china-tariff-cuts-60-billion-intl"}]},{"id":"usa-fbi-bailey-exit","headline":"Sept. 28: FBI co-Deputy Director Andrew Bailey says he is leaving the bureau","summary":"Bailey announced Monday that he is leaving the FBI and returning to his family after about a year in the post, AP reports. The bureau did not describe the departure as a firing in the cited report.","sources":["Other"],"signal":"Consensus","links":[{"label":"AP, Sept. 28","url":"https://apnews.com/article/fbi-bailey-patel-missouri-3c782f7e2d8857440a2d21829613e49e"}]},{"id":"usa-utah-death-row-release","headline":"Sept. 28: Utah releases death-row inmate for a new trial after DNA testing","summary":"Douglas Carter, who spent decades on death row for a 1985 killing, was released pending a new trial after DNA analysis excluded him as a possible contributor, AP reports. The release is a procedural development, not a new verdict.","sources":["Other"],"signal":"Consensus","links":[{"label":"AP, Sept. 28","url":"https://apnews.com/article/utah-death-row-douglas-carter-eva-olesen-10c0 <script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'Boston-area professional and major-college sports only.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, or international soccer.',business:'7 unique business/markets stories; close figures refer to the latest completed U.S. session.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
