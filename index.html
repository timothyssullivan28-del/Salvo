<script id="briefing" type="application/json">{"date":"2026-10-14","lastUpdated":"October 14, 2026, 4:01:29 p.m. EDT Boston","dek":"Hot inflation drives a late technology selloff, shipping danger persists near Hormuz, and Boston carries a 6–3 Bruins win into Celtics game night.","take":"Hotter U.S. inflation, Russian attacks and danger around Saudi and Hormuz shipping dominate the refreshed consensus. CNN emphasized inflation, Ukraine communications and Greenland’s rebuttal; Fox foregrounded Iran and border-status policy, while Drudge amplified inflation, Starlink and Saudi-war headlines. Drudge is an aggregator rather than an independent reporting source, and military claims and maritime responsibility remain attributed.","sectionTakes":{"top":"Hotter U.S. inflation, Russian attacks and danger around Saudi and Hormuz shipping dominate the refreshed consensus. CNN emphasized inflation, Ukraine communications and Greenland’s rebuttal; Fox foregrounded Iran and border-status policy, while Drudge amplified inflation, Starlink and Saudi-war headlines. Drudge is an aggregator rather than an independent reporting source, and military claims and maritime responsibility remain attributed.","usa":"A 3.6% Social Security increase, the Lansing deaths investigation and scrutiny of Cornell discipline lead the refreshed U.S. slate. The benefit adjustment is official, while alleged institutional failures and any connection among the Michigan deaths remain unresolved.","boston":"FINAL Tuesday: Bruins 6, Sharks 3, with Charlie McAvoy scoring in his return. Celtics–Hornets remained upcoming Wednesday at 7:30 p.m. EDT at the 4:01 p.m. check; the Patriots expect two offensive starters to miss Sunday and the Red Sox remain in offseason mode. Boston Globe material was partly paywalled, while WEEI/Audacy exposed current team items but limited accessible article text.","business":"Preliminary at 4:00:40 p.m. EDT: Dow 51,621.78, −48.32 (−0.09%); Nasdaq Composite 26,692.87, −511.51 (−1.88%), d raise rates again.","sources":["CNN","Drudge","Other"],"signal":"Consensus","links":[{"label":"Reuters — September consumer prices, Oct. 14","url":"https://www.reuters.com/world/us/us-consumer-prices-accelerate-september-costlier-gasoline-core-cpi-firmer-2026-10-14/"},{"label":"CNN — inflation accelerates to 3.7%, Oct. 14","url":"https://www.cnn.com/2026/10/14/economy/us-cpi-inflation-september"}]},{"id":"top-russia-power-strikes-oct14","headline":"Russian strikes kill at least three and damage dozens of Ukrainian power sites","summary":"Russian missile and drone strikes killed at least three people in Kyiv and damaged dozens of power facilities, Ukrainian officials told Reuters. The toll and damage assessment remained subject to change.","sources":["CNN","Fox","Drudge","Other"],"signal":"Consensus","links":[{"label":"Reuters — strikes and power damage, Oct. 14","url":"https://www.reuters.com/world/russian-strikes-kill-one-hit-energy-facilities-kyiv-mayor-says-2026-10-14/"},{"label":"Fox News — Oct. 14 headline index","url":"https://www.foxnews.com/html-sitemap/2026/october/14/"}]},{"id":"top-houthis-saudi-attacks-oct14","headline":"Houthis vow more attacks after Aramco headquarters is hit","summary":"Yemen’s Houthis vowed additional attacks on Saudi airports and oil facilities after a strike caused a limited fire at Aramco headquarters. Responsibility and targeting claims remain attributed to the combatants.","sources":["Fox","Drudge","Other"],"signal":"Consensus","links":[{"label":"Reuters — Houthi threat and Aramco strike, Oct. 14","url":"https://www.reuters.com/business/energy/yemens-houthis-vow-more-attacks-saudi-airports-oil-facilities-after-aramco-hq-2026-10-14/"}]},{"id":"top-hormuz-vessels-oct14","headline":"Two Singapore-registered vessels are struck in Hormuz and one sinks","summary":"Reuters reported that two Singapore-registered ships were struck in the Strait of Hormuz and one sank, escalating danger to commercial shipping. Initial accounts of the cause and responsibility remained under investigation.","sources":["Drudge","Other"],"signal":"Consensus","links":[{"label":"Reuters — vessels struck in Hormuz, Oct. 14","url":"https://www.reuters.com/world/asia-pacific/two-singapore-registered-vessels-struck-strait-hormuz-one-sinks-2026-10-14/"}]},{"id":"top-pope-lung-surgery-oct11","headline":"Vatican says surgery confirms Pope Leo has lung cancer","summary":"The Vatican said surgery confirmed lung adenocarcinoma and removed the lower lobe of Pope Leo’s right lung without complications. AP and CNN reported the diagnosis; doctors had not yet publicly detailed whether additional treatment would be required.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"AP — Vatican confirms pope’s lung cancer, Oct. 13","url":"https://apnews.com/article/vatican-pope-surgery-86268530ef22fd14d2712067e89946f1"},{"label":"CNN — Pope Leo diagnosed with lung cancer, Oct. 13","url":"https://www.cnn.com/2026/10/13/europe/pope-hospital-lung-surgery-intl"}]},{"id":"top-ukraine-starlink-restrictions-oct14","headline":"Ukraine says new Starlink restrictions disrupted battlefield operations","summary":"Ukrainian officials and troops told CNN that SpaceX restrictions disrupted military communications while Russia intensified attacks. The operational impact and reasons for the restrictions remain attributed to Ukrainian accounts and SpaceX had not fully detailed the change.","sources":["CNN","Drudge","Other"],"signal":"Consensus","links":[{"label":"CNN — Ukraine reports Starlink disruption, Oct. 14","url":"https://www.cnn.com/2026/10/14/europe/russia-ukraine-energy-strike-early-warning-intl-hnk"},{"label":"Reuters — Russian attacks and U.S. intelligence, Oct. 14","url":"https://www.reuters.com/business/energy/russia-hits-no-energy-targets-ukraine-first-time-since-trumps-truce-2026-10-13/"}]},{"id":"top-greenland-exploration-oct14","headline":"Trump announces oil, gas and mineral exploration push in Greenland","summary":"President ide-oct14","headline":"Zelenskiy says it is “painful” when Trump chooses a different side","summary":"Ukrainian President Volodymyr Zelenskiy told Reuters it was painful when President Trump appeared to side with Russia, as Kyiv faced another major attack. The characterization is Zelenskiy’s and the diplomatic impact remains unresolved.","sources":["CNN","Other"],"signal":"Split","links":[{"label":"Reuters — Zelenskiy interview, Oct. 14","url":"https://www.reuters.com/world/europe/ukraines-zelenskiy-says-it-is-painful-for-trump-to-choose-a-different-side-2026-10-14/"},{"label":"AP — Ukraine and Starlink developments, Oct. 14","url":"https://apnews.com/article/russia-ukraine-war-zelenskyy-burnham-trump-putin-9fe44ec1bb361f19d46dfafb58da46f6"}]}],"usa":[{"id":"usa-social-security-cola-oct14","headline":"Social Security benefits will rise 3.6% in 2027","summary":"The Social Security Administration said benefits will increase 3.6% next year under the annual cost-of-living adjustment. Reuters reported the increase after September inflation data; the adjustment follows the statutory formula rather than a discretionary vote.","sources":["Other"],"signal":"Consensus","links":[{"label":"Reuters — 2027 Social Security increase, Oct. 14","url":"https://www.reuters.com/world/us/us-retirees-receive-36-social-security-increase-2027-2026-10-14/"}]},{"id":"usa-lansing-bodies-investigation-oct14","headline":"Police investigate five bodies found along a Lansing trail","summary":"Authorities are investigating whether five bodies discovered along a trail in Lansing, Michigan, are connected, according to current reporting. Officials had not announced a serial-killer finding, so any connection remains unconfirmed.","sources":["Drudge","Other"],"signal":"Watch","links":[{"label":"New York Times — Lansing deaths investigation, Oct. 14","url":"https://www.nytimes.com/2026/10/14/us/lansing-michigan-serial-killer.html"}]},{"id":"usa-cornell-assault-discipline-oct14","headline":"CNN investigation scrutinizes Cornell discipline in sexual-assault cases","summary":"CNN reported that only two Cornell students were expelled after being found responsible for sexual assault from mid-2020 through mid-2024. The figures come from records reviewed by CNN and do not resolve individual allegations or appeals.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"CNN — Cornell sexual-assault discipline investigation, Oct. 14","url":"https://www.cnn.com/2026/10/14/us/cornell-sexual-assault-jane-doe-invs"}]},{"id":"usa-refugee-deadline-oct14","headline":"Administration shortens deadline for refugees to contest loss of status","summary":"The Trump administration sharply shortened the time affected refugees have to challenge termination of their legal status. AP reported advocates warned the timetable could deny meaningful review.","sources":["Fox","Other"],"signal":"Split","links":[{"label":"AP — refugee-status deadline, Oct. 14","url":"https://apnews.com/article/trump-refugees-immigration-deportation-fda84f5c5ebeb929cbc2c2dbeb92bf27"}]},{"id":"usa-pacific-storm-record-oct14","headline":"El Niño drives record run of large, long-lived eastern Pacific storms","summary":"The eastern Pacific has set a record for major, long-lasting storms during the current El Niño, AP reported, as forecasters monitor continuing flood risks. Attribution is based on meteorological analysis.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — Pacific hurricane record, Oct. 14","url":"https://apnews.com/article/hurricanes-pacific-storms-el-nino-rachel-simon-d12aa0402deacfeb461db3aeef86d613"}]},{"id":"usa-six-flags-nine-rides-closed-oct13","headline":"Police identify man killed in Six Flags fall as company closes nine rides","summary":"Police identified the 42-year-old Atlanta man who died after falling from the Goliath coaster, while Six Flags closed nine similar rides as a precaution. Investigators have not announced a cause, and witness accounts remain preliminary.","source y":"CNN profiled Gustavo Dudamel’s effort to extend the New York Philharmonic’s reach beyond the concert hall during his inaugural season. The orchestra’s official program shows his first European tour underway this month.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"CNN — Dudamel’s New York mission, Oct. 14","url":"https://www.cnn.com/2026/10/14/entertainment/dudamel-nyphil-venezuela-el-sistema"},{"label":"New York Philharmonic — inaugural season","url":"https://www.nyphil.org/concerts-tickets/explore/dudamel-inaugural-season"}]}]},"researchNotes":["Fresh research and reranking completed for all eight tabs at October 14, 2026, 1:03:11 p.m. EDT Boston.","Fox, CNN and Drudge framing reviewed; Drudge treated as an aggregator.","WEEI/Audacy and Boston Globe checked; Globe access remained partly paywalled and WEEI article extraction was limited.","Yahoo Finance cash-index quotes verified around 1:01 p.m. EDT; Reuters supplied market context.","Boston schedules/results checked against official NHL, NBA, Patriots and MLB sources; Celtics–Hornets remained upcoming.","General Sports screened for Boston teams, auto racing, international soccer and all WNBA coverage."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, or international soccer.',business:'7 unique business/markets stories; on trading days at 7 a.m. show timestamped indicative Dow and Nasdaq-100 futures, clearly not cash indexes; on weekends and market holidays state cash markets are closed and show no live/premarket snapshot, while identifying the latest completed session. At 10 a.m. and 1 p.m. on trading days show timestamped Dow and Nasdaq Composite cash-index levels, point and percentage moves, and any provider delay; at 4 p.m. show timestamped closing moves as confirmed or clearly preliminary; at 7 p.m. use confirmed closes.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
