ien” and “Top Gun” actor, dies at 93","summary":"AP reports the death of the Emmy-winning “Picket Fences” star whose film roles ranged from “Alien” to “Top Gun.” The report celebrates a long career of authoritative character performances; no unsupported cause of death is supplied here.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/tom-skerritt-dies-598ccdd4849ea7fe3b72b71319a4ef9b","label":"AP — Oct. 22, 2026"}]},{"id":"entertainment-bioware-oct22-eve","headline":"EA shuts BioWare and cancels the next “Mass Effect”","summary":"BioWare announced its closure after more than three decades, and the next “Mass Effect” game was canceled. AP distinguishes the studio’s confirmation from Bloomberg’s broader layoff estimate; EA had not immediately answered AP’s request for comment.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/bioware-ea-electronic-arts-shutdown-mass-effect-6b6e5c930fe56dd2cd18985d89f6ef24","label":"AP — Oct. 22, 2026"}]},{"id":"ent-raffi-oct23-eve","headline":"Raffi reflects on 50 years, children’s screen time and new music","summary":"AP’s Oct. 22 interview revisits the singer’s breakthrough and his views on how children consume music today. His concerns about screens are attributed to the artist rather than presented as a newly proved medical finding.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/raffi-new-album-interview-d50d8f9ad50e6072ce5847324c7e5a6e","label":"AP — 6:11 AM EDT, October 22, 2026"}]}]},"researchNotes":["Boston Globe access varied and remained partly paywalled; WEEI/Audacy team hubs checked but fresh full text limited. Official team and league reports support substantive facts.","Oleshky ceasefire start dates conflict between Reuters dispatches; the agreement is reported without a settled effective date. Kirk article predates a confirmed hearing outcome, which is not asserted.","AP confirms Friday closing levels and point moves; Reuters independently matches and supplies precise percentages. CNBC and Investopedia page access was limited; no intraday quote substituted.","Oct. 24 delayed recovery of scheduled 7 a.m. run; actual publication timestamp used. No schedule changes. Refreshed Top News, USA, Boston Sports and Sports only.","Business, World, Politics and Entertainment cards, original source dates, links and Tells preserved exactly from Friday evening.","Boston Globe checked, with some accessible article text but subscription overlays; WEEI/Audacy checked, with limited fresh full article text. Official NBA/NHL/Patriots sources verify results and schedules.","Recovery occurred in the evening; the page uses the actual Oct. 24 build time, not a backdated 7 a.m. timestamp. Bruins feeds remained pregame at the precise check time; no score or puck-drop claim invented."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, international soccer, or WNBA coverage.',business:'7 unique business/markets stories refreshed only at 7 p.m. Eastern Monday through Friday, with independently confirmed figures for the latest completed U.S. cash session. Preserved unchanged at all other editions.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
