://www.mlb.com/redsox/roster/transactions"}]}],"business":[{"id":"story-n25e-25","headline":"Wednesday close: Dow gains 164.25; Nasdaq loses 147.73","summary":"Completed Nov. 25 cash session: Dow 50,182.95, +164.25 (+0.33%); Nasdaq Composite 23,585.80, −147.73 (−0.62%). AP supplies exact closing levels and points; CNBC corroborates levels and precise percentages. A large intraday rebound did not erase the Nasdaq’s final loss.","sources":["Other"],"signal":"Watch","links":[{"label":"apnews.com — Nov. 25, AP updated 6:05 p.m. EST; completed close; checked Wednesday evening","url":"https://apnews.com/article/stock-markets-ai-earnings-oil-10044b4fb55d3ff20fde9ba9e9acaab1"},{"label":"CNBC — Nov. 25 completed close; +0.33% Dow, −0.62% Nasdaq","url":"https://www.cnbc.com/2026/11/24/stock-market-today-live-updates-.html"}]},{"id":"story-n25e-27","headline":"FCC authorizes million-satellite data-center plan; feasibility disputed","summary":"AP reports SpaceX received authorization Wednesday for an orbital computing constellation, with phased deployment deadlines. Scientists question cost, cooling, debris and astronomical interference. Regulatory permission is not proof one million satellites exist, have launched or can operate economically.","sources":["Other"],"signal":"Watch","links":[{"label":"apnews.com — Nov. 25, updated 6:42 p.m. EST; checked Wednesday evening","url":"https://apnews.com/article/spacex-data-center-elon-musk-b9897fe06f851ffaf92fd304ae69075c"}]},{"id":"story-n25e-26","headline":"Boehly-led group agrees Lukoil overseas deal, subject to approval","summary":"CNN reports Eldridge announced an agreement including US development-finance participation and a share swap rather than direct cash to Russia. Price was undisclosed and Treasury approval remains conditional. An announced acquisition agreement is not a closed transaction.","sources":["CNN"],"signal":"Watch","links":[{"label":"cnn.com — Nov. 25; Wednesday company announcement reported; checked Wednesday evening","url":"https://www.cnn.com/2026/11/25/business/lukoil-sale-todd-boehly-intl"}]},{"id":"story-n25e-24","headline":"Thirty-year mortgage average eases to 7.21%, still above year-ago level","summary":"Freddie Mac’s weekly average fell from 7.28% to 7.21%, AP reports; a year earlier it was 6.23%. Fifteen-year loans averaged 6.54%. These are survey averages, not a guaranteed quote, and a small weekly decline does not undo elevated borrowing costs.","sources":["Other"],"signal":"Watch","links":[{"label":"apnews.com — Nov. 25, updated 3:07 p.m. EST; checked Wednesday evening","url":"https://apnews.com/article/mortgages-housing-inflation-interest-rates-1e8162cf0344617b916427033f7aece7"}]},{"id":"story-n25e-29","headline":"Australia passes online duty-of-care law with major tech penalties","summary":"AP reports Parliament adopted legislation requiring platforms to address foreseeable harms, with potentially multibillion-dollar fines. Supporters emphasize protection and opponents warn of censorship. The law’s passage does not establish a particular company has violated it or already owes a fine.","sources":["Other"],"signal":"Watch","links":[{"label":"apnews.com — Nov. 25, updated 4:27 a.m. EST; checked Wednesday evening","url":"https://apnews.com/article/australia-digital-duty-care-law-tech-harm-b3f044575e9d8106f30a14eee2b89a81"}]},{"id":"story-n25e-28","headline":"Biovac targets vaccine expansion with €75 million EU-backed loan","summary":"AP reports financing for a Cape Town manufacturing facility and a goal of end-to-end African cholera-vaccine production by late 2028. Clinical trials and regulatory approval remain ahead. Financing and production targets are not evidence the vaccine is already approved or being supplied at scale.","sources":["Other"],"signal":"Watch","links":[{"label":"apnews.com — Nov. 25, updated 2:58 p.m. EST; checked Wednesday evening","url":"https://apnews.com/article/vaccines-pharma-south-africa-biovac-03f068779922eb1108403baf9872ae78"}]},{"id":"story-n24e-35","headline":"Shein agrees $100 million FTC settlement without admitting liability","summary":"AP reports the agreement addresses allegations about delivery promises, reviews and product-origin claims, with funds intended for consumer redress. Shein disputes aspects of the agency’s characterization. A settlement is not a criminal conviction or a finding that every product claim was false.","sources":["Other"],"signal":"Watch","links":[{"label":"apnews.com — Nov. 24, updated 4:09 p.m. EST; checked Wednesday evening","url":"https://apnews.com/article/shein-federal-trade-commission-100-million-1552732fdc2210858ff9f777ac3227a3"}]}],"sports":[{"id":"story-n25e-37","headline":"Steelers release Rodgers after benching and public clash","summary":"AP reports Pittsburgh cut Aaron Rodgers Wednesday after announcing Mason Rudolph would start Friday. Rodgers criticized Mike McCarthy; the coach disputed aspects of his account. The roster move is confirmed, but allegations about meeting conduct remain disputed and this is not a retirement announcement.","sources":["Other"],"signal":"Watch","links":[{"label":"apnews.com — Nov. 25, updated 6:57 p.m. EST; checked Wednesday evening","url":"https://apnews.com/article/pittsburgh-steelers-aaron-rodgers-mike-mccarthy-fc3541d64c60a659f06a87653e96c247"}]},{"id":"story-n25e-35","headline":"Mets finalize Skubal’s record $450 million, nine-year contract","summary":"AP reports the deal was finalized Wednesday, setting a pitcher total-value record. It includes $30 million in deferred money. Finalization supersedes the earlier agreement-in-principle stage; contract value is not a guarantee of future health or performance.","sources":["Other"],"signal":"Watch","links":[{"label":"apnews.com — Nov. 25, updated 6:58 p.m. EST; checked Wednesday evening","url":"https://apnews.com/article/skubal-mets-contract-17d78984218ffe40c188f39ec1eb9067"}]},{"id":"story-n25e-34","headline":"MLB sues union in pre-lockout antitrust maneuver","summary <script>

let active='top';

function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}

document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
