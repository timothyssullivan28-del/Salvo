<script id="briefing" type="application/json">{"date":"2026-09-27","lastUpdated":"September 27, 2026, 7:00 a.m. EDT Boston","dek":"The Iran standoff, a deadly Northeast nor’easter, two Pacific hurricanes, fresh violence in South Africa and an incident near a U.S.-used British air base lead this Sunday Boston edition.","take":"Fox’s Sunday page frames Trump’s Iran rejection as a “Global Standoff,” while CNN leads with the fatal nor’easter and also highlights South Africa and Fairford; they prioritize the same major crises differently. On the Trump–Xi summit, Fox stresses a reported tariff deal while CNN centers on China’s AI ambitions and unsettled terms; Drudge links to a “long on pomp, short on progress” critique. Drudge is an aggregator, not an independent reporting source; Reuters, AP and official advisories provide the underlying reporting while investigations, negotiations and storm forecasts remain unresolved.","sectionTakes":{"top":"Fox’s Sunday page frames Trump’s Iran rejection as a “Global Standoff,” while CNN leads with the fatal nor’easter and also highlights South Africa and Fairford; they prioritize the same major crises differently. On the Trump–Xi summit, Fox stresses a reported tariff deal while CNN centers on China’s AI ambitions and unsettled terms; Drudge links to a “long on pomp, short on progress” critique. Drudge is an aggregator, not an independent reporting source; Reuters, AP and official advisories provide the underlying reporting while investigations, negotiations and storm forecasts remain unresolved.","usa":"Recent U.S. cases include the Pittsburgh attack, two Ole Miss student deaths and a disputed claim of mistaken ICE detention; investigations are ongoing and allegations remain attributed. USDA’s meat recall is an official safety notice, while Meta’s jury verdict still has penalties pending and TikTok settled before trial. The Kalshi appeals decision is limited to the court and states involved, not a nationwide resolution.","world":"Flooding persisted in Bangkok on Sunday even as rain eased, while the Athens collapse and Pakistan blast reports rely on local responder counts. Catania airport’s suspension was extended through Sunday night; India’s voter-roll software review and the Venezuela election timeline remain unresolved. WHO’s Ebola warning is an agency assessment, and the Colombia extradition allegations are not a finding of guilt.","boston":"Virginia Tech beat Boston College 21–14 Saturday; that is the only Saturday Boston-area final in these cards, as the Red Sox, Patriots, Bruins and Celtics did not play Saturday. The Cubs–Red Sox finale was moved to Tropicana Field for Sunday, and New England’s Jaguars game was still upcoming at 1 p.m. The remaining cards distinguish Friday’s Bruins preseason result from current Celtics camp news.","sports":"Saturday’s college slate produced Texas’ 20–17 win over Tennessee, Iowa’s last-second 20–19 upset of Michigan and Ohio State’s 42–19 victory over Illinois. Other cards cover NFL availability, the WNBA opening-round matchup, baseball, the Connecticut Sun’s relocation and an NBA trade. No Boston teams, auto racing or international soccer are included.","politics":"The DOJ’s election-monitor effort is a plan, not an established finding of fraud, while separate Ohio and California court actions address different election-administration questions. The other cards track midterm campaigning, a disputed New Jersey ethics report and the White House’s unresolved funding dispute. The coverage distinguishes prospective steps and allegations from rulings and completed outcomes.","business":"Friday, Sept. 25’s U.S. close (latest completed session): the Dow Jones Industrial Average rose 478.64 points (+0.93%) to 51,828.62; the Nasdaq Composite gained 129.34 points (+0.48%) to 27,068.72. AI-linked shares drove the advance, though elevated Treasury yields and oil left risks in view. U.S. cash markets are closed for the weekend; the other cards cover company deals, products, litigation and possible regulatory changes.","entertainment":"Swift’s expanded album is out, while the VMAs and “Patient Zero” video are still scheduled for Sunday night. Netflix’s “A Different World” sequel has premiered, and the restored “9 to 5” re-release is upcoming in October. Sheeran’s Gillette dates were canceled; the Paramount challenge is a court filing, and Macklemore’s aid tour is an announcement, not a completed event."},"sections":{"top":[{"id":"top-iran-war-vote-proposal","headline":"Trump rejects Iran’s seven-day plan to reopen the Strait of Hormuz; no ceasefire or agreement is in place","summary":"Reuters and CNN report President Donald Trump publicly rejected Iran’s proposal on Saturday. Iran’s foreign minister said Tehran had seen Trump’s reaction but had not received a formal response through mediators; terms are attributed to Tehran, and no U.S.–Iran agreement or ceasefire has been reached. Reports of possible renewed strikes after the midterms remain attributed to unnamed officials, not an announced military decision.","sources":["Fox","CNN","Other"],"signal":"Watch","links":[{"label":"Reuters: Trump rejects Iranian proposal","url":"https://www.reuters.com/world/middle-east/iran-awaits-us-move-after-wsj-report-says-trump-rejects-peace-plan-2026-09-26/"},{"label":"CNN: Trump rejects latest Hormuz proposal","url":"https://www.cnn.com/2026/09/26/middleeast/trump-rejects-iran-proposal-hormuz-intl"},{"label":"Fox News: Iran live coverage","url":"https://www.foxnews.com/live-news/iran-war-strait-hormuz-trump-talks-oil-gas-prices-midterms-09-26-26"}]},{"id":"top-noreaster-new-jersey-flooding","headline":"Fatal nor’easter batters the Northeast with coastal flooding, power outages and dangerous surf","summary":"CNN’s live report, updated 3:31 a.m. EDT Sunday, describes a rare early-season storm with flooding along the New Jersey shore, damaging winds, outages and at least one reported death. The storm continues to bring rain and high winds into Sunday, with more coastal flooding and hazardous surf possible; impacts vary by place and remain ongoing.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"CNN: live nor’easter tracker (updated 3:31 a.m. EDT Sunday)","url":"https://www.cnn.com/2026/09/26/weather/live-news/noreaster-weekend-storm"},{"label":"AP: flooding and storm impacts in New Jersey","url":"https://apnews.com/article/noreaster-storm-cape-cod-new-england-4057bec1ced5c4883d36c30c778df410"},{"label":"Reuters: Northeast storm impacts","url":"https://www.reuters.com/business/environment/noreaster-leaves-over-100000-customers-without-power-us-northeast-over-400-2026-09-26/"}]},{"id":"top-hurricane-polo-mexico","headline":"Category 3 Hurricane Polo strengthens to 120 mph; warnings cover parts of Baja ahead of Monday approach","summary":"The latest NHC advisory, No. 27 at 2 a.m. MST Sunday (4 a.m. EDT), puts Polo about 300 miles southwest of Cabo San Lucas with 120-mph winds, moving north-northwest at 10 mph. Mexico issued hurricane warnings along parts of both coasts of Baja California Sur; NHC forecasts Polo will approach Monday, with life-threatening flooding, storm surge and damaging surf possible—not yet observed landfall impacts.","sources":["Other"],"signal":"Watch","links":[{"label":"NHC Hurricane Polo advisory No. 27 (2 a.m. MST Sunday)","url":"https://www.nhc.noaa.gov/mobile/text/refresh/MIATCPEP2+html/427474.shtml"},{"label":"NHC key messages for Hurricane Polo","url":"https://www.nhc.noaa.gov/graphics_ep2.shtml?key_messages"}]},{"id":"top-pacific-hurricanes","headline":"Hurricane Nolo strengthens to 100 mph south of Hawaiʻi; NHC says the core will stay well south of the main islands","summary":"NHC advisory No. 27, issued 11 p.m. HST Saturday (5 a.m. EDT Sunday), located Nolo about 200 miles south-southwest of South Point with 100-mph sustained winds, moving west at 9 mph. No coastal watches or warnings were in effect; the center is forecast to remain well south and southwest of the main islands, though heavy rain, flooding, mudslides, high surf and rip currents remain hazards.","sources":["Other"],"signal":"Watch","links":[{"label":"NHC Hurricane Nolo advisory No. 27 (11 p.m. HST Saturday)","url":"https://www.nhc.noaa.gov/mobile/text/refresh/HFOTCPCP2+html/261755.shtml"},{"label":"Hawaii Emergency Management Agency: Nolo updates","url":"https://dod.hawaii.gov/hiema/tropical-storm-nolo-updates/"}]},{"id":"top-fairford-base-arrests","headline":"UK police arrest several men near RAF Fairford, a U.S.-used air base, over suspected explosives offenses","summary":"Reuters reports Gloucestershire police said several men were arrested on suspicion of offenses under the Explosives Act; Army bomb-disposal specialists were examining vehicles and nearby residents had been evacuated. The base hosts U.S. Air Force personnel. Authorities had not publicly established a motive or linked the incident to the Iran conflict.","links":[{"label":"Reuters: arrests and investigation near RAF Fairford","url":"https://www.reuters.com/world/uk/uk-police-arrest-men-explosives-act-offenses-after-air-base-security-stepped-up-2026-09-27/"},{"label":"CNN: Fairford arrests and evacuations","url":"https://www.cnn.com/2026/09/27/uk/fairford-arrests-uk-raf-us-intl"}],"signal":"Watch","sources":["CNN","Other"]},{"id":"top-south-africa-twin-shootings","headline":"Police report 27 dead in two mass shootings near Johannesburg and Cape Town","summary":"The Associated Press reports police said 17 people were killed Saturday night in a bar shooting in Wedela and 10 more in a separate attack at a store in Lwandle early Sunday; at least 26 people were reported injured across the attacks. Police said no arrests had been made as of the AP report, and the casualty totals are attributed to authorities.","links":[{"label":"AP: two shootings leave at least 27 dead","url":"https://www.bozemandailychronicle.com/wire/international/separate-mass-shootings-in-south-africa-townships-leave-at-least-27-people-dead/article_347edb58-3801-566e-8b83-5f0403d3a17a.html"},{"label":"CNN: South Africa shooting coverage","url":"https://www.cnn.com/2026/09/27/africa/south-africa-shooting-tavern-intl-hnk"}],"signal":"Watch","sources":["CNN","Other"]},{"id":"top-trump-xi-summit","headline":"Trump–Xi summit yields a reported $30 billion tariff arrangement, but rates and product details remain pending","summary":"Fox reports the White House described a reciprocal tariff-reduction agreement covering $30 billion in non-sensitive goods, with rates and a full product list still unpublished. Reuters reports China’s Foreign Ministry described an eight-point consensus that also includes an AI dialogue and trade council, while CNN’s summit coverage centers on Beijing’s push to shape global AI. The accounts differ in emphasis; the implementation details have not been fully disclosed.","sources":["Fox","CNN","Drudge","Other"],"signal":"Split","links":[{"label":"Fox News: reported $30B tariff arrangement","url":"https://www.foxnews.com/politics/us-china-strike-deal-lower-tariffs-30b-goods-trump-xi-washington-summit"},{"label":"Reuters: China’s account of summit outcomes","url":"https://www.reuters.com/world/china/china-us-agree-30-billion-tariff-cut-ai-dialogue-during-xi-visit-2026-09-26/"},{"label":"CNN: China’s global AI pitch","url":"https://www.cnn.com/2026/09/26/tech/us-china-ai-explainer-intl"},{"label":"Drudge Report: current front page (aggregator)","url":"https://www.drudgereport.com/"}]},{"id":"top-supreme-court-save-database","headline":"Supreme Court lets states use an expanded federal SAVE database for voter checks while litigation continues","summary":"The Supreme Court blocked a lower-court order that had barred states from using an expanded federal immigration database for broad citizenship checks of voter registrations. Reuters says the database’s overall error rate is unknown, and voting-rights groups cite eligible citizens who were incorrectly flagged. The emergency ruling permits checks while litigation continues; it does not establish widespread noncitizen voting.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Supreme Court ruling","url":"https://www.reuters.com/world/supreme-court-restores-trumps-mass-voter-verification-system-2026-09-25/"},{"label":"AP: database ruling","url":"https://apnews.com/article/save-database-noncitizen-voters-trump-supreme-court-412e12f5a492dd20e407812f30f7c139"}]},{"id":"top-supreme-court-missouri-map","headline":"Supreme Court again blocks Missouri from using the Trump-backed congressional map in the 2026 midterms","summary":"The Supreme Court rejected the Republican-backed map for a third time, leaving Missouri on track to use its 2022 congressional districts in November, according to AP and Reuters. This is a consequential election-law ruling, not a prediction about any race, and follows a fast-moving series of court orders.","sources":["Fox","Other"],"signal":"Consensus","links":[{"label":"Reuters: third Supreme Court block","url":"https://www.reuters.com/world/us-supreme-court-bars-republican-drawn-map-missouri-third-time-2026-09-25/"},{"label":"AP: Supreme Court rejects Missouri map","url":"https://apnews.com/article/supreme-court-missouri-redistricting-congressional-map-3f43ba5f47681ea759115fbc250712d4"},{"label":"Fox News: Supreme Court decision","url":"https://www.foxnews.com/politics/supreme-court-blocks-missouri-from-using-new-congressional-map-2026-election"}]},{"id":"top-white-house-press-access","headline":"White House leaves CNN off Air Force One for Trump’s Tennessee trip despite a temporary order restoring its press access","summary":"CNN and AP report the network was left off President Donald Trump’s Saturday travel pool for a Tennessee college-football trip. A judge’s separate, temporary 14-day order restored White House press passes for CNN, MS NOW and Politico, but the travel-pool dispute continues. The temporary restoration is not a final ruling on the outlets’ First Amendment claims.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"CNN: Air Force One travel-pool exclusion","url":"https://www.cnn.com/2026/09/25/politics/white-house-blocks-cnn-air-force-one-travel-pool"},{"label":"Reuters: White House blocks CNN from flight","url":"https://www.reuters.com/business/media-telecom/white-house-blocks-cnn-air-force-one-trip-washington-post-reports-2026-09-26/"},{"label":"AP: CNN left off Saturday trip","url":"https://apnews.com/article/white-house-media-ban-cnn-network-pool-c32504981ee2f5b3c137e57d9d36f33e"},{"label":"Reuters: judge’s temporary access order","url":"https://www.reuters.com/world/judge-lifts-trumps-white-house-ban-cnn-ms-now-politico-2026-09-24/"}]}],"usa":[{"id":"usa-pittsburgh-doctor-killed","headline":"Pittsburgh pediatrician Idris Evans is killed in a home attack; his wife is critically injured, officials say","summary":"Police say a man entered the home and stabbed Evans and his wife while they slept; the suspect was detained. The investigation is ongoing, and the attack account is attributed to law enforcement.","sources":["CNN","Fox","Other"],"signal":"Consensus","links":[{"label":"CNN: Pittsburgh investigation","url":"https://www.cnn.com/2026/09/25/us/pittsburgh-doctor-idris-evans-stabbing-home"},{"label":"PennLive: local report","url":"https://www.pennlive.com/crime/2026/09/upmc-childrens-hospital-physician-killed-in-stabbing-suspect-detained.html"}]},{"id":"usa-copenhaver-death","headline":"James Copenhaver, wounded in the 2024 Butler rally shooting, dies from injury complications","summary":"Copenhaver, 76, was one of two people wounded when a gunman opened fire at then-candidate Donald Trump’s Pennsylvania rally in July 2024. His lawyer said he died from complications related to those injuries; the death brings renewed attention to the attack’s victims.","sources":["Fox","Other"],"signal":"Consensus","links":[{"label":"AP: Copenhaver’s death","url":"https://apnews.com/article/james-copenhaver-trump-rally-butler-dies-00866b37ad8db967b4ebf6582c756bcd"},{"label":"CBS Pittsburgh","url":"https://www.cbsnews.com/pittsburgh/news/jim-copenhaver-trump-rally-assassination-attempt-victim-dies/"},{"label":"Fox News","url":"https://www.foxnews.com/politics/james-copenhaver-man-shot-trump-butler-rally-dies-complications-from-injuries-report"}]},{"id":"usa-ole-miss-deaths","headline":"Two Ole Miss student deaths remain under investigation; kratom found at the scene does not establish a cause","summary":"Authorities are investigating the deaths of two students, and reporting says kratom was found at the scene. Investigators have not established that the substance caused either death; the cases remain under investigation.","sources":["CNN","Fox","Other"],"signal":"Watch","links":[{"label":"AP: deaths and kratom","url":"https://apnews.com/article/kratom-mississippi-deaths-students-5c4d6429e65b573b2667119a8f860ddb"},{"label":"CNN: Ole Miss deaths","url":"https://www.cnn.com/2026/09/24/us/ole-miss-student-deaths-wwk"},{"label":"Fox News","url":"https://www.foxnews.com/us/ole-miss-victim-identified-narcotics-task-force-probes-two-student-deaths"}]},{"id":"usa-evanston-ice-detention","headline":"U.S. citizen says ICE agents mistakenly detained and injured him in Evanston","summary":"A U.S. citizen says immigration agents wrongly detained and injured him; local police and the man have offered accounts of the encounter. The claim is disputed and under scrutiny, not a court finding about the agents’ conduct.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"CNN: Evanston detention","url":"https://www.cnn.com/2026/09/24/us/ice-us-citizen-detained-evanston"},{"label":"AP: local account","url":"https://apnews.com/article/chicago-illinois-ice-immigration-agents-evanston-police-2e07d80e8d96685489e914880a4e4d5"}]},{"id":"usa-usda-meat-recall","headline":"USDA recalls more than 167,000 pounds of meat produced without federal inspection","summary":"The Food Safety and Inspection Service says Star Meat Delivery recalled raw pork, beef and goat products that were produced without federal inspection. Check the agency’s recall notice for affected labels, lot details and handling instructions.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"USDA-FSIS recall notice","url":"https://www.fsis.usda.gov/recalls-alerts/star-meat-delivery-inc--recalls-raw-pork-beef-and-goat-products-produced-without"},{"label":"CNN: recall coverage","url":"https://www.cnn.com/2026/09/24/us/meat-recall-usda-star-meat-delivery-hnk"}]},{"id":"usa-meta-cambridge-analytica-jury","headline":"New Mexico jury finds Meta misled users about Facebook data practices in Cambridge Analytica case","summary":"A Santa Fe jury found 26 of 29 statements identified by New Mexico to be misleading, including statements about data practices, hate speech and misinformation; it rejected some other claims. The verdict concerns a state case arising from the Cambridge Analytica scandal. A judge will determine civil penalties, so the verdict is not a final damages award or a finding that Facebook sold every user’s data.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: jury verdict","url":"https://www.reuters.com/business/meta-misled-consumers-case-over-cambridge-analytica-scandal-new-mexico-jury-says-2026-09-25/"},{"label":"AP: case background and trial","url":"https://apnews.com/article/facebook-meta-new-mexico-privacy-lawsuit-8b414eb0a14d58d7cdc6ae752e25dcb0"}]},{"id":"usa-lincoln-sailor-mental-health","headline":"Navy says eight USS Lincoln carrier-group sailors attempted suicide during deployment","summary":"The Navy disclosed eight suicide attempts among sailors assigned to the USS Abraham Lincoln carrier group during deployment. The report raises questions about the strain of service; it does not identify individual sailors, and care resources are available through military and civilian crisis services.","sources":["Other"],"signal":"Watch","links":[{"label":"AP: Navy disclosure","url":"https://apnews.com/article/uss-lincoln-aircraft-carrier-suicide-attempts-iran-7bb8316aa4fd67e6d2c8b34c029eebda"}]},{"id":"usa-tiktok-alabama-settlement","headline":"TikTok settles Alabama’s teen-harm lawsuit on eve of the first state trial over the claims","summary":"Reuters reports TikTok and ByteDance reached a settlement with Alabama over allegations that the platform was designed to addict children and that the companies misled consumers about safety. The Alabama attorney general’s office says the state will receive at least $100 million within 45 days, with potential payments up to $300 million if conditions are met. This is a settlement before trial, not a court finding that every allegation was proven.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Alabama settlement and terms","url":"https://www.reuters.com/world/us/tiktok-settles-with-alabama-ahead-first-state-trial-over-claims-teen-harms-2026-09-25/"}]},{"id":"usa-kalshi-sixth-circuit-ruling","headline":"Appeals court says states may regulate Kalshi sports-event contracts under gambling laws","summary":"Reuters reports the 6th U.S. Circuit Court of Appeals ruled that Ohio and Tennessee gambling laws were not preempted by federal law and that Kalshi had not shown its sports-event contracts were swaps subject exclusively to Commodity Futures Trading Commission regulation. The ruling is a circuit-court decision; broader litigation and regulatory questions remain.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: 6th Circuit ruling","url":"https://www.reuters.com/business/finance/us-appeals-court-rules-against-kalshi-says-states-can-regulate-prediction-2026-09-25/"}]},{"id":"usa-tasia-fortune-investigation","headline":"Mississippi police say Tasia Fortune’s death was staged after a drug dispute; case remains under investigation","summary":"An Associated Press report says a Jackson police detective testified that investigators believe Fortune was killed during a drug dispute and that her body was hung in a staged scene. These are police allegations and testimony in an ongoing criminal case, not a final court finding about motive or guilt.","sources":["Other"],"signal":"Watch","links":[{"label":"AP report via Boston Herald","url":"https://www.bostonherald.com/2026/09/25/tasia-fortune-death-staged/"},{"label":"AP report via WPSD Local 6","url":"https://www.wpsdlocal6.com/news/tasia-fortunes-hanging-was-staged-after-her-death-in-a-drug-dispute-mississippi-police-say/article_a8197c4e-b146-4b9a-ae35-11f691131480.html"}]}],"world":[{"id":"world-bangkok-flood-disaster-zone","headline":"Flooding persists across Bangkok after rain eases; thousands evacuated, AP reports","summary":"AP reports rain eased in Thailand’s capital on Sunday, but flooding persisted in several low-lying areas and thousands of people were evacuated. Reuters reported the governor declared Bangkok a disaster-affected zone on Saturday after nearly 300 millimeters (12 inches) of rain fell in 48 hours; further thunderstorms remain in the forecast.","sources":["Other"],"signal":"Watch","links":[{"label":"AP: thousands evacuated as flooding persists","url":"https://apnews.com/article/thailand-bangkok-flooding-heavy-rain-acf2918cba2517227f7f7097caa786cb"},{"label":"Reuters: Bangkok disaster-zone declaration","url":"https://www.reuters.com/business/environment/thai-capital-bangkok-declared-disaster-zone-amid-flooding-2026-09-26/"}]},{"id":"world-athens-building-collapse-update","headline":"Athens explosion collapses a building and kills six, fire brigade says; cause remains under investigation","summary":"The Greek fire brigade said six people died after a two-story building in central Athens collapsed following Friday’s explosion. A fire brigade official said rescuers were searching for an elderly couple and four tourists. The city’s mayor said the blast was likely linked to gas infrastructure, but investigators have not established sed “pocket rescission” to withhold more than $800 million in Congress-approved funds. The administration says it is cutting waste; Sen. Susan Collins calls the move illegal. The separation-of-powers dispute remains unresolved.","sources":["Other"],"signal":"Split","links":[{"label":"Reuters: pocket rescission and Collins response","url":"https://www.reuters.com/legal/government/trump-seeks-withhold-800-million-congress-approved-funds-2026-09-26/"},{"label":"ABC News: White House order and Collins response","url":"https://abcnews.com/Politics/white-house-orders-800m-funds-rescinded-collins-calls/story?id=136772703"}]}],"business":[{"id":"business-friday-market-close","headline":"Friday’s U.S. close: Dow adds 478.64 points and Nasdaq 129.34; markets are closed for the weekend","summary":"Friday, Sept. 25 was the latest completed U.S. market session. The Dow closed at 51,828.62, up 478.64 points (0.93%), and the Nasdaq Composite closed at 27,068.72, up 129.34 points (0.48%); Reuters reports the percentages and AP supplies the exact point advances. AI-linked shares helped drive gains even as Treasury yields and oil kept investors wary. These are completed Friday closes, not live Sunday market levels.","sources":["Other"],"signal":"Consensus","links":[{"label":"Reuters: Wall Street close and drivers (Sept. 25)","url":"https://www.reuters.com/business/wall-st-futures-gain-ai-enthusiasm-eases-worries-over-higher-oil-prices-yields-2026-09-25/"},{"label":"AP: exact Dow and Nasdaq point moves (Sept. 25)","url":"https://apnews.com/article/wall-street-stocks-dow-nasdaq-36d06c7a598e03539e0e09bdf6b7ede2"}]},{"id":"business-akamai-anthropic-cloud-deal","headline":"Akamai signs seven-year $11.6 billion Anthropic cloud deal; warrant could give AI firm up to 5%","summary":"Akamai says Anthropic committed $11.6 billion over seven years for cloud services, with a warrant for up to a 5% stake; another $9 billion in services could trigger the remaining warrant portion. Akamai estimates tps://www.reuters.com/legal/litigation/us-jury-says-apple-owes-record-57-billion-haptic-technology-patent-case-2026-09-26/"}]},{"id":"business-nubank-monzo-talks","headline":"Report: Nubank in early talks on a possible Monzo combination at an £8–10 billion valuation","summary":"Reuters says Sky News reported that Nubank and Monzo are in early-stage talks about a potential combination; Monzo’s board is also considering a new funding round. The companies declined to comment, and no agreement has been announced. The valuation is Sky’s reported range, not a confirmed offer or deal value.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: reported Nubank–Monzo discussions (Sept. 26)","url":"https://www.reuters.com/business/finance/monzo-talks-sale-nubank-about-10-billion-valuation-sky-news-reports-2026-09-26/"}]},{"id":"business-gold-fields-northern-star","headline":"Gold Fields reportedly explored a Northern Star takeover, but the Australian miner rebuffed its approach","summary":"Bloomberg, as reported by Reuters, says Gold Fields approached Northern Star about a transaction and was rebuffed; Gold Fields is considering next steps. Neither company immediately commented to Reuters. No agreement or transaction terms have been announced.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: reported approach and response (Sept. 26)","url":"https://www.reuters.com/world/africa/gold-fields-expresses-interest-buying-northern-star-bloomberg-reports-2026-09-26/"}]},{"id":"business-fed-bank-threshold-plan","headline":"Fed weighs raising bank oversight thresholds, a plan that could spur regional-bank growth and deals","summary":"Reuters, citing four people familiar with the discussions, reports the Fed is working on a proposal to reindex asset thresholds for stricter supervision; the highest threshold could move from $700 billion toward $960 billion. A proposal may come later this year, but no change is final. Supporters say a higher cutoff could reduce regulatory costs; critics warn consolidation may hurt competition and increase systemic risk.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Fed threshold discussions and implications (Sept. 25)","url":"https://www.reuters.com/legal/transactional/us-fed-plans-raise-bank-oversight-thresholds-sources-say-2026-09-25/"}]}],"entertainment":[{"id":"entertainment-taylor-swift-encore","headline":"Taylor Swift releases “The Life of a Showgirl: The Encore” and announces the “Patient Zero” video","summary":"Swift’s expanded release arrived Friday with additional songs; the “Patient Zero” music video is scheduled to premiere during Sunday’s VMAs. The album is out, while the video remains a future event.","sources":["Other"],"signal":"Consensus","links":[{"label":"AP: Swift release","url":"https://apnews.com/article/taylor-swift-new-music-patient-zero-934935f049893d0567713bea516f2c0c"},{"label":"Variety: album and video","url":"https://variety.com/2026/music/news/taylor-swift-reveals-life-of-showgirl-encore-new-songs-1236872982/"},{"label":"Variety: video details","url":"https://variety.com/2026/music/news/taylor-swift-patient-zero-music-video-dakota-johnson-colin-farrell-1236874206/"}]},{"id":"entertainment-different-world-netflix","headline":"Netflix’s “A Different World” sequel premieres with the original HBCU setting in focus","summary":"The sequel to the 1980s campus sitcom is available on Netflix Friday, bringing a new generation to the fictional Hillman College setting. The premiere is confirmed; audience response is not yet known.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"CNN: sequel premiere","url":"https://www.cnn.com/2026/09/24/entertainment/a-different-world-reboot-netflix"},{"label":"AP: sequel","url":"https://apnews.com/article/a-different-world-sequel-f0f23537d211e084dfb53999c3a4a367"}]},{"id":"entertainment-paramount-wbd-settlement-challenge","headline":"Merger opponents ask a court to reject Paramount’s settlement tied to its Warner Bros. bid","summary":"Variety reports opponents urged a court to reject a settlement connected to Paramount’s proposed Warner Bros. bid. The filing is an argument for the judge to consider; it is not a ruling on the merger or a completed acquisition.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety: court challenge","url":"https://variety.com/2026/tv/global/block-the-merger-amicus-brief-reject-settlement-1236875410/"},{"label":"Variety: settlement terms","url":"https://variety.com/2026/film/news/paramount-states-settlement-terms-warner-bros-1236871264/"}]},{"id":"entertainment-macklemore-charity-tour","headline":"Macklemore announces a tour supporting Palestinian aid organizations","summary":"Macklemore says proceeds from his planned “Free Palestine” shows will support aid organizations. The tour announcement is confirmed; the performances and any eventual distributions have not yet occurred.","sources":["Other"],"signal":"Watch","links":[{"label":"AP: tour announcement","url":"https://apnews.com/article/macklemore-free-palestine-shows-ed-sheeran-65a65a362e530dfe739ddb626dc16d23"},{"label":"Variety: tour details","url":"https://variety.com/2026/music/news/macklemore-free-palestine-tour-1236874352/"}]},{"id":"entertainment-dolly-9-to-5-restoration","headline":"Restored “9 to 5” returns to U.S. theaters Oct. 9–15, with proceeds supporting Dolly Parton’s foundation","summary":"Deadline reports 20th Century Studios will bring the newly restored 1980 comedy starring Dolly Parton, Jane Fonda and Lily Tomlin back to theaters for a one-week run beginning Oct. 9. Disney says net proceeds from U.S. ticket sales will benefit the Dollywood Foundation; screenings are upcoming, not underway.","links":[{"label":"Deadline: restored “9 to 5” theatrical run and charity","url":"https://deadline.com/2026/09/9-to-5-return-screening-dolly-parton-charity-1237113711/"},{"label":"Fox 59: Oct. 9–15 theatrical dates","url":"https://fox59.com/news/national-world/dolly-partons-classic-9-to-5-returning-to-theaters-for-limited-run/"}],"signal":"Watch","sources":["Other"]},{"id":"entertainment-ed-sheeran-gillette-canceled","headline":"Ed Sheeran cancels Friday and Saturday Gillette Stadium shows as nor’easter approaches","summary":"Gillette Stadium and the promoter announced that Ed Sheeran’s Foxborough shows scheduled for Sept. 25–26 were canceled because of the nor’easter. The venue’s notice says refunds are available through the point of purchase; no replacement dates were announced in the cited notice.","sources":["Other"],"signal":"Consensus","links":[{"label":"Gillette Stadium official cancellation notice","url":"https://www.gillettestadium.com/events/ed-sheeran-loop-tour/"},{"label":"NBC Boston/AP: cancellation report","url":"https://www.nbcboston.com/news/local/ed-sheeran-gillette-stadium-loop-tour/4020701/"}]},{"id":"entertainment-vmas-sunday-guide","headline":"The 2026 VMAs air Sunday night as Taylor Swift seeks a record-setting milestone and Madonna leads nominations","summary":"AP’s event guide says the Sept. 27 ceremony is scheduled for 7:30 p.m. Eastern on CBS and MTV, with Taylor Swift positioned for a new career record if the announced honor is awarded. This is a preview, not a completed ceremony or award result.","sources":["Other"],"signal":"Watch","links":[{"label":"AP: 2026 MTV VMAs guide","url":"https://apnews.com/article/mtv-video-music-awards-2026-guide-711f84857a0d65730696adf0ebdfa9a8"},{"label":"MTV: VMA show information","url":"https://www.mtv.com/vma"}]}]},"researchNotes":["Fresh public-web research was conducted for the Sunday, September 27, 2026, 7:00 a.m. EDT Boston edition. Fox and CNN pages, the current Drudge Report, Reuters/AP coverage, official NHC advisories, team schedules and market sources were searched or opened. Drudge is an aggregator and was not treated as an independent reporting source.","At the edition time, Friday, September 25 was the latest completed U.S. market session. Reuters reports the Dow close and percent changes; AP supplies exact point changes, with closing values cross-checked against CNN Markets and FRED. Cash markets are closed Sunday.","NOAA/NHC advisory No. 27 at 11 p.m. HST Saturday lists Nolo at 100 mph with no coastal watches or warnings, and says its center should remain well south of the main Hawaiian Islands. NHC advisory No. 27 at 2 a.m. MST Sunday lists Polo at 120 mph and hurricane warnings for parts of Baja California Sur, with a Monday approach forecast. Flooding, surf and landfall impacts are hazards or forecasts, not all observed outcomes.","CNN’s nor’easter live coverage was updated at 3:31 a.m. EDT Sunday and reported flooding, outages, dangerous waves and at least one fatality. The AP report attributes 27 deaths across two South African shootings to police. Reuters reports several arrests and evacuations near RAF Fairford; motive or a connection to other conflicts is not established.","Boston sports: official/ESPN sources verify Virginia Tech’s 21–14 win over Boston College on Saturday. MLB moved the Cubs–Red Sox finale to Tropicana Field Sunday at 3:05 p.m.; it was upcoming at 7 a.m. The Patriots–Jaguars game was scheduled for Sunday at 1 p.m. No Red Sox, Patriots, Bruins or Celtics game was played Saturday; Friday’s Red Sox and Bruins results are expressly dated.","General Sports uses final scores and scheduled events from the relevant dates, excludes Boston teams, auto racing and international soccer, and does not state a Sunday event result before the event. Claims, allegations, official counts and forecasts are attributed in the story summaries.","Story counts are Top News 10, USA 10, World 10, Boston Sports 5, Sports 9, Politics 7, Business 7 and Entertainment 7 (65 total). Section takes, app data, browser bundle and standalone page are generated and validated against this edition."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['world','World'],['boston','Boston Sports'],['sports','Sports'],['politics','Politics'],['business','Business'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, or international soccer.',boston:'Boston-area professional and major-college sports only.',business:'7 unique business/markets stories; close figures refer to the latest completed U.S. session.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
