cutives at a Busan panel argued that global demand for Asian stories is broadening beyond established genres. The comments describe industry expectations rather than guaranteed project results.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — Busan panel on Asian stories, Oct. 10","url":"https://variety.com/2026/film/markets-festivals/hollywood-execs-growing-market-asian-stories-busan-1236907387/"}]},{"id":"entertainment-love-untangled-director-oct10","headline":"“Love Untangled” director weighs streaming reach against indie-film pressures","summary":"Director Namkoong Sun discussed Netflix exposure and the constraints facing Korean independent filmmaking in a new Busan interview. The comments offer a current view of how streaming distribution is reshaping the sector.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — “Love Untangled” director interview, Oct. 10","url":"https://variety.com/2026/tv/festivals/love-untangled-director-netflix-korean-indie-film-busan-1236907394/"}]},{"id":"entertainment-hungry-one-oct10","headline":"Alejandro Hidalgo to direct Malaysian horror film “The Hungry One”","summary":"Variety reported Saturday that “The Exorcism of God” director Alejandro Hidalgo will helm a Hungry Ghost Festival horror project. The film is announced for development; casting and release details can still change.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — “The Hungry One” exclusive, Oct. 10","url":"https://variety.com/2026/film/markets-festivals/exorcism-of-god-alejandro-hidalgo-malaysia-horror-hungry-one-1236907302/"}]},{"id":"entertainment-operation-doolittle-oct10","headline":"China–U.S. WWII spy series “Operation Doolittle” heads to Busan market","summary":"Variety reported that Edward Zhang, Casper Van Dien and Jeff Fahey star in a World War II spy series being presented at the Busan market. A market presentation is not a guarantee of distribution or release.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — “Operation Doolittle” heads to Busan, Oct. 10","url":"https://variety.com/2026/tv/markets-festivals/wwii-spy-series-operation-doolittle-busan-market-1236907242/"}]}]},"researchNotes":["Every incoming card received a retain/rewrite/replace disposition and fresh rank review against the Oct. 8 1:29 p.m. EDT 70-source audit; see card-disposition-review-oct8-final.json.","Compared Fox News, CNN and Drudge Report; Drudge is treated as an aggregator, not an independent reporting source.","Kramatorsk Reuters report supports at least 30 killed, not the prior headline’s 33; all casualty counts remain attributed.","Reuters direct source pages for Myanmar talks and GOP candidate distancing were re-fetched successfully after the earlier audit’s error pages.","MLB game-recap links and NHL Ovechkin source were replaced with accessible AP reporting; the Digger link was corrected to Deadline’s Oct. 5 worldwide box-office update.","CNN Markets dashboard displayed the specified 1:22:41 p.m. EDT Dow/Nasdaq quote and approximately 15-minute delay; Reuters and AP close reports are separately dated to Wednesday, Oct. 7.","Boston game-status check: October 8, 2026, 1:47:30 p.m. EDT Boston; Bruins–Utah and Celtics–Cleveland were both scheduled for 7 p.m. EDT; Red Sox and Patriots had no game that day.","Boston Globe access was partly paywalled; WEEI/Audacy direct article pages returned limited site chrome, so consequential facts were cross-checked against accessible sources where possible."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, or international soccer.',business:'7 unique business/markets stories; on trading days at 7 a.m. show timestamped indicative Dow and Nasdaq-100 futures, clearly not cash indexes; on weekends and market holidays state cash markets are closed and show no live/premarket snapshot, while identifying the latest completed session. At 10 a.m. and 1 p.m. on trading days show timestamped Dow and Nasdaq Composite cash-index levels, point and percentage moves, and any provider delay; at 4 p.m. show timestamped closing moves as confirmed or clearly preliminary; at 7 p.m. use confirmed closes.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
