","sources":["Other","Fox"],"signal":"Consensus","links":[{"url":"https://apnews.com/article/iran-united-states-war-hormuz-trump-israel-2abebce2fca2c085e0e0ee717e42cf28","label":"AP — Oct. 22, 2026"},{"url":"https://www.reuters.com/world/saudi-civil-aviation-says-one-killed-eight-injured-attack-king-fahd-airport-2026-10-21/","label":"Reuters — Oct. 22, 2026"},{"url":"https://www.foxnews.com/politics/us-pulls-personnel-saudi-arabia-kingdom-comes-under-houthi-fire","label":"Fox News — Oct. 22, 2026"}]},{"id":"top-starshield-oct23","headline":"Ukraine disputes Trump’s claim that Starshield access has been restored","summary":"Trump said Musk restored Ukraine’s military-grade satellite access, but Ukrainian officials told CNN restrictions still complicate operations. The new dispute follows renewed diplomacy and Russian attacks on Kyiv; the restoration claim is not independently established.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/23/world/trump-musk-restored-ukraines-starshield-intl","label":"CNN — updated Oct. 23, 6:30 a.m. ET"},{"url":"https://www.cnn.com/2026/10/21/europe/us-envoy-witkoff-putin-talks-russia-ukraine-intl","label":"CNN — Kyiv attacks, updated Oct. 22"},{"url":"https://www.reuters.com/world/europe/missiles-strike-ukraines-kyiv-reuters-witness-says-2026-10-21/","label":"Reuters — updated Oct. 22"}]},{"id":"top-php-oct23","headline":"AI exploitation of long-known PHP weaknesses drives emergency patching","summary":"CNN’s new analysis traces the PHP emergency to vulnerabilities known for years that AI made practical to exploit quickly. A patch is available; widespread exposure and exploitation attempts do not establish that every vulnerable website was compromised.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/23/tech/ai-cybersecurity-php2shell-explained","label":"CNN analysis — Oct. 23, 2026"},{"url":"https://www.reuters.com/world/asia-pacific/cloudflare-sees-millions-exploit ary":"A CDC order takes effect Nov. 3 requiring U.S.-bound air travelers to attest they have not been in Congo in the previous 21 days, Reuters reports from a government memo. Switzerland says Nigeria’s patient probably contracted Ebola in Uganda; the patient’s travel history remains disputed, not a settled transmission chain.","sources":["Other"],"signal":"Consensus","links":[{"url":"https://www.reuters.com/business/healthcare-pharmaceuticals/us-impose-ebola-attestation-requirement-international-air-passengers-2026-10-22/","label":"Reuters — Oct. 22, 2026"},{"url":"https://www.reuters.com/business/healthcare-pharmaceuticals/who-was-not-told-that-nigerias-ebola-patient-travelled-congo-official-says-2026-10-22/","label":"Reuters — Oct. 22, 2026"}]},{"id":"top-tibet-update-oct23","headline":"Tibet earthquake death toll remains 16 as injury count rises","summary":"Reuters’ Friday update says the official death toll from the magnitude-7 earthquake remains 16 and the reported number injured has increased. Chinese authorities supplied the figures; headline and article snapshots differed on the latest injury total, so no precise injury count is asserted here.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/world/china/injuries-chinas-tibet-rise-65-after-earthquake-death-toll-remains-16-2026-10-23/","label":"Reuters — Oct. 23, 2026"}]},{"id":"top-treasury-tech-oct23","headline":"Treasury proposes broader restrictions on high-tech investments in adversaries","summary":"The proposed rule would tighten American investments in areas including artificial intelligence and supercomputing in China, Russia, North Korea and other countries of concern, AP reports. It is a proposal aimed at military-sensitive technology, not a finalized ban on every overseas investment.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/treasury-china-tech-investments-rule-b742c292ff8eb19e6a4c8cf03d4d66b9","label":"AP — updated Oct. 23, 4:29 a.m. EDT"}]},{"id":"top-melanoma-trial-oct22-eve","headline":"Merck and Moderna report 42% reduction in melanoma recurrence or death","summary":"The companies say their personalized mRNA vaccine plus immunotherapy reduced recurrence-or-death risk by 42% in a large melanoma trial. Reuters reports the new data; the result is not a universal cure or regulatory approval, and the companies’ shares fell despite the finding.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/legal/litigation/merckmoderna-cancer-vaccine-cuts-risk-death-or-recurrence-melanoma-by-over-40-2026-10-22/","label":"Reuters — Oct. 22, 2026"}]},{"id":"top-deportation-report-oct22-eve","headline":"Report counts 980,000 deportations in Trump’s first 18 months","summary":"A Migration Policy Institute report cited by Reuters counts 980,000 deportations during the first 18 months of Trump’s second term. It says only 20% involved people with a criminal conviction and distinguishes removals from several categories of returns; the total is the study’s finding.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/legal/government/trump-administration-oversaw-980000-deportations-during-first-18-months-2026-10-22/","label":"Reuters — Oct. 22, 2026"}]}],"usa":[{"id":"usa-kohen-video-oct23","headline":"Mississippi releases video of officer’s fatal shooting of 1-year-old","summary":"Newly released video shows the police shooting that killed Kohen Wiley in June. AP reports a state investigation found no criminal wrongdoing by the officer, while the family’s attorney disputes the use of force; the footage release does not resolve that disagreement.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/mississippi-kohen-wiley-senatobia-police-bdd889aea0c90cfd0a0670df7fcc3f58","label":"AP — updated Oct. 23, 12:59 a.m. EDT"}]},{"id":"top-lucas-charges-oct22-eve","headline":"Virginia Senate leader Louise Lucas charged in marijuana conspiracy case","summary":"Federal prosecutors accused Virginia state Sen. Louise Lucas of leading a marijuana-related criminal conspiracy. AP reports the indictment and her court appearance; the charges are allegations, not a conviction or an independently established account of guilt.","sources":["Other","CNN"],"signal":"Watch","links":[{"url":"https://apnews.com/article/l-louise-lucas-virginia-corruption-investigation-767ed83f970ba6dec48048dcff2a28d0","label":"AP — Oct. 22, 2026"},{"url":"https://www.cnn.com/2026/10/22/politics/va-senator-louise-lucas-indictment","label":"CNN — Lucas indictment, Oct. 22"}]},{"id":"usa-kirk-trial-oct23","headline":"Kirk murder defendant’s lawyers seek 2029 trial; hearing is Friday","summary":"Tyler Robinson’s lawyers say preparation could take several years; attorneys for Erika Kirk call the proposed delay absurd. AP reports Judge Tony Graf has a Friday hearing to set a trial date. Robinson remains accused, and 2029 is a defense proposal, not an ordered date.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/charlie-kirk-tyler-robinson-trial-00a2bb26b4299a10d0fa5bd88da09072","label":"AP — updated Oct. 23, 5:58 a.m. EDT"}]},{"id":"usa-toledo-oct23","headline":"Seven remain hospitalized after Toledo chemical leak; evacuation zone shrinks","summary":"AP’s Thursday update says seven of 57 treated people remained hospitalized, none in serious condition. Officials reduced the evacuation radius to a quarter-mile but kept it in place while an explosion risk remained; the broader shelter-in-place order was lifted.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/toledo-chemical-release-ohio-hazmat-b3dac138ad422ca8a22943d6b791065e","label":"AP — updated Oct. 22, 4:43 p.m. EDT"}]},{"id":"usa-calley-means-oct22-eve","headline":"Top MAHA adviser Calley Means resigns from HHS","summary":"Calley Means, a prominent advocate of Robert F. Kennedy Jr.’s health agenda, left his senior advisory role. AP’s Thursday evening update confirms the resignation; the departure does not itself settle disputes over the administration’s health policies.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/trump-maha-healthcare-rfk-jr-945acfc81edf8e837e969d42f01fb2a3","label":"AP — Oct. 22, 2026"}]},{"id":"usa-pike-execution-oct22-eve","headline":"Lawyer’s account details IV failures in Christa Pike execution attempt","summary":"CNN reports a lawyer’s account that staff used about ten needles and struggled to establish functioning IV access during Tennessee’s failed execution attempt. The new details renew scrutiny of the state’s lethal-injection protocol and remain attributed to the documented witness account.","sources":["CNN"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/22/us/christa-pike-execution-attempt-staff-worried","label":"CNN — Oct. 22, 2026"}]},{"id":"usa-mutated-flu-oct22","headline":"Early flu surge reaches West Coast as mutated H1N1 spreads","summary":"CNN reports unusually early West Coast flu activity associated with a changed H1N1 virus. Washington testing is elevated, but national influenza-like illness visits remain below the CDC baseline; an early regional surge is not yet a nationwide peak.","sources":["CNN"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/22/health/flu-2026-mutation","label":"CNN — early flu and mutation, Oct. 22, 6 a.m. ET"}]},{"id":"usa-iwo-statue-oct23","headline":"Police arrest man after damage to Iwo Jima monument in Virginia","summary":"Prince William County police say a man used a sledgehammer to behead one figure in the Quantico-area Battle of Iwo Jima monument, causing extensive damage. CNN reports the arrest and alleged vandalism; criminal accusations are not a conviction.","sources":["CNN"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/23/us/iwo-jima-monument-statue-beheaded-hnk","label":"CNN — Oct. 23, 1:27 a.m. ET"}]},{"id":"usa-florida-home-oct23","headline":"Florida officer charged with taking dead man’s home after welfare check","summary":"Authorities accuse Lauderhill officer Brian Sguros of using a deceased homeowner’s identity to take control of a roughly $400,000 house. AP reports five felony charges; Sguros said he took possession to prevent squatters, and the allegations have not been proved at trial.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/florida-officer-arrested-dead-mans-home-e243dd6390905da680b88643f89e4243","label":"AP — updated Oct. 22, 4:51 p.m. EDT"}]},{"id":"usa-salman-jury-oct23","headline":"Jury weighs case of U.S. woman who says father forced her into Syria","summary":"Halima Salman is accused of receiving Islamic State weapons training. Her lawyer says her father took her into Syria at 17 and arranged an unwanted marriage; AP reports the jury was deliberating Thursday. The defense account and prosecution allegations remain contested.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.cbs17.com/news/ap-jury-weighs-fate-of-us-woman-who-says-father-forced-her-into-syrias-war-zone-when-she-was-a-teen/","label":"AP via CBS 17 — Oct. 22, 2026"}]}],"boston":[{"id":"boston-friday-status-oct23","headline":"FINAL: Bruins win 6–0, Patriots lose 30–24; Celtics host Knicks Friday","summary":"FINAL Thursday: Bruins 6, Predators 0; Bears 30, Patriots 24. UPCOMING Friday: Knicks at Celtics, 7 p.m. EDT at TD Garden. No Bruins, Patriots or Red Sox game Friday; the Red Sox season is complete. Official NBA and NHL sources and ESPN verified the completed results and Friday schedule at this morning refresh.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.nhl.com/gamecenter/nsh-vs-bos/2026/10/22/2026020154","label":"NHL — Thursday final"},{"url":"https://www.espn.com/nfl/game/_/gameId/401873010/patriots-bears","label":"ESPN — Thursday final"},{"url":"https://www.nba.com/celtics/game/0022600008-knicks-vs-celtics-boston-ma-10- h’s “Starry Night”","summary":"A team writing in Scientific Reports argues the painting’s sky best matches around July 22, 1889, rather than the traditional June dating. AP presents the astronomical reconstruction as a research interpretation, not a newly discovered signature date from van Gogh.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/van-gogh-starry-night-space-6385c8e37f748bddc4137cdda5c76887","label":"AP — Oct. 22, 2026"}]},{"id":"entertainment-legend-muse-oct22-eve","headline":"John Legend and Pharrell team for Friday’s “Muse” release","summary":"Legend told AP that working on a full album with Pharrell Williams pushed him toward new vocal approaches. The 16-track “Muse” arrives Friday; the interview describes the creative process rather than a completed commercial result.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/john-legend-muse-egot-3908a7641918e2a101a252c60324c763","label":"AP — Oct. 22, 2026"}]},{"id":"entertainment-raffi-oct22-eve","headline":"Raffi marks 50 years with new songs and a screen-time message","summary":"Raffi’s “Love is Everywhere” arrives Friday as he marks a half-century since his first children’s album. AP’s interview explores songwriting, children’s technology use and a planned anniversary reissue; the new release is still upcoming.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/raffi-new-album-interview-d50d8f9ad50e6072ce5847324c7e5a6e","label":"AP — Oct. 22, 2026"}]},{"id":"entertainment-runtimes-oct22-eve","headline":"AP examines why blockbuster and art-house movies keep getting longer","summary":"AP’s feature tracks longer runtimes from event blockbusters to festival films and weighs their appeal against programming pressures. Its box-office examples challenge the assumption that length necessarily deters audiences; the article does not establish that every long film succeeds.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/movies-longer-runtimes-7f8b8bbf334f2219f4b036618728b313","label":"AP — Oct. 22, 2026"}]}]},"researchNotes":["Morning limited refresh: Top News, USA, Boston Sports and Sports freshly researched and reranked. Business, World, Politics and Entertainment preserved exactly from the verified Oct. 22 evening edition, including source dates.","Boston Globe partly paywalled; WEEI/Audacy current hubs and discussion accessible but fresh full text limited. Official NBA/NHL and ESPN confirm finals and Friday schedule.","Several Reuters direct scrapes failed; targeted search and Reuters syndication plus accessible AP/CNN/ESPN reporting used. Fox article body access was blocked, so CNN supplies the verified New Hampshire ruling facts.","Tibet Reuters headline and body snapshots differed on injury count; only the consistent official death toll is asserted."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, international soccer, or WNBA coverage.',business:'7 unique business/markets stories refreshed only at 7 p.m. Eastern Monday through Friday, with independently confirmed figures for the latest completed U.S. cash session. Preserved unchanged at all other editions.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
