<script id="briefing" type="application/json">{"date":"2026-10-01","lastUpdated":"October 1, 2026, 4:09:59 p.m. EDT Boston","dek":"Thursday, Oct. 1 — 4 p.m. EDT Boston edition; fresh afternoon reporting, confirmed cash-market close, and verified Boston schedules. Updated at the precise Eastern build time.","take":"The biggest shared thread is widening regional danger: Fox and CNN both report that passengers stopped the Flydubai cockpit attack and the flight landed safely, but their framing differs—Fox foregrounds security/terror while CNN stresses firsthand accounts and the unresolved motive. The reported U.S. troop buildup, Ukraine strikes and court cases also lead this edition; Drudge amplifies some of the same alarm-heavy headlines and election stories, but is an aggregator, not an independent reporting source.","sectionTakes":{"top":"The biggest shared thread is widening regional danger: Fox and CNN both report that passengers stopped the Flydubai cockpit attack and the flight landed safely, but their framing differs—Fox foregrounds security/terror while CNN stresses firsthand accounts and the unresolved motive. The reported U.S. troop buildup, Ukraine strikes and court cases also lead this edition; Drudge amplifies some of the same alarm-heavy headlines and election stories, but is an aggregator, not an independent reporting source.","usa":"Today’s newest legal developments are the Supreme Court’s decision to hear a Kentucky church land-use case and a D.C. judge’s permanent dismissal of the reflecting-pool prosecution; neither should be mistaken for a broad ruling on unrelated disputes. Elsewhere, courts have paused H-1B fees and HUD grant cancellations while lawsuits continue, and reports about hacking and Cornell remain attributed or alleged.","boston":"Boston has no games today: the Yankees eliminated the Red Sox 9–2 Wednesday, the Bruins next visit Winnipeg Friday at 8 p.m. EDT and the Patriots visit Buffalo Sunday at 1 p.m. EDT. The Celtics’ preseason begins Oct. 8, while Boston College visits SMU Saturday at noon; team schedules and results were checked at 4:09 p.m. EDT.","business":"CONFIRMED CASH CLOSE — Thursday, Oct. 1 was the latest completed U.S. session: the Dow closed at 50,926.74, up 20.69 (+0.04%), and the Nasdaq Composite at 26,871.60, up about 10.53 (+0.04%); CNBC’s exact quote checks were 4:03 and 4:02 p.m. EDT, respectively, and Yahoo Finance historical tables confirm the closes. Both indexes edged higher as the 10-year Treasury yield eased from its 2002-era high and selected software/AI and memory demand supported shares, while Disney’s possible restructuring and Boeing’s newly approved labor deal marked separate company developments.","world":"The international slate spans the RAF Fairford investigation and Indonesia’s deadly ferry sinking, where an arrest is not a finding of guilt, alongside a newly reported Ukrainian missile deployment attributed to President Zelenskyy. Other cards track China–Philippines tensions, Turkey’s order against T24, Russian diplomacy and Bosnia’s election; disputed claims and official assessments remain attributed.","sports":"Three major U.S. events remain upcoming tonight: Phillies-Braves’ deciding Wild Card game at 8 p.m. EDT, Steelers-Browns at 8:15, and Fever-Aces at 9. Wednesday’s verified MLB and WNBA finals and the reported Cowboys-Steelers trade fill out the slate; no live score is claimed before play.","politics":"The administration’s $500 ACA-fee refunds, Trump’s campaign travel and a 25-state-and-city challenge to EPA’s rule repeal lead the political slate. Senate adjournment and the permitting deal remain unresolved, while the Good family’s civil complaint and Democrats’ ad probe are allegations and requests—not findings.","entertainment":"Paramount’s Warner Bros. deal cleared a court obstacle and has a planned Oct. 6 closing, but remains incomplete; the reported CNN leadership conversation is separate from a final staffing decision. The rest of the slate covers Sia’s reported catalog sale, the Verizon-Starz blackout and new film/theater announcements."},"sections":{"top":[{"id":"top-us-third-carrier-troops-oct1","headline":"Oct. 1, WSJ: Pentagon plans third carrier strike group and up to 10,000 more troops for Middle East","summary":"The Wall Street Journal, citing U.S. officials, reported that the Pentagon plans to send a third carrier strike group and additional Marine ships, adding an estimated 9,000–10,000 personnel expected to arrive by late November. The officials linked the buildup to President Donald Trump weighing a possible resumption of strikes on Iran after the midterms; this is attributed reporting about a planned deployment, not a new attack or confirmed decision to strike.","sources":["Other"],"links":[{"label":"Wall Street Journal — deployment report, Oct. 1","url":"https://www.wsj.com/politics/national-security/u-s-sending-third-aircraft-carrier-up-to-10-000-more-troops-to-middle-east-42996f7a"}],"signal":"Watch"},{"id":"top-ukraine-strikes-oct1","headline":"Oct. 1: Zelenskyy says Russian overnight barrage killed seven and damaged Ukraine energy sites","summary":"Ukrainian President Volodymyr Zelenskyy said seven people, including a child, were killed and energy infrastructure was hit. AP and Reuters reported casualty and damage claims attributed to Ukrainian officials as assessments continued; the toll and extent of outages were not independently settled in the reports.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — overnight Russian attack toll and power damage, Oct. 1","url":"https://apnews.com/article/ucrania-guerra-rusia-bombardeo-48be5929c12a30c8ee01ef95c28e78e6"},{"label":"Reuters — Kyiv and Odesa officials report injuries, Oct. 1","url":"https://www.reuters.com/world/europe/russian-air-strikes-injure-two-ukraines-kyiv-odesa-officials-say-2026-10-01/"}]},{"id":"top-supreme-court-detention-oct1","headline":"Oct. 1: Supreme Court agrees to hear challenge to mandatory immigration detention without bond","summary":"The Supreme Court agreed to review the administration’s policy requiring detention without bond hearings for many immigrants in removal proceedings. Taking the case is not a ruling on its legality; the policy remains contested while the Court prepares to hear the dispute.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — Supreme Court takes detention case, Oct. 1","url":"https://apnews.com/article/ice-immigration-detention-supreme-court-f8ee63bcb11f1be3d7d6300022f3bc88"},{"label":"Reuters — Court to review detention policy, Oct. 1","url":"https://www.reuters.com/world/us-supreme-court-hear-clash-over-trumps-immigration-detention-policy-2026-10-01/"},{"label":"CNN — Court to decide bondless detention question, Oct. 1","url":"https://www.cnn.com/2026/10/01/politics/supreme-court-trump-ice-migrants-detention-without-bond"}]},{"id":"top-iran-retaliation-diplomacy-oct1","headline":"Oct. 1: Reuters says Iran is weighing broader retaliation if large-scale U.S. attacks resume","summary":"Reuters, citing three Iranian officials and an insider, reported that Tehran is reviewing wider targets while a seven-day diplomatic proposal remains on the table. No final military decision or new attack was reported; both the planning and proposal remain attributed accounts.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — Iran’s reported contingency planning and diplomacy, Oct. 1","url":"https://www.reuters.com/world/middle-east/iran-readies-harder-retaliation-if-attacked-diplomacy-faces-long-odds-2026-10-01/"}]},{"id":"top-flydubai-investigation-oct1","headline":"Oct. 1 update: Israel and UAE investigate Flydubai cockpit assault after passengers intervene","summary":"Reuters and AP report that the co-pilot stabbed the captain and passengers helped subdue him; all 174 passengers reached safety after the flight diverted. Netanyahu’s claim that the suspect had undergone Islamist radical indoctrination remains attributed, while motive and any wider link remain under investigation.","sources":["Fox","CNN","Drudge","Other"],"signal":"Split","links":[{"label":"Reuters — Israel and UAE investigation, Oct. 1","url":"https://www.reuters.com/world/middle-east/israel-vows-get-root-flydubai-attack-uae-launches-investigation-2026-10-01/"},{"label":"AP — flight attack and emergency landing, Oct. 1","url":"https://apnews.com/article/emergency-landing-israel-attack-hijacking-aircraft-a71ea8173678705fb1895539b6e4eb24"},{"label":"CNN — live coverage, Oct. 1","url":"https://www.cnn.com/2026/10/01/world/live-news/flydubai-flight-israel-pilot-passengers-intl"},{"label":"Fox News — live coverage, Oct. 1","url":"https://www.foxnews.com/live-news/flydubai-flight-hijacking-israel-tel-aviv-10-1-26"},{"label":"Drudge Report — aggregator front page, Oct. 1","url":"https://www.drudgereport.com/"}]},{"id":"top-pike-failed-execution-oct1","headline":"Oct. 1 update: Tennessee pauses executions after two lethal-injection attempts fail for Christa Pike","summary":"Tennessee stopped Christa Pike’s Sept. 30 execution attempt after two rounds of the injection protocol failed to render her unconscious, according to AP and witnesses. Gov. Bill Lee suspended the state’s remaining 2026 executions and ordered an outside review; the medical sequence remains under investigation.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — Tennessee pauses executions after Pike attempt, Oct. 1","url":"https://apnews.com/article/christa-pike-execution-tennessee-f826a60582083b90ac7695ecb16afbdf"},{"label":"NBC News — failed execution and two injections, Oct. 1","url":"https://www.nbcnews.com/news/us-news/-was-mess-tennessee-fails-execute-inmate-2-lethal-injections-rcna600863"},{"label":"Washington Post — court filings, Sept. 30","url":"https://www.washingtonpost.com/national-security/2026/09/30/execution-tennessee-woman-blocked-by-federal-court-with-hours-spare/"}]},{"id":"top-pakistan-afghanistan-strikes-oct1","headline":"Oct. 1: Pakistan strikes Afghanistan as Taliban reports civilian deaths and accounts conflict","summary":"Pakistan said it hit militant hideouts and killed 22 fighters; the Taliban said nine Afghan civilians, including women and children, were killed and 11 injured. The sides’ accounts conflict, and casualty and target claims have not been independently reconciled.","sources":["Other"],"signal":"Split","links":[{"label":"DW — Afghan and Pakistani claims, Oct. 1","url":"https://www.dw.com/en/pakistan-launches-deadly-airstrikes-on-afghanistan/a-79498092"}]},{"id":"top-apnorcpoll-prices-oct1","headline":"Oct. 1: AP-NORC poll finds most adults blame Trump policies for high prices","summary":"The new AP-NORC survey found 65% of U.S. adults said Trump’s policies bear more responsibility than outside factors for persistently high prices, and 26% approved of his handling of the economy. The poll measures opinion at one point in time, not the midterm result.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — AP-NORC poll on prices and economic approval, Oct. 1","url":"https://apnews.com/article/trump-economy-approval-trump-midterms-8d5809758a31b29c73f4351a8008147c"},{"label":"AP — poll overview, Oct. 1","url":"https://www.ap.org/news-highlights/elections/2026/most-americans-blame-trump-for-high-prices-as-midterms-approach-a-new-ap-norc-poll-finds/"}]},{"id":"top-iraq-mission-complete-sept30","headline":"Sept. 30: U.S.-led coalition completes its military mission in federal Iraq","summary":"The coalition announced it completed its military mission in federal Iraq after more than a decade, with a different security arrangement to follow with Baghdad and Kurdish authorities. Mission completion does not mean every U.S. troop has left Iraq; this is the source’s Sept. 30 development.","sources":["Other"],"signal":"Consensus","links":[{"label":"AP — Iraq mission transition, Sept. 30","url":"https://apnews.com/article/iraq-us-withdrawal-militias-disarmament-kurds-a097a39f3d1a3515adc2ba3298a6816f"}]},{"id":"top-pentagon-records-breach-oct1","headline":"Oct. 1: Fox reports Pentagon database exposure involving millions of military personnel","summary":"Fox News reports a Pentagon database exposure involving Social Security numbers and other personal details for about 2.76 million living U.S. personnel and roughly 294,000 deceased people. The Defense Department has not publicly detailed the full scope, cause or notification plan in the available report.","sources":["Fox"],"signal":"Watch","links":[{"label":"Fox News — reported Pentagon personnel-data exposure, Oct. 1","url":"https://www.foxnews.com/politics/pentagon-data-breach-exposes-social-security-numbers-personal-info-military-civilian-personnel"}]}],"usa":[{"id":"usa-supreme-court-kentucky-church-oct1","headline":"Oct. 1, 3:53 p.m. EDT: Supreme Court takes Kentucky church shrine-zoning dispute","summary":"The Supreme Court agreed to hear whether a Kentucky church group may build a Marian shrine on nearby residential land under a federal religious-land-use law. The order accepts the case for review but does not decide the church’s right to build; neighbors say the project would worsen traffic, and both sides’ arguments remain unresolved.","sources":["Other"],"links":[{"label":"PBS NewsHour / AP — Supreme Court order, Oct. 1, 3:53 p.m. EDT","url":"https://www.pbs.org/newshour/nation/supreme-court-intervenes-in-dispute-over-kentucky-churchs-plan-to-build-shrine-on-residential-land"}],"signal":"Watch"},{"id":"usa-reflecting-pool-case-dismissed-oct1","headline":"Oct. 1, 1:43 p.m. EDT: D.C. judge permanently dismisses case against former Olympian","summary":"D.C. Superior Court Judge Todd Edelman dismissed with prejudice the federal vandalism case against former Olympic canoeist David Hearn, barring prosecutors from refiling that charge. AP reports the judge cited exceptional circumstances and the risk of political pressure; the order ends this case, not a general rule about other prosecutions.","sources":["Other"],"links":[{"label":"AP via PBS NewsHour — ruling and court record, Oct. 1, 1:43 p.m. EDT","url":"https://www.pbs.org/newshour/politics/judge-permanently-dismisses-trump-administrations-case-charging-ex-olympian-with-reflecting-pool-vandalism"},{"label":"AP News — case dismissal, Oct. 1","url":"https://apnews.com/article/trump-reflecting-pool-olympian-david-hearn-8404849d27c85e210cc5a895c150645a"}],"signal":"Watch"},{"id":"usa-hud-counseling-grants-paused-oct1","headline":"Oct. 1: Judge temporarily blocks cancellation of nearly $56 million in HUD counseling grants","summary":"A federal judge paused the planned cancellation while nonprofit groups’ lawsuit proceeds, preserving funds for homebuyer education, foreclosure prevention and rental counseling. The temporary order does not decide the merits; the administration says some grantees had DEI-focused agendas, while plaintiffs contest the cuts.","sources":["Other"],"signal":"Split","links":[{"label":"Reuters — temporary HUD grant injunction, Oct. 1","url":"https://www.reuters.com/legal/government/us-judge-blocks-housing-grant-cuts-while-anti-dei-challenge-proceeds-2026-10-01/"}]},{"id":"usa-h1b-second-injunction-sept30","headline":"Sept. 30: Second judge blocks Trump’s $100,000 fee on new H-1B visas","summary":"A second federal judge blocked the administration’s fee on new H-1B workers, adding another injunction while litigation continues. The order is not a final nationwide resolution; Sept. 30 is the source’s publication date.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters via U.S. News — second H-1B fee injunction, Sept. 30","url":"https://www.usnews.com/news/politics/articles/2026-09-30/second-judge-blocks-trumps-100-000-fee-for-new-h-1b-worker-visas"}]},{"id":"usa-federal-scholarship-credit-oct1","headline":"Oct. 1: New federal tax-credit scholarship opens to private-school and homeschool students in at least 30 states","summary":"AP reports individuals may donate up to $1,700 to eligible scholarship organizations and claim a federal tax credit of the same amount. Availability depends on states and participating organizations; it is not a direct federal voucher sent to every family.","sources":["Other"],"signal":"Consensus","links":[{"label":"AP — new federal scholarship rules, Oct. 1","url":"https://apnews.com/article/federal-scholarship-tax-credit-rules-a015961865d469f2a0839d235a9f4056"}]},{"id":"usa-ai-impersonation-hackers-oct1","headline":"Oct. 1: Suspected China-linked hackers impersonated U.S. AI insiders, Reuters and CNN report","summary":"Reuters reports hackers impersonated a former U.S. official to target email accounts of AI experts; CNN separately reported suspected China-linked actors posing as U.S. AI insiders. Attribution remains provisional, and the reports do not establish that sensitive information was obtained.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"Reuters — hackers impersonated former U.S. official, Oct. 1","url":"https://www.reuters.com/legal/government/chinese-hackers-impersonated-ex-us-official-steal-emails-ai-experts-2026-10-01/"},{"label":"CNN — reported AI-sector impersonation campaign, Oct. 1","url":"https://www.cnn.com/2026/10/01/politics/china-linked-hackers-impersonated-us-ai-insiders"}]},{"id":"usa-texas-capitol-arrest-oct1","headline":"Oct. 1: Texas authorities arrest man accused of plotting attack on state Capitol","summary":"Texas DPS said it received a tip about an alleged violent plan for Austin and arrested Benny Caldera Jr. early Wednesday; he was charged with making a terroristic threat. Officials have not publicly established a specific plan, motive or alleged co-conspirators.","sources":["Fox"],"signal":"Watch","links":[{"label":"Fox News — arrest in alleged Texas Capitol plot, Oct. 1","url":"https://www.foxnews.com/us/suspect-arrested-alleged-plot-attack-texas-capitol-officials"}]},{"id":"usa-states-federal-funds-lawsuit-oct1","headline":"Oct. 1: California and six state rts Sia sold a half-share of her catalog for $180 million. The transaction is reported as completed; its longer-term effect on the artist’s royalties was not disclosed.","sources":["Other"],"signal":"Watch","links":[{"label":"Rolling Stone — Sia catalog transaction, Oct. 1","url":"https://www.rollingstone.com/music/music-news/sia-sells-50-percent-catalogue-180-million-1235635118/"}]},{"id":"entertainment-starz-verizon-blackout-oct1","headline":"Oct. 1: Starz goes dark on Verizon Fios as carriage negotiations stall","summary":"Variety reports Starz channels and on-demand service were blacked out for Verizon Fios customers after distribution talks failed to produce an agreement. Both companies faulted the other; the dispute is ongoing and no new deal was confirmed.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — Starz blackout and carriage dispute, Oct. 1","url":"https://variety.com/2026/tv/news/starz-verizon-fios-negotiations-blacked-out-tonight-1236894418/"},{"label":"Starz — statement on Verizon negotiations, Sept. 30","url":"https://investors.starz.com/news-releases/news-release-details/verizon-fios-customers-may-lose-starz"}]},{"id":"entertainment-east-of-eden-netflix-oct1","headline":"Oct. 1: Netflix releases Zoe Kazan’s “East of Eden” adaptation starring Florence Pugh","summary":"The adaptation arrived on Netflix today, with reviews published alongside its release. The title joins the service’s October slate; reception and viewership remain to be seen.","sources":["Other"],"signal":"Watch","links":[{"label":"The Hollywood Reporter — “East of Eden” review, Oct. 1","url":"https://www.hollywoodreporter.com/tv/tv-reviews/east-of-eden-review-florence-pugh-netflix-mike-faist-1236717464/"}]},{"id":"entertainment-jani-be-good-trailer-oct1","headline":"Oct. 1: Ariani Darmawan returns with “Jani Be Good” ahead of Tokyo premiere","summary":"Variety reports the Indonesian filmmaker’s new feature is headed to the Tokyo International Film Festival after a long gap between projects. The announcement covers a festival selection, not a theatrical release date.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — trailer and festival premiere, Oct. 1","url":"https://variety.com/2026/film/news/jani-be-good-trailer-indonesian-director-returns-15-years-1236893464/"}]},{"id":"entertainment-manchevski-tokyo-premiere-oct1","headline":"Oct. 1: Milcho Manchevski’s “Sister Brother Manhole Cover” heads to Tokyo competition","summary":"The film has been selected for the Tokyo festival competition, according to Variety. The selection is confirmed; the festival result and wider distribution plans remain unknown.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — Tokyo selection and trailer, Oct. 1","url":"https://variety.com/2026/film/festivals/golden-lion-winner-sister-brother-manhole-cover-tokyo-1236893474/"}]},{"id":"entertainment-tiler-peck-west-end-oct1","headline":"Oct. 1: Ballet star Tiler Peck to make West End debut in “Little Dancer”","summary":"Variety reports Peck will make her West End debut in the musical. The casting is an announced production plan; premiere timing and the show’s longer run remain subject to production schedules.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — West End casting announcement, Oct. 1","url":"https://variety.com/2026/theater/news/tiler-peck-west-end-debut-little-dancer-musical-1236893451/"}]}]},"researchNotes":["Fresh public-web research and re-ranking completed for Thursday, Oct. 1, 2026; edition data build time: October 1, 2026, 4:09:59 p.m. EDT Boston. Exact order/counts: Top News 10, USA 10, Boston Sports 5, Business 7, World 10, general Sports 9, Politics 7, Entertainment 7.","Compared the current Fox News, CNN and Drudge Report front pages and opened primary coverage where available. Fox led with ACA refunds and security/terror framing around Flydubai; CNN emphasized firsthand accounts and unresolved motive alongside explanatory domestic coverage; Drudge highlighted Flydubai, the economy poll, Supreme Court, Ukraine and election headlines. Drudge is an aggregator, not an independent reporting source.","Verified the Dow and Nasdaq Composite close from CNBC cash-index quote pages at 4:03 p.m. and 4:02 p.m. EDT, respectively, and cross-checked October 1 close levels against Yahoo Finance historical tables. CNBC showed Dow 50,926.74, +20.69 (+0.04%), and Nasdaq Composite 26,871.595, +10.531 (+0.04%); Yahoo rounds the Nasdaq close to 26,871.60. Reuters reported earlier market readings before the close; those are not used as closing values.","Checked Red Sox, Patriots, Bruins and Celtics schedules/results for Thursday afternoon. No same-day Boston-team game was live or upcoming; Red Sox were eliminated by the Yankees 9–2 Wednesday, Bruins next play Friday at Winnipeg at 8 p.m. EDT, Patriots next play Sunday at Buffalo at 1 p.m. EDT, and Celtics preseason opens Oct. 8. General Sports games were verified as upcoming at the edition timestamp.","Re-researched all eight categories from scratch using October 1 reporting and materially updated developments; source publication dates are stated in headlines where an item is from Sept. 30. Claims, arrests, forecasts, poll results, source-based casualty counts and unresolved litigation remain attributed or qualified. Each story has at least one direct labeled source link; no cross-tab story is duplicated."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'Boston-area professional and major-college sports only.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, or international soccer.',business:'7 unique business/markets stories; at 7 a.m. show timestamped indicative Dow and Nasdaq-100 futures, clearly not cash indexes; at 10 a.m. and 1 p.m. show timestamped Dow and Nasdaq Composite cash-index levels, point and percentage moves, and any provider delay; at 4 p.m. show timestamped closing moves as confirmed or clearly preliminary; at 7 p.m. use confirmed closes; state the date of the latest completed U.S. cash session.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
