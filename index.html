:[{"id":"world-france-strike-protests","headline":"Sept. 29: Student protests and public-sector strike add pressure on France’s government","summary":"Reuters reports student demonstrations and a public-sector strike are increasing pressure on President Emmanuel Macron as political tensions rise. The protests reflect multiple grievances rather than a single national labor dispute.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters, Sept. 29","url":"https://www.reuters.com/world/europe/student-protests-french-public-sector-strike-heap-pressure-macron-2026-09-29/"}]},{"id":"world-malaysia-myanmar-repatriations","headline":"Sept. 29: Malaysia begins sending Myanmar nationals home despite safety concerns","summary":"Malaysia has begun deporting about 1,500 Myanmar nationals, including children, despite objections from the U.N. and rights groups about their safety, Reuters reports. The safety concerns are attributed to those organizations; the process is ongoing.","sources":["Other"],"signal":"Consensus","links":[{"label":"Reuters, Sept. 29","url":"https://www.reuters.com/world/asia-pacific/malaysia-begins-sending-home-myanmar-refugees-despite-safety-concerns-2026-09-29/"},{"label":"AP, Sept. 29","url":"https://apnews.com/article/malaysia-myanmar-repatriation-rohingya-5cafd8a3997a500e6c74216138960972"}]},{"id":"world-vietnam-terrorism-arrests","headline":"Sept. 29: Vietnam arrests three on terrorism charges, including foreign citizens","summary":"Vietnamese authorities arrested three people, including Norwegian and Australian citizens, on terrorism charges, Reuters reports. The charges are allegations by authorities; no court findings were reported.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters, Sept. 29","url":"https://www.reuters.com/world/asia-pacific/vietnam-arrests-three-terrorism-charges-including-norwegian-australian-citizens-2026-09-29/"}]},{"id":"world-estonia-russian-arson-allegation","headline":"Sept. 29: Estonia says Russia di /trump-gas-mileage-electric-vehicles-pollution-403742074c3f3140aaa1d10829daf35f"}]},{"id":"politics-house-dem-oversight-agenda","headline":"Sept. 28: House Democrats outline prospective oversight agenda if they win control","summary":"Democratic leaders described potential investigations into the administration and said impeachment could be considered, AP reports. The agenda is conditional on election results; no impeachment proceeding has begun.","sources":["Other"],"signal":"Watch","links":[{"label":"AP, Sept. 28","url":"https://apnews.com/article/house-democrats-trump-impeachment-investigations-corruption-jeffries-84bfad2502c42c7e43629f989601f356"}]},{"id":"politics-senate-college-sports-bill","headline":"Sept. 28: Senate passes bill to overhaul college sports and NIL rules","summary":"The Senate passed legislation addressing college sports, including name, image and likeness rules, AP and CNN report. The bill is not law until it completes the legislative process and receives presidential approval.","sources":["Other"],"signal":"Consensus","links":[{"label":"AP, Sept. 28","url":"https://apnews.com/article/college-sports-senate-ncaa-name-image-likeness-a63e3f4e0be41fb95062b2bc5e646f9f"},{"label":"CNN, Sept. 28","url":"https://www.cnn.com/2026/09/28/politics/senate-college-sports-bill"}]}],"entertainment":[{"id":"entertainment-dennis-haskins-dies","headline":"Sept. 29: Dennis Haskins, “Saved by the Bell” actor who played Mr. Belding, dies at 75","summary":"Haskins, best known for playing Bayside High’s principal on the sitcom, has died at 75, Deadline reports. The actor’s career included television and stage work beyond the role.","sources":["Other"],"signal":"Consensus","links":[{"label":"Deadline, Sept. 29","url":"https://deadline.com/2026/09/dennis-haskins-dead-saved-by-the-bell-mr-belding-1237115941/"}]},{"id":"entertainment-russo-hulk-avengers","headline":"Sept. 29: Russo brothers discuss Hulk’s role in “Avengers: Doomsday”","summary":"The directors discussed <script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'Boston-area professional and major-college sports only.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, or international soccer.',business:'7 unique business/markets stories; close figures refer to the latest completed U.S. session.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
