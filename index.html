ims remain unresolved or attributed.","entertainment":"Swift’s new release and VMA honors headline the current cards; Netflix’s sequel and the “9 to 5” re-release are dated or scheduled events. The Paramount/WBD challenge is a court filing, Macklemore’s tour is an announcement, and Sheeran’s Gillette shows were canceled."},"sections":{"top":[{"id":"top-iran-war-vote-proposal","headline":"Trump rejects Iran’s Hormuz offer, but U.S. and Tehran accounts differ on talks","summary":"President Trump rejected Tehran’s seven-day Hormuz proposal but told Axios he expects more negotiations this week. AP reports mediators expected indirect talks Monday, while Iranian state media said no direct U.S. meeting was planned; Fox News quoted a U.S. official calling the mediated contacts constructive, with nuclear concessions still a hurdle. No ceasefire or agreement has been announced, and the accounts distinguish indirect mediation from a direct meeting.","sources":["Fox","CNN","Other"],"signal":"Split","links":[{"label":"AP: Mediators still working on a possible Iran deal (Sept. 28)","url":"https://apnews.com/article/iran-trump-negotiations-war-strait-nuclear-871504dbd98d9b08b226b9805d8f4606"},{"label":"Fox News: Monday Iran live updates","url":"https://www.foxnews.com/live-news/trump-iran-war-news-peace-talks-hormuz-september-28"},{"label":"CNN: Sept. 28 segment transcript","url":"https://transcripts.cnn.com/show/se/date/2026-09-28/segment/02"},{"label":"The Guardian: Iran says no direct talks planned","url":"https://www.theguardian.com/us-news/live/2026/sep/28/donald-trump-iran-negotiations-fuel-deportations-media-china-latest-news-updates"}]},{"id":"top-noreaster-new-jersey-flooding","headline":"Nor’easter weakens over New England as coastal flooding, rain and outages linger Monday","summary":"An AP report updated Monday morning says high tides brought more coastal flooding and the storm knocked out power across parts of the Northeast. ABC News reports the worst of the storm is k floodwaters began easing after the weekend’s torrential rain, though officials’ counts and local impacts continue to evolve.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Thai flood damage and official toll (Sept. 28)","url":"https://www.reuters.com/business/environment/thousands-huddle-bangkok-shelters-thai-flood-damages-seen-320-mln-2026-09-28/"},{"label":"AP: Bangkok floodwaters begin to ease (Sept. 28)","url":"https://apnews.com/article/thailand-rain-floods-bangkok-airport-7a58485fa6f04454e0292aa30a2834e1"}]},{"id":"top-india-floods-uttar-pradesh","headline":"Officials say at least 62 people died in heavy rain and flooding in northern India","summary":"The Associated Press reports days of rain and flooding in Uttar Pradesh have killed at least 62 people, according to officials. Rescue and damage reporting is continuing.","sources":["Other"],"signal":"Watch","links":[{"label":"AP News","url":"https://apnews.com/article/india-uttar-pradesh-floods-bb581ea0f9fde75a5f99a7f0d5d5dd25"},{"label":"Associated Press report","url":"https://www.the-journal.com/articles/associated-press/heavy-rain-and-flooding-kill-at-least-62-in-northern-india/"}]},{"id":"top-south-africa-twin-shootings","headline":"AP reports 28 dead in two weekend South African shootings after another victim dies","summary":"AP and Reuters report that the death toll from two weekend shootings rose to 28 after another victim died. CNN’s separate Sunday report also included four deaths in a third shooting, giving a broader three-incident tally of 31; these counts are attributed to separate police reports and investigations.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"AP: two shootings’ toll rises to 28 (Sept. 28)","url":"https://www.winnipegfreepress.com/world/2026/09/28/south-africas-death-toll-from-weekend-mass-shootings-rises-to-28-after-another-victim-dies"},{"label":"Reuters: police report 27 killed in two shootings","url":"https://www.reuters.com/world/africa/south-africa-police-launch-manhunt-after-17-killed-tavern-shooting-2026-09-27/"},{"label":"CNN: separate report on three shootings (Sept. 27)","url":"https://www.cnn.com/2026/09/27/africa/south-africa-shooting-tavern-intl-hnk"}]},{"id":"top-fairford-base-arrests","headline":"Five Fairford suspects released on bail as UK terror inquiry continues; Iran link unconfirmed","summary":"AP reports that British police released five men on bail Monday after extensive interviews, while the investigation into an alleged plot near RAF Fairford continues. Iranian officials deny a connection; authorities have not established a motive or a foreign-state role, so the suspected plot remains an allegation under investigation.","sources":["Fox","CNN","Other"],"signal":"Watch","links":[{"label":"AP: Fairford suspects bailed as police probe possible Iran link (Sept. 28)","url":"https://apnews.com/article/uk-fairford-us-air-base-arrests-investigation-4b6fb8b4636c0c360bd7d3d2c44e8075"},{"label":"CNN: questions remain in Fairford investigation (Sept. 28)","url":"https://www.cnn.com/2026/09/28/uk/raf-fairford-key-questions-terror-suspects-arrests-intl"},{"label":"Fox News: suspects released on bail","url":"https://www.foxnews.com/live-news/trump-iran-war-news-peace-talks-hormuz-september-28"}]},{"id":"top-russia-attacks-ukraine-sept27","headline":"Russian drone strike hits Kyiv science academy; local authorities report at least one death","summary":"Reuters reports Russian jet-drones struck across Ukraine on Monday, including Kyiv’s National Academy of Sciences, where local authorities said at least one person was killed. The casualty figure is attributed to Ukrainian authorities.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters","url":"https://www.reuters.com/world/europe/kyiv-science-academy-hit-russian-jet-drones-strike-across-ukraine-2026-09-28/"}]},{"id":"top-trump-xi-summit","headline":"U.S. and China announce reciprocal tariff cuts covering $60 billion in goods","summary":"CNN and Reuters report the two governments agreed to cut tariffs on about $60 billion of imports from each country and extend their trade truce through Jan. 10. The announcement is a negotiated policy step; its implementation details and broader effect on trade remain to be seen.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"CNN: U.S.-China tariff cuts (Sept. 28)","url":"https://www.cnn.com/2026/09/28/business/us-china-tariff-cuts-60-billion-intl"},{"label":"Reuters: China says truce extension creates space for talks","url":"https://www.reuters.com/business/aerospace-defense/china-says-us-trade-truce-extension-creates-space-advance-talks-2026-09-28/"}]},{"id":"top-spacex-starship-first-orbit","headline":"SpaceX Starship reaches orbit for the first time and deploys 26 satellites before splashdown","summary":"SpaceX’s Starship reached orbit on its first orbital test and deployed all 26 planned Starlink satellites. AP says the mission ended early rather than completing six planned laps; CNN’s live report says the vehicle survived reentry and splashed down in the Pacific, marking a major milestone while the full planned flight was not completed.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"AP: first orbital flight ends early (Sept. 28)","url":"https://apnews.com/article/spacex-starship-orbit-262d3c58d56bf7a525b49115d6c5dfe8"},{"label":"CNN: Starship splashdown live updates (updated 12:57 p.m. EDT)","url":"https://www.cnn.com/2026/09/28/science/live-news/spacex-starship-flight-14-launch"},{"label":"ABC News: launch and early end to test flight","url":"https://abcnews.com/US/spacex-attempt-starships-1st-orbital-flight-test/story?id=136805227"}]}],"usa":[{"id":"usa-cornell-investigation-reopened","headline":"New York prosecutors reopen Cornell investigation after student files a sexual-assault lawsuit","summary":"CNN reports prosecutors reopened an investigation after a former Cornell student filed a lawsuit alleging gang rape. The allegations are not a finding of fact, and the renewed criminal inquiry remains ongoing.","sources":["CNN"],"signal":"Watch","links":[{"label":"CNN: prosecutors reopen Cornell investigation (Sept. 28)","url":"https://www.cnn.com/2026/09/28/us/cornell-university-sexual-assault-lawsuit-hnk"}]},{"id":"usa-copenhaver-death","headline":"James Copenhaver, wounded in the 2024 Butler rally shooting, dies from injury complications","summary":"Copenhaver, 76, was one of two people wounded when a gunman opened fire at then-candidate Donald Trump’s Pennsylvania rally in July 2024. His lawyer said he died from complications related to those injuries; the death brings renewed attention to the attack’s victims.","sources":["Fox","Other"],"signal":"Consensus","links":[{"label":"AP: Copenhaver’s death","url":"https://apnews.com/article/james-copenhaver-trump-rally-butler-dies-00866b37ad8db967b4ebf6582c756bcd"},{"label":"CBS Pittsburgh","url":"https://www.cbsnews.com/pittsburgh/news/jim-copenhaver-trump-rally-assassination-attempt-victim-dies/"},{"label":"Fox News","url":"https://www.foxnews.com/politics/james-copenhaver-man-shot-trump-butler-rally-dies-complications-from-injuries-report"}]},{"id":"usa-ole-miss-deaths","headline":"Two Ole Miss student deaths remain under investigation; kratom found at the scene does not establish a cause","summary":"Authorities are investigating the deaths of two students, and reporting says kratom was found at the scene. Investigators have not established that the substance caused either death; the cases remain under investigation.","sources":["CNN","Fox","Other"],"signal":"Watch","links":[{"label":"AP: deaths and kratom","url":"https://apnews.com/article/kratom-mississippi-deaths-students-5c4d6429e65b573b2667119a8f860ddb"},{"label":"CNN: Ole Miss deaths","url":"https://www.cnn.com/2026/09/24/us/ole-miss-student-deaths-wwk"},{"label":"Fox News","url":"https://www.foxnews.com/us/ole-miss-victim-identified-narcotics-task-force-probes-two-student-deaths"}]},{"id":"usa-usda-meat-recall","headline":"USDA recalls more than 167,000 pounds of meat produced without federal inspection","summary":"The Food Safety and Inspection Service says Star Meat Delivery recalled raw pork, beef and goat products that were produced without federal inspection. Check the agency’s recall notice for affected labels, lot details and handling instructions.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"USDA-FSIS recall notice","url":"https://www.fsis.usda.gov/recalls-alerts/star-meat-delivery-inc--recalls-raw-pork-beef-and-goat-products-produced-without"},{"label":"CNN: recall coverage","url":"https://www.cnn.com/2026/09/24/us/meat-recall-usda-star-meat-delivery-hnk"}]},{"id":"usa-meta-cambridge-analytica-jury","headline":"New Mexico jury finds Meta misled users about Facebook data practices in Cambridge Analytica case","summary":"A Santa Fe jury found 26 of 29 statements identified by New Mexico to be misleading, including statements about data practices, hate speech and misinformation; it rejected some other claims. The verdict concerns a state case arising from the Cambridge Analytica scandal. A judge will determine civil penalties, so the verdict is not a final damages award or a finding that Facebook sold every user’s data.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: jury verdict","url":"https://www.reuters.com/business/meta-misled-consumers-case-over-cambridge-analytica-scandal-new-mexico-jury-says-2026-09-25/"},{"label":"AP: case background and trial","url":"https://apnews.com/article/facebook-meta-new-mexico-privacy-lawsuit-8b414eb0a14d58d7cdc6ae752e25dcb0"}]},{"id":"usa-lincoln-sailor-mental-health","headline":"Navy says eight USS Lincoln carrier-group sailors attempted suicide during deployment","summary":"The Navy disclosed eight suicide attempts among sailors assigned to the USS Abraham Lincoln carrier group during deployment. The report raises questions about the strain of service r-hours shooting, police say","summary":"Police said an argument preceded Sunday morning’s shooting at an after-hours club. The investigation is ongoing; the casualty figures are attributed to authorities.","sources":["Other"],"signal":"Watch","links":[{"label":"AP News","url":"https://apnews.com/article/shooting-crime-detroit-ef32bed9c42cdd6e1e2fc3ade37cca3b"},{"label":"CBS News","url":"https://www.cbsnews.com/news/detroit-after-hours-club-shooting-september-27-2026/"}]},{"id":"usa-taxpayer-funded-trump-ad","headline":"Trump administration begins airing a 2024 campaign ad using taxpayer funds","summary":"The White House began airing a Trump campaign advertisement in government-funded messaging, according to AP. The card describes the ad and its public funding; it does not independently resolve legal or ethics questions.","sources":["Other"],"signal":"Watch","links":[{"label":"AP News","url":"https://apnews.com/article/trump-election-campaign-advertisements-bfa8e3c1c9e50de03092b4ec27055da9"}]}],"boston":[{"id":"boston-red-sox-cubs-final","headline":"FINAL Sunday, Sept. 27: Cubs beat Red Sox 6–2; no game Monday; Yankees Wild Card Game 1 Tuesday at 8 p.m. EDT","summary":"Chicago beat Boston 6–2 in the regular-season finale Sunday. The Red Sox have no game Monday; Game 1 of the AL Wild Card Series at the Yankees is scheduled for Tuesday, Sept. 29 at 8 p.m. EDT.","sources":["Other"],"signal":"Consensus","links":[{"label":"MLB: Cubs–Red Sox official final box score","url":"https://www.mlb.com/gameday/cubs-vs-red-sox/2026/09/27/824705/final/box"},{"label":"WBUR: Yankees–Red Sox Wild Card schedule","url":"https://www.wbur.org/news/2026/09/28/boston-red-sox-yankees-wild-card-series-playoffs"}]},{"id":"boston-patriots-jaguars-final","headline":"FINAL Sunday, Sept. 27: Jaguars beat Patriots 35–6; no game Monday; New England visits Buffalo Sunday at 1 p.m. EDT","summary":"Jacksonville defeated New England 35–6 Sunday in Week 3. The Patriots have no Monday game; the next schedu g waste; Sen. Susan Collins calls the move illegal. The separation-of-powers dispute remains unresolved.","sources":["Other"],"signal":"Split","links":[{"label":"Reuters: pocket rescission and Collins response","url":"https://www.reuters.com/legal/government/trump-seeks-withhold-800-million-congress-approved-funds-2026-09-26/"},{"label":"ABC News: White House order and Collins response","url":"https://abcnews.com/Politics/white-house-orders-800m-funds-rescinded-collins-calls/story?id=136772703"}]}],"entertainment":[{"id":"entertainment-taylor-swift-encore","headline":"Taylor Swift releases “The Life of a Showgirl: The Encore” and announces the “Patient Zero” video","summary":"Swift’s expanded release arrived Friday with additional songs; the “Patient Zero” music video is scheduled to premiere during Sunday’s VMAs. The album is out, while the video remains a future event.","sources":["Other"],"signal":"Consensus","links":[{"label":"AP: Swift release","url":"https://apnews.com/article/taylor-swift-new-music-patient-zero-934935f049893d0567713bea516f2c0c"},{"label":"Variety: album and video","url":"https://variety.com/2026/music/news/taylor-swift-reveals-life-of-showgirl-encore-new-songs-1236872982/"},{"label":"Variety: video details","url":"https://variety.com/2026/music/news/taylor-swift-patient-zero-music-video-dakota-johnson-colin-farrell-1236874206/"}]},{"id":"entertainment-different-world-netflix","headline":"Sept. 24: Netflix’s “A Different World” sequel premieres with the original HBCU setting in focus","summary":"CNN reported the sequel premiered Sept. 24, returning to the HBCU setting of the original series. This is a dated release, not a new Monday premiere.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"CNN: sequel premiere","url":"https://www.cnn.com/2026/09/24/entertainment/a-different-world-reboot-netflix"},{"label":"AP: sequel","url":"https://apnews.com/article/a-different-world-sequel-f0f23537d211e084dfb53999c3a4a367"}]},{"id":"entertainment-paramount-wbd-settlement-challenge","headline":"Merger opponents ask a court to reject Paramount’s settlement tied to its Warner Bros. bid","summary":"Variety reports opponents urged a court to reject a settlement connected to Paramount’s proposed Warner Bros. bid. The filing is an argument for the judge to consider; it is not a ruling on the merger or a completed acquisition.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety: court challenge","url":"https://variety.com/2026/tv/global/block-the-merger-amicus-brief-reject-settlement-1236875410/"},{"label":"Variety: settlement terms","url":"https://variety.com/2026/film/news/paramount-states-settlement-terms-warner-bros-1236871264/"}]},{"id":"entertainment-macklemore-charity-tour","headline":"Macklemore announces a tour supporting Palestinian aid organizations","summary":"Macklemore says proceeds from his planned “Free Palestine” shows will support aid organizations. The tour announcement is confirmed; the performances and any eventual distributions have not yet occurred.","sources":["Other"],"signal":"Watch","links":[{"label":"AP: tour announcement","url":"https://apnews.com/article/macklemore-free-palestine-shows-ed-sheeran-65a65a362e530dfe739ddb626dc16d23"},{"label":"Variety: tour details","url":"https://variety.com/2026/music/news/macklemore-free-palestine-tour-1236874352/"}]},{"id":"entertainment-dolly-9-to-5-restoration","headline":"Restored “9 to 5” returns to U.S. theaters Oct. 9–15, with proceeds supporting Dolly Parton’s foundation","summary":"Deadline reports 20th Century Studios will bring the newly restored 1980 comedy starring Dolly Parton, Jane Fonda and Lily Tomlin back to theaters for a one-week run beginning Oct. 9. Disney says net proceeds from U.S. ticket sales will benefit the Dollywood Foundation; screenings are upcoming, not underway.","links":[{"label":"Deadline: restored “9 to 5” theatrical run and charity","url":"https://deadline.com/2026/09/9-to-5-return-screening-dolly-parton-charity-1237113711/"},{"label":"Fox 59: Oct. 9–15 theatrical dates","url":"https://fox59.com/news/national-world/dolly-partons-classic-9-to-5-returning-to-theaters-for-limited-run/"}],"signal":"Watch","sources":["Other"]},{"id":"entertainment-ed-sheeran-gillette-canceled","headline":"Sept. 25–26: Ed Sheeran cancels Gillette Stadium concerts as nor’easter approaches","summary":"Gillette Stadium’s schedule confirms the Friday and Saturday shows were canceled as the storm approached. These are completed cancellations, not upcoming concerts.","sources":["Other"],"signal":"Consensus","links":[{"label":"Gillette Stadium official cancellation notice","url":"https://www.gillettestadium.com/events/ed-sheeran-loop-tour/"},{"label":"NBC Boston/AP: cancellation report","url":"https://www.nbcboston.com/news/local/ed-sheeran-gillette-stadium-loop-tour/4020701/"}]},{"id":"entertainment-vmas-results","headline":"Sunday, Sept. 27: Taylor Swift wins three VMAs including Video of the Year; Madonna leads with seven awards","summary":"Taylor Swift’s “The Fate of Ophelia” won Video of the Year at Sunday’s MTV VMAs; Swift collected three trophies, dedicated the top award to Dolly Parton and reached 33 career VMAs. Madonna led the night with seven wins, according to Reuters’ results report.","sources":["Other"],"signal":"Consensus","links":[{"label":"Reuters: Taylor Swift makes VMAs history and dedicates award to Dolly Parton (Sept. 28)","url":"https://www.reuters.com/business/media-telecom/madonna-sabrina-carpenter-lisa-win-mtvs-video-music-awards-2026-09-28/"},{"label":"The Hollywood Reporter: full 2026 VMAs winners list","url":"https://www.hollywoodreporter.com/lists/mtv-vmas-2026-winners-list/"}]}]},"researchNotes":["Monday, Sept. 28, 2026 fresh web check: opened Fox News’ Iran live file, CNN’s current home page and Starship live coverage, and the Drudge Report front page; the lead emphasis differed, and Drudge was treated as an aggregator rather than independent reporting.","AP reported mediators expected indirect U.S.-Iran talks Monday; Iranian state media separately said no direct U.S. meeting was planned. Fox quoted a U.S. official describing constructive mediated contacts, while the nuclear issue remained a hurdle; no deal or ceasefire was announced.","AP’s Monday nor’easter update and ABC News forecast describe lingering coastal flooding and a weakening storm. NHC Discussion No. 32 (Monday 8 a.m. MST) forecast Hurricane Polo’s Baja landfall for the evening and a second mainland Mexico landfall Tuesday; hazards are forecasts, not confirmed impacts.","AP and CNN live coverage confirm Starship reached orbit and deployed all 26 operational Starlink satellites; CNN’s live page, updated 12:57 p.m. EDT, reports splashdown after reentry. The flight ended early rather than completing the planned six laps.","AP, Reuters and local reporting were used to check Monday updates on Thailand flooding, the South African shootings and the Fairford investigation. Official casualty counts and the suspected plot’s possible foreign connection are attributed; the five Fairford suspects were reported released on bail.","Market verification: AP reported Friday Sept. 25 closing levels and point changes; TheStreet’s Friday closing recap cross-checks exact percentage changes. Reuters’ Monday report gives Dow/Nasdaq intraday figures at 11:50 a.m. EDT; Monday was still an open market session at this edition build.","Boston check at this scheduled Monday refresh: the Red Sox and Patriots had Sunday finals, no Monday game was scheduled for either, official NHL calendar showed no Bruins game Monday and a Tuesday 8 p.m. opener, and the Celtics had no game Monday with training camp opening Tuesday. Boston College’s latest cited final was Saturday’s 21–14 loss.","Stories were screened for dated older events, attributed allegations and forecasts, unique IDs/headlines, and the General Sports exclusions. The eight ordered tabs contain 65 distinct stories with synchronized section Tells."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'Boston-area professional and major-college sports only.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, or international soccer.',business:'7 unique business/markets stories; close figures refer to the latest completed U.S. session.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
