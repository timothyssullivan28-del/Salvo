26","url":"https://apnews.com/article/cash-app-bob-lee-killing-nima-momeni-0bc04721eb40f331cc2e5f94ef037b0b"}]},{"id":"story-n11m-8","headline":"Judge jails Thomas Markle after electronic monitor removal","summary":"AP’s Tuesday 11:01 p.m. EST update says a federal magistrate ordered Thomas Markle detained after authorities said he cut off his ankle monitor. He faces a child sexual abuse material charge. The custody decision is a release-condition ruling, not a conviction on the underlying charge.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — Updated 11:01 PM EST, November 10, 2026","url":"https://apnews.com/article/thomas-markle-charges-ankle-monitor-fce501251ffa12c5427a9a4f2b96b2ee"}]},{"id":"story-n10e-14","headline":"FBI affidavit describes alleged cabin assault in cruise-ship murder case","summary":"AP’s Tuesday 9:05 p.m. EST update says Jason Watford appeared in Galveston federal court on a murder charge after his wife Susan was found dead aboard MSC Seascape. An FBI affidavit describes his alleged admission after an argument; a child was found unharmed. The charge is not a conviction.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — Updated 9:05 PM EST, November 10, 2026","url":"https://apnews.com/article/cruise-ship-killing-texas-fbi-seascape-75feb04185cb0066a193f94908d9c5b2"}]},{"id":"story-n11m-7","headline":"Idaho man sentenced to 18 years for attempted Islamic State support","summary":"AP’s Tuesday 8:05 p.m. EST report says Alexander Scott Mercurio received 18 years in federal prison after pleading guilty to attempted material support for Islamic State. Prosecutors say he planned church attacks before his 2024 arrest. The sentence includes lifetime supervised release after prison.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — Updated 8:05 PM EST, November 10, 2026","url":"https://apnews.com/article/idaho-islamic-state-terror-support-sentence-fa16ec991964a046aa4a1b073d64f60e"}]},{"id":"story-n10e-16","headline"
