<script id="briefing" type="application/json">{"date":"2026-09-26","lastUpdated":"September 26, 2026, 4:04 p.m. EDT Boston","dek":"Trump’s rejection of Iran’s Hormuz plan, Northeast coastal flooding, Pacific storm threats, a claimed U.S.–China tariff arrangement and Friday’s AI-led market rise lead this Saturday Boston edition.","take":"Fox, CNN and Drudge all elevate the Trump–Xi summit: Fox calls the White House-described $30 billion tariff arrangement a breakthrough, CNN stresses China’s AI pitch and limited public terms, and Drudge calls it “long on pomp, short on progress.” Reuters reports Beijing’s eight-point account; Drudge is an aggregator, not an independent reporting source. Trump says he rejected Iran’s Hormuz plan as storms threaten coasts and islands; casualty and interception claims are attributed, cyclone impacts are forecasts, and Supreme Court rulings do not establish widespread noncitizen voting.","sectionTakes":{"top":"Fox, CNN and Drudge all elevate the Trump–Xi summit: Fox calls the White House-described $30 billion tariff arrangement a breakthrough, CNN stresses China’s AI pitch and limited public terms, and Drudge calls it “long on pomp, short on progress.” Reuters reports Beijing’s eight-point account; Drudge is an aggregator, not an independent reporting source. Trump says he rejected Iran’s Hormuz plan as storms threaten coasts and islands; casualty and interception claims are attributed, cyclone impacts are forecasts, and Supreme Court rulings do not establish widespread noncitizen voting.","usa":"This tab spans violent incidents, an alleged mistaken ICE detention, a recall, military wellbeing, platform accountability and prediction-market regulation. Police accounts and student deaths remain under investigation; Meta’s jury verdict has penalties pending, TikTok settled before trial, and the Kalshi decision is one appeals-court ruling—not a nationwide resolution.","world":"Flooding and the deadly Athens collapse lead; Pakistan’s toll is a  tour is announced but not completed."},"sections":{"top":[{"id":"top-iran-war-vote-proposal","headline":"Trump publicly rejects Iran’s seven-day plan to reopen the Strait of Hormuz; no ceasefire or agreement is in place","summary":"Reuters and CNN report that President Donald Trump said Saturday he rejected Iran’s proposal. Tehran says the plan would reopen the Strait of Hormuz and pause regional fighting within seven days, with the next step resting on Washington. Trump called the offer unacceptable; his statements about U.S. control of the strait and the number of ships that passed are attributed claims. The rejection is public, but no U.S.-Iran deal or ceasefire has been reached. Reuters also relays a separate Wall Street Journal account, citing unnamed U.S. officials, about possible renewed bombing after the midterms; that is not an announced military decision.","sources":["Fox","CNN","Other"],"signal":"Watch","links":[{"label":"Reuters: Trump rejects Iranian proposal","url":"https://www.reuters.com/world/middle-east/iran-awaits-us-move-after-wsj-report-says-trump-rejects-peace-plan-2026-09-26/"},{"label":"CNN: Trump rejects latest Hormuz proposal","url":"https://www.cnn.com/2026/09/26/middleeast/trump-rejects-iran-proposal-hormuz-intl"},{"label":"Fox News: Iran live coverage","url":"https://www.foxnews.com/live-news/iran-war-strait-hormuz-trump-talks-oil-gas-prices-midterms-09-26-26"}]},{"id":"top-noreaster-new-jersey-flooding","headline":"Nor’easter floods the Northeast coast; Atlantic City’s high tide reaches its highest point since Superstorm Sandy, CNN reports","summary":"CNN’s 12:58 p.m. EDT live update says Saturday’s high tide brought Atlantic City water levels to their highest point since Superstorm Sandy, with Jersey Shore neighborhoods flooded; AP separately reports flooded New Jersey roads and inundated homes. CNN also reports strong winds and power outages as the storm moves along the coast. Additional wind, rain and coastal flooding remain time-sensitive hazards; impacts are not uniform across the region.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"CNN: live nor’easter update (updated 12:58 p.m. EDT)","url":"https://www.cnn.com/2026/09/26/weather/live-news/noreaster-weekend-storm"},{"label":"AP: flooding in New Jersey","url":"https://apnews.com/article/noreaster-storm-cape-cod-new-england-4057bec1ced5c4883d36c30c778df410"},{"label":"Reuters: emergency declarations and storm threat","url":"https://www.reuters.com/world/us/noreaster-expected-disrupt-travel-flood-basements-knock-out-power-along-us-east-2026-09-25/"}]},{"id":"top-pacific-hurricanes","headline":"Hurricane Nolo moves slowly west at 100 mph south of Hawaii; additional heavy rain and flooding remain possible","summary":"The latest available NHC public advisory (#24A, issued 8 a.m. HST Saturday) places Nolo at 16.8°N, 155.7°W, moving west at 3 mph with maximum sustained winds of 100 mph. NHC warns of additional heavy rainfall, gusty winds and large waves for parts of Hawaii; those impacts are forecast, not all observed.","sources":["Other"],"signal":"Watch","links":[{"label":"NHC Hurricane Nolo Public Advisory #24A (8 a.m. HST)","url":"https://www.nhc.noaa.gov/text/refresh/HFOTCPCP2+shtml/261755.shtml"},{"label":"NHC forecast discussion #24","url":"https://www.nhc.noaa.gov/text/refresh/HFOTCDCP2+shtml/261457.shtml"},{"label":"Hawaii Emergency Management Agency updates","url":"https://dod.hawaii.gov/hiema/tropical-storm-nolo-updates/"},{"label":"AP: Pacific hurricanes threaten Hawaii and Mexico","url":"https://apnews.com/article/hurricane-nolo-hawaii-polo-mexico-e92145be4b564484025132cdf3d0de90"}]},{"id":"top-trump-xi-summit","headline":"Fox reports a U.S.-China $30 billion tariff arrangement after the Xi summit; rates and product details are still pending","summary":"Fox News says the White House described a reciprocal tariff-reduction agreement covering $30 billion in non-sensitive goods; final rates and the complete product list supreme-court-bars-republican-drawn-map-missouri-third-time-2026-09-25/"},{"label":"AP: Supreme Court rejects Missouri map","url":"https://apnews.com/article/supreme-court-missouri-redistricting-congressional-map-3f43ba5f47681ea759115fbc250712d4"},{"label":"Fox News: Supreme Court decision","url":"https://www.foxnews.com/politics/supreme-court-blocks-missouri-from-using-new-congressional-map-2026-election"}]},{"id":"top-kyiv-russian-strikes","headline":"Russian strikes kill seven in Kyiv, officials say, as Ukraine’s largest steel plant halts production","summary":"Reuters reports Kyiv authorities said seven people were killed Friday, including a 14-year-old boy. ArcelorMittal said repeated strikes made it unsafe to resume production at its Kryvyi Rih plant, Ukraine’s largest steelmaker. The death toll is attributed to local authorities and the production pause to the company; it does not mean all Ukrainian steel production has stopped.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Kyiv deaths and steel-plant shutdown","url":"https://www.reuters.com/world/europe/russian-drone-hits-central-kyiv-killing-child-injuring-least-seven-people-2026-09-25/"}]},{"id":"top-saudi-houthi-attacks","headline":"Saudi-led coalition says it intercepted two Houthi missiles and two drones aimed at Saudi targets","summary":"The Saudi-led coalition said it intercepted two ballistic missiles headed toward Khamis Mushait and two drones toward Riyadh early Saturday, Reuters reports. The interception account is attributed to the coalition and reporting does not independently establish damage at the alleged targets. Saudi, Turkish and Pakistani military chiefs have also met in Riyadh amid the regional conflict.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Saudi coalition reports interceptions","url":"https://www.reuters.com/world/middle-east/saudi-says-it-intercepted-2-drones-launched-by-houthis-towards-riyadh-2026-09-26/"},{"label":"AP: regional developments","url":"https://apnews.com/article/yemen-saudi-arabia-houthis-missiles-d19776cf1a68b45d28b1402f3a47b8cd"}]},{"id":"top-white-house-press-access","headline":"White House leaves CNN off Air Force One for Trump’s Tennessee trip despite a temporary order restoring its press access","summary":"CNN and AP report that the network did not travel with President Donald Trump on Saturday’s Tennessee trip. A judge’s separate 14-day order restored White House press passes for CNN, MS NOW and Politico, but the travel-pool dispute continues. The temporary restoration is not a final ruling on the outlets’ First Amendment claims.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"CNN: Air Force One travel-pool exclusion","url":"https://www.cnn.com/2026/09/25/politics/white-house-blocks-cnn-air-force-one-travel-pool"},{"label":"Reuters: White House blocks CNN from flight","url":"https://www.reuters.com/business/media-telecom/white-house-blocks-cnn-air-force-one-trip-washington-post-reports-2026-09-26/"},{"label":"AP: CNN left off Saturday trip","url":"https://apnews.com/article/white-house-media-ban-cnn-network-pool-c32504981ee2f5b3c137e57d9d36f33e"},{"label":"Reuters: judge’s temporary access order","url":"https://www.reuters.com/world/judge-lifts-trumps-white-house-ban-cnn-ms-now-politico-2026-09-24/"}]}],"usa":[{"id":"usa-pittsburgh-doctor-killed","headline":"Pittsburgh pediatrician Idris Evans is killed in a home attack; his wife is critically injured, officials say","summary":"Police say a man entered the home and stabbed Evans and his wife while they slept; the suspect was detained. The investigation is ongoing, and the attack account is attributed to law enforcement.","sources":["CNN","Fox","Other"],"signal":"Consensus","links":[{"label":"CNN: Pittsburgh investigation","url":"https://www.cnn.com/2026/09/25/us/pittsburgh-doctor-idris-evans-stabbing-home"},{"label":"PennLive: local report","url":"https://www.pennlive.com/crime/2026/09/upmc-childrens-hospital-physician-killed-in-stabbing-suspect-detained.html"}]},{"id":"usa-copenhaver-death","headline":"James Copenhaver, wounded in the 2024 Butler rally shooting, dies from injury complications","summary":"Copenhaver, 76, was one of two people wounded when a gunman opened fire at then-candidate Donald Trump’s Pennsylvania rally in July 2024. His lawyer said he died from complications related to those injuries; the death brings renewed attention to the attack’s victims.","sources":["Fox","Other"],"signal":"Consensus","links":[{"label":"AP: Copenhaver’s death","url":"https://apnews.com/article/james-copenhaver-trump-rally-butler-dies-00866b37ad8db967b4ebf6582c756bcd"},{"label":"CBS Pittsburgh","url":"https://www.cbsnews.com/pittsburgh/news/jim-copenhaver-trump-rally-assassination-attempt-victim-dies/"},{"label":"Fox News","url":"https://www.foxnews.com/politics/james-copenhaver-man-shot-trump-butler-rally-dies-complications-from-injuries-report"}]},{"id":"usa-ole-miss-deaths","headline":"Two Ole Miss student deaths remain under investigation; kratom found at the scene does not establish a cause","summary":"Authorities are investigating the deaths of two students, and reporting says kratom was found at the scene. Investigators have not established that the substance caused either death; the cases remain under investigation.","sources":["CNN","Fox","Other"],"signal":"Watch","links":[{"label":"AP: deaths and kratom","url":"https://apnews.com/article/kratom-mississippi-deaths-students-5c4d6429e65b573b2667119a8f860ddb"},{"label":"CNN: Ole Miss deaths","url":"https://www.cnn.com/2026/09/24/us/ole-miss-student-deaths-wwk"},{"label":"Fox News","url":"https://www.foxnews.com/us/ole-miss-victim-identified-narcotics-task-force-probes-two-student-deaths"}]},{"id":"usa-evanston-ice-detention","headline":"U.S. citizen says ICE agents mistakenly detained and injured him in Evanston","summary":"A U.S. citizen says immigration agents wrongly detained and injured him; local police and the man "https://apnews.com/article/facebook-meta-new-mexico-privacy-lawsuit-8b414eb0a14d58d7cdc6ae752e25dcb0"}]},{"id":"usa-lincoln-sailor-mental-health","headline":"Navy says eight USS Lincoln carrier-group sailors attempted suicide during deployment","summary":"The Navy disclosed eight suicide attempts among sailors assigned to the USS Abraham Lincoln carrier group during deployment. The report raises questions about the strain of service; it does not identify individual sailors, and care resources are available through military and civilian crisis services.","sources":["Other"],"signal":"Watch","links":[{"label":"AP: Navy disclosure","url":"https://apnews.com/article/uss-lincoln-aircraft-carrier-suicide-attempts-iran-7bb8316aa4fd67e6d2c8b34c029eebda"}]},{"id":"usa-tiktok-alabama-settlement","headline":"TikTok settles Alabama’s teen-harm lawsuit on eve of the first state trial over the claims","summary":"Reuters reports TikTok and ByteDance reached a settlement with Alabama over allegations that the platform was designed to addict children and that the companies misled consumers about safety. The Alabama attorney general’s office says the state will receive at least $100 million within 45 days, with potential payments up to $300 million if conditions are met. This is a settlement before trial, not a court finding that every allegation was proven.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Alabama settlement and terms","url":"https://www.reuters.com/world/us/tiktok-settles-with-alabama-ahead-first-state-trial-over-claims-teen-harms-2026-09-25/"}]},{"id":"usa-kalshi-sixth-circuit-ruling","headline":"Appeals court says states may regulate Kalshi sports-event contracts under gambling laws","summary":"Reuters reports the 6th U.S. Circuit Court of Appeals ruled that Ohio and Tennessee gambling laws were not preempted by federal law and that Kalshi had not shown its sports-event contracts were swaps subject exclusively to Commodity Futures Trading Commission regulation. The ruling is a circuit-court decision; broader litigation and regulatory questions remain.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: 6th Circuit ruling","url":"https://www.reuters.com/business/finance/us-appeals-court-rules-against-kalshi-says-states-can-regulate-prediction-2026-09-25/"}]},{"id":"usa-tasia-fortune-investigation","headline":"Mississippi police say Tasia Fortune’s death was staged after a drug dispute; case remains under investigation","summary":"An Associated Press report says a Jackson police detective testified that investigators believe Fortune was killed during a drug dispute and that her body was hung in a staged scene. These are police allegations and testimony in an ongoing criminal case, not a final court finding about motive or guilt.","sources":["Other"],"signal":"Watch","links":[{"label":"AP report via Boston Herald","url":"https://www.bostonherald.com/2026/09/25/tasia-fortune-death-staged/"},{"label":"AP report via WPSD Local 6","url":"https://www.wpsdlocal6.com/news/tasia-fortunes-hanging-was-staged-after-her-death-in-a-drug-dispute-mississippi-police-say/article_a8197c4e-b146-4b9a-ae35-11f691131480.html"}]}],"world":[{"id":"world-bangkok-flood-disaster-zone","headline":"Bangkok declares a disaster zone after nearly 12 inches of rain floods roads and homes","summary":"Reuters reports Bangkok’s governor declared the Thai capital a disaster-affected zone Saturday after nearly 300 millimeters (12 inches) of rain fell in 48 hours. Roads flooded, residents were advised to avoid unnecessary travel and schools opened as shelters; Suvarnabhumi Airport was operating normally. Further thunderstorms are forecast.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Bangkok flooding and disaster declaration","url":"https://www.reuters.com/business/environment/thai-capital-bangkok-declared-disaster-zone-amid-flooding-2026-09-26/"}]},{"id":"world-athens-building-collapse-update","headline":"Athens explosion collapses a building and kills six, fire brigade says; cause remains under investigation","summary":"The Greek fire brigade said six people died after a two-story building in central Athens collapsed following Friday’s explosion. A fire brigade official said rescuers were searching for an elderly couple and four tourists. The city’s mayor said the blast was likely linked to gas infrastructure, but investigators have not established the cause.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: updated Athens death toll","url":"https://www.reuters.com/world/one-dead-5-missing-after-explosion-destroys-building-athens-2026-09-26/"}]},{"id":"world-pakistan-dera-ismail-khan-blast","headline":"Blast in Pakistan’s Dera Ismail Khan kills 11 and injures 30, emergency service says","summary":"Rescue 1122 said 11 people were killed and 30 injured in Saturday’s blast in northwestern Pakistan. The Tehreek-e-Taliban Pakistan claimed responsibility. The casualty count is attributed to the emergency service; the militant group’s claim has not been independently established.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: blast kills 11, injures 30","url":"https://www.reuters.com/world/asia-pacific/blast-pakistans-dera-ismail-khan-kills-11-injures-30-2026-09-26/"}]},{"id":"world-catania-airport-etna-ash","headline":"Flights suspended at Italy’s Catania airport through Sunday morning as Etna ash and weather disrupt arrivals","summary":"The company operating Sicily’s Catania airport said arrivals were suspended until 10:00 GMT Sunday because of volcanic ash from Mount Etna and weather conditions. The restriction is a current disruption, not a forecast that the airport will remain closed afterward.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Catania airport suspends arrivals","url":"https://www.reuters.com/business/environment/italys-catania-airport-shuts-etna-ash-halts-flights-2026-09-26/"}]},{"id":"world-india-voter-roll emocracy,” but no date was set; analysts say organizing a vote could take at least 12 months. The lack of a date is not an official cancellation.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: visit ends without deals or election date","url":"https://www.reuters.com/world/americas/venezuela-president-returns-us-visit-with-no-deals-no-firm-election-date-2026-09-26/"},{"label":"Reuters: Rodríguez pledges elections at U.N.","url":"https://www.reuters.com/world/americas/venezuelas-rodriguez-promises-elections-2026-09-23/"}]}],"boston":[{"id":"boston-red-sox-cubs-doubleheader-sweep","headline":"Red Sox sweep Cubs with Friday doubleheader finals of 4–3 and 2–0","summary":"Boston won both games at Fenway on Friday, Sept. 25: 4–3 in Game 1 and 2–0 in Game 2. MLB’s recap and ESPN’s final box-score pages confirm both results. The Saturday series finale was moved to Tropicana Field because of the nor’easter.","sources":["Other"],"signal":"Consensus","links":[{"label":"MLB: Cubs lose both games of the doubleheader","url":"https://www.mlb.com/news/cubs-lose-both-games-of-doubleheader-to-red-sox"},{"label":"ESPN: Game 1 recap and box score","url":"https://www.espn.com/mlb/recap/_/gameId/401817104"},{"label":"ESPN: Game 2 recap and box score","url":"https://www.espn.com/mlb/recap/_/gameId/401817074"}]},{"id":"boston-bruins-capitals-overtime-final","headline":"Capitals beat Bruins 3–2 in overtime in Friday’s preseason final","summary":"Washington defeated Boston 3–2 in overtime on Friday, Sept. 25; Boston’s preseason ended with the loss. ESPN’s game recap and Boston hockey coverage report the final. The Patriots and Celtics did not play Friday, so no score is implied for those teams.","sources":["Other"],"signal":"Consensus","links":[{"label":"ESPN: Bruins–Capitals recap and final","url":"https://www.espn.com/nhl/recap/_/gameId/401879360"},{"label":"Boston Hockey Now: Bruins lose 3–2 in overtime","url":"https://bostonhockeynow.com/2026-09-25-bruins-third-period-c or plan","url":"https://edition.cnn.com/2026/09/25/politics/trump-election-monitors-voting-machines-vis"}]},{"id":"politics-government-funded-ad","headline":"A U.S.-government-funded TV ad uses President Trump’s midterm messaging","summary":"AP reports a federally funded television advertisement carries political themes associated with Trump as midterms approach. The story concerns the ad and its funding; it does not by itself establish an election-law violation.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"AP: government-funded ad","url":"https://apnews.com/article/paid-by-us-government-ad-midterms-04b3fe552fc3de2ada0b14394706e0e0"},{"label":"CNN audio report","url":"https://www.cnn.com/audio/podcasts/laura-coates-live/episodes/bb924b10-b5a4-11f0-a02e-af90e7b5928b"}]},{"id":"politics-ohio-citizenship-voter-law","headline":"Federal appeals court reinstates Ohio’s documentary-citizenship requirement for voter registration","summary":"Reuters reports the appeals court revived the state requirement while litigation proceeds. The order reinstates a law; it is not evidence that noncitizens voted in significant numbers.","sources":["Other"],"signal":"Consensus","links":[{"label":"Reuters: appeals court ruling","url":"https://www.reuters.com/legal/government/us-appeals-court-reinstates-ohio-law-requiring-voters-prove-citizenship-2026-09-24/"}]},{"id":"politics-california-ballots","headline":"California Supreme Court orders Riverside County sheriff to return 650,000 seized ballots","summary":"AP reports the state high court ordered the sheriff to return ballots seized from a 2025 special election. The ruling concerns the legality and custody of those ballots; it does not change the certified election result or substantiate claims of fraud.","sources":["Other"],"signal":"Consensus","links":[{"label":"AP: California ballot order","url":"https://apnews.com/article/sheriff-ballots-seized-california-supreme-court-e77a7eda321df80fa69da835e925e5b0"}]},{"id":"politics-new-jersey-lt-governor-resigns","headline":"New Jersey Lt. Gov. Dale Caldwell resigns after investigation found ethical violations; he disputes the report","summary":"Gov. Mikie Sherrill said Caldwell resigned Friday after an independent investigation found he behaved inappropriately with women and committed other ethical violations. The report’s findings and allegations remain attributed; Caldwell’s attorney says he challenges the report and is exploring legal remedies. Acting Comptroller Shirley Emehelu was named acting lieutenant governor.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: resignation and investigation","url":"https://www.reuters.com/world/us/new-jerseys-lieutenant-governor-resigns-amid-sexual-harassment-findings-2026-09-25/"},{"label":"NBC News: report and resignation","url":"https://www.nbcnews.com/politics/politics-news/new-jersey-lieutenant-governor-resigns-ethics-report-rcna599885"}]},{"id":"politics-michigan-doorstep-midterms","headline":"Republican door-knockers pitch a Democrats-as-extremists message in a close Michigan race, Reuters reports","summary":"Reuters accompanied Americans for Prosperity Action canvassers mobilizing voters for Republican Mike Rogers. The story describes a campaign strategy with mixed success on the doors, not a poll or an election result.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Michigan door-to-door campaign","url":"https://www.reuters.com/world/us/michigan-doorsteps-republicans-sell-democrats-as-extremists-message-with-mixed-2026-09-26/"}]},{"id":"politics-trump-pocket-rescission-800m","headline":"Trump seeks to withhold more than $800 million in Congress-approved funds; Sen. Susan Collins calls move illegal","summary":"Reuters reports the White House is using a rarely used “pocket rescission” to withhold approved spending for immigration, race, education, refugee assistance, minority-business development and overseas conservation programs. The administration says it is cutting wasteful spending; Sen. Susan Collins, who chairs Appropriations, calls withholding the funds without congressional approval illegal. The constitutional power-of-the-purse dispute remains unresolved.","sources":["Other"],"signal":"Split","links":[{"label":"Reuters: pocket rescission and Collins response","url":"https://www.reuters.com/legal/government/trump-seeks-withhold-800-million-congress-approved-funds-2026-09-26/"},{"label":"ABC News: White House order and Collins response","url":"https://abcnews.com/Politics/white-house-orders-800m-funds-rescinded-collins-calls/story?id=136772703"}]}],"business":[{"id":"business-friday-market-close","headline":"Friday’s U.S. indexes close higher: Dow gains 478.64 points, Nasdaq 129.34; markets shut for weekend","summary":"The Friday, Sept. 25 session ended with the Dow at 51,828.62 and the Nasdaq Composite at 27,068.72. Reuters reports gains of 0.93% and 0.48%, respectively; AP gives the exact point advances. Microsoft and other AI-related technology shares helped lift stocks, while oil prices and Treasury yields kept investors wary. These are completed Friday closes, not live Saturday market levels.","sources":["Other"],"signal":"Consensus","links":[{"label":"Reuters: Wall Street close and drivers (Sept. 25)","url":"https://www.reuters.com/business/wall-st-futures-gain-ai-enthusiasm-eases-worries-over-higher-oil-prices-yields-2026-09-25/"},{"label":"AP: exact Dow and Nasdaq point moves (Sept. 25)","url":"https://apnews.com/article/wall-street-stocks-dow-nasdaq-36d06c7a598e03539e0e09bdf6b7ede2"}]},{"id":"business-akamai-anthropic-cloud-deal","headline":"Akamai signs seven-year $11.6 billion Anthropic cloud deal; warrant could give AI firm up to 5%","summary":"Akamai says Anthropic committed $11.6 billion over seven years for cloud services, with a warrant for up to a 5% stake; another $9 billion in services could trigger the remaining warrant portion. Akamai estimates about $5.5 billion in related capital spending and says its 2026 revenue outlook is unchanged. The commitment is large, but returns and the expansion remain prospective.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: deal, warrant and spending details","url":"https://www.reuters.com/technology/akamai-anthropic-sign-116-billion-cloud-services-deal-2026-09-24/"},{"label":"Reuters: Friday share move and market context","url":"https://www.reuters.com/business/wall-st-futures-gain-ai-enthusiasm-eases-worries-over-higher-oil-prices-yields-2026-09-25/"}]},{"id":"business-microsoft-copilot-rebuild","headline":"Microsoft rebuilds Copilot around Office apps, coding tools and an always-on AI agent","summary":"Microsoft added Word, Excel and PowerPoint integration, a natural-language coding tool and Autopilot, an AI “digital coworker.” Code and Autopilot were slated for previews later this month, not broad release; the company also added controls to help track enterprise AI costs. Shares rose about 3.7% Friday, Reuters reports.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Copilot product changes and rollout","url":"https://www.reuters.com/technology/microsoft-revamps-copilot-with-code-generation-agentic-ai-tools-2026-09-25/"},{"label":"Reuters: Microsoft shares and Friday market reaction","url":"https://www.reuters.com/business/wall-st-futures-gain-ai-enthusiasm-eases-worries-over-higher-oil-prices-yields-2026-09-25/"}]},{"id":"business-apple-taction-patent-verdict","headline":"Jury says Apple owes Taction more than $5.7 billion over haptic patents; Apple says it will appeal","summary":"A U.S. jury found Apple’s Taptic Engine infringed two Taction patents related to vibration feedback in iPhones and Apple Watches. Apple denies using Taction’s technology and said it will appeal; the verdict remains subject to that challenge.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: verdict and Apple’s response (Sept. 26)","url":"https://www.reuters.com/legal/litigation/us-jury-says-apple-owes-record-57-billion-haptic-technology-patent-case-2026-09-26/"}]},{"id":"business-nubank-monzo-talks","headline":"Report: Nubank in early talks on a possible Monzo combination at an £8–10 billion valuation","summary":"Reuters says Sky News reported that Nubank and Monzo are in early-stage talks about a potential combination; Monzo’s board is also considering a new funding round. The companies declined to comment, and no agreement has been announced. The valuation is Sky’s reported range, not a confirmed offer or deal value.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: reported Nubank–Monzo discussions (Sept. 26)","url":"https://www.reuters.com/business/finance/monzo-talks-sale-nubank-about-10-billion-valuation-sky-news-reports-2026-09-26/"}]},{"id":"business-gold-fields-northern-star","headline":"Gold Fields reportedly explored a Northern Star takeover, but the Australian miner rebuffed its approach","summary":"Bloomberg, as reported by Reuters, says Gold Fields approached Northern Star about a transaction and was rebuffed; Gold Fields is considering next steps. Neither company immediately commented to Reuters. No agreement or transaction terms have been announced.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: reported approach and response (Sept. 26)","url":"https://www.reuters.com/world/africa/gold-fields-expresses-interest-buying-northern-star-bloomberg-reports-2026-09-26/"}]},{"id":"business-fed-bank-threshold-plan","headline":"Fed weighs raising bank oversight thresholds, a plan that could spur regional-bank growth and deals","summary":"Reuters, citing four people familiar with the discussions, reports the Fed is working on a proposal to reindex asset thresholds for stricter supervision; the highest threshold could move from $700 billion toward $960 billion. A proposal may come later this year, but no change is final. Supporters say a higher cutoff could reduce regulatory costs; critics warn consolidation may hurt competition and increase systemic risk.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Fed threshold discussions and implications (Sept. 25)","url":"https://www.reuters.com/legal/transactional/us-fed-plans-raise-bank-oversight-thresholds-sources-say-2026-09-25/"}]}],"entertainment":[{"id":"entertainment-taylor-swift-encore","headline":"Taylor Swift releases “The Life of a Showgirl: The Encore” and announces the “Patient Zero” video","summary":"Swift’s expanded release arrived Friday with additional songs; the “Patient Zero” music video is scheduled to premiere during Sunday’s VMAs. The album is out, while the video remains a future event.","sources":["Other"],"signal":"Consensus","links":[{"label":"AP: Swift release","url":"https://apnews.com/article/taylor-swift-new-music-patient-zero-934935f049893d0567713bea516f2c0c"},{"label":"Variety: album and video","url":"https://variety.com/2026/music/news/taylor-swift-reveals-life-of-showgirl-encore-new-songs-1236872982/"},{"label":"Variety: video details","url":"https://variety.com/2026/music/news/taylor-swift-patient-zero-music-video-dakota-johnson-colin-farrell-1236874206/"}]},{"id":"entertainment-different-world-netflix","headline":"Netflix’s “A Different World” sequel premieres with the original HBCU setting in focus","summary":"The sequel to the 1980s campus sitcom is available on Netflix Friday, bringing a new generation to the fictional Hillman College setting. The premiere is confirmed; audience response is not yet known.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"CNN: sequel premiere","url":"https://www.cnn.com/2026/09/24/entertainment/a-different-world-reboot-netflix"},{"label":"AP: sequel","url":"https://apnews.com/article/a-different-world-sequel-f0f23537d211e084dfb53999c3a4a367"}]},{"id":"entertainment-paramount-wbd-settlement-challenge","headline":"Merger opponents ask a court to reject Paramount’s settlement tied to its Warner Bros. bid","summary":"Variety reports opponents urged a court to reject a settlement connected to Paramount’s proposed Warner Bros. bid. The filing is an argument for the judge to consider; it is not a ruling on the merger or a completed acquisition.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety: court challenge","url":"https://variety.com/2026/tv/global/block-the-merger-amicus-brief-reject-settlement-1236875410/"},{"label":"Variety: settlement terms","url":"https://variety.com/2026/film/news/paramount-states-settlement-terms-warner-bros-1236871264/"}]},{"id":"entertainment-macklemore-charity-tour","headline":"Macklemore announces a tour supporting Palestinian aid organizations","summary":"Macklemore says proceeds from his planned “Free Palestine” shows will support aid organizations. The tour announcement is confirmed; the performances and any eventual distributions have not yet occurred.","sources":["Other"],"signal":"Watch","links":[{"label":"AP: tour announcement","url":"https://apnews.com/article/macklemore-free-palestine-shows-ed-sheeran-65a65a362e530dfe739ddb626dc16d23"},{"label":"Variety: tour details","url":"https://variety.com/2026/music/news/macklemore-free-palestine-tour-1236874352/"}]},{"id":"entertainment-farm-aid-2026","headline":"Farm Aid 2026 brings Willie Nelson, Neil Young and other musicians to Virginia Beach today","summary":"The annual benefit is scheduled for Saturday, Sept. 26, at Veterans United Home Loans Amphitheater in Virginia Beach, with Willie Nelson, Neil Young, John Mellencamp, Dave Matthews and others on the lineup. At the 4 p.m. EDT edition check, CNN’s live special was still scheduled for 7–11 p.m. ET and the show had not yet begun.","sources":["Other"],"signal":"Watch","links":[{"label":"Farm Aid: official 2026 lineup","url":"https://www.farmaid.org/festival/lineup/"},{"label":"CNN: Farm Aid live special schedule","url":"https://www.cnn.com/2026/09/26/entertainment/farm-aid-2026-live"}]},{"id":"entertainment-ed-sheeran-gillette-canceled","headline":"Ed Sheeran cancels Friday and Saturday Gillette Stadium shows as nor’easter approaches","summary":"Gillette Stadium and the promoter announced that Sheeran’s two Foxborough concerts scheduled for Sept. 25–26 were canceled because of the impending nor’easter. The venue says refunds are available through the point of purchase; no replacement dates were announced in the cited notice.","sources":["Other"],"signal":"Consensus","links":[{"label":"Gillette Stadium official cancellation notice","url":"https://www.gillettestadium.com/events/ed-sheeran-loop-tour/"},{"label":"NBC Boston/AP: cancellation report","url":"https://www.nbcboston.com/news/local/ed-sheeran-gillette-stadium-loop-tour/4020701/"}]},{"id":"entertainment-vmas-sunday-guide","headline":"2026 MTV Video Music Awards are set for Sunday as Taylor Swift prepares to become the show’s most-awarded artist","summary":"The Associated Press’s event guide says the Sept. 27 show will give Swift the inaugural Artist Director Honors, which would break her tie with Beyoncé for most-awarded artist in VMA history. This is a preview and expected milestone, not a completed ceremony or award result.","sources":["Other"],"signal":"Watch","links":[{"label":"AP: 2026 MTV VMAs guide","url":"https://apnews.com/article/mtv-video-music-awards-2026-guide-711f84857a0d65730696adf0ebdfa9a8"},{"label":"MTV: VMA show information","url":"https://www.mtv.com/vma"}]}]},"researchNotes":["Fresh public-web research was conducted for the Saturday, September 26, 2026, 1:00 p.m. EDT Boston edition. Fox News and CNN current front pages, a current Drudge Report front page, and direct Fox/CNN/Reuters articles were inspected. Drudge is an aggregator, not independent reporting.","Summit comparison: Fox’s current lead calls the $30 billion U.S.–China tariff arrangement a breakthrough and its article attributes the announcement to the White House; Reuters describes China’s eight-point account and said the U.S. Embassy had not immediately responded to its request. Fox says final tariff rates and the complete product list remain unpublished. CNN’s current front-page mix leads with nor’easter impacts and spotlights China’s AI pitch; Drudge’s front page emphasizes GOP midterm/economic concerns and storms, and labels the summit “long on pomp, short on progress.” These are differences in reporting and framing, not evidence that every claimed term has been implemented.","Iran: Reuters and CNN directly report Trump’s Saturday public rejection of Iran’s seven-day proposal. The plan’s terms are attributed to Tehran; there is no deal or ceasefire. Possible post-midterm strikes are separately attributed to unnamed officials in a Wall Street Journal report, not an announced U.S. military decision.","Weather: NHC Advisory #24 for Nolo was issued at 5 a.m. HST / 11 a.m. EDT and reports 105-mph winds and forecasts 10–20 inches of storm-total rain on parts of the Big Island, locally up to 25 inches. NHC Advisory #24 for Polo (8 a.m. MST / 11 a.m. EDT) reports 155-mph winds, Category 4, and forecasts an approach to Baja California Sur Monday. CNN’s 12:58 p.m. EDT nor’easter update and AP report flooded New Jersey streets/homes; the high-tide comparison and outages are attributed to CNN. Forecasts are not observed outcomes.","World updates: Reuters reports Bangkok’s disaster-zone declaration after nearly 300 mm (12 inches) of rain in 48 hours. Reuters also reports six deaths from the Athens building collapse, attributing the count to the Greek fire brigade; the cause remains under investigation despite the mayor’s gas-infrastructure assessment.","Boston score check: MLB reports Boston swept the Cubs Friday, winning 4–3 and 2–0; ESPN has game recaps/box scores for both. ESPN and Boston Hockey Now confirm Washington’s 3–2 overtime preseason win over the Bruins Friday. The Patriots and Celtics did not play Friday. No previous-night scores are invented. The accessible NCAA listing confirmed BC–Virginia Tech’s noon fixture but did not provide a verified in-game score/final at the 1 p.m. check, so none is shown.","A live ESPN scoreboard check at the 1 p.m. edition check showed Texas leading Tennessee 10–3 with 13:20 left in the second quarter; that is a time-sensitive live score, not a final. General Sports contains no Boston teams, auto racing or international soccer.","Validated exact tab counts and exclusive membership: Top News 10, USA 10, World 10, Politics 7, Sports 9, Boston Sports 5 and Entertainment 7 (58 stories total). Every story has at least one labeled HTTP(S) source link; story IDs and normalized headlines are unique.","Business refresh and market close verification (Saturday, September 26, 2026): the latest completed U.S. cash session was Friday, September 25; Reuters reports the Dow closed at 51,828.62 (+0.93%) and Nasdaq Composite at 27,068.72 (+0.48%), while AP reports exact gains of 478.64 Dow points and 129.34 Nasdaq points. U.S. cash markets are closed Saturday; the edition does not imply current trading. Reuters was read directly for Friday market context, Microsoft Copilot, Akamai–Anthropic, Apple–Taction, Nubank–Monzo (attributing the talks to Sky News), Gold Fields–Northern Star (attributing the approach to Bloomberg), and proposed Fed supervision thresholds. Business has seven unique stories and no reuse of the existing 58 cards."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['world','World'],['boston','Boston Sports'],['sports','Sports'],['politics','Politics'],['business','Business'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, or international soccer.',boston:'Boston-area professional and major-college sports only.',business:'7 unique business/markets stories; close figures refer to the latest completed U.S. session.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
