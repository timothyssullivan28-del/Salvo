ry":"CNN’s Nov. 6, 7:02 a.m. EST snapshot projects 253 Democratic House seats and Democratic congressional control. Alaska and Mississippi Senate contests remain unresolved; the Guardian independently reports the widening House majority and both outstanding races. These are attributed media calls, not certified results; no final seat count or winner in either unresolved race is inferred. Candidate confidence and forecast ratings are not calls.","sources":["Fox","CNN","Drudge","Other"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/11/06/politics/live-news/midterm-election-congress","label":"CNN — Nov. 6, updated 7:02 a.m. EST; projection snapshot"},{"url":"https://www.theguardian.com/us-news/live/2026/nov/06/us-midterm-elections-2026-democrats-blue-wave-congress-latest-news-updates","label":"Guardian — Nov. 6 morning live reporting; unresolved races"},{"url":"https://www.foxnews.com/","label":"Fox News — Nov. 6 morning homepage checked"},{"url":"https://www.drudgereport.com/","label":"Drudge — Nov. 6 aggregator framing, not independent confirmation"}]},{"id":"story-n5e-14","headline":"Storm reaches East Coast after catastrophic Georgia–Tennessee flooding","summary":"CNN’s Friday update says the storm is moving along the East Coast after more than 100 rescues around McCaysville and Copperhill. Southern New England faces a forecast flooding-rain risk, not an already observed repeat of Thursday’s catastrophe. AP independently confirms record flooding and rescue operations along the border; no unreported death toll is inferred.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/11/05/weather/flooding-georgia-tennessee-mccaysville-copperhill-climate","label":"CNN — Nov. 6 morning update to Nov. 5 storm report"},{"url":"https://apnews.com/article/mccaysville-fannin-flooding-rescue-evacuations-6e0a283ff54238cba9677602f5e0878e","label":"AP — Nov. 5, updated 5:34 p.m. EST"}]},{"id":"top-lakewood-n6m","headline":"Police: Lakewood bus firefight kills officer and wounds three others","summary":"Lakewood police say an officer was killed and three others wounded after officers confronted a man aboard a transit bus Thursday evening. The suspect was fatally shot and a bystander injured. AP’s Nov. 6, 6:57 a.m. EST report and the Colorado Sun independently corroborate the officer casualties; the investigation and identities remain developing.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/colorado-lakewood-officers-shot-bus-02eedc7038b4fbda3fa25d90453d36b1","label":"AP — 6:57 AM EST, November 6, 2026"},{"url":"https://coloradosun.com/2026/11/05/lakewood-shooting-police-officers-killed-wounded/","label":"Colorado Sun — Nov. 5 overnight reporting; independently corroborates casualties"}]},{"id":"story-n5e-2","headline":"Newsom seeks to commute 548 death sentences; hundreds require court approval","summary":"California’s governor announced moves to replace all 548 death sentences with life without parole. His office says 382 commutations require state Supreme Court approval because of prior felony convictions. The announcement is not the completion of every commutation; California’s execution moratorium already dates to 2019.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/california-death-row-newsom-commute-sentences-dd8a949162b3325edfaa381952ff2466","label":"AP — Nov. 5, updated 7:47 p.m. EST"}]},{"id":"top-loans-n6m","headline":"New federal student-loan caps push borrowers toward private lenders","summary":"AP’s Friday examination finds new federal borrowing caps steering students and parents toward private lenders. The limits took effect this fall and vary by program; the report follows borrowers confronting gaps between federal aid and tuition. Private borrowing can change repayment protections and costs, but individual examples are not a nationwide default forecast.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/student-loan-caps-91ddf9904c1d1ffffacddcc6ffcce141","label":"AP — 3:06 AM EST, November 6, 2026"}]},{"id":"usa-appeal-n5m","headline":"Judges hear Trump’s hush-money appeal without signaling a decision","summary":"New York appellate judges questioned both sides about presidential immunity, evidence and election-law theories behind Trump’s 34-count conviction. AP’s Thursday report says the court did not indicate how or when it would rule. Trump denies wrongdoing; argument is not an overturned conviction.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/trump-stormy-daniels-hush-money-conviction-appeal-30bb62111c06fc4d4f2e1b2e3b9a9191","label":"AP — 5:50 PM EST, November 5, 2026"}]},{"id":"top-ai-fraud-n6m","headline":"Prosecutors charge three in alleged $129 million AI impersonation scheme","summary":"Federal prosecutors say three defendants used AI to impersonate executives and attorneys while targeting thousands of companies. The New York indictment alleges about $129 million was stolen, including from hospital systems and financial firms. Wire-fraud and identity-theft charges are allegations, not convictions; the amount is attributed to prosecutors.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/artificial-intelligence-impersonation-theft-fraud-c348a0c96e941214e56f8d923d03fc4b","label":"AP — 10:22 PM EST, November 5, 2026"}]},{"id":"story-n5e-6","headline":"Wisconsin reports infant’s measles death, first in state since 1990","summary":"State health officials say an infant died of measles in southwestern Wisconsin; identifying details were withheld. Wisconsin reports 431 cases, all but three in unvaccinated people. National federal and state death counts differ, so no reconciled national total is asserted.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/wisconsin-child-measles-death-outbreak-538f7a1a07c83d073590541d5062cfb5","label":"AP — 2:48 PM EST, November 5, 2026"}]},{"id":"top-brooklyn-n5m","headline":"Brooklyn fire kills six; AP details earlier building complaints as cause inquiry continues","summary":"FDNY reports six deaths and nine injuries after Thursday’s Sunset Park row-house fire. AP’s late update details prior complaints alleging illegal apartment divisions and unsuccessful inspection attempts; those complaints do not establish the fire’s cause. Marshals continue investigating, and the lithium-ion battery found at the scene has not been established as the ignition source.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/fatal-fire-brooklyn-new-york-bb3c0c9753d0e64ec994cc892f32170e","label":"AP — Nov. 5, updated 9:49 p.m. EST"}]},{"id":"story-n5e-7","headline":"Sheriff: Tampa campus gunman targeted Citibank over debt collection","summary":"Hillsborough County’s sheriff says Jacob Pearson threatened a bank-affiliated lawyer over a $2,500 debt before killing a woman at Citibank’s Tampa campus Wednesday. A security guard killed the gunman. Thursday’s identified motive is attributed to the sheriff, replacing the earlier unresolved-motive account.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/florida-citibank-shooting-gunman-victim-4a9dc81997caecc178a8ff486ee0c572","label":"AP — 6:58 PM EST, November 5, 2026"}]}],"usa":[{"id":"usa-birchmore-n6m","headline":"Closing arguments expected Friday in Sandra Birchmore murder trial","summary":"AP reports closing arguments are expected Friday in the federal trial of former Stoughton officer Matthew Farwell. Prosecutors allege he killed Sandra Birchmore and staged her death as suicide; defense lawyers deny that he killed her and dispute the alleged timing of their sexual relationship. Arguments are not a verdict, and no finding of guilt is inferred.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/police-officer-massachusetts-killing-sandra-birchmore-closings-4e291004241a78aaa0ec2c0d5c6caaa7","label":"AP — 12:04 AM EST, November 6, 2026"}]},{"id":"story-n5e-10","headline":"Florida, Alabama and Indiana complete executions Thursday","summary":"AP’s Nov. 5, 9:32 p.m. EST update confirms all three states carried out executions, replacing the earlier pending Alabama status. Florida’s Jesse Guardado was pronounced dead at 6:13 p.m., tying the state’s annual record at 19. Alabama’s completed execution is no longer described as merely scheduled; the separate California commutation announcement appears in Top News.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/indiana-alabama-florida-executions-f38f70d09b512c4d7245fd5e75ee91df","label":"AP — Nov. 5, updated 9:32 p.m. EST; all three completed"}]},{"id":"story-n5e-8","headline":"Hegseth authorizes expanded Guard vehicle and boat patrols in Washington","summary":"AP obtained Oct. 29 memos allowing National Guard use of 60 military police cars, tactical vehicles, boats and light towers in the capital. Some operations may include rifles, but not Metro stations. The Thursday report describes an expanded mission, not a new emergency declaration.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/national-guard-patrols-dc-hegseth-pentagon-e6f2fc06768103f59536b785756f8858","label":"AP — 4:23 PM EST, November 5, 2026"}]},{"id":"story-n5e-11","headline":"Google, Meta and TikTok challenge California’s child-feed restrictions","summary":"The companies filed separate federal lawsuits challenging a law set to restrict addictive feeds and related features for children under 16 starting Jan. 1, 2027. They argue First Amendment and federal-law violations. The filings do not themselves block the law or resolve the constitutional questions.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/google-meta-tiktok-lawsuit-california-kids-589c0eabeabced2e07b8f9138ee2df79","label":"AP — 4:38 PM EST, November 5, 2026"}]},{"id":"story-n5e-12","headline":"U.S. charges former Ecuador president’s son and four others in cocaine case","summary":"New York federal prosecutors accuse five Ecuadorians of trafficking cocaine to the U.S. and Europe, including shipments concealed in tuna containers. Prosecutors say two defendants were arrested this month. Charges remain allegations; the report did not list defense attorneys for the accused.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/drugs-ecuador-charges-president-1e75ee707900d01fc75ddd3ca4855d35","label":"AP — 3:58 PM EST, November 5, 2026"}]},{"id":"story-n5e-15","headline":"Lawyers challenge ICE detention of UC Berkeley asylum-seeking student","summary":"AP/Berkeleyside’s Nov. 5 report says Paula Valentina Albornoz Hernandez was arrested at San Francisco airport the prior Friday and remains detained. Her lawyers filed a habeas petition and say her asylum application is pending. That challenge is not a release order or a ruling on asylum eligibility.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/ice-berkeley-student-arrest-san-francisco-airport-99eb004e8334d51ea9ff9c042534b035","label":"AP — 4:26 PM EST, November 5, 2026"}]},{"id":"usa-wristbands-n6m","headline":"Judge affirms New Hampshire fathers’ right to silent pink-wristband protest","summary":"A federal judge’s Thursday dismissal order recognizes two fathers’ First Amendment right to silently wear pink wristbands at school games. AP reports a settlement ending litigation over their removal from a 2024 soccer match involving a transgender athlete. This is a speech-rights settlement, not a new ruling on athlete eligibility.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/new-hampshire-transgender-pink-wristbands-soccer-bow-8f2af55b0cffe0ddb484d06503099936","label":"AP — 2:47 PM EST, November 5, 2026"}]},{"id":"story-n5e-16","headline":"Harmeet Dhillon resigns as Justice Department civil-rights chief","summary":"Dhillon announced her departure Thursday after reshaping the Civil Rights Division. She told Fox News Digital the decision predated the midterms and she was not asked to resign. AP independently reports the departure; timing alone does not establish that the election forced her exit.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/justice-department-civil-rights-division-harmeet-dhillon-db3ad709a2ff5a48c5d3a9e3f71963d6","label":"AP — 5:26 PM EST, November 5, 2026"}]},{"id":"story-n5e-13","headline":"Salon announces shutdown after 31 years of online journalism","summary":"The digital magazine announced Thursday it would close, citing changed business conditions for independent journalism. Its farewell did not immediately explain the fate of all employees, although some reported job losses. The announcement is a closure decision, not a verified full layoff count.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/salon-media-online-news-shutdown-387aebeaf5d2ff80450bfba780ac9d6c","label":"AP — Nov. 5, updated 7:09 p.m. EST"}]},{"id":"usa-tree-n6m","headline":"Rockefeller Center’s 76-foot spruce begins journey to New York City","summary":"The Norway spruce was cut Thursday in West Edmeston and loaded onto a truck for its trip to Manhattan. AP reports arrival is expected Saturday, Nov. 7; installation and the later lighting are not described as already completed. The seasonal story’s actual source date remains Nov. 5.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/christmas-tree-rockefeller-new-york-holidays-5a60ab18ce4ae645df74fc03e44d2348","label":"AP — 4:08 PM EST, November 5, 2026"}]}],"boston":[{"id":"story-n5e-17","headline":"Boston scoreboard: Bruins 6–2 final; Celtics at Charlotte tonight, 7 p.m. EST","summary":"FINAL Thursday, Nov. 5: Bruins 6, Penguins 2 — independently confirmed by NHL and ESPN/AP. UPCOMING Friday: Celtics at Charlotte, Nov. 6, 7 p.m. EST. OFF Friday: Bruins, Patriots and Red Sox; Red Sox season is complete. FINAL Wednesday: Celtics 109, Bucks 102. Next: Florida at Bruins Sunday, Nov. 8, 1 p.m. EST; Packers at Patriots Sunday, Nov. 8, 4:25 p.m. EST. Pritchard remains questionable with an eye abrasion in the latest checked report; no Friday game clearance is inferred.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.nhl.com/gamecenter/bos-vs-pit/2026/11/05/2026020257","label":"NHL official — Nov. 5 final recap, checked Nov. 6"},{"url":"https://www.espn.com/nhl/game/_/gameId/401892654/bruins-penguins","label":"ESPN/AP — Nov. 5 final, checked Nov. 6"},{"url":"https://www.espn.com/nba/game/_/gameId/401909288","label":"ESPN — Nov. 6 Celtics–Hornets pregame, 7 p.m. EST"},{"url":"https://www.espn.com/nhl/team/schedule/_/name/bos","label":"ESPN — Bruins schedule checked Nov. 6"},{"url":"https://www.patriots.com/schedule/","label":"Patriots official — Sunday 4:25 p.m. EST, checked Nov. 6"},{"url":"https://www.audacy.com/weei/sports/bruins/5-takeaways-as-bruins-crush-penguins-for-third-straight-win","label":"WEEI/Audacy — checked Nov. 6; limited fresh full text"}]},{"id":"boston-depth-n6m","headline":"Zacha’s two goals lead another five-scorer Bruins attack","summary":"The Globe’s Nov. 6 analysis highlights five different scorers in Thursday’s 6–2 win, the seventh such game in Boston’s first 17. Zacha scored twice; Geekie scored for a third straight game and DiPietro made 16 saves. The official NHL recap independently confirms the result and production; the story is about offensive depth, not a second separate game.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.bostonglobe.com/2026/11/06/sports/bruins-penguins-wrap/","label":"Boston Globe — Nov. 6, 2026"},{"url":"https://www.nhl.com/gamecenter/bos-vs-pit/2026/11/05/2026020257","label":"NHL official — Nov. 5 final recap; independent corroboration"}]},{"id":"story-n5e-18","headline":"Pritchard <script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, international soccer, or WNBA coverage.',business:'7 unique business/markets stories refreshed only at 7 p.m. Eastern Monday through Friday, with independently confirmed figures for the latest completed U.S. cash session. Preserved unchanged at all other editions.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
