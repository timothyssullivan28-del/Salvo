The trials are experiments and are not a permanent rule change.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — NBA preseason technology experiments","url":"https://apnews.com/article/nba-preseason-tech-experiments-d6fa30f7f8db2abeb2e092c884c3aad2"}]},{"id":"sports-nfl-officials-suspended-oct6","headline":"NFL suspends two officials after weekend outbursts and disputed calls","summary":"The NFL suspended two officials following a weekend marked by public outbursts and controversial decisions, AP reports. The league discipline applies to those officials; it does not reverse game results.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — NFL official suspensions, Oct. 6","url":"https://apnews.com/article/officials-suspended-seeman-mcbride-hill-wilson-59e1487cebaf44635e6939a1d19e6c2b"}]}],"politics":[{"id":"politics-dnc-taxpayer-ads-lawsuit-oct7","headline":"DNC sues to stop taxpayer-funded Trump ads, alleging unlawful campaign spending","summary":"The Democratic National Committee filed a federal lawsuit Wednesday seeking to stop taxpayer-funded election-related TV ads, Reuters reports. The suit alleges a statutory violation; the White House says the ads will end and be funded by Trump’s political committee, while the DNC says they continued airing. The case is unresolved.","sources":["Other"],"signal":"Split","links":[{"label":"Reuters — DNC lawsuit and administration response, Oct. 7","url":"https://www.reuters.com/legal/government/democrats-sue-trump-halt-taxpayer-funded-tv-ads-that-praised-him-2026-10-07/"},{"label":"Fox News — DNC alleges $20 million ad diversion, Oct. 7","url":"https://www.foxnews.com/politics/dnc-lawsuit-accuses-trump-admin-diverting-20m-federal-funds-propaganda-ads"}]},{"id":"politics-gop-candidates-distance-trump-oct7","headline":"Reuters: Republicans in tight midterm races distance themselves from Trump","summary":"A Reuters review finds most Republicans in competitive midterm races are distancing themselves from President Trump, a sign of campaign pressure ahead of November. The report describes candidate strategy; it is not a prediction of election results.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — candidates distance themselves, Oct. 7","url":"https://www.reuters.com/world/us/most-republicans-tight-midterm-distance-trump-reuters-review-finds-2026-10-07/"}]},{"id":"politics-democrats-trans-strategy-oct8","headline":"Democrats in tight Midwest races split on how to address transgender issues","summary":"Reuters’ Oct. 8 review of campaign messages and interviews with nine strategists found Democratic candidates taking sharply different approaches to transgender issues in competitive midterm races. The story describes campaign strategy, not a uniform party position or settled policy.","sources":["Other"],"signal":"Split","links":[{"label":"Reuters — Democratic campaign strategy review, Oct. 8","url":"https://www.reuters.com/legal/government/democrats-tight-midwest-us-races-split-trans-rights-strategy-2026-10-08/"}]},{"id":"politics-white-house-press-ban-lawsuit-oct8","headline":"CNN, MS NOW and Politico ask judge to block White House press-access ban","summary":"The three news organizations are urging a federal judge to block the White House’s press restrictions long term, Reuters reported Oct. 8. The challenge remains pending; no court order has resolved the dispute.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — media organizations’ court filing, Oct. 8","url":"https://www.reuters.com/legal/government/cnn-ms-now-politico-urge-judge-block-white-house-ban-long-term-2026-10-08/"}]},{"id":"politics-abortion-drug-public-nuisance-oct8","headline":"Three states test “public nuisance” theory to restrict abortion medication","summary":"Reuters reported Oct. 8 that Republican-led states are using a novel public-nuisance legal theory in litigation aimed at curbing access to abortion drugs. The legal claims are contested and no final ruling has established the theory.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — state abortion-drug lawsuits, Oct. 8","url":"https://www.reuters.com/legal/government/us-states-label-abortion-drugs-public-nuisance-bid-curb-access-2026-10-08/"}]},{"id":"politics-trump-camp-david-oct7","headline":"Trump wants to turn his West Palm Beach golf course into a new Camp David","summary":"The Washington Post reported Oct. 7 that President Trump wants to adapt his West Palm Beach golf property as a presidential retreat akin to Camp David. It is a reported proposal, not an approved construction project or completed official residence.","links":[{"label":"Washington Post — proposed retreat at Trump golf club, Oct. 7","url":"https://www.washingtonpost.com/politics/2026/10/07/trump-wants-new-camp-david-his-own-golf-club/"}],"sources":["Other"],"signal":"Watch"},{"id":"politics-fcc-ai-political-robocalls-oct7","headline":"FCC weighs loosening political robocall rules ahead of midterms","summary":"Reuters reports a Democratic FCC member is considering a petition that would loosen rules on political robocalls, including AI-generated calls. It is a proposal under consideration, not a rule change; the debate concerns campaign messaging and safeguards against deceptive synthetic voices.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — FCC petition on political robocalls, Oct. 7","url":"https://www.reuters.com/world/us-agency-considers-allowing-new-ai-political-robocalls-before-election-2026-10-07/"},{"label":"AP — FCC robocall proposal, Oct. 7","url":"https://apnews.com/b97fb6e8d06704dc043556dba25de548"}]}],"entertainment":[{"id":"entertainment-paramount-wbd-merger-oct6","headline":"Paramount Skydance completes $110 billion Warner Bros. Discovery takeover","summary":"Paramount Skydance completed its reported $110 billion Warner Bros. Discovery takeover on Oct. 6, combining two major Hollywood studios, libraries and streaming portfolios. The integration is beginning; projected synergies and the future structure of the services remain uncertain.","links":[{"label":"Reuters — Paramount closes Warner Bros. Discovery merger, Oct. 6","url":"https://www.reuters.com/business/media-telecom/paramount-wraps-up-mega-warner-bros-merger-create-hollywood-powerhouse-skydance-2026-10-06/"}],"sources":["Other"],"signal":"Watch"},{"id":"entertainment-emmys-primevideo-oct6","headline":"Emmys will leave broadcast TV for Prime Video under six-year deal","summary":"The Television Academy announced Oct. 7 that the Emmy Awards will move to Prime Video in 2027 under a six-year agreement. The change ends a long broadcast-TV run; the deal does not mean the current year’s awards moved platforms.","links":[{"label":"Variety — six-year Prime Video deal, Oct. 6","url":"https://variety.com/2026/tv/news/emmys-prime-video-six-year-deal-15-million-a-year-1236899957/"},{"label":"Wall Street Journal — deal announcement, Oct. 6","url":"https://www.wsj.com/business/media/emmy-awards-will-leave-broadcast-tv-for-amazons-prime-video-0c92fad5"}],"sources":["Other"],"signal":"Consensus"},{"id":"entertainment-social-reckoning-review-oct7","headline":"Variety: “The Social Reckoning” arrives as a chilly, procedural Zuckerberg follow-up","summary":"Variety’s Oct. 7 review calls “The Social Reckoning” a chilly, procedural follow-up focused on Mark Zuckerberg and social-media scrutiny. That is a critic’s assessment of the film, not a consensus audience reaction.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — “The Social Reckoning” review, Oct. 7","url":"https://variety.com/2026/film/reviews/the-social-reckoning-review-1236904146/"}]},{"id":"entertainment-mia-goth-divorce-oct7","headline":"Mia Goth files for divorce from Shia LaBeouf, entertainment outlets report","summary":"TMZ reported Oct. 7 that Mia Goth filed for divorce from Shia LaBeouf after nearly ten years of marriage. The filing begins a legal proceeding; no final divorce judgment was reported.","sources":["Other"],"signal":"Watch","links":[{"label":"TMZ — report citing divorce filing, Oct. 7","url":"https://www.tmz.com/2026/10/07/mia-goth-and-shia-labeouf-divorce/"}]},{"id":"entertainment-misty-green-review-oct8","headline":"Chris Rock’s “Misty Green” turns a sharp eye on Los Angeles","summary":"An AP review published Thursday describes Chris Rock’s new film as a pointed critique of Los Angeles, with Rosalind Eleazar starring as Misty, a former Emmy-winning writer. The story is an arts review and its judgments are attributed to the critic.","sources":["Other"],"signal":"Watch","links":[{"label":"AP Entertainment — “Misty Green,” Oct. 8","url":"https://www.gazettextra.com/entertainment/ap-entertainment-summarybrief-at-12-37-a-m-edt/article_5a3b2164-ef98-5571-b592-bdaf553191f6.html"}]},{"id":"entertainment-digger-boxoffice-oct6","headline":"“Digger” opens below expectations as “Verity” leads weekend box office","summary":"Weekend estimates put “Verity” first with a $32.6 million opening, while Tom Cruise’s “Digger” fell short of expectations and could produce a large studio loss, according to trade coverage. The loss estimate is a projection, not a final audited result.","sources":["Other"],"signal":"Watch","links":[{"label":"Deadline — weekend box office estimates, Oct. 5","url":"https://deadline.com/2026/10/box-office-verity-digger-tom-cruise-weekend-estimates-1237146502/"},{"label":"The Guardian — projected Digger loss, Oct. 5","url":"https://www.theguardian.com/film/2026/oct/05/digger-may-lose-150m-after-tom-cruise-film-bombs-at-the-box-office"}]},{"id":"entertainment-eva-marie-saint-death-oct6","headline":"Eva Marie Saint, Oscar-winning “On the Waterfront” actor, dies at 102","summary":"NPR reported Oct. 6 that Eva Marie Saint, whose film career spanned more than seven decades, died at 102. The Oscar-winning performer was one of the last surviving stars of Hollywood’s classic era.","sources":["Other"],"signal":"Consensus","links":[{"label":"NPR — obituary coverage checked Oct. 8","url":"https://www.npr.org/2026/10/06/462030457/eva-marie-saint-on-the-waterfront-dead-102"}]}]},"researchNotes":["Edition built Thursday, October 8, 2026 at the timestamp in lastUpdated, Boston EDT; web research performed from the 7:00 a.m. EDT run window.","Compared current Fox News, CNN and Drudge Report homepage framing. Drudge Report links to other outlets and is treated as an aggregator, not an independent reporting source.","Premarket: Reuters reports Dow E-minis −399 points (−0.78%) and Nasdaq-100 E-minis −180.25 points (−0.57%) as of 6:14 a.m. ET. Reuters article did not publish contract levels; no levels are inferred. Wednesday cash close is stated separately from futures.","Boston schedules checked on NHL, NBA, MLB and Patriots sources. Bruins and Celtics Thursday games were UPCOMING at 7 p.m. EDT when edition was built. Boston Globe returned a section/schedule shell, with individual article access partly paywalled; WEEI/Audacy exposed schedules and empty current team-story shells, not usable fresh article text.","General Sports contains only non-Boston U.S. sports and does not include restricted coverage. MLB schedule/results checked against official postseason sources."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, or international soccer.',business:'7 unique business/markets stories; on trading days at 7 a.m. show timestamped indicative Dow and Nasdaq-100 futures, clearly not cash indexes; on weekends and market holidays state cash markets are closed and show no live/premarket snapshot, while identifying the latest completed session. At 10 a.m. and 1 p.m. on trading days show timestamped Dow and Nasdaq Composite cash-index levels, point and percentage moves, and any provider delay; at 4 p.m. show timestamped closing moves as confirmed or clearly preliminary; at 7 p.m. use confirmed closes.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
