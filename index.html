ividual details were not released. This is an attributed, dated humanitarian announcement, not an independently audited total or a wider peace agreement.","sources":["Other"],"signal":"Watch","links":[{"label":"apnews.com — Nov. 25, 2026, updated 6:55 a.m. EST; U.S.-led humanitarian effort; checked Friday morning","url":"https://apnews.com/article/melania-trump-ukraine-russia-children-4fa1ae5512f4fb71dc36478b0f44514e"}]}],"boston":[{"id":"story-n27m-17","headline":"Friday Boston: Toronto at Bruins 1 p.m.; Hawks at Celtics 8 p.m.","summary":"Both games are UPCOMING Friday in EST: Toronto at Bruins, 1 p.m.; Atlanta at Celtics, 8 p.m. Neither has started this morning. Prior results: Winnipeg beat Bruins 4–2 FINAL Wednesday; Celtics beat Washington 131–116 FINAL Tuesday. Patriots OFF Friday, at Chargers Sunday 4:05 p.m. EST; Red Sox in offseason with no Friday game.","sources":["Other"],"signal":"Watch","links":[{"label":"espn.com — Nov. 27 morning; verified schedules and completed results; checked Friday morning","url":"https://www.espn.com/nhl/team/schedule/_/name/bos"},{"label":"Bruins — Nov. 25; official 4–2 final and Friday 1 p.m. fixture","url":"https://www.nhl.com/bruins/news/bruins-fall-4-2-to-the-jets-move-forward-and-take-the-positives"},{"label":"ESPN — Friday 8 p.m. fixture and Tuesday 131–116 result","url":"https://www.espn.com/nba/team/schedule/_/name/bos"},{"label":"NBA — official Friday 8 p.m. schedule; erroneous future result labels ignored","url":"https://www.nba.com/celtics/schedule"},{"label":"Patriots — official Sunday 4:05 p.m. EST schedule","url":"https://www.patriots.com/schedule/"},{"label":"MLB — offseason roster record checked Nov. 27","url":"https://www.mlb.com/redsox/roster/transactions"}]},{"id":"story-n27m-18","headline":"White’s shooting confidence remains a live Celtics concern","summary":"Globe’s Thursday notebook reports White made five of 31 threes over his last four games and quotes his explanation of a hesitant late possession Sunda
