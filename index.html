<script id="briefing" type="application/json">{"date":"2026-10-31","lastUpdated":"October 31, 2026, 7:05:19 a.m. EDT Boston","dek":"Saturday morning limited refresh: Top News, USA, Boston Sports and Sports researched and re-ranked; Business, World, Politics and Entertainment preserve Friday evening’s verified cards, links, original dates and Tells.","take":"Election administration and immigration powers lead, while the Binance investigation and difficult diplomacy remain consequential. Fox foregrounds the Alaska decoy allegations, CNN stresses the California injunction and disputed election claims, and Drudge prominently links the crypto heist and Iran risks. Their overlap is uncertainty over security and power, not agreement that fraud or guilt is established; Drudge is an aggregator, not an independent reporting source.","sectionTakes":{"top":"Election administration and immigration powers lead, while the Binance investigation and difficult diplomacy remain consequential. Fox foregrounds the Alaska decoy allegations, CNN stresses the California injunction and disputed election claims, and Drudge prominently links the crypto heist and Iran risks. Their overlap is uncertainty over security and power, not agreement that fraud or guilt is established; Drudge is an aggregator, not an independent reporting source.","usa":"The Houston indictment, Pennsylvania measles response and preschool-rights dispute lead a page of accountability and public-health questions. Indigenous art, coastal conservation and comet research broaden the coverage without converting allegations or models into settled findings. Tonight’s clock change and Halloween displays retain their original source dates, as do the civil-rights journey and records lawsuit.","boston":"FINAL Friday: Celtics 125, Bulls 111; UPCOMING Saturday: Blackhawks at Bruins, 1 p.m. EDT, with the other three teams off. Pritchard’s two-way performance and Gray’s declined option lead substantive updates; Brown and Henderson remain questionable for Sunday, not ruled out. Globe access ranged from readable text to paywall overlays; WEEI/Audacy was checked but fresh full text remained limited.","business":"CONFIRMED Friday, Oct. 30 close: Dow 51,770.31, −572.25 (−1.09%); Nasdaq 25,437.00, −747.73 (−2.86%), for the completed 4 p.m. EDT cash session, independently checked with AP and CNBC. AI-spending concerns and Intel’s outlook drove selling even as oil producers profited. SEC scrutiny is not a fraud finding, and prospective cannabis tax benefits are not realized refunds.","world":"Ethiopia’s attributed camp toll and Novaya Gazeta’s announced closure lead a page of distinct humanitarian and institutional pressures. Oleshky’s evacuation is local relief, not a general ceasefire; Poland’s confrontation remains a judicial-authority dispute. China’s bilateral outreach, Greenland’s airport and the pope’s AI appeal describe concrete developments without assuming promised outcomes.","sports":"Kucherov’s reported request and Tampa Bay’s refusal are competing positions, not a completed trade. Curry’s comeback, Philadelphia’s win and Flores’ hiring are completed developments, while contract options produce distinct outcomes. Payne’s absence is confirmed, Philo’s selection remains attributed, and the new Jacobs accounts remain allegations.","politics":"Heavy advance voting and Musk’s spending show mobilization, not the final result. Trump’s restored rallies and Michigan’s ad dispute expose different campaign pressures, while Ohio’s ad withdrawal is not a legal judgment. Comey’s hearing produced no ruling, and AP’s fact check rejects specific viral claims rather than validating a broader fraud narrative.","entertainment":"Qualley and Antonoff’s filing and Ross’ partial charge dismissal are different legal stages, not fully concluded cases. Franklin and Daddy Yankee chart new musical directions, while the Stewart appreciation adds stage-career context. AddamsFest supplies timely Halloween culture, and the earlier-dated Gentle Monster review remains criticism of fiction."},"sections":{"top":[{"id":"top-california-e30","headline":"Two California rulings reject ballot segregation and bar intimidation of election workers","summary":"AP’s late-Friday update says an appeals court rejected DOJ’s request to set aside disputed California ballots, and a district judge subsequently barred intimidation of workers processing them. California disputes the reliability of the government’s citizenship list. CNN independently reports the emergency order. Neither allegations about eligibility nor these rulings establish widespread illegal voting.","sources":["Other","CNN"],"signal":"Watch","links":[{"url":"https://apnews.com/article/california-noncitizen-voting-trump-midterm-lawsuit-49cee0f4184b0ecb573f9f0274350642","label":"AP — updated Oct. 30, 10:09 p.m. EDT"},{"url":"https://www.cnn.com/2026/10/31/politics/live-news/midterm-election-congress","label":"CNN — Oct. 31 election litigation update"}]},{"id":"top-alaska-e30","headline":"Alaska ballot probe widens; requested segregation is not an order invalidating votes","summary":"AP’s overnight update reports DOJ’s request to preserve and segregate ballots ranking the second Daniel Sullivan, alongside a criminal investigation. Peltola denies involvement; CNN reports her rejection of the allegations and explains that ranked-choice counting may take weeks. Fox foregrounds the alleged decoy scheme. The investigation has not established Peltola’s guilt or invalidated the election.","sources":["Other","Fox","CNN"],"signal":"Watch","links":[{"url":"https://apnews.com/article/alaska-sullivan-peltola-senate-election-88259e40d70a7e4f535e01a2b88489aa","label":"AP — updated Oct. 31, 12:29 a.m. EDT"},{"url":"https://www.foxnews.com/politics/governor-probing-decoy-dan-sullivan-election-scandal-warns-system-flaw-hiding-plain-sight","label":"Fox News — Oct. 30; homepage rechecked Oct. 31"},{"url":"https://www.cnn.com/2026/10/31/politics/live-news/midterm-election-congress","label":"CNN — Oct. 31 reporting"}]},{"id":"top-raids-o31","headline":"Reuters: Central Valley immigration surge stirs voter-intimidation allegations","summary":"Reuters’ Saturday investigation documents sharply increased immigration arrests in California’s Central Valley, including a planned surge described in an internal email. An unnamed U.S. official says the White House directed it. Latino residents and critics fear a chilling effect before a close House election; those concerns are not a court finding that the operation was designed to suppress votes.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/legal/government/ice-raids-california-toss-up-district-spark-accusations-voter-intimidation-2026-10-31/","label":"Reuters — Oct. 31 investigation"}]},{"id":"top-asylum-o31","headline":"Judge temporarily blocks expedited asylum policies for unaccompanied children","summary":"Reuters reports Judge Brendan Hurson ordered prior procedures restored through Nov. 13 while considering a longer injunction. Legal-service groups challenged policies that shortened interview notice and limited their ability to represent children. The temporary order supplies immediate procedural protection, not a final resolution of every asylum claim or the full lawsuit.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/legal/government/us-judge-blocks-trump-policies-fast-tracking-childrens-asylum-cases-2026-10-30/","label":"Reuters — Oct. 30 court report"}]},{"id":"top-binance-oct30","headline":"Binance theft investigation reaches U.S. officials as recovery promises face scrutiny","summary":"AP’s Saturday explainer says Trump confirmed U.S. officials are investigating the more-than-$6 billion Binance theft. Binance promises to cover losses and says investigators found additional breach points after an initial laptop explanation. TRM’s North Korean attribution remains its high-confidence assessment, not a publicly established government finding. Drudge prominently aggregates the heist coverage.","sources":["Other","Drudge"],"signal":"Watch","links":[{"url":"https://apnews.com/article/binance-cryptocurrency-security-hack-north-korea-550e9b876550f71f07098494fe735beb","label":"AP — updated Oct. 31, 7 a.m. EDT"},{"url":"https://www.drudgereport.com/","label":"Drudge Report — aggregator checked Oct. 31 morning"}]},{"id":"top-israel-e30","headline":"Lieberman’s rejection of Arab-party partnership complicates replacing Netanyahu","summary":"AP reports Avigdor Lieberman appeared to rule out partnering with Arab-led parties, sharply constraining the opposition’s coalition arithmetic after Netanyahu’s bloc lost its majority. Netanyahu remains in office during negotiations. No party won the 61 seats required alone; a new election is a possibility if coalition attempts fail, not an already scheduled outcome.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/israel-elections-netanyahu-results-eisenkot-arabs-3a793c0d07fdfe515390524b849d8674","label":"AP — Oct. 30, 12:59 p.m. EDT; rechecked Oct. 31"}]},{"id":"top-iran-e30","headline":"Reuters: Qatari mediators return to Tehran, but U.S.–Iran deal remains elusive","summary":"An official briefed on the talks told Reuters mediators returned Friday after an Iranian official rejected earlier proposals. Nuclear issues, sanctions and the port blockade remain points of disagreement. This is attributed diplomatic reporting, not an announced ceasefire or verified agreement.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.internazionale.it/ultime-notizie-reuters/2026/10/30/qatari-mediators-return-to-tehran-to-push-for-us-iran-deal-official-says","label":"Reuters via Internazionale — Oct. 30; attributed to briefed official"}]},{"id":"top-pentagon-e30","headline":"Reuters: Pentagon asks European allies to temper public Russia warnings","summary":"Four people familiar with the matter told Reuters Pentagon officials urged several NATO countries to moderate Russia-related rhetoric. The sources describe bilateral messages to Baltic allies, not a publicly adopted NATO policy. Reuters’ reporting establishes an attributed account of diplomatic pressure; it does not show that the underlying Russian threat has disappeared.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.yahoo.com/news/articles/exclusive-pentagon-tells-europeans-cool-050400616.html","label":"Reuters via Yahoo — Oct. 30; rechecked Oct. 31"}]},{"id":"top-ads-e30","headline":"Judge orders three taxpayer-funded administration ads removed before election","summary":"Judge Jennifer Rochon ordered three government-funded videos removed from official websites and halted third-party distribution, AP’s Friday-evening update reports. The White House denounced the decision. The ruling concerns specific advertisements and their funding; it is not a ban on all presidential campaigning or a criminal judgment against the administration.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/trump-tv-ads-ruling-a6e45144033198d060fdc0e9d0a641b9","label":"AP — updated Oct. 30, 7:30 p.m. EDT"}]},{"id":"top-spain-e30","headline":"Spain crash inquiry turns to failed safety systems and controller workloads","summary":"AP’s Friday investigation describes a communications-system failure before the collision and a backup system that could not distinguish trains within the same sensor segment. Unions dispute suggestions that individual error alone explains the disaster, pointing to staffing and workload. Investigators have not delivered a final causal finding; disputed blame and changing casualty snapshots are not presented as settled facts.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/spain-train-crash-toledo-causes-unions-669ef8c0c12c8c9b720e721e7532ccbb","label":"AP — updated Oct. 30, 2:53 p.m. EDT; rechecked Oct. 31"}]}],"usa":[{"id":"top-houston-e30","headline":"Houston ICE officer charged over SUV strike; defense disputes intent","summary":"A Harris County grand jury charged Mario Alberto Morales with aggravated assault after an SUV struck Miguel Parra Hernandez during a pursuit. Prosecutors cite video and allege intentional conduct; ICE and the defense call it an accident and accuse the district attorney of political motives. AP reports Hernandez broke his leg and remains in federal custody. The indictment is not a conviction.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/houston-ice-charged-parra-hernandez-18d36105004d806c41618b800b70f59c","label":"AP — updated Oct. 30, 6:22 p.m. EDT"}]},{"id":"usa-measles-o31","headline":"Pennsylvania measles outbreak prompts new openness to vaccination","summary":"AP’s Friday field reporting describes a historic outbreak affecting Amish and conservative Mennonite communities, alongside increased willingness among some residents to receive vaccines. Attitudes vary across the communities and are not dictated by one universal religious prohibition. The reporting documents changing responses to a health emergency, not proof that transmission is contained.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/measles-outbreak-vaccination-amish-mennonite-pennsylvania-8f4fcd6e089e09a94c61a41d0ea474f4","label":"AP — Oct. 30, 12:13 p.m. EDT"}]},{"id":"usa-preschool-o31","headline":"Colorado preschool case tests religious rights against equal-access rules","summary":"Reuters’ Saturday preview examines a Supreme Court dispute over Colorado’s publicly funded preschool program and its nondiscrimination conditions. Catholic entities argue those conditions burden religious exercise; the state requires equal enrollment opportunity regardless of families’ sexual orientation or gender identity. The upcoming case could change the balance of rights, but the Court has not yet resolved it.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/legal/government/preschool-case-tests-religious-conservatives-us-supreme-court-win-streak-2026-10-31/","label":"Reuters — Oct. 31 court preview"}]},{"id":"usa-native-o31","headline":"Native Heritage Month opens with art and traditions that challenge stereotypes","summary":"AP’s Saturday report highlights Indigenous artists, cultural practices and community programs ahead of November’s National Native American Heritage Month. A Las Vegas gallery showcases work from different Indigenous communities and offers free art activities. The coverage emphasizes varied histories and contemporary creativity rather than treating Native Americans and Alaska Natives as one homogeneous group.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/native-american-heritage-month-november-alaska-native-e82ba5b13c597e84e5b8c61b7b2c9535","label":"AP — updated Oct. 31, 2:22 a.m. EDT"}]},{"id":"usa-clocks-o31","headline":"Clocks fall back overnight in most of the U.S.; sleep routines matter","summary":"Most participating U.S. jurisdictions return to standard time at 2 a.m. Sunday, Nov. 1. AP’s Oct. 26 service report explains the extra hour and darker afternoons, with Hawaii and most of Arizona exempt from the change. Health groups favor stable schedules and standard time year-round; that recommendation is not a newly enacted nationwide policy.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/daylight-saving-fall-back-time-change-003f56383585ec8abde704c9c205a8e7","label":"AP — Oct. 26, 6:02 a.m. EDT; relevant tonight"}]},{"id":"usa-striped-o31","headline":"Striped-bass decline threatens a coastal fishing tradition","summary":"AP’s Friday reporting from Montauk describes fewer young striped bass and alarm among anglers who remember abundant catches. Fishing pressure and conservation decisions now confront a species embedded in East Coast recreation and livelihoods. Concern about collapse is a warning about population trends, not a declaration that the species has already vanished.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/striped-bass-decline-striper-fishing-surfcasting-montauk-fade6e5cd77ffd8a4d30b4b1090a090b","label":"AP — Oct. 30, 12:13 p.m. EDT"}]},{"id":"usa-comets-o31","headline":"New simulations challenge comet-delivery theory for life’s ingredients","summary":"CNN’s Saturday science report describes simulations suggesting fragile organic molecules would usually be destroyed when comets struck early Earth. The study challenges one mechanism for delivering prebiotic material; it does not explain the entire origin of life or disprove every extraterrestrial-source hypothesis. Researchers’ modeled outcomes are not direct observations of the ancient impacts.","sources":["CNN"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/31/science/origin-life-theory-comet-simulation","label":"CNN — published Oct. 31, 6 a.m. ET"}]},{"id":"usa-freedom-e30","headline":"Freedom Riders complete interrupted journey to New Orleans after 65 years","summary":"Original riders and younger activists completed the Washington-to-New Orleans bus route and were honored Wednesday at Xavier University. AP’s Friday account recalls the 1961 firebombing that halted the original trip. The new journey connects living participants with subsequent generations rather than reenacting the original violence.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/freedom-riders-journey-new-orleans-cd034bd98e5b01cb3ff365cfa5667a7d","label":"AP — updated Oct. 30, 5:29 p.m. EDT"}]},{"id":"usa-elpaso-e30","headline":"El Paso newsroom sues for access to Walmart shooting investigation records","summary":"El Paso Matters filed a Thursday suit challenging broad secrecy over police and prosecution records from the 2019 mass shooting. Its report carried by AP describes a request for a judge to enforce the Texas Public Information Act. The petition has not itself opened the records or resolved the confidentiality dispute.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/el-paso-walmart-shooting-records-lawsuit-0b48d40f564297b700a5ef08ad3abfc5","label":"El Paso Matters via AP — updated Oct. 30, 2:31 p.m. EDT"}]},{"id":"usa-skeleton-o31","headline":"Giant skeletons become a Halloween fixture well beyond one night","summary":"AP’s Oct. 29 cultural report traces the spread of oversized skeleton displays from pandemic-era novelty to a year-round decorating habit. The 2026 model adds Bluetooth sound features and smaller companion versions. This is timely Halloween reporting with its original date preserved, not a new public-safety alert or a claim that all households share the trend.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/halloween-objects-giant-skeleton-1ef22a77416947f22a1ad96afa2c1aff","label":"AP — Oct. 29, 3:49 p.m. EDT; Halloween context"}]}],"boston":[{"id":"boston-saturday-status-o31","headline":"Saturday Boston scoreboard: Celtics win 125–111; Bruins host Chicago at 1 p.m.","summary":"FINAL Friday, Oct. 30: Celtics 125, Bulls 111. Bruins, Patriots and Red Sox did not play Friday. UPCOMING Saturday, Oct. 31: Blackhawks at Bruins, 1 p.m. EDT; Celtics, Patriots and Red Sox are off today. Red Sox season is complete. UPCOMING Sunday, Nov. 1: Patriots at Miami, 4:25 p.m. EST. FINAL Thursday, Oct. 29: Blues 4, Bruins 1. Official NBA/NHL and Patriots schedules checked Saturday morning; no Boston game is in progress.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.nba.com/game/chi-vs-bos-0022600016","label":"NBA — official Oct. 30 final; checked Oct. 31"},{"url":"https://www.nhl.com/gamecenter/chi-vs-bos/2026/10/31/2026020217","label":"NHL — official Saturday fixture checked Oct. 31"},{"url":"https://www.patriots.com/schedule/","label":"Patriots — official Sunday schedule checked Oct. 31"}]},{"id":"boston-pritchard-o31","headline":"Pritchard’s 30 points and renewed defensive edge power Cup-opening win","summary":"Boston beat Chicago 125–111 Friday for its fourth consecutive victory. Pritchard scored 20 before halftime; Tatum added 26 and Paul George 18 with eight assists, AP’s ESPN recap confirms. The Globe focuses on Pritchard’s two-way work and Mazzulla’s praise after a first-half embrace. The win starts group play; it does not clinch a knockout berth.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.espn.com/nba/recap/_/gameId/401909278","label":"AP via ESPN — Oct. 30 final"},{"url":"https://www.bostonglobe.com/2026/10/30/sports/celtics-bulls-nba-cup-td-garden/","label":"Boston Globe — Oct. 30; readable with paywall elements"}]},{"id":"boston-gray-o31","headline":"Red Sox decline Sonny Gray’s $30 million option, making him a free agent","summary":"AP’s overnight contract roundup reports Boston declined Gray’s mutual option and owes a $5 million buyout payable in five annual installments. The decision opens a pitching-roster question rather than announcing a replacement signing. It is separate from Thursday’s Eaton and Cheng trades and from Durbin’s medical rehabilitation.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/alcantara-king-bichette-options-c94a7f278a2807dae923208951ce04df","label":"AP — updated Oct. 31, 12:46 a.m. EDT"}]},{"id":"boston-brown-e30","headline":"Brown and Henderson questionable for Miami after missing final two practices","summary":"Friday’s official analysis lists A.J. Brown (ankle/knee), TreVeyon Henderson (illness), Carlton Davis III (neck) and Christian Elliss (chest) as questionable. The Globe independently confirms the designations. No active-roster player was ruled out in that report; questionable is not confirmed availability, and Saturday changes remain possible.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.patriots.com/news/injury-report-analysis-wr-a-j-brown-rb-treveyon-henderson-questionable-for-week-8-matchup-vs-the-dolphins","label":"Patriots — Oct. 30, 3:50 p.m. official analysis"},{"url":"https://www.bostonglobe.com/2026/10/30/sports/patriots-injuries-aj-brown/","label":"Boston Globe — Oct. 30; partly paywalled"},{"url":"https://www.audacy.com/weei/sports","label":"WEEI/Audacy — checked Oct. 30 evening; limited fresh full text"},{"url":"https://www.audacy.com/weei/sports","label":"WEEI/Audacy — checked Oct. 31; limited fresh full text"}]},{"id":"boston-miami-o31","headline":"Patriots prepare for rebuilding Miami team that Hafley has kept competitive","summary":"The Globe’s Saturday scouting report describes an unusually young, low-cost Dolphins roster after a sweeping teardown. Mike Vrabel credits Jeff Hafley’s work under difficult circumstances. Miami’s personnel changes make preparation less familiar, not an automatic New England victory. Sunday’s scheduled kickoff remains 4:25 p.m. EST.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.bostonglobe.com/2026/10/31/sports/dolphins-patriots-jeff-hafley/","label":"Boston Globe — Oct. 31; partly paywalled"}]},{"id":"boston-hagens-e30","headline":"Hagens’ five-on-five production offers Bruins a bright spot in road defeat","summary":"Boston.com’s Friday feature says James Hagens has five goals and 10 points through 14 games, including Boston’s lone goal Thursday. His nine five-on-five points match Pastrnak’s team-leading total despite less ice time. Strong early production is meaningful evidence of adaptation, not a guarantee that his scoring rate will persist.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.boston.com/sports/boston-bruins/2026/10/30/boston-bruins-james-hagens-nhl-hockey-david-pastrnak/","label":"Boston.com — Oct. 30 feature"},{"url":"https://www.nhl.com/bruins/news/boston-bruins-st-louis-blues-game-recap-october-29-2026-x7683","label":"NHL — Oct. 29 official final"}]},{"id":"boston-durbin-oct30","headline": ,"label":"AP — updated Oct. 29, 1:38 p.m. EDT"}]}],"entertainment":[{"id":"ent-qualley-e30","headline":"Margaret Qualley and Jack Antonoff file for divorce","summary":"Court records show an uncontested matrimonial action filed Friday in Brooklyn after three years of marriage, AP reports. Qualley is the plaintiff and Antonoff the defendant. Filing is not a final divorce judgment, and the records do not establish a public explanation for the separation.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/antonoff-qualley-divorce-a853342b11bf53867e103680d7b861ba","label":"AP — updated Oct. 30, 6:44 p.m. EDT"}]},{"id":"ent-ross-e30","headline":"Prosecutors drop Rick Ross felony count; misdemeanor case continues","summary":"Miami-Dade prosecutors dropped battery by strangulation for insufficient evidence, AP reports Friday. Ross still faces a misdemeanor domestic-battery charge and has pleaded not guilty. Dismissal of one count does not mean the entire case ended or that the remaining allegation has been proven.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/rick-ross-arrest-miami-beach-florida-9c5bb3af32cd3381dd95bb64e8e31ebf","label":"AP — updated Oct. 30, 12:45 p.m. EDT"}]},{"id":"ent-kirk-e30","headline":"Kirk Franklin embraces a less apologetic turn on new album","summary":"In AP’s Friday interview, the gospel star discusses “I Am What I Am,” collaborations and criticism of his work with artists outside gospel. The 14th studio album frames his current artistic outlook. His reflections are the artist’s perspective, not a universal assessment of the record’s reception.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/kirk-franklin-interview-fa06a5ef09722713549309789ee34eb7","label":"AP — updated Oct. 30, 6:52 p.m. EDT"}]},{"id":"ent-yankee-e30","headline":"Daddy Yankee’s “La Postal” turns reggaeton toward a concept album about love","summary":"AP’s Friday review describes 15 tracks built around romantic, familial and spiritual love. The release marks another move after his retirement announcement and subsequent faith-centered work. The evaluation is criticism, not evidence of commercial performance or a return to every aspect of his old touring career.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/daddy-yankee-la-postal-music-review-a872077854a18726532a5840b2dc097b","label":"AP — updated Oct. 30, 11:07 a.m. EDT; music review"}]},{"id":"ent-stewart-e30","headline":"Stewart appreciation traces the stage career behind his screen fame","summary":"AP’s Friday appreciation revisits Patrick Stewart’s Shakespearean work and repeated returns to theater after “Star Trek” and “X-Men.” The perspective adds substantive career context following his death rather than recycling an unverified medical explanation. It is a critical remembrance, not a new cause-of-death report.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/patrick-stewart-shakespeare-theater-appreciation-9fe4ffe6024a270aad3a456ae26a11b7","label":"AP — updated Oct. 30, 11:38 a.m. EDT"}]},{"id":"ent-addams-e30","headline":"Westfield turns Charles Addams’ hometown into Halloween destination","summary":"AP’s Thursday feature describes AddamsFest, transformed storefronts and the New Jersey landmarks that inspired the cartoonist’s macabre style. The seasonal celebration has immediate Halloween relevance. It is a local cultural event, not an announcement of a new film or television production.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/addams-family-author-hometown-new-jersey-halloween-3af3a0164d3a20996e2beeb0effdee83","label":"AP — updated Oct. 29, 10:26 a.m. EDT"}]},{"id":"entertainment-gentle-oct28eve","headline":"“Gentle Monster” review examines denial inside a family drama","summary":"AP critic Lindsey Bahr’s Wednesday review highlights Léa Seydoux’s restrained performance in Marie Kreutzer’s film about a family confronted by a criminal investigation. The review questions the excuses people make for loved ones. These are assessments of fiction, not allegations about the actors or filmmakers.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/gentle-monster-movie-review-918881df1a322ae09fc019c9fd0a57a5","label":"AP — updated Oct. 28, 11:52 a.m. EDT; film review"}]}]},"researchNotes":["Saturday Oct. 31 morning limited refresh. Four eligible tabs freshly researched/reranked. Business, World, Politics and Entertainment exactly preserved from Friday evening; no market research; schedule unchanged.","Fox, CNN and Drudge homepages checked. CNN and AP independently corroborate California court actions and Alaska investigation; underlying allegations remain disputed. Fox article access limited. Drudge is an aggregator. Reuters asylum and Central Valley investigations remain attributed reporting.","Official NBA and AP via ESPN confirm Celtics 125–111 Bulls Friday. Official NHL gamecenter confirms Blackhawks at Bruins Saturday 1 p.m. EDT. Celtics, Patriots and Red Sox off Saturday; Red Sox season complete. Patriots official schedule Sunday 4:25 p.m. EST. No Boston game in progress.","Globe and WEEI/Audacy checked. Globe partly readable with subscription overlays; WEEI fresh full text limited. Friday Patriots official questionable designations preserved. AP overnight report confirms declined Gray option. Older Durbin, roster-trade and Bruins analysis remain important pending rehabilitation, roster deadlines and Saturday return.","Search returned numerous stale AP articles and an official Bruins 2023 season preview; excluded. Actual dates checked in opened articles. General Sports excludes all Boston teams, racing, international soccer and WNBA. Shared AP contract roundup supplies distinct Gray and non-Boston option stories, without repeating the same transaction."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, international soccer, or WNBA coverage.',business:'7 unique business/markets stories refreshed only at 7 p.m. Eastern Monday through Friday, with independently confirmed figures for the latest completed U.S. cash session. Preserved unchanged at all other editions.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
