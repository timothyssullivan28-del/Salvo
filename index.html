<script id="briefing" type="application/json">{"date":"2026-09-28","lastUpdated":"September 28, 2026, 7:10:31 a.m. EDT Boston","dek":"Iran talks stall as the Northeast cleans up from a nor’easter, Hurricane Polo nears Baja and five arrests near a U.S.-used British base bring fresh scrutiny.","take":"The central story is a stalled U.S.–Iran proposal: Fox stresses Trump’s rejection and Tehran’s war rhetoric, CNN’s coverage also tracks diplomacy and the storm’s human impacts, while Drudge foregrounds dramatic headlines and weather links. The outlets converge on no ceasefire, but emphasize different risks; Drudge is an aggregator, not an independent reporting source.","sectionTakes":{"top":"The central story is a stalled U.S.–Iran proposal: Fox stresses Trump’s rejection and Tehran’s war rhetoric, CNN’s coverage also tracks diplomacy and the storm’s human impacts, while Drudge foregrounds dramatic headlines and weather links. The outlets converge on no ceasefire, but emphasize different risks; Drudge is an aggregator, not an independent reporting source.","usa":"The domestic cards span unresolved investigations, consumer safety and civil litigation, with officials’ claims and court rulings kept distinct from final outcomes. Monday’s fuel-economy plan is still an administration proposal/rollout, while the detention, campus deaths and criminal cases remain under investigation.","boston":"No Red Sox, Patriots, Bruins or Celtics game is scheduled Monday: Boston’s Sunday finals were the Cubs’ 6–2 win over the Sox and Jacksonville’s 35–6 win over New England, while BC lost 21–14 Saturday. The Red Sox play at the Yankees Tuesday at 8 p.m. EDT and the Bruins open Tuesday at 8; the Patriots’ next game is Sunday at 1 p.m., and the Celtics have no Monday game.","business":"Friday, Sept. 25 close—the latest completed U.S. session: Dow +478.64 points (+0.93%) to 51,828.62; Nasdaq +129.34 (+0.48%) to 27,068.72. Stocks had ended higher, but oil-driven inflation fears and a global selloff pressured markets before Monday’s U.S. open; the remaining cards cover company deals, litigation and AI investment expectations.","world":"Thailand’s flooding remains an active emergency, with evacuations and casualty figures attributed to officials; Reuters puts potential losses at an estimate, not a final tally. Other cards cover security, health, disasters and elections, with dated Nolo forecasts explicitly labeled as Sunday reporting.","sports":"NFL Week 3 produced Sunday wins for Buffalo, Jacksonville and Denver, while college-football upsets and the Aces’ WNBA playoff win headline the other cards. These are completed results or attributed injury/trade reports; no Boston teams, auto racing or international soccer are included.","politics":"The tab’s new Monday items are a planned fuel-economy rollback and a CNN-reported candidate-post investigation; neither is a completed rule or an official party policy. Election administration and midterm-funding cards describe court actions, prospective agendas and contested claims without implying unresolved proceedings are settled.","entertainment":"At Sunday’s VMAs, Taylor Swift won three awards and the top video prize, while Madonna led with seven. Other cards cover a release and premiere, a court challenge, a charity-tour announcement, a theater re-release and canceled local concerts; announcements are not described as completed events."},"sections":{"top":[{"id":"top-iran-war-vote-proposal","headline":"Trump rejects Iran's latest Hormuz proposal as Tehran says it is open to diplomacy but prepared for war","summary":"President Donald Trump rejected Tehran's proposal to reopen the Strait of Hormuz and end the fighting, while saying U.S.-Iran talks could continue. Foreign Minister Abbas Araghchi said Monday that Iran remains open to genuine diplomacy but is ready for a wider conflict; the standoff has lifted oil prices. No ceasefire or agreement has been announced.","sources":["Fox","CNN","Other"],"signal":"Watch","links":[{"label":"Fox News: Trump rejects Iran ceasefire proposal, expects talks to continue (Sept. 27)","url":"https://www.foxnews.com/live-news/iran-war-strait-of-hormuz-donald-trump-09-27-26"},{"label":"AP: Where things stand after Iran’s new pitch for a deal to open the Strait of Hormuz","url":"https://apnews.com/article/iran-trump-deal-proposal-midterms-explainer-4f949bd0fd2777fa6960b56d8bf3169b"},{"label":"Al Jazeera: Iran war live updates, Sept. 28","url":"https://www.aljazeera.com/news/liveblog/2026/9/28/iran-war-live-tehran-warns-its-fully-prepared-for-war-amid-hormuz-tensions"}]},{"id":"top-noreaster-new-jersey-flooding","headline":"Nor'easter keeps flooding Northeast coasts as Monday cleanup begins and power outages persist","summary":"A slow-moving nor’easter continued to bring coastal flooding, rain and wind impacts from New Jersey through New England into Monday, with tens of thousands of homes still reported without power. AP and CNN say the storm is weakening, but flooding, travel disruption and recovery remain ongoing; reported casualties and outage counts are attributed and not a final damage tally.","sources":["CNN","Drudge","Other"],"signal":"Watch","links":[{"label":"AP: Powerful nor’easter floods Northeast again, causing problems from New Jersey to New England (Sept. 28)","url":"https://apnews.com/article/noreaster-storm-death-northeast-f4b86959733c021315e87ea1ed58459b"},{"label":"CNN: nor’easter tracker, updated for Monday","url":"https://www.cnn.com/2026/09/26/weather/live-news/noreaster-weekend-storm"},{"label":"Drudge Report: current front page (aggregator)","url":"https://www.drudgereport.com/"}]},{"id":"top-hurricane-polo-mexico","headline":"Hurricane Polo forecast to hit Baja California near major-hurricane strength Monday; warnings remain in effect","summary":"The National Hurricane Center’s Monday forecast says Polo could make landfall on Baja California’s west coast near major-hurricane strength late Monday, with dangerous wind, heavy rain, flooding and mudslides possible. These are official forecasts and warnings, not confirmed landfall impacts; the advisory is current as of Monday morning.","sources":["Other"],"signal":"Watch","links":[{"label":"NHC Hurricane Polo forecast discussion (Sept. 28, 8:54 a.m. UTC)","url":"https://www.nhc.noaa.gov/mobile/text/refresh/MIATCDEP2+html/280854.shtml"},{"label":"Reuters: Hurricane Polo threatens Mexico; landfall expected Monday (Sept. 27)","url":"https://www.reuters.com/business/environment/category-3-hurricane-polo-threatens-mexicos-coast-landfall-expected-monday-2026-09-27/"}]},{"id":"top-netanyahu-abu-dhabi-visit","headline":"Netanyahu made an unannounced weekend visit to Abu Dhabi and met UAE President Sheikh Mohammed bin Zayed","summary":"The Israeli prime minister made a secret visit to the United Arab Emirates and met its president, according to an announcement from Netanyahu’s office reported Monday by AP. The meeting came amid the Iran war and regional diplomacy; neither side immediately issued a public statement, and no agreement was announced.","sources":["Other"],"signal":"Watch","links":[{"label":"AP: Netanyahu meets Emirati leader in a secret weekend trip to Abu Dhabi (Sept. 28)","url":"https://apnews.com/article/israel-iran-uae-netayahu-yemen-september-28-2026-854377716258982535c7b2cd3a7d0fe0"},{"label":"Reuters (syndicated): Netanyahu visited Abu Dhabi on Sunday, Israeli official says","url":"https://www.usnews.com/news/world/articles/2026-09-27/israels-netanyahu-visited-abu-dhabi-on-sunday-israeli-official-says"}]},{"id":"top-fairford-base-arrests","headline":"Five arrested near RAF Fairford on suspicion of terror offenses; police investigate possible Iran link","summary":"British police arrested five men near RAF Fairford, a base used by U.S. forces, on suspicion of explosives and terrorism offenses. AP reports investigators are examining whether an Iran-linked attack was foiled, but authorities have not confirmed a motive or connection to Iran and the suspects have not been convicted.","links":[{"label":"AP: British police investigate whether arrests near US-run air base foiled an Iran-linked attack (Sept. 28)","url":"https://apnews.com/article/uk-fairford-us-air-base-arrests-investigation-4b6fb8b4636c0c360bd7d3d2c44e8075"},{"label":"CNN: UK police arrest five men on suspicion of terror offenses near air base used by US forces","url":"https://www.cnn.com/2026/09/27/uk/fairford-arrests-uk-raf-us-intl"},{"label":"Fox News: possible Iran link probed after RAF Fairford arrests (Sept. 28)","url":"https://www.foxnews.com/world/foiled-terror-plot-key-bomber-base-signals-wider-threat-us-military-installations-expert"}],"signal":"Watch","sources":["Fox","CNN","Other"]},{"id":"top-south-africa-twin-shootings","headline":"South Africa mass shootings leave 38 dead in attacks reported this week, according to AP and NPR tallies","summary":"AP and NPR report a combined toll of 38 people killed in separate mass shootings in South Africa this week. The figures combine different attacks and reflect reporting available Sunday; the investigations and official counts remain subject to updates.","links":[{"label":"AP: What’s behind South Africa’s mass shootings (Sept. 27)","url":"https://apnews.com/article/mass-shootings-crime-gun-south-africa-bf1327675ec3ca8383945bf23a4ad06f"}],"signal":"Watch","sources":["Other"]},{"id":"top-trump-xi-summit","headline":"U.S. and China announce reciprocal product lists for tariff cuts after Trump–Xi meeting; implementation details remain","summary":"The United States and China released reciprocal lists of products worth about $30 billion each that could receive lower tariffs after the Trump–Xi meeting. The lists identify goods for consideration; tariff rates and timing remain unsettled, so this is an announced framework rather than confirmation that reductions have taken effect.","sources":["Fox","Other"],"signal":"Watch","links":[{"label":"Al Jazeera: U.S. and China list goods recommended for tariff cuts after summit (Sept. 28)","url":"https://www.aljazeera.com/economy/2026/9/28/us-china-list-goods-recommended-for-tariff-cuts-following-trump-xi-summit"},{"label":"AP via ClickOrlando: reciprocal $30 billion product lists for tariff cuts (Sept. 28)","url":"https://www.clickorlando.com/gallery/news/2026/09/28/us-and-china-release-reciprocal-30-billion-product-lists-for-tariff-cuts-after-trump-xi-meeting/"}]},{"id":"top-supreme-court-save-database","headline":"Supreme Court lets states use expanded federal SAVE database for voter checks while litigation continues","summary":"The Supreme Court allowed states to use an expanded federal citizenship database for voter-registration checks while a legal challenge proceeds. The order does not resolve the broader dispute or establish that any specific noncitizens voted; states remain responsible for following applicable law.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Supreme Court allows expanded database checks (Sept. 26 podcast/update)","url":"https://www.reuters.com/podcasts/xi-house-netanyahu-un-metas-glasses-new-zealands-farmers-2026-09-25/"}]},{"id":"top-supreme-court-missouri-map","headline":"Supreme Court again blocks Missouri from using Trump-backed congressional map in 2026 midterms","summary":"The Supreme Court again barred Missouri from using the challenged congressional map in the 2026 midterms, leaving the state with the map in force pending further proceedings. The order is procedural and does not decide the ultimate merits of the dispute.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Supreme Court bars Missouri map for third time (Sept. 25)","url":"https://www.reuters.com/world/us-supreme-court-bars-republican-drawn-map-missouri-third-time-2026-09-25/"}]},{"id":"top-russia-attacks-ukraine-sept27","headline":"Russian bomb attack in Kharkiv injures 22, Ukrainian officials say, amid wider strikes","summary":"A Russian bomb attack in Kharkiv injured 22 people, according to Ukrainian officials cited by Reuters; the report also described damage in other districts. Casualty and damage figures remain official Ukrainian claims pending independent confirmation.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters via U.S. News: Russian bomb attack injures 22 in Kharkiv (Sept. 28)","url":"https://www.usnews.com/news/world/articles/2026-09-27/russian-bomb-attack-injures-22-in-ukraines-kharkiv-mayor-says"},{"label":"Al Jazeera: Russian strikes hit Ukraine, including Kharkiv (Sept. 28)","url":"https://www.aljazeera.com/amp/news/2026/9/28/russian-strikes-kill-eight-injure-dozens-across-ukraine"}]}],"usa":[{"id":"usa-pittsburgh-doctor-killed","headline":"Pittsburgh pediatrician Idris Evans is killed in a home attack; his wife is critically injured, officials say","summary":"Police say a man entered the home and stabbed Evans and his wife while they slept; the suspect was detained. The investigation is ongoing, and the attack account is attributed to law enforcement.","sources":["CNN","Fox","Other"],"signal":"Consensus","links":[{"label":"CNN: Pittsburgh investigation","url":"https://www.cnn.com/2026/09/25/us/pittsburgh-doctor-idris-evans-stabbing-home"},{"label":"PennLive: local report","url":"https://www.pennlive.com/crime/2026/09/upmc-childrens-hospital-physician-killed-in-stabbing-suspect-detained.html"}]},{"id":"usa-copenhaver-death","headline":"James Copenhaver, wounded in the 2024 Butler rally shooting, dies from injury complications","summary":"Copenhaver, 76, was one of two people wounded when a gunman opened fire at then-candidate Donald Trump’s Pennsylvania rally in July 2024. His lawyer said he died from complications related to those injuries; the death brings renewed attention to the attack’s victims.","sources":["Fox","Other"],"signal":"Consensus","links":[{"label":"AP: Copenhaver’s death","url":"https://apnews.com/article/james-copenhaver-trump-rally-butler-dies-00866b37ad8db967b4ebf6582c756bcd"},{"label":"CBS Pittsburgh","url":"https://www.cbsnews.com/pittsburgh/news/jim-copenhaver-trump-rally-assassination-attempt-victim-dies/"},{"label":"Fox News","url":"https://www.foxnews.com/politics/james-copenhaver-man-shot-trump-butler-rally-dies-complications-from-injuries-report"}]},{"id":"usa-ole-miss-deaths","headline":"Two Ole Miss student deaths remain under investigation; kratom found at the scene does not establish a cause","summary":"Authorities are investigating the deaths of two students, and reporting says kratom was found at the scene. Investigators have not established that the substance caused either death; the cases remain under investigation.","sources":["CNN","Fox","Other"],"signal":"Watch","links":[{"label":"AP: deaths and kratom","url":"https://apnews.com/article/kratom-mississippi-deaths-students-5c4d6429e65b573b2667119a8f860ddb"},{"label":"CNN: Ole Miss deaths","url":"https://www.cnn.com/2026/09/24/us/ole-miss-student-deaths-wwk"},{"label":"Fox News","url":"https://www.foxnews.com/us/ole-miss-victim-identified-narcotics-task-force-probes-two-student-deaths"}]},{"id":"usa-evanston-ice-detention","headline":"U.S. citizen says ICE agents mistakenly detained and injured him in Evanston","summary":"A U.S. citizen says immigration agents wrongly detained and injured him; local police and the man have offered accounts of the encounter. The claim is disputed and under scrutiny, not a court finding about the agents’ conduct.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"CNN: Evanston detention","url":"https://www.cnn.com/2026/09/24/us/ice-us-citizen-detained-evanston"},{"label":"AP: local account","url":"https://apnews.com/article/chicago-illinois-ice-immigration-agents-evanston-police-2e07d80e8d96685489e914880a4e4d5"}]},{"id":"usa-usda-meat-recall","headline":"USDA recalls more than 167,000 pounds of meat produced without federal inspection","summary":"The Food Safety and Inspection Service says Star Meat Delivery recalled raw pork, beef and goat products that were produced without federal inspection. Check the agency’s recall notice for affected labels, lot details and handling instructions.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"USDA-FSIS recall notice","url":"https://www.fsis.usda.gov/recalls-alerts/star-meat-delivery-inc--recalls-raw-pork-beef-and-goat-products-produced-without"},{"label":"CNN: recall coverage","url":"https://www.cnn.com/2026/09/24/us/meat-recall-usda-star-meat-delivery-hnk"}]},{"id":"usa-meta-cambridge-analytica-jury","headline":"New Mexico jury finds Meta misled users about Facebook data practices in Cambridge Analytica case","summary":"A Santa Fe jury found 26 of 29 statements identified by New Mexico to be misleading, including statements about data practices, hate speech and misinformation; it rejected some other claims. The verdict concerns a state case arising from the Cambridge Analytica scandal. A judge will determine civil penalties, so the verdict is not a final damages award or a finding that Facebook sold every user’s data.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: jury verdict","url":"https://www.reuters.com/business/meta-misled-consumers-case-over-cambridge-analytica-scandal-new-mexico-jury-says-2026-09-25/"},{"label":"AP: case background and trial","url":"https://apnews.com/article/facebook-meta-new-mexico-privacy-lawsuit-8b414eb0a14d58d7cdc6ae752e25dcb0"}]},{"id":"usa-lincoln-sailor-mental-health","headline":"Navy says eight USS Lincoln carrier-group sailors attempted suicide during deployment","summary":"The Navy disclosed eight suicide attempts among sailors assigned to the USS Abraham Lincoln carrier group during deployment. The report raises questions about the strain of service; it does not identify individual sailors, and care resources are available through military and civilian crisis services.","sources":["Other"],"signal":"Watch","links":[{"label":"AP: Navy disclosure","url":"https://apnews.com/articl y 14-day order restored White House press passes for CNN, MS NOW and Politico, but the travel-pool dispute continues. The temporary restoration is not a final ruling on the outlets’ First Amendment claims.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"CNN: Air Force One travel-pool exclusion","url":"https://www.cnn.com/2026/09/25/politics/white-house-blocks-cnn-air-force-one-travel-pool"},{"label":"Reuters: White House blocks CNN from flight","url":"https://www.reuters.com/business/media-telecom/white-house-blocks-cnn-air-force-one-trip-washington-post-reports-2026-09-26/"},{"label":"AP: CNN left off Saturday trip","url":"https://apnews.com/article/white-house-media-ban-cnn-network-pool-c32504981ee2f5b3c137e57d9d36f33e"},{"label":"Reuters: judge’s temporary access order","url":"https://www.reuters.com/world/judge-lifts-trumps-white-house-ban-cnn-ms-now-politico-2026-09-24/"}]}],"boston":[{"id":"boston-red-sox-cubs-final","headline":"FINAL Sunday: Cubs beat Red Sox 6–2; Boston is off Monday and opens its series at Yankees Tuesday at 8 p.m. EDT","summary":"Chicago beat Boston 6–2 Sunday in the regular-season finale at Tropicana Field; the Red Sox have no game Monday. Their next scheduled game is Wild Card Game 1 at the Yankees Tuesday, Sept. 29, at 8:00 p.m. EDT. Status checked Monday morning; see MLB’s official schedule and the game recap.","links":[{"label":"ESPN/AP: Cubs–Red Sox final recap","url":"https://www.espn.com/mlb/recap/_/gameId/401817089"},{"label":"MLB: 2026 Wild Card Series schedule (all times ET)","url":"https://www.mlb.com/news/2026-wild-card-series-game-times"}],"signal":"Consensus","sources":["Other"]},{"id":"boston-patriots-jaguars-final","headline":"FINAL Sunday: Jaguars beat Patriots 35–6; New England is off Monday and visits Buffalo Sunday at 1 p.m. EDT","summary":"Jacksonville defeated New England 35–6 on Sunday, Sept. 27; the Patriots have no game Monday. Their next scheduled game is at Buffalo on Sunday, Oct. 4, at 1:00 p.m. lieutenant-governor-resigns-amid-sexual-harassment-findings-2026-09-25/"},{"label":"NBC News: report and resignation","url":"https://www.nbcnews.com/politics/politics-news/new-jersey-lieutenant-governor-resigns-ethics-report-rcna599885"}]},{"id":"politics-texas-gop-candidate-posts","headline":"CNN report finds Texas GOP candidate’s extreme posts include calls for public executions","summary":"CNN’s KFile review found a Texas Republican congressional candidate made social-media posts advocating public executions and containing racist language. The report attributes the posts to the candidate; their publication does not establish that they reflect party policy or conduct in office.","sources":["CNN"],"signal":"Watch","links":[{"label":"CNN: Texas GOP candidate’s extreme posts extend beyond racism (Sept. 28)","url":"https://www.cnn.com/2026/09/28/politics/kfile-bo-french-tweets-executions"}]},{"id":"politics-trump-pocket-rescission-800m","headline":"Trump seeks to withhold more than $800 million in Congress-approved funds; Sen. Susan Collins calls move illegal","summary":"Reuters reported the White House is using a rarely used “pocket rescission” to withhold more than $800 million in Congress-approved funds. The administration says it is cutting waste; Sen. Susan Collins calls the move illegal. The separation-of-powers dispute remains unresolved.","sources":["Other"],"signal":"Split","links":[{"label":"Reuters: pocket rescission and Collins response","url":"https://www.reuters.com/legal/government/trump-seeks-withhold-800-million-congress-approved-funds-2026-09-26/"},{"label":"ABC News: White House order and Collins response","url":"https://abcnews.com/Politics/white-house-orders-800m-funds-rescinded-collins-calls/story?id=136772703"}]}],"entertainment":[{"id":"entertainment-taylor-swift-encore","headline":"Taylor Swift releases “The Life of a Showgirl: The Encore” and announces the “Patient Zero” video","summary":"Swift’s expanded release arrived Friday with additional songs; the “Patient Zero” music video is scheduled to premiere during Sunday’s VMAs. The album is out, while the video remains a future event.","sources":["Other"],"signal":"Consensus","links":[{"label":"AP: Swift release","url":"https://apnews.com/article/taylor-swift-new-music-patient-zero-934935f049893d0567713bea516f2c0c"},{"label":"Variety: album and video","url":"https://variety.com/2026/music/news/taylor-swift-reveals-life-of-showgirl-encore-new-songs-1236872982/"},{"label":"Variety: video details","url":"https://variety.com/2026/music/news/taylor-swift-patient-zero-music-video-dakota-johnson-colin-farrell-1236874206/"}]},{"id":"entertainment-different-world-netflix","headline":"Netflix’s “A Different World” sequel premieres with the original HBCU setting in focus","summary":"The sequel to the 1980s campus sitcom is available on Netflix Friday, bringing a new generation to the fictional Hillman College setting. The premiere is confirmed; audience response is not yet known.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"CNN: sequel premiere","url":"https://www.cnn.com/2026/09/24/entertainment/a-different-world-reboot-netflix"},{"label":"AP: sequel","url":"https://apnews.com/article/a-different-world-sequel-f0f23537d211e084dfb53999c3a4a367"}]},{"id":"entertainment-paramount-wbd-settlement-challenge","headline":"Merger opponents ask a court to reject Paramount’s settlement tied to its Warner Bros. bid","summary":"Variety reports opponents urged a court to reject a settlement connected to Paramount’s proposed Warner Bros. bid. The filing is an argument for the judge to consider; it is not a ruling on the merger or a completed acquisition.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety: court challenge","url":"https://variety.com/2026/tv/global/block-the-merger-amicus-brief-reject-settlement-1236875410/"},{"label":"Variety: settlement terms","url":"https://variety.com/2026/film/news/paramount-states-settlement-terms-warner-bros-1236871264/"}]},{"id":"entertainment-macklemore-charity-tour","headline":"Macklemore announces a tour supporting Palestinian aid organizations","summary":"Macklemore says proceeds from his planned “Free Palestine” shows will support aid organizations. The tour announcement is confirmed; the performances and any eventual distributions have not yet occurred.","sources":["Other"],"signal":"Watch","links":[{"label":"AP: tour announcement","url":"https://apnews.com/article/macklemore-free-palestine-shows-ed-sheeran-65a65a362e530dfe739ddb626dc16d23"},{"label":"Variety: tour details","url":"https://variety.com/2026/music/news/macklemore-free-palestine-tour-1236874352/"}]},{"id":"entertainment-dolly-9-to-5-restoration","headline":"Restored “9 to 5” returns to U.S. theaters Oct. 9–15, with proceeds supporting Dolly Parton’s foundation","summary":"Deadline reports 20th Century Studios will bring the newly restored 1980 comedy starring Dolly Parton, Jane Fonda and Lily Tomlin back to theaters for a one-week run beginning Oct. 9. Disney says net proceeds from U.S. ticket sales will benefit the Dollywood Foundation; screenings are upcoming, not underway.","links":[{"label":"Deadline: restored “9 to 5” theatrical run and charity","url":"https://deadline.com/2026/09/9-to-5-return-screening-dolly-parton-charity-1237113711/"},{"label":"Fox 59: Oct. 9–15 theatrical dates","url":"https://fox59.com/news/national-world/dolly-partons-classic-9-to-5-returning-to-theaters-for-limited-run/"}],"signal":"Watch","sources":["Other"]},{"id":"entertainment-ed-sheeran-gillette-canceled","headline":"Ed Sheeran cancels Friday and Saturday Gillette Stadium shows as nor’easter approaches","summary":"Gillette Stadium and the promoter announced that Ed Sheeran’s Foxborough shows scheduled for Sept. 25–26 were canceled because of the nor’easter. The venue’s notice says refunds are available through the point of purchase; no replacement dates were announced in the cited notice.","sources":["Other"],"signal":"Consensus","links":[{"label":"Gillette Stadium official cancellation notice","url":"https://www.gillettestadium.com/events/ed-sheeran-loop-tour/"},{"label":"NBC Boston/AP: cancellation report","url":"https://www.nbcboston.com/news/local/ed-sheeran-gillette-stadium-loop-tour/4020701/"}]},{"id":"entertainment-vmas-results","headline":"Taylor Swift wins three VMAs including Video of the Year; Madonna leads the night with seven awards","summary":"Taylor Swift’s “The Fate of Ophelia” won Video of the Year at Sunday’s MTV VMAs; Swift collected three trophies, dedicated the top award to Dolly Parton and reached 33 career VMAs. Madonna led the night with seven wins, according to Reuters’ results report.","sources":["Other"],"signal":"Consensus","links":[{"label":"Reuters: Taylor Swift makes VMAs history and dedicates award to Dolly Parton (Sept. 28)","url":"https://www.reuters.com/business/media-telecom/madonna-sabrina-carpenter-lisa-win-mtvs-video-music-awards-2026-09-28/"},{"label":"The Hollywood Reporter: full 2026 VMAs winners list","url":"https://www.hollywoodreporter.com/lists/mtv-vmas-2026-winners-list/"}]}]},"researchNotes":["Edition refreshed Monday, Sept. 28, 2026, for the 7 a.m. Eastern run. Fresh public-web research compared Fox News, CNN and Drudge Report; Drudge is treated only as an aggregator.","Verified Monday Boston schedules: no Red Sox, Patriots, Bruins or Celtics game on Sept. 28. Prior completed Red Sox and Patriots games were Sunday finals; next starts: Red Sox at Yankees Tue Sept. 29 8 p.m. EDT, Bruins vs Rangers Tue Sept. 29 8 p.m. EDT, Patriots at Bills Sun Oct. 4 1 p.m. EDT. Celtics have no Monday game; NBA camp opens Sept. 29.","Latest completed U.S. session is Friday, Sept. 25, 2026: Dow +478.64 (+0.93%) to 51,828.62; Nasdaq +129.34 (+0.48%) to 27,068.72. AP plus Investing.com/Reuters cross-checks.","Attribution caveats preserved for Iran claims, Fairford investigation, official casualty counts, forecasts, court orders, regulatory proposals, company talks and analyst projections."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'Boston-area professional and major-college sports only.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, or international soccer.',business:'7 unique business/markets stories; close figures refer to the latest completed U.S. session.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
