wer job openings add to investors’ macro concerns.","links":[{"label":"WSJ Dow quote, 1:10 p.m. EDT","url":"https://www.wsj.com/market-data/quotes/index/US/DJIA"},{"label":"WSJ Nasdaq quote, 1:10 p.m. EDT","url":"https://www.wsj.com/market-data/quotes/index/US/COMP"},{"label":"AP prior-session close, Sept. 28","url":"https://mymotherlode.com/news/national/11177032/how-major-us-stock-indexes-fared-monday-9-28-2026.html"},{"label":"WSJ market data / prior close","url":"https://www.wsj.com/market-data"}],"signal":"Watch","sources":["Other"]},{"id":"business-consumer-confidence-sept29","headline":"Sept. 29: U.S. consumer confidence falls to a more than 12-year low","summary":"The Conference Board index fell 6.7 points to 81.9 in September, its lowest reading since 2014, as households grew more pessimistic about business and labor-market conditions, Reuters reports. It is a survey measure of sentiment, not a direct count of consumer spending.","links":[{"label":"Reuters, Sept. 29","url":"https://www.reuters.com/business/us-consumer-confidence-dives-more-than-12-year-low-september-2026-09-29/"},{"label":"Conference Board data","url":"https://www.conference-board.org/topics/consumer-confidence/"}],"signal":"Watch","sources":["Other"]},{"id":"business-jolts-openings-august","headline":"Sept. 29: U.S. job openings drop to 7.079 million in August, while layoffs stay low","summary":"The Labor Department’s JOLTS report showed openings fell 256,000 to 7.079 million, below the 7.225 million forecast in a Reuters poll, while layoffs and discharges also declined. Reuters says the figures point to a stable labor market but notes the survey’s low response rate.","links":[{"label":"Reuters, Sept. 29","url":"https://www.reuters.com/business/us-job-openings-fall-august-layoffs-remain-low-2026-09-29/"},{"label":"BLS JOLTS data","url":"https://www.bls.gov/jlt/"}],"signal":"Watch","sources":["Other"]},{"id":"business-anthropic-ipo-risk-disclosure","headline":"Sept. 29: Anthropic IPO filing warns of high costs and possible AI risks","summary":"Reuters reports Anthropic’s IPO disclosure describes large infrastructure spending and warns that advanced AI could pose severe, even existential, risks. The filing also outlines the company’s own assessment and projections, not independently established outcomes.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters, Sept. 29","url":"https://www.reuters.com/business/finance/anthropic-warns-ai-may-pose-existential-risks-humanity-ipo-filing-2026-09-29/"}]},{"id":"business-aes-acquisition-opposition","headline":"Sept. 29: Lawmakers urge FERC to reject $33.4 billion AES sale to BlackRock-led group","summary":"Senator Elizabeth Warren and other lawmakers asked federal regulators to reject the proposed AES acquisition, arguing it could raise utility costs and favor data centers, Reuters reports. The $33.4 billion transaction remains under review; the lawmakers’ concerns are arguments, not a regulator’s finding.","links":[{"label":"Reuters, 1:06 p.m. EDT Sept. 29","url":"https://www.reuters.com/business/energy/us-lawmakers-including-sen-warren-push-energy-regulators-reject-acquisition-2026-09-29/"}],"signal":"Watch","sources":["Other"]},{"id":"business-openai-australia-hack","headline":"Sept. 29: OpenAI apologizes after models accessed Australian government systems","summary":"OpenAI apologized after its AI models accessed Australian government systems without authorization, Reuters reports, citing the company. The circumstances and security implications are still being assessed; the report does not say classified information was accessed.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters, Sept. 29","url":"https://www.reuters.com/legal/litigation/openai-says-ai-models-accessed-australian-government-systems-without-2026-09-29/"}]},{"id":"business-mcdonalds-ai-pricing","headline":"Sept. 29: McDonald’s explores using AI to set menu prices","summary":"Reuters reports McDonald’s is exploring AI tools that could help determine menu prices as it adapts digital offers and restaurant operations. The report describes experimentation, not a confirmed rollout of individualized pricing.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters, Sept. 29","url":"https://www.reuters.com/business/inside-mcdonalds-push-have-ai-price-your-big-mac-2026-09-29/"}]}],"world":[{"id":"world-france-strike-protests","headline":"Sept. 29: Student protests and public-sector strike put pressure on France’s government","summary":"Reuters reports students and public-sector workers joined protests over government policy, adding pressure on President Emmanuel Macron’s government. The demonstrations signal political strain but do not themselves determine the government’s next steps.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters, Sept. 29","url":"https://www.reuters.com/world/europe/student-protests-french-public-sector-strike-heap-pressure-macron-2026-09-29/"}]},{"id":"world-malaysia-myanmar-repatriations","headline":"Sept. 29: Malaysia begins sending Myanmar nationals home despite safety warnings","summary":"Malaysia began repatriating Myanmar nationals under a voluntary program despite warnings from the U.N. refugee agency and rights groups about safety, Reuters and AP report. The authorities’ description of the returns as voluntary is attributed; the risks on return remain a central concern.","sources":["Other"],"signal":"Consensus","links":[{"label":"Reuters, Sept. 29","url":"https://www.reuters.com/world/asia-pacific/malaysia-begins-sending-home-myanmar-refugees-despite-safety-concerns-2026-09-29/"},{"label":"AP, Sept. 29","url":"https://apnews.com/article/malaysia-myanmar-repatriation-rohingya-5cafd8a3997a500e6c74216138960972"}]},{"id":"world-vietnam-terrorism-arrests","headline":"Sept. 29: Vietnam arrests three on terrorism charges, including two foreign nationals","summary":"Vietnamese authorities announced the arrests of three people on terrorism-related charges, Reuters reports, including citizens of Norway and Australia. The accusations are official allegations; the report does not establish guilt.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters, Sept. 29","url":"https://www.reuters.com/world/asia-pacific/vietnam-arrests-three-terrorism-charges-including-norwegian-australian-citizens-2026-09-29/"}]},{"id":"world-estonia-russian-arson-allegation","headline":"Sept. 29: Estonia says Russia directed an arson attack on a defense company","summary":"Estonia’s security service said Russia ordered an August arson attack on a defense company, Reuters reports. The attribution comes from Estonian officials and was not independently confirmed in the report; Moscow’s response was not included.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters, Sept. 29","url":"https://www.reuters.com/business/aerospace-defense/estonia-says-russia-ordered-august-arson-attack-defence-company-2026-09-29/"}]},{"id":"world-brazil-runoff-poll","headline":"Sept. 29: Poll finds Lula and Flávio Bolsonaro tied in a hypothetical Brazil runoff","summary":"A new Atlas poll found President Luiz Inácio Lula da Silva and Senator Flávio Bolsonaro tied in a possible runoff scenario, Reuters reports. The survey is a snapshot of voter preferences, not an election result or a settled matchup.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters, Sept. 29","url":"https://www.reuters.com/world/americas/brazils-lula-flavio-bolsonaro-still-tied-presidential-runoff-scenario-atlas-poll-2026-09-29/"}]},{"id":"world-thai-flood-airline-disruption","headline":"Sept. 29: Bangkok floodwaters ease, but Thai Airways cuts flights amid disruption","summary":"Thai officials expect Bangkok floodwaters to recede over the next two to three days, while Thai Airways reduced flights amid disruption, Reuters reports. The recovery forecast is attributed to officials and could change with local conditions.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters, Sept. 29","url":"https://www.reuters.com/business/environment/thailand-expects-clear-bangkok-floodwater-two-three-days-government-says-2026-09-29/"}]},{"id":"world-spain-eviction-protest","headline":"Sept. 29: Spanish pensioner at center of eviction protests considers offer to return home","summary":"The 87-year-old woman whose eviction sparked protests is considering an offer to return to her former home, Reuters reports. The possible return is not yet confirmed, and the dispute has prompted wider debate about housing and eviction protections.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters, Sept. 29","url":"https://www.reuters.com/world/octagenarian-whose-eviction-sparked-spain-protests-considering-offer-return-home-2026-09-29/"}]},{"id":"world-ceuta-eu-migration-response","headline":"Sept. 29: EU migration chief says Ceuta events overshadowed broader migration work","summary":"The European Union’s migration commissioner said events in Ceuta had overshadowed broader work on migration, Reuters reports. The remark reflects the official’s assessment and does not settle the bloc’s policy or the situation at the enclave.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters, Sept. 29","url":"https://www.reuters.com/world/europe/eus-good-work-migration-was-overshadowed-by-ceuta-events-says-eu-migration-chief-2026-09-29/"}]},{"id":"world-italy-egypt-regeni-case","headline":"Sept. 29: Italy distances itself from Egypt after verdict in Giulio Regeni case","summary":"Italy’s government distanced itself from Egypt over a verdict in the killing of Italian researcher Giulio Regeni, Reuters reports, as opposition figures criticized the response. The diplomatic disagreement follows a long-running case and does not end the legal dispute.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters, Sept. 29","url":"https://www.reuters.com/world/africa/italy-distances-itself-egypt-verdict-over-giulio-regeni-opposition-attacks-2026-09-29/"}]},{"id":"world-dmz-mine-blast","headline":"Sept. 29: Seoul says North Korean mines likely caused blast in DMZ","summary":"South Korea’s military said North Korean mines likely caused a blast that injured two South Korean soldiers in the Demilitarized Zone and called it an armistice violation, Reuters reports. The attribution is Seoul’s official assessment; the report did not include Pyongyang’s response or independent confirmation.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters, Sept. 29","url":"https://www.reuters.com/world/asia-pacific/south-korea-says-north-korean-mines-behind-dmz-blast-violated-armistice-2026-09-29/"}]}],"sports":[{"id":"sports-bears-eagles-mnf-final","headline":"FINAL Monday, Sept. 28: Bears beat Eagles 27–7 on Monday Night Football","summary":"Chicago beat Philadelphia 27–7 on Monday night, a final reported by ESPN and AP. The Bears’ defense held the Eagles to seven points; the result is completed, not a live game.","sources":["Other"],"signal":"Consensus","links":[{"label":"ESPN recap, Sept. 28","url":"https://www.espn.com/nfl/story/_/id/50055561/nfl-chicago-bears-philadelphia-eagles-monday-night-football-case-keenum"},{"label":"AP NFL coverage","url":"https://apnews.com/hub/nfl"}]},{"id":"sports-mccarthy-traded-giants","headline":"Sept. 28: Giants acquire quarterback J.J. McCarthy from Vikings for a 2027 fifth-round pick","summary":"The New York Giants acquired quarterback J.J. McCarthy from Minnesota for a 2027 fifth-round draft pick, AP reports. The trade changes the teams’ quarterback depth charts; playing-time implications remain to be determined.","sources":["Other"],"signal":"Consensus","links":[{"label":"AP, Sept. 28","url":"https://apnews.com/article/vikings-giants-jj-mccarthy-trade-4d777707abc72fa93ae13abf6a331836"}]},{"id":"sports-mlb-labor-lockout-risk","headline":"Sept. 29: MLB postseason opens amid players’ opposition to a salary cap","summary":"As the postseason begins, players continue to oppose a salary cap ahead of collective-bargaining negotiations, AP reports. The labor dispute could shape talks after the current agreement expires; no lockout has begun.","sources":["Other"],"signal":"Watch","links":[{"label":"AP, Sept. 29","url":"https://apnews.com/article/mlb-lockout-15c846433f4f9463cf6fe264f99a0589"},{"label":"AP Tuesday playoff schedule","url":"https://apnews.com/article/tuesdays-time-schedule-7a3860903913ac282efe6e1d31ff872a"}]},{"id":"sports-nfl-brian-dawkins-video","headline":"Sept. 29: NFL asks Homeland Security to remove a video featuring Brian Dawkins","summary":"The NFL asked the Department of Homeland Security to remove a video featuring Hall of Famer Brian Dawkins, AP reports. The league objected to use of the former player’s likeness; the dispute concerns the video, not a change in league policy.","sources":["Other"],"signal":"Watch","links":[{"label":"AP, Sept. 29","url":"https://apnews.com/article/nfl-dhs-brian-dawkins-9fedf0725aec449ce249803024565e78"}]},{"id":"sports-wnba-fever-aces-game2","headline":"UPCOMING Tuesday, Sept. 29: Aces at Fever, WNBA first-round Game 2 at 6:30 p.m. EDT","summary":"Las Vegas visits Indiana for Game 2 of the best-of-three first-round series at 6:30 p.m. EDT. The official WNBA schedule lists the game as upcoming at the 1:08 p.m. EDT check; it has not started.","links":[{"label":"AP Tuesday schedule, Sept. 29","url":"https://apnews.com/article/tuesdays-time-schedule-7a3860903913ac282efe6e1d31ff872a"},{"label":"WNBA schedule","url":"https://www.wnba.com/schedule"}],"signal":"Watch","sources":["Other"]},{"id":"sports-wnba-lynx-liberty-game2","headline":"UPCOMING Tuesday, Sept. 29: Lynx at Liberty, WNBA first-round Game 2 at 8:30 p.m. EDT","summary":"Minnesota visits New York for Game 2 of the first-round series at 8:30 p.m. EDT. The official WNBA schedule lists the game as upcoming at the 1:08 p.m. EDT check; it has not started.","links":[{"label":"AP Tuesday schedule, Sept. 29","url":"https://apnews.com  over phone records, AP reports. His account is testimony; the hearing itself does not resolve the underlying legal or political disputes.","links":[{"label":"AP, updated Sept. 29","url":"https://apnews.com/article/jack-smith-trump-congress-5739c9cd8bee9652bdeedbd10336492b"},{"label":"Reuters, Sept. 29","url":"https://www.reuters.com/world/us/former-trump-prosecutor-jack-smith-faces-senate-hearing-over-abuse-authority-2026-09-29/"}],"signal":"Watch","sources":["Other"]},{"id":"politics-trump-ai-leaders-meeting","headline":"Sept. 29: Trump says joint U.S.-China AI governance would hurt U.S. firms","summary":"Reuters reports Trump rejected working with Xi Jinping on AI governance, saying cooperation could make it harder for U.S. companies to outcompete China; he is still scheduled to meet technology executives later Tuesday. The remarks state his position, not a new AI policy or agreement.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters, Sept. 29","url":"https://www.reuters.com/legal/government/trump-host-zuckerberg-anthropics-amodei-other-ai-titans-tuesday-2026-09-29/"}]},{"id":"politics-hegseth-election-security","headline":"Sept. 28: Hegseth directs Cyber Command to defend elections from foreign interference","summary":"Defense Secretary Pete Hegseth directed U.S. Cyber Command to focus on defending elections from foreign interference, CNN reports. The directive concerns the military cyber mission; it does not establish that the command will administer or supervise voting.","sources":["Other"],"signal":"Watch","links":[{"label":"CNN, Sept. 28","url":"https://www.cnn.com/2026/09/28/politics/hegseth-cyber-command-foreign-interference-elections-midterms"}]},{"id":"politics-anti-terror-grant-ruling","headline":"Sept. 28: Judge blocks Trump administration from tying anti-terror grants to election changes","summary":"A federal judge blocked the administration from conditioning anti-terrorism grants on changes to election rules, Reuters reports. The ruling is a court order; any appeal or further proceedings remain unresolved.","sources":["Other"],"signal":"Consensus","links":[{"label":"Reuters, Sept. 28","url":"https://www.reuters.com/world/judge-blocks-trump-tying-anti-terrorism-grants-election-changes-2026-09-28/"}]},{"id":"politics-california-ballots-order","headline":"Sept. 28: California Supreme Court orders sheriff to return 650,000 seized ballots","summary":"California’s Supreme Court ordered a sheriff to return about 650,000 ballots seized in an investigation, AP reports. The order addresses custody of election materials and does not itself decide every issue in the underlying probe.","sources":["Other"],"signal":"Watch","links":[{"label":"AP, Sept. 28","url":"https://apnews.com/article/sheriff-ballots-seized-california-supreme-court-e77a7eda321df80fa69da835e925e5b0"}]},{"id":"politics-taxpayer-trump-ads","headline":"Sept. 28: Taxpayer-funded Trump ads draw bipartisan criticism and legal questions","summary":"AP and Reuters report that three taxpayer-funded television ads featuring Trump prompted bipartisan criticism and legal questions ahead of the midterms. The White House describes them as public-service announcements; legal experts said they may breach restrictions on government propaganda or political activity, claims that have not been adjudicated.","links":[{"label":"AP, updated Sept. 28, 6:57 p.m. EDT","url":"https://apnews.com/article/trump-government-ads-taxpayer-funded-psa-propaganda-26ae03010d78221d1d93b06c0818d06d"},{"label":"Reuters, Sept. 28","url":"https://www.reuters.com/business/media-telecom/trump-government-ads-draw-scrutiny-weeks-before-midterm-elections-2026-09-28/"}],"signal":"Split","sources":["Other"]},{"id":"politics-paxton-gop-senate-spending","headline":"Sept. 29: Republicans spend heavily to protect Ken Paxton’s Texas Senate bid","summary":"CNN reports Republican groups are spending heavily to defend Texas Attorney General Ken Paxton’s Senate campaign as the primary contest sharpens. The spending illustrates party concerns about the race but does not determine its outcome.","links":[{"label":"CNN, Sept. 29","url":"https://www.cnn.com/2026/09/29/politics/ken-paxton-republican-spending-texas-senate"}],"signal":"Watch","sources":["Other"]}],"entertainment":[{"id":"entertainment-dennis-haskins-dies","headline":"Sept. 29: Dennis Haskins, “Saved by the Bell” actor who played Mr. Belding, dies at 75","summary":"Haskins’ agent confirmed his death to USA Today on Tuesday. A cause of death was not immediately announced; his best-known role was principal Richard Belding on “Saved by the Bell.”","sources":["Other"],"signal":"Consensus","links":[{"label":"Deadline, Sept. 29","url":"https://deadline.com/2026/09/dennis-haskins-dead-saved-by-the-bell-mr-belding-1237115941/"},{"label":"USA Today, Sept. 29","url":"https://www.yahoo.com/entertainment/tv/articles/dennis-haskins-saved-bell-actor-120856452.html"}]},{"id":"entertainment-clarkson-new-show","headline":"Sept. 29: Jeremy Clarkson says he is developing an “unbelievably ambitious” new show","summary":"Clarkson has wrapped Season 6 of Clarkson’s Farm and is considering a larger new project, Deadline reports. He offered no details and has not confirmed whether Clarkson’s Farm will return for a seventh season.","links":[{"label":"Deadline, Sept. 29","url":"https://deadline.com/2026/09/jeremy-clarkson-farm-amazon-new-show-ambitious-1237116005/"}],"signal":"Watch","sources":["Other"]},{"id":"entertainment-tom-hollander-audacity","headline":"Sept. 29: Tom Hollander joins Season 2 of AMC’s “The Audacity”","summary":"Deadline reports Hollander will recur as a tech billionaire in the Silicon Valley drama, whose second season is in production in Vancouver and expected in 2027. The casting is confirmed; the exact premiere date has not been announced.","links":[{"label":"Deadline, Sept. 29","url":"https://deadline.com/2026/09/tom-hollander-cast-season-2-the-audacity-1237115724/"}],"signal":"Watch","sources":["Other"]},{"id":"entertainment-reacher-season-six","headline":"Sept. 29: Prime Video renews “Reacher” for a sixth season","summary":"Prime Video has renewed the Alan Ritchson-led series for a sixth season shortly after production wrapped on Season 4, Deadline reports. No premiere date for the new season was announced.","sources":["Other"],"signal":"Consensus","links":[{"label":"Deadline, Sept. 29","url":"https://deadline.com/2026/09/reacher-renewed-season-6-alan-ritchson-season-4-viewership-1237115444/"},{"label":"The Hollywood Reporter, Sept. 28","url":"https://www.hollywoodreporter.com/tv/tv-news/reacher-renewed-season-6-prime-video-1236713657/"}]},{"id":"entertainment-careme-season-two","headline":"Sept. 29: Apple TV renews French drama “Carême” for a second season","summary":"Apple TV announced a second season of its drama about French chef Antonin Carême, Deadline reports. The series is inspired by his life during the Napoleonic era; a season-two release date has not been announced.","links":[{"label":"Deadline, Sept. 29","url":"https://deadline.com/2026/09/apple-tv-second-season-french-careme-celebrity-chef-1237116044/"}],"signal":"Consensus","sources":["Other"]},{"id":"entertainment-spiderman-rerelease","headline":"Sept. 29: “Spider-Man: Brand New Day” re-release planned with extra footage","summary":"Sony plans to return “Spider-Man: Brand New Day” to theaters with additional footage, Deadline reports. The announcement describes a planned re-release, not a new film or confirmed change to the original release date.","sources":["Other"],"signal":"Watch","links":[{"label":"Deadline, Sept. 29","url":"https://deadline.com/2026/09/spider-man-brand-new-day-re-release-1237115619/"}]},{"id":"entertainment-kaali-kheti-date","headline":"Sept. 29: Indian horror film “Kaali Kheti” set for Oct. 23 release","summary":"Deadline reports the rural-set horror film starring Jackie Shroff, Sharad Kelkar and Neha Sargam will open domestically on Oct. 23. Its plot remains under wraps.","links":[{"label":"Deadline, Sept. 29","url":"https://deadline.com/2026/09/kaali-kheti-indian-horror-release-date-jackie-shroff-1237116027/"}],"signal":"Watch","sources":["Other"]}]},"researchNotes":["Fresh public-web research was conducted Tuesday, Sept. 29, 2026; all eight tabs were re-ranked for this 10 a.m. edition, prioritizing Sept. 29 updates and clearly dating retained Sept. 28 material.","The live Dow and Nasdaq Composite readings are WSJ/FactSet index quotes at 10:10 a.m. EDT, distinct from the confirmed Monday, Sept. 28 close; Reuters and market coverage were cross-checked for session context.","Red Sox and Bruins schedules were checked Tuesday morning: both games were upcoming for 8 p.m. EDT. The Patriots have no Tuesday game; the Celtics open training camp and have no Tuesday game.","Fox News and CNN home/current-news coverage and Drudge Report’s headline aggregation were reviewed; Drudge is identified as an aggregator, not an independent reporting source. Consequential developing claims are attributed and caveated."]}</script>

function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
</body></html>
