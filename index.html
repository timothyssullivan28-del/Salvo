ld step down this month after Christa Pike survived a failed execution attempt. Gov. Bill Lee ordered an independent review and halted executions for the rest of 2026; details about Pike’s medical condition are attributed to her attorneys.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"AP — Tennessee prison chief to resign; executions paused, Oct. 3","url":"https://apnews.com/article/tennessee-corrections-execution-christa-pike-456e4c5e3e203be44744bcf839c11d4f"},{"label":"CNN — governor orders review after failed execution, Oct. 3","url":"https://edition.cnn.com/2026/10/03/us/christa-pike-tennessee-prisons-chief-governor"}]},{"id":"top-tigray-capital-mekelle-oct4","headline":"Oct. 4: Ethiopian government forces take control of Tigray capital Mekelle, sources say","summary":"Reuters, citing a humanitarian source and a Mekelle resident, reported that federal and allied forces had taken control of the capital after the Tigray People’s Liberation Front announced a withdrawal. The reported takeover followed a government-force recapture of the airport; battlefield control and civilian conditions remain developing, not a final settlement.","sources":["Other"],"signal":"Watch","links":[{"label":"Al Jazeera — government forces seize Mekelle, citing Reuters and local sources, Oct. 4","url":"https://www.aljazeera.com/news/2026/10/4/government-forces-seize-capital-of-ethiopias-tigray-region-from-rebels"},{"label":"Reuters — government forces retake Tigray capital airport, Oct. 3","url":"https://www.reuters.com/world/africa/pro-government-forces-say-they-retake-airport-ethiopias-tigray-region-2026-10-03/"}]},{"id":"top-yemen-sanaa-strikes-oct4","headline":"Oct. 4: Yemen’s government-aligned forces say strikes target Houthis in Sanaa and Saada","summary":"Yemen’s armed forces said early Sunday they were striking Iran-aligned Houthi positions in the capital Sanaa and Saada, Reuters reported. The claim does not independently confirm targets, damage or casualties; Houthi-run media said Saudi Arabia had struck Sanaa.","sources":["Fox","Other"],"signal":"Watch","links":[{"label":"Reuters — Yemen says it is striking Houthi targets, Oct. 4","url":"https://www.reuters.com/world/middle-east/yemens-armed-forces-say-it-is-conducting-strikes-against-houthis-sanaa-2026-10-03/"},{"label":"Fox News — Sunday report on strikes in Sanaa and Saada","url":"https://www.foxnews.com/live-news/us-iran-war-hormuz-strait-peace-talks-donald-trump-october-4"}]},{"id":"top-odesa-ship-strike-oct3","headline":"Oct. 3: Russian attack hits cargo ship in Ukraine’s Odesa port, killing one, Ukraine says","summary":"Ukraine’s seaports administration said a Russian attack struck a Liberian-flagged cargo ship in Odesa, killing one person and injuring three. Reuters attributes the casualty count to the Ukrainian agency; it was not independently confirmed in the report.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — Odesa port ship strike and reported toll, Oct. 3","url":"https://www.reuters.com/world/russia-hits-liberian-flagged-ship-ukraines-odesa-port-kills-one-2026-10-03/"}]},{"id":"top-catalonia-flooding-oct4","headline":"Oct. 4: Flooding in Spain’s Catalonia region leaves two dead and one missing, Reuters reports","summary":"Reuters reports two people died and one remained missing after flooding in Catalonia. The toll is attributed to local authorities; rescue and damage assessments were continuing.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — two dead and one missing in Catalonia floods, Oct. 4","url":"https://www.reuters.com/business/environment/two-dead-flooding-spains-catalonia-region-2026-10-04/"}]},{"id":"top-iran-hormuz-conditions-oct4","headline":"Oct. 4: Iran says Strait will stay closed until its conditions are met, rejects U.S. terms","summary":"Iranian Foreign Minister Abbas Araghchi said a Tehran proposal could reopen the Strait of Hormuz within seven days but warned Iran was prepared if Washington chose cy. The case is pending; the Court has not ruled on the policy’s legality.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — Supreme Court to hear detention-policy dispute, Oct. 1","url":"https://www.reuters.com/world/us-supreme-court-hear-clash-over-trumps-immigration-detention-policy-2026-10-01/"},{"label":"AP — justices to review immigration detention, Oct. 1","url":"https://apnews.com/article/ice-immigration-detention-supreme-court-f8ee63bcb11f1be3d7d6300022f3bc88"}]},{"id":"usa-cornell-investigation-reopened-oct4","headline":"Oct. 4: Prosecutor reopens Cornell rape-allegations investigation amid campus scrutiny","summary":"The Associated Press reports that a prosecutor has reopened a probe into rape allegations involving Cornell fraternities, as students and university leaders face renewed scrutiny. The underlying allegations remain under investigation and have not been established as findings of fact.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — prosecutor reopens Cornell investigation, Oct. 4","url":"https://apnews.com/article/cornell-rape-allegations-investigation-16f59e89ce97e3a40a8e672f7b3f374b"},{"label":"CNN — Cornell campus scrutiny and case review, Oct. 4","url":"https://www.cnn.com/2026/10/04/us/cornell-campus-mood-sexual-assault-hnk"}]},{"id":"usa-apnorc-cost-healthcare-poll-oct3","headline":"Oct. 3: AP-NORC poll finds Democrats lead on cost of living and health care, but trust remains low","summary":"The poll found Democrats with an advantage on cost of living and health care, while few voters said either party could solve major problems. It measures opinion, not policy outcomes or election results.","sources":["Other"],"signal":"Watch","links":[{"label":"AP via WTOP — poll on cost of living, health care and trust, Oct. 3","url":"https://wtop.com/national/2026/10/democrats-have-advantage-on-cost-of-living-ap-norc-poll-shows-but-few-voters-think-either-party-can-solve-big-problems/"}]},{"id":"usa-guard-member-arrested-oct3","headline":"Oct. 3: Oklahoma National Guard member deployed in Washington arrested on firearms charge","summary":"Authorities arrested a National Guard member deployed to Washington on a firearms charge, the Associated Press reported. The charge is an allegation; the report does not establish guilt or motive.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — Guard member deployed to Washington arrested, Oct. 3","url":"https://apnews.com/article/national-guard-trump-washington-arrest-035def73d80efc1815f2c80b1cb8f15d"}]},{"id":"usa-hemp-thc-ban-oct3","headline":"Oct. 3: $28 billion hemp-THC industry fights a possible federal ban","summary":"Businesses selling intoxicating hemp-derived products are lobbying against a looming federal prohibition that could reshape a multibillion-dollar market. The ban is a potential policy change, not yet a completed shutdown of the industry.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — hemp-THC industry faces possible federal ban, Oct. 3","url":"https://apnews.com/article/hemp-marijuana-cannabis-thc-mcconnell-a6f2a02b40c7c5d33d99c84f3221e93f"},{"label":"PBS NewsHour — AP report on hemp products, Oct. 3","url":"https://www.pbs.org/newshour/economy/a-28-billion-hemp-thc-industry-is-fighting-to-save-itself-from-a-looming-federal-ban"}]},{"id":"usa-medicare-90-payment-oct3","headline":"Oct. 3: Trump announces a one-time $90 Medicare payment for more than 20 million seniors","summary":"Trump said the payment would help offset premiums, with the White House saying eligible recipients would receive a check or deposit in early October. The announcement does not establish any lasting change to Medicare benefits or financing.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — Trump announces one-time $90 Medicare payment, Oct. 3","url":"https://www.reuters.com/world/trump-says-us-send-one-time-90-payment-20-million-seniors-enrolled-medicare-2026-10-03/"},{"label":"White House — Medicare Improv nding; the filing is not a court decision.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — states challenge EPA power-plant rule repeal, Oct. 1","url":"https://www.reuters.com/legal/litigation/new-york-20-states-sue-epa-block-power-plant-carbon-rule-repeal-2026-10-01/"}]},{"id":"politics-kennedy-center-demolition-bill-oct2","headline":"Oct. 2: Bipartisan lawmakers move to block proposed Kennedy Center demolition","summary":"Members of both parties introduced a measure aimed at preventing demolition of the Kennedy Center. The proposal must still advance through Congress; no demolition or final legislative outcome is reported.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — bipartisan lawmakers seek to block Kennedy Center demolition, Oct. 2","url":"https://www.reuters.com/legal/government/bipartisan-members-congress-move-block-demolition-kennedy-center-2026-10-02/"}]}],"entertainment":[{"id":"entertainment-digger-boxoffice-oct3","headline":"Oct. 4 estimates: “Verity” opens at $32.6M; “Digger” debuts near $8M","summary":"Sunday estimates put “Verity” first with about $32.6 million and “Digger” near $8 million domestically, a tepid opening for the latter. The figures are weekend estimates rather than final audited grosses, with trade reports differing slightly on the totals.","sources":["Other"],"signal":"Watch","links":[{"label":"TheWrap — weekend box-office estimates, Oct. 4","url":"https://www.thewrap.com/creative-content/movies/verity-digger-box-office-bomb/"},{"label":"Audacy/KNX — “Verity” leads, “Digger” opens, Oct. 4","url":"https://www.audacy.com/knxnews/entertainment/digger-levity-box-office-7d59b53ae7dbbb22d661d421c941988d"}]},{"id":"entertainment-taylor-swift-snl-cameo-oct3","headline":"Oct. 3: Taylor Swift makes surprise appearance during Dakota Johnson’s SNL monologue","summary":"Swift joined host Dakota Johnson during the Saturday Night Live monologue, Variety reported. The cameo was a one-night live-show appearance. n: Dow 51,176.96, +250.40 (+0.49%); Nasdaq Composite 27,190.86, +319.27 (+1.19%). Reuters exact closes/moves cross-checked against AP; no Sunday cash or premarket snapshot used.","AP/Guardian reported two deaths and at least 25 hospital transports in the Georgia homecoming shooting; Baltimore police accounts of the park shooting remain attributed. No suspect has been independently identified in this edition.","Okinawa arrest remains a suspicion/allegation under investigation; Taiwan bar-raid details are attributed to Reuters/local reporting and protest coverage. The reported Houthi strike near Aramco was not confirmed by Saudi authorities in checked coverage.","Weekend box-office totals are industry estimates: TheWrap and Deadline differed slightly on Verity, so the edition uses a range rather than treating either number as final.","Sunday Oct. 4 refresh run at October 4, 2026, 4:17:15 p.m. EDT Boston; all eight tabs re-researched and reranked. Fox News’ Iran/Houthi live file, CNN’s missing-flight/aviation/Ukraine coverage and the Drudge aggregator’s Brazil/midterm/economic links were compared.","Boston status rechecked at 4:17 p.m. EDT: Patriots 29, Bills 26 FINAL on CBS and ESPN. Patriots.com official widget still showed a stale live clock despite its scoring summary matching the final. Bruins–Wild final, Red Sox elimination and Celtics preseason status reverified.","Business: Sunday cash markets closed; Friday Oct. 2 is the latest completed session. AP exact close values cross-checked with Yahoo Finance’s market live blog for Dow and Nasdaq percentages.","Boston source access: Boston Globe team pages and Oct. 4 coverage were checked; some article text is paywalled. WEEI/Audacy sports and team pages were checked but often yielded navigation, schedule or audio metadata rather than full reporting text; the available WEEI story and Globe links remain included."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, or international soccer.',business:'7 unique business/markets stories; on trading days at 7 a.m. show timestamped indicative Dow and Nasdaq-100 futures, clearly not cash indexes; on weekends and market holidays state cash markets are closed and show no live/premarket snapshot, while identifying the latest completed session. At 10 a.m. and 1 p.m. on trading days show timestamped Dow and Nasdaq Composite cash-index levels, point and percentage moves, and any provider delay; at 4 p.m. show timestamped closing moves as confirmed or clearly preliminary; at 7 p.m. use confirmed closes.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
