ains subject to verification; the outbreak’s geographic spread and response are still developing.","links":[{"label":"Reuters — government Ebola toll, Oct. 2","url":"https://www.reuters.com/business/healthcare-pharmaceuticals/ebola-deaths-congo-exceed-4000-government-data-shows-2026-10-02/"}],"sources":["Other"],"signal":"Watch"},{"id":"top-france-protests-oct2","headline":"Oct. 2: Students and police clash as France struggles to contain school protests","summary":"Reuters reports protests have turned violent in some locations and about 400 schools were closed, citing current reporting. The scale and causes vary by site; the count is attributed to the report and the demonstrations are ongoing.","links":[{"label":"Reuters — school closures and clashes, Oct. 2","url":"https://www.reuters.com/world/about-400-french-schools-closed-some-student-protests-turn-violent-2026-10-02/"}],"sources":["Other"],"signal":"Watch"},{"id":"top-yemen-strikes-oct2","headline":"Oct. 2: Yemen government spokesperson says forces carried out 20 strikes on Houthi targets","summary":"Reuters reports the spokesperson’s claim of 20 strikes in Taiz province. The figure, targets and effects are claims by a party to the conflict; the report did not independently establish casualty or damage totals.","links":[{"label":"Reuters — spokesperson’s strike claim, Oct. 2","url":"https://www.reuters.com/world/middle-east/yemen-carried-out-20-strikes-houthi-targets-taiz-province-spokesperson-says-2026-10-02/"}],"sources":["Other"],"signal":"Watch"}],"usa":[{"id":"usa-coast-guard-cuba-oct2","headline":"Oct. 2: Coast Guard intercepts cargo boat carrying fuel bound for Cuba, Reuters reports","summary":"Reuters, citing a New York Times report, says the U.S. Coast Guard intercepted a cargo boat carrying fuel bound for Cuba. The initial account attributes the report and offers limited detail on the vessel or legal basis; those details were not independently established in the report.","links":[{"label":"Reuters — noe-sized drones to deter migrant crossings","summary":"Reuters reports U.S. officials are considering broader use of small unmanned craft along the border as a deterrent. The report concerns a proposed expansion, not a confirmed deployment or a demonstrated effect on crossings.","links":[{"label":"Reuters — border drone proposal, Oct. 2","url":"https://www.reuters.com/world/us-looks-expand-use-canoe-sized-drones-deter-migrant-crossings-2026-10-02/"}],"sources":["Other"],"signal":"Watch"},{"id":"usa-cornell-special-prosecutor-oct2","headline":"Oct. 2: New York governor appoints AG Letitia James special prosecutor in Cornell rape probe","summary":"Gov. Kathy Hochul removed the local prosecutor and appointed Attorney General Letitia James to lead the investigation into alleged 2024 sexual assaults at Cornell, AP and Reuters report. The change shifts prosecutorial control; the underlying allegations remain allegations, and the appointment is not a finding of guilt.","links":[{"label":"AP — Hochul appoints James in Cornell probe, Oct. 2","url":"https://apnews.com/article/new-york-governor-cornell-rape-investigation-e95c9f286008701e0b870123f54a9003"},{"label":"Reuters — James named special prosecutor, Oct. 2","url":"https://www.reuters.com/legal/government/new-york-attorney-general-named-special-prosecutor-cornell-rape-probe-2026-10-02/"}],"sources":["Other"],"signal":"Watch"},{"id":"usa-hud-grants-paused-oct1","headline":"Oct. 1: Judge pauses cancellation of nearly $56 million in HUD counseling grants","summary":"A federal judge temporarily blocked grant cancellations while nonprofit groups’ lawsuit proceeds. The order preserves funding during litigation; it does not decide whether the administration’s rationale or the plaintiffs’ claims are legally correct.","links":[{"label":"Reuters — judge pauses housing-grant cuts, Oct. 1","url":"https://www.reuters.com/legal/government/us-judge-blocks-housing-grant-cuts-while-anti-dei-challenge-proceeds-2026-10-01/"}],"sources":[" ign-push-texas-oklahoma-republicans-face-tough-races-2026-10-01/"},{"label":"AP — Texas and Oklahoma campaign stops, Oct. 1","url":"https://apnews.com/live/trump-approval-texas-oklahoma-news-updates-10-01-2026"}],"sources":["Other"],"signal":"Watch"},{"id":"politics-apnorc-approval-oct1","headline":"Oct. 1: AP-NORC poll puts Trump’s economic approval at 26% as voters cite high prices","summary":"The survey found a majority blamed administration policies rather than outside factors for persistent prices, while 26% approved of Trump’s economic handling. Poll results measure opinion at the time of interviewing; they are not election results or a forecast.","links":[{"label":"AP — AP-NORC poll on prices and economy, Oct. 1","url":"https://apnews.com/article/trump-economy-approval-trump-midterms-8d5809758a31b29c73f4351a8008147c"},{"label":"USA Today — AP-NORC polling coverage, Oct. 1","url":"https://www.usatoday.com/story/news/politics/2026/10/01/trump-approval-rating-ap-norc-poll/92038926007/"}],"sources":["Other"],"signal":"Watch"},{"id":"politics-aca-refunds-oct1","headline":"Oct. 1: Administration sends $500 ACA-fee refund checks to about 950,000 people","summary":"Reuters reports eligible full-price marketplace enrollees in 30 HealthCare.gov states are receiving checks, with most of the payments going to battleground states. The administration calls them fee refunds; claims about electoral effects are analysts’ projections, not established outcomes.","links":[{"label":"Reuters — ACA refunds and battleground states, Oct. 1","url":"https://www.reuters.com/legal/litigation/trumps-500-obamacare-rebate-checks-land-prime-political-battlegrounds-2026-10-01/"}],"sources":["Other"],"signal":"Watch"},{"id":"politics-epa-states-lawsuit-oct1","headline":"Oct. 1: New York leads 25 states and cities challenging EPA power-plant rule repeal","summary":"The coalition argues EPA failed to account for alternative approaches and health and climate costs when it repealed 2024 greenhouse-gas limits. The filing starts litigation and is not a court decision on the agency’s authority.","links":[{"label":"Reuters — states’ challenge to EPA repeal, Oct. 1","url":"https://www.reuters.com/legal/litigation/new-york-20-states-sue-epa-block-power-plant-carbon-rule-repeal-2026-10-01/"}],"sources":["Other"],"signal":"Watch"},{"id":"politics-senate-gop-spending-shift-oct2","headline":"Oct. 2: Senate GOP campaign group shifts money from North Carolina to Kansas, AP reports","summary":"The Senate Republicans’ top campaign-spending organization is pulling back in competitive North Carolina and redirecting money to Kansas, AP reports. The resource shift is a campaign decision, not proof either race is safe or a forecast of the November result.","links":[{"label":"AP — Senate GOP redirects campaign spending, Oct. 2","url":"https://apnews.com/article/senate-republicans-campaign-spending-kansas-north-carolina-72a0a3ff32c3626396f72ba77dc0264f"}],"sources":["Other"],"signal":"Watch"},{"id":"politics-house-battleground-oct2","headline":"Oct. 2: Democrats broaden House battleground, reaching into Republican-held districts","summary":"The Washington Post reports Democratic groups are expanding their House campaign map into districts that backed Trump in 2024. This is a campaign strategy, not evidence that any seat has changed hands or that a November outcome is settled.","links":[{"label":"The Washington Post — Democrats expand House battleground, Oct. 2","url":"https://www.washingtonpost.com/politics/2026/10/02/democrats-expand-battleground-house-reaching-into-blood-red-districts/"}],"sources":["Other"],"signal":"Watch"}],"entertainment":[{"id":"entertainment-skydance-name-oct2","headline":"Oct. 2: Combined Paramount-Warner company to be called Skydance if merger closes, Reuters reports","summary":"Paramount Skydance CEO David Ellison said the combined company would use the Skydance name once its Warner Bros. Discovery merger closes, which Reuters says is expected next week. The deal has not yet closed, and reported talks about CNN leadership remain unresolved.","links":[{"label":"Reuters — planned name for combined company, Oct. 2","url":"https://www.reuters.com/legal/transactional/david-ellison-says-combined-paramount-warner-bros-discovery-will-be-named-2026-10-02/"},{"label":"Variety — CNN chief discussions, Oct. 1","url":"https://variety.com/2026/tv/news/paramount-cnn-chief-mark-thompson-discussions-1236894869/"}],"sources":["Other"],"signal":"Watch"},{"id":"entertainment-fast-furious-peacock-oct2","headline":"Oct. 2: Peacock orders “Fast & Furious” TV adaptation to series","summary":"Variety reports Peacock has formally ordered the franchise adaptation and is targeting a 2028 premiere. That is a series order and target window, not a released show or fixed launch date.","links":[{"label":"Variety — “Fast & Furious” series order, Oct. 2","url":"https://au.variety.com/2026/tv/news/fast-furious-tv-show-peacock-2028-40935/"}],"sources":["Other"],"signal":"Watch"},{"id":"entertainment-eddie-murphy-chairman-oct2","headline":"Oct. 2: Eddie Murphy attached to Peacock drama “The Chairman”","summary":"The project is in development with “Mad Men” creator Matthew Weiner, Variety and The Hollywood Reporter report. The casting and project are announced, but no series order, production start or premiere date was confirmed.","links":[{"label":"The Hollywood Reporter — Murphy’s scripted series, Oct. 2","url":"https://www.hollywoodreporter.com/tv/tv-news/eddie-murphy-star-the-chairman-peacock-1236720659/"},{"label":"Variety — project details, Oct. 2","url":"https://au.variety.com/2026/tv/news/eddie-murphy-peacock-drama-matthew-weiner-40937/"}],"sources":["Other"],"signal":"Watch"},{"id":"entertainment-tony-romo-cbs-exit-oct2","headline":"Oct. 2: Tony Romo and CBS Sports part ways after 19 years, ESPN reports","summary":"ESPN reports Romo and CBS Sports mutually agreed to end their partnership; J.J. Watt remains the network’s lead game analyst. The split follows Romo’s July arrest on an operating-while-intoxicated charge, but the report does not say that incident caused the decision.","links":[{"label":"ESPN — Romo and CBS Sports part ways, Oct. 2","url":"https://www.espn.com/nfl/story/_/id/50085245/tony-romo-cbs-sports-agree-part-ex-qb-dwi-arrest"}],"sources":["Other"],"signal":"Watch"},{"id":"entertainment-kimmel-future-oct1","headline":"Oct. 1: Disney president Dana Walden addresses Jimmy Kimmel Live!’s future","summary":"Variety reports Walden discussed the ABC show’s future and the performance of Disney’s live-action “Moana.” The comments do not announce a renewal or cancellation of Kimmel’s program.","links":[{"label":"Variety — Walden on Kimmel and “Moana,” Oct. 1","url":"https://variety.com/2026/film/news/disney-dana-walden-jimmy-kimmel-abc-moana-box-office-1236894985/"}],"sources":["Other"],"signal":"Watch"},{"id":"entertainment-starz-verizon-blackout-oct1","headline":"Oct. 1: Starz service goes dark for Verizon Fios customers amid carriage dispute","summary":"Variety reports Starz channels and on-demand service were blacked out after negotiations failed to yield a distribution agreement. The companies blame each other and no new deal was announced in the report.","links":[{"label":"Variety — Starz-Verizon blackout, Oct. 1","url":"https://variety.com/2026/tv/news/starz-verizon-fios-negotiations-blacked-out-tonight-1236894418/"}],"sources":["Other"],"signal":"Watch"},{"id":"entertainment-sia-catalog-sale-oct1","headline":"Oct. 1: Sia sells half-share of music catalog in reported $180 million deal","summary":"Rolling Stone reports the singer sold a 50% stake in her catalog. The reported transaction is complete; the precise future royalty stream and how the artist’s remaining share will be managed were not detailed.","links":[{"label":"Rolling Stone — Sia catalog sale, Oct. 1","url":"https://www.rollingstone.com/music/music-news/sia-sells-50-percent-catalogue-180-million-1235635118/"}],"sources":["Other"],"signal":"Watch"}]},"researchNotes":["Edition refreshed Friday, Oct. 2, 2026, using live public-web searches and direct article pages; Fox News, CNN, Drudge Report, AP, Reuters, official sources and team schedules were checked.","Market close is explicitly preliminary and unreconciled: Yahoo Finance/Dow, Nasdaq official COMP page and Reuters preliminary close report differ slightly. AP’s market article was updated before the closing bell; no AP exact close was available at the build check. Nasdaq warns index data are delayed at least one minute.","Boston schedules checked at the exact Eastern edition time: Bruins–Jets scheduled for 8:00 p.m. EDT and still upcoming; Red Sox elimination remains the Sept. 30 9–2 final; Patriots next play Sunday at Buffalo; Celtics preseason starts Oct. 8.","Source reporting, allegations, official statistics, forward-looking commitments and unresolved legal proceedings remain attributed and are not presented as adjudicated outcomes."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'Only the Red Sox, Patriots, Bruins and Celtics; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, or international soccer.',business:'7 unique business/markets stories; at 7 a.m. show timestamped indicative Dow and Nasdaq-100 futures, clearly not cash indexes; at 10 a.m. and 1 p.m. show timestamped Dow and Nasdaq Composite cash-index levels, point and percentage moves, and any provider delay; at 4 p.m. show timestamped closing moves as confirmed or clearly preliminary; at 7 p.m. use confirmed closes; state the date of the latest completed U.S. cash session.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
