<script id="briefing" type="application/json">{"date":"2026-09-26","lastUpdated":"September 26, 2026, 10:00 a.m. EDT Boston","dek":"Trump–Xi’s contested trade and AI understandings, Iran’s unaccepted seven-day proposal, two Pacific hurricanes, Northeast flooding, fresh Supreme Court election rulings and Russia’s Kyiv strikes lead Saturday’s 10 a.m. briefing.","take":"Fox, CNN and Drudge converge that the summit, Iran tensions, Pacific hurricane hazards, the nor’easter and the White House-CNN access fight are major storylines, but differ in emphasis and framing. Fox foregrounds Iran’s security and energy risks plus alleged Chinese military support; CNN leads with the storm and highlights China’s AI pitch and the press-pool dispute; Drudge stresses midterm/economic backlash and frames the summit as pomp over progress. Beijing’s claimed $30 billion tariff/AI understanding is not confirmed by Washington, and the reported Trump rejection of Iran’s proposal comes from a WSJ account citing unnamed U.S. officials. NHC’s wind readings are observations; rainfall, landfall and storm impacts remain forecasts. Kyiv’s death toll and Saudi interceptions are attributed claims, while the Supreme Court map and SAVE rulings are separate legal developments, not findings of noncitizen voting.","sectionTakes":{"top":"Fox, CNN and Drudge converge that the summit, Iran tensions, Pacific hurricane hazards, the nor’easter and the White House-CNN access fight are major storylines, but differ in emphasis and framing. Fox foregrounds Iran’s security and energy risks plus alleged Chinese military support; CNN leads with the storm and highlights China’s AI pitch and the press-pool dispute; Drudge stresses midterm/economic backlash and frames the summit as pomp over progress. Beijing’s claimed $30 billion tariff/AI understanding is not confirmed by Washington, and the reported Trump rejection of Iran’s proposal comes from a WSJ account citing unnamed U.S. officials. NHC’s wind readings are observations; rainfall, landfall and storm impacts remain forecasts. Kyiv’s death toll and Saudi interceptions are attributed claims, while the Supreme Court map and SAVE rulings are separate legal developments, not findings of noncitizen voting.","usa":"This tab covers investigations, public safety, a food recall, a Navy disclosure and legal or regulatory cases. Police accounts in the Tasia Fortune and Ole Miss cases remain allegations or open investigations; the Meta verdict concerns specified statements, with penalties pending, while TikTok settled before trial rather than admitting every allegation. The Kalshi ruling is from one federal appeals court; it is not a nationwide resolution.","world":"Bangkok’s disaster declaration followed observed flooding; additional storms are forecasts. Greek officials’ updated Athens death toll is six, while the cause remains unresolved. The Pakistan blast toll comes from Rescue 1122 and the TTP claim is attributed; India’s voter-roll questions remain disputed as a review begins. Etna ash and weather have halted Catania arrivals through Sunday morning. Venezuela has no announced election date, not a formal cancellation. Other cards cover Congo’s Ebola response, Yemen malnutrition, Nepal’s flood-recovery identification work and Colombia’s extradition.","politics":"This section covers campaign strategy, election administration and federal accountability. The Michigan canvassing account is a campaign snapshot, not a poll; the Justice Department monitor plan is prospective; and Ohio and California court actions concern separate election rules. The White House pocket-rescission attempt is contested: the administration says it is cutting waste, while Sen. Susan Collins calls withholding appropriated funds illegal. New Jersey’s former lieutenant governor disputes the findings of the investigation preceding his resignation.","sports":"Atlanta’s 35–14 win, Friday’s Yankees–Orioles doubleheader split and the International team’s 7–3 Presidents Cup lead are reported as results to date, not future outcomes. Texas–Tennessee is a Saturday preview, not a final. NFL injury timetables are estimates; the former NC State trainer’s arrest reflects allegations, not guilt. This section excludes Boston teams, auto racing and international soccer.","boston":"The first two cards are verified Friday-night finals: the Red Sox swept Chicago, 4–3 and 2–0, and Washington beat the Bruins 3–2 in overtime (preseason). The Patriots and Celtics did not play Friday, so no score is implied. Boston College–Virginia Tech is scheduled for noon Saturday and was still upcoming at the 10 a.m. edition check; the remaining cards are current Patriots and Celtics team news.","entertainment":"Farm Aid is scheduled in Virginia Beach today, with CNN’s live broadcast set for 7–11 p.m. ET. Taylor Swift’s expanded release is out while her “Patient Zero” video and Sunday’s VMAs remain upcoming; Netflix’s “A Different World” sequel has premiered; the Warner Bros. settlement challenge is pending; Macklemore’s tour is announced, not completed; and Ed Sheeran’s Foxborough dates were canceled."},"sections":{"top":[{"id":"top-trump-xi-summit","headline":"Beijing says Trump and Xi agreed on tariff cuts and an AI dialogue after summit, but U.S. confirmation is pending","summary":"China’s Foreign Ministry says an eight-point consensus includes a $30 billion reciprocal tariff-reduction arrangement, an AI dialogue, an incident channel and a trade council. Reuters reports the U.S. Embassy had not responded to its request for comment, so the claimed understandings and implementation remain Beijing’s account, not independently confirmed U.S. policy. The three-day visit ended Friday after a two-month trade-truce extension. Fox emphasizes ceremony and Iran/security stakes; CNN stresses limited public breakthrough; Drudge frames the meeting as “long on pomp, short on progress.”","sources":["Fox","CNN","Drudge","Other"],"signal":"Split","links":[{"label":"Reuters: Beijing’s account of eight-point consensus","url":"https://www.reuters.com/world/china/china-us-agree-30-billion-tariff-cut-ai-dialogue-during-xi-visit-2026-09-26/"},{"label":"Reuters: summit wrap-up","url":"https://www.reuters.com/world/china/trump-wrap-up-xi-summit-with-tour-us-archives-2026-09-25/"},{"label":"CNN: summit analysis","url":"https://www.cnn.com/2026/09/25/world/xi-dc-trump-analysis-intl"},{"label":"Fox News: final symbolic stop","url":"https://www.foxnews.com/politics/xi-caps-trump-state-visit-symbolic-final-stop-before-leaving-washington"},{"label":"Drudge Report: front page","url":"https://www.drudgereport.com/"}]},{"id":"top-iran-war-vote-proposal","headline":"Iran awaits a U.S. response to its seven-day Hormuz plan as Reuters relays a report Trump rejected it","summary":"Tehran says its proposal would reopen the Strait of Hormuz and pause regional fighting within seven days, and that it was sent through Qatari mediators. Reuters says the Wall Street Journal reported Trump rejected it, citing unnamed U.S. officials; that reported rejection is not an announced U.S. decision. No ceasefire or agreement is in force, and Iran says its plan does not require nuclear concessions.","sources":["Fox","Other"],"signal":"Watch","links":[{"label":"Reuters: Iran awaits U.S. response; WSJ rejection report","url":"https://www.reuters.com/world/middle-east/iran-awaits-us-move-after-wsj-report-says-trump-rejects-peace-plan-2026-09-26/"},{"label":"AP: Iran’s seven-day proposal and conditions","url":"https://apnews.com/article/iran-us-war-negotiations-strait-hormuz-d8b9749fee99a11dd77513d326b824b6"},{"label":"Fox News: live Iran coverage","url":"https://www.foxnews.com/live-news/iran-war-strait-hormuz-trump-talks-oil-gas-prices-midterms-09-26-26"}]},{"id":"top-pacific-hurricanes","headline":"Hurricane Nolo holds at 105 mph south of Hawaii as watches remain and life-threatening rain is forecast","summary":"NHC intermediate Advisory #23A, issued 2 a.m. HST Saturday, puts Nolo nearly stationary about 145 miles south of South Point with 105-mph maximum sustained winds. A hurricane watch and tropical-storm warning remain for Hawaii County; Maui County is under a tropical-storm watch. Forecasters project 8–12 inches of rain in eastern and southern Big Island areas, locally 16 inches, with possible major-hurricane strengthening. Rainfall and intensification are forecasts, not observed totals; the center is forecast to remain south of the islands.","sources":["Other"],"signal":"Watch","links":[{"label":"NHC intermediate Advisory #23A (2 a.m. HST)","url":"https://www.nhc.noaa.gov/text/refresh/HFOTCPCP2+shtml/261147.shtml"},{"label":"NHC forecast discussion #23","url":"https://www.nhc.noaa.gov/text/refresh/HFOTCDCP2+shtml/260851.shtml"},{"label":"Hawaii Emergency Management Agency updates","url":"https://dod.hawaii.gov/hiema/tropical-storm-nolo-updates/"},{"label":"NPR: Nolo and Hawaii flood risk","url":"https://www.npr.org/2026/09/25/nx-s1-5981082/hurricane-nolo-hawaii"}]},{"id":"top-hurricane-polo-mexico","headline":"Category 5 Hurricane Polo holds 160-mph winds; NHC forecasts a powerful approach to Baja California Sur Monday","summary":"NHC intermediate Advisory #23A, issued 5 a.m. MST Saturday, reports maximum sustained winds of 160 mph and a hurricane watch from Punta Eugenia to Santa Fe. The forecast calls for Polo to turn north and approach Baja California Sur Monday, with 4–8 inches of rain and isolated totals near 10 inches. Landfall, rainfall and impacts remain forecasts, not observed outcomes.","sources":["Other"],"signal":"Watch","links":[{"label":"NHC intermediate Advisory #23A (5 a.m. MST)","url":"https://www.nhc.noaa.gov/text/refresh/MIATCPEP2+shtml/260255.shtml?text"},{"label":"NHC forecast discussion #23","url":"https://www.nhc.noaa.gov/text/refresh/MIATCDEP2+shtml/260853.shtml"},{"label":"Reuters: Polo threatens Mexico; forecast landfall Monday","url":"https://www.reuters.com/business/environment/category-5-hurricane-polo-threatens-mexicos-coast-landfall-expected-monday-2026-09-26/"},{"label":"AP: Pacific hurricanes threaten Hawaii and Mexico","url":"https://apnews.com/article/hurricane-nolo-hawaii-polo-mexico-e92145be4b564484025132cdf3d0de90"}]},{"id":"top-noreaster-new-jersey-flooding","headline":"Nor’easter floods New Jersey roads and some homes as coastal communities brace for continuing wind, rain and flooding","summary":"AP reports flooded roads and some inundated homes in New Jersey as the storm’s first major impacts emerged. New York and New Jersey declared states of emergency, Reuters reports. Further damaging wind, heavy rain and coastal flooding in parts of New England remain forecasts, not observed everywhere; conditions and travel risks are changing through the weekend.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"AP: roads and homes flood in New Jersey","url":"https://apnews.com/article/noreaster-storm-cape-cod-new-england-4057bec1ced5c4883d36c30c778df410"},{"label":"Reuters: nor’easter threat and state emergencies","url":"https://www.reuters.com/world/us/noreaster-expected-disrupt-travel-flood-basements-knock-out-power-along-us-east-2026-09-25/"},{"label":"CNN: Saturday storm coverage","url":"https://www.cnn.com/2026/09/26/weather/live-news/noreaster-weekend-storm"}]},{"id":"top-kyiv-russian-strikes","headline":"Russian strikes kill seven in Kyiv, officials say, as Ukraine’s largest steel plant halts production","summary":"Reuters reports Kyiv authorities said seven people were killed Friday, including a 14-year-old boy. ArcelorMittal said repeated strikes made it unsafe to resume production at its Kryvyi Rih plant, Ukraine’s largest steelmaker. The death toll is attributed to local authorities and the shutdown to the company; this does not mean all Ukrainian steel production has stopped.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Kyiv deaths and steel-plant shutdown","url":"https://www.reuters.com/world/europe/russian-drone-hits-central-kyiv-killing-child-injuring-least-seven-people-2026-09-25/"}]},{"id":"top-saudi-houthi-attacks","headline":"Saudi-led coalition says it intercepted two Houthi missiles and two drones aimed at Saudi targets","summary":"The Saudi-led coalition said it intercepted two ballistic missiles headed toward Khamis Mushait and two drones headed toward Riyadh early Saturday, Reuters reports. The coalition’s account was posted on X; it did not provide further details, and reporting does not establish damage at the alleged targets. Saudi, Turkish and Pakistani military chiefs also met in Riyadh amid the widening regional conflict.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Saudi coalition reports interceptions","url":"https://www.reuters.com/world/middle-east/saudi-says-it-intercepted-2-drones-launched-by-houthis-towards-riyadh-2026-09-26/"},{"label":"AP: regional developments","url":"https://apnews.com/article/yemen-saudi-arabia-houthis-missiles-d19776cf1a68b45d28b1402f3a47b8cd"}]},{"id":"top-supreme-court-missouri-map","headline":"Supreme Court blocks Missouri from using Trump-backed congressional map for a third time","summary":"The U.S. Supreme Court again barred Missouri from using a Republican-backed map in the November midterms. The decision leaves the state on track to use its 2022 congressional districts, according to AP. It is an election-law ruling, not a prediction about the outcome of any race, and it follows a rapid series of conflicting state and federal court orders.","sources":["Other"],"signal":"Consensus","links":[{"label":"Reuters: third Supreme Court block","url":"https://www.reuters.com/world/us-supreme-court-bars-republican-drawn-map-missouri-third-time-2026-09-25/"},{"label":"AP: Supreme Court rejects Missouri map","url":"https://apnews.com/article/supreme-court-missouri-redistricting-congressional-map-3f43ba5f47681ea759115fbc250712d4"}]},{"id":"top-white-house-press-access","headline":"White House leaves CNN out of Air Force One press pool despite a temporary order restoring White House access","summary":"CNN and AP report the network will not travel with President Donald Trump on Saturday’s Tennessee trip; Reuters says the Washington Post reported the decision. A judge’s separate 14-day order restored White House press passes for CNN, MS NOW and Politico, but the travel-pool dispute continues. This is not a final ruling on the outlets’ First Amendment claims.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"CNN: Air Force One travel-pool exclusion","url":"https://www.cnn.com/2026/09/25/politics/white-house-blocks-cnn-air-force-one-travel-pool"},{"label":"Reuters: White House blocks CNN from flight","url":"https://www.reuters.com/business/media-telecom/white-house-blocks-cnn-air-force-one-trip-washington-post-reports-2026-09-26/"},{"label":"AP: CNN left off Saturday trip","url":"https://apnews.com/article/white-house-media-ban-cnn-network-pool-c32504981ee2f5b3c137e57d9d36f33e"},{"label":"Reuters: judge’s temporary access order","url":"https://www.reuters.com/world/judge-lifts-trumps-white-house-ban-cnn-ms-now-politico-2026-09-24/"}]},{"id":"top-supreme-court-save-database","headline":"Supreme Court lets states use expanded federal SAVE database for voter checks while litigation continues","summary":"The Supreme Court blocked a lower-court order that had barred states from using an expanded federal immigration database for broad citizenship checks of voter registrations. Reuters reports the database’s overall error rate is unknown and voting-rights groups cite eligible citizens flagged incorrectly. The emergency ruling allows checks while litigation continues; it does not establish widespread noncitizen voting.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Supreme Court ruling","url":"https://www.reuters.com/world/supreme-court-restores-trumps-mass-voter-verification-system-2026-09-25/"},{"label":"AP: database ruling","url":"https://apnews.com/article/save-database-noncitizen-voters-trump-supreme-court-412e12f5a492dd20e407812f30f7c139"}]}],"usa":[{"id":"usa-pittsburgh-doctor-killed","headline":"Pittsburgh pediatrician Idris Evans is killed in a home attack; his wife is critically injured, officials say","summary":"Authorities say a man entered the home and stabbed the physician and his wife while they slept; the suspect was detained. The investigation is ongoing, and the account of the attack is attributed to law enforcement.","sources":["CNN","Fox","Other"],"signal":"Consensus","links":[{"label":"CNN: Pittsburgh investigation","url":"https://www.cnn.com/2026/09/25/us/pittsburgh-doctor-idris-evans-stabbing-home"},{"label":"PennLive: local report","url":"https://www.pennlive.com/crime/2026/09/upmc-childrens-hospital-physician-killed-in-stabbing-suspect-detained.html"}]},{"id":"usa-copenhaver-death","headline":"James Copenhaver, wounded in the 2024 Butler rally shooting, dies from injury complications","summary":"Copenhaver, 76, was one of two people wounded when a gunman opened fire at then-candidate Donald Trump’s Pennsylvania rally in July 2024. His lawyer said he died from complications related to those injuries; the death brings renewed attention to the attack’s victims.","sources":["Fox","Other"],"signal":"Consensus","links":[{"label":"AP: Copenhaver’s death","url":"https://apnews.com/article/james-copenhaver-trump-rally-butler-dies-00866b37ad8db967b4ebf6582c756bcd"},{"label":"CBS Pittsburgh","url":"https://www.cbsnews.com/pittsburgh/news/jim-copenhaver-trump-rally-assassination-attempt-victim-dies/"},{"label":"Fox News","url":"https://www.foxnews.com/politics/james-copenhaver-man-shot-trump-butler-rally-dies-complications-from-injuries-report"}]},{"id":"usa-ole-miss-deaths","headline":"Two Ole Miss student deaths remain under investigation; kratom found at the scene does not establish a cause","summary":"Authorities are investigating the deaths of two students, and reporting says kratom was found at the scene. Investigators have not established that the substance caused either death; the cases remain under investigation.","sources":["CNN","Fox","Other"],"signal":"Watch","links":[{"label":"AP: deaths and kratom","url":"https://apnews.com/article/kratom-mississippi-deaths-students-5c4d6429e65b573b2667119a8f860ddb"},{"label":"CNN: Ole Miss deaths","url":"https://www.cnn.com/2026/09/24/us/ole-miss-student-deaths-wwk"},{"label":"Fox News","url":"https://www.foxnews.com/us/ole-miss-victim-identified-narcotics-task-force-probes-two-student-deaths"}]},{"id":"usa-evanston-ice-detention","headline":"U.S. citizen says ICE agents mistakenly detained and injured him in Evanston","summary":"A U.S. citizen says immigration agents wrongly detained and injured him; local police and the man have offered accounts of the encounter. The claim is disputed and under scrutiny, not a court finding about the agents’ conduct.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"CNN: Evanston detention","url":"https://www.cnn.com/2026/09/24/us/ice-us-citizen-detained-evanston"},{"label":"AP: local account","url":"https://apnews.com/article/chicago-illinois-ice-immigration-agents-evanston-police-2e07d80e8d96685489e914880a4e4d5"}]},{"id":"usa-usda-meat-recall","headline":"USDA recalls more than 167,000 pounds of meat produced without federal inspection","summary":"The Food Safety and Inspection Service says Star Meat Delivery recalled raw pork, beef and goat products that were produced without federal inspection. Check the agency’s recall notice for affected labels, lot details and handling instructions.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"USDA-FSIS recall notice","url":"https://www.fsis.usda.gov/recalls-alerts/star-meat-delivery-inc--recalls-raw-pork-beef-and-goat-products-produced-without"},{"label":"CNN: recall coverage","url":"https://www.cnn.com/2026/09/24/us/meat-recall-usda-star-meat-delivery-hnk"}]},{"id":"usa-meta-cambridge-analytica-jury","headline":"New Mexico jury finds Meta misled users about Facebook data practices in Cambridge Analytica case","summary":"A Santa Fe jury found 26 of 29 statements identified by New Mexico to be misleading, including statements about data practices, hate speech and misinformation; it rejected some other claims. The verdict concerns a state case arising from the Cambridge Analytica scandal. A judge will determine civil penalties, so the verdict is not a final damages award or a finding that Facebook sold every user’s data.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: jury verdict","url":"https://www.reuters.com/business/meta-misled-consumers-case-over-cambridge-analytica-scandal-new-mexico-jury-says-2026-09-25/"},{"label":"AP: case background and trial","url":"https://apnews.com/article/facebook-meta-new-mexico-privacy-lawsuit-8b414eb0a14d58d7cdc6ae752e25dcb0"}]},{"id":"usa-lincoln-sailor-mental-health","headline":"Navy says eight USS Lincoln carrier-group sailors attempted suicide during deployment","summary":"The Navy disclosed eight suicide attempts among sailors assigned to the USS Abraham Lincoln carrier group during deployment. The report raises questions about the strain of service; it does not identify individual sailors, and care resources are available through military and civilian crisis services.","sources":["Other"],"signal":"Watch","links":[{"label":"AP: Navy disclosure","url":"https://apnews.com/article/uss-lincoln-aircraft-carrier-suicide-attempts-iran-7bb8316aa4fd67e6d2c8b34c029eebda"}]},{"id":"usa-tiktok-alabama-settlement","headline":"TikTok settles Alabama’s teen-harm lawsuit on eve of the first state trial over the claims","summary":"Reuters reports TikTok and ByteDance reached a settlement with Alabama over allegations that the platform was designed to addict children and that the companies misled consumers about safety. The Alabama attorney general’s office says the state will receive at least $100 million within 45 days, with potential payments up to $300 million if conditions are met. This is a settlement before trial, not a court finding that every allegation was proven.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Alabama settlement and terms","url":"https://www.reuters.com/world/us/tiktok-settles-with-alabama-ahead-first-state-trial-over-claims-teen-harms-2026-09-25/"}]},{"id":"usa-kalshi-sixth-circuit-ruling","headline":"Appeals court says states may regulate Kalshi sports-event contracts under gambling laws","summary":"Reuters reports the 6th U.S. Circuit Court of Appeals ruled that Ohio and Tennessee gambling laws were not preempted by federal law and that Kalshi had not shown its sports-event contracts were swaps subject exclusively to Commodity Futures Trading Commission regulation. The ruling is a circuit-court decision; broader litigation and regulatory questions remain.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: 6th Circuit ruling","url":"https://www.reuters.com/business/finance/us-appeals-court-rules-against-kalshi-says-states-can-regulate-prediction-2026-09-25/"}]},{"id":"usa-tasia-fortune-investigation","headline":"Mississippi police say Tasia Fortune’s death was staged after a drug dispute; case remains under investigation","summary":"An Associated Press report says a Jackson police detective testified that investigators believe Fortune was killed during a drug dispute and that her body was hung in a staged scene. These are police allegations and testimony in an ongoing criminal case, not a final court finding about motive or guilt.","sources":["Other"],"signal":"Watch","links":[{"label":"AP report via Boston Herald","url":"https://www.bostonherald.com/2026/09/25/tasia-fortune-death-staged/"},{"label":"AP report via WPSD Local 6","url":"https://www.wpsdlocal6.com/news/tasia-fortunes-hanging-was-staged-after-her-death-in-a-drug-dispute-mississippi-police-say/article_a8197c4e-b146-4b9a-ae35-11f691131480.html"}]}],"world":[{"id":"world-bangkok-flood-disaster-zone","headline":"Bangkok declares a disaster zone after nearly 12 inches of rain floods roads and homes","summary":"Reuters reports Bangkok’s governor declared the Thai capital a disaster-affected zone Saturday after nearly 300 millimeters (12 inches) of rain fell in 48 hours. Roads flooded, residents were advised to avoid unnecessary travel and schools opened as shelters; Suvarnabhumi Airport was operating normally. Further thunderstorms are forecast.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Bangkok flooding and disaster declaration","url":"https://www.reuters.com/business/environment/thai-capital-bangkok-declared-disaster-zone-amid-flooding-2026-09-26/"}]},{"id":"world-athens-building-collapse-update","headline":"Athens building collapse death toll rises to six after Friday explosion, Reuters reports","summary":"Reuters reports six people died after an explosion destroyed a building in central Athens. The cause remains unclear; the mayor said gas infrastructure was a possibility, but that has not been established. Casualty and cause details remain attributed to Greek officials.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: updated Athens death toll","url":"https://www.reuters.com/world/one-dead-5-missing-after-explosion-destroys-building-athens-2026-09-26/"}]},{"id":"world-pakistan-dera-ismail-khan-blast","headline":"Blast in Pakistan’s Dera Ismail Khan kills 11 and injures 30, emergency service says","summary":"Rescue 1122 said 11 people were killed and 30 injured in Saturday’s blast in northwestern Pakistan. The Tehreek-e-Taliban Pakistan claimed responsibility. The casualty count is attributed to the emergency service; the militant group’s claim has not been independently established.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: blast kills 11, injures 30","url":"https://www.reuters.com/world/asia-pacific/blast-pakistans-dera-ismail-khan-kills-11-injures-30-2026-09-26/"}]},{"id":"world-catania-airport-etna-ash","headline":"Flights suspended at Italy’s Catania airport through Sunday morning as Etna ash and weather disrupt arrivals","summary":"The company operating Sicily’s Catania airport said arrivals were suspended until 10:00 GMT Sunday because of volcanic ash from Mount Etna and weather conditions. The restriction is a current disruption, not a forecast that the airport will remain closed afterward.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Catania airport suspends arrivals","url":"https://www.reuters.com/business/environment/italys-catania-airport-shuts-etna-ash-halts-flights-2026-09-26/"}]},{"id":"world-india-voter-roll-software-review","headline":"India’s Election Commission orders a review of voter-roll software after report of disputed changes","summary":"The Election Commission ordered a review after a newspaper reported that senior commissioners questioned changes to voter lists that allegedly excluded millions. Opposition parties allege manipulation to benefit Prime Minister Narendra Modi’s BJP; the Commission says its actions were lawful and differences normal. A review is under way, and manipulation is not established.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Election Commission orders software review","url":"https://www.reuters.com/world/india/indias-election-commission-orders-review-voter-roll-changes-2026-09-26/"}]},{"id":"world-congo-ebola-health-staff","headline":"WHO says Congo lacks health workers as Ebola outbreak remains uncontrolled in some provinces","summary":"WHO says treatment centers are short of staff and cases have surged in North Kivu, even as case counts fell in some other provinces. The agency describes a fast-moving outbreak with uneven transmission, not a uniform rise across the country.","sources":["Other"],"signal":"Watch","links":[{"label":"PBS/AP: WHO warning","url":"https://www.pbs.org/newshour/health/congo-faces-health-worker-shortage-as-ebola- mes associated with Trump as midterms approach. The story concerns the ad and its funding; it does not by itself establish an election-law violation.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"AP: government-funded ad","url":"https://apnews.com/article/paid-by-us-government-ad-midterms-04b3fe552fc3de2ada0b14394706e0e0"},{"label":"CNN audio report","url":"https://www.cnn.com/audio/podcasts/laura-coates-live/episodes/bb924b10-b5a4-11f0-a02e-af90e7b5928b"}]},{"id":"politics-ohio-citizenship-voter-law","headline":"Federal appeals court reinstates Ohio’s documentary-citizenship requirement for voter registration","summary":"Reuters reports the appeals court revived the state requirement while litigation proceeds. The order reinstates a law; it is not evidence that noncitizens voted in significant numbers.","sources":["Other"],"signal":"Consensus","links":[{"label":"Reuters: appeals court ruling","url":"https://www.reuters.com/legal/government/us-appeals-court-reinstates-ohio-law-requiring-voters-prove-citizenship-2026-09-24/"}]},{"id":"politics-california-ballots","headline":"California Supreme Court orders Riverside County sheriff to return 650,000 seized ballots","summary":"AP reports the state high court ordered the sheriff to return ballots seized from a 2025 special election. The ruling concerns the legality and custody of those ballots; it does not change the certified election result or substantiate claims of fraud.","sources":["Other"],"signal":"Consensus","links":[{"label":"AP: California ballot order","url":"https://apnews.com/article/sheriff-ballots-seized-california-supreme-court-e77a7eda321df80fa69da835e925e5b0"}]},{"id":"politics-new-jersey-lt-governor-resigns","headline":"New Jersey Lt. Gov. Dale Caldwell resigns after investigation found ethical violations; he disputes the report","summary":"Gov. Mikie Sherrill said Caldwell resigned Friday after an independent investigation found he behaved inappropriately with women and committed other ethical violations. The report’s findings and allegations remain attributed; Caldwell’s attorney says he challenges the report and is exploring legal remedies. Acting Comptroller Shirley Emehelu was named acting lieutenant governor.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: resignation and investigation","url":"https://www.reuters.com/world/us/new-jerseys-lieutenant-governor-resigns-amid-sexual-harassment-findings-2026-09-25/"},{"label":"NBC News: report and resignation","url":"https://www.nbcnews.com/politics/politics-news/new-jersey-lieutenant-governor-resigns-ethics-report-rcna599885"}]},{"id":"politics-michigan-doorstep-midterms","headline":"Republican door-knockers pitch a Democrats-as-extremists message in a close Michigan race, Reuters reports","summary":"Reuters accompanied Americans for Prosperity Action canvassers mobilizing voters for Republican Mike Rogers. The story describes a campaign strategy with mixed success on the doors, not a poll or an election result.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Michigan door-to-door campaign","url":"https://www.reuters.com/world/us/michigan-doorsteps-republicans-sell-democrats-as-extremists-message-with-mixed-2026-09-26/"}]},{"id":"politics-trump-pocket-rescission-800m","headline":"Trump seeks to withhold more than $800 million in Congress-approved funds; Sen. Susan Collins calls move illegal","summary":"Reuters reports the White House is using a rarely used “pocket rescission” to withhold approved spending for immigration, race, education, refugee assistance, minority-business development and overseas conservation programs. The administration says it is cutting wasteful spending; Sen. Susan Collins, who chairs Appropriations, calls withholding the funds without congressional approval illegal. The constitutional power-of-the-purse dispute remains unresolved.","sources":["Other"],"signal":"Split","links":[{"label":"Reuters: pocket rescission and Collins response" her"],"signal":"Consensus","links":[{"label":"AP: Swift release","url":"https://apnews.com/article/taylor-swift-new-music-patient-zero-934935f049893d0567713bea516f2c0c"},{"label":"Variety: album and video","url":"https://variety.com/2026/music/news/taylor-swift-reveals-life-of-showgirl-encore-new-songs-1236872982/"},{"label":"Variety: video details","url":"https://variety.com/2026/music/news/taylor-swift-patient-zero-music-video-dakota-johnson-colin-farrell-1236874206/"}]},{"id":"entertainment-different-world-netflix","headline":"Netflix’s “A Different World” sequel premieres with the original HBCU setting in focus","summary":"The sequel to the 1980s campus sitcom is available on Netflix Friday, bringing a new generation to the fictional Hillman College setting. The premiere is confirmed; audience response is not yet known.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"CNN: sequel premiere","url":"https://www.cnn.com/2026/09/24/entertainment/a-different-world-reboot-netflix"},{"label":"AP: sequel","url":"https://apnews.com/article/a-different-world-sequel-f0f23537d211e084dfb53999c3a4a367"}]},{"id":"entertainment-paramount-wbd-settlement-challenge","headline":"Merger opponents ask a court to reject Paramount’s settlement tied to its Warner Bros. bid","summary":"Variety reports opponents urged a court to reject a settlement connected to Paramount’s proposed Warner Bros. bid. The filing is an argument for the judge to consider; it is not a ruling on the merger or a completed acquisition.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety: court challenge","url":"https://variety.com/2026/tv/global/block-the-merger-amicus-brief-reject-settlement-1236875410/"},{"label":"Variety: settlement terms","url":"https://variety.com/2026/film/news/paramount-states-settlement-terms-warner-bros-1236871264/"}]},{"id":"entertainment-macklemore-charity-tour","headline":"Macklemore announces a tour supporting Palestinian aid organizations","summary":"Macklemore says proceeds from his planned “Free Palestine” shows will support aid organizations. The tour announcement is confirmed; the performances and any eventual distributions have not yet occurred.","sources":["Other"],"signal":"Watch","links":[{"label":"AP: tour announcement","url":"https://apnews.com/article/macklemore-free-palestine-shows-ed-sheeran-65a65a362e530dfe739ddb626dc16d23"},{"label":"Variety: tour details","url":"https://variety.com/2026/music/news/macklemore-free-palestine-tour-1236874352/"}]},{"id":"entertainment-farm-aid-2026","headline":"Farm Aid 2026 brings Willie Nelson, Neil Young and other musicians to Virginia Beach today","summary":"The annual benefit is scheduled for Saturday, Sept. 26, at Veterans United Home Loans Amphitheater in Virginia Beach, with Willie Nelson, Neil Young, John Mellencamp, Dave Matthews and others on the lineup. CNN says its live special is scheduled for 7–11 p.m. ET. The performance is upcoming at the 10 a.m. edition check.","sources":["Other"],"signal":"Watch","links":[{"label":"Farm Aid: festival and lineup","url":"https://www.farmaid.org/festival/lineup/"},{"label":"Farm Aid: how to watch","url":"https://www.farmaid.org/blog/how-to-watch-farm-aid-2026/"},{"label":"CNN: live broadcast details","url":"https://cnnpressroom.blogs.cnn.com/2026/08/20/cnn-brings-farm-aid-live-to-audiences-nationwide-on-saturday-september-26-at-7pm-et/"}]},{"id":"entertainment-ed-sheeran-gillette-canceled","headline":"Ed Sheeran cancels Friday and Saturday Gillette Stadium shows as nor’easter approaches","summary":"Gillette Stadium and the promoter announced that Sheeran’s two Foxborough concerts scheduled for Sept. 25–26 were canceled because of the impending nor’easter. The venue says refunds are available through the point of purchase; no replacement dates were announced in the cited notice.","sources":["Other"],"signal":"Consensus","links":[{"label":"Gillette Stadium official cancellation notice","url":"https://www.gillettestadium.com/events/ed-sheeran-loop-tour/"},{"label":"NBC Boston/AP: cancellation report","url":"https://www.nbcboston.com/news/local/ed-sheeran-gillette-stadium-loop-tour/4020701/"}]},{"id":"entertainment-vmas-sunday-guide","headline":"2026 MTV Video Music Awards are set for Sunday as Taylor Swift prepares to become the show’s most-awarded artist","summary":"The Associated Press’s event guide says the Sept. 27 show will give Swift the inaugural Artist Director Honors, which would break her tie with Beyoncé for most-awarded artist in VMA history. This is a preview and expected milestone, not a completed ceremony or award result.","sources":["Other"],"signal":"Watch","links":[{"label":"AP: 2026 MTV VMAs guide","url":"https://apnews.com/article/mtv-video-music-awards-2026-guide-711f84857a0d65730696adf0ebdfa9a8"},{"label":"MTV: VMA show information","url":"https://www.mtv.com/vma"}]}]},"researchNotes":["Fresh public-web research was checked for the Saturday, September 26, 2026, 10:00 a.m. EDT Boston edition. Fox News, CNN and Drudge Report front pages were inspected, along with direct Reuters, AP, NOAA/NHC, official MLB/NHL/team schedules, ESPN, PGA Tour and Farm Aid sources. Drudge is treated as an aggregator, not independent reporting.","Outlet comparison: Fox’s front page/live Iran coverage emphasizes the Iran standoff, oil/energy risk, claimed Chinese military support and the Houthi threat. CNN’s current homepage leads with the nor’easter and features China’s AI pitch, Senate-race concerns and the White House/CNN press-pool dispute. Drudge foregrounds Republican/midterm weakness, poll and economic anxiety, storm threats, CNN’s exclusion and a “pomp versus progress” summit frame. The outlets broadly agree that the summit, Iran, storm threats and press-access dispute are significant; their emphasis differs. The Fox and CNN scrape outputs were large/truncated, so comparison relies on the visible headline/link extracts; Drudge’s page was readable.","Trump–Xi: Reuters reports China’s Foreign Ministry claimed an eight-point consensus with a $30 billion reciprocal tariff-reduction arrangement, AI dialogue/incident channel and trade council, while the U.S. Embassy had not responded. These are Beijing’s stated understandings, not verified U.S. agreement or completed implementation. Reuters separately described the Friday summit ending with a two-month trade-truce extension and little detailed public progress.","Iran: Tehran says its seven-day proposal would reopen Hormuz and pause regional fighting. Reuters relays a Wall Street Journal report citing unnamed U.S. officials that Trump rejected it; that is a sourced report, not an announced U.S. decision. No accepted ceasefire or agreement is reported.","Nolo: NHC intermediate Advisory #23A, issued 2:00 a.m. HST Saturday (8:00 a.m. EDT), reports 105-mph winds, a nearly stationary center about 145 miles south of South Point, and Hawaii County watches/warnings. It forecasts 8–12 inches of rain, locally 16 inches, in eastern/southern Big Island areas and possible further strengthening. Flood totals and intensification remain forecasts. Polo: NHC intermediate Advisory #23A, issued 5:00 a.m. MST (8:00 a.m. EDT), reports Category 5 status and 160-mph winds. Reuters and NHC forecast a Monday Baja California Sur approach and 4–8 inches of rain, locally 10 inches; impacts and landfall are forecasts.","The nor’easter has produced observed flooding on New Jersey roads and in some homes, per AP; New York and New Jersey declared emergencies. Broader wind, rainfall and coastal-flood impacts remain forecasts. Reuters attributes the Kyiv toll of seven to local authorities and the Kryvyi Rih plant pause to ArcelorMittal. Saudi interception details are attributed to the Saudi-led coalition; reported impact/damage at the alleged targets is not independently confirmed.","The Supreme Court’s Missouri map ruling is separate from its emergency order allowing states to use the expanded SAVE database while that case continues. The Missouri decision bars the new Republican-backed map for November; AP says Missouri is on track to use its 2022 districts. The SAVE ruling does not establish widespread noncitizen voting. The temporary 14-day press-credential order also does not resolve CNN’s separate travel-pool exclusion or First Amendment litigation.","International updates: Reuters says six people died in the Athens building collapse; the cause is unresolved. Reuters reports 11 killed and 30 injured in Pakistan’s Dera Ismail Khan blast based on Rescue 1122; the TTP claimed responsibility. India’s Election Commission ordered a software review after a report alleging voter-list exclusions; opposition allegations and the Commission’s denial remain attributed. Etna ash and weather suspended arrivals at Catania airport until 10:00 GMT Sunday. Bangkok’s disaster declaration followed heavy observed rain and flooding; additional storms are forecasts.","Boston score check: ESPN confirms the Red Sox beat the Cubs 4–3 and 2–0 Friday, Sept. 25; MLB’s official Game 2 story confirms the shutout. ESPN and the NHL game center confirm Washington beat the Bruins 3–2 in overtime in preseason Friday. These are the two Boston teams that played the prior night and lead this tab. The Patriots and Celtics did not play Friday; no score is implied. Boston College–Virginia Tech is scheduled for noon Saturday and had not begun by 10 a.m. EDT.","Sports and entertainment: the Texas–Tennessee card is an upcoming preview, not a result. Official Farm Aid and CNN press materials confirm the Saturday Virginia Beach benefit and a CNN live special from 7–11 p.m. ET; no performance is reported as completed at 10 a.m. The remaining cards distinguish completed results/releases and cancellations from previews, plans and pending court proceedings.","All seven tabs are intended to contain 10/10/10/7/9/5/7 unique stories, each with at least one direct HTTP(S) link; no duplicate story IDs or normalized headlines. General Sports excludes Boston teams, auto racing and international soccer."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['world','World'],['politics','Politics'],['sports','Sports'],['boston','Boston Sports'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated in Top News.',world:'10 world stories not repeated in Top News.',sports:'No Boston teams, auto racing, or international soccer.',boston:'Boston teams and local sports only.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
</body></html>
