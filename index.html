<script id="briefing" type="application/json">{"date":"2026-10-06","lastUpdated":"October 6, 2026, 7:09:53 p.m. EDT Boston","dek":"Tuesday’s evening briefing: final indexes set records as Iran-war risk, Yemen’s brutal front, AI investment and Hollywood consolidation reshape the day.","take":"Fox emphasizes Trump’s claims of U.S. military advantage and a quick end to the Iran war; CNN foregrounds backlash to his Los Angeles and San Diego remarks, while Drudge amplifies alarmist links about those remarks. Drudge is an aggregator, not an independent reporting source. Reuters’ late-day interview adds Vance’s stated enrichment condition; the reported helicopter crash was denied by CENTCOM, espionage and treason accusations remain allegations, and the UAE arms approval is not delivery.","sectionTakes":{"top":"Fox emphasizes Trump’s claims of U.S. military advantage and a quick end to the Iran war; CNN foregrounds backlash to his Los Angeles and San Diego remarks, while Drudge amplifies alarmist links about those remarks. Drudge is an aggregator, not an independent reporting source. Reuters’ late-day interview adds Vance’s stated enrichment condition; the reported helicopter crash was denied by CENTCOM, espionage and treason accusations remain allegations, and the UAE arms approval is not delivery.","usa":"The domestic file includes a high-stakes execution failure, school-bus deaths, an addiction-liability verdict, outbreaks and unresolved investigations. Pike’s lawyers say she is conscious after Tennessee halted the attempted execution; her prognosis and the consequences of the state review remain unsettled. The jury verdict, reported disease cases and official explanations should not be mistaken for final resolution of every related legal or public-health issue.","boston":"No Red Sox, Patriots, Bruins or Celtics game is scheduled Tuesday, Oct. 6 (checked 7:09 p.m. EDT). The Bruins’ 4–1 loss and Patriots’ 29–26 win are final; the Red Sox ended 87–75 before a 2–0 Yankees Wild Card sweep, and the next games are Bruins–Utah and Celtics–Cleveland Thursday plus Patriots–Las Vegas Sunday. The Globe’s new receiver-injury report and its Oct. 6 Bruins/Red Sox coverage were checked; Globe articles are partly paywalled, and WEEI/Audacy access remains mostly headlines and show metadata because the site page shell exposed little full article text.","business":"Tuesday, Oct. 6 cash-market closes are confirmed in after-close reporting: Reuters gives the Dow 51,521.04 (+253.14; +0.49%) and Nasdaq Composite 27,599.79 (+122.48; +0.45%). AP matches the Nasdaq but reports the Dow at 51,521.28 (+253.38) and rounds the moves to +0.5% and +0.4%; both are final close reports, and the 24-cent Dow difference is retained. Stocks advanced as oil steadied and Treasury yields eased, while AI demand, a large reported SpaceX financing plan and FICO’s workforce cuts show the uneven forces beneath the rally.","world":"Reuters verified video that appears to show Yemeni government fighters running over unarmed Houthi opponents; the brigade says it is investigating, and territorial claims remain contested. Zelenskiy says Ukrainian intelligence expects a major Russian attack, an attributed warning rather than an independently confirmed plan. Elsewhere, shipping risks, nuclear signaling and regional political shifts remain in focus.","sports":"The Dodgers and Braves are tied 0–0 in the third inning of NLDS Game 3 at the latest ESPN check; the Padres–Brewers game remains scheduled for later Tuesday. Baseball’s postseason, WNBA semifinals and league-level roster and officiating developments lead the slate, with no Boston teams, auto racing or international soccer.","politics":"Ohio’s midterm early voting is underway, while Arizona officials describe a limited ballot error and Trump continues to urge mail voting despite past fraud claims. Sen. Murphy says the Pentagon denied him access to a Qatar base and a war briefing; DoD says the travel directive was applied as announced. Vance’s campaign, super-PAC and defense-industry stories remain relevant, but campaign rhetoric and official claims are not policy outcomes.","entertainment":"The $110 billion Paramount Skydance–Warner Bros. Discovery takeover is now confirmed closed, creating a media group with about $80 billion in debt and a $6 billion savings target. Job losses and the planned streaming combination remain forward-looking, while the Emmy move to Prime Video and Hollywood labor concerns show the wider industry’s continued consolidation."},"sections":{"top":[{"id":"top-trump-iran-cities-oct6","headline":"White House says Trump was warning of Iran threat, not urging attacks on U.S. cities","summary":"After President Donald Trump said at a Monday Nebraska rally that Iran could “take out” Los Angeles or San Diego, the White House said he meant the cities would be at risk if Iran had a nuclear weapon. California Gov. Gavin Newsom directed the state threat center to monitor for foreign actors interpreting the remark as an invitation; the White House explanation is the administration’s characterization, not an independently established threat assessment.","links":[{"label":"BBC — White House defense of Trump’s remarks, Oct. 6","url":"https://www.bbc.com/news/articles/c6r7yn8pknyxo"},{"label":"CNN — Trump’s remarks draw backlash, Oct. 6","url":"https://www.cnn.com/2026/10/06/politics/trump-backlash-iran-los-angeles-san-diego"},{"label":"Fox News — Trump’s Iran remarks, Oct. 6","url":"https://www.foxnews.com/live-news/iran-war-trump-oil-prices-fall-middle-east-10-06-26"},{"label":"Drudge Report — aggregator roundup, Oct. 6","url":"https://www.drudgereport.com/"}],"sources":["Fox","CNN","Other","Drudge"],"signal":"Split"},{"id":"top-centcom-helicopter-denial-oct6","headline":"CENTCOM denies Iranian report of U.S. Navy helicopter crash near Saudi Arabia","summary":"Iranian state television reported that a U.S. Navy MH-60R Seahawk had crashed in the Red Sea after an emergency near Saudi Arabia. CENTCOM said the report was false and all U.S. aircraft and personnel in the region were accounted for; the reported flight-tracking disappearance is not confirmation of a crash.","links":[{"label":"Fox News live — CENTCOM denial, Oct. 6","url":"https://www.foxnews.com/live-news/iran-war-trump-oil-prices-fall-middle-east-10-06-26"},{"label":"Al Jazeera live — CENTCOM rejects crash report, Oct. 6","url":"https://www.aljazeera.com/news/liveblog/2026/10/6/iran-war-live-yemen-forces-reclaim-strategic-port-city-mocha-from-houthis"}],"sources":["Fox","Other"],"signal":"Watch"},{"id":"top-vance-iran-enrichment-oct6","headline":"Vance says Iran must stop enrichment for war to end, in Reuters interview","summary":"Vice President JD Vance said Iran would have to cut enrichment to end the war, Reuters reported after an interview conducted Monday and published Tuesday evening. The statement sets out Vance’s position; it does not establish an agreed U.S. negotiating framework or a response from Tehran.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — Vance interview and Iran conditions, Oct. 6","url":"https://www.reuters.com/world/interview-us-vice-president-vance-says-iran-must-cut-enrichment-end-war-2026-10-06/"}]},{"id":"top-hormuz-attack-oct6","headline":"India says 12 sailors injured after projectile strikes vessel near Hormuz","summary":"India’s foreign ministry said a projectile hit the Panama-flagged MT On Peace while it was transiting the Strait of Hormuz and injured 12 crew, including 11 Indian nationals; Oman helped evacuate them. India dated the incident Tuesday, while UKMTO’s late report, carried by Al Jazeera, describes an outbound oil tanker hit Monday. The discrepancy is unresolved and responsibility remains unknown.","links":[{"label":"Al Jazeera — India reports 12 crew injured off Oman, Oct. 6","url":"https://www.aljazeera.com/news/liveblog/2026/10/6/iran-war-live-yemen-forces-reclaim-strategic-port-city-mocha-from-houthis"},{"label":"Ind  not an execution; the linked reports describe the decision, not a completed sentence.","sources":["Fox","Other"],"signal":"Watch","links":[{"label":"AP — Trump approves execution, Oct. 6","url":"https://apnews.com/article/trump-nadal-hasan-fort-hood-execution-6ab1d9cfb936d00d17c02105ea0a0ead"},{"label":"Reuters — Fort Hood execution order, Oct. 6","url":"https://www.reuters.com/world/us/trump-orders-firing-squad-gunman-who-killed-13-people-fort-hood-texas-2026-10-06/"},{"label":"Fox News — Trump clears firing-squad execution, Oct. 6","url":"https://www.foxnews.com/politics/trump-clears-way-fort-hood-terrorist-face-army-firing-squad-nearly-17-years-after-massacre"}]},{"id":"top-fairford-bombers-oct6","headline":"U.S. moves B-1 bombers after suspected RAF Fairford plot; U.K. makes new arrest","summary":"The United States moved all B-1 bombers from RAF Fairford after an incident and reported possible drone threat near the base. U.K. counterterrorism police said they arrested another suspect Tuesday, bringing arrests to six; all six had been released on bail as of the latest account. Officials described the bomber redeployment as precautionary, and reporting has not established Iranian responsibility or an imminent attack.","links":[{"label":"AP — bombers removed from RAF Fairford, Oct. 6","url":"https://apnews.com/article/bombers-raf-fairford-iran-5280111d976b89a6245f277e8b899f8f"},{"label":"Al Jazeera — police report another arrest, Oct. 6","url":"https://www.aljazeera.com/news/liveblog/2026/10/6/iran-war-live-yemen-forces-reclaim-strategic-port-city-mocha-from-houthis"},{"label":"Sky News — reported possible drone threat near RAF Fairford, Oct. 6","url":"https://news.sky.com/story/us-removes-all-air-force-bombers-from-raf-fairford-after-suspected-terror-plot-13595162"}],"sources":["Other"],"signal":"Watch"}],"usa":[{"id":"usa-cornell-no-confidence-oct6","headline":"Cornell faculty plan no-confidence vote amid scrutiny of sexual-assault response","summary":"Faculty members at Cornell are planning a no-confidence vote on the university administration as protests continue over its handling of a reported gang-rape case. The allegations remain under investigation and have not been adjudicated; CNN and AP describe different parts of the campus response.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"CNN — faculty no-confidence vote, Oct. 6","url":"https://www.cnn.com/2026/10/06/us/cornell-no-confidence-vote-rape-case-hnk"},{"label":"AP — students protest Cornell response","url":"https://apnews.com/article/cornell-university-rape-investigation-70d74249bc779480975f3b2a4166ee97"}]},{"id":"usa-florida-schoolbus-crash-oct6","headline":"Two die, including a student, after Florida school bus overturns","summary":"Two people, including a student, died after a school bus rolled over in Florida, according to AP. Authorities were investigating the crash; the initial report did not establish a cause.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — Florida school bus crash, Oct. 6","url":"https://apnews.com/article/florida-school-bus-crash-cce0599ea5e01f0d30fb9457bd50b7e4"}]},{"id":"usa-iran-strike-medical-care-oct6","headline":"Wounded U.S. soldiers say military medical system failed them after Iranian drone strike","summary":"AP interviews with seriously wounded service members describe gaps in care after a deadly Iranian drone attack, while soldiers and Gold Star families press Army leadership for answers. The reporting documents their accounts and allegations; it is not a completed Army finding.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — wounded soldiers describe medical-care failures","url":"https://apnews.com/article/iran-war-soldiers-wounded-military-port-shuaiba-f867128532cb6746c26636c2dbaea2fb"},{"label":"AP — families press Army leadership","url":"https://apnews.com/article/iran-war-port-shuaiba-attack-soldiers-29f34587c6361261f6e803aff6791e8f"}]},{"id":"usa-social-media-addiction-verdict-oct6","headline":"Jury finds Instagram and YouTube liable in landmark social-media addiction trial","summary":"A jury found Instagram and YouTube liable in a case alleging their products harmed a young user, AP reports. The verdict is a significant legal development, but any damages and further appeals remain separate from the liability finding.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — social-media addiction trial verdict","url":"https://apnews.com/article/social-media-addiction-trial-la-5e54075023d837ccdc76c4ca512e9251"}]},{"id":"usa-pennsylvania-measles-oct6","headline":"Pennsylvania measles outbreak is the largest in decades, AP reports","summary":"Pennsylvania is experiencing its largest measles outbreak in decades, AP reports, amid continuing spread and public-health response. Case counts and exposure alerts can change; follow state health updates for current totals.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — Pennsylvania outbreak, Oct. 6","url":"https://apnews.com/article/measles-outbreak-pennsylvania-4cae9e5cd28a164a07ac69147505b763"}]},{"id":"usa-ny-measles-emergency-oct6","headline":"New York declares disaster emergency over measles outbreak","summary":"New York declared its first measles disaster emergency since the 2025 surge, Reuters reports. The designation is a public-health response, not an indication that the outbreak has ended.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — New York measles emergency, Oct. 5","url":"https://www.reuters.com/business/healthcare-pharmaceuticals/new-york-declares-disaster-emergency-over-measles-outbreak-2026-10-05/"}]},{"id":"usa-coast-guard-border-shooting-oct6","headline":"Mexico seeks evidence after U.S. reports Coast Guard personnel came under fire","summary":"U.S. officials said Coast Guard personnel encountered gunfire near the border, while Mexican authorities requested evidence about the incident. The claims and cross-border investigation remain unres line applies to those officials; it does not reverse game results.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — NFL official suspensions, Oct. 6","url":"https://apnews.com/article/officials-suspended-seeman-mcbride-hill-wilson-59e1487cebaf44635e6939a1d19e6c2b"}]}],"politics":[{"id":"politics-ohio-early-voting-oct6","headline":"Ohio early voting begins with control of Congress at stake","summary":"Early voting starts Tuesday in Ohio, where one Senate seat and two House districts are rated toss-ups, Reuters reports. The Nov. midterms will determine congressional control; voting has begun but no election results are available.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — Ohio early voting, Oct. 6","url":"https://www.reuters.com/world/us/ohio-early-voting-begins-with-us-congress-control-line-2026-10-06/"}]},{"id":"politics-trump-mail-voting-oct6","headline":"Trump urges supporters to vote by mail despite years of fraud claims","summary":"President Trump encouraged supporters to vote by mail, a change from his repeated claims that the practice is vulnerable to fraud, Reuters reports. His shift in messaging does not alter state voting laws or establish fraud levels.","sources":["Other"],"signal":"Split","links":[{"label":"Reuters — Trump urges mail voting, Oct. 6","url":"https://www.reuters.com/world/us/trump-urges-supporters-vote-by-mail-despite-fraud-claims-2026-10-06/"},{"label":"AP — election rhetoric and voting, Oct. 6","url":"https://apnews.com/article/trump-voting-elections-prosecute-dangerous-rhetoric-2ed9908e82075705f4b00ec93fa3fa"}]},{"id":"politics-superpac-ad-funding-oct6","headline":"Trump says his super PAC will pay for ads previously funded by taxpayers","summary":"Trump said his super PAC would cover costs for advertisements that drew criticism for using taxpayer funds, AP reports. The announcement changes his stated funding plan; it does not itself establish how much has been reimbursed or the legality of prior spending.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — super PAC to cover ad costs, Oct. 6","url":"https://apnews.com/article/trump-taxpayer-funded-ads-super-pac-e6f47f7b86f83938aacfb16bda12efaa"},{"label":"Reuters — public skepticism of taxpayer-funded election ads","url":"https://www.reuters.com/world/americans-deeply-skeptical-taxpayer-funded-election-ads-reutersipsos-poll-finds-2026-10-06/"}]},{"id":"politics-arizona-ballot-error-oct6","headline":"Arizona ballot error affected about 3,000 early-mail voters, officials say","summary":"Maricopa County officials said about 3,000 ballots were mistakenly mailed early to voters, AP reports. Election officials are addressing the error; the report does not show that the affected ballots changed any election outcome.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — Maricopa County ballot error, Oct. 6","url":"https://apnews.com/article/trump-arizona-maricopa-county-mail-ballots-voting-fcbd40f8b0c0b778f50409bc994d4225"},{"label":"AP — county recorder response","url":"https://apnews.com/article/maricopa-county-recorder-arizona-election-73a8c98f977568e677dd5773ca341c1c"}]},{"id":"politics-vance-alaska-campaign-oct6","headline":"Vance casts Alaska as Republicans’ shield in midterm campaign","summary":"Vice President JD Vance made a campaign stop in Alaska and argued the state could help Republicans defend their position in the midterms, Reuters reports. The remarks are campaign messaging, not a prediction of election results.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — Vance Alaska campaign stop, Oct. 6","url":"https://www.reuters.com/legal/government/vance-rallies-alaska-high-stakes-campaign-stop-2026-10-06/"}]},{"id":"politics-murphy-qatar-base-access-oct6","headline":"Sen. Murphy says Pentagon denied him access to Qatar base; DoD cites travel rule","summary":"Sen. Chris Murphy said the Pentagon denied him access to Al Udeid Air Base during his Middle East trip, which he framed as an effort to hide the Iran war’s costs from Congress. A senior Defense official said Murphy’s office had been told in advance that the department would not support the visit under a March travel directive; the dispute is over access and briefings, not a finding of unlawful concealment.","sources":["Other"],"signal":"Split","links":[{"label":"Reuters — Murphy and Pentagon give differing explanations, Oct. 6","url":"https://www.reuters.com/world/us/us-senator-murphy-says-pentagon-denied-him-access-us-base-qatar-2026-10-06/"},{"label":"The Hill — Murphy says Pentagon blocked Qatar base visit, Oct. 6","url":"https://thehill.com/policy/defense/6132165-murphy-qatar-iran-war-pentagon/"}]},{"id":"politics-anduril-maryland-shipyard-oct6","headline":"AP: Trump spotlights Anduril’s $3.7 billion Maryland submarine-parts project","summary":"President Trump traveled to Baltimore on Oct. 6 to promote Anduril’s planned $3.7 billion Sparrows Point shipyard for Virginia-class submarine components, AP reported. Administration officials said the Navy could spend up to another $2.9 billion buying production from the facility; the site and future jobs are proposed, not yet operating, and Maryland Gov. Wes Moore was not included in the event program.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — Trump highlights Anduril submarine project, Oct. 6","url":"https://www.usnews.com/news/business/articles/2026-10-06/trump-highlights-a-big-new-defense-project-in-maryland-a-blue-state-whose-governor-wont-be-there"},{"label":"The Hill — administration describes Pentagon funding and event, Oct. 6","url":"https://thehill.com/homenews/administration/6132064-white-house-donald-trump-wes-moore-baltimore-maryland-shipyard/"}]}],"entertainment":[{"id":"entertainment-paramount-wbd-merger-oct6","headline":"Paramount Skydance completes $110 billion Warner Bros. Discovery takeover","summary":"Paramount Skydance completed its takeover of Warner Bros. Discovery Tuesday, creating a combined entertainment and news group with about $80 billion in debt, Reuters reported. Executives target $6 billion in savings, while the scale and timing of job cuts and streaming integration remain unsettled.","links":[{"label":"Reuters — Paramount closes Warner Bros. Discovery merger, Oct. 6","url":"https://www.reuters.com/business/media-telecom/paramount-wraps-up-mega-warner-bros-merger-create-hollywood-powerhouse-skydance-2026-10-06/"}],"sources":["Other"],"signal":"Watch"},{"id":"entertainment-emmys-primevideo-oct6","headline":"Emmys will leave broadcast TV for Prime Video under six-year deal","summary":"The Television Academy and Amazon announced Tuesday that Prime Video will carry the Primetime Emmy Awards beginning in 2027 under a six-year global deal, Variety reports. The move shifts the telecast from broadcast television; reported financial terms are estimates, not disclosed terms.","links":[{"label":"Variety — six-year Prime Video deal, Oct. 6","url":"https://variety.com/2026/tv/news/emmys-prime-video-six-year-deal-15-million-a-year-1236899957/"},{"label":"Wall Street Journal — deal announcement, Oct. 6","url":"https://www.wsj.com/business/media/emmy-awards-will-leave-broadcast-tv-for-amazons-prime-video-0c92fad5"}],"sources":["Other"],"signal":"Consensus"},{"id":"entertainment-jim-bakker-death-oct6","headline":"Televangelist Jim Bakker, disgraced by scandal, dies at 86","summary":"Jim Bakker, whose PTL Club television ministry became a multimillion-dollar empire before a fraud conviction and sex scandal, died Monday at 86, AP and Reuters report. The coverage recounts his public career and collapse; it is not a new legal proceeding.","sources":["Other"],"signal":"Consensus","links":[{"label":"AP — Jim Bakker dies at 86, Oct. 6","url":"https://apnews.com/article/jim-bakker-televangelist-ptl-club-dead-ef6d58ffa0b511edba773c219cee77e8"},{"label":"Reuters — Bakker obituary, Oct. 6","url":"https://www.reuters.com/world/us/us-televangelist-jim-bakker-ensnared-fraud-sex-scandal-dead-86-2026-10-06/"}]},{"id":"entertainment-digger-boxoffice-oct6","headline":"“Digger” opens below expectations as “Verity” leads weekend box office","summary":"Weekend estimates put “Verity” first with a $32.6 million opening, while Tom Cruise’s “Digger” fell short of expectations and could produce a large studio loss, according to trade coverage. The loss estimate is a projection, not a final audited result.","sources":["Other"],"signal":"Watch","links":[{"label":"Deadline — weekend box office estimates, Oct. 5","url":"https://deadline.com/2026/10/box-office-verity-digger-tom-cruise-weekend-estimates-1237146502/"},{"label":"The Guardian — projected Digger loss, Oct. 5","url":"https://www.theguardian.com/film/2026/oct/05/digger-may-lose-150m-after-tom-cruise-film-bombs-at-the-box-office"}]},{"id":"entertainment-hollywood-production-oct6","headline":"Hollywood unions warn U.S. film and TV production is nearing a breaking point","summary":"A report commissioned by entertainment unions says U.S.-based production has lost ground to overseas locations, with domestic TV spending’s share falling over time. The group frames the findings as a warning about an industry under pressure, not a prediction that production will stop.","sources":["Other"],"signal":"Watch","links":[{"label":"Deadline — union-backed production report, Oct. 5","url":"https://deadline.com/2026/10/hollywood-unions-report-us-film-tv-production-decline-1237147051/"}]},{"id":"entertainment-kylie-hulu-series-oct6","headline":"Kylie Jenner to headline Hulu thriller series “Bachelorette Weekend,” Deadline reports","summary":"Kylie Jenner is set to star in and executive-produce a thriller series at Hulu, with a straight-to-series order still being finalized, Deadline reports. The project is in development and should not be described as already filming or released.","sources":["Other"],"signal":"Watch","links":[{"label":"Deadline — Kylie Jenner Hulu project, Oct. 6","url":"https://deadline.com/2026/10/kylie-jenner-bachelorette-weekend-hulu-series-kim-kardashian-1237146797/"}]},{"id":"entertainment-casey-bloys-contract-oct6","headline":"HBO chief Casey Bloys renews contract as Paramount+ and HBO Max integrate","summary":"Casey Bloys has renewed his contract as he begins overseeing integration of HBO Max and Paramount+ teams, Deadline reports. The agreement concerns executive leadership; it does not yet establish the combined services’ final programming strategy.","sources":["Other"],"signal":"Watch","links":[{"label":"Deadline — Casey Bloys contract and integration, Oct. 6","url":"https://deadline.com/2026/10/casey-bloys-contract-reup-hbo-max-paramount-plus-teams-1237147522/"}]}]},"researchNotes":["Fresh Oct. 6 7 p.m. EDT refresh; prioritize developments since the 4:11 p.m. EDT edition and retain previously checked Oct. 6 cards only when still current and qualified.","Market close: Reuters after-close report for Oct. 6 gives Dow 51,521.04, +253.14, +0.49%, and Nasdaq Composite 27,599.79, +122.48, +0.45%. AP reports Dow 51,521.28, +253.38, and Nasdaq 27,599.79, +122.48; AP rounds percentages to tenths. Both sources report final closes; preserve 24-cent Dow provider difference.","Boston team status and schedules rechecked: no Red Sox, Patriots, Bruins or Celtics game Tuesday; Bruins–Ottawa 4–1 FINAL Monday; Patriots–Buffalo 29–26 FINAL Sunday; Red Sox 87–75 and eliminated 2–0 by Yankees. Verified upcoming schedule: Bruins–Utah Thursday Oct. 8 7 p.m. EDT, Celtics at Cleveland Thursday Oct. 8 7 p.m. ET, Patriots–Las Vegas Sunday Oct. 11 1 p.m. EDT. Red Sox official schedule lists no game Oct. 6.","Boston Globe sports page rechecked; Oct. 6 Globe Patriots receiver-options item added, and Bruins/Red Sox Oct. 6 reporting retained. Boston Globe articles partly paywalled. WEEI/Audacy homepage checked, but accessible page shell contains no substantive latest-story body text; existing direct WEEI item remains linked.","New late reports checked directly: Reuters on Yemen video and the brigade investigation; Reuters on Vance’s stated Iran-enrichment condition; Reuters on Sen. Murphy’s Qatar base access dispute with the Pentagon response; Reuters on FICO restructuring, FT-attributed SpaceX financing, Paramount–WBD closing; Reuters on Christa Pike; ESPN live NLDS Game 3 at 0–0, third inning with no outs at approximately 7:08 p.m. EDT.","Fox News current Iran-war coverage and Drudge homepage were checked; Drudge is an aggregator. CNN direct results were limited at refresh, so CNN framing relies on its Oct. 6 article about the Trump city remarks reviewed in the previous edition; no unsupported live CNN headline attributed."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, or international soccer.',business:'7 unique business/markets stories; on trading days at 7 a.m. show timestamped indicative Dow and Nasdaq-100 futures, clearly not cash indexes; on weekends and market holidays state cash markets are closed and show no live/premarket snapshot, while identifying the latest completed session. At 10 a.m. and 1 p.m. on trading days show timestamped Dow and Nasdaq Composite cash-index levels, point and percentage moves, and any provider delay; at 4 p.m. show timestamped closing moves as confirmed or clearly preliminary; at 7 p.m. use confirmed closes.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
