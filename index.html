re the administration had used in its election-policy push. The decision is a trial-court ruling and could be appealed; it does not establish that noncitizens voted unlawfully in any election.","links":[{"label":"Reuters — ruling on noncitizen voting law, Oct. 1","url":"https://www.reuters.com/world/us-judge-finds-law-criminalizing-noncitizen-voting-unconstitutional-2026-10-01/"},{"label":"NBC News — ruling and administration’s election push, Oct. 1","url":"https://www.nbcnews.com/politics/justice-department/judge-guts-noncitizen-voting-law-used-trump-administrations-election-p-rcna601026"}],"sources":["Other"],"signal":"Watch"},{"id":"usa-ice-polls-no-plan-oct2","headline":"Oct. 2: Trump administration says it has no plans to send ICE officers to polling places","summary":"The administration told AP it has no plan to deploy immigration officers at polling sites, after Trump declined to rule out the possibility. The statement is not a ruling on the voting-rights groups’ separate lawsuit, and no polling-place deployment has been reported.","links":[{"label":"AP — administration says no ICE polling-place plan, Oct. 2","url":"https://apnews.com/article/midterm-elections-immigration-officers-ice-voting-e43c1758ccd446eb441957b36f9e281f"},{"label":"CBS News — voting-rights suit, Oct. 1","url":"https://www.cbsnews.com/news/lawsuit-block-ice-agents-polling-sites/"}],"sources":["Other"],"signal":"Split"},{"id":"usa-canoe-drones-border-oct2","headline":"Oct. 2: U.S. looks to expand canoe-sized drones to deter migrant crossings","summary":"Reuters reports U.S. officials are considering broader use of small unmanned craft along the border as a deterrent. The report concerns a proposed expansion, not a confirmed deployment or a demonstrated effect on crossings.","links":[{"label":"Reuters — border drone proposal, Oct. 2","url":"https://www.reuters.com/world/us-looks-expand-use-canoe-sized-drones-deter-migrant-crossings-2026-10-02/"}],"sources":["Other"],"signal":"Watch"},{"id":"usa-renee-good-lawsuit-oct1","headline":"Oct. 1: Renee Good’s family sues U.S. officials over fatal Minneapolis shooting","summary":"AP and Reuters report the family filed wrongful-death suits over the January shooting by an immigration agent. The complaints allege negligence and civil-rights violations; no court has determined liability.","links":[{"label":"AP — family lawsuit, Oct. 1","url":"https://apnews.com/article/renee-good-lawsuit-6fbc82cd33b6f9f67514b47f138e23c6"},{"label":"Reuters — lawsuit against administration, Oct. 1","url":"https://www.reuters.com/world/renee-goods-family-sues-trump-administration-over-fatal-minneapolis-shooting-2026-10-01/"}],"sources":["Other"],"signal":"Watch"},{"id":"usa-usps-ballot-delivery-oct1","headline":"Oct. 1: U.S. Postal Service adds steps aimed at protecting ballot deliveries","summary":"Reuters reports the Postal Service plans extra safeguards to ensure ballots are delivered as the midterms approach. The operational steps address mail handling; they do not resolve broader disputes about election administration or establish a specific delivery problem.","links":[{"label":"Reuters — ballot-delivery measures, Oct. 1","url":"https://www.reuters.com/world/us/us-postal-service-take-extra-steps-ensure-ballot-deliveries-2026-10-01/"}],"sources":["Other"],"signal":"Watch"},{"id":"usa-faa-boeing-review-oct1","headline":"Oct. 1: FAA plans Friday review of Boeing 737 MAX software issue","summary":"Reuters reports the FAA is set to convene a review on Oct. 2 of a software issue on the 737 MAX. The meeting is a safety review, not a finding that a new defect caused an incident or a completed regulatory action.","links":[{"label":"Reuters — FAA review planned for Oct. 2, Oct. 1","url":"https://www.reuters.com/world/us-faa-set-convene-review-boeing-737-max-software-issue-friday-2026-10-01/"}],"sources":["Other"],"signal":"Watch"},{"id":"usa-doj-homelessness-retreat-oct2","headline":"Oct. 2: Justice Department backs away from cases over disability rights in homelessness policy","summary":"NBC News reports the department began retreating from cases protecting disabled people’s rights after a memo made it easier to institutionalize homeless people. The article describes a shift in litigation strategy; the legal standards and underlying cases remain contested.","links":[{"label":"NBC News — DOJ cases and homelessness policy, Oct. 2","url":"https://www.nbcnews.com/politics/justice-department/trump-homelessness-crackdown-retreat-disability-rights-olmstead-rcna600545"}],"sources":["Other"],"signal":"Watch"},{"id":"usa-hud-grants-paused-oct1","headline":"Oct. 1: Judge pauses cancellation of nearly $56 million in HUD counseling grants","summary":"A federal judge temporarily blocked grant cancellations while nonprofit groups’ lawsuit proceeds. The order preserves funding during litigation; it does not decide whether the administration’s rationale or the plaintiffs’ claims are legally correct.","links":[{"label":"Reuters — judge pauses housing-grant cuts, Oct. 1","url":"https://www.reuters.com/legal/government/us-judge-blocks-housing-grant-cuts-while-anti-dei-challenge-proceeds-2026-10-01/"}],"sources":["Other"],"signal":"Watch"},{"id":"usa-scholarship-tax-credit-oct1","headline":"Oct. 1: Federal tax-credit scholarships open to families in at least 30 states","summary":"AP reports a new federal program lets individuals contribute up to $1,700 to eligible scholarship organizations and claim an equal tax credit. Participation depends on states and approved organizations; it is not an automatic federal voucher for every student.","links":[{"label":"AP — federal scholarship credit rules, Oct. 1","url":"https://apnews.com/article/federal-scholarship-tax-credit-rules-a015961865d469f2a0839d235a9f4056"}],"sources":["Other"],"signal":"Watch"},{"id":"usa-ice-traffic-training-oct1","headline":"Oct. 1: ICE tells officers to make traffic stops only if properly trained","summary":"AP reports the agency issued guidance limi ense/first-new-f-16v-fighter-jets-arrive-taiwan-bolster-defences-against-china-2026-10-02/"},{"label":"DW — Taiwan aircraft delivery, Oct. 2","url":"https://www.dw.com/en/taiwan-first-new-f-16v-fighters-arrive-amid-china-threat/a-79510328"}],"sources":["Other"],"signal":"Watch"},{"id":"world-antelope-reef-oct2","headline":"Oct. 2: Satellite images show Chinese work accelerating at Antelope Reef, Reuters reports","summary":"Reuters says new satellite imagery indicates construction activity has gathered pace at the disputed South China Sea feature. The report describes physical work and regional claims; it does not establish a new legal settlement or military confrontation.","links":[{"label":"Reuters — satellite analysis of Antelope Reef, Oct. 2","url":"https://www.reuters.com/world/china/chinese-work-gathering-pace-antelope-reef-south-china-sea-latest-satellite-2026-10-02/"}],"sources":["Other"],"signal":"Watch"},{"id":"world-korea-ukraine-threat-oct2","headline":"Oct. 2: South Korea threatens action against Ukraine over transfer of North Korean soldiers","summary":"Reuters reports President Lee Jae Myung warned of possible action after reports that Ukraine transferred captured North Korean soldiers to South Korea. The dispute concerns the prisoners’ transfer and diplomacy; no specific punitive measure was announced in the report.","links":[{"label":"Reuters — South Korea’s warning, Oct. 2","url":"https://www.reuters.com/world/asia-pacific/south-koreas-lee-threatens-action-against-ukraine-over-transfer-of-north-korean-2026-10-02/"}],"sources":["Other"],"signal":"Watch"},{"id":"world-pakistan-containers-oct2","headline":"Oct. 2: Pakistan seizes shipping containers to block routes to the capital","summary":"Reuters reports cargo has piled up after authorities seized containers to obstruct routes as political tensions rise. The move is a government action; the report does not say all commerce or road access has stopped.","links":[{"label":"Reuters — seized containers a ving checks, with most of the payments going to battleground states. The administration calls them fee refunds; claims about electoral effects are analysts’ projections, not established outcomes.","links":[{"label":"Reuters — ACA refunds and battleground states, Oct. 1","url":"https://www.reuters.com/legal/litigation/trumps-500-obamacare-rebate-checks-land-prime-political-battlegrounds-2026-10-01/"}],"sources":["Other"],"signal":"Watch"},{"id":"politics-epa-states-lawsuit-oct1","headline":"Oct. 1: New York leads 25 states and cities challenging EPA power-plant rule repeal","summary":"The coalition argues EPA failed to account for alternative approaches and health and climate costs when it repealed 2024 greenhouse-gas limits. The filing starts litigation and is not a court decision on the agency’s authority.","links":[{"label":"Reuters — states’ challenge to EPA repeal, Oct. 1","url":"https://www.reuters.com/legal/litigation/new-york-20-states-sue-epa-block-power-plant-carbon-rule-repeal-2026-10-01/"}],"sources":["Other"],"signal":"Watch"},{"id":"politics-government-ads-probe-oct1","headline":"Oct. 1: Democrats ask watchdogs to review Trump-featured taxpayer-funded ads","summary":"House Democrats asked the Government Accountability Office and Office of Special Counsel to examine whether the ads violate restrictions on political use of government funds. The request is not a finding of illegality; the administration and regulators have not resolved the dispute.","links":[{"label":"Reuters — watchdog requests on government ads, Oct. 1","url":"https://www.reuters.com/legal/government/democratic-lawmakers-seek-probe-us-government-ads-featuring-trump-2026-10-01/"}],"sources":["Other"],"signal":"Watch"},{"id":"politics-senate-permitting-sept30","headline":"Sept. 30: Senators strike bipartisan permitting deal, with a floor vote expected after midterms","summary":"Negotiators announced a compromise intended to streamline energy-project approvals, but a vote is not expected until after the November election. The agreement is not enacted law and could still change or fail.","links":[{"label":"Reuters — permitting compromise, Sept. 30","url":"https://www.reuters.com/legal/litigation/us-senators-hit-deal-energy-project-permitting-bill-vote-seen-after-november-2026-09-30/"}],"sources":["Other"],"signal":"Watch"}],"entertainment":[{"id":"entertainment-fast-furious-peacock-oct2","headline":"Oct. 2: Peacock orders “Fast & Furious” TV adaptation to series","summary":"Variety reports Peacock has formally ordered the franchise adaptation and is targeting a 2028 premiere. That is a series order and target window, not a released show or fixed launch date.","links":[{"label":"Variety — “Fast & Furious” series order, Oct. 2","url":"https://au.variety.com/2026/tv/news/fast-furious-tv-show-peacock-2028-40935/"}],"sources":["Other"],"signal":"Watch"},{"id":"entertainment-eddie-murphy-chairman-oct2","headline":"Oct. 2: Eddie Murphy attached to Peacock drama “The Chairman”","summary":"The project is in development with “Mad Men” creator Matthew Weiner, Variety and The Hollywood Reporter report. The casting and project are announced, but no series order, production start or premiere date was confirmed.","links":[{"label":"The Hollywood Reporter — Murphy’s scripted series, Oct. 2","url":"https://www.hollywoodreporter.com/tv/tv-news/eddie-murphy-star-the-chairman-peacock-1236720659/"},{"label":"Variety — project details, Oct. 2","url":"https://au.variety.com/2026/tv/news/eddie-murphy-peacock-drama-matthew-weiner-40937/"}],"sources":["Other"],"signal":"Watch"},{"id":"entertainment-paramount-thompson-oct1","headline":"Oct. 1: Paramount CEO asks CNN chief Mark Thompson to stay after merger closes","summary":"Reuters reports David Ellison made the request, citing a source; the companies planned to close the Warner Bros. deal Oct. 6. The transaction is not yet complete and the reported discussion is not a final staffing decision.","links":[{"label":"Reuters — Thompson discussions after merger, Oct. 1","url":"https://www.reuters.com/legal/transactional/paramount-ceo-ellison-asks-cnn-chief-thompson-stay-after-warner-bros-deal-source-2026-10-01/"},{"label":"Variety — “early stages” of discussions, Oct. 2","url":"https://variety.com/2026/tv/news/paramount-cnn-chief-mark-thompson-discussions-1236894869/"}],"sources":["Other"],"signal":"Watch"},{"id":"entertainment-fox-business-hosts-oct2","headline":"Oct. 2: Fox Business replaces Maria Bartiromo’s morning slot with roundtable show","summary":"Variety reports a “Big Money” roundtable will replace Bartiromo’s morning program. The change is a programming decision; Fox Business has not announced the ratings or audience effects of the new format.","links":[{"label":"Variety — Fox Business programming change, Oct. 2","url":"https://variety.com/2026/tv/news/fox-business-replaces-maria-bartiromo-big-money-roundtable-1236894763/"}],"sources":["Other"],"signal":"Watch"},{"id":"entertainment-kimmel-future-oct1","headline":"Oct. 1: Disney president Dana Walden addresses Jimmy Kimmel Live!’s future","summary":"Variety reports Walden discussed the ABC show’s future and the performance of Disney’s live-action “Moana.” The comments do not announce a renewal or cancellation of Kimmel’s program.","links":[{"label":"Variety — Walden on Kimmel and “Moana,” Oct. 1","url":"https://variety.com/2026/film/news/disney-dana-walden-jimmy-kimmel-abc-moana-box-office-1236894985/"}],"sources":["Other"],"signal":"Watch"},{"id":"entertainment-starz-verizon-blackout-oct1","headline":"Oct. 1: Starz service goes dark for Verizon Fios customers amid carriage dispute","summary":"Variety reports Starz channels and on-demand service were blacked out after negotiations failed to yield a distribution agreement. The companies blame each other and no new deal was announced in the report.","links":[{"label":"Variety — Starz-Verizon blackout, Oct. 1","url":"https://variety.com/2026/tv/news/starz-verizon-fios-negotiations-blacked-out-tonight-1236894418/"}],"sources":["Other"],"signal":"Watch"},{"id":"entertainment-sia-catalog-sale-oct1","headline":"Oct. 1: Sia sells half-share of music catalog in reported $180 million deal","summary":"Rolling Stone reports the singer sold a 50% stake in her catalog. The reported transaction is complete; the precise future royalty stream and how the artist’s remaining share will be managed were not detailed.","links":[{"label":"Rolling Stone — Sia catalog sale, Oct. 1","url":"https://www.rollingstone.com/music/music-news/sia-sells-50-percent-catalogue-180-million-1235635118/"}],"sources":["Other"],"signal":"Watch"}]},"researchNotes":["Fresh public-web research conducted Friday, October 2, 2026; the edition timestamp is generated at artifact build time in America/New_York and displayed as EDT Boston.","Compared Fox News, CNN and Drudge Report current presentation; Drudge is treated as an aggregator, not an independent reporting outlet. Used direct reporting and official schedules where available; attributed allegations, official figures, forecasts and unresolved claims.","Business Insider futures were stamped 6:51:44 a.m. EDT (Dow) and 6:51:40 a.m. EDT (Nasdaq-100); provider warns these are indicative market-maker quotes. Reuters’ 6:28 a.m. futures snapshot differed, so provider times and discrepancies are disclosed. Latest completed cash session is Thursday, October 1.","Boston schedules/results checked during the Oct. 2 morning refresh: Bruins at Winnipeg upcoming 8 p.m.; Patriots off today and next at Buffalo Sunday at 1 p.m.; Celtics off today and preseason begins Oct. 8; Red Sox eliminated Sept. 30; Boston College at SMU Saturday at noon. No live score was claimed.","Freshness: prioritized Oct. 2 developments. Oct. 1 stories retained in secondary tabs only where still consequential, with actual article dates stated in headlines and/or source labels."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'Boston-area professional and major-college sports only.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, or international soccer.',business:'7 unique business/markets stories; at 7 a.m. show timestamped indicative Dow and Nasdaq-100 futures, clearly not cash indexes; at 10 a.m. and 1 p.m. show timestamped Dow and Nasdaq Composite cash-index levels, point and percentage moves, and any provider delay; at 4 p.m. show timestamped closing moves as confirmed or clearly preliminary; at 7 p.m. use confirmed closes; state the date of the latest completed U.S. cash session.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
