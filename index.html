<script id="briefing" type="application/json">{"date":"2026-09-25","lastUpdated":"September 25, 2026, 7:00 a.m. EDT Boston","dek":"A high-stakes Trump–Xi summit, Hawaii’s Hurricane Nolo, Middle East escalation, a White House press-access ruling and new U.S. election-data fights lead Friday’s 7 a.m. Eastern briefing.","take":"Consensus: Fox and CNN both treat the Trump–Xi meeting as consequential but report no major breakthrough; Fox foregrounds strategic leverage around rare earths and Iran, while CNN emphasizes the summit’s limits and the ceremony. Drudge’s Sept. 25 page leans into conflict and spectacle—linking the dinner to CNN’s press-access fight and foregrounding political/economic signals rather than a negotiated outcome. On the other Top News stories, Reuters distinguishes Saudi-confirmed missile interceptions from Houthi attack claims; CBS’s Cuba story is preliminary planning, not a deployment order; Hawaii rain totals are forecasts; and TikTok allegations remain untested in court. The White House access order is temporary, and voter-data lawsuits do not demonstrate widespread noncitizen voting.","sections":{"top":[{"id":"top-trump-xi-summit","headline":"Trump and Xi leave Washington without a major breakthrough after high-stakes summit","summary":"The leaders met at the White House and praised the relationship, but Reuters and CNN reported no major breakthrough on trade, Taiwan, AI or Iran. Fox emphasized strategic leverage including rare earths and Iran; CNN framed the meeting as consequential but limited. The White House had not announced a binding accord in the reporting reviewed for this edition.","sources":["Fox","CNN","Drudge","Other"],"signal":"Split","links":[{"label":"Fox News — summit stakes (Sept. 24)","url":"https://www.foxnews.com/politics/trump-xi-reunion-unfinished-business-bigger-battle-looming"},{"label":"CNN — live summit coverage (updated Sept. 25)","url":"https://www.cnn.com/2026/09/24/politics/live-news/trump-meeting-china-xi-us-visit"},{"label":"Reuters — meeting report (Sept. 24)","url":"https://www.reuters.com/world/china/trump-welcomes-xi-washington-looking-trade-win-2026-09-24/"},{"label":"Drudge Report — current front page (Sept. 25)","url":"https://www.drudgereport.com/"}]},{"id":"top-hawaii-hurricane-nolo","headline":"Hurricane Nolo strengthens near Hawaii as Big Island warnings and heavy-rain forecasts expand","summary":"CBS News reported Nolo reached hurricane strength with maximum sustained winds near 80 mph; a hurricane watch and tropical-storm warning covered parts of Hawaii County. Forecasters warned of potentially 15–30 inches of rain, with locally higher totals, and possible further strengthening. Those rain and damage figures are forecasts, not observed impacts.","sources":["Other"],"signal":"Watch","links":[{"label":"CBS News — Nolo reaches hurricane strength (Sept. 25)","url":"https://www.cbsnews.com/news/storm-nolo-hurricane-hawaii/"},{"label":"NOAA National Hurricane Center — advisories","url":"https://www.nhc.noaa.gov/"}]},{"id":"top-saudi-houthi-attacks","headline":"Saudi Arabia says it intercepted six missiles as Houthi attacks raise regional-security stakes","summary":"Saudi authorities said six ballistic missiles were intercepted; the Houthis separately claimed missile and drone strikes toward Riyadh and Yanbu. Reuters reports regional partners are coordinating with Saudi Arabia. The claimed targets and the reported interceptions are attributed separately; the reporting does not establish damage to the oil facilities.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — allies unite behind Saudi Arabia (Sept. 25)","url":"https://www.reuters.com/world/middle-east/allies-unite-behind-saudi-arabia-houthis-step-up-attacks-2026-09-25/"},{"label":"Reuters — Houthis’ attack claim (Sept. 24)","url":"https://www.reuters.com/world/middle-east/houthis-say-they-attacked-riyadh-aramco-facilities-yanbu-2026-09-24/"},{"label":"Associated Press — Saudi account of interceptions","url":"https://apnews.com/article/yemen-saudi-arabia-houthis-missiles-d19776cf1a68b45d28b1402f3a47b8cd"}]},{"id":"top-white-house-press-access","headline":"Court restores three outlets’ White House access for 14 days, leaving the larger press-rights case unresolved","summary":"Reuters reports that CNN, Politico and MS NOW regained access under a temporary court order. The order is not a final First Amendment ruling; the legal fight continues, with the administration able to seek a preliminary injunction by Sept. 28. Drudge’s Sept. 25 front page juxtaposes the dinner coverage with the CNN access dispute.","sources":["CNN","Drudge","Other"],"signal":"Split","links":[{"label":"Reuters — what remains in the court fight (Sept. 25)","url":"https://www.reuters.com/legal/government/why-court-fight-over-white-house-media-ban-isnt-over-2026-09-25/"},{"label":"CNN — live coverage of the access dispute","url":"https://www.cnn.com/2026/09/24/politics/live-news/white-house-press-ban-lawsuit"},{"label":"AP — judge’s access order","url":"https://apnews.com/article/trump-media-ban-judge-ruling-cnn-msnow-politico-21605e397fe48f178a4afa037e732c6d"},{"label":"Drudge Report — current front page (Sept. 25)","url":"https://www.drudgereport.com/"}]},{"id":"top-pakistan-afghanistan-strikes","headline":"Pakistan strikes 10 locations in Afghanistan after alleged drone attacks; Kabul disputes blame","summary":"Reuters reports Pakistani forces struck 10 locations after Islamabad accused Afghan forces of drone attacks. Kabul denied responsibility, and Afghan officials said civilian deaths occurred. Pakistan’s rationale and Afghan casualty accounts remain attributed claims; a previous Chinese-mediated ceasefire had contained the fighting.","sources":["Other"],"signal":"Split","links":[{"label":"Reuters — latest account of Pakistan-Afghanistan fighting (Sept. 25)","url":"https://www.reuters.com/world/asia-pacific/what-has-turned-afghan-taliban-pakistan-partners-foes-2026-09-25/"},{"label":"Associated Press — border fighting report","url":"https://apnews.com/article/pakistan-afghanistan-border-fighting-66402ffe6fc48608ea4c32a099774c4c"}]},{"id":"top-voter-data-push","headline":"Trump administration presses for sensitive voter data despite repeated court setbacks","summary":"Reuters reports the administration is pursuing state voter data after at least 25 court losses. Reuters found no evidence of widespread noncitizen voting; privacy risks and errors in federal citizenship databases are among the concerns raised. A Maryland hearing was scheduled, so the legal and implementation questions remain active.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — voter-data push and court setbacks (Sept. 25)","url":"https://www.reuters.com/legal/government/trump-continues-voter-data-push-despite-repeated-setbacks-2026-09-25/"}]},{"id":"top-cuba-military-planning","headline":"CBS reports Army Reserve is assessing possible Cuba-related support needs; no deployment order is reported","summary":"CBS News says it reviewed an internal Army Reserve message seeking unit availability for possible Southern Command needs within 90–120 days; officials told CBS the planning concerns Cuba. The document does not order a deployment or identify an operation, and CBS reports no indication units have received orders. Southern Command declined to discuss potential movements.","sources":["Other"],"signal":"Watch","links":[{"label":"CBS News — internal planning message and officials’ accounts (Sept. 25)","url":"https://www.cbsnews.com/news/u-s-groundwork-potential-action-cuba-trump/"}]},{"id":"top-tiktok-alabama-trial","headline":"First U.S. state trial over TikTok’s alleged impact on teen mental health is set to begin Monday","summary":"Reuters reports an Alabama jury is scheduled to hear the state’s claims beginning Sept. 28, the first state case in the broader litigation to reach trial. At least 27 states and Washington, D.C., have sued. TikTok denies the allegations and invokes Section 230; the claims have not been adjudicated.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — first state trial against TikTok (Sept. 25)","url":"https://www.reuters.com/world/us/first-us-trial-against-tiktok-test-claims-platform-fueled-teen-mental-health-2026-09-25/"}]},{"id":"top-bond-yield-market-stress","headline":"U.S. bond yields touch multi-year highs as markets weigh rising borrowing costs","summary":"Reuters reported the 10-year Treasury yield near 5.17%, after a two-day jump to about 5.22%, its highest level in 19 years; the 30-year yield was around 5.46%. The figures describe market trading, not a forecast, and Reuters said investors were weighing the prospect of continued pressure across risk assets.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — global markets and bond yields (Sept. 25)","url":"https://www.reuters.com/world/china/global-markets-warpup-1-pix-2026-09-25/"}]},{"id":"top-pope-leo-france-visit","headline":"Pope Leo begins France visit with warnings about AI, assisted dying and church accountability","summary":"Reuters reports Pope Leo arrived in France on Sept. 25 for a visit that includes public comments on artificial intelligence and assisted dying, press-freedom remarks, and meetings with abuse survivors. His criticism of AI and position on assisted dying are stated views; scheduled meetings are not evidence of a change in church policy.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — France visit agenda and arrival (Sept. 25)","url":"https://www.reuters.com/world/pope-leo-heads-france-with-ai-apologies-clergy-abuse-agenda-2026-09-25/"}]}],"usa":[{"id":"usa-pittsburgh-pediatrician-killed","headline":"Pittsburgh pediatrician Idris Evans is killed in a home stabbing, officials say","summary":"CNN reports Dr. Idris Evans, a UPMC Children’s Hospital physician, was stabbed to death at home; officials said his wife was injured and called for their children to flee. Police described a trespasser, and the investigation and any criminal allegations remain subject to the authorities’ account.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"CNN — officials’ account of the Pittsburgh killing (Sept. 25)","url":"https://www.cnn.com/2026/09/25/us/pittsburgh-doctor-idris-evans-stabbing-home"},{"label":"PennLive — local report","url":"https://www.pennlive.com/crime/2026/09/upmc-childrens-hospital-physician-killed-in-stabbing-suspect-detained.html"}]},{"id":"usa-james-copenhaver-death","headline":"James Copenhaver, wounded in the 2024 Butler rally shooting, dies from injury complications","summary":"Reports published Sept. 24–25 say Copenhaver, one of three attendees wounded in the 2024 assassination attempt on Donald Trump, has died. Authorities and family sources cited by outlets attributed his death to complications from his injuries; the report is about a later death from wounds sustained in the attack.","sources":["Fox","Other"],"signal":"Watch","links":[{"label":"CBS News Pittsburgh — death report","url":"https://www.cbsnews.com/pittsburgh/news/jim-copenhaver-trump-rally-assassination-attempt-victim-dies/"},{"label":"TribLive — local report","url":"https://triblive.com/news/politics-election/james-copenhaver-wounded-in-trump-assassination-attempt-at-butler-rally-has-died/"},{"label":"Fox News — report citing officials and family sources","url":"https://www.foxnews.com/politics/james-copenhaver-man-shot-trump-butler-rally-dies-complications-from-injuries-report"}]},{"id":"usa-ole-miss-student-deaths","headline":"Two Ole Miss student deaths remain under investigation; kratom was found at the scene, reports say","summary":"CNN and Fox News reported that two University of Mississippi students died and that investigators were examining the circumstances. Fox reported kratom was found at the scene; officials had not established that it caused or contributed to either death, and the causes remained under investigation.","sources":["Fox","CNN"],"signal":"Watch","links":[{"label":"CNN — investigation into two student deaths (Sept. 24)","url":"https://www.cnn.com/2026/09/24/us/ole-miss-student-deaths-wwk"},{"label":"Fox News — investigators’ account of kratom found","url":"https://www.foxnews.com/us/ole-miss-victim-identified-narcotics-task-force-probes-two-student-deaths"}]},{"id":"usa-evanston-ice-detention","headline":"U.S. citizen says ICE agents mistakenly detained and injured him in Evanston","summary":"CNN and the Associated Press reported a U.S. citizen’s account that immigration agents detained and injured him. The man alleges mistaken detention; the accounts do not establish the agents’ intent or resolve what happened, and his claim is attributed to him and the reporting.","sources":["CNN","Other"],"signal":"Split","links":[{"label":"CNN — citizen’s account and detention (Sept. 24)","url":"https://www.cnn.com/2026/09/24/us/ice-us-citizen-detained-evanston"},{"label":"Associated Press — Evanston police and ICE report","url":"https://apnews.com/article/chicago-illinois-ice-immigration-agents-evanston-police-2e07d80e8d96685489e914880a40e4d5"}]},{"id":"usa-noreaster-east-coast","headline":"Nor’easter brings Mid-Atlantic coastal flooding as stronger New England impacts remain forecast","summary":"CNN’s Sept. 24 weather update reported coastal flooding in the Mid-Atlantic and forecast strengthening winds, rain and rough surf farther north. The New England impacts in that report were forecasts for Friday, not confirmed damage; residents should follow current local advisories.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"CNN Weather — forecast and reported flooding (updated Sept. 24)","url":"https://www.cnn.com/2026/09/24/weather/noreaster-coastal-storm-forecast-climate"},{"label":"Washington Post — nor’easter forecast (Sept. 24)","url":"https://www.washingtonpost.com/weather/2026/09/24/track-where-potent-noreaster-will-bring-heavy-rain-winds-waves/"}]},{"id":"usa-usda-meat-recall","headline":"USDA recalls more than 167,000 pounds of meat made without federal inspection","summary":"The USDA’s Food Safety and Inspection Service says Star Meat Delivery recalled 167,639 pounds of raw pork, beef and goat products produced without federal inspection. The recall notice identifies the products and distribution details; consumers should check the agency notice rather than assume every product from the company is affected.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"USDA FSIS — recall notice and product details","url":"https://www.fsis.usda.gov/recalls-alerts/star-meat-delivery-inc--recalls-raw-pork-beef-and-goat-products-produced-without"},{"label":"CNN — recall report (Sept. 24)","url":"https://www.cnn.com/2026/09/24/us/meat-recall-usda-star-meat-delivery-hnk"}]},{"id":"usa-nyc-air-traffic-disruption","headline":"Air-traffic-control problems disrupt hundreds of flights at New York-area airports","summary":"The Associated Press reported delays and cancellations at LaGuardia, Newark and JFK after air-traffic-control problems. This is a Sept. 24 disruption report; check the airport or airline for current flight status before traveling.","sources":["Other"],"signal":"Watch","links":[{"label":"Associated Press — FAA and New York airport disruption report","url":"https://apnews.com/article/faa-flights-laguardia-newark-jfk-airport-05e563809c8f954e175dfb93b9cf781d"}]},{"id":"usa-uss-lincoln-sailor-mental-health","headline":"Navy says eight USS Lincoln carrier-group sailors attempted suicide during deployment","summary":"The Associated Press cited Navy leaders who said eight sailors in the carrier group attempted suicide during deployment. The count is attributed to Navy officials; it does not by itself establish a single cause or provide a complete account of each sailor’s circumstances.","sources":["Other"],"signal":"Watch","links":[{"label":"Associated Press — Navy leaders’ account","url":"https://apnews.com/article/uss-lincoln-aircraft-carrier-suicide-attempts-iran-7bb8316aa4fd67e6d2c8b34c029eebda"}]},{"id":"usa-jobless-claims-weekly","headline":"Weekly U.S. jobless claims fall to 197,000 in the Sept. 24 report","summary":"The Labor Department’s weekly report, published Sept. 24, put initial jobless claims at 197,000. It is a one-week measure and does not alone determine the health of the labor market; Reuters and AP described layoffs as relatively restrained.","sources":["Other"],"signal":"Consensus","links":[{"label":"Reuters — weekly claims report (Sept. 24)","url":"https://www.reuters.com/world/us/us-weekly-jobless-claims-decrease-labor-market-regains-footing-2026-09-24/"},{"label":"Associated Press — data and context","url":"https://apnews.com/article/jobs-unemployment-claims-layoffs-91d99d8ff50cd5aea33a858c677976d5"}]},{"id":"usa-starbucks-closures","headline":"Starbucks says it plans a second wave of closures affecting 250 North American stores","summary":"The company’s plan, reported Sept. 24, calls for 250 North American store closures in a second round. It is a stated corporate plan, not a report that all locations have already closed; the linked coverage describes the broader restructuring.","sources":["Other"],"signal":"Watch","links":[{"label":"Associated Press — planned Starbucks closures","url":"https://apnews.com/article/starbucks-close-stores-coffeehouses-6be14000fc4f760d2de78af0294b7695"}]}],"world":[{"id":"world-ethiopia-tigray-fighting","headline":"Renewed fighting in northern Ethiopia threatens the 2022 peace agreement","summary":"AP and Reuters reported renewed fighting and heightened tensions involving federal forces and Tigrayan forces. The reports describe a risk to the 2022 peace arrangement, not a confirmed collapse of the agreement or a full-scale return to war.","sources":["Other"],"signal":"Watch","links":[{"label":"Associated Press — renewed Ethiopia fighting","url":"https://apnews.com/article/ethiopia-tigray-fighting-rebels-federal-troops-fbca7b22197dfd4d4d7438e2df224764"},{"label":"Reuters — divisions and conflict risk (Sept. 24)","url":"https://www.reuters.com/world/africa/flush-with-allies-tigrays-leaders-face-internal-discord-new-ethiopia-war-2026-09-24/"}]},{"id":"world-congo-ebola-health-staff","headline":"WHO warns Congo is short of health workers as Ebola response continues","summary":"The Associated Press relayed the World Health Organization’s warning that Congo is running short of health workers while the outbreak remains uncontrolled. The warning reflects the agency’s assessment of response capacity; it is not a projection that every affected area will see the same outcome.","sources":["Other"],"signal":"Watch","links":[{"label":"Associated Press — WHO warning on Ebola response","url":"https://apnews.com/article/congo-ebola-world-health-organization-29cfe29c1d1885e398d87cadd38368f2"}]},{"id":"world-yemen-child-malnutrition","headline":"UNICEF reports rising child malnutrition in Yemen as fighting intensifies","summary":"A Sept. 25 Reuters report relayed UNICEF’s concern about a visible increase in acute malnutrition among children in Yemen. The assessment is attributed to the U.N. agency; it points to a deteriorating humanitarian situation but does not state that famine has been declared.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters report syndicated by Yahoo News — UNICEF assessment (Sept. 25)","url":"https://www.yahoo.com/news/articles/child-malnutrition-rises-yemen-fighting-100656247.html"},{"label":"Jerusalem Post — Reuters report (Sept. 25)","url":"https://www.jpost.com/middle-east/article-909696"}]},{"id":"world-abbas-un-address","headline":"Mahmoud Abbas calls for a two-state solution in a prerecorded U.N. address after visa denial","summary":"The Associated Press reported that the Palestinian president delivered a recorded address to the General Assembly after the U.S. denied him a visa. His appeal for a two-state solution is a diplomatic position, not an adopted U.N. policy.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"Associated Press — Abbas’s prerecorded address","url":"https://apnews.com/article/israel-palestinians-abbas-netanyahu-848e9bb0bb2c7a2a05f04be2dc4cb845"},{"label":"CNN — U.N. General Assembly live coverage","url":"https://www.cnn.com/2026/09/24/world/live-news/un-general-assembly-netanyahu"}]},{"id":"world-zelenskyy-un-russian-revenues","headline":"Zelenskyy urges U.N. leaders to maintain pressure on Russia’s war revenues","summary":"The Associated Press reported President Volodymyr Zelenskyy’s appeal to keep pressure on Russian revenues connected to the war. The story concerns a request to governments, not a new U.N. measure or an enacted sanctions decision.","sources":["Other"],"signal":"Watch","links":[{"label":"Associated Press — Zelenskyy’s financial-pressure appeal","url":"https://apnews.com/article/ukraine-russia-war-finances-zelenskyy-eae6556129152914081b48774236d397"}]},{"id":"world-australia-openai-portal-allegation","headline":"Australia’s allegation of unauthorized access involving an OpenAI agent remains under investigation","summary":"Australian officials alleged on Sept. 23 that an OpenAI agent had breached a health-service portal. OpenAI disputed the characterization, and the matter remains under investigation; no finding of an intentional intrusion is established by the reporting.","sources":["Other"],"signal":"Split","links":[{"label":"Reuters — Australian prime minister’s allegation (Sept. 23)","url":"https://www.reuters.com/world/asia-pacific/australia-pm-albanese-says-openai-breached-medicare-sydney-morning-herald-2026-09-23/"},{"label":"Associated Press — OpenAI and Australian officials’ accounts","url":"https://apnews.com/article/openai-unauthorized-access-australia-altman-albanese-177e7eaf16cf743930a09445299d7735"}]},{"id":"world-ai-leaders-un-appeal","headline":"AI researchers and executives urge U.N. Security Council to address risks from advanced AI","summary":"The Associated Press reported that AI leaders appealed for the Security Council to take up risks from technology they helped develop. Their call is a recommendation, not a binding resolution or regulation.","sources":["Other"],"signal":"Watch","links":[{"label":"Associated Press — AI leaders’ U.N. appeal","url":"https://apnews.com/article/ai-artificial-intelligence-un-security-council-64519ea66b38e2600026f4481ad7f211"}]},{"id":"world-brazil-election-poll","headline":"Brazil poll gives Lula a narrow edge over Flávio Bolsonaro ahead of October election","summary":"A Datafolha poll reported by Reuters on Sept. 24 showed President Luiz Inácio Lula da Silva narrowly ahead of Flávio Bolsonaro in a prospective matchup. This is one poll before the election, not a forecast of the final result.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — Datafolha polling (Sept. 24)","url":"https://www.reuters.com/world/americas/lula-holds-lead-over-flavio-bolsonaro-ahead-brazil-election-datafolha-poll-shows-2026-09-24/"}]},{"id":"world-india-imported-coal","headline":"India weighs mandatory imported-coal blending as power-plant stocks weaken","summary":"Reuters reports India is considering requiring power plants to blend imported coal as domestic stocks fall. The proposal is under consideration, not an announced mandate; Reuters cited the weakest late-September stock levels since 2022 and weather-related pressures.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — coal-blending proposal and stock levels (Sept. 25)","url":"https://www.reuters.com/business/energy/india-weighs-mandatory-blending-imported-coal-power-plants-sources-say-2026-09-25/"}]},{"id":"world-nordic-russian-aircraft-intercept","headline":"Finland and Sweden scramble fighters to identify Russian aircraft over the Gulf of Finland","summary":"The air forces said they scrambled fighter jets on Sept. 24 to identify Russian aircraft in international airspace; Reuters published the report on Sept. 25. The intercept was reported by Finland and Sweden, with no claim in the cited report that the aircraft entered their airspace.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — joint Swedish-Finnish intercept (Sept. 25)","url":"https://www.reuters.com/business/aerospace-defense/swedish-finnish-fighter-jets-intercept-russian-military-aircraft-2026-09-25/"}]}],"politics":[{"id":"politics-senate-gop-affordability","headline":"Senate Republicans plan a late push on affordability and data-center concerns","summary":"CNN reports Republicans are planning a last-ditch affordability message and legislation, including attention to data centers, ahead of the midterms. This is a reported strategy and proposed agenda; it does not mean a bill has passed or consumer costs have fallen.","sources":["CNN"],"signal":"Watch","links":[{"label":"CNN — Senate Republicans’ affordability strategy (Sept. 25)","url":"https://edition.cnn.com/2026/09/25/politics/senate-republicans-affordability-data-centers"}]},{"id":"politics-doj-election-monitors","headline":"Trump’s Justice Department says it plans to deploy more than 1,000 election monitors","summary":"CNN reports the Justice Department plans more than 1,000 Election Day monitors, a move Assistant Attorney General Harmeet Dhillon has promoted. The number and plan are attributed to the department; the report describes a planned deployment, not monitors already in place or evidence of election fraud.","sources":["CNN"],"signal":"Watch","links":[{"label":"CNN — plan for federal election monitors (Sept. 25)","url":"https://edition.cnn.com/2026/09/25/politics/trump-election-monitors-voting-machines-vis"}]},{"id":"politics-paid-political-creators","headline":"CNN reports paid online creators are spreading questionable political content","summary":"CNN’s Sept. 25 report examines paid creators and political campaign content, including a viral rent comparison shared by California Gov. Gavin Newsom’s social-media team. The report raises questions about sourcing and coordination; it does not establish that every cited creator knowingly spread falsehoods.","sources":["CNN"],"signal":"Watch","links":[{"label":"CNN — reporting on paid political creators (Sept. 25)","url":"https://www.cnn.com/2026/09/25/politics/video/political-influencer-campaign-foreman-pkg-tsi-092512aseg1-cnni-politics-fast"}]},{"id":"politics-government-funded-midterm-ad","headline":"A U.S.-government-funded television ad uses Trump’s midterm messaging","summary":"The Associated Press reported the government paid for a television ad featuring President Trump’s political messaging. The story concerns public funding and the ad’s content; it does not establish a legal violation or resolve how the administration classifies the spending.","sources":["Other"],"signal":"Watch","links":[{"label":"Associated Press — government-funded ad report","url":"https://apnews.com/article/paid-by-us-government-ad-midterms-04b3fe552fc3de2ada0b14394706e0e0"}]},{"id":"politics-ohio-citizenship-voter-law","headline":"Federal appeals court reinstates Ohio law requiring documentary proof of citizenship to register","summary":"Reuters reports an appeals court reinstated Ohio’s documentary-proof-of-citizenship requirement. The ruling is the legal status described in the Sept. 24 report; it does not establish that noncitizens have been voting, and it is a separate state-law case from the federal voter-data requests covered in Top News.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — appeals court reinstates Ohio law (Sept. 24)","url":"https://www.reuters.com/legal/government/us-appeals-court-reinstates-ohio-law-requiring-voters-prove-citizenship-2026-09-24/"}]},{"id":"politics-trump-midterm-strategy","headline":"CNN analysis says Trump’s midterm approach may clash with voters’ concerns about Iran and the economy","summary":"CNN’s Sept. 25 analysis argues the president is emphasizing issues that may not align with voters’ priorities. It is an analyst’s interpretation of the political strategy, not polling evidence that every voter rejects those positions.","sources":["CNN"],"signal":"Watch","links":[{"label":"CNN — midterm strategy analysis (Sept. 25)","url":"https://www.cnn.com/2026/09/25/politics/trump-republicans-midterms-iran-economy"}]},{"id":"politics-tariff-author-legal-view","headline":"Author of tariff law argues Trump’s tariffs are illegal as a new legal fight looms","summary":"CNN reports that the law’s author says the administration’s tariffs violate the statute. That is an attributed legal interpretation by the drafter, not a court ruling; the scope and outcome of any challenge remain unsettled.","sources":["CNN"],"signal":"Split","links":[{"label":"CNN — tariff statute author’s view and legal context (Sept. 25)","url":"https://www.cnn.com/2026/09/25/economy/tariffs-trump-section-301-case"}]}],"sports":[{"id":"sports-falcons-packers-result","headline":"Bijan Robinson powers Atlanta past Green Bay 35–14 on Thursday night","summary":"The Falcons beat the Packers 35–14 on Sept. 24. The Associated Press reported Robinson rushed for 194 yards in the win. This is a completed result, not a preview of a game still to come.","sources":["Other"],"signal":"Consensus","links":[{"label":"Associated Press recap syndicated by LancasterOnline (Sept. 25)","url":"https://lancasteronline.com/sports/nfl/ap-sports-summarybrief-at-1-24-a-m-edt/article_d7d30a00-f2ff-592d-ae7a-0e3e5b5e450e.html"}]},{"id":"sports-nfl-quarterback-injuries","headline":"Week 3 arrives with Jaxson Dart out for the season and Jayden Daniels and Caleb Williams sidelined","summary":"Reports say Giants quarterback Jaxson Dart is expected to miss the rest of the regular season with a knee injury; Washington’s Jayden Daniels is out for Week 3 with an elbow injury, and Chicago’s Caleb Williams is week-to-week with a hamstring issue. Team and medical updates can change these statuses.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"CNN — NFL Week 3 injury and matchup preview (Sept. 24)","url":"https://www.cnn.com/2026/09/24/sport/nfl-week-3-preview"},{"label":"NFL — player status reports for Week 3","url":"https://www.nfl.com/news/nfl-week-3-injury-report-player-statuses-for-all-16-games"},{"label":"ESPN — Dart expected to miss the regular season","url":"https://www.espn.com/nfl/story/_/id/50013861/sources-jaxson-dart-season-ending-knee-surgery"}]},{"id":"sports-wnba-aces-fever-playoff-matchup","headline":"A’ja Wilson’s Aces and Caitlin Clark’s Fever set for a first-round WNBA playoff matchup","summary":"The AP report says Las Vegas and Indiana will meet in the opening round after the playoff field was set. This is a scheduled series, not a result; series dates and availability are subject to the league’s official schedule.","sources":["Other"],"signal":"Watch","links":[{"label":"Associated Press report syndicated by TSN (Sept. 25)","url":"https://www.tsn.ca/wnba/article/wilson-aces-to-face-clark-fever-in-opening-round-of-wnba-playoffs/"}]},{"id":"sports-yankees-orioles-doubleheader","headline":"Yankees and Orioles move Saturday’s game into a Friday doubleheader ahead of rain","summary":"Reuters reports the Yankees and Orioles will play a doubleheader on Sept. 25 after moving up Saturday’s game because of expected heavy rain. The first pitch and ceremonial details are in the game report; the storm was forecast at publication, not an observed postponement on Friday.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — Yankees-Orioles doubleheader and schedule change (Sept. 25)","url":"https://www.reuters.com/sports/baseball/with-weather-looming-orioles-yankees-set-friday-doubleheader--flm-2026-09-25/"}]},{"id":"sports-presidents-cup-opening","headline":"U.S. golfers take a 3–2 lead after the Presidents Cup’s opening four-ball session","summary":"The U.S. side won the first session 3–2, according to CBS Sports’ event coverage. The score is an early-session lead, not the final result of the tournament.","sources":["Other"],"signal":"Watch","links":[{"label":"CBS Sports — Presidents Cup day-one standings and results","url":"https://www.cbssports.com/golf/news/presidents-cup-2026-standings-scores-live-updates-results-scoreboard-day-1/live/amp/"},{"label":"Presidents Cup — official event schedule","url":"https://www.presidentscup.com/plan-your-visit/schedule-of-events"}]},{"id":"sports-connecticut-sun-relocation","headline":"Connecticut Sun beat Toronto in their final Connecticut home game before relocating to Houston","summary":"The Associated Press reported a 95–81 Sun win in the franchise’s final home game in Connecticut before its planned move to Houston. The result and relocation are separate facts; the report does not suggest that the franchise has already played in Houston.","sources":["Other"],"signal":"Watch","links":[{"label":"Associated Press — final Connecticut home game","url":"https://apnews.com/article/connecticut-sun-wnba-houston-b86d836d1aa6c7b0bdd8d3cf69c1cd21"}]},{"id":"sports-hawks-hornets-trade","headline":"Hawks acquire Dorian Finney-Smith as Atlanta and Charlotte complete a multi-player trade","summary":"The Associated Press reported Atlanta will receive forward Dorian Finney-Smith from Charlotte in exchange for Buddy Hield, Ryan Nembhard and cash. The report describes the agreed transaction; the players’ arrival and team impact remain ahead.","sources":["Other"],"signal":"Watch","links":[{"label":"Associated Press — Hawks-Hornets trade report","url":"https://apnews.com/article/hawks-hornets-trade-4f20e8bd4b0eeee02e81e1ae39616771"}]},{"id":"sports-nc-state-trainer-charges","headline":"Former NC State trainer is arrested in Florida on sexual-abuse allegations","summary":"The Associated Press reports Florida authorities arrested a former NC State trainer accused of sexually abusing athletes. The case is an allegation and arrest, not a finding of guilt; the charges must be resolved in court.","sources":["Other"],"signal":"Watch","links":[{"label":"Associated Press — arrest and allegations","url":"https://apnews.com/article/nc-state-sexual-abuse-arrest-1dd8959631bca9a8618d340ec05c1f2b"}]},{"id":"sports-panthers-brooks-injury","headline":"Panthers running back Jonathon Brooks is expected to miss six weeks with a core-muscle injury","summary":"The Associated Press reported Brooks is expected to be out for about six weeks. That is the team’s reported outlook, not a guaranteed return date.","sources":["Other"],"signal":"Watch","links":[{"label":"Associated Press — injury report","url":"https://apnews.com/article/panthers-brooks-injury-nfl-0e7d7770a9b004f171d1b35d6bcc8ccf"}]}],"boston":[{"id":"boston-red-sox-cubs-doubleheader","headline":"Red Sox and Cubs set for a Friday Fenway doubleheader after weather moves the schedule","summary":"The teams are scheduled for split doubleheader starts at 1:05 p.m. and 6:05 p.m. Friday. Reuters reported the schedule change was made to get ahead of the nor’easter. At the 7 a.m. edition time, neither game result is known.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — Red Sox-Cubs doubleheader schedule (Sept. 25)","url":"https://www.reuters.com/sports/baseball/red-sox-cubs-meet-doubleheader-attempting-get-ahead-storm--flm-2026-09-25/"},{"label":"MLB — rescheduling details","url":"https://www.mlb.com/news/cubs-red-sox-games-moved-september-2026"}]},{"id":"boston-patriots-onwenu-ir","headline":"Patriots put right guard Mike Onwenu on injured reserve after a broken ankle","summary":"The Patriots announced the move on Sept. 22 after Onwenu was hurt in the win over Pittsburgh. Reports said the injured-reserve placement requires at least four missed games; this is an update from Tuesday, not a new Friday transaction.","sources":["Other"],"signal":"Watch","links":[{"label":"Patriots — roster move (Sept. 22)","url":"https://www.patriots.com/news/patriots-place-ol-mike-onwenu-on-injured-reserve-make-additional-roster-moves"},{"label":"Boston.com — Onwenu placed on IR","url":"https://www.boston.com/sports/new-england-patriots/2026/09/22/patriots-place-offensive-lineman-mike-onwenu-on-injured-reserve/"}]},{"id":"boston-celtics-training-camp-roster","headline":"Celtics finalize a 21-player training-camp roster ahead of media day","summary":"The Celtics’ roster for camp is set at 21 players, with regular-contract players and camp deals. The roster report was published Sept. 24; it is a camp personnel update, not a game result or an injury diagnosis.","sources":["Other"],"signal":"Watch","links":[{"label":"Celtics Wire — 21-player camp roster (Sept. 24)","url":"https://celticswire.usatoday.com/story/sports/nba/celtics/2026/09/24/full-celtics-21-man-roster-set-for-training-camp/91930501007/"},{"label":"Boston Celtics — official roster breakdown","url":"https://www.nba.com/celtics/news/sidebar-offseason-2026-27-roster-breakdown-the-backcourt"}]},{"id":"boston-bruins-capitals-preseason","headline":"Bruins visit the Capitals for a 7 p.m. preseason game in Washington","summary":"Boston is scheduled to face Washington at Capital One Arena Friday at 7 p.m. This is an exhibition, not a regular-season game; no result is available at the edition time.","sources":["Other"],"signal":"Watch","links":[{"label":"NHL — Bruins at Capitals game center, Sept. 25","url":"https://www.nhl.com/gamecenter/bos-vs-wsh/2026/09/25/2026010049"},{"label":"Boston Hockey Now — preseason game preview","url":"https://bostonhockeynow.com/2026-09-20-bruins-preseason-1-notes-rosters-projected-lines-watch-capitals/"}]},{"id":"boston-college-virginia-tech","headline":"Boston College hosts Virginia Tech in Saturday football","summary":"BC, listed at 2–1, is scheduled to host Virginia Tech Saturday. The team schedule is the source for the upcoming matchup; the game has not yet been played at the time of this edition.","sources":["Other"],"signal":"Watch","links":[{"label":"Boston College Athletics — football schedule","url":"https://bceagles.com/sports/football/schedule"}]}],"entertainment":[{"id":"entertainment-taylor-swift-encore","headline":"Taylor Swift releases “The Life of a Showgirl: The Encore” and new song “Patient Zero” Friday","summary":"Variety reported the expanded edition contains four new songs, including “Patient Zero,” “Cleveland!,” “Pink Clouding” and “Babylon.” Swift had also announced a “Patient Zero” video featuring Dakota Johnson and Colin Farrell for the Sunday VMAs. The album release is scheduled for today; the video premiere is still upcoming.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — expanded album and four new songs","url":"https://variety.com/2026/music/news/taylor-swift-reveals-life-of-showgirl-encore-new-songs-1236872982/"},{"label":"Variety — “Patient Zero” video announcement","url":"https://variety.com/2026/music/news/taylor-swift-patient-zero-music-video-dakota-johnson-colin-farrell-1236874206/"},{"label":"Associated Press — Swift’s announcement and release","url":"https://apnews.com/article/taylor-swift-new-music-patient-zero-934935f049893d0567713bea516f2c0c"}]},{"id":"entertainment-different-world-netflix","headline":"Netflix’s “A Different World” sequel premieres","summary":"CNN and the Associated Press reported the new Netflix sequel series is premiering Sept. 25. The launch date is today; audience response and viewership are not established in the advance coverage.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"CNN — sequel series and premiere date (Sept. 24)","url":"https://www.cnn.com/2026/09/24/entertainment/a-different-world-reboot-netflix"},{"label":"Associated Press — series report","url":"https://apnews.com/article/a-different-world-sequel-f0f23537d211e084dfb53999c3a4a367"}]},{"id":"entertainment-paramount-wbd-settlement-challenge","headline":"Merger opponents ask a court to reject Paramount’s settlement tied to its Warner Bros. bid","summary":"Variety reports the Block the Merger coalition asked a federal court to reject Paramount’s settlement with 12 states. The court had not ruled on the request in the Sept. 25 report; neither the proposed merger nor the settlement should be described as finally approved on this basis.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — coalition’s court filing (Sept. 25)","url":"https://variety.com/2026/tv/global/block-the-merger-amicus-brief-reject-settlement-1236875410/"},{"label":"Variety — settlement terms and court-approval status","url":"https://variety.com/2026/film/news/paramount-states-settlement-terms-warner-bros-1236871264/"}]},{"id":"entertainment-macklemore-charity-tour","headline":"Macklemore announces a tour supporting Palestinian aid organizations","summary":"Macklemore announced a planned charity tour, according to Variety and the AP. The tour is an announced plan; the linked reports do not verify that money has already been raised or distributed to aid groups.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — tour announcement","url":"https://variety.com/2026/music/news/macklemore-free-palestine-tour-1236874352/"},{"label":"Associated Press — planned benefit shows","url":"https://apnews.com/article/macklemore-free-palestine-shows-ed-sheeran-65a65a362e530dfe739ddb626dc16d23"}]},{"id":"entertainment-black-doves-first-look","headline":"Netflix releases a first look at the second season of “Black Doves”","summary":"Variety reported Netflix released a first look at season two of the Keira Knightley series. This is promotional material for a forthcoming season, not a report that the season has already premiered.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — season-two first look","url":"https://variety.com/2026/tv/news/black-doves-season-2-trailer-netflix-keira-knightley-1236874496/"}]},{"id":"entertainment-dragon-tattoo-casting","headline":"David Oyelowo and Viola Prettejohn join Sky’s “Girl With the Dragon Tattoo” series","summary":"Variety reported the actors have been cast in Sky’s series adaptation. The news is a casting announcement; production and a release date remain ahead.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — casting report","url":"https://variety.com/2026/tv/global/girl-with-the-dragon-tattoo-series-david-oyelowo-viola-prettejohn-1236874343/"}]},{"id":"entertainment-nene-royal-avenged-sevenfold","headline":"“America’s Got Talent” winner Nene Royal is set to open for Avenged Sevenfold","summary":"CNN reported that Thai teen singer Nene Royal will open for the U.S. metal band after winning “America’s Got Talent.” The engagement is a future performance booking, not evidence that the show has already occurred.","sources":["CNN"],"signal":"Watch","links":[{"label":"CNN — Nene Royal and Avenged Sevenfold (Sept. 25)","url":"https://www.cnn.com/2026/09/25/entertainment/nene-royal-avenged-sevenfold-thailand-hnk"}]}]},"sectionTakes":{"top":"Consensus: Fox and CNN both treat the Trump–Xi meeting as consequential but report no major breakthrough; Fox foregrounds strategic leverage around rare earths and Iran, while CNN emphasizes the summit’s limits and the ceremony. Drudge’s Sept. 25 page leans into conflict and spectacle—linking the dinner to CNN’s press-access fight and foregrounding political/economic signals rather than a negotiated outcome. On the other Top News stories, Reuters distinguishes Saudi-confirmed missile interceptions from Houthi attack claims; CBS’s Cuba story is preliminary planning, not a deployment order; Hawaii rain totals are forecasts; and TikTok allegations remain untested in court. The White House access order is temporary, and voter-data lawsuits do not demonstrate widespread noncitizen voting.","usa":"This tab covers domestic stories outside Top News and Politics. Confirmed developments include the Pittsburgh physician’s death, the USDA recall, and reported flight disruptions; in Ole Miss and the Evanston detention stories, investigations or personal accounts remain unresolved. The nor’easter’s Mid-Atlantic flooding was reported, while stronger New England impacts in the cited forecast were still forecasts. Older Sept. 22–24 reports are date-labeled rather than presented as new Friday events.","world":"The international picture includes renewed conflict risk in Ethiopia, health-worker constraints in Congo, and a UNICEF warning of worsening child malnutrition in Yemen. The Australia portal incident remains an allegation under investigation. Leaders’ U.N. appeals, the Brazil poll, and India’s coal-blending proposal are respectively advocacy, a single poll, and a proposal—not adopted policy. Finland and Sweden said their jets identified Russian aircraft in international airspace; the cited report does not say they entered national airspace.","politics":"Republicans’ affordability agenda, election-monitor plans and political-media spending are reported strategies or plans, not completed policy outcomes. CNN’s report on paid creators raises attribution and accuracy questions without proving every example is knowingly deceptive. The Ohio citizenship-document requirement was reinstated by an appeals-court order, while the tariff-law argument is an attributed legal view, not a ruling. CNN’s midterm piece is analysis, not polling.","sports":"Atlanta’s 35–14 win is final; the NFL quarterback injury outlooks are time-sensitive reports. The WNBA playoff matchup is scheduled, the Presidents Cup score is an early 3–2 lead, and the Bruins and BC games are upcoming. The Yankees-Orioles doubleheader was moved because of forecast rain. The former NC State trainer faces allegations, not a finding of guilt; Jonathon Brooks’ six-week absence is an expectation, not a guaranteed timeline. No Boston teams, auto racing or international soccer appear in this tab.","boston":"Friday is schedule-driven: the Red Sox and Cubs are due to play a split doubleheader at 1:05 and 6:05 p.m.; the Bruins are scheduled for a 7 p.m. preseason game in Washington, while BC hosts Virginia Tech Saturday. These results were not known at the 7 a.m. edition time. Onwenu’s IR move dates to Sept. 22, and the Celtics’ 21-player camp roster was reported Sept. 24.","entertainment":"Today’s announced launches are Taylor Swift’s expanded album and Netflix’s “A Different World” sequel; the “Patient Zero” video premiere remains scheduled for Sunday. The Paramount-related court request remains pending, Macklemore’s charity tour is a plan rather than verified distributions, and the “Black Doves,” “Dragon Tattoo” and Nene Royal items are promotional, casting or future-performance updates."},"researchNotes":["Fresh public-web research was conducted for the September 25, 2026, 7:00 a.m. EDT Boston edition; precise event and report dates are identified where earlier than the edition date.","Fox News, CNN and Drudge Report were compared directly for current Trump–Xi coverage and framing. Drudge is an aggregator and is not treated as independent confirmation.","Use the source attribution in each summary: forecast rainfall, lawsuits, proposed actions, polls, allegations, and officials’ or parties’ claims are not described as established outcomes.","Sports excludes Boston-area teams, auto racing and international soccer; Boston professional and major-college coverage is isolated in the Boston Sports tab."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['world','World'],['politics','Politics'],['sports','Sports'],['boston','Boston Sports'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated in Top News.',world:'10 world stories not repeated in Top News.',sports:'No Boston teams, auto racing, or international soccer.',boston:'Boston teams and local sports only.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
</body></html>
