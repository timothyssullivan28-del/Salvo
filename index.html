<script id="briefing" type="application/json">{"date":"2026-10-06","lastUpdated":"October 6, 2026, 7:58:01 a.m. EDT Boston","dek":"Tuesday’s briefing: a developing Russia lab story, rising election-year tensions and a fresh market look before the opening bell.","take":"Coverage converges on the Russian lab-worker death, but Fox uses stark biosecurity framing, CNN’s Oct. 5 report stresses the unknown cause, and Drudge spotlights more dramatic and speculative links. Drudge is an aggregator, not an independent reporting source. Elsewhere, the edition separates Saudi officials’ airport-strike account and a Russian governor’s drone-casualty claim from verified outcomes; Quebec’s election, Halzen’s Nobel award and the U.S.–China site discussions are reported developments.","sectionTakes":{"top":"Coverage converges on the Russian lab-worker death, but Fox uses stark biosecurity framing, CNN’s Oct. 5 report stresses the unknown cause, and Drudge spotlights more dramatic and speculative links. Drudge is an aggregator, not an independent reporting source. Elsewhere, the edition separates Saudi officials’ airport-strike account and a Russian governor’s drone-casualty claim from verified outcomes; Quebec’s election, Halzen’s Nobel award and the U.S.–China site discussions are reported developments.","usa":"Tuesday brings a fatal school-bus crash, a new Cornell governance fight and a major social-media liability verdict, alongside continuing measles and military-care coverage. The Cornell claims, Coast Guard account, and soldiers’ descriptions are attributed; the Head Start change is only proposed. The disputed border-shooting account and press-pool exclusion add federal-policy and accountability angles.","boston":"Tuesday’s Boston board is quiet: none of the four pro teams has a game scheduled today as of the edition check. Ottawa’s 4–1 win over the Bruins and New England’s 29–26 win in Buffalo are finals; the next listed Bruins and Celtics games are Thursday, while the Patriots host Las Vegas Sunday. The Red Sox season ended 87–75 after a 2–0 Yankees sweep; Globe stories are partly paywalled and WEEI/Audacy pages expose limited full article text.","business":"At CNN’s latest available premarket update, 7:37 a.m. ET and delayed about 15 minutes, unadjusted index futures were Dow 51,881.00 (+323.00; +0.63%), S&P 500 7,860.75 (+34.50; +0.44%) and NASDAQ 31,508.75 (+191.00; +0.61%); NASDAQ futures are an index proxy, not the cash Composite. Latest completed U.S. session: Monday, Oct. 5—Dow 51,267.90, +90.94 (+0.18%), and Nasdaq Composite 27,477.31, +286.45 (+1.05%), per Reuters and cross-checked with AP closing levels and point moves. Futures pointed higher before the open, but higher Treasury yields and company-specific AI, energy and earnings bets remain in focus.","world":"The international file mixes new security developments—the Black Sea ship sinking, a reported China-Laos military site and a French missile test—with elections and trials. Claims about the mine blast, submarine missile and Brazil’s political momentum remain attributed to the governments, prosecutors or reporting sources. Spain’s housing campaign and Latvia’s coalition process are still unfolding, not completed outcomes.","sports":"Monday’s playoff and league results set the table: the Rays and White Sox lead their ALDS 2–0, Atlanta routed New Orleans, and the WNBA semifinals opened with two road wins. Tuesday’s MLB schedule features two NLDS Game 3s; no series has been decided by those leads alone. Ovechkin’s final-season announcement, an NBA preseason technology test and a China Open disqualification round out the file.","politics":"The midterm campaign moves from rhetoric to action as Ohio early voting begins and candidates target toss-up seats. Trump’s mail-voting pivot and super-PAC funding announcement are messaging changes, while the Arizona ballot mailing was an administrative error and polling captures sentiment rather than outcomes. The Republicans’ crime focus and daylight-saving proposal remain campaign or legislative fights, not enacted policy.","entertainment":"Fresh industry news spans Jim Bakker’s death, a union-backed warning about U.S. production, and new film and TV development. “Digger” losses are estimates, Hulu’s Jenner project is still being finalized, and the Batman production pause carries no announced release-date change. The stories distinguish completed events from projects and projections."},"sections":{"top":[{"id":"top-russia-lab-oct6","headline":"Oct. 6 update: Russia reports no plague cases among contacts of deceased lab worker","summary":"A worker at Siberia’s Irkutsk anti-plague institute died after pneumonia of unknown origin; Russian officials now say contacts have not tested positive for plague, while Secretary of State Marco Rubio is pressing Moscow for more information. Neither plague infection nor a lab release has been established, despite more alarming speculation prominent on Drudge.","sources":["Fox","CNN","Drudge","Other"],"signal":"Watch","links":[{"label":"AP — worker death and unknown cause","url":"https://apnews.com/article/russia-disease-plague-researcher-pneumonia-9ddc8e3e064637853407bfd24d8937f5"},{"label":"Reuters — Russia says no plague among contacts, Oct. 6","url":"https://www.reuters.com/business/healthcare-pharmaceuticals/russia-says-no-plague-cases-have-been-detected-among-contacts-deceased-lab-worker-2026-10-06/"},{"label":"Reuters — Rubio asks for more information, Oct. 6","url":"https://www.reuters.com/world/europe/rubio-tells-russia-share-more-information-about-plague-death-2026-10-06/"},{"label":"Fox News — Russian lab death, Oct. 6","url":"https://www.foxnews.com/world/mystery-death-russian-plague-lab-triggers-sweeping-precautions-us-watches-closely"},{"label":"CNN (via KVIA) — Russian lab worker dies of unknown infection, Oct. 5","url":"https://kvia.com/news/us-world/cnn-world/2026/10/05/researcher-at-russian-plague-laboratory-dies-of-unknown-infection-2/"},{"label":"Drudge Report — plague links featured Oct. 6","url":"https://www.drudgereport.com/"}]},{"id":"top-yemen-airports-oct6","headline":"Saudi Arabia says two airports hit amid renewed Houthi fighting","summary":"Saudi authorities said two airports were struck as fighting with Houthi rebels resumed; the details and responsibility for the strikes remain attributed claims in a fast-moving regional conflict. AP reports the incidents alongside advances claimed by Saudi-backed Yemeni forces.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — Saudi airports hit, Oct. 6","url":"https://apnews.com/article/iran-yemen-israel-saudi-uae-gaza-october-6-2026-efdbaff2e5931655543fd86638682ad5"},{"label":"AP — Yemeni forces claim gains near Red Sea strait","url":"https://apnews.com/article/yemen-houthis-iran-saudi-arabia-red-sea-taiz-e87beb84a0d146e4f0546b50508f7e32"}]},{"id":"top-quebec-election-oct6","headline":"Quebec separatists win election but fall short of a majority","summary":"The Parti Québécois won Quebec’s election while missing the majority needed to govern alone, AP reports. Leader Paul St-Pierre Plamondon has promised an independence referendum but has said he would wait until Donald Trump is no longer president.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"AP — Quebec election result, Oct. 6","url":"https://apnews.com/article/canada-quebec-election-a4e8ecaa4026c46d0346e9487c5e333d"},{"label":"CNN — separatists win but fall short of majority","url":"https://www.cnn.com/2026/10/06/americas/quebec-separatist-party-elections-result-win-intl-hnk"}]},{"id":"top-us-china-nuclear-visits-oct6","headline":"U.S. and China discuss reciprocal visits to nuclear sites, CNN reports","summary":"Washington and Beijing have discussed reciprocal visits to nuclear facilities, CNN reported, citing people familiar with the matter; Reuters independently reported the CNN account. The discussion is not a public agreement or confirmation that visits have begun.","s e/francis-halzen-wins-2026-nobel-prize-physics-2026-10-06/"},{"label":"CNN — Nobel Prize in physics, Oct. 6","url":"https://www.cnn.com/2026/10/06/science/nobel-prize-physics-francis-halzen-winner-intl"}]},{"id":"top-okinawa-marine-oct6","headline":"Okinawa anger grows after U.S. Marine arrested in woman’s killing","summary":"Japanese residents and officials are expressing anger after a U.S. Marine was arrested on suspicion of killing a woman on Okinawa, AP reports. The arrest is an allegation under investigation, not a conviction, and the case renews local concern about the U.S. military presence.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — arrest and local reaction, Oct. 6","url":"https://apnews.com/article/japan-us-military-okinawa-marine-arrested-be87679d33e3c0d9e6e453a9e3e5826f"}]},{"id":"top-france-protests-oct6","headline":"France sees biggest day of school protests over staffing and facilities","summary":"Students, teachers and parents marched across France on Tuesday, while demonstrators blockaded hundreds of schools in a campaign over understaffing and deteriorating classrooms, Reuters reports. Protest activity and the scale of blockades were still unfolding at publication.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — nationwide school protests, Oct. 6","url":"https://www.reuters.com/world/europe/france-braces-day-school-blockades-street-protests-2026-10-06/"}]},{"id":"top-moscow-drone-attack-oct6","headline":"Russian governor says Ukrainian drones killed two and hit Moscow-region fuel hub","summary":"A Russian regional governor said Ukrainian drones killed two people, injured others and struck a fuel hub in one of the largest attacks on the Moscow region. Reuters attributes the casualty and damage account to Russian officials; independent verification was not provided in the report.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — Moscow-region drone attack, Oct. 6","url":"https://www.reuters.com/world/europe/ukrainian-drones-kill-two-moscow-region-injure-nine-more-governor-says-2026-10-06/"}]},{"id":"top-scotus-sweatshirt-case-oct6","headline":"Supreme Court rejects appeal over Michigan school’s “Let’s Go Brandon” sweatshirt ban","summary":"The Supreme Court declined to hear a challenge involving a Michigan school’s ban on “Let’s Go Brandon” sweatshirts, leaving the lower-court disposition in place. AP reports no separate opinion from the justices explaining the denial.","sources":["Other"],"signal":"Consensus","links":[{"label":"AP — Supreme Court rejects appeal, Oct. 6","url":"https://apnews.com/article/lets-go-brandon-michigan-school-supreme-court-d683aeba76e285321c9b38aa6a3271e4"}]}],"usa":[{"id":"usa-cornell-no-confidence-oct6","headline":"Cornell faculty plan no-confidence vote amid scrutiny of sexual-assault response","summary":"Faculty members at Cornell are planning a no-confidence vote on the university administration as protests continue over its handling of a reported gang-rape case. The allegations remain under investigation and have not been adjudicated; CNN and AP describe different parts of the campus response.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"CNN — faculty no-confidence vote, Oct. 6","url":"https://www.cnn.com/2026/10/06/us/cornell-no-confidence-vote-rape-case-hnk"},{"label":"AP — students protest Cornell response","url":"https://apnews.com/article/cornell-university-rape-investigation-70d74249bc779480975f3b2a4166ee97"}]},{"id":"usa-florida-schoolbus-crash-oct6","headline":"Two die, including a student, after Florida school bus overturns","summary":"Two people, including a student, died after a school bus rolled over in Florida, according to AP. Authorities were investigating the crash; the initial report did not establish a cause.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — Florida school bus crash, Oct. 6","url":"https://apnews.com/article/florida-school-bus-crash-cce0599ea5e01f0d30fb9457bd50b7e4"}]},{"id":"usa-iran-strike-medical-care-oct6","headline":"Wounded U.S. soldiers say military medical system failed them after Iranian drone strike","summary":"AP interviews with seriously wounded service members describe gaps in care after a deadly Iranian drone attack, while soldiers and Gold Star families press Army leadership for answers. The reporting documents their accounts and allegations; it is not a completed Army finding.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — wounded soldiers describe medical-care failures","url":"https://apnews.com/article/iran-war-soldiers-wounded-military-port-shuaiba-f867128532cb6746c26636c2dbaea2fb"},{"label":"AP — families press Army leadership","url":"https://apnews.com/article/iran-war-port-shuaiba-attack-soldiers-29f34587c6361261f6e803aff6791e8f"}]},{"id":"usa-social-media-addiction-verdict-oct6","headline":"Jury finds Instagram and YouTube liable in landmark social-media addiction trial","summary":"A jury found Instagram and YouTube liable in a case alleging their products harmed a young user, AP reports. The verdict is a significant legal development, but any damages and further appeals remain separate from the liability finding.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — social-media addiction trial verdict","url":"https://apnews.com/article/social-media-addiction-trial-la-5e54075023d837ccdc76c4ca512e9251"}]},{"id":"usa-pennsylvania-measles-oct6","headline":"Pennsylvania measles outbreak is the largest in decades, AP reports","summary":"Pennsylvania is experiencing its largest measles outbreak in decades, AP reports, amid continuing spread and public-health response. Case counts and exposure alerts can change; follow state health updates for current totals.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — Pennsylvania outbreak, Oct. 6","url":"https://apnews.com/article/measles-outbreak-pennsylvania-4cae9e5cd28a164a07ac69147505b763"}]},{"id":"usa-ny-measles-emergency-oct6","headline":"New York declares disaster emergency over measles outbreak","summary":"New York declared its first measles disaster emergency since the 2025 surge, Reuters reports. The designation is a public-health response, not an indication that the outbreak has ended.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — New York measles emergency, Oct. 5","url":"https://www.reuters.com/business/healthcare-pharmaceuticals/new-york-declares-disaster-emergency-over-measles-outbreak-2026-10-05/"}]},{"id":"usa-coast-guard-border-shooting-oct6","headline":"Mexico seeks evidence after U.S. reports Coast Guard personnel came under fire","summary":"U.S. officials said Coast Guard personnel encountered gunfire near the border, while Mexican authorities requested evidence about the incident. The claims and cross-border investigation remain unresolved, so attribution is important.","sources":["Other"],"signal":"Watch","links":[{"label":"Washington Post — Mexico wants evidence, Oct. 5","url":"https://www.washingtonpost.com/world/2026/10/05/us-says-coast-guard-came-under-fire-near-border-mexico-wants-evidence/"}]},{"id":"usa-politico-pool-exclusion-oct6","headline":"White House bars Politico from Air Force One press-pool assignment","summary":"The White House blocked Politico from a press-pool assignment aboard Air Force One, prompting a dispute over access and press-pool rules. The outlet’s exclusion is reported as an event; the administration’s rationale and the press corps’ criticism are competing positions.","sources":["Other"],"signal":"Split","links":[{"label":"Reuters — press-pool dispute, Oct. 5","url":"https://www.reuters.com/world/us/white-house-bars-politico-air-force-one-press-pool-assignment-2026-10-05/"}]},{"id":"usa-head-start-proposed-rule-oct6","headline":"Proposed Head Start rule would ease federal limits on suspensions","summary":"A proposed federal rule would loosen restrictions on when Head Start programs may suspend or expel children, AP r url":"https://apnews.com/article/trump-arizona-maricopa-county-mail-ballots-voting-fcbd40f8b0c0b778f50409bc994d4225"},{"label":"AP — county recorder response","url":"https://apnews.com/article/maricopa-county-recorder-arizona-election-73a8c98f977568e677dd5773ca341c1c"}]},{"id":"politics-vance-alaska-campaign-oct6","headline":"Vance casts Alaska as Republicans’ shield in midterm campaign","summary":"Vice President JD Vance made a campaign stop in Alaska and argued the state could help Republicans defend their position in the midterms, Reuters reports. The remarks are campaign messaging, not a prediction of election results.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — Vance Alaska campaign stop, Oct. 6","url":"https://www.reuters.com/legal/government/vance-rallies-alaska-high-stakes-campaign-stop-2026-10-06/"}]},{"id":"politics-gop-tough-crime-oct6","headline":"Republicans return to tough-on-crime message ahead of difficult midterms","summary":"Republicans are emphasizing crime as they seek to mobilize voters ahead of a challenging midterm cycle, AP reports. The party’s strategy is political messaging; claims about crime trends should be weighed against the data and local conditions.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — Republicans and crime messaging, Oct. 6","url":"https://www.usnews.com/news/politics/articles/2026-10-06/republicans-return-to-tough-on-crime-message-ahead-of-difficult-midterm-elections"}]},{"id":"politics-daylight-saving-senate-oct6","headline":"Senate debate over permanent daylight saving time stalls again","summary":"A renewed Senate push to stop seasonal clock changes ran into resistance, according to Fox’s current coverage. The proposal has not become law, and the existing time-change schedule remains in effect.","sources":["Fox"],"signal":"Watch","links":[{"label":"Fox News — Senate blocks permanent daylight saving time","url":"https://www.foxnews.com/politics/battle-over-daylight-saving-time-erupts-push-stop-changing-clocks-hits-senate-wall"}]}],"entertainment":[{"id":"entertainment-jim-bakker-death-oct6","headline":"Televangelist Jim Bakker, disgraced by scandal, dies at 86","summary":"Jim Bakker, whose PTL Club television ministry became a multimillion-dollar empire before a fraud conviction and sex scandal, died Monday at 86, AP and Reuters report. The coverage recounts his public career and collapse; it is not a new legal proceeding.","sources":["Other"],"signal":"Consensus","links":[{"label":"AP — Jim Bakker dies at 86, Oct. 6","url":"https://apnews.com/article/jim-bakker-televangelist-ptl-club-dead-ef6d58ffa0b511edba773c219cee77e8"},{"label":"Reuters — Bakker obituary, Oct. 6","url":"https://www.reuters.com/world/us/us-televangelist-jim-bakker-ensnared-fraud-sex-scandal-dead-86-2026-10-06/"}]},{"id":"entertainment-digger-boxoffice-oct6","headline":"“Digger” opens below expectations as “Verity” leads weekend box office","summary":"Weekend estimates put “Verity” first with a $32.6 million opening, while Tom Cruise’s “Digger” fell short of expectations and could produce a large studio loss, according to trade coverage. The loss estimate is a projection, not a final audited result.","sources":["Other"],"signal":"Watch","links":[{"label":"Deadline — weekend box office estimates, Oct. 5","url":"https://deadline.com/2026/10/box-office-verity-digger-tom-cruise-weekend-estimates-1237146502/"},{"label":"The Guardian — projected Digger loss, Oct. 5","url":"https://www.theguardian.com/film/2026/oct/05/digger-may-lose-150m-after-tom-cruise-film-bombs-at-the-box-office"}]},{"id":"entertainment-hollywood-production-oct6","headline":"Hollywood unions warn U.S. film and TV production is nearing a breaking point","summary":"A report commissioned by entertainment unions says U.S.-based production has lost ground to overseas locations, with domestic TV spending’s share falling over time. The group frames the findings as a warning about an industry under pressure, not a prediction that production will stop.","sources":["Other"],"signal":"Watch","links":[{"label":"Deadline — union-backed production report, Oct. 5","url":"https://deadline.com/2026/10/hollywood-unions-report-us-film-tv-production-decline-1237147051/"}]},{"id":"entertainment-kylie-hulu-series-oct6","headline":"Kylie Jenner to headline Hulu thriller series “Bachelorette Weekend,” Deadline reports","summary":"Kylie Jenner is set to star in and executive-produce a thriller series at Hulu, with a straight-to-series order still being finalized, Deadline reports. The project is in development and should not be described as already filming or released.","sources":["Other"],"signal":"Watch","links":[{"label":"Deadline — Kylie Jenner Hulu project, Oct. 6","url":"https://deadline.com/2026/10/kylie-jenner-bachelorette-weekend-hulu-series-kim-kardashian-1237146797/"}]},{"id":"entertainment-casey-bloys-contract-oct6","headline":"HBO chief Casey Bloys renews contract as Paramount+ and HBO Max integrate","summary":"Casey Bloys has renewed his contract as he begins overseeing integration of HBO Max and Paramount+ teams, Deadline reports. The agreement concerns executive leadership; it does not yet establish the combined services’ final programming strategy.","sources":["Other"],"signal":"Watch","links":[{"label":"Deadline — Casey Bloys contract and integration, Oct. 6","url":"https://deadline.com/2026/10/casey-bloys-contract-reup-hbo-max-paramount-plus-teams-1237147522/"}]},{"id":"entertainment-lottie-brooks-adaptation-oct6","headline":"StudioCanal and Deadpan Pictures adapt “Lottie Brooks” book series for TV","summary":"StudioCanal and Ireland’s Deadpan Pictures are developing a television adaptation of the “Lottie Brooks” books, The Hollywood Reporter says. The project is an announced adaptation, not a series with a confirmed release date.","sources":["Other"],"signal":"Watch","links":[{"label":"The Hollywood Reporter — Lottie Brooks adaptation, Oct. 6","url":"https://www.hollywoodreporter.com/tv/tv-news/studiocanal-adapting-lottie-brooks-book-series-for-tv-1236723152/"}]},{"id":"entertainment-batman-production-pause-oct6","headline":"“The Batman Part II” pauses production as Matt Reeves steps away","summary":"Deadline reports that production on “The Batman Part II” has paused while director Matt Reeves handles a personal matter. The report does not establish a release-date change or disclose additional private details.","sources":["Other"],"signal":"Watch","links":[{"label":"Deadline — Batman Part II production pause, Oct. 6","url":"https://deadline.com/2026/10/the-batman-part-ii-production-pause-matt-reeves-1237146807/"}]}]},"researchNotes":["Freshly rechecked Fox News, CNN, Drudge Report, AP, Reuters and current direct articles for the Tuesday Oct. 6 edition; outlet placements are framing, not independent verification.","CNN premarket page last updated Oct. 6 at 7:37 a.m. ET; data delayed approximately 15 minutes and explicitly described as unadjusted index futures. The NASDAQ futures reading is an index proxy, not the cash Nasdaq Composite.","Monday Oct. 5 cash close exact levels and point/percent moves cross-checked using Reuters and AP; Reuters supplies precise percentage changes, AP confirms closing levels and point gains.","Checked all four Boston team calendars at the edition build: Bruins schedule, Patriots official schedule, Red Sox MLB calendar and Celtics official NBA schedule. No Tuesday Oct. 6 Boston team games listed; Bruins and Patriots Monday/Sunday finals confirmed.","Checked Boston Globe and WEEI/Audacy. The Globe provides some substantial text but several stories are paywalled; WEEI pages mostly expose show/podcast metadata or limited article text."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, or international soccer.',business:'7 unique business/markets stories; on trading days at 7 a.m. show timestamped indicative Dow and Nasdaq-100 futures, clearly not cash indexes; on weekends and market holidays state cash markets are closed and show no live/premarket snapshot, while identifying the latest completed session. At 10 a.m. and 1 p.m. on trading days show timestamped Dow and Nasdaq Composite cash-index levels, point and percentage moves, and any provider delay; at 4 p.m. show timestamped closing moves as confirmed or clearly preliminary; at 7 p.m. use confirmed closes.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
