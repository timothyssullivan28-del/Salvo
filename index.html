<script id="briefing" type="application/json">{"date":"2026-10-26","lastUpdated":"October 26, 2026, 7:11:56 p.m. EDT Boston","dek":"Monday evening full refresh: all eight tabs researched and re-ranked, with confirmed Monday cash closes, pregame Boston schedules and source dates preserved honestly.","take":"Security, election legitimacy and institutional accountability dominate the leading stories. Fox emphasizes Netanyahu’s survival and Iranian threats; CNN foregrounds conditional U.S. strike readiness and the new Comey case, while Drudge highlights Lula’s win and political backlash. The common stakes are clear, but claims and unresolved proceedings remain distinct from established outcomes; Drudge is an aggregator, not an independent reporting source.","sectionTakes":{"top":"Security, election legitimacy and institutional accountability dominate the leading stories. Fox emphasizes Netanyahu’s survival and Iranian threats; CNN foregrounds conditional U.S. strike readiness and the new Comey case, while Drudge highlights Lula’s win and political backlash. The common stakes are clear, but claims and unresolved proceedings remain distinct from established outcomes; Drudge is an aggregator, not an independent reporting source.","usa":"Hospital disruption, renewed flooding and measles lead a domestic slate focused on public safety and institutional safeguards. Maurene Comey’s ruling is a completed legal decision, while the letters, shooting and flight cases remain allegations; new cattle checks reduce risk without eliminating it.","boston":"Chicago at the Celtics remains upcoming at 7:30 tonight; the other three teams are off. The Patriots’ roster moves and Vrabel’s WEEI assessment, Geekie’s line and Boston’s late-game execution supply the substantive team news. Globe coverage remains partly paywalled, and WEEI/Audacy hubs offered limited fresh full text; the official team page verified today’s WEEI interview.","business":"CONFIRMED Monday, Oct. 26 close: Dow 52,361.58, up 146.42 points (+0.28%), and Nasdaq Composite 26,169.38, up 214.04 (+0.83%). AP and Reuters match closing levels and point moves, with Reuters supplying precise percentages. AI financing lifted sentiment while buyouts, alleged overcharging and uncompleted delivery and tariff talks show the broader economic trade-offs.","world":"Egypt’s authorization and Jordan’s strikes widen the regional-security stakes, while Kyiv’s casualty figures and Congo’s worker attack remain attributed to officials. China’s plenum and Japan’s succession law concern institutional power; the pope’s travel clearance and Phuket’s receding water are not guarantees against further complications.","sports":"Williams’ and Wallace’s surgeries lead the injury news, while the Series returns to Tampa Bay with Milwaukee ahead 2–0. Jones keeps his job, Goebbel takes an interim one, and the NBA’s prediction-market safeguards remain promises under legal scrutiny. Completed Sunday results leave Minnesota alone unbeaten; they do not settle the season.","politics":"The new poll and Mississippi visit show Republican pressure, but district structure can limit the size of any Democratic gains. AI-targeted campaign messaging and the voter-tip reward raise verification questions, while CNN’s Noem report concerns an unauthorized presentation rather than false job-change content. Polls, strategies and promises are not election outcomes.","entertainment":"Koenig and Bauza’s deaths mark major losses, while Brown’s suspended sentence is a completed court outcome rather than an acquittal. Ministry’s farewell, the Disney–Channel 4 rollout and this week’s streaming remain forward-looking; the weekend box-office figures are estimates."},"sections":{"top":[{"id":"top-comey-oct26-eve","headline":"DOJ opens third Comey prosecution; indictment and deadline dispute remain","summary":"Court records made public Monday show a new case alleging a sensitive-document leak in October 2016. DOJ says an Oct. 5 criminal information preserved its deadline while it seeks a grand-jury indictment; Comey argues an information is insufficient. These are charges and contested procedure, not a conviction.","sources":["CNN","Other"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/26/politics/james-comey-charged","label":"CNN — Updated Oct 26, 2026, 6:04 PM ET"},{"url":"https://www.reuters.com/world/ex-fbi-director-comey-charged-again-by-us-justice-department-nbc-news-reports-2026-10-26/","label":"Reuters — Oct. 26"}]},{"id":"top-iran-plans-oct26","headline":"CNN: U.S. forces prepared for major Iran strikes if Trump orders them","summary":"Two U.S. officials tell CNN forces could begin major operations within 96 hours of an order, with military, energy and nuclear targets under consideration. The report says Trump has not decided; planning is not a launch order. The Times of Israel relays CNN’s reporting and notes Netanyahu’s office denies the reported Israeli pressure; that relay is not independent confirmation.","sources":["CNN","Other"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/26/politics/us-iran-strike-plans-trump","label":"CNN — updated Oct. 26, 6:40 a.m. ET"},{"url":"https://www.timesofisrael.com/liveblog_entry/cnn-netanyahu-pushed-for-iran-strike-before-election-trump-refused-but-signaled-there-will-be-joint-action-soon-pmo-denies-report/","label":"Times of Israel — Oct. 26; reports PM office denial"}]},{"id":"top-brazil-count-oct25-evening","headline":"Trump calls Brazil vote “rigged” without evidence as Lula’s win draws recognition","summary":"Reuters reports Trump backed Flávio Bolsonaro’s objections without offering evidence. Lula won by more than four million votes; an analysis cited by Reuters found fewer than 35,000 ballots were cast during the disputed extension. Bolsonaro seeks annulment, while global leaders recognize the result.","sources":["Other","Drudge"],"signal":"Watch","links":[{"url":"https://www.reuters.com/world/americas/brazil-heads-back-future-flavio-bolsonaro-refuses-recognize-lula-win-2026-10-26/","label":"Reuters — Oct. 26"},{"url":"https://apnews.com/article/brazil-election-lula-bolsonaro-runoff-vote-president-e2c9fe8fc4aa3e3675b9a8ec15405d93","label":"AP — Updated 2:56 AM EDT, October 26, 2026"},{"url":"https://www.drudgereport.com/","label":"Drudge Report — aggregator checked Oct. 26 evening"}]},{"id":"top-israel-election-oct26-eve","headline":"Israel votes Tuesday with Netanyahu’s record and Iran tensions at stake","summary":"Israel’s first election since the Oct. 7 attack puts Netanyahu’s leadership, security record and democratic institutions before voters, AP reports. Fox emphasizes the Iranian threat and his fight for political survival. The race is upcoming; neither polling nor Trump’s endorsement establishes a winner.","sources":["Other","Fox"],"signal":"Watch","links":[{"url":"https://apnews.com/article/israel-election-netanyahu-gaza-mideast-iran-war-ce15215c61ad182203ccb9b854e75562","label":"AP — Updated 6:02 AM EDT, October 26, 2026"},{"url":"https://www.foxnews.com/world/netanyahu-fights-political-future-israel-heads-polls-iran-threat-looming","label":"Fox News — Oct. 26 election preview"}]},{"id":"world-serbia-oct23-eve","headline":"Serbia’s student movement wins; governing agenda is the next test","summary":"Reuters reports the student-led movement won Sunday’s parliamentary election, ending Aleksandar Vucic’s long rule. Its yet-to-be-named leaders face difficult decisions on Kosovo, EU ties and entrenched institutions. The election victory is reported as completed; the identity and policies of the next government are not settled.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/world/serbias-new-leaders-face-host-tough-challenges-2026-10-26/","label":"Reuters — Oct. 26"}]},{"id":"top-washington-ballots-oct26-eve","headline":"DOJ asks Washington to segregate ballots from suspected noncitizens","summary":"AP reports the administration asked Washington to set aside ballots from more than 400 people it suspects registered without citizenship. State officials were reviewing the demand. A federal list and suspicion do not establish that each person is ineligible, voted illegally or should have a ballot rejected.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.news10.com/news/ap-trump-administration-asks-washington-to-set-aside-ballots-from-400-voters-it-says-may-be-noncitizens/","label":"AP via NEWS10 — updated Oct. 26, 6:17 p.m. EDT"}]},{"id":"top-france-concessions-oct26-eve","headline":"France offers admissions overhaul, but student leaders vow more protests","summary":"The government pledged to replace its university-admissions platform in 2028 and offer school-renovation loans and other concessions. AP and Reuters report student leaders still want protests to continue as the movement broadens into living-cost grievances. Announced reforms are not evidence the unrest has ended.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/france-high-schools-protests-macron-66403512e943e3aee4cdca64ecccfe33","label":"AP — Updated 5:47 PM EDT, October 26, 2026"},{"url":"https://www.reuters.com/world/europe/french-minister-says-halloween-protests-could-turn-violent-2026-10-26/","label":"Reuters — Oct. 26"}]},{"id":"top-gaza-inquiry-oct26-eve","headline":"UN-commissioned inquiry says Gaza genocide continued after ceasefire","summary":"Independent experts commissioned by the UN say the ceasefire did not stop genocide in Gaza and allege further crimes in the West Bank. Israel rejects the findings and calls for the commission’s dissolution. AP could not independently corroborate several accounts; the report is not a court judgment.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/israel-gaza-un-war-sexual-crimes-9547f83319b8c5be32ab3ab81534772a","label":"AP — Updated 9:54 AM EDT, October 26, 2026"}]},{"id":"top-mink-birdflu-oct26","headline":"Utah mink outbreak raises pandemic-risk concerns, investigation finds","summary":"ProPublica’s investigation, republished by CNN, reports bird flu spreading for more than two months at a Utah mink farm and alleges authorities failed to contain it. Experts warn that mink could enable dangerous adaptation; the report does not establish sustained human-to-human spread or a new human pandemic. Its conclusions rely on records and attributed scientific assessments.","sources":["CNN"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/26/health/bird-flu-mink-farm-propublica","label":"CNN/ProPublica — Oct. 26, 6 a.m. ET"}]},{"id":"top-ukraine-energy-oct26-eve","headline":"UN-backed inquiry finds Russian energy attacks were war crimes","summary":"A UN-backed commission says deliberate attacks on Ukraine’s energy infrastructure constituted war crimes and crimes against humanity, leaving civilians without heat, power and critical services. Its Monday report also alleges coerced or deceptive recruitment from 29 countries. These are investigative findings, not completed criminal trials.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/un-russia-ukraine-commission-report-war-crimes-27ee6394694bb30a7f1eab9addced768","label":"AP — Updated 6:48 PM EDT, October 26, 2026"}]}],"usa":[{"id":"usa-unm-cyber-oct26-eve","headline":"Cybersecurity disruption diverts patients from New Mexico’s only top trauma center","summary":"UNM Health System diverted ambulances, canceled appointments at more than 30 clinics and told people not to arrive at its main hospital, AP reports. The network was working to resolve the issue Monday; its extent and nature were not immediately clear. Other providers were coordinating additional care.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/new-mexico-health-cybersecurity-hack-7a3593f8a3cee4ca895774ab1574919f","label":"AP — Updated 6:41 PM EDT, October 26, 2026"}]},{"id":"top-fourcorners-flood-oct25","headline":"More Southwest flooding brings new evacuations and a $300 million damage estimate","summary":"Bluff, Utah, joined flooded communities along the San Juan and Animas rivers as officials warned of more rain later in the week. New Mexico’s governor estimated damage could reach $300 million; that is an estimate, not a final assessment. Hundreds of homes remained evacuated or isolated.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/four-corners-flooding-storm-river-evacuations-a91e683f54e41eb3fe8c03863a502d21","label":"AP — Updated 6:59 PM EDT, October 26, 2026"}]},{"id":"usa-maurene-ruling-oct26-eve","headline":"Judge rules Maurene Comey’s firing unlawful, rejecting broad removal power","summary":"Judge Jesse Furman ruled the administration unlawfully fired the career prosecutor, rejecting its argument that federal prosecutors could be removed on the asserted constitutional basis. AP says the ruling is tailored to Maurene Comey but has broader implications for civil-service protections. It does not resolve her father’s separate criminal proceedings.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/justice-department-maurene-comey-trump-be7de14f705def3bb6eeadafa7e60805","label":"AP — Updated 2:28 PM EDT, October 26, 2026"},{"url":"https://www.wbay.com/2026/10/26/judge-rules-maurene-comey-daughter-ex-fbi-director-was-unlawfully-fired-by-trump-administration/","label":"AP via WBAY — Oct. 26 ruling report"}]},{"id":"usa-measles-oct26-eve","headline":"Pennsylvania reports 1,360 measles cases, up 22","summary":"Reuters cites the state health department’s Monday update showing 258 hospitalizations this year. Pennsylvania reports five measles-related deaths, while CDC has confirmed three; the differing counts should not be collapsed into one. The national CDC case total cited in the report is dated Oct. 22.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/legal/litigation/pennsylvania-measles-cases-rise-1360-state-health-department-says-2026-10-26/","label":"Reuters — Oct. 26"}]},{"id":"usa-tallahassee-oct26","headline":"Teen to face adult charges after Florida A&M shooting wounds 11","summary":"Authorities say an arrested 15-year-old will be charged as an adult after Saturday’s shooting near the homecoming game. Eleven people were hit by gunfire and another was injured while fleeing, AP clarifies. Police say none appeared to be intended targets; charges are not a finding of guilt.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/florida-am-shooting-arrest-tallahassee-e91b8d7e82eb8dee7a38df18771d0adf","label":"AP — Updated 2:15 PM EDT, October 26, 2026"}]},{"id":"usa-letters-oct26-eve","headline":"Illinois man charged over threatening powder-filled letters to lawmakers","summary":"A criminal complaint unsealed Monday alleges a Quincy man mailed at least four threatening envelopes to elected officials in Chicago. AP reports charges of mailing threatening communications and perpetrating a hoax. The allegations remain unproven, and the reviewed report does not establish a dangerous biological substance.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.2news.com/news/national/illinois-man-charged-with-mailing-white-powder-to-members-of-congress/article_67ed188c-4640-5f1e-a0c4-479c755baa76.html","label":"AP via KTVN — Oct. 26 complaint report"}]},{"id":"usa-tennessee-escape-oct26-eve","headline":"Tennessee searches for escaped prisoner serving life for murder","summary":"Officials say Jacob Morley slipped through a fence at Northwest Correctional Complex and was discovered missing late Sunday. A regional search and reward were announced. AP’s Monday afternoon update reports the escape and search, not a recapture or a confirmed explanation of how he breached the fence.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/tennessee-man-escaped-prison-f59cae91a8075f5a464c416b4a8aca34","label":"AP — Updated 4:06 PM EDT, October 26, 2026"}]},{"id":"usa-cattle-port-oct26-eve","headline":"New Mexico cattle crossing reopens with tighter screwworm safeguards","summary":"Mexican cattle resumed crossing at Columbus after nearly two years, under layered treatments and inspections. AP reports it is the third port to reopen under the new safeguards. Officials say vigilance remains necessary because flies can cross independently; reopening does not promise an immediate drop in beef prices.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/screwworm-cattle-imports-mexico-agriculture-d3012f8391db129f099ef9000c9a796b","label":"AP — Updated 5:32 PM EDT, October 26, 2026"}]},{"id":"usa-flight-threat-oct26-eve","headline":"United flight returns to Las Vegas after alleged hijacking threat","summary":"A passenger faces charges after allegedly sending a threatening message on Saturday’s Newark-bound flight. United says all 150 passengers returned safely; the flight departed the next morning. AP reports a Tuesday initial court appearance is scheduled. A criminal complaint is not a conviction or proof an actual hijacking occurred.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/las-vegas-flight-turnaround-c557b8a35c691b0559303569d79f3839","label":"AP — Updated 6:01 PM EDT, October 26, 2026"}]},{"id":"usa-schools-tech-oct26-eve","headline":"Parents and school districts reconsider device-heavy classrooms","summary":"CNN’s Monday report examines a growing push to remove screens and restore printed material after pandemic-era technology expansion. It describes parent activism and local policy debates, not a nationwide device ban or a single settled verdict on every classroom use. Changes depend on individual districts and implementation.","sources":["CNN"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/26/us/schools-anti-tech-parents-movement","label":"CNN — PUBLISHED Oct 26, 2026, 6:30 AM ET"}]}],"boston":[{"id":"boston-monday-status-oct26","headline":"Monday Boston scoreboard: Celtics–Bulls upcoming at 7:30 p.m.","summary":"UPCOMING Monday, Oct. 26: Celtics host Chicago at 7:30 p.m. EDT. No Red Sox, Patriots or Bruins game Monday; Red Sox season is complete. None of the four teams played Sunday. FINAL Saturday: Bruins 6, Sharks 4; FINAL Friday: Celtics 107, Knicks 103; FINAL Thursday: Bears 30, Patriots 24. Bruins visit Carolina Tuesday at 8 p.m. EDT. Schedules rechecked at 7:11 p.m. EDT Monday, before tipoff; no Boston game is in progress.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.nba.com/celtics/schedule","label":"NBA — official schedule checked Oct. 26 evening"},{"url":"https://www.espn.com/nba/team/schedule/_/name/bos/boston-celtics","label":"ESPN — Celtics schedule rechecked Oct. 26, 7:11 p.m. EDT"},{"url":"https://www.espn.com/nhl/team/schedule/_/name/bos","label":"ESPN — Bruins schedule and Saturday final checked Oct. 26"},{"url":"https://www.patriots.com/schedule/","label":"Patriots — official schedule checked Oct. 26"},{"url":"https://www.nhl.com/bruins/news/bruins-beat-sharks-6-4-in-back-and-forth-affair-at-td-garden","label":"Bruins — Oct. 24 official final"},{"url":"https://www.nba.com/game/nyk-vs-bos-0022600008","label":"NBA/AP — Oct. 23 final"}]},{"id":"boston-roster-oct26-eve","headline":"Patriots re-sign Ramirez, release Rizy and remove Baringer from IR","summary":"New England announced Monday that linebacker Jose Ramirez returned to its practice squad, offensive lineman Jacob Rizy was released from that squad and punter Bryce Baringer was released from injured reserve. These are completed roster moves, not a forecast of game-day roles.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.patriots.com/news/patriots-sign-lb-jose-ramirez-to-the-practice-squad-release-ol-jacob-rizy-from-the-practice-squad-release-p-bryce-baringer-from-injured-reserve-list","label":"Patriot 6/tv/global/disney-landmark-content-deal-uk-channel-4-1236931195/","label":"Variety — Oct. 26, 4:01 p.m. PT"}]},{"id":"ent-streaming-oct26-eve","headline":"This week’s streaming includes Perry docuseries and “The Gilded Age”","summary":"AP’s Monday guide previews “Minions & Monsters,” Matthew Perry coverage, Daddy Yankee’s new album and the fourth season of “The Gilded Age,” among other releases. These are scheduled offerings and editorial recommendations, not a claim that every title is available on every platform or already released.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/october-2026-streaming-releases-movies-tv-music-386a371d5be49be209b4253b52881454","label":"AP — Updated 12:01 AM EDT, October 26, 2026"}]}]},"researchNotes":["All eight tabs freshly researched for the Monday evening run; no tabs preserved.","AP and Reuters independently verify Oct. 26 cash closes and point moves; precise percentages from Reuters.","Official schedules and ESPN checked Monday evening: Celtics–Bulls 7:30 p.m. EDT upcoming; no Bruins, Patriots or Red Sox game; all four off Sunday.","Boston Globe partly paywalled; WEEI/Audacy current hubs and official Oct. 26 WEEI interview checked.","AP and CNN disagree on Koenig’s day of death; calendar day intentionally omitted.","Actual build timestamp applied immediately before synchronized build; schedule unchanged."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, international soccer, or WNBA coverage.',business:'7 unique business/markets stories refreshed only at 7 p.m. Eastern Monday through Friday, with independently confirmed figures for the latest completed U.S. cash session. Preserved unchanged at all other editions.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
