ake in northern Tibet. Eleven injured people were reported in serious condition; these are official reported totals and may change.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/business/environment/earthquake-magnitude-7-strikes-chinas-tibet-2026-10-22/","label":"Reuters — Oct. 22, 2026"}]},{"id":"top-melanoma-trial-oct22-eve","headline":"Merck and Moderna report 42% reduction in melanoma recurrence or death","summary":"The companies say their personalized mRNA vaccine plus immunotherapy reduced recurrence-or-death risk by 42% in a large melanoma trial. Reuters reports the new data; the result is not a universal cure or regulatory approval, and the companies’ shares fell despite the finding.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/legal/litigation/merckmoderna-cancer-vaccine-cuts-risk-death-or-recurrence-melanoma-by-over-40-2026-10-22/","label":"Reuters — Oct. 22, 2026"}]},{"id":"top-deportation-report-oct22-eve","headline":"Report counts 980,000 deportations in Trump’s first 18 months","summary":"A Migration Policy Institute report cited by Reuters counts 980,000 deportations during the first 18 months of Trump’s second term. It says only 20% involved people with a criminal conviction and distinguishes removals from several categories of returns; the total is the study’s finding.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/legal/government/trump-administration-oversaw-980000-deportations-during-first-18-months-2026-10-22/","label":"Reuters — Oct. 22, 2026"}]},{"id":"top-lucas-charges-oct22-eve","headline":"Virginia Senate leader Louise Lucas charged in marijuana conspiracy case","summary":"Federal prosecutors accused Virginia state Sen. Louise Lucas of leading a marijuana-related criminal conspiracy. AP reports the indictment and her court appearance; the charges are allegations, not a conviction or an independently established account of guilt.","sources":[" e in Otero County; officials are expanding surveillance, Reuters reports.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/business/healthcare-pharmaceuticals/us-agriculture-dept-confirms-first-detection-new-world-screwworm-us-wildlife-2026-10-21/","label":"Reuters — USDA and New Mexico confirmations, Oct. 21"}]},{"id":"usa-caffeine-pouches-oct22","headline":"Schools ban caffeine pouches as pediatric experts warn of risks","summary":"Some school districts are banning caffeine pouches that resemble nicotine products and can contain about 200 milligrams of caffeine. AP reports health concerns for children and teens and notes there is no federal minimum purchase age for the products.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.usnews.com/news/us/articles/2026-10-22/some-schools-are-banning-caffeine-pouches-heres-what-parents-and-students-should-know","label":"AP — caffeine pouch restrictions, Oct. 22, 6:01 a.m. ET"}]}],"boston":[{"id":"boston-thursday-status-oct22","headline":"LIVE: Bruins 0, Predators 0 at first-period start; Patriots at 8:15","summary":"LIVE — IN PROGRESS: Bruins 0, Predators 0, start of the first period (20:00 remaining), as displayed by ESPN at the 7:09 p.m. EDT score check Thursday. NHL’s official page was still showing its pregame view. UPCOMING: Patriots at Bears, 8:15 p.m. EDT. No Celtics or Red Sox game Thursday; Celtics host the Knicks Friday at 7 p.m. EDT and the Red Sox season is complete. FINAL Tuesday: Stars 3, Bruins 2 in overtime; Pistons 121, Celtics 113. None of the four teams played Wednesday.","sources":["Other"],"signal":"Consensus","links":[{"label":"NHL — Bruins-Stars official final","url":"https://www.nhl.com/gamecenter/bos-vs-dal/2026/10/20/2026020147"},{"label":"NBA — Celtics-Pistons official final","url":"https://www.nba.com/game/bos-vs-det-0022600001"},{"label":"Patriots — official schedule","url":"https://www.patriots.com/schedule/"},{"label":"MLB — Red Sox schedule","url fic Reports argues the painting’s sky best matches around July 22, 1889, rather than the traditional June dating. AP presents the astronomical reconstruction as a research interpretation, not a newly discovered signature date from van Gogh.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/van-gogh-starry-night-space-6385c8e37f748bddc4137cdda5c76887","label":"AP — Oct. 22, 2026"}]},{"id":"entertainment-legend-muse-oct22-eve","headline":"John Legend and Pharrell team for Friday’s “Muse” release","summary":"Legend told AP that working on a full album with Pharrell Williams pushed him toward new vocal approaches. The 16-track “Muse” arrives Friday; the interview describes the creative process rather than a completed commercial result.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/john-legend-muse-egot-3908a7641918e2a101a252c60324c763","label":"AP — Oct. 22, 2026"}]},{"id":"entertainment-raffi-oct22-eve","headline":"Raffi marks 50 years with new songs and a screen-time message","summary":"Raffi’s “Love is Everywhere” arrives Friday as he marks a half-century since his first children’s album. AP’s interview explores songwriting, children’s technology use and a planned anniversary reissue; the new release is still upcoming.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/raffi-new-album-interview-d50d8f9ad50e6072ce5847324c7e5a6e","label":"AP — Oct. 22, 2026"}]},{"id":"entertainment-runtimes-oct22-eve","headline":"AP examines why blockbuster and art-house movies keep getting longer","summary":"AP’s feature tracks longer runtimes from event blockbusters to festival films and weighs their appeal against programming pressures. Its box-office examples challenge the assumption that length necessarily deters audiences; the article does not establish that every long film succeeds.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/movies-longer-runtimes-7f8b8bbf334f2219f4b036618728b313","label":"AP — Oct. 22, 2026"}]}]},"researchNotes":["All eight tabs freshly researched and reranked for the weekday evening full refresh, Oct. 22.","Reuters, AP and CNBC independently checked for confirmed Thursday cash close.","NHL official game center and secondary scoreboard checked near publication; official Patriots 6:45 p.m. inactives supersede Wednesday designations.","WEEI/Audacy and Boston Globe checked; access varies and limitations are disclosed in Boston Tell.","Original dates retained for older but still consequential analysis and the Oct. 20 U.N. initiative.","Bruins status checked Oct. 22 at 7:09 p.m. EDT: ESPN displayed in progress, 0–0, 20:00 in first; NHL official center remained on pregame. Score-feed limitation disclosed on status card."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, international soccer, or WNBA coverage.',business:'7 unique business/markets stories refreshed only at 7 p.m. Eastern Monday through Friday, with independently confirmed figures for the latest completed U.S. cash session. Preserved unchanged at all other editions.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
