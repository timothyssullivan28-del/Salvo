e football: Alabama, Ohio State and Notre Dame post weekend wins","summary":"Alabama beat Mississippi State 56–23, Ohio State defeated Iowa 31–14, and Notre Dame beat North Carolina 37–26 in Saturday games. All are final scores from the college-football slate.","sources":["Other"],"signal":"Consensus","links":[{"label":"ESPN — Oct. 3 college football scores and highlights","url":"https://www.espn.com/college-football/story/_/id/50073099/live-college-footballl-scores-highlights-ohio-state-iowa-more"},{"label":"Ohio State — Iowa box score, Oct. 3","url":"https://ohiostatebuckeyes.com/sports/football/stats/2026/iowa/boxscore/22218"},{"label":"Notre Dame — UNC recap, Oct. 3","url":"https://fightingirish.com/news/2026/10/3/irish-reign-in-the-rain-defeat-north-carolina-37-26"}]}],"politics":[{"id":"politics-cnn-midterm-map-oct5","headline":"Oct. 5 CNN analysis: Midterm polls show Republicans defending once-safe territory","summary":"CNN’s Monday analysis says weekend polls show Democrats competitive in states Trump won in 2024, amid public concern over prices and the Iran war. Polls a month before the election are snapshots, not forecasts, and the races remain undecided.","sources":["CNN"],"signal":"Watch","links":[{"label":"CNN — Trump fights on home turf as Democratic midterm hopes rise, Oct. 5","url":"https://www.cnn.com/2026/10/05/politics/trump-republicans-midterms-home-turf"}]},{"id":"politics-trump-super-intelligence-force-oct4","headline":"Oct. 4: Trump announces “Super Intelligence Force” as AI task-force rollout expands","summary":"President Trump announced a proposed “Super Intelligence Force,” while DNI Jay Clayton’s 120-day task-force assignment remains in place, according to AP/Reuters reporting cited in the edition. Its structure, remit and recommendations remain unsettled.","sources":["Fox","Other"],"signal":"Watch","links":[{"label":"Fox News — Trump announces Super Intelligence Force, Oct. 4","url":"https://www.foxnews.com/politics/trump-launching-super-intelligence-force-ensure-american-dominance"}]},{"id":"politics-noem-donor-contract-report-oct4","headline":"Oct. 4 report: Noem agency awarded donor-linked firm a contract before she left office","summary":"The New York Times reports that Kristi Noem’s agency awarded a lucrative contract to a donor shortly before she departed. The report raises questions about timing and contracting; it is an allegation requiring attribution, not a government finding of misconduct.","sources":["Drudge","Other"],"signal":"Watch","links":[{"label":"New York Times — report on Noem agency contract, Oct. 4","url":"https://www.nytimes.com/2026/10/04/us/politics/kristi-noem-planes-donor.html"}]},{"id":"politics-trump-husted-ohio-rally-oct3","headline":"Oct. 3: Trump campaigns in Ohio for Sen. Jon Husted ahead of a competitive race","summary":"Trump rallied for Republican Sen. Jon Husted in Ohio, AP reports, as both parties target the state’s closely watched Senate contest. The appearance is campaign activity; the race remains undecided.","sources":["Other","Drudge"],"signal":"Watch","links":[{"label":"AP — Trump rallies in Ohio for Husted, Oct. 3","url":"https://apnews.com/article/trump-ohio-husted-brown-senate-f1ae89feb3eccd7d8eb49e1c2e14f6dd"}]},{"id":"politics-democrats-posttrump-plan-oct4","headline":"Oct. 4 report: Democrats draft plans to constrain presidential power after Trump","summary":"The Washington Post reports Democratic lawmakers and legal experts are preparing proposals on emergency powers, Justice Department independence, White House changes and ethics. These are planning efforts, not enacted laws or agreed party policy.","sources":["Other"],"signal":"Watch","links":[{"label":"Washington Post — Democrats plan post-Trump government changes, Oct. 4","url":"https://www.washingtonpost.com/politics/2026/10/04/democrats-are-making-plans-clean-up-government-post-trump-era/"}]},{"id":"politics-trump-cotton-daylight-saving-oct3","headline":"Oct. 3: Trump posts Sen. Tom Cotton’s number amid daylight-saving bill dispute","summary":"CNN reports Trump posted Cotton’s phone number as the president and senator clashed over daylight-saving-time legislation. The dispute is political and procedural; Congress has not enacted a change.","sources":["CNN"],"signal":"Watch","links":[{"label":"CNN — Trump and Cotton clash over daylight-saving bill, Oct. 3","url":"https://www.cnn.com/2026/10/03/politics/trump-tom-cotton-phone-number-daylight-saving"}]},{"id":"politics-fbi-patel-report-oct3","headline":"Oct. 3: FBI commissions classified internal “Patel Report” on agency shortcomings","summary":"The FBI commissioned a classified internal review of agency shortcomings, AP reports. The report is not public, so its conclusions and any resulting policy changes are not yet available.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — FBI commissions internal “Patel Report,” Oct. 3","url":"https://apnews.com/article/fbi-kash-patel-report-trump-cbae3feb679d826d8b409fbc142d1581"}]}],"entertainment":[{"id":"entertainment-digger-boxoffice-oct5","headline":"Oct. 5 estimates: “Verity” opens at $32.6M as “Digger” posts Tom Cruise’s lowest debut in years","summary":"Deadline’s updated weekend estimate puts “Verity” at $32.6 million domestic and “Digger” at $8 million, the latter Tom Cruise’s lowest opening since 2007. Weekend grosses are studio estimates, not final audited totals.","sources":["Other"],"signal":"Watch","links":[{"label":"Deadline — updated weekend box-office estimates, Oct. 5","url":"https://deadline.com/2026/10/box-office-verity-digger-1237145435/"},{"label":"AP — “Verity” tops box office as “Digger” opens, Oct. 5","url":"https://www.wjtv.com/news/ap-on-cusp-of-merger-digger-bombs-for-warner-bros-verity-takes-no-1-at-box-office/"}]},{"id":"entertainment-paramount-warner-settlement-oct4","headline":"Oct. 4: Judge approves Paramount settlement with states in Warner takeover case","summary":"A federal judge approved Paramount’s settlement with states, removing a legal hurdle to its proposed Warner Bros. Discovery purchase, AP reports. The merger is still pending and had not closed at the time of the report.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — judge approves Paramount settlement, Oct. 4","url":"https://apnews.com/article/paramount-warner-bros-discovery-takeover-f30a8a9a4d26393177bc1af5bff1e990"}]},{"id":"entertainment-anthony-mackie-macbeth-oct5","headline":"Oct. 5: Anthony Mackie to return to Broadway as Macbeth after 16-year absence","summary":"Mackie will star in a Broadway production of Shakespeare’s “Macbeth”; rehearsals are planned for February 2027, with previews expected in late March or early April, Deadline reports. The production has not yet opened and the schedule remains forward-looking.","sources":["Other"],"signal":"Watch","links":[{"label":"Deadline — Anthony Mackie prepares Broadway return as Macbeth, Oct. 5","url":"https://deadline.com/2026/10/anthony-mackie-macbeth-broadway-avengers-star-1237146358/"}]},{"id":"entertainment-itv-mipcom-slate-oct5","headline":"Oct. 5: ITV Studios takes 10 new formats to Mipcom, led by “The Chase Around the World”","summary":"ITV Studios has unveiled ten new unscripted formats for the Mipcom market, with “The Chase Around the World” leading the slate, Variety reports. The announcement is a programming and international-sales slate, not a confirmation that every title has a buyer or release date.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — ITV Studios Mipcom formats slate, Oct. 5","url":"https://variety.com/2026/tv/news/itv-studios-mipcom-formats-slate-the-chase-around-the-world-1236898689/"}]},{"id":"entertainment-canal-cinema-tax-oct5","headline":"Oct. 5: Canal+ threatens to pull $1.1 billion French cinema deal over proposed tax hike","summary":"Canal+ warned it could withdraw from its cinema financing agreement if France raises VAT on subscription services; Variety estimates the proposed change could cost the ages displayed the live Dow Jones Industrial Average at 51,049.87 (−127.09, −0.25%) at 10:11 a.m. EDT and Nasdaq Composite at 27,350.344 (+159.48, +0.59%) at 10:12 a.m. EDT. CNBC discloses that market data are delayed at least 15 minutes. Friday Oct. 2 is the latest completed session: Dow 51,176.96 (+250.40, +0.49%) and Nasdaq Composite 27,190.86 (+319.27, +1.19%), cross-checked against Reuters/AP and MarketWatch.","Boston teams independently checked at 10:15 a.m. EDT. NHL official game center shows Ottawa at Boston scheduled 7:30 p.m. EDT with no game yet in progress; Patriots–Bills is final 29–26, New England, with Las Vegas next Sunday; Red Sox have no game after the Yankees swept 2–0; Celtics have no Monday game and preseason starts Oct. 8. Saturday Bruins–Wild final: Minnesota 4, Boston 1.","WEEI/Audacy and Boston Globe were checked. The Globe is partly paywalled; WEEI/Audacy search results and pages often exposed schedule, show/podcast or audio metadata rather than full article text, limitations disclosed in the Boston Tell.","New Monday developments include Supreme Court climate arguments beginning, the official 2026 Nobel Medicine award, AP reporting on the Congo River collision and proposed Head Start rule, AP accounts from wounded soldiers, updated Sunday NFL/MLB finals, the $22.6 billion Schneider–PTC agreement, planned Jio IPO, airBaltic workforce cuts and fresh entertainment announcements. Claims, forecasts, early casualty tallies and proposals are attributed and not overstated."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, or international soccer.',business:'7 unique business/markets stories; on trading days at 7 a.m. show timestamped indicative Dow and Nasdaq-100 futures, clearly not cash indexes; on weekends and market holidays state cash markets are closed and show no live/premarket snapshot, while identifying the latest completed session. At 10 a.m. and 1 p.m. on trading days show timestamped Dow and Nasdaq Composite cash-index levels, point and percentage moves, and any provider delay; at 4 p.m. show timestamped closing moves as confirmed or clearly preliminary; at 7 p.m. use confirmed closes.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
