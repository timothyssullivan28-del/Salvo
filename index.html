iment with AI-assisted evaluation. Rules vary and the scale of use is uncertain. The reporting raises fairness and authenticity concerns rather than announcing one national admissions policy.","sources":["CNN"],"signal":"Watch","links":[{"label":"cnn.com — Nov 15, 2026, 6:30 AM ET; checked Nov. 15 evening","url":"https://www.cnn.com/2026/11/15/tech/ai-students-college-admissions"}]}],"boston":[{"id":"story-n15e-12","headline":"Boston Monday: Celtics’ 131–94 win FINAL; Orlando visits tonight","summary":"FINAL Sunday: Celtics beat Dallas 131–94, independently confirmed by NBA, AP and Globe; the former halftime label is superseded. UPCOMING Monday: Orlando at Celtics, 7 p.m. EST, matching NBA/ESPN. Patriots’ Sunday 35–10 loss to Detroit is FINAL; they enter their bye. Bruins and Red Sox are off Monday; Los Angeles visits Boston Tuesday at 7 p.m. EST.","sources":["Other"],"signal":"Watch","links":[{"label":"nba.com — Nov. 15 final; Nov. 16 morning schedule check; checked Nov. 16 morning","url":"https://www.nba.com/game/dal-vs-bos-0022600240"},{"label":"ESPN — Nov. 16, Orlando 7 p.m. EST and Sunday final","url":"https://www.espn.com/nba/team/schedule/_/name/bos"},{"label":"AP — Nov. 15, 8:20 p.m. EST Celtics final","url":"https://apnews.com/article/mavericks-celtics-score-4d8e3b79740222bebf0bc3ccf0cbd382"},{"label":"Patriots — official completed result and bye schedule","url":"https://www.patriots.com/schedule/"},{"label":"NHL — Nov. 17 Kings at Bruins, 7 p.m. EST","url":"https://www.nhl.com/gamecenter/lak-vs-bos/2026/11/17/2026020333"},{"label":"WEEI — Nov. 16 sports page checked; fresh full text limited","url":"https://www.audacy.com/weei/sports"}]},{"id":"story-n15e-17","headline":"Maye ankle severity still awaits tests in latest verified reporting","summary":"Globe and NFL reporting say Drake Maye left Sunday’s opening drive and did not return. Vrabel said further testing was required to establish severity. This morning’s targeted check found no verified newer diagno
