<script id="briefing" type="application/json">{"date":"2026-09-25","lastUpdated":"September 25, 2026, 7:00 p.m. EDT Boston","dek":"Trump–Xi’s limited public results, Hurricane Nolo’s renewed flood threat, Iran’s unaccepted proposal, pivotal Supreme Court election rulings, and late-day U.S. legal developments lead Friday’s 7 p.m. briefing.","take":"Reuters confirms Trump and Xi ended the visit with a two-month trade-truce extension but no detailed public breakthrough; Fox foregrounds ceremony and security, CNN stresses limited substance and unresolved disputes, while Drudge’s front-page selection emphasizes Trump backlash, voter-data controversy and economic anxiety. Drudge is an aggregator, not independent summit reporting. NOAA’s latest advisory reports Nolo at 105 mph, while rainfall and further strengthening remain forecasts. Iranian and Houthi statements are attributed claims; Kyiv and Tanganyika casualty counts are attributed and evolving. The Supreme Court orders and White House credential restoration are legal developments, not final resolutions of all underlying litigation.","sectionTakes":{"top":"Reuters confirms Trump and Xi ended the visit with a two-month trade-truce extension but no detailed public breakthrough; Fox foregrounds ceremony and security, CNN stresses limited substance and unresolved disputes, while Drudge’s front-page selection emphasizes Trump backlash, voter-data controversy and economic anxiety. Drudge is an aggregator, not independent summit reporting. NOAA’s latest advisory reports Nolo at 105 mph, while rainfall and further strengthening remain forecasts. Iranian and Houthi statements are attributed claims; Kyiv and Tanganyika casualty counts are attributed and evolving. The Supreme Court orders and White House credential restoration are legal developments, not final resolutions of all underlying litigation.","usa":"This section covers crime and investigations, a weather threat, a food recall, military mental-health disclosures, a state consumer verdict, TikTok’s Alabama settlement and an appeals-court ruling on prediction markets. The Meta verdict is a jury finding in a specific New Mexico privacy case; TikTok’s deal is a settlement before trial, not a finding on every allegation. Storm impacts and flight conditions are time-sensitive, and the Kalshi decision is a circuit ruling rather than a nationwide resolution.","world":"The tab spans renewed fighting in Tigray, Congo’s Ebola response, Yemen’s hunger emergency, U.N. diplomacy, Kyiv strikes, the Tanganyika capsizing, Nepal’s recovery, Colombia’s extradition, Nordic aircraft monitoring and Venezuela’s promised election timeline. Casualty figures and official statements are attributed; the Venezuelan delay report relies on sources and is not an official cancellation. Appeals, forecasts and proposals are not final outcomes.","politics":"This tab covers campaign strategy, election administration and political accountability. The Justice Department monitor plan is prospective; Ohio’s registration rule and California’s ballot order are separate court actions. New Jersey’s lieutenant governor resigned after an investigation whose findings he disputes; claims remain attributed. Midterm analysis is not a poll, and the government-funded ad report does not by itself establish an election-law violation.","sports":"Atlanta’s 35–14 win over Green Bay is final. NFL availability reports can change; the Aces–Fever WNBA series is scheduled but has not begun; Presidents Cup coverage reflects an opening-session result rather than a tournament champion. An arrest remains an allegation, not a finding of guilt. This section excludes Boston teams, auto racing and international soccer.","boston":"The first two cards are verified Thursday-night finals: the Red Sox lost 1–0 to Cleveland and the Bruins lost 2–0 to Philadelphia (preseason). The Patriots and Celtics did not play Thursday, so no score is implied. Boston won Friday’s Red Sox–Cubs Game 1, 4–3; Game 2 was still underway near the 7 p.m. check, and Bruins–Capitals had no final at edition time. The remaining stories are current Patriots and Celtics team news.","entertainment":"Taylor Swift’s expanded release is out, Netflix’s “A Different World” sequel has premiered, and Ed Sheeran’s two Gillette shows were canceled because of the storm. The Paramount-related filing is a request before a court, Macklemore’s aid tour is announced rather than completed, “Black Doves” is a first-look release, and Dolly Parton Day describes current tributes. Announcements, cancellations and pending proceedings are separated from completed events."},"sections":{"top":[{"id":"top-trump-xi-summit","headline":"Trump and Xi end Washington summit with an extended trade truce but no public breakthrough on core disputes","summary":"The three-day visit ended Friday with tea at the White House and a National Archives tour. Reuters reports the U.S. and China extended their trade truce by two months; details of limited arrangements are due Monday. Taiwan, AI and China’s ties to Iran remain unresolved, and the leaders announced plans to meet twice more this year. Fox highlights the ceremony and strategic/security stakes; CNN’s analysis stresses the limited public substance. No comprehensive trade deal or resolution of the core disputes was announced.","sources":["Fox","CNN","Drudge","Other"],"signal":"Split","links":[{"label":"Reuters: summit wrap-up and trade truce","url":"https://www.reuters.com/world/china/trump-wrap-up-xi-summit-with-tour-us-archives-2026-09-25/"},{"label":"CNN: summit analysis","url":"https://www.cnn.com/2026/09/25/world/xi-dc-trump-analysis-intl-hnk"},{"label":"Fox News: symbolic final stop","url":"https://www.foxnews.com/politics/xi-caps-trump-state-visit-symbolic-final-stop-before-leaving-washington"},{"label":"Drudge Report: current front page","url":"https://www.drudgereport.com/"}]},{"id":"top-pacific-hurricanes","headline":"Hurricane Nolo holds at 105 mph as Hawaii faces flash-flood threat and forecast rain up to 25 inches","summary":"The National Hurricane Center’s 11 a.m. HST Friday advisory (#21) reports sustained winds of 105 mph and a hurricane watch plus tropical-storm warning for Hawaii County; Maui County remains under a tropical-storm watch. The center was forecast to remain south of the islands, while NHC forecasts 10–15 inches of rain in eastern and southern Big Island areas, locally up to 25 inches, with dangerous flooding possible. These rainfall amounts and the forecast major-hurricane strengthening are forecasts, not observed totals or a landfall report.","sources":["Other"],"signal":"Watch","links":[{"label":"NHC Advisory #21 (11 a.m. HST)","url":"https://www.nhc.noaa.gov/text/refresh/HFOTCPCP2+shtml/252055.shtml"},{"label":"NHC forecast discussion #21","url":"https://www.nhc.noaa.gov/text/refresh/HFOTCDCP2+shtml/252056.shtml"},{"label":"NPR update (5:58 p.m. ET)","url":"https://www.npr.org/2026/09/25/nx-s1-5981082/hurricane-nolo-hawaii"},{"label":"AP: Nolo and Polo","url":"https://apnews.com/article/hurricane-nolo-hawaii-polo-mexico-e92145be4b564484025132cdf3d0de90"}]},{"id":"top-iran-war-vote-proposal","headline":"Iran says its seven-day Hormuz proposal is now up to Washington; the Senate rejected a war-powers measure","summary":"Iranian Foreign Minister Abbas Araqchi says Tehran has put forward a seven-day plan involving the Strait of Hormuz and says acceptance is now up to the United States. That is Iran’s account, not an agreed ceasefire or deal; Tehran says the proposal does not require it to compromise on its nuclear program. Separately, the Senate rejected a war-powers resolution 50–49 on Thursday; the vote did not enact a new authorization for the conflict.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Iran says decision is up to U.S.","url":"https://www.reuters.com/world/middle-east/irans-araqchi-says-now-up-us-accept-7-day-plan-2026-09-25/"},{"label":"AP: Iran proposal and conditions","url":"https://apnews.com/article/iran-us-war-negotiations-strait-hormuz-d8b9749fee99a11dd77513d326b824b6"},{"label":"Reuters: Senate war-powers vote","url":"https://www.reuters.com/world/us/us-democrats-tee-up-pre-election-war-powers-vote-some-republicans-break-with-2026-09-24/"}]},{"id":"top-china-intel-iran","headline":"CNN reports U.S. intelligence sources allege Chinese-linked data helped Iran target U.S. sites","summary":"CNN cites four U.S. sources describing intelligence assessments that Chinese-linked satellite imagery and data aided Iranian targeting; officials reportedly disagree about the extent and whether Beijing directed support. Separately, the U.S. ambassador to China says Trump told Xi such assistance was unacceptable. This is an attributed intelligence allegation, not independently established fact; Chinese and Iranian officials did not respond to CNN before publication.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"CNN: intelligence report","url":"https://www.cnn.com/2026/09/25/politics/china-intelligence-iran-targeting-hormuz"},{"label":"Reuters: ambassador’s statement","url":"https://www.reuters.com/world/us/trump-told-xi-that-china-helping-iran-is-unacceptable-us-ambassador-says-2026-09-25/"}]},{"id":"top-saudi-houthi-attacks","headline":"Saudi Arabia says it intercepted six missiles after Houthis claimed attacks on Riyadh and Aramco sites","summary":"Saudi officials say the kingdom intercepted six missiles, while Yemen’s Iran-aligned Houthis claimed attacks on Riyadh and Aramco facilities in Yanbu. Reuters reports Saudi Arabia, Turkey and Pakistan plan an urgent high-level meeting under a joint defense pact. The Houthi claims of hits at the named targets have not been independently confirmed, and the reporting does not establish damage there.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: regional response","url":"https://www.reuters.com/world/middle-east/allies-unite-behind-saudi-arabia-houthis-step-up-attacks-2026-09-25/"},{"label":"Reuters: Houthi claims","url":"https://www.reuters.com/world/middle-east/houthis-say-they-attacked-riyadh-aramco-facilities-yanbu-2026-09-24/"},{"label":"AP: regional developments","url":"https://apnews.com/article/yemen-saudi-arabia-houthis-missiles-d19776cf1a68b45d28b1402f3a47b8cd"}]},{"id":"top-white-house-press-access","headline":"Judge restores CNN, MS NOW and Politico access for 14 days as White House press-ban case continues","summary":"The outlets’ credentials were restored under a temporary order, but the judge has not decided their First Amendment claim. The 14-day restoration is not a final ruling on the press-freedom dispute; the outlets face a September 28 deadline to seek a preliminary injunction.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"Reuters: what comes next","url":"https://www.reuters.com/legal/government/why-court-fight-over-white-house-media-ban-isnt-over-2026-09-25/"},{"label":"AP live coverage","url":"https://apnews.com/live/trump-xi-china-summit-media-ban-news-updates-09-25-2026"},{"label":"CNN live coverage","url":"https://www.cnn.com/2026/09/24/politics/live-news/white-house-press-ban-lawsuit"}]},{"id":"top-kyiv-russian-strikes","headline":"Russian strikes kill five in Kyiv, authorities say, as Ukraine’s largest steel plant halts production","summary":"Reuters’ latest report says Kyiv authorities reported five people killed, including a 14-year-old boy. Separately, ArcelorMittal said repeated strikes damaged its Kryvyi Rih steel plant and that it would not restart production for now. The casualty toll is attributed to local authorities and the plant decision to the company; this does not mean all Ukrainian steel production stopped.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Kyiv strikes and plant shutdown","url":"https://www.reuters.com/world/europe/russian-drone-hits-central-kyiv-killing-child-injuring-least-seven-people-2026-09-25/"}]},{"id":"top-supreme-court-save-database","headline":"Supreme Court lets states use expanded SAVE database for voter checks while litigation continues","summary":"The Supreme Court blocked a lower-court order that had barred states from using the revamped federal immigration database for broad citizenship checks of voter registrations. Reuters reports the system’s overall error rate is unknown and voting-rights groups cite eligible citizens flagged incorrectly. The emergency ruling allows the checks while litigation continues; it is not proof of widespread noncitizen voting.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Supreme Court ruling","url":"https://www.reuters.com/world/supreme-court-restores-trumps-mass-voter-verification-system-2026-09-25/"},{"label":"AP: database ruling","url":"https://apnews.com/article/save-database-noncitizen-voters-trump-supreme-court-412e12f5a492dd20e407812f30f7c139"}]},{"id":"top-supreme-court-missouri-map","headline":"Supreme Court blocks Missouri from using Trump-backed congressional map for a third time","summary":"The court again rejected the Republican-backed map, leaving Missouri on track to use its 2022 congressional districts in the 2026 elections. The ruling is a consequential election-law decision, not a ruling about the outcome of any race; it follows a rapid series of conflicting state and federal court orders.","sources":["Fox","Other"],"signal":"Consensus","links":[{"label":"Reuters: third Supreme Court block","url":"https://www.reuters.com/world/us-supreme-court-bars-republican-drawn-map-missouri-third-time-2026-09-25/"},{"label":"AP: ruling report via WBAL","url":"https://www.wbal.com/supreme-court-rejects-a-trump-backed-missouri-congressional-map-for-the-third-time"},{"label":"Fox News: Supreme Court decision","url":"https://www.foxnews.com/politics/supreme-court-blocks-missouri-from-using-new-congressional-map-2026-election"}]},{"id":"top-congo-boat-disaster","headline":"Lake Tanganyika boat disaster leaves casualty totals unsettled after at least 41 deaths were reported","summary":"An AP report citing provincial authorities said at least 41 people died and 49 were rescued after a boat traveling from Tanzania to Congo capsized Thursday. In a Friday update, Reuters cited an official saying 43 people survived and more than 40 remained missing. The evolving official counts differ; no cause was reported in the cited accounts.","sources":["Other"],"signal":"Watch","links":[{"label":"AP report via WTOP","url":"https://wtop.com/world/2026/09/boat-heading-from-tanzania-to-congo-on-lake-tanganyika-capsizes-leaving-at-least-41-dead-2/"},{"label":"Reuters: more than 40 missing","url":"https://www.reuters.com/world/africa/more-than-40-missing-after-congo-passenger-boat-sinks-official-says-2026-09-25/"}]}],"usa":[{"id":"usa-pittsburgh-doctor-killed","headline":"Pittsburgh pediatrician Idris Evans is killed in a home attack; his wife is critically injured, officials say","summary":"Authorities say a man entered the home and stabbed the physician and his wife while they slept; the suspect was detained. The investigation is ongoing, and the account of the attack is attributed to law enforcement.","sources":["CNN","Fox","Other"],"signal":"Consensus","links":[{"label":"CNN: Pittsburgh investigation","url":"https://www.cnn.com/2026/09/25/us/pittsburgh-doctor-idris-evans-stabbing-home"},{"label":"PennLive: local report","url":"https://www.pennlive.com/crime/2026/09/upmc-childrens-hospital-physician-killed-in-stabbing-suspect-detained.html"}]},{"id":"usa-copenhaver-death","headline":"James Copenhaver, wounded in the 2024 Butler rally shooting, dies from injury complications","summary":"Copenhaver, 76, was one of two people wounded when a gunman opened fire at then-candidate Donald Trump’s Pennsylvania rally in July 2024. His lawyer said he died from complications related to those injuries; the death brings renewed attention to the attack’s victims.","sources":["Fox","Other"],"signal":"Consensus","links":[{"label":"AP: Copenhaver’s death","url":"https://apnews.com/article/james-copenhaver-trump-rally-butler-dies-00866b37ad8db967b4ebf6582c756bcd"},{"label":"CBS Pittsburgh","url":"https://www.cbsnews.com/pittsburgh/news/jim-copenhaver-trump-rally-assassination-attempt-victim-dies/"},{"label":"Fox News","url":"https://www.foxnews.com/politics/james-copenhaver-man-shot-trump-butler-rally-dies-complications-from-injuries-report"}]},{"id":"usa-ole-miss-deaths","headline":"Two Ole Miss student deaths remain under investigation; kratom found at the scene does not establish a cause","summary":"Authorities are investigating the deaths of two students, and reporting says kratom was found at the scene. Investigators have not established that the substance caused either death; the cases remain under investigation.","sources":["CNN","Fox","Other"],"signal":"Watch","links":[{"label":"AP: deaths and kratom","url":"https://apnews.com/article/kratom-mississippi-deaths-students-5c4d6429e65b573b2667119a8f860ddb"},{"label":"CNN: Ole Miss deaths","url":"https://www.cnn.com/2026/09/24/us/ole-miss-student-deaths-wwk"},{"label":"Fox News","url":"https://www.foxnews.com/us/ole-miss-victim-identified-narcotics-task-force-probes-two-student-deaths"}]},{"id":"usa-evanston-ice-detention","headline":"U.S. citizen says ICE agents mistakenly detained and injured him in Evanston","summary":"A U.S. citizen says immigration agents wrongly detained and injured him; local police and the man have offered accounts of the encounter. The claim is disputed and under scrutiny, not a court finding about the agents’ conduct.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"CNN: Evanston detention","url":"https://www.cnn.com/2026/09/24/us/ice-us-citizen-detained-evanston"},{"label":"AP: local account","url":"https://apnews.com/article/chicago-illinois-ice-immigration-agents-evanston-police-2e07d80e8d96685489e914880a4e4d5"}]},{"id":"usa-noreaster-coastal-flooding","headline":"Nor’easter brings Mid-Atlantic coastal flooding as stronger New England impacts remain forecast","summary":"CNN reports coastal flooding from the storm along the Mid-Atlantic, while the highest New England rain, wind and wave impacts are still forecast. The expected regional effects should not be mistaken for observed damage everywhere.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"CNN: storm report","url":"https://www.cnn.com/2026/09/24/weather/noreaster-coastal-storm-forecast-climate"},{"label":"The Washington Post forecast","url":"https://www.washingtonpost.com/weather/2026/09/24/track-where-potent-noreaster-will-bring-heavy-rain-winds-waves/"}]},{"id":"usa-usda-meat-recall","headline":"USDA recalls more than 167,000 pounds of meat produced without federal inspection","summary":"The Food Safety and Inspection Service says Star Meat Delivery recalled raw pork, beef and goat products that were produced without federal inspection. Check the agency’s recall notice for affected labels, lot details and handling instructions.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"USDA-FSIS recall notice","url":"https://www.fsis.usda.gov/recalls-alerts/star-meat-delivery-inc--recalls-raw-pork-beef-and-goat-products-produced-without"},{"label":"CNN: recall coverage","url":"https://www.cnn.com/2026/09/24/us/meat-recall-usda-star-meat-delivery-hnk"}]},{"id":"usa-meta-cambridge-analytica-jury","headline":"New Mexico jury finds Meta misled users about Facebook data practices in Cambridge Analytica case","summary":"A Santa Fe jury found 26 of 29 statements identified by New Mexico to be misleading, including statements about data practices, hate speech and misinformation; it rejected some other claims. The verdict concerns a state case arising from the Cambridge Analytica scandal. A judge will determine civil penalties, so the verdict is not a final damages award or a finding that Facebook sold every user’s data.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: jury verdict","url":"https://www.reuters.com/business/meta-misled-consumers-case-over-cambridge-analytica-scandal-new-mexico-jury-says-2026-09-25/"},{"label":"AP: case background and trial","url":"https://apnews.com/article/facebook-meta-new-mexico-privacy-lawsuit-8b414eb0a14d58d7cdc6ae752e25dcb0"}]},{"id":"usa-lincoln-sailor-mental-health","headline":"Navy says eight USS Lincoln carrier-group sailors attempted suicide during deployment","summary":"The Navy disclosed eight suicide attempts among sailors assigned to the USS Abraham Lincoln carrier group during deployment. The report raises questions about the strain of service; it does not identify individual sailors, and care resources are available through military and civilian crisis services.","sources":["Other"],"signal":"Watch","links":[{"label":"AP: Navy disclosure","url":"https://apnews.com/article/uss-lincoln-aircraft-carrier-suicide-attempts-iran-7bb8316aa4fd67e6d2c8b34c029eebda"}]},{"id":"usa-tiktok-alabama-settlement","headline":"TikTok settles Alabama’s teen-harm lawsuit on eve of the first state trial over the claims","summary":"Reuters reports TikTok and ByteDance reached a settlement with Alabama over allegations that the platform was designed to addict children and that the companies misled consumers about safety. The Alabama attorney general’s office says the state will receive at least $100 million within 45 days, with potential payments up to $300 million if conditions are met. This is a settlement before trial, not a court finding that every allegation was proven.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: Alabama settlement and terms","url":"https://www.reuters.com/world/us/tiktok-settles-with-alabama-ahead-first-state-trial-over-claims-teen-harms-2026-09-25/"}]},{"id":"usa-kalshi-sixth-circuit-ruling","headline":"Appeals court says states may regulate Kalshi sports-event contracts under gambling laws","summary":"Reuters reports the 6th U.S. Circuit Court of Appeals ruled that Ohio and Tennessee gambling laws were not preempted by federal law and that Kalshi had not shown its sports-event contracts were swaps subject exclusively to Commodity Futures Trading Commission regulation. The ruling is a circuit-court decision; broader litigation and regulatory questions remain.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters: 6th Circuit ruling","url":"https://www.reuters.com/business/finance/us-appeals-court-rules-against-kalshi-says-states-can-regulate-prediction-2026-09-25/"}]}],"world":[{"id":"world-ethiopia-tigray-fighting","headline":"Renewed fighting in Ethiopia’s Tigray region threatens the 2022 peace agreement","summary":"AP and Reuters report renewed clashes between federal forces and Tigrayan fighters, with former adversaries aligning against the federal government. The violence is fresh, but it does not mean the 2022 accord has formally collapsed.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"AP: Ethiopia fighting","url":"https://apnews.com/article/ethiopia-tigray-fighting-rebels-federal-troops-fbca7b22197dfd4d4d7438e2df224764"},{"label":"Reuters: Tigray analysis","url":"https://www.reuters.com/world/africa/flush-with-allies-tigrays-leaders-face-internal-discord-new-ethiopia-war-2026-09-24/"},{"label":"CNN: renewed conflict","url":"https://www.cnn.com/2026/09/25/africa/war-returns-to-ethiopias-tigray-intl"}]},{"id":"world-congo-ebola-health-staff","headline":"WHO says Congo lacks health workers as Ebola outbreak remains uncontrolled in some provinces","summary":"WHO says treatment centers are short of staff and cases have surged in North Kivu, even as case counts fell in some other provinces. The agency describes a fast-moving outbreak with uneven transmission, not a uniform rise across the country.","sources":["Other"],"signal":"Watch","links":[{"label":"PBS/AP: WHO warning","url":"https://www.pbs.org/newshour/health/congo-faces-health-worker-shortage-as-ebola-remains-out-of-control-who-says"} ns a future event.","sources":["Other"],"signal":"Consensus","links":[{"label":"AP: Swift release","url":"https://apnews.com/article/taylor-swift-new-music-patient-zero-934935f049893d0567713bea516f2c0c"},{"label":"Variety: album and video","url":"https://variety.com/2026/music/news/taylor-swift-reveals-life-of-showgirl-encore-new-songs-1236872982/"},{"label":"Variety: video details","url":"https://variety.com/2026/music/news/taylor-swift-patient-zero-music-video-dakota-johnson-colin-farrell-1236874206/"}]},{"id":"entertainment-different-world-netflix","headline":"Netflix’s “A Different World” sequel premieres with the original HBCU setting in focus","summary":"The sequel to the 1980s campus sitcom is available on Netflix Friday, bringing a new generation to the fictional Hillman College setting. The premiere is confirmed; audience response is not yet known.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"CNN: sequel premiere","url":"https://www.cnn.com/2026/09/24/entertainment/a-different-world-reboot-netflix"},{"label":"AP: sequel","url":"https://apnews.com/article/a-different-world-sequel-f0f23537d211e084dfb53999c3a4a367"}]},{"id":"entertainment-paramount-wbd-settlement-challenge","headline":"Merger opponents ask a court to reject Paramount’s settlement tied to its Warner Bros. bid","summary":"Variety reports opponents urged a court to reject a settlement connected to Paramount’s proposed Warner Bros. bid. The filing is an argument for the judge to consider; it is not a ruling on the merger or a completed acquisition.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety: court challenge","url":"https://variety.com/2026/tv/global/block-the-merger-amicus-brief-reject-settlement-1236875410/"},{"label":"Variety: settlement terms","url":"https://variety.com/2026/film/news/paramount-states-settlement-terms-warner-bros-1236871264/"}]},{"id":"entertainment-macklemore-charity-tour","headline":"Macklemore announces a tour supporting Palestinian aid organizations","summary":"Macklemore says proceeds from his planned “Free Palestine” shows will support aid organizations. The tour announcement is confirmed; the performances and any eventual distributions have not yet occurred.","sources":["Other"],"signal":"Watch","links":[{"label":"AP: tour announcement","url":"https://apnews.com/article/macklemore-free-palestine-shows-ed-sheeran-65a65a362e530dfe739ddb626dc16d23"},{"label":"Variety: tour details","url":"https://variety.com/2026/music/news/macklemore-free-palestine-tour-1236874352/"}]},{"id":"entertainment-black-doves-first-look","headline":"Netflix releases a first look at season two of “Black Doves”","summary":"The streamer released an early look at the second season, with Keira Knightley returning. This is a promotional preview; no season-two premiere date was announced in the cited report.","sources":["Other"],"signal":"Consensus","links":[{"label":"Variety: first look","url":"https://variety.com/2026/tv/news/black-doves-season-2-trailer-netflix-keira-knightley-1236874496/"}]},{"id":"entertainment-ed-sheeran-gillette-canceled","headline":"Ed Sheeran cancels Friday and Saturday Gillette Stadium shows as nor’easter approaches","summary":"Gillette Stadium and the promoter announced that Sheeran’s two Foxborough concerts scheduled for Sept. 25–26 were canceled because of the impending nor’easter. The venue says refunds are available through the point of purchase; no replacement dates were announced in the cited notice.","sources":["Other"],"signal":"Consensus","links":[{"label":"Gillette Stadium official cancellation notice","url":"https://www.gillettestadium.com/events/ed-sheeran-loop-tour/"},{"label":"NBC Boston/AP: cancellation report","url":"https://www.nbcboston.com/news/local/ed-sheeran-gillette-stadium-loop-tour/4020701/"}]},{"id":"entertainment-dolly-parton-day","headline":"Communities mark Dolly Parton Day with parades, pink lights and book drives","summary":"AP reports that communities worldwide are honoring Dolly Parton on Sept. 25, a nod to her hit “9 to 5,” with events including parades, pink lighting and book drives. The article describes celebrations and tributes, not an announcement of a new tour or release.","sources":["Other"],"signal":"Consensus","links":[{"label":"AP: Dolly Parton Day","url":"https://apnews.com/article/dolly-parton-day-925-1741a56d5a32ed562c465352ee9e2f40"}]}]},"researchNotes":["Fresh public-web research was conducted for the Friday, September 25, 2026, 7:00 p.m. EDT Boston edition. Fox News and CNN homepages and the live Drudge Report front page were inspected; direct coverage was checked for the summit, Hurricane Nolo, late-day U.S. court cases and developing reports. Drudge is treated as an aggregator, not an independent source.","Summit comparison: Reuters reports the visit ended with a two-month extension of the trade truce and no detailed public breakthrough on Taiwan, AI or other core disputes; limited trade details are expected Monday. CNN framing emphasizes the pageantry and limited substance. Fox coverage emphasizes ceremony and security/Iran stakes. The Drudge front-page selection at refresh time emphasized backlash to Trump, SAVE voter-data checks, mortgage/economic anxieties and other controversy; it did not provide independent summit reporting.","Hurricane Nolo: NOAA/NHC Advisory #21, issued at 11 a.m. HST / 5 p.m. EDT (21:00 UTC) Friday, reports 105-mph maximum sustained winds, a Hawaii County hurricane watch and tropical-storm warning, and a Maui County tropical-storm watch. It forecasts 10–15 inches in eastern/southern Big Island areas, locally 25 inches, with dangerous flooding possible. These are forecasts, not observed rainfall. NPR updated its report at 5:58 p.m. ET.","The Senate’s 50–49 rejection of an Iran war-powers resolution is a completed vote; the Iranian seven-day proposal and Houthi attacks are attributed claims, not an accepted agreement or independently verified impacts at alleged targets. Reuters/AP material was used to distinguish those claims from confirmed outcomes.","Top election coverage includes separate Supreme Court actions: the emergency order permitting use of the SAVE database while litigation continues, and the decision blocking Missouri’s Republican-backed congressional map. Neither establishes widespread noncitizen voting or changes the certified result of an election. The White House media-access restoration is temporary, not a final First Amendment ruling.","Reuters’ latest report says Kyiv authorities reported five deaths, including a 14-year-old, and attributes the Kryvyi Rih plant pause to ArcelorMittal. A distinct second-source report confirming the precise updated Kyiv death toll was not found in the available fresh results; the count is therefore attributed to Reuters/local authorities. AP and Reuters report evolving, differing official counts from the Lake Tanganyika capsizing; no cause is stated.","Late-day U.S. coverage: Reuters reports TikTok and ByteDance settled Alabama’s teen-harm case before trial; the Alabama attorney general’s office says the state will receive at least $100 million, with the potential to reach $300 million if conditions are met. Separately, a New Mexico jury found 26 of 29 specified Meta statements misleading in the Cambridge Analytica data case; a judge will set any penalty. This is distinct from the earlier youth-safety verdict. The New Jersey lieutenant governor resigned after an investigation, and his lawyer disputes its findings.","Boston score check: MLB’s official scoreboard confirms the Guardians beat the Red Sox 1–0 Thursday, Sept. 24; ESPN and CBS Sports confirm Philadelphia beat the Bruins 2–0 in preseason Thursday. Patriots and Celtics did not play Thursday night. ESPN/MLB confirm the Red Sox beat the Cubs 4–3 in Friday Game 1. Live scoreboard results showed Game 2 still underway near the 7 p.m. edition check; Bruins–Capitals was scheduled for 7 p.m. and no final is implied.","All required tabs and counts were validated: Top News 10, USA 10, World 10, Politics 7, Sports 9, Boston Sports 5 and Entertainment 7. Every story has at least one direct source link; no duplicate IDs or normalized headlines; prohibited Boston teams, auto racing and international soccer do not appear in general Sports."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['world','World'],['politics','Politics'],['sports','Sports'],['boston','Boston Sports'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated in Top News.',world:'10 world stories not repeated in Top News.',sports:'No Boston teams, auto racing, or international soccer.',boston:'Boston teams and local sports only.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
