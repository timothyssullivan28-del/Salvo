ed flights. The Aden strike’s responsibility remains unconfirmed in Reuters’ account, and Houthi claims about Saudi targets are attributed rather than independently verified.","links":[{"label":"Reuters — missile near Aden airport, Oct. 7","url":"https://www.reuters.com/world/middle-east/houthis-launch-missiles-yemens-aden-airport-fighting-intensifies-2026-10-07/"},{"label":"AP — Houthi claims and regional developments, Oct. 7","url":"https://apnews.com/article/yemen-houthis-saudi-airport-aden-rebels-f22f20dd78b03b741dfa1279881cedbb"},{"label":"Fox News — current homepage checked Oct. 7","url":"https://www.foxnews.com/"},{"label":"CNN — current homepage checked Oct. 7","url":"https://www.cnn.com/"},{"label":"Drudge Report — aggregator homepage checked Oct. 7","url":"https://www.drudgereport.com/"}],"sources":["Other","Fox","CNN","Drudge"],"signal":"Watch"},{"id":"top-ukraine-strikes-oct7","headline":"Ukraine reports 28 killed in Russian barrage; officials give differing tolls","summary":"Reuters’ updated Oct. 7 report says Ukraine’s interior minister put the toll at 28, while President Volodymyr Zelenskiy said 25; a regional governor reported 13 killed, including four children, in Pryluky. The figures are attributed to Ukrainian officials and differ; Russia said it targeted military-industrial facilities.","links":[{"label":"Reuters — updated Ukrainian death toll and strike, Oct. 7","url":"https://www.reuters.com/world/europe/russia-strikes-ukraines-kyiv-fresh-wave-attacks-2026-10-07/"}],"sources":["Other"],"signal":"Watch"},{"id":"top-israel-oct7-anniversary-2026","headline":"Israel marks Oct. 7 anniversary amid grief, Gaza devastation and election divisions","summary":"Israelis held memorials three years after the Hamas-led Oct. 7, 2023 attack, while people in Gaza continue to live with the war’s devastation. AP reports the anniversary is shaping debate ahead of Israel’s first election since the attack; the remembrance and the political accountability questions are distinct parts of the story.","links":[{"label":"AP — Israelis mourn as Gaza remains devastated, Oct. 7","url":"https://apnews.com/article/israel-palestinians-oct-7-war-gaza-anniversary-da70839eab71a77db31237fe79142ead"},{"label":"Reuters — Israelis mark third anniversary, Oct. 7","url":"https://www.reuters.com/world/middle-east/israelis-mark-three-years-since-hamas-attack-that-set-off-gaza-assault-2026-10-07/"},{"label":"AP — election divisions over Netanyahu, Oct. 7","url":"https://apnews.com/article/israel-oct-7-election-netanyahu-hamas-gaza-55d94c750b399e7d89f550ebc8610436"}],"sources":["Other"],"signal":"Watch"},{"id":"top-pike-failed-execution-hearing-oct7","headline":"After failed execution attempt, Christa Pike is awake and speaking as lawyers seek records","summary":"Fox and CNN report Pike’s attorney says she regained consciousness after Tennessee’s lethal-injection attempt failed and is now speaking; her lawyers are seeking evidence about the execution process. The hearing and any resulting legal challenge remain unresolved.","links":[{"label":"CNN — lawyer describes Pike’s first words after failed execution, Oct. 7","url":"https://www.cnn.com/2026/10/07/us/video/christa-pike-first-words-failed-execution-digvid-vrtc"},{"label":"Fox News — live coverage of Tennessee hearing, Oct. 7","url":"https://www.foxnews.com/live-news/christa-pike-conscious-and-speaking-after-failed-execution-tennessee-court-holds-hearing"},{"label":"AP — lawyers seek execution evidence, Oct. 7","url":"https://apnews.com/article/tennessee-execution-christa-pike-lawyers-lethal-injection-991c7794168e09d77fab725d1c11ee74"}],"sources":["Fox","CNN","Other"],"signal":"Watch"},{"id":"top-mall-america-alleged-plot-oct7","headline":"FBI arrests 18-year-old in alleged ISIS-inspired Mall of America attack plot","summary":"Federal authorities say an 18-year-old was arrested after allegedly trying to acquire an assault rifle for a planned attack; Fox reports the FBI had investigated him for nearly two years. The allegations are not a conviction, and details are attributed to investigators and the charging case.","links":[{"label":"Fox News — FBI arrests suspect in alleged Mall of America plot, Oct. 7","url":"https://www.foxnews.com/us/minnesota-man-accused-plotting-mall-america-attack-pledging-allegiance-isis-fbi"},{"label":"KPTV — FBI case and alleged rifle purchase, Oct. 7","url":"https://www.kptv.com/2026/10/07/fbi-stops-mall-america-terror-plot-by-18-year-old-after-agents-sold-him-assault-rifle/"}],"sources":["Fox","Other"],"signal":"Watch"},{"id":"top-isaias-gulf-storm-oct7","headline":"Tropical Storm Isaias could strengthen before threatening the Gulf Coast","summary":"The National Hurricane Center forecast that Isaias could become a hurricane and reach the U.S. Gulf Coast later this week. The track and intensity are forecasts, not a confirmed landfall or impact.","links":[{"label":"AP — Isaias forecast and Gulf Coast threat, Oct. 7","url":"https://apnews.com/article/tropical-storm-isaias-gulf-atlantic-440bdecf97a5340547ca3ad291b361df"},{"label":"CNN — storm track and forecast, Oct. 6–7","url":"https://www.cnn.com/2026/10/06/weather/tropical-storm-isaias-hurricane-track-gulf-climate"}],"sources":["CNN","Other"],"signal":"Watch"},{"id":"top-trump-advisers-fire-oct7","headline":"Trump says he may fire advisers if their work conflicts with his agenda","summary":"In a Reuters interview, President Donald Trump said he could fire political advisers James Blair and Chris LaCivita if he concludes their work conflicts with his agenda. The remarks do not mean either adviser has been dismissed; the dispute followed reporting about their work abroad.","sources":["Other"],"signal":"Split","links":[{"label":"Reuters — Trump on firing advisers, Oct. 7","url":"https://www.reuters.com/world/us/trump-says-hell-fire-advisers-lacivita-blair-if-theres-conflict-2026-10-07/"},{"label":"CNN — Trump floats firing advisers, Oct. 7","url":"https://www.cnn.com/2026/10/07/politics/trump-fire-james-blair-chris-lacivita"}]},{"id":"top-hormuz-attack-oct6","headline":"India says 12 sailors injured after projectile strikes vessel near Hormuz","summary":"India’s foreign ministry said a projectile hit the Panama-flagged MT On Peace while it was transiting the Strait of Hormuz and injured 12 crew, including 11 Indian nationals; Oman helped evacuate them. India dated the incident Tuesday, while UKMTO’s late report, carried by Al Jazeera, describes an outbound oil tanker hit Monday. The discrepancy is unresolved and responsibility remains unknown.","links":[{"label":"Al Jazeera — India reports 12 crew injured off Oman, Oct. 6","url":"https://www.aljazeera.com/news/liveblog/2026/10/6/iran-war-live-yemen-forces-reclaim-strategic-port-city-mocha-from-houthis"},{"label":"India Today — foreign ministry statement on MT On Peace, Oct. 6","url":"https://www.indiatoday.in/amp/india/story/11-indian-sailors-hurt-as-projectile-hits-panama-flagged-vessel-in-hormuz-says-govt-crew-evacuated-to-oman-3010786-2026-10-06"},{"label":"Fox News live — Indian sailors injured in Hormuz attack, Oct. 6","url":"https://www.foxnews.com/live-news/iran-war-trump-oil-prices-fall-middle-east-10-06-26"}],"sources":["Fox","Other"],"signal":"Watch"},{"id":"top-germany-exspy-arrest-oct6","headline":"Germany arrests former intelligence chief on espionage and treason allegations","summary":"Prosecutors say former BND chief August Hanning was arrested on suspicion of espionage and attempted treason; an aide was also arrested. These are allegations under investigation, not findings of guilt, and authorities have not publicly identified the suspected foreign service.","links":[{"label":"AP — former German intelligence chief arrested, Oct. 6","url":"https://www.therepublic.com/2026/10/06/germany-arrests-a-former-domestic-intelligence-chief-on-spying-allegations/"},{"label":"CNN affiliate — espionage allegations, Oct. 6","url":"https://ktvz.com/news/national-world/cnn-world/2026/10/06/germany-arrests-a-former-foreign-intelligence-chief-on-spying-allegations/"},{"label":"Financial Times — Hanning arrest, Oct. 6","url":"https://www.ft.com/content/4c565931-6ac7-4b4c-be72-d86e8e3a8aec"}],"sources":["CNN","Other"],"signal":"Watch"},{"id":"top-vance-iran-enrichment-oct6","headline":"Vance calls for a “meaningful” Iranian enrichment reduction to end the war","summary":"In a Reuters interview published Oct. 6, Vice President JD Vance said Iran must make a meaningful reduction in uranium enrichment as part of a deal to end the war. His wording describes the administration’s stated demand, not an agreed framework or Tehran’s response; Al Jazeera notes analysts read it as a possible shift from Washington’s earlier zero-enrichment position.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — Vance interview on Iran’s enrichment, Oct. 6","url":"https://www.reuters.com/world/interview-us-vice-president-vance-says-iran-must-cut-enrichment-end-war-2026-10-06/"},{"label":"Al Jazeera — analysis of U.S. demands, Oct. 7","url":"https://www.aljazeera.com/news/2026/10/7/us-sets-new-demands-for-iran-deal-what-are-they"}]}],"usa":[{"id":"usa-social-media-addiction-verdict-oct6","headline":"Jury finds Instagram and YouTube liable in landmark social-media addiction trial","summary":"An AP-reported jury verdict found Meta and YouTube liable in a young user’s social-media addiction case, a landmark ruling that could influence other litigation. The companies disputed liability; the verdict does not establish that every platform or user was harmed in the same way.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — social-media addiction trial verdict","url":"https://apnews.com/article/social-media-addiction-trial-la-5e54075023d837ccdc76c4ca512e9251"}]},{"id":"usa-cornell-no-confidence-oct6","headline":"Cornell faces a new lawsuit and faculty review over handling of sexual-assault allegations","summary":"The university’s response remains under scrutiny: a new CNN report on Wednesday covers a lawsuit and student protests, while AP previously reported Cornell faculty planned a no-confidence vote and the university retained former Justice official Sally Yates for an external review. Allegations remain allegations; the review and legal process are pending.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"CNN — lawsuit and student protests, Oct. 7","url":"https://www.cnn.com/2026/10/07/us/cornell-lawsuit-student-protests-hnk"},{"label":"AP — Yates review and faculty vote, Oct. 6","url":"https://apnews.com/article/cornell-university-rape-investigation-sally-yates-259e923dc2fb581f6565b0c4969c4397"}]},{"id":"usa-doj-denaturalization-40-oct7","headline":"DOJ files citizenship-revocation cases against 40 naturalized citizens","summary":"The Justice Department says it filed cases targeting 40 naturalized citizens accused of serious offenses, calling it the largest single-period filing under the administration. Citizenship is not revoked by the announcement: allegations must be litigated in court, and the legal burden remains on the government.","links":[{"label":"U.S. Department of Justice — announcement and allegations, Oct. 6","url":"https://www.justice.gov/opa/pr/justice-department-moves-strip-citizenship-40-criminals-largest-single-period"},{"label":"The Guardian — denaturalization actions, Oct. 6","url":"https://www.theguardian.com/us-news/2026/oct/06/trump-justice-department-denaturalize-citizens-crimes"}],"sources":["Other"],"signal":"Watch"},{"id":"usa-pennsylvania-measles-oct6","headline":"Pennsylvania measles outbreak is the largest in decades, AP reports","summary":"Pennsylvania is experiencing its largest measles outbreak in decades, AP reports, amid continuing spread and public-health response. Case counts and exposure alerts can change; follow state health updates for current totals.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — Pennsylvania outbreak, Oct. 6","url":"https://apnews.com/article/measles-outbreak-pennsylvania-4cae9e5cd28a164a07ac69147505b763"}]},{"id":"usa-biohub-ai-biology-data-oct7","headline":"U.S. government and Google join $1.8 billion AI biology-data effort","summary":"Reuters reports the U.S. government and Google are joining the Zuckerberg-backed Biohub in a $1.8 billion push to build AI-focused biology data resources. The announced collaboration is a research and data initiative, not a completed scientific outcome.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — Biohub AI biology-data initiative, Oct. 7","url":"https://www.reuters.com/business/healthcare-pharmaceuticals/us-government-google-join-zuckerberg-backed-biohub-18-billion-push-ai-biology-2026-10-07/"}]},{"id":"usa-appeals-court-kidnapping-reversal-oct7","headline":"Appeals court vacates kidnapping convictions in case involving a missing 3-year-old","summary":"A federal appeals court vacated kidnapping convictions in a case involving a 3-year-old boy who disappeared in Georgia in 2017 and later died. The ruling concerns the convictions and does not change the underlying death; the case may continue on remand.","links":[{"label":"U.S. News — appeals court ruling, Oct. 7","url":"https://www.usnews.com/news/best-states/new-mexico/articles/2026-10-07/appeals-court-reverses-convictions-in-kidnapping-and-terrorism-case-involving-3-year-old-boys-death"}],"sources":["Other"],"signal":"Watch"},{"id":"usa-iran-strike-medical-care-oct6","headline":"Wounded U.S. soldiers say military medical system failed them after Iranian drone strike","summary":"AP interviews with seriously wounded service members describe gaps in care after a deadly Iranian drone attack, while soldiers and Gold Star families press Army leadership for answers. The reporting documents their accounts and allegations; it is not a completed Army finding.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — wounded soldiers describe medical-care failures","url":"https://apnews.com/artic ":"Fox News reports records reveal that an ex-Obama intelligence official prepared with special counsel Jack Smith’s team for a Trump trial. The account is Fox’s characterization of the documents and does not itself establish wrongdoing; the underlying records and responses should be read in context.","links":[{"label":"Fox News — records and Jack Smith team, Oct. 7","url":"https://www.foxnews.com/politics/ex-obama-spy-chief-prepped-anti-trump-trial-biden-era-special-counsels-team-records-reveal"}],"sources":["Fox"],"signal":"Split"},{"id":"politics-gop-spending-polls-oct7","headline":"Washington Post: large Republican spending has not shifted key midterm polls","summary":"The Washington Post reports that roughly half a billion dollars in Republican spending has done little to move polling in closely watched races. The assessment is based on the paper’s poll and campaign analysis; polling remains uncertain and the election is weeks away.","links":[{"label":"Washington Post — spending and midterm polling, Oct. 7","url":"https://www.washingtonpost.com/politics/2026/10/07/half-billion-dollars-gop-spending-does-little-move-polls/"}],"sources":["Other"],"signal":"Watch"},{"id":"politics-trump-camp-david-oct7","headline":"Trump wants to turn his West Palm Beach golf course into a new Camp David","summary":"The Washington Post reports Trump wants to develop a presidential retreat at his Florida golf property. The idea would be a change from Camp David’s traditional Maryland setting; it is a reported plan, not an approved construction project.","links":[{"label":"Washington Post — proposed retreat at Trump golf club, Oct. 7","url":"https://www.washingtonpost.com/politics/2026/10/07/trump-wants-new-camp-david-his-own-golf-club/"}],"sources":["Other"],"signal":"Watch"},{"id":"politics-doj-civil-rights-hires-oct7","headline":"Reports question DOJ civil-rights hiring as division faces depleted ranks","summary":"The New York Times reports the Justice Department has turned to partisan and conspiracy-oriented figures to fill depleted civil-rights division ranks. The description is the newspaper’s investigation and should be distinguished from an official finding or adjudicated misconduct.","links":[{"label":"New York Times — DOJ civil-rights division staffing, Oct. 6","url":"https://www.nytimes.com/2026/10/06/us/politics/justice-department-civil-rights-division.html"}],"sources":["Other"],"signal":"Watch"},{"id":"politics-ohio-early-voting-oct6","headline":"Ohio early voting begins with control of Congress at stake","summary":"Early voting starts Tuesday in Ohio, where one Senate seat and two House districts are rated toss-ups, Reuters reports. The Nov. midterms will determine congressional control; voting has begun but no election results are available.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — Ohio early voting, Oct. 6","url":"https://www.reuters.com/world/us/ohio-early-voting-begins-with-us-congress-control-line-2026-10-06/"}]},{"id":"politics-gop-candidates-distance-trump-oct7","headline":"Reuters: Republicans in tight midterm races distance themselves from Trump","summary":"A Reuters review finds most Republicans in competitive midterm races are distancing themselves from President Trump, a sign of campaign pressure ahead of November. The report describes candidate strategy; it is not a prediction of election results.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — candidates distance themselves, Oct. 7","url":"https://www.reuters.com/world/us/most-republicans-tight-midterm-distance-trump-reuters-review-finds-2026-10-07/"}]},{"id":"politics-trump-ad-funds-ap-oct7","headline":"Trump does not commit to reimbursing taxpayers for money spent on political ads","summary":"In an AP interview, President Trump did not commit to repaying federal funds already spent on controversial advertising. The funding and reimbursement questions remain unresolved; the administration has not announced a repayment.","links":[{"label":"AP — Trump on federal funds for ads, Oct. 7","url":"https://apnews.com/article/trump-taxpayer-funded-ads-super-pac-reimburse-d728ad3cf091576d09a63d9218be3fe2"},{"label":"AP — live midterm coverage, Oct. 7","url":"https://apnews.com/live/trump-midterm-elections-news-updates-10-7-2026"}],"sources":["Other"],"signal":"Watch"}],"entertainment":[{"id":"entertainment-paramount-wbd-merger-oct6","headline":"Paramount Skydance completes $110 billion Warner Bros. Discovery takeover","summary":"Paramount Skydance completed its takeover of Warner Bros. Discovery Tuesday, creating a combined entertainment and news group with about $80 billion in debt, Reuters reported. Executives target $6 billion in savings, while the scale and timing of job cuts and streaming integration remain unsettled.","links":[{"label":"Reuters — Paramount closes Warner Bros. Discovery merger, Oct. 6","url":"https://www.reuters.com/business/media-telecom/paramount-wraps-up-mega-warner-bros-merger-create-hollywood-powerhouse-skydance-2026-10-06/"}],"sources":["Other"],"signal":"Watch"},{"id":"entertainment-emmys-primevideo-oct6","headline":"Emmys will leave broadcast TV for Prime Video under six-year deal","summary":"The Television Academy and Amazon announced Tuesday that Prime Video will carry the Primetime Emmy Awards beginning in 2027 under a six-year global deal, Variety reports. The move shifts the telecast from broadcast television; reported financial terms are estimates, not disclosed terms.","links":[{"label":"Variety — six-year Prime Video deal, Oct. 6","url":"https://variety.com/2026/tv/news/emmys-prime-video-six-year-deal-15-million-a-year-1236899957/"},{"label":"Wall Street Journal — deal announcement, Oct. 6","url":"https://www.wsj.com/business/media/emmy-awards-will-leave-broadcast-tv-for-amazons-prime-video-0c92fad5"}],"sources":["Other"],"signal":"Consensus"},{"id":"entertainment-jim-bakker-death-oct6","headline":"Televangelist Jim Bakker, disgraced by scandal, dies at 86","summary":"Jim Bakker, whose PTL Club television ministry became a multimillion-dollar empire before a fraud conviction and sex scandal, died Monday at 86, AP and Reuters report. The coverage recounts his public career and collapse; it is not a new legal proceeding.","sources":["Other"],"signal":"Consensus","links":[{"label":"AP — Jim Bakker dies at 86, Oct. 6","url":"https://apnews.com/article/jim-bakker-televangelist-ptl-club-dead-ef6d58ffa0b511edba773c219cee77e8"},{"label":"Reuters — Bakker obituary, Oct. 6","url":"https://www.reuters.com/world/us/us-televangelist-jim-bakker-ensnared-fraud-sex-scandal-dead-86-2026-10-06/"}]},{"id":"entertainment-digger-boxoffice-oct6","headline":"“Digger” opens below expectations as “Verity” leads weekend box office","summary":"Weekend estimates put “Verity” first with a $32.6 million opening, while Tom Cruise’s “Digger” fell short of expectations and could produce a large studio loss, according to trade coverage. The loss estimate is a projection, not a final audited result.","sources":["Other"],"signal":"Watch","links":[{"label":"Deadline — weekend box office estimates, Oct. 5","url":"https://deadline.com/2026/10/box-office-verity-digger-tom-cruise-weekend-estimates-1237146502/"},{"label":"The Guardian — projected Digger loss, Oct. 5","url":"https://www.theguardian.com/film/2026/oct/05/digger-may-lose-150m-after-tom-cruise-film-bombs-at-the-box-office"}]},{"id":"entertainment-hollywood-production-oct6","headline":"Hollywood unions warn U.S. film and TV production is nearing a breaking point","summary":"A report commissioned by entertainment unions says U.S.-based production has lost ground to overseas locations, with domestic TV spending’s share falling over time. The group frames the findings as a warning about an industry under pressure, not a prediction that production will stop.","sources":["Other"],"signal":"Watch","links":[{"label":"Deadline — union-backed production report, Oct. 5","url":"https://deadline.com/2026/10/hollywood-unions-report-us-film-tv-production-decline-1237147051/"}]},{"id":"entertainment-kylie-hulu-series-oct6","headline":"Kylie Jenner to headline Hulu thriller series “Bachelorette Weekend,” Deadline reports","summary":"Kylie Jenner is set to star in and executive-produce a thriller series at Hulu, with a straight-to-series order still being finalized, Deadline reports. The project is in development and should not be described as already filming or released.","sources":["Other"],"signal":"Watch","links":[{"label":"Deadline — Kylie Jenner Hulu project, Oct. 6","url":"https://deadline.com/2026/10/kylie-jenner-bachelorette-weekend-hulu-series-kim-kardashian-1237146797/"}]},{"id":"entertainment-casey-bloys-contract-oct6","headline":"HBO chief Casey Bloys renews contract as Paramount+ and HBO Max integrate","summary":"Casey Bloys has renewed his contract as he begins overseeing integration of HBO Max and Paramount+ teams, Deadline reports. The agreement concerns executive leadership; it does not yet establish the combined services’ final programming strategy.","sources":["Other"],"signal":"Watch","links":[{"label":"Deadline — Casey Bloys contract and integration, Oct. 6","url":"https://deadline.com/2026/10/casey-bloys-contract-reup-hbo-max-paramount-plus-teams-1237147522/"}]}]},"researchNotes":["Oct. 7, 2026 4 p.m. EDT refresh. Re-researched all eight sections; retained still-current items and elevated afternoon developments.","Closing markets: Reuters updated Oct. 7 report confirms cash close; CNN panel data delayed about 15 minutes and differs slightly. Tuesday close is separately represented in the market-card note.","Boston checked official NHL, NBA, NFL and MLB schedules; no Boston game on Oct. 7. Globe sports accessible in part; WEEI/Audacy team pages exposed schedules/section shells but not usable story text.","Outlet framing: Fox homepage foregrounded the Mall of America plot and Pike hearing; CNN included Cornell, diesel and Isaias; Drudge linked Texas midterms, Gulf storm and bond coverage and is an aggregator."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, or international soccer.',business:'7 unique business/markets stories; on trading days at 7 a.m. show timestamped indicative Dow and Nasdaq-100 futures, clearly not cash indexes; on weekends and market holidays state cash markets are closed and show no live/premarket snapshot, while identifying the latest completed session. At 10 a.m. and 1 p.m. on trading days show timestamped Dow and Nasdaq Composite cash-index levels, point and percentage moves, and any provider delay; at 4 p.m. show timestamped closing moves as confirmed or clearly preliminary; at 7 p.m. use confirmed closes.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
