"],"signal":"Watch","links":[{"url":"https://apnews.com/article/g20-rubio-russia-ukraine-iran-war-ed4ab8ad9fedd628c39ac05bc5092cac","label":"AP — updated Oct. 30, 6:08 p.m. EDT"}]},{"id":"top-california-e30","headline":"Appeals court rejects DOJ demand to set aside disputed California ballots","summary":"A federal appeals court Friday refused DOJ’s request to segregate ballots tied to a disputed list of potential noncitizens, AP reports. California says the list is unreliable and likely includes citizens. The denial leaves the requested restriction blocked; it does not establish that the listed voters cast illegal ballots.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/california-noncitizen-voting-trump-midterm-lawsuit-49cee0f4184b0ecb573f9f0274350642","label":"AP — updated Oct. 30, 6:33 p.m. EDT"}]},{"id":"top-ads-e30","headline":"Judge orders three taxpayer-funded administration ads taken down","summary":"Judge Jennifer Rochon ordered removal of three ads Friday after finding they appeared political or propagandistic, AP reports. One promoted Trump’s claim of $5,000 payments if Republicans retain Congress; the judge declined to remove several other ads. The ruling is limited to the specified advertising, not a judicial endorsement of the payment promise.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/trump-tv-ads-ruling-a6e45144033198d060fdc0e9d0a641b9","label":"AP — updated Oct. 30, 6:37 p.m. EDT"}]},{"id":"top-houston-e30","headline":"ICE officer indicted over Houston vehicle strike; agency and prosecutor dispute account","summary":"A Harris County grand jury indicted Mario Alberto Morales Friday for aggravated assault with a deadly weapon after his vehicle struck Miguel Parra Hernandez. AP reports prosecutors say video contradicts ICE’s account that the man ran in front of the SUV. The indictment is an accusation, not a conviction.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/houston-ice-charged-parra-hernandez-18d36105004d806c41618b800b70f59c","label":"AP — updated Oct. 30, 6:22 p.m. EDT"}]},{"id":"top-spain-e30","headline":"Spain crash investigation scrutinizes human error and rail-system failures","summary":"Spain’s transport minister blames a controller’s judgment for much of Wednesday’s collision, while unions raise broader staffing and system concerns. AP’s Friday investigation reports at least 69 deaths. The competing explanations remain under investigation; the minister’s account is not a completed independent causal finding.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/spain-train-crash-toledo-causes-unions-669ef8c0c12c8c9b720e721e7532ccbb","label":"AP — updated Oct. 30, 2:53 p.m. EDT"}]},{"id":"top-pentagon-e30","headline":"Reuters: Pentagon urged European allies to soften rhetoric about Russia","summary":"Four people familiar with the matter told Reuters Pentagon officials asked several NATO countries to moderate public warnings about Russia in recent weeks. Lithuania, Latvia and Estonia were among those receiving the messages, sources said. The reported private discussions do not constitute an announced NATO policy or independently proven change in Russia’s threat.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.yahoo.com/news/articles/exclusive-pentagon-tells-europeans-cool-050400616.html","label":"Reuters — Oct. 30; four-source attributed report"}]}],"usa":[{"id":"usa-pike-e30","headline":"Christa Pike describes lasting pain after surviving Tennessee execution attempt","summary":"In her first public statement, Pike says she remains in constant pain and struggles to speak after last month’s failed lethal injection. AP reports her lawyers seek commutation while the governor has not committed to it. Her account and her lawyers’ explanation of the injection are attributed; her death sentence has not been set aside.","sources":["Other","CNN"],"signal":"Watch","links":[{"url":"https://apnews.com/article/christa-pike-failed-execution-first-statement-292a1eb75ff5cee19da58f17c9eb224c","label":"AP — updated Oct. 30, 5:28 p.m. EDT"},{"url":"https://www.cnn.com/2026/10/30/us/christa-pike-case-first-statement","label":"CNN — Oct. 30 independent report"}]},{"id":"usa-birchmore-e30","headline":"Birchmore murder trial revisits police’s original suicide determination","summary":"Matthew Farwell is on federal trial accused of killing Sandra Birchmore and staging her death to conceal sexual abuse, AP reports Friday. Friends challenged the initial suicide conclusion, and the FBI later brought the case. The prosecution’s account remains an allegation being tested at trial, not a completed verdict.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/police-officer-massachusetts-killing-sandra-birchmore-76069b1c984c3add28879970bcdf1764","label":"AP — updated Oct. 30, 10:06 a.m. EDT"}]},{"id":"usa-freedom-e30","headline":"Freedom Riders complete interrupted journey to New Orleans after 65 years","summary":"Original riders and younger activists completed the Washington-to-New Orleans bus route and were honored Wednesday at Xavier University. AP’s Friday account recalls the 1961 firebombing that halted the original trip. The new journey connects living participants with subsequent generations rather than reenacting the original violence.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/freedom-riders-journey-new-orleans-cd034bd98e5b01cb3ff365cfa5667a7d","label":"AP — updated Oct. 30, 5:29 p.m. EDT"}]},{"id":"usa-elpaso-e30","headline":"El Paso newsroom sues for access to Walmart shooting investigation records","summary":"El Paso Matters filed a Thursday suit challenging broad secrecy over police and prosecution records from the 2019 mass shooting. Its report carried by AP describes a request for a judge to enforce the Texas Public Information Act. The petition has not itself opened the records or resolved the confidentiality dispute.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/el-paso-walmart-shooting-records-lawsuit-0b48d40f564297b700a5ef08ad3abfc5","label":"El Paso Matters via AP — updated Oct. 30, 2:31 p.m. EDT"}]},{"id":"usa-oberlin-e30","headline":"Suspect in Oberlin professor and wife’s deaths held on $3 million bond","summary":"The couple’s adult child faces murder and related charges after their bodies were found Wednesday, AP reports Friday. Prosecutors describe a confession, but no motive has been released and the case remains pending. Charges and prosecutors’ statements do not substitute for a verdict.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/oberlin-college-professor-wife-killed-child-charged-43f21c26b107e7630ba771bb9c38252b","label":"AP — updated Oct. 30, 4:03 p.m. EDT"}]},{"id":"usa-hikers-e30","headline":"Bodies of two Colorado students recovered after fatal mountain trip","summary":"Police say helicopters recovered the students Thursday after winds delayed retrieval from their weekend hiking trip. AP’s Thursday-night update distinguishes the recovery from the earlier deaths. Their aspirations as outdoorsmen do not establish exactly what caused the fatal incident.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/missing-college-students-hikers-dead-colorado-mountain-4977a595605815106e6a6b220b8dcc31","label":"AP — updated Oct. 29, 9:43 p.m. EDT"}]},{"id":"usa-medicaid-e30","headline":"Medicaid injunction protects sick recipients from added frailty test","summary":"Judge Richard Stearns blocked guidance requiring people in specified medical categories to prove an additional impairment in complying with work rules. AP’s Thursday report calls it a partial victory for 25 states and Washington, D.C. The injunction does not repeal all Medicaid work requirements; it remains a significant current eligibility ruling.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/trump-medicaid-chronically-ill-work-requirements-656719bd7c8358d9d5290cf54f81255b","label":"AP — updated Oct. 29, 4:27 p.m. EDT"}]},{"id":"usa-kingtides-e30","headline":"King-tide flooding threatens coastal communities into the weekend","summary":"Forecasters warn high tides could continue flooding streets and properties on both coasts into the weekend, AP reports. Its Wednesday account covers California, Florida and the Carolinas. The forecast is prospective and location-dependent, not a claim every coast is currently inundated.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/king-tides-florida-california-carolina-flooding-bd3d4258b785f428fdbdb961c4355a67","label":"AP — updated Oct. 28, 6:32 p.m. EDT; weekend risk"}]},{"id":"usa-foodfraud-e30","headline":"Minnesota food-fraud defendant receives 30-year prison sentence","summary":"Salim Said was sentenced Wednesday in the federal child-nutrition fraud scheme, AP’s Thursday update reports. Prosecutors attributed $44 million in fraud to him and recruited participants. His punishment is a completed sentencing outcome, not evidence that every person or organization discussed in the broader controversy committed a crime.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/fraud-minnesota-feeding-our-future-sentencing-a195ef82b798fa66d89cd4a6ba7e23aa","label":"AP — updated Oct. 29, 3:28 p.m. EDT"}]},{"id":"usa-chatbot-e30","headline":"New York’s child-chatbot restrictions widen state AI oversight","summary":"Hochul signed legislation Wednesday defining prohibited unsafe companion-chatbot features for users under 18, AP reports. The attorney general could seek penalties for violations. The law is significant ongoing regulation, not proof that every chatbot is unsafe; this account retains its actual Wednesday date and omits disputed effective-date precision.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/chatbots-ai-new-york-legislation-bans-children-03a4e090a7df1532838a5cb6f93a23ba","label":"AP — updated Oct. 28, 6 p.m. EDT"}]}],"boston":[{"id":"boston-score-e30","headline":"Friday Boston status: Bulls at Celtics upcoming; Bruins off after 4–1 loss","summary":"UPCOMING Friday, Oct. 30: Bulls at Celtics, 7:30 p.m. EDT. Bruins, Patriots and Red Sox are off today; Red Sox season is complete. FINAL Thursday, Oct. 29: Blues 4, Bruins 1; Celtics, Patriots and Red Sox did not play Thursday. UPCOMING Saturday, Oct. 31: Blackhawks at Bruins, 1 p.m. EDT. UPCOMING Sunday, Nov. 1: Patriots at Miami, 4:25 p.m. EST. FINAL Tuesday: Celtics 125, Nets 124 in overtime. Schedules checked Friday evening; no Boston game is in progress as of this pre-tip edition.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.espn.com/nba/game/_/gameId/401909278/bulls-celtics","label":"ESPN — Oct. 30 Celtics fixture; Friday evening check"},{"url":"https://www.nhl.com/bruins/schedule","label":"Bruins — official schedule checked Oct. 30"},{"url":"https://www.nhl.com/bruins/news/boston-bruins-st-louis-blues-game-recap-october-29-2026-x7683","label":"NHL — Thursday final"},{"url":"https://www.patriots.com/schedule/","label":"Patriots — official Sunday schedule"}]},{"id":"boston-brown-e30","headline":"Brown and Henderson questionable for Miami after missing final two practices","summary":"Friday’s official analysis lists A.J. Brown (ankle/knee), TreVeyon Henderson (illness), Carlton Davis III (neck) and Christian Elliss (chest) as questionable. The Globe independently confirms the designations. No active-roster player was ruled out in that report; questionable is not confirmed availability, and Saturday changes remain possible.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.patriots.com/news/injury-report-analysis-wr-a-j-brown-rb-treveyon-henderson-questionable-for-week-8-matchup-vs-the-dolphins","label":"Patriots — Oct. 30, 3:50 p.m. official analysis"},{"url":"https://www.bostonglobe.com/2026/10/30/sports/patriots-injuries-aj-brown/","label":"Boston Globe — Oct. 30; partly paywalled"},{"url":"https://www.audacy.com/weei/sports","label":"WEEI/Audacy — checked Oct. 30 evening; limited fresh full text"}]},{"id":"boston-hagens-e30","headline":"Hagens’ five-on-five production offers Bruins a bright spot in road defeat","summary":"Boston.com’s Friday feature says James Hagens has five goals and 10 points through 14 games, including Boston’s lone goal Thursday. His nine five-on-five points match Pastrnak’s team-leading total despite less ice time. Strong early production is meaningful evidence of adaptation, not a guarantee that his scoring rate will persist.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.boston.com/sports/boston-bruins/2026/10/30/boston-bruins-james-hagens-nhl-hockey-david-pastrnak/","label":"Boston.com — Oct. 30 feature"},{"url":"https://www.nhl.com/bruins/news/boston-bruins-st-louis-blues-game-recap-october-29-2026-x7683","label":"NHL — Oct. 29 official final"}]},{"id":"boston-durbin-oct30","headline":"Durbin’s foot repair adds second operation to Red Sox offseason","summary":"Boston announced a partial excision of the fifth metatarsal base with tendon repair after Durbin’s earlier pinkie operation. MLB’s Thursday report says the foot injury predated the procedure and Boston expects a healthy start to 2027. An expected recovery is not completed rehabilitation.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.mlb.com/news/caleb-durbin-surgery-right-foot-fracture","label":"MLB — Oct. 29; rechecked Oct. 30"}]},{"id":"boston-eaton-eve29","headline":"Eaton and Cheng deals begin Boston’s 40-man roster squeeze","summary":"The Red Sox traded Nate Eaton to the Athletics for pitching prospect Jareth Rayo and sent Tsung-Che Cheng to Detroit Thursday, the Globe reports. Eaton was out of minor-league options for 2027. Those are completed transactions; additional roster moves remain possible as injured players must be restored, not already done.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.bostonglobe.com/2026/10/29/sports/nate-eaton-red-sox-athletics/","label":"Boston Globe — Oct. 29; rechecked Oct. 30"}]},{"id":"boston-celtics-e30","headline":"Celtics approach Cup opener seeking third home win in five days","summary":"Chicago returns Friday after losing 134–99 Monday, while Boston most recently beat Brooklyn in overtime. The Globe’s Friday preview places tonight’s game in NBA Cup group play and describes a different court appearance. The prior rout supplies context, not a prediction that the rematch will follow the same script.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.bostonglobe.com/2026/10/30/sports/celtics-bulls-preview-october-30/","label":"Boston Globe — Oct. 30 preview; partly paywalled"},{"url":"https://www.espn.com/nba/game/_/gameId/401909278/bulls-celtics","label":"ESPN — Oct. 30 fixture and availability"}]},{"id":"boston-tatum-e30","headline":"Tatum’s first post-injury game-winner marks another workload milestone","summary":"The Globe’s Wednesday analysis highlights Tatum playing consecutive nights and scoring 40, including Tuesday’s overtime winner against Brooklyn. It links the performance to his Achilles rehabilitation. The demonstrated workload and shot are established; declaring all future injury concerns gone would exceed the evidence.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.bostonglobe.com/2026/10/28/sports/celtics-jayson-tatum-game-winning-shot/?p1=SectionFront_Feed_AuthorQuery","label":"Boston Globe — Oct. 28 analysis; rechecked Oct. 30"}]},{"id":"boston-rouse-oct30","headline":"Rouse’s medical ambitions illuminate an unusual route to Patriots line","summary":"The Globe’s Friday profile traces Walter Rouse’s childhood interest in pediatric heart surgery, engineering and suturing practice before his f e30","headline":"Ramaswamy ad featuring Acton’s estranged mother comes off air","summary":"AP’s Thursday-night report says the Ohio Republican spent about a quarter of the initially announced amount before the ad stopped running. The report describes criticism of its use of Acton’s family history. The withdrawal is a campaign advertising change, not a court finding about the candidates’ claims.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/ohio-ramaswamy-ad-acton-mother-365745259579371f41122b184254fdde","label":"AP — updated Oct. 29, 10:46 p.m. EDT"}]},{"id":"politics-voting-facts-eve29","headline":"AP debunks ballot-envelope and poll-worker marking claims","summary":"AP’s Thursday fact check explains that Ventura County envelope holes serve accessibility and processing purposes rather than revealing votes to rig the election. It also addresses other viral voting-process claims. The explanations rebut the specific examples examined; a social-media allegation alone is not proof of invalid ballots.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/fact-check-midterms-election-voting-ballot-5933df3747ceaf6091324959d8b9c59b","label":"AP — updated Oct. 29, 1:38 p.m. EDT"}]}],"entertainment":[{"id":"ent-qualley-e30","headline":"Margaret Qualley and Jack Antonoff file for divorce","summary":"Court records show an uncontested matrimonial action filed Friday in Brooklyn after three years of marriage, AP reports. Qualley is the plaintiff and Antonoff the defendant. Filing is not a final divorce judgment, and the records do not establish a public explanation for the separation.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/antonoff-qualley-divorce-a853342b11bf53867e103680d7b861ba","label":"AP — updated Oct. 30, 6:44 p.m. EDT"}]},{"id":"ent-ross-e30","headline":"Prosecutors drop Rick Ross felony count; misdemeanor case continues","summary":"Miami-Dade prosecutors dropped battery by strangulation for insufficient evidence, AP reports Friday. Ross still faces a misdemeanor domestic-battery charge and has pleaded not guilty. Dismissal of one count does not mean the entire case ended or that the remaining allegation has been proven.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/rick-ross-arrest-miami-beach-florida-9c5bb3af32cd3381dd95bb64e8e31ebf","label":"AP — updated Oct. 30, 12:45 p.m. EDT"}]},{"id":"ent-kirk-e30","headline":"Kirk Franklin embraces a less apologetic turn on new album","summary":"In AP’s Friday interview, the gospel star discusses “I Am What I Am,” collaborations and criticism of his work with artists outside gospel. The 14th studio album frames his current artistic outlook. His reflections are the artist’s perspective, not a universal assessment of the record’s reception.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/kirk-franklin-interview-fa06a5ef09722713549309789ee34eb7","label":"AP — updated Oct. 30, 6:52 p.m. EDT"}]},{"id":"ent-yankee-e30","headline":"Daddy Yankee’s “La Postal” turns reggaeton toward a concept album about love","summary":"AP’s Friday review describes 15 tracks built around romantic, familial and spiritual love. The release marks another move after his retirement announcement and subsequent faith-centered work. The evaluation is criticism, not evidence of commercial performance or a return to every aspect of his old touring career.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/daddy-yankee-la-postal-music-review-a872077854a18726532a5840b2dc097b","label":"AP — updated Oct. 30, 11:07 a.m. EDT; music review"}]},{"id":"ent-stewart-e30","headline":"Stewart appreciation traces the stage career behind his screen fame","summary":"AP’s Friday appreciation revisits Patrick Stewart’s Shakespearean work and repeated returns to theater after “Star Trek” and “X-Men.” The perspective adds substantive career context following his death rather than recycling an unverified medical explanation. It is a critical remembrance, not a new cause-of-death report.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/patrick-stewart-shakespeare-theater-appreciation-9fe4ffe6024a270aad3a456ae26a11b7","label":"AP — updated Oct. 30, 11:38 a.m. EDT"}]},{"id":"ent-addams-e30","headline":"Westfield turns Charles Addams’ hometown into Halloween destination","summary":"AP’s Thursday feature describes AddamsFest, transformed storefronts and the New Jersey landmarks that inspired the cartoonist’s macabre style. The seasonal celebration has immediate Halloween relevance. It is a local cultural event, not an announcement of a new film or television production.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/addams-family-author-hometown-new-jersey-halloween-3af3a0164d3a20996e2beeb0effdee83","label":"AP — updated Oct. 29, 10:26 a.m. EDT"}]},{"id":"entertainment-gentle-oct28eve","headline":"“Gentle Monster” review examines denial inside a family drama","summary":"AP critic Lindsey Bahr’s Wednesday review highlights Léa Seydoux’s restrained performance in Marie Kreutzer’s film about a family confronted by a criminal investigation. The review questions the excuses people make for loved ones. These are assessments of fiction, not allegations about the actors or filmmakers.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/gentle-monster-movie-review-918881df1a322ae09fc019c9fd0a57a5","label":"AP — updated Oct. 28, 11:52 a.m. EDT; film review"}]}]},"researchNotes":["Friday Oct. 30 evening full refresh: all eight tabs researched and reranked. Schedule unchanged.","Fox/CNN/Drudge homepages freshly checked. Fox article text limited; framing reflects checked homepage, not an unsupported claim of common editorial consensus. Drudge is an aggregator.","Friday completed 4 p.m. EDT cash close cross-checked using AP updated 4:50 p.m. and CNBC closing report: Dow 51,770.31 −572.25 (−1.09%); Nasdaq Composite 25,437.00 −747.73 (−2.86%). No intraday or after-hours quote substituted.","AP and Reuters independently report Binance reserves and asset freeze; these figures are the company’s statements. North Korean attribution remains blockchain firms’ assessment. AP/CNBC confirm Alaska inquiry; investigation, requested ballot restrictions and guilt are distinct.","Boston official NHL recap/schedule, ESPN Friday fixture, Patriots schedule and Friday injury analysis checked. Globe and WEEI/Audacy checked; paywall overlays and limited fresh full text disclosed. Official injury analysis is Oct. 30; similarly named older 2023 injury page was not used.","Celtics upcoming Friday 7:30 p.m. EDT; other three teams off. Bruins lost 4–1 Thursday, host Blackhawks Saturday 1 p.m. EDT; Patriots at Miami Sunday 4:25 p.m. EST, independently consistent in current official analysis. Red Sox season complete.","AP topic hubs expose many stale promoted articles; actual article dates checked. Old space/arts and September court articles omitted. Selected Oct. 28/29 eligibility, injury, service, film and policy accounts retain actual dates for continuing relevance.","Reuters private NATO messaging and Ethiopia rescue toll remain attributed. Swiss trade source still describes signing as prospective; no completed signing inferred. No General Sports exclusions selected, including zero WNBA coverage."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, international soccer, or WNBA coverage.',business:'7 unique business/markets stories refreshed only at 7 p.m. Eastern Monday through Friday, with independently confirmed figures for the latest completed U.S. cash session. Preserved unchanged at all other editions.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
</body></html>
