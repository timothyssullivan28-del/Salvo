us/tennessee-due-execute-woman-first-time-two-centuries-2026-09-30/"},{"label":"Tennessee Court of Appeals — docket search","url":"https://www.tncourts.gov/courts/court-criminal-appeals"}],"signal":"Watch","sources":["Other"]},{"id":"usa-mass-priests-probe-sept30","headline":"Sept. 30: Massachusetts probe finds more than 270 priests abused nearly 1,000 children","summary":"A Massachusetts attorney general’s investigation found that more than 270 Catholic clerics abused nearly 1,000 children across the Fall River, Springfield and Worcester dioceses over decades. The report says dioceses knew of abuse; most incidents occurred before 2002, and the attorney general cited expired limitations periods in explaining why most conduct was not prosecuted.","links":[{"label":"Reuters — Sept. 30 investigation","url":"https://www.reuters.com/world/more-than-270-priests-massachusetts-abused-children-over-decades-probe-finds-2026-09-30/"},{"label":"Massachusetts Attorney General — report and materials","url":"https://www.mass.gov/orgs/office-of-the-attorney-general"}],"signal":"Watch","sources":["Other"]},{"id":"usa-pennsylvania-measles-fifth-death-sept30","headline":"Sept. 30: Pennsylvania reports fifth measles-associated death as outbreak grows","summary":"Pennsylvania officials reported a fifth measles-associated death this year after an unvaccinated Lancaster County resident died; the state has logged 943 cases across 39 counties. The CDC counted two measles-related deaths nationwide through Tuesday under a different mortality method, so the state and national figures are not directly comparable.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — state count and CDC methodology, Sept. 30","url":"https://www.reuters.com/business/healthcare-pharmaceuticals/pennsylvania-reports-fifth-measles-linked-death-cases-rise-2026-09-30/"}]},{"id":"usa-doj-minnesota-judges-complaint-sept30","headline":"Sept. 30: DOJ files misconduct complaint against Minnesota judges over immigration interviews","summary":"The Justice Department filed a judicial-misconduct complaint against Minnesota judges who told the New York Times the administration was disregarding court orders during an immigration surge. DOJ alleged the interviews were unethical and partisan; that is the department’s claim, not a finding by the judicial conduct process.","links":[{"label":"Reuters — Sept. 30","url":"https://www.reuters.com/business/media-telecom/us-justice-department-files-complaint-against-minnesota-judges-who-gave-2026-09-30/"}],"signal":"Split","sources":["Other"]},{"id":"usa-ice-austin-assault-charge-sept30","headline":"Sept. 30: Federal prosecutors charge man shot by ICE agent in Austin with assault","summary":"Federal prosecutors charged Wilber Rafael Garcesperez, a Venezuelan man shot by an ICE agent in Austin, with assaulting an officer, AP reported. The criminal charge is an allegation; it is not a conviction or a final account of the shooting.","links":[{"label":"AP — Sept. 30","url":"https://apnews.com/article/ice-shooting-austin-texas-wilber-rafael-garcesperez-e3ca63b090ee1b33ee154eecb99e3311"}],"signal":"Watch","sources":["Other"]},{"id":"usa-wisconsin-mosque-president-deportation-sept30","headline":"Sept. 30: Court says U.S. may deport Wisconsin mosque president on foreign-policy grounds","summary":"The court ruled that the government may pursue deportation of the president of a Wisconsin mosque on foreign-policy grounds, AP reported. The decision permits removal proceedings; it does not mean the individual has already been deported.","links":[{"label":"AP — Sept. 30","url":"https://apnews.com/article/immigration-mosque-president-sarsour-deportation-ef9a50be073b571b4d8abbf49696f349"}],"signal":"Watch","sources":["Other"]},{"id":"usa-big-bend-border-project-sept30","headline":"Sept. 30: Government may scale back border-wall project in Texas’ Big Bend","summary":"The federal government may reduce the planned border project in Big Bend National Park, A inflation rose less than forecast as consumer spending remained firm","summary":"The August PCE report showed price growth below expectations, while consumer spending was robust; Reuters said that could ease pressure on the Federal Reserve to raise rates in October. CNN’s economic calendar lists core PCE inflation at 0.2% month over month and 3.3% year over year; the trend does not eliminate inflation risks.","links":[{"label":"Reuters — PCE and spending, Sept. 30","url":"https://www.reuters.com/markets/us/us-inflation-rises-less-than-expected-august-consumer-spending-surges-2026-09-30/"},{"label":"U.S. Bureau of Economic Analysis — PCE release","url":"https://www.bea.gov/data/income-saving/personal-income"},{"label":"CNN — economic calendar, updated Sept. 30","url":"https://www.cnn.com/markets"}],"signal":"Consensus","sources":["Other"]},{"id":"business-micron-forecast-sept30","headline":"Sept. 30: Micron forecasts quarterly revenue above estimates on AI-memory demand","summary":"Micron forecast fiscal first-quarter revenue of $61.5 billion, plus or minus $1.5 billion, above analysts’ $57.02 billion average estimate, Reuters reported after the market close. The outlook signals continued demand for high-bandwidth memory used in AI data centers; it is a forecast, not a completed quarter.","links":[{"label":"Reuters — forecast, Sept. 30 at 4:06 p.m. EDT","url":"https://www.reuters.com/business/micron-forecasts-quarterly-revenue-above-estimates-2026-09-30/"}],"signal":"Consensus","sources":["Other"]},{"id":"business-google-gemini4-sept30","headline":"Sept. 30: Google announces Gemini 4 model as it targets OpenAI and Anthropic","summary":"Google announced the Gemini 4 generation and described its Argon model as its most capable yet, Reuters reported at 4:04 p.m. EDT. The company said it is providing the model to selected cybersecurity partners but did not give a public release date.","links":[{"label":"Reuters — Gemini 4 announcement, Sept. 30 at 4:04 p.m. EDT","url":"https://www.reuters.com/legal/litigation/google-announces-gemini-4-flagship-ai-model-after-months-delays-2026-09-30/"}],"signal":"Watch","sources":["Other"]},{"id":"business-synopsys-openai-deal-sept30","headline":"Sept. 30: Synopsys and OpenAI plan revenue-sharing AI model for chip design","summary":"Synopsys and OpenAI agreed to develop GPT-Synopsys, a model tuned for chip-design work, with revenue sharing when customers use the product. Synopsys also raised its fiscal 2027 growth outlook above analyst estimates; Reuters reported shares rose as much as 7% after the announcement.","links":[{"label":"Reuters — partnership and forecast, Sept. 30","url":"https://www.reuters.com/business/synopsys-openai-strike-deal-develop-ai-model-chip-design-work-2026-09-30/"}],"signal":"Watch","sources":["Other"]},{"id":"business-hpe-vultr-ai-order-sept30","headline":"Sept. 30: HPE raises networking outlook and announces $1.2 billion Vultr AI order","summary":"Hewlett Packard Enterprise raised long-term networking-growth guidance and said it will supply $1.2 billion in AMD AI server racks to cloud company Vultr, Reuters reported. The forecast increase and order are company announcements; they do not establish the pace of future AI demand.","links":[{"label":"Reuters — HPE guidance and order, Sept. 30","url":"https://www.reuters.com/business/hpe-boosts-networking-growth-outlook-gets-12-billion-ai-order-cloud-firm-vultr-2026-09-30/"}],"signal":"Watch","sources":["Other"]},{"id":"business-anthropic-ipo-risk-disclosures-sept30","headline":"Sept. 30: Anthropic’s planned IPO filing stresses AI risks alongside its growth case","summary":"Reuters’ review of Anthropic’s draft IPO prospectus says nearly a third of the document addresses risks, including potential model misalignment and misuse. The filing reports losses exceeding $50 billion over two years and more than $500 billion in future spending commitments; the IPO and forecasts remain prospective.","links":[{"label":"Reuters — draft IPO filing and risk factors, Sept. 30 at 3:52 p.m. EDT","url":"https://www.reuters.com/business/anthropics-ipo-pitch-embraces-ais-promise-peril-2026-09-30/"}],"signal":"Watch","sources":["Other"]}],"world":[{"id":"world-homs-bus-shooting-sept30","headline":"Sept. 30: Gunmen attack bus in Syria’s Homs, killing at least seven, source says","summary":"A source at Homs’ health directorate told Syria’s state news agency SANA that gunmen targeted a bus on Misyaf Bridge, killing at least seven and wounding four. Reuters reported the casualties were taken to hospitals; its report did not identify a perpetrator or motive.","links":[{"label":"Reuters — Homs attack, Sept. 30 at 4:08 p.m. EDT","url":"https://www.reuters.com/world/seven-people-killed-four-injured-after-bus-attacked-by-gunfire-syrias-homs-2026-09-30/"}],"signal":"Watch","sources":["Other"]},{"id":"world-uk-china-academic-spying-warning-sept30","headline":"Sept. 30: UK security agency warns China used academics to access sensitive research","summary":"Britain’s MI5 issued an alert alleging a Chinese organization funded academic research in areas including AI on behalf of Beijing’s state security service. This is a UK intelligence assessment, not an independently adjudicated finding.","links":[{"label":"Reuters — Sept. 30","url":"https://www.reuters.com/world/uk/uk-accuses-china-using-academics-spy-ai-other-tech-research-2026-09-30/"}],"signal":"Split","sources":["Other"]},{"id":"world-france-uk-migrant-deal-talks-sept30","headline":"Sept. 30: France and Britain discuss ending “one in, one out” migrant deal","summary":"Reuters reported France and Britain are in talks to end their migrant-return arrangement. The discussions are not a concluded agreement, and both governments have yet to announce a replacement.","links":[{"label":"Reuters — Sept. 30","url":"https://www.reuters.com/world/france-britain-talks-end-one-one-out-migrant-deal-2026-09-30/"}],"signal":"Watch","sources":["Other"]},{"id":"world-paris-migrant-disaster-verdict-sept30","headline":"Sept. 30: Paris court convicts six men of manslaughter over deadly Channel migrant disaster","summary":"A Paris court found six men guilty of manslaughter over the 2021 Channel disaster in which more than 30 migrants drowned, Reuters reported. The verdict concerns the defendants’ roles in that specific incident.","links":[{"label":"Reuters — Sept. 30 verdict","url":"https://www.reuters.com/world/europe/paris-court-convicts-six-men-manslaughter-over-migrants-disaster-channel-2026-09-30/"}],"signal":"Consensus","sources":["Other"]},{"id":"world-sudan-partition-risk-sept30","headline":"Sept. 30: Sudan adviser warns U.S. ceasefire plan could entrench partition","summary":"A Sudanese adviser said a U.S. ceasefire proposal could leave the country divided along lines resembling Libya’s, Reuters reported. That is an attributed warning about a potential outcome, not an agreed partition.","links":[{"label":"Reuters — Sept. 30","url":"https://www.reuters.com/world/africa/us-ceasefire-plan-sudan-could-lead-libya-style-partition-adviser-says-2026-09-30/"}],"signal":"Watch","sources":["Other"]},{"id":"world-tunisia-cybercrime-penalties-sept30","headline":"Sept. 30: Tunisia eases cybercrime penalties after rights groups’ criticism","summary":"President Kais Saied eased penalties under Tunisia’s cybercrime law after rights groups criticized its use against journalists and critics, Reuters reported. The change modifies penalties; broader concerns over speech restrictions remain.","links":[{"label":"Reuters — Sept. 30","url":"https://www.reuters.com/business/media-telecom/tunisian-president-eases-cybercrime-penalties-after-rights-groups-criticism-2026-09-30/"}],"signal":"Watch","sources":["Other"]},{"id":"world-zelensky-front-command-sept30","headline":"Sept. 30: Zelenskyy says he visited a military command post near Ukraine’s eastern front","summary":"President Volodymyr Zelenskyy said he visited a Ukrainian command post near the eastern front, Reuters reported. The visit was announced by Ukraine; it does not independently establish changes to the battlefield.","links":[{"label":"Reuters — Sept. 30","url":"https://www.reuters.com/world/zelenskiy-says-he-visits-military-command-post-near-ukraines-eastern-frontline-2026-09-30/"}],"signal":"Watch","sources":["Other"]},{"id":"world-norway-epstein-hearings-sept30","headline":"Sept. 30: Norway’s parliament opens hearings on political and diplomatic links to Epstein","summary":"Norwegian lawmakers began public hearings on relationships between the late Jeffrey Epstein and Norwegian politicians and diplomats, Reuters reported. The hearings scrutinize contacts; they do not by themselves establish criminal wrongdoing.","links":[{"label":"Reuters — Sept. 30","url":"https://www.reuters.com/world/norway-parliament-probes-epstein-links-politicians-diplomats-2026-09-30/"}],"signal":"Watch","sources":["Other"]},{"id":"world-spain-france-uk-eu-china-trade-sept30","headline":"Sept. 30: Spain and France voice support for UK ties with EU and tougher China trade defenses","summary":"Spain’s prime minister and France’s president expressed support for Britain returning to the EU and agreed Europe should strengthen trade defenses against China, Reuters reported. The remarks express political positions, not a formal UK re-entry process or new trade pact.","links":[{"label":"Reuters — Sept. 30","url":"https://www.reuters.com/world/china/spain-france-align-welcoming-uk-back-eu-strengthening-china-trade-defences-2026-09-30/"}],"signal":"Watch","sources":["Other"]},{"id":"world-russia-bear-attacks-sept30","headline":"Sept. 30: Russia draws up measures to control bears after attacks kill at least 22","summary":"Russian authorities said they are preparing urgent measures to control brown-bear populations after at least 22 people were killed in attacks, Reuters reported. The toll and planned response are attributed to officials.","links":[{"label":"Reuters — Sept. 30","url":"https://www.reuters.com/business/environment/russia-draws-up-measures-control-bear-population-after-spate-deadly-attacks-2026-09-30/"}],"signal":"Watch","sources":["Other"]}],"sports":[{"id":"sports-phillies-braves-game2-live","headline":"LIVE Wednesday, Sept. 30: Braves lead Phillies 2–1 in bottom of the seventh, one out (in progress)","summary":"ESPN’s Gamecast showed Atlanta leading Philadelphia 2–1 in the bottom of the seventh with one out at the 4:21 p.m. EDT check; play is in progress, not final. Atlanta leads the best-of-three series 1–0.","links":[{"label":"ESPN — Gamecast live score, checked 4:21 p.m. EDT","url":"https://www.espn.com/mlb/game/_/gameId/401907972/phillies-braves"},{"label":"MLB — official Wild Card schedule/live status","url":"https://www.mlb.com/news/2026-wild-card-series-game-times"}],"signal":"Watch","sources":["Other"]},{"id":"sports-mlb-braves-phillies-game1","headline":"FINAL Tuesday, Sept. 29: Braves beat Phillies 5–3 in Wild Card Game 1","summary":"Atlanta beat Philadelphia 5–3 in Tuesday’s Wild Card opener and leads the best-of-three series 1–0. Game 2 is scheduled for Wednesday at 2 p.m. EDT.","sources":["Other"],"signal":"Consensus","links":[{"label":"AP/Yahoo — Game 1 results and recap","url":"https://sports.yahoo.com/mlb/live/mlb-wild-card-live-updates-box-score-results-playoff-bracket-rosters-lineups-starting-pitchers-game-1-155145478.html"},{"label":"MLB — official Game 2 schedule","url":"https://www.mlb.com/news/2026-wild-card-series-game-times"}]},{"id":"sports-white-sox-astros-game2-upcoming","headline":"UPCOMING Wednesday, Sept. 30: White Sox at Astros, Wild Card Game 2 at 5 p.m. EDT","summary":"As of the 4:21 p.m. EDT status check, Chicago’s Game 2 at Houston is scheduled for 5 p.m. EDT; the White Sox lead the series 1–0. It has not started, so no live score is reported.","links":[{"label":"MLB — official postseason schedule","url":"https://www.mlb.com/news/2026-wild-card-series-game-times"},{"label":"ESPN — game scoreboard","url":"https:// nal-votes-before-the-midterms"}],"signal":"Watch","sources":["Other"]},{"id":"politics-stock-trading-bill-blocked-sept30","headline":"Sept. 30: Senate fails to advance bill limiting stock trades by members of Congress","summary":"The Senate failed to advance a proposal to restrict members of Congress from buying individual stocks, Reuters reported. The bill did not reach a final vote, and current disclosure rules remain in place.","links":[{"label":"Reuters — Sept. 30","url":"https://www.reuters.com/world/bill-limit-stock-trading-us-congress-set-be-blocked-senate-2026-09-30/"}],"signal":"Watch","sources":["Other"]},{"id":"politics-senate-west-bank-report-sept30","headline":"Sept. 30: Senate Republicans block request for report on alleged West Bank rights violations","summary":"Republicans blocked a measure that would have required the Trump administration to report to Congress on escalating West Bank violence, including deaths of U.S. citizens, Reuters reported. The vote concerned a reporting requirement; it did not resolve the underlying allegations.","links":[{"label":"Reuters — Sept. 30","url":"https://www.reuters.com/legal/government/us-senate-blocks-measure-demanding-report-rights-violations-west-bank-2026-09-30/"}],"signal":"Watch","sources":["Other"]},{"id":"politics-trump-economic-record-explaining-sept30","headline":"Sept. 30: Trump says he has done a “very bad job” explaining his economic record","summary":"President Donald Trump said he had done a “very bad job” of explaining his economic record as gasoline costs and approval ratings weigh on midterm politics, Reuters reported at 4:07 p.m. EDT. The remark concerns his political messaging, not a new economic policy or independent measurement of voter views.","links":[{"label":"Reuters — Trump remarks, Sept. 30 at 4:07 p.m. EDT","url":"https://www.reuters.com/legal/government/trump-says-he-has-done-bad-job-explaining-his-economic-record-2026-09-30/"}],"signal":"Watch","sources":["Other"]},{"id":"politics-paxton-private-trump-remarks-sept30","headline":"Sept. 30: Ken Paxton privately said Trump’s convention hurt Republicans, NYT reports","summary":"Texas U.S. Senate candidate Ken Paxton told donors that President Trump’s midterm convention had hurt him and other Republicans, according to a New York Times report citing an audio recording and reported by Reuters. These were reported private remarks, not a public campaign statement.","links":[{"label":"Reuters — Sept. 30, citing NYT recording","url":"https://www.reuters.com/world/us/texas-us-senate-candidate-paxton-said-trump-hurt-republicans-new-york-times-says-2026-09-30/"}],"signal":"Watch","sources":["Other"]},{"id":"politics-korea-investment-announcement-sept30","headline":"Sept. 30: Trump set to announce $200 billion in South Korean U.S. investments, White House says","summary":"A White House official said President Donald Trump would announce plans for South Korea to invest $200 billion in U.S. projects, including $54 billion for the Alaska LNG project, Reuters reported. The promised investment package is a plan, not completed capital spending.","links":[{"label":"Reuters — Sept. 30 White House confirmation","url":"https://www.reuters.com/legal/government/trump-expected-announce-54-billion-south-korea-investment-alaska-lng-sources-say-2026-09-30/"},{"label":"Reuters — project background","url":"https://www.reuters.com/business/energy/what-is-alaska-lng-why-does-project-face-doubts-2026-09-30/"}],"signal":"Watch","sources":["Other"]},{"id":"politics-big-oil-supreme-court-climate-sept30","headline":"Sept. 30: Oil companies ask Supreme Court to intervene in climate lawsuits","summary":"Facing climate-related lawsuits from states and local governments, major oil companies again turned to the U.S. Supreme Court, Reuters reported. The companies are seeking judicial intervention; the Court has not issued a final ruling on the underlying suits.","links":[{"label":"Reuters — Sept. 30","url":"https://www.reuters.com/legal/government/facing-climate-lawsuits-big-oil-again-turns-us-supreme-court-2026-09-30/"}],"signal":"Watch","sources":["Other"]}],"entertainment":[{"id":"entertainment-paramount-warner-close-clearance-sept30","headline":"Sept. 30: Judge clears Paramount to close $110 billion Warner Bros. acquisition","summary":"A federal judge approved a settlement between Paramount and a California-led group of states, allowing the $110 billion acquisition to close, Reuters reported. The five-year settlement includes theatrical-release quotas and separate negotiations for cable channels; clearance does not by itself resolve later integration challenges.","links":[{"label":"Reuters — judge approves settlement, Sept. 30 at 3:36 p.m. EDT","url":"https://www.reuters.com/world/us-judge-allows-paramount-close-warner-bros-acquisition-2026-09-30/"}],"signal":"Watch","sources":["Other"]},{"id":"entertainment-jennifer-lawrence-the-flood","headline":"Sept. 30: Jennifer Lawrence to star in Zach Cregger’s sci-fi thriller “The Flood”","summary":"Jennifer Lawrence will lead Zach Cregger’s original sci-fi thriller for Warner Bros. and New Line; Cregger is set to write, direct and produce, Variety reported. The film is scheduled for release Aug. 11, 2028, with plot details and further casting under wraps.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — Sept. 30","url":"https://variety.com/2026/film/news/jennifer-lawrence-zach-creggers-the-flood-1236878570/"}]},{"id":"entertainment-digger-reviews","headline":"Sept. 30: Tom Cruise’s “Digger” draws sharply divided early reviews","summary":"Critics gave sharply different assessments of Alejandro G. Iñárritu’s “Digger,” starring Tom Cruise, The Hollywood Reporter reported. These are critical reactions, not a settled box-office or awards outcome.","sources":["Other"],"signal":"Split","links":[{"label":"The Hollywood Reporter — Sept. 30","url":"https://www.hollywoodreporter.com/movies/movie-news/digger-tom-cruise-academy-museum-alejandro-g-inarritu-1236716822/"}]},{"id":"entertainment-true-brit-administration","headline":"Sept. 30: UK film distributor True Brit Entertainment files for administration","summary":"Independent UK distributor True Brit Entertainment filed for administration, Variety reported, amid financial pressure in the film-distribution business. The filing begins a formal insolvency process; it is not a completed liquidation.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — Sept. 30","url":"https://variety.com/2026/film/global/true-brit-entertainment-files-for-administration-1236878460/"}]},{"id":"entertainment-endgame-boxoffice-sept30","headline":"Sept. 30: “Avengers: Endgame” returns to box-office top spot in re-release","summary":"The “Avengers: Endgame” re-release reclaimed the weekend box-office lead, AP reported, as the film returned to theaters. The ranking reflects the reported frame and does not change the film’s original release history.","sources":["Other"],"signal":"Consensus","links":[{"label":"AP — Sept. 30","url":"https://apnews.com/article/box-office-avengers-endgame-resident-evil-primetime-5fedc5f84142d1a36fe28ae22f738c47"}]},{"id":"entertainment-ted-lasso-anthony-head-tribute","headline":"Sept. 30: “Ted Lasso” episode pays tribute to actor Anthony Head","summary":"A “Ted Lasso” episode pays tribute to Anthony Head, Deadline reported. The story describes a screen tribute and should not be read as a report that Head has died.","sources":["Other"],"signal":"Watch","links":[{"label":"Deadline via Yahoo — Sept. 30","url":"https://www.yahoo.com/entertainment/tv/articles/ted-lasso-pays-tribute-anthony-070000736.html"}]},{"id":"entertainment-swift-attacker-privacy-ruling","headline":"Sept. 30: Man accused in Taylor Swift concert plot loses privacy case against Disney","summary":"A man accused of planning an attack at a Taylor Swift concert lost a privacy case against Disney, Reuters reported. The ruling concerns his privacy claim; the headline’s “accused” status does not itself establish guilt in the alleged plot.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — Sept. 30","url":"https://www.reuters.com/world/would-be-taylor-swift-concert-attacker-loses-privacy-case-against-disney-2026-09-30/"}]}]},"researchNotes":["Re-researched and re-ranked all eight tabs for the Wednesday, Sept. 30 afternoon refresh (September 30, 2026, 4:21:41 p.m. EDT Boston); prioritized substantive same-day updates after the prior 1 p.m. edition and did not carry yesterday’s AI accord forward.","Compared fresh Fox News, CNN and Drudge Report homepage framing. Fox emphasizes security-oriented language, CNN foregrounds reported passenger/cockpit accounts and investigative developments, and Drudge aggregates linked stories rather than reporting independently.","Market close values are the completed Sept. 30 session, not intraday quotes: Dow 50,906.05 (−443.87; −0.86%) and Nasdaq Composite 26,861.06 (+63.52; +0.24%), checked against a 4:12 p.m. WSJ quote and Yahoo/Nasdaq historical close tables. Reuters’ earlier preliminary figures were slightly different and are labeled preliminary in the Business card.","Checked MLB Gamecast/scoreboard and team schedules at 4:21 p.m. EDT: Phillies–Braves was live with Atlanta leading 2–1 in the bottom of the seventh, one out; White Sox–Astros, Red Sox–Yankees and Cubs–Padres were upcoming. The Red Sox scheduled first pitch is 8 p.m.; no Patriots, Bruins or Celtics game was listed for Wednesday.","The 65 stories remain globally unique, and the General Sports tab excludes Boston teams, auto racing and international soccer. Casualty counts, official allegations, forecasts, charges and unresolved proceedings are attributed or labeled."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'Boston-area professional and major-college sports only.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, or international soccer.',business:'7 unique business/markets stories; at 10 a.m. and 1 p.m. show timestamped live Dow and Nasdaq Composite moves and disclose any quote delay; at 4 p.m. show timestamped closing moves as confirmed or clearly preliminary; figures refer to the latest completed U.S. session.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
