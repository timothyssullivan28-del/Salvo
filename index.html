<script id="briefing" type="application/json">{"date":"2026-10-30","lastUpdated":"October 30, 2026, 7:11:15 a.m. EDT Boston","dek":"Friday morning limited refresh: Top News, USA, Boston Sports and Sports researched and re-ranked; Business, World, Politics and Entertainment preserve Thursday evening’s verified cards, links, original dates and Tells.","take":"The record Binance theft, contested election claims and civilian deaths lead, but attribution and changing source snapshots still matter. Fox foregrounds Alaska’s alleged same-name candidate scheme, CNN emphasizes election stakes alongside the hack and Dnipro strike, while Drudge highlights the theft and Iran attack options. Their overlap is concern over security and power, not agreement on guilt or an imminent war; Drudge is an aggregator, not an independent reporting source.","sectionTakes":{"top":"The record Binance theft, contested election claims and civilian deaths lead, but attribution and changing source snapshots still matter. Fox foregrounds Alaska’s alleged same-name candidate scheme, CNN emphasizes election stakes alongside the hack and Dnipro strike, while Drudge highlights the theft and Iran attack options. Their overlap is concern over security and power, not agreement on guilt or an imminent war; Drudge is an aggregator, not an independent reporting source.","usa":"New detention litigation, university leadership accountability and a rail-management change lead the fresh domestic reporting. Court filings and the Cornell hearing remain unresolved, while police explicitly separate the Richmond shooting from election violence. Rural tuition access, threatened urban wildlife and earlier-dated climate and clock-change reporting round out the page without pretending every item broke Friday.","boston":"FINAL Thursday: St. Louis beat the Bruins 4–1; UPCOMING Friday: Chicago visits the Celtics at 7:30 p.m. EDT, with the other three teams off. Durbin’s foot operation, roster-clearing trades and the Patriots’ takeaway problem lead the substantive updates, while Thursday’s injury report is not Friday’s final game designation. Globe access varied between readable reporting and paywall overlays; WEEI/Audacy was checked but offered limited fresh full text.","business":"CONFIRMED Thursday, Oct. 29 close: Dow 52,342.56, −132.54 (−0.25%); Nasdaq 26,184.72, −365.13 (−1.38%), for the completed 4 p.m. EDT cash session, cross-checked with AP, CNBC and MarketWatch’s dated closing excerpt. Stronger U.S. growth coexists with faster inflation and a tech-led index decline. A proposed delivery merger, personalized-pricing scrutiny and European corporate and policy changes remain distinct from completed deals or guaranteed relief.","world":"Local aid access in Oleshky does not end the wider war, while Yemen and Haiti show separate pressures on basic survival. Hong Kong’s resignation and Afghan crop estimates are concrete developments; Venezuela’s asset plan remains prospective. Somalia’s imminent mission closure leaves a political gap, and the Pakistan and India tolls remain attributed to authorities.","sports":"Watson’s unusual return and Boozer’s first triple-double lead completed results, while the Braves and Mariners make concrete offseason contract choices. Fears, Thompson, Byfield and Okongwu supplied decisive performances, and Yelich’s tribute gives the championship aftermath a human focus. Medical checks and an in-game hamstring exit do not establish long-term health guarantees.","politics":"The California ruling and broad record demands underscore the difference between investigating voter eligibility and proving unlawful votes. Polling and campaign schedule shifts do not determine the Senate result, while announced projects still face real-world uncertainty. AP’s fact check and the declined Starlink inquiry highlight why procedural claims and oversight concerns need precise attribution.","entertainment":"Stewart and Sommer’s deaths lead, with confirmed reporting rather than invented medical details. Panettiere’s local case closure and Masterson’s appellate loss are different legal stages, while Burns’ prize and Gentle Monster’s review add cultural news. The Dutch Eurovision reversal retains its Oct. 27 date rather than being presented as a new Thursday announcement."},"sections":{"top":[{"id":"top-binance-oct30","headline":"Binance promises to cover losses after record hack; attribution remains preliminary","summary":"Binance says withdrawals remain suspended after roughly $6.36 billion left its wallets, and promises to cover losses. AP’s Friday update and CNN independently report the breach. Blockchain firm TRM attributes it with high confidence to a North Korean unit; that is an investigative assessment, not a publicly adjudicated finding. Binance says additional breach points emerged after its initial laptop explanation.","sources":["Other","CNN","Drudge"],"signal":"Watch","links":[{"url":"https://apnews.com/article/binance-cryptocurrency-security-hack-north-korea-550e9b876550f71f07098494fe735beb","label":"AP — updated Oct. 30, 6:22 a.m. EDT"},{"url":"https://www.cnn.com/2026/10/30/tech/binance-crypto-heist-hnk-intl","label":"CNN — Oct. 30 report"},{"url":"https://www.drudgereport.com/","label":"Drudge Report — aggregator checked Oct. 30 morning"}]},{"id":"top-israel-oct29","headline":"Israel’s final count denies Netanyahu a majority as unproven fraud claims intensify","summary":"AP’s overnight update says final results leave Netanyahu’s bloc without a parliamentary majority. Likud amplified allegations that Arab-led parties stole the election, but has not supplied substantiating evidence. Reuters independently reports the allegations and Arab leaders’ rejection of them. Coalition negotiations, not an automatic transfer of power, determine what follows.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/israel-elections-netanyahu-eisenkot-arab-results-9a0620a1314fdc127245ba1a7f0aa762","label":"AP — updated Oct. 30, 2:08 a.m. EDT"},{"url":"https://www.reuters.com/world/middle-east/netanyahu-risk-losing-power-steps-up-attacks-israels-arab-parties-2026-10-29/","label":"Reuters — Oct. 29 reporting"}]},{"id":"top-iran-mediators-oct30","headline":"Reuters: Qatari mediators return to Tehran in renewed effort for U.S.–Iran deal","summary":"An official briefed on the talks told Reuters Friday that Qatari mediators returned to Tehran. Washington wants nuclear issues addressed from the outset; Tehran demands an end to the port blockade and oil-export sanctions first. Iran previously rejected a draft proposal. The return of intermediaries is not a ceasefire agreement or proof that the parties have resolved those differences.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/world/middle-east/qatari-mediators-return-tehran-push-us-iran-deal-official-says-2026-10-30/","label":"Reuters — Oct. 30; attributed to official briefed on talks"}]},{"id":"top-dnipro-oct30","headline":"Dnipro station strike kills civilians; source snapshots differ on toll","summary":"CNN’s Friday update reports 15 deaths after a Russian drone hit people awaiting a train in Dnipro Thursday. Reuters’ Thursday report records at least 14, citing Ukrainian officials. The snapshots independently establish a deadly station attack, but do not supply an identical final toll. The strike is distinct from the localized Oleshky humanitarian arrangement preserved in World.","sources":["CNN","Other"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/29/europe/russia-ukraine-strikes-dnipro-train-station-intl","label":"CNN — updated Oct. 30, 3:01 a.m. ET"},{"url":"https://www.reuters.com/world/europe/russian-drone-attack-train-station-kills-13-ukraines-dnipro-2026-10-29/","label":"Reuters — Oct. 29; earlier toll of at least 14"}]},{"id":"top-alaska-eve29","headline":"Peltola denies knowledge of same-name Sullivan recruitment as inquiry continues","summary":"Mary Peltola denied Thursday that she knew about an effort to place a second Dan Sullivan on Alaska’s Senate ballot. AP’s overnight update reports her denial and the escalating investigation. Fox emphasizes that early ballots were already being cast when the report emerged. An alleged recruitment scheme is not a finding that Peltola committed a crime or that votes have been invalidated.","sources":["Other","Fox"],"signal":"Watch","links":[{"url":"https://apnews.com/article/alaska-peltola-senate-dan-sullivan-democrats-dunleavy-c391cc7b546384c7adde9aebc9973620","label":"AP — updated Oct. 30, 3:01 a.m. EDT"},{"url":"https://www.foxnews.com/politics/report-alleged-second-dan-sullivan-effort-emerges-early-1-10-alaskans-voted","label":"Fox News — Oct. 29 report, checked Oct. 30"}]},{"id":"top-medicaid-oct30","headline":"Judge’s Medicaid injunction limits stricter “medically frail” work exemptions","summary":"Judge Richard Stearns blocked guidance requiring sick Medicaid recipients to prove their conditions also significantly impair compliance with work requirements. AP’s Thursday report and independent STAT coverage describe a partial victory for states challenging the rule. The injunction protects eligibility while litigation proceeds; it does not repeal every work requirement or resolve the full lawsuit.","sources":["Other"],"signal":"Watch","links":[{"url":"https://abcnews.com/Health/wireStory/judge-blocks-trump-administrations-medicaid-rule-forcing-sick-137684178","label":"AP via ABC News — Oct. 29"},{"url":"https://www.statnews.com/2026/10/29/medicaid-work-requirements-judge-blocks-new-limts-medical-frailty/","label":"STAT — Oct. 29 independent court reporting"}]},{"id":"top-peptides-oct30","headline":"Unapproved peptides could become easier to obtain under draft HHS policy","summary":"CNN’s Thursday explanation says a draft policy would permit patient-specific compounding of six injectable peptides. AP reports opposition among FDA scientists; HHS argues oversight could improve safety compared with the gray market. A 14-day comment period precedes final action. Compounded availability would not mean FDA approval or demonstrated effectiveness for wellness claims.","sources":["CNN","Other"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/29/health/peptides-hhs-draft-policy","label":"CNN — Oct. 29 explanation"},{"url":"https://apnews.com/article/peptides-fda-rfk-compounding-8da016068c004486159514d3a7471fd7","label":"AP — updated Oct. 28, 8:14 p.m. EDT"}]},{"id":"top-spain-eve29","headline":"Spain’s crash death count revised to 69 as investigation continues","summary":"ABC’s Thursday update says the government revised an initial overnight count of 74 down to 69 deaths after the high-speed train collision. Reuters separately reports 69 and continued recovery work. The collision’s cause remains under investigation; changing official counts should not be mistaken for independently established new fatalities. The reporting retains its Thursday date.","sources":["Other"],"signal":"Watch","links":[{"url":"https://abcnews.com/International/10-killed-train-collision-high-speed-line-spain/story?id=137633323","label":"ABC News — Oct. 29 update"},{"url":"https://www.reuters.com/world/europe/spanish-rescuers-search-trains-hope-finding-survivors-deadly-crash-2026-10-29/","label":"Reuters — Oct. 29 recovery report"}]},{"id":"top-ebola-eve29","headline":"Congo’s 10,000-case Ebola milestone raises containment concerns","summary":"AP’s Thursday assessment says Congo’s outbreak has passed 10,000 confirmed cases, with nearly half of infected people dying. Experts disagree on whether it could become the largest outbreak, and updated projections are still being developed. Researchers describe limited immediate risk to most other countries, while warning that further spread becomes more likely if containment fails.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/ebola-congo-10000-cases-forecast-8bec4479473d61048250615db96eae55","label":"AP — updated Oct. 29, 9:51 a.m. EDT"}]},{"id":"top-sylvia-oct30","headline":"Pentagon’s leak allegations against fired general remain unproven","summary":"The Pentagon accused Maj. Gen. Brett Sylvia of leaking sensitive information after Hegseth dismissed him. AP’s Thursday reporting distinguishes the firing from the department’s accusations. No conviction or independently established guilt follows from those statements. The dismissal remains consequential for senior military leadership, but the underlying allegations require attribution.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/general-firing-hegseth-pentagon-leaks-346ce31afab5dfc2cacc5efac502bc6d","label":"AP — updated Oct. 29, 1:36 p.m. EDT"}]}],"usa":[{"id":"usa-detention-oct30","headline":"Indiana immigration detainees sue over isolation and alleged medical neglect","summary":"Three detainees filed suit Thursday alleging weeks in solitary confinement, denied treatment, abuse and racial slurs at Indiana’s Miami Detention Center. AP obtained the complaint and describes two deaths at the facility this year. The allegations of a dangerous medical crisis have not been adjudicated; a lawsuit is not a court finding that every accusation is true.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/indiana-ice-detention-lawsuit-speedway-slammer-027d1baba4c5690a35b9aab7226289a3","label":"AP — updated Oct. 29, 6:42 p.m. EDT"}]},{"id":"usa-dartmouth-oct30","headline":"Dartmouth provost resigns after faculty finding on AI-assisted writing","summary":"Provost Santiago Schnell resigned after a faculty committee found he used artificial intelligence to shape his writing, including a Washington Post guest column about AI cheating. Dartmouth announced the departure Wednesday, AP reports. The leadership change and committee finding are distinct from a blanket conclusion that all AI-assisted academic work violates the same rules.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/dartmouth-provost-ai-a9f71dc5e9e10461c7c2390febcd1b5a","label":"AP — Oct. 29 reporting on Wednesday announcement"}]},{"id":"usa-rail-oct30","headline":"California rail chief resigns amid scrutiny; finance director named replacement","summary":"California high-speed rail CEO Ian Choudri resigned late Wednesday, citing personal and family priorities. The board named state finance director Joe Stephenshaw Thursday. CalMatters’ report carried by AP places the change amid travel-spending scrutiny, delays and funding trouble. The timing does not establish that the outgoing executive committed a crime.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/california-highspeed-rail-authority-scandal-resignation-4b2d81c94b7ec60dbfc0a701c84071a9","label":"CalMatters via AP — updated Oct. 29, 3:51 p.m. EDT"}]},{"id":"usa-sandyhook-oct30","headline":"Sandy Hook families ask Supreme Court to uphold semiautomatic-rifle bans","summary":"Relatives of five children and an educator killed at Sandy Hook filed an amicus brief supporting bans challenged in Connecticut and the Chicago area. AP reports the justices are scheduled to hear arguments Dec. 2. The filing gives families’ account of the weapons’ effects; it is advocacy in pending cases, not a new Supreme Court ruling.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/sandy-hook-supreme-court-assault-weapons-ban-920d5c3d55af2f8cf446d94d3a9ded79","label":"AP — updated Oct. 29, 4:22 p.m. EDT"}]},{"id":"usa-cornell-oct30","headline":"Judge weighs challenge to Letitia James’ role in Cornell investigation","summary":"A judge heard arguments Thursday over whether Attorney General Letitia James’ earlier social-media posts disqualify her from investigating sexual-assault allegations involving Cornell. AP’s evening update says no immediate ruling was issued. Lawyers for one accused man allege prejudgment; James says evidence and law will guide the inquiry. Neither the recusal challenge nor the underlying allegations are resolved.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/cornell-rape-investigation-letitia-james-42e99e5372f0f748160013e5eb046bcd","label":"AP — updated Oct. 29, 7:49 p.m. EDT"}]},{"id":"usa-virginia-oct30","headline":"Police say shooting outside Virginia GOP offices was unrelated to election","summary":"Richmond’s police chief says a Thursday shooting stemmed from a dispute across the street, not the midterms. A woman believed to be a bystander suffered non-life-threatening injuries. AP reports a woman at a salon told police she fired in self-defense; that explanation remains her account, not an adjudicated conclusion.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/virigina-shooting-republican-party-offices-6ad4e30f900a0c4059c9398f8524773e","label":"AP — updated Oct. 29, 3:46 p.m. EDT"}]},{"id":"usa-michigan-oct30","headline":"Rural Michigan universities seek inclusion in free associate-degree tuition","summary":"Four public universities offering associate degrees are lobbying to join Michigan’s Community College Guarantee. AP’s Thursday report describes long travel distances that can make community-college attendance impractical for rural students. Their request highlights a gap in access, but lawmakers have not yet granted the expansion described in the report.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/michigan-free-community-college-rural-universities-6c22dc5814970242197a8d16ba48569b","label":"AP — updated Oct. 29, 4:51 p.m. EDT"}]},{"id":"usa-owls-oct30","headline":"Removal of Manhattan water-tower roof disrupts rare barn-owl nest","summary":"The roof of an Upper West Side water tower used by a barn-owl family was removed, prompting concern from birders and NYC Bird Alliance. AP reports a fledgling was seen Thursday on a nearby roof and state environmental enforcement officers attended the site. The birds’ longer-term fate and responsibility for the work are not established by those observations.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/barn-owls-nest-manhattan-roof-1d7dea576680afcce7127827e87562d1","label":"AP — Oct. 29 reporting on Thursday removal"}]},{"id":"usa-glaciers-oct30","headline":"Colorado glacier survey documents sharp losses after hot, low-snow year","summary":"AP’s Oct. 27 report documents dramatic thinning of Colorado’s remaining glaciers after record-low mountain snow and record warmth. Scientists warn the ice may have little time left, but that warning is not a precise disappearance date for every glacier. The earlier-week field reporting remains significant climate evidence; it is not labeled as a new Friday measurement.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/glaciers-melt-climate-change-colorado-0dd833f733e49fd9393cfa79cbc28fb5","label":"AP — updated Oct. 27, 9:01 a.m. EDT"}]},{"id":"usa-clocks-oct30","headline":"Most U.S. clocks fall back Sunday; health experts favor steadier sleep routines","summary":"Daylight saving time ends at 2 a.m. local time Sunday, Nov. 1, for participating U.S. jurisdictions. AP’s Oct. 26 service report explains that Hawaii and most of Arizona do not change clocks. Sleep specialists recommend consistent routines and morning light; the seasonal change is scheduled, not a newly enacted nationwide move to permanent standard time.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/daylight-saving-fall-back-time-change-003f56383585ec8abde704c9c205a8e7","label":"AP — updated Oct. 26, 6:02 a.m. EDT; relevant Nov. 1 deadline"}]}],"boston":[{"id":"boston-friday-status-oct30","headline":"Friday Boston scoreboard: Blues beat Bruins 4–1; Bulls visit Celtics tonight","summary":"FINAL Thursday, Oct. 29: Blues 4, Bruins 1; Celtics, Patriots and Red Sox did not play Thursda e/patrick-stewart-dies-8b38054ff74d4187a32158d78e345ad7","label":"AP — 6:18 PM EDT, October 29, 2026"},{"url":"https://www.cnn.com/2026/10/29/entertainment/patrick-stewart-death","label":"CNN — Oct. 29 obituary"}]},{"id":"ent-sommer-eve29","headline":"Elke Sommer, star of A Shot in the Dark and The Prize, dies at 85","summary":"AP’s Thursday obituary reports her death at home in Los Angeles Wednesday, citing family reporting and a police response. Sommer became a prominent presence in 1960s Hollywood comedies and espionage films. The briefing does not assign an unreported medical cause.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/elke-sommer-dies-05ef6ecfe095939515991b3553e5ca55","label":"AP — 2:47 PM EDT, October 29, 2026"}]},{"id":"entertainment-panettiere-oct28eve","headline":"Police close Hayden Panettiere death investigation after accidental-overdose finding","summary":"Greenville police said Wednesday they closed the local investigation based on the medical examiner’s finding and their work. AP reports the actor died in August. Closure of this investigation should not be expanded into claims about every possible separate proceeding.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/hayden-panettiere-overdose-investigation-closed-2f069d501f6dad02c775d1642de3f3c5","label":"AP — 5:41 PM EDT, October 28, 2026"}]},{"id":"entertainment-burns-oct28eve","headline":"Ken Burns wins inaugural $250,000 American-history prize","summary":"The New York Historical museum named Burns the first recipient of the David M. Rubenstein Prize for the Advancement of American History. AP’s Wednesday announcement credits his documentary work. It is a completed award announcement, not an assessment that every historical interpretation is uncontested.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/ken-burns-american-history-prize-014333eec5706a752df641defc2696c5","label":"AP — 11:04 AM EDT, October 28, 2026"}]},{"id":"entertainment-gentle-oct28eve","headline":"Review: Gentle Monster tests a family’s trust and the audience’s judgment","summary":"AP’s Wednesday review discusses Marie Kreutzer’s drama starring Léa Seydoux and Laurence Rupp. The critic emphasizes how its apparently loving household complicates the audience’s moral response. This is attributed film criticism, not an allegation about the performers or a verified account of real people.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/gentle-monster-movie-review-918881df1a322ae09fc019c9fd0a57a5","label":"AP — 11:52 AM EDT, October 28, 2026"}]},{"id":"entertainment-masterson-oct28eve","headline":"California appeals court upholds Danny Masterson’s rape convictions","summary":"AP’s Wednesday update reports the appellate panel unanimously rejected arguments for a new trial after Tuesday’s ruling. Masterson’s 30-years-to-life sentence remains in place. The appellate outcome is established; it should not be confused with a new trial or a newly imposed sentence.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/danny-masterson-rape-appeal-scientology-5b81a4f47107b0e626f90fd43aaa0dac","label":"AP — 8:21 AM EDT, October 28, 2026"}]},{"id":"ent-eurovision-eve29","headline":"Dutch broadcaster reverses planned Eurovision return","summary":"AP’s Oct. 27 report says the Netherlands withdrew again after previously planning to return. The reversal remains consequential for the coming contest and is labeled with its actual date. It concerns Dutch participation, not cancellation of Eurovision as a whole.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/netherlands-eurovision-song-festival-dutch-27ee0f300f9cd0ca4a4844b51865bd95","label":"AP — 7:44 AM EDT, October 27, 2026"}]}]},"researchNotes":["Friday Oct. 30 morning limited refresh. Four eligible tabs researched/reranked; Business, World, Politics and Entertainment exactly preserved from Thursday evening. No market research; schedule unchanged.","Fox, CNN and Drudge homepages checked Friday morning. Direct Fox Alaska article checked; article text limited. AP and CNN independently report Binance breach, but North Korean attribution is TRM’s assessment. Reuters and AP match Israeli result. Reuters Qatar mediation is single-source attributed reporting.","CNN Friday Dnipro toll is 15; Reuters Thursday snapshot records at least 14. Both are explicitly attributed, not presented as an identical final count. Spain official toll revised down from 74 to 69 in ABC update, corroborated at 69 by Reuters.","Boston official NHL recap, AP final, ESPN Celtics schedule and official Patriots schedule checked Friday morning. Blues 4–1 Bruins Thursday; Bulls at Celtics Friday 7:30 p.m. EDT; Blackhawks at Bruins Saturday 1 p.m. EDT; Patriots at Miami Sunday 4:25 p.m. EST. No Boston game in progress.","Globe and WEEI checked. Globe access varied by URL between readable reporting, empty bodies and subscription overlays; readable URL variants supplied Bruins analysis. WEEI/Audacy hub limited fresh full text. MLB independently confirms Durbin surgery. Thursday official Patriots report is not Friday game designation.","Preserved Politics contains Trump rally cancellations and voting misinformation, so those were not duplicated in refreshed tabs. No General Sports exclusions selected; incidental excluded coverage in source pages is not reproduced. Earlier Oct. 26/27 service and climate articles retain real dates and relevance."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, international soccer, or WNBA coverage.',business:'7 unique business/markets stories refreshed only at 7 p.m. Eastern Monday through Friday, with independently confirmed figures for the latest completed U.S. cash session. Preserved unchanged at all other editions.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
