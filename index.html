oximately 15-minute delayed) showed Dow 51,110.60 (−69.27; −0.14%) and Nasdaq Composite 27,135.97 (−402.72; −1.46%). Latest completed session: Wednesday, Oct. 7; Reuters reported Dow 51,180.17 (−341.11; −0.66%) and Nasdaq 27,538.69 (−61.19; −0.22%), while AP’s point moves differed by 0.30 and 0.01, respectively. At that snapshot both indexes were lower, with Nasdaq underperforming the Dow.","world":"A second Polish school attack killed a caretaker, Britain announced new Russia sanctions, and Washington’s newly reported Myanmar outreach marks a break from years of isolation. Reuters and AP attribute official claims and casualty accounts; the Myanmar contact and Beijing talks do not amount to completed agreements.","sports":"The White Sox–Guardians ALDS Game 4 remains scheduled for 8 p.m. ET; Milwaukee, Tampa Bay and Los Angeles advanced in Wednesday’s baseball playoffs. Current NFL injury and roster news joins Ovechkin’s final-season update, while scores and outcomes are tied to dated recaps rather than presented as live action.","politics":"New Oct. 8 coverage spans abortion-pill litigation, press-access challenges and Democratic strategy, while Reuters’ candidate review and poll track midterm positioning. Court filings remain allegations and requests, not judgments; polling and campaign analysis are not election results.","entertainment":"Anne Carson’s Oct. 8 Nobel Prize leads a slate spanning studio ownership, awards distribution and current film criticism. The Oct. 5 box-office figures for “Verity” and “Digger” are dated opening-weekend grosses, not full-run outcomes."},"sections":{"top":[{"id":"top-isaias-hurricane-oct8","headline":"Hurricane Isaias grows toward Gulf as evacuations and shutdowns expand","summary":"CNN’s live coverage updated at 1:00 p.m. EDT Thursday cited the National Hurricane Center’s 10 a.m. CDT update: Isaias was a Category 1 hurricane with 85 mph sustained winds, with possible further strengthening and landfall near the Alabama–Florida border Friday night or early Saturday. Evacuation and storm-surge warnings had expanded; those track and intensity projections remain forecasts, and Reuters separately reported Gulf production shutdowns.","sources":["CNN","Fox","Drudge","Other"],"signal":"Consensus","links":[{"label":"CNN — live storm coverage, updated 10:09 a.m. EDT Oct. 8","url":"https://www.cnn.com/2026/10/08/weather/live-news/hurricane-isaias-gulf-storm"},{"label":"Reuters — Isaias reaches hurricane strength, Oct. 8","url":"https://www.reuters.com/business/environment/us-nhc-says-isaias-has-become-hurricane-2026-10-08/"},{"label":"AP — Isaias strengthens into first Atlantic hurricane","url":"https://apnews.com/article/tropical-storm-isaias-gulf-atlantic-440bdecf97a5340547ca3ad291b361df"},{"label":"Fox News — homepage checked Oct. 8","url":"https://www.foxnews.com/"},{"label":"Drudge Report — aggregator homepage checked Oct. 8","url":"https://www.drudgereport.com/"}]},{"id":"top-ukraine-strike-kramatorsk-oct8","headline":"Russian strike on Kramatorsk kills at least 30, Ukraine says","summary":"Reuters reported Oct. 8 that Ukrainian authorities said a Russian bomb struck a bus area in Kramatorsk, killing at least 30 people; President Volodymyr Zelenskiy separately said 78 people were killed by strikes across Ukraine over two days. These are attributed Ukrainian counts, not independently verified figures; the original card’s 33-death Kramatorsk count exceeded the cited Reuters report.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — Kramatorsk strike and updated death toll, Oct. 8","url":"https://www.reuters.com/world/europe/russian-bomb-kills-12-street-east-ukraine-stronghold-2026-10-08/"},{"label":"Reuters — previous night’s nationwide strikes, Oct. 7","url":"https://www.reuters.com/world/europe/russia-kills-11-one-its-biggest-strikes-ukraine-zelenskiy-says-2026-10-07/"}]},{"id":"top-saudi-airport-attacks-oct7","headline":"Saudi airport attacks kill 3 and injure 36, officials say; ement is not a ceasefire or peace agreement.","sources":["Other"],"signal":"Watch","links":[{"label":"AP via WJHL — Trump’s Iran-strike statement, updated 1:37 p.m. EDT Oct. 8","url":"https://www.wjhl.com/news/politics/ap-trump-says-us-will-not-resume-military-strikes-on-iran-before-the-nov-3-midterm-elections/"}]},{"id":"top-mall-america-alleged-plot-oct7","headline":"FBI arrests 18-year-old in alleged ISIS-inspired Mall of America attack plot","summary":"Federal prosecutors announced the Oct. 7 arrest of an 18-year-old accused of planning an ISIS-inspired attack at Minnesota’s Mall of America. The plot description and alleged affiliations are charges and investigative claims, not a conviction; authorities said the investigation remains active.","links":[{"label":"Fox News — FBI arrests suspect in alleged Mall of America plot, Oct. 7","url":"https://www.foxnews.com/us/minnesota-man-accused-plotting-mall-america-attack-pledging-allegiance-isis-fbi"},{"label":"KPTV — FBI case and alleged rifle purchase, Oct. 7","url":"https://www.kptv.com/2026/10/07/fbi-stops-mall-america-terror-plot-by-18-year-old-after-agents-sold-him-assault-rifle/"}],"sources":["Fox","Other"],"signal":"Watch"},{"id":"top-pike-failed-execution-hearing-oct7","headline":"Oct. 1 report: Christa Pike survives botched execution; review remains unresolved","summary":"In an Oct. 1 report, Pike’s lawyers said she was awake and speaking after Tennessee’s execution attempt was halted when staff could not establish IV access. Counsel described her as angry and confused and sought hospital records; these are attributed statements, and officials had not explained the failure or resolved whether another attempt would occur.","links":[{"label":"Yahoo — lawyers describe Pike’s condition, Oct. 8","url":"https://www.yahoo.com/news/us/article/christa-pike-feeling-angry-and-confused-after-waking-up-in-the-hospital-following-failed-execution-her-lawyers-say-081613268.html"},{"label":"CNN — video report, Oct. 7","url":"https://www.cnn.com/2026/10/07/us/video/christa-pike-first-words-failed-execution-digvid-vrtc"}],"sources":["Fox","CNN","Other"],"signal":"Watch"},{"id":"top-israel-oct7-anniversary-2026","headline":"Israel marks Oct. 7 anniversary amid grief, Gaza devastation and election divisions","summary":"AP’s Oct. 7 anniversary coverage describes commemorations in Israel alongside continuing grief, Gaza’s destruction and political divisions. The anniversary marked three years since the Hamas-led Oct. 7, 2023 attacks; the article’s human accounts are distinct from the current military developments elsewhere in the briefing.","links":[{"label":"AP — Israelis mourn as Gaza remains devastated, Oct. 7","url":"https://apnews.com/article/israel-palestinians-oct-7-war-gaza-anniversary-da70839eab71a77db31237fe79142ead"},{"label":"Reuters — Israelis mark third anniversary, Oct. 7","url":"https://www.reuters.com/world/middle-east/israelis-mark-three-years-since-hamas-attack-that-set-off-gaza-assault-2026-10-07/"},{"label":"AP — election divisions over Netanyahu, Oct. 7","url":"https://apnews.com/article/israel-oct-7-election-netanyahu-hamas-gaza-55d94c750b399e7d89f550ebc8610436"}],"sources":["Other"],"signal":"Watch"},{"id":"top-hormuz-attack-oct6","headline":"India says 12 sailors injured after projectile strikes vessel near Hormuz","summary":"In an Oct. 6 report, Indian authorities said a projectile struck a vessel near the Strait of Hormuz and injured 12 sailors. The incident is an earlier, dated example of shipping risk during the Iran conflict, not a new Oct. 8 attack; subsequent Gulf shipping reports are covered in the current business and Saudi-airport cards.","links":[{"label":"Al Jazeera — India reports 12 crew injured off Oman, Oct. 6","url":"https://www.aljazeera.com/news/liveblog/2026/10/6/iran-war-live-yemen-forces-reclaim-strategic-port-city-mocha-from-houthis"},{"label":"India Today — foreign ministry statement on MT On Peace, Oct. 6","url":"https://www.indiatoday.in/amp/india/story/11-indian-sailors-hurt-as-projectile-hits-panama-flagged-vessel-in-hormuz-says-govt-crew-evacuated-to-oman-3010786-2026-10-06"},{"label":"Fox News live — Indian sailors injured in Hormuz attack, Oct. 6","url":"https://www.foxnews.com/live-news/iran-war-trump-oil-prices-fall-middle-east-10-06-26"}],"sources":["Fox","Other"],"signal":"Watch"},{"id":"top-hegseth-carrier-deployment-oct7","headline":"Hegseth visits carrier after record wartime deployment drew scrutiny","summary":"Reuters reported Oct. 7 that Defense Secretary Pete Hegseth praised sailors during a carrier visit after a record deployment that has drawn scrutiny over its length and operational strain. His public praise did not resolve questions about readiness, maintenance or crew fatigue.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — carrier deployment, Oct. 7","url":"https://www.reuters.com/world/hegseth-praises-sailors-resilience-after-record-breaking-carrier-deployment-2026-10-07/"}]},{"id":"top-vance-iran-enrichment-oct6","headline":"Vance calls for a “meaningful” Iranian enrichment reduction to end the war","summary":"In a Reuters interview published Oct. 6, Vice President JD Vance said Iran must make a “meaningful” reduction in uranium enrichment to end the war. That was a negotiating position, not an agreement; Trump’s newer Oct. 8 statement that strikes would not resume before the midterms does not resolve the wider conflict or the enrichment dispute.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — Vance interview on Iran’s enrichment, Oct. 6","url":"https://www.reuters.com/world/interview-us-vice-president-vance-says-iran-must-cut-enrichment-end-war-2026-10-06/"},{"label":"Al Jazeera — analysis of U.S. demands, Oct. 7","url":"https://www.aljazeera.com/news/2026/10/7/us-sets-new-demands-for-iran-deal-what-are-they"}]}],"usa":[{"id":"usa-georgia-block-party-shooting-oct8","headline":"No arrests announced after Georgia homecoming-party shooting killed 2 and injured dozens","summary":"An AP update says investigators had announced no arrests after gunfire at a homecoming-weekend block party in Vienna, Georgia, killed two and injured nearly three dozen people. The local sheriff said more than 50 shots were fired; investigators are still pursuing suspects.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — investigation update, Oct. 8","url":"https://apnews.com/article/georgia-block-party-shooting-a406a02f42848e2c688f96e9178f7122"}]},{"id":"usa-social-media-addiction-verdict-oct6","headline":"Jury finds Instagram and YouTube liable in landmark social-media addiction trial","summary":"An AP-reported jury verdict found Meta and YouTube liable in a young user’s social-media addiction case, a landmark ruling that could influence other litigation. The companies disputed liability; the verdict does not establish that every platform or user was harmed in the same way.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — social-media addiction trial verdict","url":"https://apnews.com/article/social-media-addiction-trial-la-5e54075023d837ccdc76c4ca512e9251"}]},{"id":"usa-tiktok-placebo-safety-lawsuit-oct7","headline":"New York lawsuit alleges TikTok gave some children nonfunctional safety tools","summary":"A newly unsealed New York lawsuit alleges TikTok ran placebo tests on thousands of users, including minors, who believed its “Algo Refresh” feature had reset their recommendations. TikTok says it routinely tests features and has broadly denied the claims; these are allegations in ongoing litigation, not court findings.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — unsealed New York allegations, Oct. 7","url":"https://www.reuters.com/world/china/tiktok-gave-teens-children-placebo-safety-feature-experiment-new-york-alleges-2026-10-07/"}]},{"id":"usa-doj-denaturalization-40-oct7","headline":"DOJ files citizenship-revocation cases against 40 naturalized citizens","summary":"The Justice Department says it filed cases targeting 40 naturalized citizens accused of serious offenses, calling it the largest single-period filing under the administration. Citizenship is not revoked by the announcement: allegations must be litigated in court, and the legal burden remains on the government.","links":[{"label":"U.S. Department of Justice — announcement and allegations, Oct. 6","url":"https://www.justice.gov/opa/pr/justice-department-moves-strip-citizenship-40-criminals-largest-single-period"},{"label":"The Guardian — denaturalization actions, Oct. 6","url":"https://www.theguardian.com/us-news/2026/oct/06/trump-justice-department-denaturalize-citizens-crimes"}],"sources":["Other"],"signal":"Watch"},{"id":"usa-meta-florida-teens-lawsuit-oct7","headline":"Florida asks court to order changes to Meta’s teen platforms","summary":"Florida asked a court to force changes to Facebook and Instagram for teen users, Reuters reported Oct. 7. The request is a litigant’s position, not a court order or finding; the dispute adds to state-level scrutiny of the platforms.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — Florida filing against Meta, Oct. 7","url":"https://www.reuters.com/world/us/florida-asks-court-force-meta-change-facebook-instagram-teens-2026-10-07/"}]},{"id":"usa-international-student-work-authorization-fee-oct7","headline":"Trump administration plans a $70,000 fee for some international students’ work authorization","summary":"Reuters reported Oct. 7 that the administration plans to charge international students $70,000 for work authorization. The report describes a planned policy, not a fee already implemented; the administration’s final terms and any legal challenge remain to be seen.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — planned work-authorization charge, Oct. 7","url":"https://www.reuters.com/legal/government/trump-administration-plans-charge-international-students-70000-work-2026-10-07/"}]},{"id":"usa-co  in a game.","sources":["Other"],"signal":"Watch","links":[{"label":"NFL — Vikings sign Beckham to practice squad, Oct. 7","url":"https://www.nfl.com/news/odell-beckham-jr-vikings-sign-practice-squad"},{"label":"AP syndication — Vikings add Beckham to practice squad, Oct. 7","url":"https://www.sfgate.com/sports/article/vikings-sign-veteran-receiver-odell-beckham-jr-22466780.php"}]},{"id":"sports-steelers-tempers-passion-oct7","headline":"Rodgers says Steelers’ on-field frustration signals passion, not turmoil","summary":"In an AP report published Oct. 7, Aaron Rodgers said the Steelers’ on-field frustration reflected competitive passion rather than locker-room turmoil. His characterization is an attributed response, not an independent assessment of team dynamics.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — Steelers’ frustration and Rodgers’ response, Oct. 7","url":"https://apnews.com/article/steelers-aaron-rodgers-cameron-heyward-8d8114c7c7d745d435e885eab4d1aabb"},{"label":"AP — Steelers-Browns game recap referenced in report","url":"https://apnews.com/article/steelers-browns-porter-tradxe-9253b19e1d8c7e8458c0f1484ee468a9"}]},{"id":"sports-ovechkin-final-season-oct6","headline":"Ovechkin enters final NHL season as Capitals open at home with 5–3 win","summary":"AP reported Oct. 8 that Alex Ovechkin’s sons introduced him before Washington’s home opener, a 5–3 Capitals win over Pittsburgh. Ovechkin announced earlier that week that 2026–27 would be his final NHL season; the retirement is planned for after this season, not effective now.","sources":["Other"],"signal":"Consensus","links":[{"label":"AP — Ovechkin introduced by his sons before Capitals home opener, Oct. 8","url":"https://apnews.com/article/washington-capitals-alex-ovechkin-e9bf26bc67e1e6e93dad1e6de89e27b9"}]},{"id":"sports-nba-tech-preseason-oct6","headline":"NBA tests smart basketballs and wearable technology during preseason","summary":"AP reported Oct. 5 that the NBA is testing smart basketballs and wearable technology during preseason, exploring ways to collect more detailed performance data. The trial is an experiment, not an announced league-wide adoption.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — NBA preseason technology experiments","url":"https://apnews.com/article/nba-preseason-tech-experiments-d6fa30f7f8db2abeb2e092c884c3aad2"}]}],"politics":[{"id":"politics-dnc-taxpayer-ads-lawsuit-oct7","headline":"DNC sues to stop taxpayer-funded Trump ads, alleging unlawful campaign spending","summary":"The DNC sued on Oct. 7 to stop taxpayer-funded Trump administration television ads, alleging they amounted to unlawful campaign spending. The suit presents Democrats’ legal claims; no court has ruled on the merits.","sources":["Other"],"signal":"Split","links":[{"label":"Reuters — DNC lawsuit and administration response, Oct. 7","url":"https://www.reuters.com/legal/government/democrats-sue-trump-halt-taxpayer-funded-tv-ads-that-praised-him-2026-10-07/"},{"label":"Fox News — DNC alleges $20 million ad diversion, Oct. 7","url":"https://www.foxnews.com/politics/dnc-lawsuit-accuses-trump-admin-diverting-20m-federal-funds-propaganda-ads"}]},{"id":"politics-gop-candidates-distance-trump-oct7","headline":"Reuters finds two-thirds of GOP candidates in tight races distancing from Trump","summary":"A fresh Reuters check confirms its Oct. 7 review: candidates in 41 of 62 competitive House and Senate races had diverged from Trump on policy or played down ties, often over the Iran conflict. This is an analysis of campaign strategy, not a prediction of election results; the previously reported Reuters page now fetches correctly.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — review of Republican candidates in competitive races, Oct. 7; source rechecked","url":"https://www.reuters.com/world/us/most-republicans-tight-midterm-distance-themselves-trump-reuters-review-finds-2026-10-07/"}]},{"id":"politics-democrats-trans-strategy-oct8","headline":"Democrats in tight Midwest races split on how to address transgender issues","summary":"Reuters’ Oct. 8 review of campaign messages and interviews with nine strategists found Democratic candidates taking sharply different approaches to transgender issues in competitive midterm races. The story describes campaign strategy, not a uniform party position or settled policy.","sources":["Other"],"signal":"Split","links":[{"label":"Reuters — Democratic campaign strategy review, Oct. 8","url":"https://www.reuters.com/legal/government/democrats-tight-midwest-us-races-split-trans-rights-strategy-2026-10-08/"}]},{"id":"politics-white-house-press-ban-lawsuit-oct8","headline":"CNN, MS NOW and Politico ask judge to block White House press-access ban","summary":"The three news organizations are urging a federal judge to block the White House’s press restrictions long term, Reuters reported Oct. 8. The challenge remains pending; no court order has resolved the dispute.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — media organizations’ court filing, Oct. 8","url":"https://www.reuters.com/legal/government/cnn-ms-now-politico-urge-judge-block-white-house-ban-long-term-2026-10-08/"}]},{"id":"politics-abortion-drug-public-nuisance-oct8","headline":"Three states test “public nuisance” theory to restrict abortion medication","summary":"Reuters reported Oct. 8 that Republican-led states are using a novel public-nuisance legal theory in litigation aimed at curbing access to abortion drugs. The legal claims are contested and no final ruling has established the theory.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — state abortion-drug lawsuits, Oct. 8","url":"https://www.reuters.com/legal/government/us-states-label-abortion-drugs-public-nuisance-bid-curb-access-2026-10-08/"}]},{"id":"politics-reuters-ipsos-midterm-enthusiasm-oct8","headline":"Reuters/Ipsos finds Democratic voters much more enthusiastic about midterms","summary":"In a new Reuters/Ipsos poll published Oct. 8, 54% of Harris’s 2024 voters said they were “absolutely certain” to vote in November, versus 30% of Trump’s 2024 voters. The survey suggests an enthusiasm gap but measures intentions and opinion, not eventual turnout.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters/Ipsos — midterm enthusiasm poll, Oct. 8","url":"https://www.reuters.com/world/us/trump-voters-are-not-pumped-about-voting-midterms-reutersipsos-poll-finds-2026-10-08/"}]},{"id":"politics-fcc-ai-political-robocalls-oct7","headline":"FCC weighs loosening political robocall rules ahead of midterms","summary":"Reuters reported Oct. 7 that the Federal Communications Commission was considering changes that could loosen restrictions on AI-generated political robocalls before the midterms. The agency is weighing a proposal; the rules have not been changed.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — FCC petition on political robocalls, Oct. 7","url":"https://www.reuters.com/world/us-agency-considers-allowing-new-ai-political-robocalls-before-election-2026-10-07/"},{"label":"AP — FCC robocall proposal, Oct. 7","url":"https://apnews.com/b97fb6e8d06704dc043556dba25de548"}]}],"entertainment":[{"id":"entertainment-anne-carson-nobel-oct8","headline":"Anne Carson wins the 2026 Nobel Prize in Literature","summary":"The Swedish Academy awarded the Nobel Prize in Literature to Canadian poet and essayist Anne Carson, 76, citing her “bold and inventive oeuvre” and playful dialogue with classical tradition. The award recognizes her body of work; the prize is worth 12 million Swedish kronor.","sources":["Other"],"signal":"Consensus","links":[{"label":"Reuters — Carson wins 2026 Nobel Prize in Literature, Oct. 8","url":"https://www.usnews.com/news/world/articles/2026-10-08/canadian-writer-anne-carson-wins-2026-nobel-prize-in-literature"},{"label":"ABC News Australia — award details and Academy citation, Oct. 8","url":"https://www.abc.net.au/news/2026-10-08/canadian-writer-anne-carson-wins-2026-nobel-prize-in-literature/107245306"}]},{"id":"entertainment-paramount-wbd-merger-oct6","headline":"Paramount Skydance completes $110 billion Warner Bros. Discovery takeover","summary":"Reuters reported Oct. 6 that Paramount Skydance completed its $110 billion takeover of Warner Bros. Discovery, combining major film, television and streaming assets. The closing is complete, but regulatory and operating consequences will unfold over time.","links":[{"label":"Reuters — Paramount closes Warner Bros. Discovery merger, Oct. 6","url":"https://www.reuters.com/business/media-telecom/paramount-wraps-up-mega-warner-bros-merger-create-hollywood-powerhouse-skydance-2026-10-06/"}],"sources":["Other"],"signal":"Watch"},{"id":"entertainment-emmys-primevideo-oct6","headline":"Emmys will leave broadcast TV for Prime Video under six-year deal","summary":"The Television Academy announced Oct. 7 that the Emmy Awards will move to Prime Video in 2027 under a six-year agreement. The change ends a long broadcast-TV run; the deal does not mean the current year’s awards moved platforms.","links":[{"label":"Variety — six-year Prime Video deal, Oct. 6","url":"https://variety.com/2026/tv/news/emmys-prime-video-six-year-deal-15-million-a-year-1236899957/"},{"label":"Wall Street Journal — deal announcement, Oct. 6","url":"https://www.wsj.com/business/media/emmy-awards-will-leave-broadcast-tv-for-amazons-prime-video-0c92fad5"}],"sources":["Other"],"signal":"Consensus"},{"id":"entertainment-social-reckoning-review-oct7","headline":"Variety: “The Social Reckoning” arrives as a chilly, procedural Zuckerberg follow-up","summary":"Variety’s Oct. 7 review calls “The Social Reckoning” a chilly, procedural follow-up focused on Mark Zuckerberg and social-media scrutiny. That is a critic’s assessment of the film, not a consensus audience reaction.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — “The Social Reckoning” review, Oct. 7","url":"https://variety.com/2026/film/reviews/the-social-reckoning-review-1236904146/"}]},{"id":"entertainment-mia-goth-divorce-oct7","headline":"Mia Goth files for divorce from Shia LaBeouf, entertainment outlets report","summary":"TMZ reported Oct. 7 that Mia Goth filed for divorce from Shia LaBeouf after nearly ten years of marriage. The filing begins a legal proceeding; no final divorce judgment was reported.","sources":["Other"],"signal":"Watch","links":[{"label":"TMZ — report citing divorce filing, Oct. 7","url":"https://www.tmz.com/2026/10/07/mia-goth-and-shia-labeouf-divorce/"}]},{"id":"entertainment-misty-green-review-oct8","headline":"Chris Rock’s “Misty Green” turns a sharp eye on Los Angeles","summary":"An AP review published Thursday describes Chris Rock’s new film as a pointed critique of Los Angeles, with Rosalind Eleazar starring as Misty, a former Emmy-winning writer. The story is an arts review and its judgments are attributed to the critic.","sources":["Other"],"signal":"Watch","links":[{"label":"AP Entertainment — “Misty Green,” Oct. 8","url":"https://www.gazettextra.com/entertainment/ap-entertainment-summarybrief-at-12-37-a-m-edt/article_5a3b2164-ef98-5571-b592-bdaf553191f6.html"}]},{"id":"entertainment-digger-boxoffice-oct6","headline":"Oct. 5 box office: “Verity” opens to $62.1M worldwide as “Digger” takes $20M","summary":"Deadline’s Oct. 5 worldwide box-office update put “Verity” at $62.1 million globally and “Digger” at $20 million, including $8 million in the U.S. and Canada. These are reported opening-weekend grosses, not a full-run result; the old Deadline URL was mismatched and has been replaced with the correct article.","sources":["Other"],"signal":"Watch","links":[{"label":"Deadline — worldwide box office update, Oct. 5","url":"https://deadline.com/2026/10/box-office-global-verity-digger-1237146180/"},{"label":"The Guardian — Digger’s projected loss analysis, Oct. 5","url":"https://www.theguardian.com/film/2026/oct/05/digger-may-lose-150m-after-tom-cruise-film-bombs-at-the-box-office"}]}]},"researchNotes":["Every incoming card received a retain/rewrite/replace disposition and fresh rank review against the Oct. 8 1:29 p.m. EDT 70-source audit; see card-disposition-review-oct8-final.json.","Compared Fox News, CNN and Drudge Report; Drudge is treated as an aggregator, not an independent reporting source.","Kramatorsk Reuters report supports at least 30 killed, not the prior headline’s 33; all casualty counts remain attributed.","Reuters direct source pages for Myanmar talks and GOP candidate distancing were re-fetched successfully after the earlier audit’s error pages.","MLB game-recap links and NHL Ovechkin source were replaced with accessible AP reporting; the Digger link was corrected to Deadline’s Oct. 5 worldwide box-office update.","CNN Markets dashboard displayed the specified 1:22:41 p.m. EDT Dow/Nasdaq quote and approximately 15-minute delay; Reuters and AP close reports are separately dated to Wednesday, Oct. 7.","Boston game-status check: October 8, 2026, 1:47:30 p.m. EDT Boston; Bruins–Utah and Celtics–Cleveland were both scheduled for 7 p.m. EDT; Red Sox and Patriots had no game that day.","Boston Globe access was partly paywalled; WEEI/Audacy direct article pages returned limited site chrome, so consequential facts were cross-checked against accessible sources where possible."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, or international soccer.',business:'7 unique business/markets stories; on trading days at 7 a.m. show timestamped indicative Dow and Nasdaq-100 futures, clearly not cash indexes; on weekends and market holidays state cash markets are closed and show no live/premarket snapshot, while identifying the latest completed session. At 10 a.m. and 1 p.m. on trading days show timestamped Dow and Nasdaq Composite cash-index levels, point and percentage moves, and any provider delay; at 4 p.m. show timestamped closing moves as confirmed or clearly preliminary; at 7 p.m. use confirmed closes.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
