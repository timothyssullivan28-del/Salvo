es American, Oct. 21","url":"https://www.reuters.com/world/europe/putin-hosts-trump-envoy-new-ukraine-peace-talks-frees-us-citizen-held-russia-2026-10-21/"},{"label":"AP — Witkoff-Putin talks, Oct. 21","url":"https://apnews.com/article/russia-ukraine-witkoff-putin-trump-zelenskyy-talks-3f00c0c6fd10bab948c2c3f8502e0a91"},{"label":"CNN — talks underway and Hubbard release, Oct. 21","url":"https://www.cnn.com/2026/10/21/europe/us-envoy-witkoff-putin-talks-russia-ukraine-intl"},{"label":"Fox News — Oct. 21 coverage index","url":"https://www.foxnews.com/html-sitemap/2026/october/21/"},{"label":"Drudge — aggregator homepage checked at 7 a.m. EDT","url":"https://www.drudgereport.com/"}]},{"id":"top-starlink-rubio-oct21","headline":"Rubio says Starlink access is Musk’s decision, not White House’s","summary":"Secretary of State Marco Rubio said a reported restriction on Ukraine’s military-grade Starlink access was Elon Musk’s decision rather than a White House order. Reuters reported the statement; the operational impact and SpaceX rationale remain disputed.","sources":["CNN","Drudge","Other"],"signal":"Split","links":[{"label":"Reuters — Rubio on Starlink decision, Oct. 21","url":"https://www.reuters.com/world/rubio-says-witkoff-zelenskiy-meeting-positive-ideas-be-discussed-with-russia-2026-10-21/"}]},{"id":"top-russia-ukraine-energy-oct21","headline":"Russia expands strikes on western Ukraine energy facilities","summary":"Russian forces widened attacks on energy infrastructure into western Ukraine, Reuters reported, as diplomacy resumed in St. Petersburg. Damage and casualty reports remain attributed to officials and local authorities.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"Reuters — attacks expand westward, updated Oct. 21","url":"https://www.reuters.com/business/energy/russia-expands-attacks-energy-facilities-western-ukraine-2026-10-20/"}]},{"id":"top-australia-haines-amputations-oct21","headline":"Australian lawmaker loses both legs after vehicle uctive-democracy-justice-kagan-says-2026-10-21/"}]},{"id":"usa-election-monitors-oct21","headline":"States prepare for surge of Justice Department election monitors","summary":"State officials are preparing for expanded federal election-monitor deployments ahead of the midterms, Reuters reported. The monitoring plans are prospective and do not establish misconduct.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — states prepare for election monitors, Oct. 21","url":"https://www.reuters.com/legal/government/monitoring-monitors-us-states-prepare-surge-justice-dept-election-watchers-2026-10-21/"}]},{"id":"usa-toyota-recall-oct21","headline":"Toyota recalls nearly 106,000 U.S. vehicles over fire risk","summary":"Toyota is recalling about 105,800 vehicles because a potential fuel leak could increase fire risk, NHTSA said. Owners should follow the automaker’s remedy instructions.","sources":["Other"],"signal":"Consensus","links":[{"label":"Reuters — Toyota recall and NHTSA notice, Oct. 21","url":"https://www.reuters.com/legal/litigation/toyota-recall-about-105800-us-vehicles-over-fire-risk-nhtsa-says-2026-10-21/"}]},{"id":"usa-memphis-ice-resolution-oct21","headline":"Memphis council calls for removal of ICE and National Guard","summary":"The Memphis City Council passed a resolution calling for federal immigration agents and the National Guard to leave the city. CNN documented residents’ objections; the resolution does not itself compel federal withdrawal.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"CNN — Memphis residents and council resolution, Oct. 21","url":"https://www.cnn.com/2026/10/21/us/video/we-are-not-animals-memphis-residents-speak-out-against-ice-digvid-vrtc-hnk"}]},{"id":"usa-delivery-robots-biometrics-oct21","headline":"Delivery robots face lawsuit over alleged face scanning","summary":"A complaint alleges delivery robots scanned customers’ faces and shared biometric data without proper consent. AP reported the case; the const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, international soccer, or WNBA coverage.',business:'7 unique business/markets stories refreshed only at 7 p.m. Eastern Monday through Friday, with independently confirmed figures for the latest completed U.S. cash session. Preserved unchanged at all other editions.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
</body></html>
