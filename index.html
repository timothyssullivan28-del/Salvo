<script id="briefing" type="application/json">{"date":"2026-11-28","lastUpdated":"November 28, 2026, 7:07:54 a.m. EST Boston","dek":"Saturday morning: Top News, USA, Boston Sports and Sports freshly researched and reranked. Business and The Big Picture retain Friday evening’s verified cards, original source dates, Tells and section freshness.","take":"Fox highlights Texas’s classroom religious-law fight, CNN leads with voter expectations and carries new Iowa water findings, while Drudge, an aggregator, emphasizes the reported Air Force breach. These are differing priorities, not a shared editorial verdict; legal claims and official military accounts remain attributed. The school-blast toll is a developing ministry account, and preliminary water results do not settle every exposure question.","sectionTakes":{"top":"Fox highlights Texas’s classroom religious-law fight, CNN leads with voter expectations and carries new Iowa water findings, while Drudge, an aggregator, emphasizes the reported Air Force breach. These are differing priorities, not a shared editorial verdict; legal claims and official military accounts remain attributed. The school-blast toll is a developing ministry account, and preliminary water results do not settle every exposure question.","usa":"Saturday’s rescheduled parade follows major logistical adjustments, while Puerto Rico’s protest and the classroom AI dispute highlight strains beyond holiday travel. The airport collision caused no reported injuries, and Mamdani’s recovery forecast remains attributed to City Hall. Criminal allegations and the NBC advertising dispute do not become adjudicated facts simply because they are reported.","boston":"All four teams are off Saturday; Friday’s Celtics 87–86 and Bruins 3–1 losses are FINAL. Pastrnak has no verified return timetable, Robinson is recovering from COVID, and four Patriots are OUT Sunday. Sox spending and prospect outlooks remain explicitly dated analysis, not fresh transactions.","business":  snapshot, not a current Saturday count. The National Weather Service still warned of coastal flooding from New Jersey to Virginia while the system weakened; improving conditions do not establish that every route is clear.","sources":["Other"],"signal":"Watch","links":[{"label":"apnews.com — Nov. 28, 2026, updated 12:38 a.m. EST; checked Saturday morning","url":"https://apnews.com/article/weather-storm-macys-flooding-thanksgiving-bbf9dad3076a69b9bd18b7c0c80490ad"}]},{"id":"story-n28m-1","headline":"EPA’s first Iowa water tests find no lead in 38 post-blast samples","summary":"EPA’s Saturday release and CNN report confirm the agency found no lead in 38 public-water-supply samples taken after Wednesday’s controlled lead-azide detonation. Air, soil, dust and additional water analyses remain part of a larger sampling program. These preliminary water findings are not a completed all-media exposure assessment or proof of no risk at every location.","sources":["CNN"],"signal":"Watch","links":[{"label":"cnn.com — Nov. 28, 2026, updated 2:08 a.m. EST; checked Saturday morning","url":"https://www.cnn.com/2026/11/28/us/test-results-lead-iowa-detonation-hnk"},{"label":"EPA — Nov. 28; primary release, preliminary water findings","url":"https://www.epa.gov/newsreleases/epa-releases-initial-water-source-lab-results-indicating-wednesdays-controlled"}]},{"id":"story-n28m-6","headline":"Reuters sources report breach of Air Force’s Cloud One platform","summary":"Reuters’s Nov. 27 investigation, linked by Drudge, says three people familiar with the matter described a breach discovered during system upgrades. Reuters could not establish the attackers, the full scope or whether data were stolen. The Air Force declined comment on specific systems; the report is not public confirmation of a quantified data theft.","sources":["Other"],"signal":"Watch","links":[{"label":"yahoo.com — Reuters, Nov. 27, 2026; corrected report; checked Saturday morning","url":"https://www.yahoo.com/news/us/articles/exclusive-hackers-breach-us-air-110252874.html"},{"label":"Drudge Report — aggregator framing checked Nov. 28 morning","url":"https://www.drudgereport.com/"}]},{"id":"story-n28m-4","headline":"CENTCOM says aircraft disabled merchant ship leaving Iranian port","summary":"AP reports the military said Thursday’s strike disabled the Palau-flagged Pacific Archer’s propulsion without injuring its civilian crew. Iran’s navy commander threatened operations against the blockade Friday. Those military claims and threats remain attributed; neither establishes a wider new offensive, a completed peace agreement or an end to the blockade.","sources":["Other"],"signal":"Watch","links":[{"label":"apnews.com — Nov. 27, 2026, updated 3:43 p.m. EST; checked Saturday morning","url":"https://apnews.com/article/iran-naval-blockade-us-military-disabled-ship-800620518a351282f098faa9381b3375"}]},{"id":"story-n27e-1","headline":"Zelenskyy challenges Trump’s Putin language and asks for more pressure","summary":"AP’s Friday report quotes Ukraine’s president objecting in a BBC interview to Trump calling Putin a friend. Trump defended the wording as an effort to make a deal, while the White House did not answer AP’s request on Zelenskyy’s remarks. These competing diplomatic positions are not evidence that a peace settlement has been reached.","sources":["Other"],"signal":"Watch","links":[{"label":"apnews.com — Nov. 27, 2026, updated 2:33 p.m. EST; checked Saturday morning","url":"https://apnews.com/article/russia-ukraine-war-zelenskyy-trump-putin-d891149b4cbd6521b83096a32bd5e53d"}]},{"id":"story-n27e-8","headline":"ACLU asks judge to halt subpoenas seeking anonymous ICE critics","summary":"AP reports the ACLU alleges a bad-faith effort to identify immigration-enforcement critics through grand-jury subpoenas. A Jan. 6 hearing is scheduled, with the administration’s written response due Dec. 14. The lawsuit’s allegations are not a final ruling that investigators acted unlawfully; the full investigation’s scope remains unclear.","sources":["Other"],"signal":"Watch","links":[{"label":"apnews.com — Nov. 27, 2026, updated 5:44 p.m. EST; checked Saturday morning","url":"https://apnews.com/article/trump-aclu-anonymous-ice-critics-social-media-5f2b57cdfd67d92b8eb6b810ca2607a0"}]},{"id":"story-n28m-7","headline":"Texas AG-elect says he will not defend classroom Ten Commandments law","summary":"Fox’s new Saturday report quotes Nathan Johnson’s Dallas Morning News interview saying the state’s future position will change when he takes office. The Supreme Court has not yet decided whether to review the challenge, according to the report. Johnson’s constitutional view is not a new Supreme Court ruling or proof the law has already been repealed.","sources":["Fox"],"signal":"Watch","links":[{"label":"foxnews.com — Nov. 28, 2026, 5:32 a.m. EST; visible article date verified; checked Saturday morning","url":"https://www.foxnews.com/politics/texas-attorney-general-elect-refuses-defend-ten-commandments-classroom-law"}]},{"id":"story-n28m-5","headline":"AR-15 ban cases head toward Wednesday Supreme Court arguments","summary":"CNN’s Friday report previews arguments over Connecticut and Cook County restrictions on Dec. 2. The parties dispute how constitutional protections apply to commonly owned semiautomatic rifles and public-safety limits. This remains an upcoming hearing, not a merits decision striking down or upholding the bans.","sources":["CNN"],"signal":"Watch","links":[{"label":"cnn.com — Nov. 27, 2026, 6 a.m. EST; checked Saturday morning","url":"https://www.cnn.com/2026/11/27/politics/supreme-court-ar-15-ban-second-amendment"}]},{"id":"story-n28m-3","headline":"New CNN voter-poll analysis finds different priorities within Democratic coalition","summary":"CNN’s Saturday analysis of newly finalized SSRS voter-poll data finds Democratic House voters divided between democracy and the economy as their top issue. The survey ran Oct. 19–Nov. 3 among approximately 100,000 voters nationally; subgroup uncertainty is larger than the full-sample margin. These are measured voter attitudes, not certified seat totals or a new election projection.","sources":["CNN"],"signal":"Watch","links":[{"label":"cnn.com — Nov. 28, 2026, 5 a.m. EST; checked Saturday morning","url":"https://www.cnn.com/2026/11/28/politics/democratic-voters-congress-cnn-polls-midterms"}]}],"usa":[{"id":"story-n28m-12","headline":"Postponed 100th Macy’s parade prepares to step off Saturday","summary":"AP’s late-Friday update says organizers expect the original balloons and floats and most performers, plus LL Cool J and Gloria Gaynor. Organizers estimate 90–95% of bands, performance groups and celebrity talent adjusted their plans. This morning’s briefing treats the parade as scheduled, not already completed, after its first weather postponement.","sources":["Other"],"signal":"Watch","links":[{"label":"apnews.com — Nov. 27, 2026, updated 8:28 p.m. EST; checked Saturday morning","url":"https://apnews.com/article/macys-thanksgiving-day-parade-rescheduled-ba6b05f16873b2b8966de38d5be8444d"}]},{"id":"story-n28m-11","headline":"Thousands protest electricity rates and deteriorating services in Puerto Rico","summary":"AP documents Friday’s San Juan demonstration organized by roughly 30 groups, including unions and religious organizations. Participants protested living costs, unreliable utilities and basic services. Their demands and descriptions of hardship are not evidence that the government has enacted a rate cut or agreed to every requested policy change.","sources":["Other"],"signal":"Watch","links":[{"label":"apnews.com — Nov. 27, 2026, updated 4:57 p.m. EST; checked Saturday morning","url":"https://apnews.com/article/puerto-rico-protest-water-power-luma-san-juan-282de19fa396ef0c8bcf276499486578"}]},{"id":"story-n28m-10","headline":"FAA investigates two American jets clipping wings at Reagan National","summary":"CNN’s Friday-night update says two Boeing 737s made contact while AI Overview as districts debate whether Google can separate education search from generative-AI tools. The district’s move and parents’ accounts show a live classroom-policy dispute. This is not a nationwide ban on Google, a completed contract termination by every district or proof AI’s learning effects are settled.","sources":["Other"],"signal":"Watch","links":[{"label":"apnews.com — Nov. 27, 2026, updated 2:46 p.m. EST; checked Saturday morning","url":"https://apnews.com/article/google-artificial-intelligence-schools-search-engine-lausd-762a613b11bd316384430112cc223ed1"}]},{"id":"story-n28m-13","headline":"Omaha police accuse French visitor in daycare worker’s killing","summary":"Fox’s Saturday report quotes police saying Terry Kanmacher traveled to Nebraska before Lauren Becker was fatally stabbed Tuesday. Authorities say he was arrested at Minneapolis–Saint Paul airport and awaits extradition. The police account and accusations are attributed; they are not a conviction or an independently inspected finding about prior warning signs.","sources":["Fox"],"signal":"Watch","links":[{"label":"foxnews.com — Nov. 28, 2026, 6 a.m. EST; visible article date verified; checked Saturday morning","url":"https://www.foxnews.com/us/french-man-accused-flying-us-murder-woman-one-date-3-years-earlier"}]},{"id":"story-n27e-11","headline":"California’s coming seat-belt fit test changes booster-seat rules","summary":"Fox’s Friday report says AB 435 requires children ages 8–15 to meet five seat-belt-fit criteria before riding without a booster under the coming rule. It describes posture, belt placement and maintaining that position throughout a trip. The policy is not a blanket requirement that every 15-year-old use a booster; the original statute was not independently inspected this morning.","sources":["Fox"],"signal":"Watch","links":[{"label":"foxnews.com — Nov. 27, 2026, 4:50 p.m. EST; visible article date verified; checked Saturday morning","url":"https://www.foxnews.com/politics/california-law-keep-teens-booster-seats-age-16-unless-pass-test"}]},{"id":"story-n27e-16","headline":"Fox reports NBC pulled Israel-aid ad after advocacy-group backlash","summary":"Fox says it confirmed NBC removed the IMEU Policy Project advertisement that aired during Wednesday’s Thanksgiving SNL special. The ad’s claims and critics’ accusations of antisemitism reflect opposing advocacy positions. The removal is reported as Fox’s confirmation, not an independently reviewed regulatory finding or a settlement of the ad’s underlying claims.","sources":["Fox"],"signal":"Watch","links":[{"label":"foxnews.com — Nov. 27, 2026, 5:30 p.m. EST; visible article date verified; checked Saturday morning","url":"https://www.foxnews.com/media/nbc-pulls-controversial-anti-israel-ad-after-igniting-fury-from-jewish-groups"}]},{"id":"story-n28m-9","headline":"USC marching band loses field performances after vandalism allegations","summary":"AP reports USC barred its band’s pregame and halftime performances at Saturday’s UCLA game following alleged campus vandalism involving some members. Most of the band may still play from the stands, while identified students face separate restrictions. The university’s response is confirmed reporting; individual culpability and the full damage remain under investigation.","sources":["Other"],"signal":"Watch","links":[{"label":"apnews.com — Nov. 27, 2026, updated 6:37 p.m. EST; checked Saturday morning","url":"https://apnews.com/article/usc-ucla-marching-band-prank-3dce362283693f54d2ab2c803e235c53"}]}],"boston":[{"id":"story-n28m-14","headline":"Saturday Boston: all four off; Hawks 87–86 and Leafs 3–1 are FINAL","summary":"No Saturday game for the Celtics, Bruins or Patriots; Red Sox remain in the offseason. Friday FINAL: Atlanta beat Celtics 87–86; Toronto beat Bruins 3–1. Sunday UPCOMING, all EST: Celtics at San Antonio 4 p.m.; Patriots at Chargers 4:05 p.m.; Vancouver at Bruins 5 p.m. These are fixtures, not live games this morning.","sources":["Other"],"signal":"Watch","links":[{"label":"espn.com — Nov. 28 morning; checked schedules and Friday finals; checked Saturday morning","url":"https://www.espn.com/nba/team/schedule/_/name/bos"},{"label":"ESPN — Friday 3–1 FINAL; Sunday 5 p.m. EST","url":"https://www.espn.com/nhl/team/schedule/_/name/bos"},{"label":"Bruins — Nov. 27; official final","url":"https://www.nhl.com/bruins/news/bruins-drop-game-3-1-to-maple-leafs-stay-positive-and-move-forward"},{"label":"NBA — Sunday 4 p.m. EST schedule; future Loss labels disregarded","url":"https://www.nba.com/celtics/schedule"},{"label":"Patriots — Sunday Nov. 29, 4:05 p.m. EST","url":"https://www.patriots.com/schedule/"},{"label":"MLB — offseason ledger checked Nov. 28","url":"https://www.mlb.com/redsox/roster/transactions"}]},{"id":"story-n27e-17","headline":"Pastrnak’s lower-body injury awaits testing update, not a timetable","summary":"Globe’s Friday report and the official Bruins recap confirm the captain left the first period and did not return. Sturm said he was undergoing tests and hoped to know more Saturday. No new Saturday diagnosis or return timetable was verified in the checked sources; teammates’ optimism is not medical clearance.","sources":["Other"],"signal":"Watch","links":[{"label":"bostonglobe.com — Nov. 27, 2026; injury report rechecked Saturday; checked Saturday morning","url":"https://www.bostonglobe.com/2026/11/27/sports/david-pastrnak-injury-bruins/"},{"label":"Bruins — Nov. 27; testing pending, no timetable","url":"https://www.nhl.com/bruins/news/bruins-drop-game-3-1-to-maple-leafs-stay-positive-and-move-forward"}]},{"id":"story-n28m-17","headline":"Celtics’ 26 turnovers turn group-title chance into 87–86 loss","summary":"Globe and AP’s recap confirm Boston squandered a 15-point second-half lead Friday and scored only 35 after halftime. Atlanta won the group on the head-to-head result; Boston advances as a wild card and visits Detroit in the Cup quarterfinals. Tatum’s late turnover and the tea
