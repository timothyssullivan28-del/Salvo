<script id="briefing" type="application/json">{"date":"2026-10-01","lastUpdated":"October 1, 2026, 10:20:07 a.m. EDT Boston","dek":"Thursday, Oct. 1 — 10 a.m. Eastern edition; live cash-market snapshot, completed Sept. 30 close, and checked Boston schedules. Updated October 1, 2026, 10:20:07 a.m. EDT Boston.","take":"Russian attacks in Ukraine and the Flydubai cockpit assault dominate a morning of serious incidents, while the Supreme Court agreed to review the administration’s bondless detention policy. Fox emphasizes the security and alleged-hijacking angle of Flydubai; CNN centers passenger and pilot accounts and the unresolved motive, while both report the plane landed safely. Drudge is an aggregator, not an independent reporting source; its packaging leans into security and politics.","sectionTakes":{"top":"Russian attacks in Ukraine and the Flydubai cockpit assault dominate a morning of serious incidents, while the Supreme Court agreed to review the administration’s bondless detention policy. Fox emphasizes the security and alleged-hijacking angle of Flydubai; CNN centers passenger and pilot accounts and the unresolved motive, while both report the plane landed safely. Drudge is an aggregator, not an independent reporting source; its packaging leans into security and politics.","usa":"The domestic docket ranges from a second injunction against the $100,000 H-1B fee to a suspected China-linked email-impersonation campaign and a six-state funding lawsuit. The Texas Capitol plot, Ole Miss deaths and measles-associated fatality remain attributed allegations or official reports, while the sleep study identifies patterns rather than individual causes.","boston":"The Red Sox were eliminated after Wednesday’s 9–2 loss, and the Bruins, Patriots and Celtics have no game today. Boston’s next listed games are the Bruins at Winnipeg Friday at 8 p.m. EDT, Patriots at Buffalo Sunday at 1 p.m. EDT, and Celtics preseason at Cleveland Oct. 8; Boston College visits SMU Saturday a aine-strikes-oct1","headline":"Oct. 1: Russian missile and drone barrage kills seven in Ukraine and hits energy infrastructure","summary":"Ukrainian President Volodymyr Zelenskyy said seven people, including a child, were killed and energy infrastructure was hit; AP and Reuters reported the casualty and damage claims while attributing details to officials. The overnight attack adds pressure to power supplies, with damage assessments ongoing.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — overnight Russian attack toll and power damage, Oct. 1","url":"https://apnews.com/article/ucrania-guerra-rusia-bombardeo-48be5929c12a30c8ee01ef95c28e78e6"},{"label":"Reuters — Kyiv and Odesa officials report injuries, Oct. 1","url":"https://www.reuters.com/world/europe/russian-air-strikes-injure-two-ukraines-kyiv-odesa-officials-say-2026-10-01/"}]},{"id":"top-flydubai-investigation-oct1","headline":"Oct. 1 update: UAE and Israel investigate Flydubai cockpit assault after passengers intervene","summary":"Reuters and CNN report that passengers helped stop a co-pilot who allegedly stabbed the captain on a Dubai–Tel Aviv flight; all 174 passengers reached Israel safely after diversion. Israel’s airlines now plan to resume Dubai flights, but motive and the suspect’s intent remain unresolved as authorities investigate.","sources":["Fox","CNN","Drudge","Other"],"signal":"Consensus","links":[{"label":"Reuters — UAE and Israel investigation, Oct. 1","url":"https://www.reuters.com/world/middle-east/israel-vows-get-root-flydubai-attack-uae-launches-investigation-2026-10-01/"},{"label":"CNN — passenger and pilot accounts, updated Oct. 1","url":"https://www.cnn.com/2026/10/01/world/live-news/flydubai-flight-israel-pilot-passengers-intl"},{"label":"Fox News — security-focused live coverage, Oct. 1","url":"https://www.foxnews.com/live-news/flydubai-flight-hijacking-israel-tel-aviv-10-1-26"},{"label":"Drudge Report — aggregator front page, Oct. 1","url":"https://www.drudgereport.com/"}]},{"id":"top-supreme-court-detention-oct1","headline":"Oct. 1: Supreme Court agrees to hear challenge to mandatory immigration detention without bond","summary":"The Court agreed to review the administration’s policy of holding many people in the United States illegally during deportation proceedings without bond hearings. The ruling to take up the case is not a decision on the policy’s legality; arguments and a final ruling remain ahead.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — Court agrees to hear detention-policy dispute, Oct. 1","url":"https://www.reuters.com/world/us-supreme-court-hear-clash-over-trumps-immigration-detention-policy-2026-10-01/"},{"label":"CNN — Court to decide bondless detention question, Oct. 1","url":"https://www.cnn.com/2026/10/01/politics/supreme-court-trump-ice-migrants-detention-without-bond"}]},{"id":"top-catalina-crash-oct1","headline":"Oct. 1: Medevac helicopter crash off Catalina leaves two dead, two injured and one missing","summary":"Five people were aboard the helicopter that crashed into the Pacific off Southern California Wednesday evening. AP reported two deaths, two people hospitalized and one still missing; search efforts and the cause investigation continue.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — Catalina-area helicopter crash, Oct. 1","url":"https://apnews.com/article/california-los-angeles-helicopter-crash-accident-1be07d50b5154918d740d7308dbc3171"},{"label":"CNN — updated casualty report, Oct. 1","url":"https://www.cnn.com/2026/10/01/us/catalina-island-medical-helicopter-crash-hnk"}]},{"id":"top-pike-failed-execution-oct1","headline":"Oct. 1 update: Tennessee halts Christa Pike execution after two lethal-injection doses fail","summary":"Tennessee stopped the Sept. 30 execution attempt after two rounds of its injection protocol did not render Pike unconscious; she was taken for medical care, according to witnesses and her lawyers. Gov. Bill Lee suspended the state’s remain learing Paramount–Warner Bros. merger; Oct. 6 close planned","summary":"A federal judge approved a settlement with state attorneys general, removing a legal obstacle to Paramount’s proposed Warner Bros. Discovery takeover. The companies plan to close Oct. 6, but the transaction is not yet complete and faces continuing scrutiny.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — settlement approval and tentative close date, Oct. 1","url":"https://variety.com/2026/film/news/paramount-warner-bros-merger-judge-approves-settlement-ags-1236893467/"}]},{"id":"entertainment-sia-catalog-sale-oct1","headline":"Oct. 1: Sia sells 50% stake in her music catalog for $180 million","summary":"Rolling Stone reports Sia sold a half-share of her catalog for $180 million. The transaction is reported as a completed sale; its longer-term effect on the artist’s royalties is not disclosed.","sources":["Other"],"signal":"Watch","links":[{"label":"Rolling Stone — Sia catalog transaction, Oct. 1","url":"https://www.rollingstone.com/music/music-news/sia-sells-50-percent-catalogue-180-million-1235635118/"}]},{"id":"entertainment-starz-verizon-blackout-oct1","headline":"Oct. 1: Starz goes dark on Verizon Fios as carriage negotiations stall","summary":"Variety reports Starz channels and on-demand service were blacked out for Verizon Fios customers after distribution talks failed to produce an agreement. Both companies faulted the other; the dispute is ongoing, and no new deal was confirmed in the report.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — Starz blackout and carriage dispute, Oct. 1","url":"https://variety.com/2026/tv/news/starz-verizon-fios-negotiations-blacked-out-tonight-1236894418/"},{"label":"Starz — statement on Verizon negotiations, Sept. 30","url":"https://investors.starz.com/news-releases/news-release-details/verizon-fios-customers-may-lose-starz"}]},{"id":"entertainment-east-of-eden-netflix-oct1","headline":"Oct. 1: Netflix releases Zoe Kazan’s “East of Eden” adaptation starring Florence Pugh","summary":"The new adaptation arrives on Netflix today, with reviews published alongside its release. The title joins the service’s October slate; reception and viewership remain to be seen.","sources":["Other"],"signal":"Watch","links":[{"label":"The Hollywood Reporter — “East of Eden” review, Oct. 1","url":"https://www.hollywoodreporter.com/tv/tv-reviews/east-of-eden-review-florence-pugh-netflix-mike-faist-1236717464/"}]},{"id":"entertainment-jani-be-good-trailer-oct1","headline":"Oct. 1: Ariani Darmawan returns with “Jani Be Good” ahead of Tokyo premiere","summary":"Variety reports the Indonesian filmmaker’s new feature is headed to the Tokyo International Film Festival after a long gap between projects. The announcement covers a festival selection, not a theatrical release date.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — trailer and festival premiere, Oct. 1","url":"https://variety.com/2026/film/news/jani-be-good-trailer-indonesian-director-returns-15-years-1236893464/"}]},{"id":"entertainment-manchevski-tokyo-premiere-oct1","headline":"Oct. 1: Milcho Manchevski’s “Sister Brother Manhole Cover” heads to Tokyo competition","summary":"The film has been selected for the Tokyo festival competition, according to Variety. The selection is confirmed; the festival result and wider distribution plans remain unknown.","sources":["Other"],"signal":"Watch","links":[{"label":"Variety — Tokyo selection and trailer, Oct. 1","url":"https://variety.com/2026/film/festivals/golden-lion-winner-sister-brother-manhole-cover-tokyo-1236893474/"}]},{"id":"entertainment-tiler-peck-west-end-oct1","headline":"Oct. 1: Ballet star Tiler Peck to make West End debut in “Little Dancer”","summary":"Variety reports Peck will make her West End debut in the musical. The casting is an announced production plan; premiere timing and the show’s longer run remain subject to production schedules.","sources":["Other"],"signal": <script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'Boston-area professional and major-college sports only.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, or international soccer.',business:'7 unique business/markets stories; at 7 a.m. show timestamped indicative Dow and Nasdaq-100 futures, clearly not cash indexes; at 10 a.m. and 1 p.m. show timestamped Dow and Nasdaq Composite cash-index levels, point and percentage moves, and any provider delay; at 4 p.m. show timestamped closing moves as confirmed or clearly preliminary; at 7 p.m. use confirmed closes; state the date of the latest completed U.S. cash session.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
