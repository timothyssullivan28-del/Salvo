de concerns that a security vacuum could empower Iran-backed militias or Islamic State; those consequences remain an assessment, not an established outcome.","sources":["Fox","CNN","Other"],"signal":"Consensus","links":[{"label":"Reuters — Sept. 30 report","url":"https://www.reuters.com/world/us/us-forces-exit-iraq-emboldening-irans-proxies-islamic-state-2026-09-30/"},{"label":"CNN — Sept. 30","url":"https://www.cnn.com/2026/09/30/middleeast/us-military-withdrawal-iraq-intl"},{"label":"Fox News — Sept. 30","url":"https://www.foxnews.com/world/us-ends-operation-inherent-resolve-mission-iraq-final-forces-leave-erbil"}]},{"id":"top-flydubai-diversion-sept30","headline":"UPDATED Sept. 30, 9:54 a.m. EDT: Israeli officials say FlyDubai cockpit incident may be attempted terror attack","summary":"The Dubai–Tel Aviv flight diverted to Saudi Arabia and landed safely. Reuters reports Israeli officials now say the incident may have been an attempted terror attack, while earlier officials said it was not a hijacking; Drudge’s banner repeats a co-pilot-stabbing allegation attributed to the New York Post, not an independently established fact.","sources":["CNN","Fox","Drudge","Other"],"signal":"Split","links":[{"label":"CNN — live coverage updated 9:54 a.m. EDT","url":"https://www.cnn.com/2026/09/30/world/live-news/dubai-israel-plane-flydubai-intl"},{"label":"Reuters — Israeli official characterization","url":"https://www.reuters.com/world/middle-east/diverted-flydubai-flight-israel-was-not-hijacking-incident-israeli-prime-2026-09-30/"},{"label":"AP — live updates","url":"https://apnews.com/live/israel-dubai-flight-pilots-flydubai"},{"label":"Drudge Report — aggregator banner","url":"https://www.drudgereport.com/"},{"label":"New York Post — reported stabbing claim","url":"https://nypost.com/2026/09/30/world-news/israel-bound-plane-makes-emergency-landing-in-saudi-arabia-after-pilots-brawl-sparks-hijacking-fears-reports/"},{"label":"Fox News — Sept. 30","url":"https://www.foxnews.com/world/flydubai-pilots-reportedly-fight-cockpit-triggering-hijacking-fears-israeli-fighter-jet-response"}]},{"id":"top-ukraine-energy-strike-sept30","headline":"Sept. 30: Russian overnight strikes hit Kyiv-area energy facilities; casualty reports remain attributed","summary":"Reuters reports Russian drones and missiles hit energy infrastructure as Ukraine prepares for winter. President Volodymyr Zelenskyy said five people, including a child, were killed nationwide; casualty counts are official claims and reporting is still developing.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — Sept. 30","url":"https://www.reuters.com/world/europe/russian-air-strikes-kill-one-injure-five-around-kyiv-officials-say-2026-09-30/"},{"label":"The Washington Post — Sept. 30","url":"https://www.washingtonpost.com/world/2026/09/30/kyiv-wakes-up-fog-war-strikes-set-off-unusual-meteorological-effect/"}]},{"id":"top-iran-us-response-sept30","headline":"Sept. 30: Iran says it has received U.S. response to ceasefire proposal","summary":"Iran’s government says a U.S. response to its proposal was conveyed through Qatar, after President Trump said he rejected the latest offer. Reuters reports the sides may agree on steps but disagree on their order; no ceasefire agreement has been reached.","sources":["Other"],"signal":"Split","links":[{"label":"Reuters, Sept. 30","url":"https://www.reuters.com/world/us/iran-appeals-us-voters-american-troops-leave-iraq-2026-09-30/"},{"label":"AP, Sept. 30","url":"https://www.messenger-inquirer.com/ap/elections/iran-tells-the-us-public-that-trumps-war-has-failed-and-other-mideast-developments/article_7f49c8cb-b05d-5d1e-a08d-4411e0df5f13.html"}]},{"id":"top-gaza-strikes-sept30","headline":"Sept. 30: Israeli strikes kill five in Gaza, medics say","summary":"Reuters reports Gaza medics said strikes killed five people, including four in a vehicle and one woman elsewhere, and wounded 14. Casualties are attributed to medical officials; the parties’ accounts and the wider ceasefire situation remain contested.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters, Sept. 30","url":"https://www.reuters.com/world/middle-east/israeli-strikes-kill-five-people-gaza-medics-say-2026-09-30/"}]},{"id":"top-polo-southwest-update","headline":"Updated Sept. 30: Hurricane Polo remnants bring more rain to flood-hit U.S. Southwest","summary":"The weakened storm is bringing additional rain to communities already hit by flooding after crossing Baja California. AP reports ongoing hazards; forecasts are not a confirmed final damage or casualty toll.","sources":["Other"],"signal":"Watch","links":[{"label":"AP, Sept. 30","url":"https://apnews.com/article/hurricane-polo-landfall-mexico-baja-california-rachel-db57554d97c70cd44b99df9ff0a41668"},{"label":"NPR, Sept. 30","url":"https://www.npr.org/2026/09/30/g-s1-145590/hurricane-polo-us-southwest"}]},{"id":"top-ai-accord-sept29","headline":"Sept. 29: Trump and six tech CEOs publish voluntary AI safety accord","summary":"Reuters reports President Trump and leaders of Google, Anthropic, Meta, OpenAI, X and NVIDIA signed a one-page accord calling for internal controls, outside assessment and board oversight. It is voluntary, not a law; coverage agrees on the pact but differs over its enforceability and safety implications.","sources":["Fox","CNN","Drudge","Other"],"signal":"Split","links":[{"label":"Reuters, Sept. 29","url":"https://www.reuters.com/world/us/trump-releases-ai-accord-with-tech-executives-2026-09-29/"},{"label":"AP, Sept. 29","url":"https://apnews.com/article/trump-ai-anthropic-musk-595796511f110fc006cca0d01329733e"},{"label":"CNN, Sept. 29","url":"https://www.cnn.com/2026/09/29/business/amodei-huang-karp-trump"},{"label":"Fox News, Sept. 29","url":"https://www.foxnews.com/live-news/trump-ai-white-house-meeting-september-29"},{"label":"Drudge Report, aggregator","url":"https://www.drudgereport.com/"}]},{"id":"top-sc-third-country-deportations","headline":"Sept. 29: Supreme Court interim order lets third-country deportations resume while challenge continues","summary":"The Supreme Court temporarily paused a lower-court order, allowing the administration to resume deportations to countries other than migrants’ own while the justices consider whether the policy is lawful. The order is interim, not a final ruling on the policy.","sources":["Other"],"signal":"Watch","links":[{"label":"AP via PBS NewsHour, Sept. 29, 3:31 p.m. EDT","url":"https://www.pbs.org/newshour/politics/supreme-court-lets-trump-continue-deporting-people-to-3rd-countries-while-justices-consider-policy"},{"label":"Reuters, Sept. 29","url":"https://www.yahoo.com/news/politics/articles/supreme-court-lets-trump-resume-190857993.html"}]},{"id":"top-eisenhower-carrier-mishap","headline":"Updated Sept. 29: Navy jet crashes into Atlantic after reported equipment failure; two aviators eject","summary":"The Navy said an aircraft crashed into the Atlantic during carrier operations off Virginia after an equipment failure; two aviators ejected and four sailors were injured. AP and CNN report an investigation is underway, so the cause remains under inquiry.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"AP live update, Sept. 29, 2:10 p.m. EDT","url":"https://apnews.com/live/trump-cnn-media-midterm-elections-news-updates-09-29-2026#000001a0-ee3f-d4c3-afe0-feff5aa20000"},{"label":"CNN, Sept. 29","url":"https://www.cnn.com/2026/09/29/politics/aircraft-carrier-eisenhower-accident-hnk-ml"}]},{"id":"top-unhcr-funding-gap","headline":"Sept. 29: UNHCR warns funding shortfall could put 8.3 million people at risk of losing aid","summary":"The U.N. refugee agency says a $5.789 billion shortfall could put nearly 8.3 million refugees and forcibly displaced people at risk of losing assistance this year. That is the agency’s projection, as reported by Reuters, not a confirmed aid cut for each person.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters, Sept. 29","url":"https://www.reuters.com/world/un-agency-warns-funding-crisis-could-leave-83-million-people-without-aid-2026-09-29/"}]}],"usa":[{"id":"usa-fbi-shinyhunters-arrest","headline":"Updated Sept. 30: Dutch authorities arrest alleged ShinyHunters leader after FBI employee-data breach","summary":"NBC and Reuters report the FBI publicly urged the hacking group to contact the bureau after employee information was taken from a jobs site; Dutch authorities have since arrested an alleged leader. The suspect’s role and breach consequences remain allegations pending proceedings.","sources":["Other"],"signal":"Watch","links":[{"label":"NBC News, Sept. 29–30","url":"https://www.nbcnews.com/tech/security/fbi-warns-shinyhunters-crime-group-hacked-agent-data-arrest-rcna600480"},{"label":"Reuters, Sept. 29","url":"https://www.reuters.com/world/us/fbi-official-tells-shinyhunters-hackers-we-know-how-find-you-following-dutch-2026-09-29/"}]},{"id":"usa-supreme-court-new-term-docket","headline":"Sept. 29: Supreme Court weighs new-term cases on detention, prediction markets and school displays","summary":"Reuters reports the justices are considering whether to add cases involving Trump-era immigration detention, state regulation of prediction markets and a Texas Ten Commandments law to the term beginning next week. These are possible docket additions, not rulings on the merits.","links":[{"label":"Reuters, Sept. 29","url":"https://www.reuters.com/legal/government/us-supreme-court-mulls-immigrant-detention-gambling-ten-commandments-cases-2026-09-29/"}],"signal":"Watch","sources":["Other"]},{"id":"usa-us-withdraws-greco-sept29","headline":"Sept. 29: Trump administration withdraws U.S. from European anti-corruption watchdog GRECO","summary":"The Council of Europe said the United States formally notified it that it would leave the Group of States against Corruption; a U.S. official confirmed the withdrawal, AP reports. The move fits the administration’s wider retreat from some multilateral organizations.","sources":["Other"],"signal":"Watch","links":[{"label":"AP via ABC News, Sept. 29, 4:39 p.m. EDT","url":"https://abcnews.com/US/wireStory/us-withdraws-european-anti-corruption-panel-latest-shift-136870520"},{"label":"AP, Sept. 29","url":"https://apnews.com/article/trump-corruption-council-of-europe-31f7f0e4bba7bf26dfc99cd2c3a20d16"}]},{"id":"usa-gdp-q2-sept30","headline":"Sept. 30: U.S. second-quarter GDP estimate raised to 2.2%","summary":"The Commerce Department’s third estimate put annualized Q2 growth at 2.2%, up from the previous 1.5% estimate, with consumer spending and business investment contributing. This is a completed data revision, not a forecast for the current quarter.","sources":["Other"],"signal":"Consensus","links":[{"label":"Reuters — Sept. 30","url":"https://www.reuters.com/world/us/us-second-quarter-gdp-revised-higher-amid-robust-consumer-spending-2026-09-30/"},{"label":"AP — Sept. 30","url":"https://ca.finance.yahoo.com/news/us-economy-grew-solid-2-124517913.html"}]},{"id":"usa-trade-court-forced-labor-sept30","headline":"Sept. 30: Trade court hears challenge to forced-labor tariffs on imports from 60 partners","summary":"The U.S. Court of International Trade is hearing states’ and businesses’ challenge to tariffs imposed on goods from 60 trading partners. The government argues the duties address forced-labor concerns; opponents say the policy revives tariff powers the Supreme Court struck down, and the court has not ruled.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — Sept. 30","url":"https://www.reuters.com/world/us/us-trade-court-weigh-challenge-trumps-forced-labor-tariffs-2026-09-30/"}]},{"id":"usa-adp-private-jobs-sept30","headline":"Sept. 30: ADP says private employers added 90,000 jobs in September","summary":"ADP reported a 90,000 increase in private payrolls, up from a revised 36,000 in August and above the 70,000 forecast cited in its report. It is a private-sector measure, not the government’ 0/"}]},{"id":"entertainment-endgame-boxoffice-sept30","headline":"Sept. 30: “Avengers: Endgame” returns to box-office top spot in re-release","summary":"AP reports that the encore release of “Avengers: Endgame” reclaimed the box-office crown, while Robert Pattinson’s “Primetime” also drew sales. The report describes current theatrical performance; it does not change either film’s release history.","sources":["Other"],"signal":"Consensus","links":[{"label":"AP — Sept. 30","url":"https://apnews.com/article/box-office-avengers-endgame-resident-evil-primetime-5fedc5f84142d1a36fe28ae22f738c47"}]},{"id":"entertainment-ted-lasso-anthony-head-tribute","headline":"Sept. 30: “Ted Lasso” episode pays tribute to Anthony Head","summary":"Deadline reports the series’ latest episode included a tribute to the actor, explaining the choice in connection with the show. The episode is available; this is not a casting or renewal announcement.","sources":["Other"],"signal":"Watch","links":[{"label":"Deadline, Sept. 30","url":"https://www.yahoo.com/entertainment/tv/articles/ted-lasso-pays-tribute-anthony-070000736.html"}]},{"id":"entertainment-swift-attacker-privacy-ruling","headline":"Sept. 30: Man accused in Taylor Swift concert plot loses privacy case against Disney","summary":"Reuters reports a court rejected a privacy claim brought by a man accused of a planned attack at a Swift concert. The court outcome concerns privacy rights and does not replace any criminal findings.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters, Sept. 30","url":"https://www.reuters.com/world/would-be-taylor-swift-concert-attacker-loses-privacy-case-against-disney-2026-09-30/"}]}]},"researchNotes":["Fresh public-web research run for Wednesday, Sept. 30, 2026; edition reprioritized across all eight tabs against the 7 a.m. edition, favoring Sept. 30 developments and explicitly dating prior-day items retained for continuing importance.","Top comparison checked Fox News, CNN and Drudge Report; CNN <script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'Boston-area professional and major-college sports only.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, or international soccer.',business:'7 unique business/markets stories; 10 a.m. and 1 p.m. show timestamped live Dow and Nasdaq Composite moves; close figures refer to the latest completed U.S. session.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
