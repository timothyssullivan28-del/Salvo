<script id="briefing" type="application/json">{"date":"2026-10-25","lastUpdated":"October 25, 2026, 7:06:43 a.m. EDT Boston","dek":"Sunday limited refresh: Top News, USA, Boston Sports and Sports re-ranked; Business, World, Politics and Entertainment retain Friday’s verified edition and original source dates.","take":"Satellite restrictions, Iranian revenue pressure and U.S. election disputes lead alongside the Tallahassee shooting and flooding. Fox emphasizes Iran’s economic vulnerability, CNN explains the PHP security risk and Alaska intervention, while Drudge foregrounds Iranian threat warnings; coverage converges on security risks but differs in emphasis. Drudge is an aggregator, not an independent reporting source, and forecasts, charges and official counts remain attributed.","sectionTakes":{"top":"Satellite restrictions, Iranian revenue pressure and U.S. election disputes lead alongside the Tallahassee shooting and flooding. Fox emphasizes Iran’s economic vulnerability, CNN explains the PHP security risk and Alaska intervention, while Drudge foregrounds Iranian threat warnings; coverage converges on security risks but differs in emphasis. Drudge is an aggregator, not an independent reporting source, and forecasts, charges and official counts remain attributed.","usa":"An immigration-vehicle investigation, upcoming trafficking sentencing and the Iowa plant fire lead the domestic slate. Redistricting and federal evidence disputes remain consequential; Audi’s factory and transit automation are plans, while older health and park-history reporting keeps its actual source dates.","boston":"The Bruins’ 6–4 win is final, and all four teams are off Sunday; Boston basketball resumes Monday and hockey Tuesday. Hagens’ development, the Patriots’ mini-bye questions and Red Sox staffing needs lead substantive coverage. Globe access remained partly paywalled; WEEI/Audacy hubs were checked but fresh full article text was limited.","business":"CONFIRMED Friday, Oct. 23 close: Dow 52,215.16, down 652.82 points (−1.23%), and Nasdaq Composite 25,955.34, down 53.52 (−0.21%). AP and Reuters independently match levels and point moves, with Reuters providing precise percentages. Higher oil pressured stocks while Amex’s job-cut plan, selective tariff relief and Citi’s China approval show company and policy crosscurrents.","world":"France’s security preparations, a Black Sea shipping attack and Nairobi’s building collapse lead the international slate. Official casualty figures remain attributed, family contact is not an independent medical assessment, and Serbia and Bulgaria face elections rather than completed political transitions.","sports":"Milwaukee’s 5–4 comeback makes it a 2–0 World Series lead, not a championship. UCF and Cincinnati delivered completed upsets, N.C. State changed coaches, and availability setbacks shape the NFL and NBA outlook.","politics":"Texas competition, Ohio’s divisive ad and targeted Democratic outreach show campaigns fighting for the final stretch. Allegations involving Omar and Lewandowski remain unresolved, polls are not results, and Trump’s Cuba rhetoric is not confirmation of military action.","entertainment":"Legend’s new album, the completed Coppola documentary and “Rent” anniversary lead the culture refresh. Residencies and Raffi’s reflections show changing performance habits, while Skerritt’s death and BioWare’s closure remain consequential losses."},"sections":{"top":[{"id":"top-starlink-oct25","headline":"Musk acknowledges throttling Starlink as Ukraine says service is restored","summary":"Musk says SpaceX restricted Starlink because it was being used for offensive strikes; he says Washington controls changes to the separate Starshield service. Zelenskyy says both links have returned to adequate speeds. AP reports the competing explanations; restoration does not resolve who ordered every military-network restriction.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/russia-ukraine-war-starlink-drones-a3a0139dfc23365550306dd66fe43daa","label":"AP — updated Oct. 24, 4:16 p.m. EDT"}]},{"id":"top-iran-oil-oct25","headline":"Iran faces oil-revenue cliff, but civilians may bear the heaviest cost","summary":"Fox reports Kpler’s projection that Tehran’s seaborne crude income could dry up by mid-December as floating inventory and payments run down. Sanctions specialists caution that the government could shield military spending while cutting civilian programs. This is an attributed forecast, not evidence that Iran has already lost all revenue or ended the war.","sources":["Fox"],"signal":"Watch","links":[{"url":"https://www.foxnews.com/politics/irans-oil-lifeline-drying-up-biggest-pain-may-fall-ordinary-citizens","label":"Fox News — Oct. 25, 4 a.m. ET"},{"url":"https://www.drudgereport.com/","label":"Drudge Report — aggregator checked Oct. 25"}]},{"id":"top-alaska-oct23-eve","headline":"Trump says he ordered suit to block Alaska Senate certification if Sullivan loses","summary":"DOJ asks a federal court to prevent certification of a Mary Peltola victory while a second Dan Sullivan remains on the ballot. Trump said Friday he directed the lawsuit; the second Sullivan denies being a Democratic plant. This is a requested remedy, not a court order or an election result.","sources":["Other","CNN","Drudge"],"signal":"Watch","links":[{"url":"https://apnews.com/article/alaska-senate-race-sullivan-name-lawsuit-certification-d8f4a3c7b5247cc427a05f796d7c0d82","label":"AP — 5:56 PM EDT, October 23, 2026"},{"url":"https://www.cnn.com/2026/10/23/politics/doj-sues-alaska-dan-sullivan-us-senate","label":"CNN — Oct. 23, 2026"},{"url":"https://www.drudgereport.com/","label":"Drudge Report — aggregator checked Oct. 23"}]},{"id":"top-tallahassee-oct25","headline":"Tallahassee shooting injures 12, including six children, police say","summary":"Police say 11 people suffered gunshot wounds and another person was injured near Florida A&M after Saturday’s homecoming game. At least three injuries were serious, and no arrest was announced in AP’s early-Sunday report. Reuters independently confirms the 11 gunshot victims plus one other injury; the motive remains under investigation.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/florida-shooting-football-stadium-eece0228b1476cbe0f2a9864c7e4fd4f","label":"AP — updated Oct. 25, 12:34 a.m. EDT"},{"url":"https://www.reuters.com/world/us/least-12-injured-shooting-tallahassee-florida-2026-10-25/","label":"Reuters — Oct. 25"}]},{"id":"top-fourcorners-flood-oct25","headline":"Evacuations persist as new rain threatens flood-hit Four Corners region","summary":"Hundreds of homes remained evacuated or without electricity Saturday after days of rain, AP reports. Farmington officials warn the emergency is not over even as rivers recede; some 2,000 people were affected in and around the city. Rescue and impact figures are official estimates, not a complete final count.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/extreme-weather-flooding-rescues-new-mexico-colorado-331f28a33ea85fba70a4cabe13ee91a3","label":"AP — updated Oct. 24, 8:23 p.m. EDT"}]},{"id":"top-california-ballots-oct24","headline":"DOJ gives California counties 48 hours to verify ballots it flags as suspect","summary":"AP obtained letters asking county registrars to set aside and verify ballots the Justice Department says may belong to noncitizens. Los Angeles officials say at least 18 counties received letters. The federal allegations are not proof of illegal votes, and the requests do not establish a final court order barring the ballots.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/california-department-of-justice-noncitizen-voting-election-0a70161dba31a833fa75507a7484853b","label":"AP — updated Oct. 23, 9:29 p.m. EDT"}]},{"id":"top-php-oct23","headline":"AI exploitation of long-known PHP weaknesses drives emergency patching","summary":"CNN’s new analysis traces the PHP emergency to vulnerabilities known for years that AI made practical to exploit quickly. A patch is available; widespread exposure and exploitation attempts do not establish that every vulnerable website was compromised.","sources":["CNN","Other","Drudge"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/23/tech/ai-cybersecurity-php2shell-explained","label":"CNN analysis — Oct. 23, 2026"},{"url":"https://www.reuters.com/world/asia-pacific/cloudflare-sees-millions-exploit-attempts-after-php-disclosure-2026-10-22/","label":"Reuters — Oct. 22, 2026"},{"url":"https://www.cnn.com/2026/10/21/tech/php2shell-vulnerability-ai-intl","label":"CNN — PHP vulnerabilities, updated Oct. 22, 5:55 a.m. ET"},{"url":"https://www.drudgereport.com/","label":"Drudge Report — aggregator framing checked Oct. 23"}]},{"id":"top-eagles-nest-oct24","headline":"Suspected arson devastates Germany’s Eagle’s Nest mountain retreat","summary":"German authorities say a fire swept through the historic mountaintop building and a 33-year-old man was detained on suspicion of arson. Snow, wind and the narrow access road hindered firefighting; no injuries were reported. Prosecutors are examining possible motives, and detention is not a conviction.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/germany-hitler-eagles-nest-berchtesgaden-alps-fire-338ec9bbec52ecf52d1c127546d01eed","label":"AP — updated Oct. 24, 4:23 p.m. EDT"}]},{"id":"top-ebola-oct23-eve","headline":"Kenya reports second Ebola death as regional outbreak expands","summary":"Kenya’s Health Ministry said a 65-year-old woman, a close relative of the country’s first patient, died after becoming ill in quarantine. AP’s Friday update describes the second reported Kenyan death; official case and mortality counts remain attributed to health authorities.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/kenya-ebola-congo-uganda-nigeria-c96067b4b2fc8d3e35a97e32455e996c","label":"AP — 6:09 PM EDT, October 23, 2026"}]},{"id":"top-melanoma-vaccine-oct24","headline":"Personalized mRNA vaccine lowers melanoma recurrence risk in major study","summary":"Moderna and Merck report that adding an individualized vaccine to standard treatment reduced the risk of melanoma returning by 42% two years after surgery. AP describes the advanced trial and outside specialists’ reactions. The result concerns a specific studied regimen, not a universal cancer cure or an announced approval.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/moderna-cancer-vaccine-melanoma-mrna-intismeran-415ececd79c9411498751246742aafa2","label":"AP — Oct. 22, 6:23 p.m. EDT"}]}],"usa":[{"id":"usa-woodland-ice-oct25","headline":"Video and local police challenge ICE’s account of SUV hitting pedestrian","summary":"CNN reports surveillance and other recordings contradict DHS’ claim that Antonio Moreida jumped onto an immigration vehicle’s hood in Woodland, California. Local police have opened a criminal investigation. The article contains inconsistent incident-date text, so this briefing does not assign a disputed calendar date or treat the investigation as a conviction.","sources":["CNN"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/25/us/woodland-man-struck-by-ice-vehicle","label":"CNN — published Oct. 25, 6:30 a.m. ET"}]},{"id":"usa-alexander-sentencing-oct25","headline":"Alexander brothers face sentencing after sex-trafficking convictions","summary":"Tal, Alon and Oren Alexander are scheduled to be sentenced Tuesday after a jury convicted them on all counts earlier this year, CNN reports. Prosecutors seek life terms; defense lawyers seek 15 years and dispute the underlying allegations. The sentence has not yet been imposed.","sources":["CNN"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/25/us/alexander-brothers-sentencing-sex-trafficking","label":"CNN — Oct. 25, 6 a.m. ET"}]},{"id":"usa-quaker-fire-oct25","headline":"Explosion and fire hit Quaker Oats plant; all workers escape safely","summary":"Cedar Rapids officials say an apparent explosion started Saturday’s fire at the major Iowa milling facility. The mayor says all workers were accounted for and nobody was injured. The cause was not immediately known; the available report does not establish the duration of any production interruption.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/cedar-rapids-fire-iowa-quaker-oats-205913f0edeac764a19bb2daabf3d911","label":"AP — updated Oct. 24, 7:48 p.m. EDT"}]},{"id":"usa-swingdistricts-oct25","headline":"Vanishing swing districts narrow voters’ route to changing Congress","summary":"AP’s North Carolina reporting traces how redistricting transformed a closely fought district into a safe Republican seat. Nationally, partisan sorting and mapmaking are shrinking the competitive field. This is an explanation of electoral structures, not a prediction of which party will win November’s House vote.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/midterms-redistricting-gerrymandering-congress-north-carolina-608be19e4c6359d1590717dbead13940","label":"AP — Oct. 24, 3:48 p.m. EDT"}]},{"id":"usa-audi-georgia-oct25","headline":"Audi announces Georgia SUV plant with construction planned for 2027","summary":"Trump announced the investment at his Perry rally, and Audi’s chairman appeared with him. AP reports the company says the project would create approximately 4,500 jobs and begin production in the early 2030s. Those jobs and output are future plans, not an already operating factory or independent proof of Trump’s tariff claims.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/audi-georgia-trump-manufacturing-auto-plant-c1d49f2437c1d9cf349af399b8abe3a3","label":"AP — updated Oct. 24, 10:22 p.m. EDT"}]},{"id":"usa-evidence-minnesota-oct25","headline":"Minnesota seeks federal evidence in Good and Pretti killings","summary":"State investigators say federal evidence sharing stopped after a July agreement; prosecutors are asking a judge to compel disclosure. DOJ argues its rules permit declining the requests in the circumstances. AP’s Oct. 22 account describes an unresolved legal dispute, not a new order handing over the records.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/renee-good-alex-pretti-evidence-immigration-d18378b40675bb107f9c2d519c2b9853","label":"AP — Oct. 22, 10:29 p.m. EDT"}]},{"id":"usa-medical-oct24","headline":"Medi-Cal’s tighter asset limit threatens coverage for seniors and disabled people","summary":"CalMatters reporting carried by AP examines a state budget change lowering the qualifying asset limit to $21,000 beginning July 2027. Patients face difficult spending decisions; estimates of future coverage losses are forecasts, not a count of people already disenrolled.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/health-benefits-cuts-california-7d0accf339933558327fe3f964a5053a","label":"CalMatters/AP — Oct. 23, 3:56 p.m. EDT"}]},{"id":"usa-acadia-marker-oct25","headline":"Missing Wabanaki marker highlights national-park history dispute","summary":"AP documents the removal of a marker explaining Wabanaki beliefs at Acadia amid the administration’s review of park interpretation. Indigenous communities continue preservation and land-restoration work. The Oct. 22 reporting remains relevant to the broader dispute over whose history national parks tell; it is not labeled as a new Sunday removal.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/national-parks-native-americans-trump-sign-removal-8e7ee5917489337d6000a0fce31bca70","label":"AP — Oct. 22, 7:08 a.m. EDT"}]},{"id":"usa-driverless-transit-oct24","headline":"Washington and Los Angeles examine trains without onboard operators","summary":"AP reports that Washington advanced an automation plan and Los Angeles is pursuing a new driverless line, while Honolulu already operates one. The proposed systems face financing, safety and technical hurdles and would take years to implement; current trains have not all become unattended.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/automated-driverless-transit-dc-la-honolulu-dd55ecec4b5c9779fbaa3e43b247e0ce","label":"AP — Oct. 24, 8:44 a.m. EDT"}]},{"id":"usa-coastguard-oct24","headline":"Coast Guard swimmer recounts rescuing 16 people off Mexico","summary":"In his first AP interview, Josh Law describes two hours rescuing survivors of an Oct. 16 capsizing in darkness and rough water. Eleven people remained missing when the search ended. Federal investigators are still examining the vessel’s origins and purpose; the new development is the rescuer’s firsthand account.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/coast-guard-rescue-boat-migrants-de15e35e618e195545d14dc3912fc599","label":"AP — updated Oct. 23, 10:49 p.m. EDT"}]}],"boston":[{"id":"boston-sunday-status-oct25","headline":"Sunday Boston scoreboard: Bruins 6–4 final; all four teams off today","summary":"FINAL Saturday: Bruins 6, Sharks 4. FINAL Friday: Celtics 107, Knicks 103. FINAL Thursday: Bears 30, Patriots 24. No Red Sox, Patriots, Bruins or Celtics game Sunday, Oct. 25; Red Sox season is complete. Next: Celtics host Chicago Monday at 7:30 p.m. EDT; Bruins visit Carolina Tuesday at 8 p.m. EDT. Official schedules and completed recaps were checked Sunday morning.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.nhl.com/bruins/news/bruins-beat-sharks-6-4-in-back-and-forth-affair-at-td-garden","label":"Bruins — Saturday final, checked Oct. 25"},{"url":"https://www.nhl.com/bruins/schedule","label":"NHL — official schedule checked Oct. 25"},{"url":"https://www.espn.com/nba/team/schedule/_/name/bos/boston-celtics","label" <script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, international soccer, or WNBA coverage.',business:'7 unique business/markets stories refreshed only at 7 p.m. Eastern Monday through Friday, with independently confirmed figures for the latest completed U.S. cash session. Preserved unchanged at all other editions.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
