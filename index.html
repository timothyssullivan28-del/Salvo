<script id="briefing" type="application/json">{"date":"2026-10-29","lastUpdated":"October 29, 2026, 7:15:20 p.m. EDT Boston","dek":"Thursday evening full refresh: all eight tabs independently researched and re-ranked, with confirmed completed-session markets and checked Boston schedules.","take":"Israel’s count, Alaska’s legal escalation and security decisions are established developments; fraud and leak accusations are not established guilt. Fox emphasizes alleged election wrongdoing and Hegseth’s firing, CNN stresses the Alaska probe and wider election stakes, while Drudge foregrounds electoral peril and Iran attack options. Their overlap is concern over power and security, not agreement on the allegations; Drudge is an aggregator, not an independent reporting source.","sectionTakes":{"top":"Israel’s count, Alaska’s legal escalation and security decisions are established developments; fraud and leak accusations are not established guilt. Fox emphasizes alleged election wrongdoing and Hegseth’s firing, CNN stresses the Alaska probe and wider election stakes, while Drudge foregrounds electoral peril and Iran attack options. Their overlap is concern over power and security, not agreement on the allegations; Drudge is an aggregator, not an independent reporting source.","usa":"A completed guilty plea and two confirmed hiking deaths replace speculation, while fresh court disputes affect state authority and access to detainees. The Cornell hearing and FTC dismissal have narrower meanings than their partisan framing suggests. Important earlier-week appointment and DNA findings retain their actual source dates alongside Wednesday’s child-safety law and smoke research.","boston":"The Bruins visit St. Louis at 8 p.m. EDT Thursday; the other three teams are off, after all four were off Wednesday. Eaton’s trade, Brown’s missed practice and Clifton’s lineup return lead the substantive news, with Contreras and the compressed offseason adding Red Sox context. Globe reporting was erent legal stages, while Burns’ prize and Gentle Monster’s review add cultural news. The Dutch Eurovision reversal retains its Oct. 27 date rather than being presented as a new Thursday announcement."},"sections":{"top":[{"id":"top-israel-oct29","headline":"Israel’s final count leaves Netanyahu’s bloc short; fraud claims lack evidence","summary":"Election officials’ Thursday count gives Netanyahu’s bloc 53 of 120 seats, leaving coalition formation unresolved. AP and Reuters report that he alleged Arab-party gains involved fraud without providing evidence; Arab leaders reject the accusation. Losing a parliamentary majority is not the same as a completed transfer of government.","sources":["Other","Fox","Drudge"],"signal":"Watch","links":[{"url":"https://apnews.com/article/israel-elections-netanyahu-eisenkot-arab-results-9a0620a1314fdc127245ba1a7f0aa762","label":"AP — 7:03 PM EDT, October 29, 2026"},{"url":"https://www.reuters.com/world/middle-east/netanyahu-risk-losing-power-steps-up-attacks-israels-arab-parties-2026-10-29/","label":"Reuters — Oct. 29 corroborating report"},{"url":"https://www.foxnews.com/world/netanyahu-bloc-falls-short-arab-vote-surges-qatar-election-interference-allegations-emerge","label":"Fox News — Oct. 29 framing; limited article text"},{"url":"https://www.drudgereport.com/","label":"Drudge Report — aggregator checked Oct. 29 evening"}]},{"id":"top-spain-eve29","headline":"Spain’s train-crash toll reaches at least 69 as investigators examine orders","summary":"Spanish officials raised the death toll from Wednesday’s Madrid–Seville collision to at least 69. ABC reports investigators are examining an apparently inexplicable operational order; Reuters’ Thursday account independently reports the same toll. The inquiry has not established a final cause, and the death count remains attributed to officials.","sources":["Other"],"signal":"Watch","links":[{"url":"https://abcnews.com/International/10-killed-train-collision-high-speed-line-spain/story?i 29/us/cornell-investigation-letitia-james","label":"CNN — updated Oct. 29"}]},{"id":"usa-ice-location-eve29","headline":"Immigration groups challenge policy concealing detainee locations","summary":"Legal-service organizations sued Wednesday over a policy hiding locations of detainees with final removal orders. They say it obstructs contact with clients; AP reports the complaint was filed in federal court in Boston. A lawsuit alleges harm and seeks relief but does not itself establish illegality.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/ice-detainee-location-lawsuit-disappearing-removal-order-789eea3202be224d82d84a82ade6c15b","label":"AP — 6:16 PM EDT, October 28, 2026"}]},{"id":"usa-workplace-eve29","headline":"Appeals court keeps California workplace-meeting ban blocked","summary":"A federal appeals court Thursday held that California’s prohibition on compulsory workplace meetings about politics, religion or union organizing violates employers’ speech rights. Reuters reports it upheld the injunction. The decision addresses the challenged meetings law, not a blanket exemption from labor protections.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/legal/government/california-loses-bid-revive-ban-religious-anti-union-workplace-meetings-2026-10-29/","label":"Reuters — Oct. 29"}]},{"id":"usa-ftc-case-eve29","headline":"Judge dismisses transgender-health group’s FTC case as moot","summary":"Judge James Boasberg dismissed the nonprofit’s lawsuit Thursday because the FTC withdrew the subpoena underlying it. Reuters says the group had alleged retaliation for gender-affirming-care advocacy. Mootness is not a finding that retaliation occurred or that every disputed agency practice was lawful.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/legal/government/trans-health-groups-lawsuit-over-ftc-subpoena-is-moot-us-judge-rules-2026-10-29/","label":"Reuters — Oct. 29"}]},{"id": sts a family’s trust and the audience’s judgment","summary":"AP’s Wednesday review discusses Marie Kreutzer’s drama starring Léa Seydoux and Laurence Rupp. The critic emphasizes how its apparently loving household complicates the audience’s moral response. This is attributed film criticism, not an allegation about the performers or a verified account of real people.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/gentle-monster-movie-review-918881df1a322ae09fc019c9fd0a57a5","label":"AP — 11:52 AM EDT, October 28, 2026"}]},{"id":"entertainment-masterson-oct28eve","headline":"California appeals court upholds Danny Masterson’s rape convictions","summary":"AP’s Wednesday update reports the appellate panel unanimously rejected arguments for a new trial after Tuesday’s ruling. Masterson’s 30-years-to-life sentence remains in place. The appellate outcome is established; it should not be confused with a new trial or a newly imposed sentence.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/danny-masterson-rape-appeal-scientology-5b81a4f47107b0e626f90fd43aaa0dac","label":"AP — 8:21 AM EDT, October 28, 2026"}]},{"id":"ent-eurovision-eve29","headline":"Dutch broadcaster reverses planned Eurovision return","summary":"AP’s Oct. 27 report says the Netherlands withdrew again after previously planning to return. The reversal remains consequential for the coming contest and is labeled with its actual date. It concerns Dutch participation, not cancellation of Eurovision as a whole.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/netherlands-eurovision-song-festival-dutch-27ee0f300f9cd0ca4a4844b51865bd95","label":"AP — 7:44 AM EDT, October 27, 2026"}]}]},"researchNotes":["All eight tabs researched and reranked Thursday evening; none preserved. Schedule unchanged. Research priority: consequential developments, actual publication dates and unique stories.","Fox, CNN and Drudge homepages checked. Direct Fox article text was limited; framing uses its checked homepage. Drudge is an aggregator, not independent verification. Reuters and AP independently confirm Israel and Alaska developments and Sylvia firing; ABC and Reuters match Spain’s attributed 69 toll.","Thursday completed cash close independently cross-checked: AP 4:21 p.m. EDT report supplies levels and point changes; CNBC completed-session report independently matches levels and precise percentages. No futures or after-hours figures substituted for cash closes.","Boston: official NHL October schedule confirms Bruins at St. Louis Thursday 8 p.m. EDT and Tuesday 2–1 loss; Celtics/Patriots schedules checked. All four off Wednesday; only Bruins play Thursday. Tuesday Celtics final 125–124 OT, Friday Bulls 7:30 p.m. EDT; Patriots Sunday 4:25 p.m. EST. Red Sox season complete.","Globe and WEEI/Audacy checked. Globe includes readable reporting with subscription overlays and excerpt limitations; WEEI has limited fresh full text. Official Red Sox transaction confirms Eaton/Rayo; official Patriots report confirms Thursday Brown absence. No game in progress at research check. ESPN Bruins page displayed an anomalous 2027 preview date; official 2026 NHL schedule used instead.","Some broad searches surfaced old stories. Actual source dates exposed old UMG layoffs, Kirkus and film interviews; these were rejected. Significant earlier-week legal/cultural developments selected deliberately retain actual dates, not fresh timestamps.","Source collection timed out twice on slow pages; completed responses saved incrementally on second attempt. Failed requests are not treated as independent confirmations. No excluded General Sports coverage, including zero WNBA."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, international soccer, or WNBA coverage.',business:'7 unique business/markets stories refreshed only at 7 p.m. Eastern Monday through Friday, with independently confirmed figures for the latest completed U.S. cash session. Preserved unchanged at all other editions.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
