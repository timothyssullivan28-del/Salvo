t, the Associated Press reported. Because the report is classified and not public, its eventual findings cannot yet be assessed.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — FBI commissions classified “Patel Report,” Oct. 3","url":"https://apnews.com/article/fbi-kash-patel-report-trump-cbae3feb679d826d8b409fbc142d1581"}]},{"id":"politics-epa-power-plant-lawsuit-oct1","headline":"Oct. 1: New York leads states and cities challenging EPA power-plant rule repeal","summary":"New York and other states and local governments sued to challenge the EPA’s repeal of a power-plant carbon rule. The case is pending; the filing is not a court decision.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — states challenge EPA power-plant rule repeal, Oct. 1","url":"https://www.reuters.com/legal/litigation/new-york-20-states-sue-epa-block-power-plant-carbon-rule-repeal-2026-10-01/"}]},{"id":"politics-kennedy-center-demolition-bill-oct2","headline":"Oct. 2: Bipartisan lawmakers move to block proposed Kennedy Center demolition","summary":"Members of both parties introduced a measure aimed at preventing demolition of the Kennedy Center. The proposal must still advance through Congress; no demolition or final legislative outcome is reported.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — bipartisan lawmakers seek to block Kennedy Center demolition, Oct. 2","url":"https://www.reuters.com/legal/government/bipartisan-members-congress-move-block-demolition-kennedy-center-2026-10-02/"}]}],"entertainment":[{"id":"entertainment-digger-boxoffice-oct3","headline":"Oct. 4 estimates: “Verity” opens around $32.6–33M; “Digger” near $8M","summary":"Sunday trade estimates put Anne Hathaway–Dakota Johnson thriller “Verity” at roughly $32.6–33 million domestically for the weekend and Tom Cruise’s “Digger” near $8 million. The figures are weekend estimates, not final studio-reported grosses; Deadline and TheWrap differ slightly on Verity’s total.","source oves.","sources":["Other"],"signal":"Watch","links":[{"label":"The Hollywood Reporter — Warner film chiefs’ expected exit if deal closes, Oct. 2","url":"https://www.hollywoodreporter.com/movies/movie-news/michael-de-luca-pamela-abdy-warner-bros-1236720848/"},{"label":"Deadline — reported next steps for De Luca and Abdy","url":"https://deadline.com/2026/10/michael-de-luca-pamela-abdy-exit-warner-bros-paramount-merger-1237145206/"}]},{"id":"entertainment-disney-netflix-licensing-oct2","headline":"Oct. 2: Disney licenses a slate including “Ice Age,” “Felicity” and “Elio” to Netflix","summary":"Disney agreed to license selected library titles to Netflix, Variety reported. The arrangement concerns specified titles and does not mean the companies’ streaming services are merging.","sources":["Other"],"signal":"Consensus","links":[{"label":"Variety — Disney licenses titles to Netflix, Oct. 2","url":"https://variety.com/2026/tv/news/disney-licenses-titles-netflix-ice-age-movies-will-trent-percy-jackson-and-the-olympians-felicity-1236897256/"}]},{"id":"entertainment-disney-layoffs-oct3","headline":"Oct. 3: Disney president calls layoffs “extremely painful” but necessary","summary":"A Disney executive defended workforce reductions as part of the company’s operating changes, describing the cuts as painful. The remarks do not provide a new total of affected employees.","sources":["Other"],"signal":"Watch","links":[{"label":"Yahoo Finance — Disney president on layoffs, Oct. 3","url":"https://finance.yahoo.com/media-advertising/articles/disney-president-says-layoffs-extremely-094448360.html"}]},{"id":"entertainment-fast-furious-peacock-oct2","headline":"Oct. 2: Peacock orders a “Fast & Furious” television adaptation","summary":"Peacock ordered a television adaptation tied to the film franchise, Variety reported. The series is planned for a later release; it is not yet on the service.","sources":["Other"],"signal":"Consensus","links":[{"label":"Variety — Peacock orders “Fast & Furious” series, Oct. 2","url":"https://au.variety.com/2026/tv/news/fast-furious-tv-show-peacock-2028-40935/"}]}]},"researchNotes":["Edition generated October 4, 2026, 1:19:27 p.m. EDT Boston; refreshed and reranked from the 10:05 a.m. edition.","Patriots–Bills check at 1:19 p.m. EDT: IN PROGRESS, Patriots 7, Bills 0, first quarter, 7:01 remaining on ESPN. CBS Sports independently showed 7–0 in the first quarter with 6:56 remaining; the displays differed by five seconds on the clock.","Boston Globe live Patriots coverage provided game-day inactive reporting and 1:03 p.m. underway update, then reached login/subscription content. WEEI/Audacy’s accessible page exposed the live Sunday schedule, including its 1 p.m. NFL Sunday Now program, but not a usable text live score or substantial current article text.","Sunday U.S. cash markets are closed. Friday, October 2 is the latest completed session: Dow 51,176.96, +250.40 (+0.49%); Nasdaq Composite 27,190.86, +319.27 (+1.19%). Reuters exact closes/moves cross-checked against AP; no Sunday cash or premarket snapshot used.","AP/Guardian reported two deaths and at least 25 hospital transports in the Georgia homecoming shooting; Baltimore police accounts of the park shooting remain attributed. No suspect has been independently identified in this edition.","Okinawa arrest remains a suspicion/allegation under investigation; Taiwan bar-raid details are attributed to Reuters/local reporting and protest coverage. The reported Houthi strike near Aramco was not confirmed by Saudi authorities in checked coverage.","Weekend box-office totals are industry estimates: TheWrap and Deadline differed slightly on Verity, so the edition uses a range rather than treating either number as final."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, or international soccer.',business:'7 unique business/markets stories; on trading days at 7 a.m. show timestamped indicative Dow and Nasdaq-100 futures, clearly not cash indexes; on weekends and market holidays state cash markets are closed and show no live/premarket snapshot, while identifying the latest completed session. At 10 a.m. and 1 p.m. on trading days show timestamped Dow and Nasdaq Composite cash-index levels, point and percentage moves, and any provider delay; at 4 p.m. show timestamped closing moves as confirmed or clearly preliminary; at 7 p.m. use confirmed closes.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
