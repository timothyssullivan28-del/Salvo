<script id="briefing" type="application/json">{"date":"2026-10-22","lastUpdated":"October 22, 2026, 7:08:04 a.m. EDT Boston","dek":"New strikes test Ukraine diplomacy, Iran reports tanker damage, and the Patriots and Bruins prepare for Thursday night games.","take":"Overnight Kyiv strikes and Iran’s unverified tanker-damage account lead on consequence, with the PHP security alert and Ebola spread adding public-safety stakes. CNN emphasizes Ukraine diplomacy, voting safeguards and cyber risks, Fox emphasizes the Michigan debate’s ideological clashes, and Drudge emphasizes election vulnerability and White House turmoil; their consensus is pressure on leadership, not agreement on its causes. Drudge is an aggregator rather than an independent reporting source, and military claims, polling and campaign accusations remain attributed.","sectionTakes":{"top":"Overnight Kyiv strikes and Iran’s unverified tanker-damage account lead on consequence, with the PHP security alert and Ebola spread adding public-safety stakes. CNN emphasizes Ukraine diplomacy, voting safeguards and cyber risks, Fox emphasizes the Michigan debate’s ideological clashes, and Drudge emphasizes election vulnerability and White House turmoil; their consensus is pressure on leadership, not agreement on its causes. Drudge is an aggregator rather than an independent reporting source, and military claims, polling and campaign accusations remain attributed.","usa":"The Meta penalty, screwworm detections and unusually early flu activity lead a newly ranked U.S. slate. Arrest charges are not convictions, appeal prospects are not rulings, and Josephine’s offshore track does not eliminate coastal flooding risk.","boston":"Thursday brings Bruins-Nashville at 7 p.m. EDT and Patriots-Chicago at 8:15 p.m. EDT, both upcoming; neither the Celtics nor Red Sox plays today. New England’s five ruled-out players, the Khusnutdinov extension and offseason roster choices supply substantive news beyond schedules. Boston Globe material was partly paywalled, while WEEI/Audacy supplied current hubs and analysis but limited accessible fresh full article text.","business":"CONFIRMED Wednesday, Oct. 21 close: Dow 52,856.09, up 360.21 points (+0.69%), and Nasdaq Composite 26,702.86, up 278.04 (+1.05%). AP confirmed levels and point moves, with CNBC independently matching levels and precise percentages. Renewed technology buying lifted the cash session; Meta and Tesla results and Netflix’s intraday decline are separately timed developments.","world":"The pope’s favorable treatment update and Haiti’s hostage rescue claim lead a refreshed diplomatic and legal slate. Maduro’s and the Mexican prosecutor’s charges remain unproven, Cuban pressure allegations remain attributed, and Brazil and Israel election analyses are not results.","sports":"The Lakers and Timberwolves recorded decisive opening wins, while the World Series still awaits Friday’s opener. Ohtani’s pitching return and Jones’s trade talk remain expectations rather than completed moves, and Bailey’s cause of death remains unconfirmed.","politics":"Intelligence leaders’ Russian-interference account, a late super-PAC spending surge and Georgia’s election-trust fight dominate the political slate. Classified-briefing claims remain attributed; polls, advertising and campaign messaging are not election outcomes.","entertainment":"“Clayface” and Turturro’s New York character study lead the refreshed film coverage, with Applegate’s account carefully distinguished from an independently confirmed diagnosis. Apu’s return and the planned Beatles attraction show familiar properties being reworked, while reviews and future opening dates are not commercial results."},"sections":{"top":[{"id":"top-kyiv-overnight-oct22","headline":"Russian missiles hit Kyiv hours after Putin agrees to renewed talks","summary":"Russia launched a major overnight attack after Vladimir Putin agreed in principle to resume U.S.-Ukraine-Russia talks. Ukrainian officials reported two dead and dozens wounded; Russia separately claimed it intercepted 808 drones. AP and CNN confirm the attack, not a peace settlement or independently verified military totals.","sources":["CNN","Other"],"signal":"Consensus","links":[{"url":"https://www.cnn.com/2026/10/21/europe/us-envoy-witkoff-putin-talks-russia-ukraine-intl","label":"CNN — updated Oct. 22, 6:37 a.m. ET"},{"url":"https://www.usnews.com/news/business/articles/2026-10-22/russia-pounds-ukraines-capital-kyiv-with-missiles-and-drones-hours-after-agreeing-to-peace-talks","label":"AP — Kyiv strikes and attributed Russian drone claim, Oct. 22"},{"label":"Drudge — aggregator framing checked Oct. 22 morning","url":"https://www.drudgereport.com/"}]},{"id":"top-hormuz-tankers-oct22","headline":"Iran says seven tankers were attacked or hit mines in Hormuz","summary":"Iranian state television, citing the Revolutionary Guard’s navy, said four tankers caught fire after attacks and three others were damaged by mines overnight. AP reports the claim but says verification is pending; tanker flags, casualties and the full scale of damage were not established.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/mideast-yemen-saudi-israel-october-22-2026-dde5b98a8bf961224514994b02babce9","label":"AP — Iran’s tanker claims, Oct. 22"}]},{"id":"top-php-security-oct22","headline":"Websites suspend services as operators patch critical PHP flaws","summary":"The NSA and Europe’s cybersecurity agency urged immediate action after AI helped uncover two critical PHP vulnerabilities. CNN reports operators temporarily shut services while patching; the language’s use by roughly 70% of websites is an exposure estimate, not proof that all those sites were breached.","sources":["CNN"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/21/tech/php2shell-vulnerability-ai-intl","label":"CNN — PHP vulnerabilities, updated Oct. 22, 5:55 a.m. ET"}]},{"id":"top-ebola-spread-oct21","headline":"Ebola outbreak spreads beyond Congo as Nigeria traces contacts","summary":"CNN reports the Bundibugyo Ebola outbreak has reached four countries beyond Congo, with active transmission in two of them. Nigerian authorities are tracing contacts after confirming a case in Abuja; there is no approved vaccine or drug for this virus.","sources":["Other"],"signal":"Watch","links":[{"label":"CNN — outbreak and containment, Oct. 21","url":"https://www.cnn.com/2026/10/21/health/ebola-kenya-congo-nigeria-uganda-france"}]},{"id":"top-voter-investigation-order-oct22","headline":"Judge limits DHS voter investigations based on faulty citizenship data","summary":"A federal judge restricted certain field investigations in nine states when DHS believes its target could be a U.S. citizen. CNN reports the order is scheduled to take effect Friday afternoon and last through the midterms, allowing time for appeal; it is not a nationwide ban on election monitoring.","sources":["CNN"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/21/politics/judge-curbs-trump-hunt-noncitizen-voters-flawed-data","label":"CNN — order published Oct. 21, 9:59 p.m. ET"}]},{"id":"top-congress-priorities-poll-oct22","headline":"AP-NORC poll: voters prioritize affordability and ending Iran war","summary":"About eight in ten registered voters want the next Congress to prioritize lowering living costs, and roughly seven in ten prioritize ending the Iran war. AP-NORC finds less demand for either investigating Trump or advancing his agenda; these are survey responses, not election results.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.usnews.com/news/us/articles/2026-10-22/voters-want-the-next-congress-to-focus-on-costs-and-iran-not-on-trump-a-new-ap-norc-poll-shows","label":"AP — new AP-NORC poll, Oct. 22, 6:29 a.m. ET"}]},{"id":"top-court-trans-care-oct21","headline":"Supreme Court blocks suspension of transgender prisoners’ treatment","summary":"The Supreme Court blocked the administration from suspending hormone therapy and other treatment for transgender federal prisoners. CNN describes a rare emergency-docket victory for transgender rights; the order concerns prison medical care, not every pending transgender-rights dispute.","sources":["Other"],"signal":"Watch","links":[{"label":"CNN — Supreme Court order, Oct. 21","url":"https://www.cnn.com/2026/10/21/politics/supreme-court-blocks-trump-suspending-transgender-medical-care-prisons"}]},{"id":"top-michigan-debate-oct22","headline":"Michigan Senate rivals clash over Iran, health care and guns","summary":"Abdul El-Sayed and Mike Rogers traded accusations over the Iran war and government programs in their final debate. Fox reports the exchanges and says it has not discovered links between El-Sayed and the Muslim Brotherhood; Rogers’ association claims are not established facts.","sources":["Fox"],"signal":"Split","links":[{"url":"https://www.foxnews.com/politics/el-sayed-rogers-clash-over-muslim-brotherhood-trump-guns-5-fiery-debate-moments","label":"Fox News — Wednesday, Oct. 21 debate; article timestamp not exposed"}]},{"id":"top-toledo-leak-oct21","headline":"Toledo lifts shelter order after chemical tank plume forces evacuations","summary":"Toledo lifted its shelter-in-place order Wednesday evening after a chemical leak forced hundreds to evacuate and more than 50,000 to stay inside. AP’s 7:15 p.m. update says officials let the tank vent because intervention risked an explosion; the lifted shelter order is not an all-clear for every evacuated property.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — updated Oct. 21, 7:15 p.m. EDT","url":"https://apnews.com/article/toledo-chemical-release-ohio-hazmat-c7ead0b5a1eb0e4672ce4085bdaf6124"}]},{"id":"top-un-climate-oct21","headline":"U.N. report raises projected warming and cites U.S. policy reversal","summary":"A new U.N. Environment Programme assessment projects more warming than last year and cites the U.S. withdrawal from the Paris Agreement among the reasons. These are conditional climate projections, not a claim that the projected temperatures have already occurred.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — U.N. climate assessment, Oct. 21","url":"https://apnews.com/article/climate-change-global-warming-united-states-projections-0eff0561e0af1f3d7421a96d9db02ba9"}]}],"usa":[{"id":"usa-meta-penalty-appeal-oct22","headline":"Meta faces $25 billion New Mexico penalty, with appeal expected","summary":"A jury found millions of consumer-law violations over data privacy, and a judge set a $25 billion penalty after reducing a much larger figure. Legal experts told Reuters Meta has substantial grounds to seek a reduction on appeal; no appellate reduction has occurred.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/world/us/meta-has-strong-chance-getting-25-billion-new-mexico-penalty-slashed-appeal-2026-10-22/","label":"Reuters — penalty and appeal analysis, Oct. 22"}]},{"id":"usa-screwworm-wildlife-oct22","headline":"Screwworm detected in Texas wildlife and New Mexico beef cow","summary":"USDA confirmed New World screwworm in an elk on a Texas game ranch, its first U.S. wildlife detection. New Mexico separately confirmed a beef-cow case in Otero County; officials are expanding surveillance, Reuters reports.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/business/healthcare-pharmaceuticals/us-agriculture-dept-confirms-first-detection-new-world-screwworm-us-wildlife-2026-10-21/","label":"Reuters — USDA and New Mexico confirmations, Oct. 21"}]},{"id":"usa-mutated-flu-oct22","headline":"Early flu surge reaches West Coast as mutated H1N1 spreads","summary":"CNN reports unusually early West Coast flu activity associated with a changed H1N1 virus. Washington testing is elevated, but national influenza-like illness visits remain below the CDC baseline; an early regional surge is not yet a nationwide peak.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/22/health/flu-2026-mutation","label":"CNN — early flu and mutation, Oct. 22, 6 a.m. ET"}]},{"id":"usa-bridge-arrest-oct22","headline":"Retired NYPD detective charged in bridge road-rage killing","summary":"Police arrested Victor Romero, 62, and charged him with murder in the fatal shooting of Koran Irvine on the George Washington Bridge. AP’s Wednesday evening update reports the charges; they are allegations, and the case has not been tried.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/george-washingon-bridge-shooting-nyc-777783cab9a905fd873657a45ba80130","label":"AP — arrest update Oct. 21, 6:23 p.m. EDT"}]},{"id":"usa-foodbank-fuel-costs-oct22","headline":"High fuel costs strain food-bank deliveries and household budgets","summary":"Reuters reports Detroit seniors struggling to reach food distribution and food banks diverting money toward diesel. Focus: Hope’s monthly deliveries rose from 800 to 1,300 food boxes this year; charities describe an affordability strain, not a completed policy remedy.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/business/energy/high-gas-prices-strain-detroits-hungry-food-banks-ahead-midterm-elections-2026-10-22/","label":"Reuters — food banks and fuel costs, Oct. 22"}]},{"id":"usa-diesel-waiver-oct22","headline":"Tax-exempt diesel expansion runs into access and farmer concerns","summary":"Farmers told Reuters they fear lingering red-diesel residue could later expose them to penalties, while other motorists struggle to find the fuel. The report examines barriers to using Trump’s new waiver rather than claiming the measure has already lowered nationwide prices.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/business/energy/trumps-tax-exempt-diesel-draws-skepticism-farmers-eludes-others-2026-10-22/","label":"Reuters — diesel waiver implementation, Oct. 22"}]},{"id":"usa-caffeine-pouches-oct22","headline":"Schools ban caffeine pouches as pediatric experts warn of risks","summary":"Some school districts are banning caffeine pouches that resemble nicotine products and can contain about 200 milligrams of caffeine. AP reports health concerns for children and teens and notes there is no federal minimum purchase age for the products.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.usnews.com/news/us/articles/2026-10-22/some-schools-are-banning-caffeine-pouches-heres-what-parents-and-students-should-know","label":"AP — caffeine pouch restrictions, Oct. 22, 6:01 a.m. ET"}]},{"id":"usa-shooting-survivor-family-oct22","headline":"Oregon shooting survivor describes protecting children through a second ordeal","summary":"CNN’s new reporting follows a mother who survived a 2001 school shooting and whose children survived last week’s Silver Rail Elementary attack. The account examines emergency calls and lasting trauma; it does not describe a new Thursday shooting.","sources":["CNN"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/22/us/school-shooting-survival-oregon-family?iid=cnn_buildContentRecirc_end_recirc&recs_exp=up-next-article-end&tenant_id=related.en","label":"CNN — survivor-family reporting, Oct. 22, 6 a.m. ET"}]},{"id":"usa-josephine-offshore-oct22","headline":"Josephine accelerates offshore, but coastal flooding remains possible","summary":"Subtropical Storm Josephine had 65 mph sustained winds southeast of Nantucket Thursday morning, CNN reports citing the National Hurricane Center. Most rain and wind should remain offshore, but coastal flooding is possible through Friday; future strengthening remains a forecast.","sources":["CNN"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/21/weather/storm-josephine-tracker-path-noreaster-climate","label":"CNN — Josephine update Oct. 22, 6:16 a.m. ET"}]},{"id":"usa-epstein-estate-lawsuit-oct21","headline":"New Mexico sues Epstein’s lawyer and accountant over alleged trafficking support","summary":"Attorney General Raúl Torrez announced a civil suit against Darren Indyke, Richard Kahn and Epstein’s estate, alleging they financed and concealed sex trafficking. The state seeks damages and restrictions on trust payments; these are allegations, not findings against the defendants.","sources":["Other"],"signal":"Watch","links":[{"label":"Reuters — civil complaint, Oct. 21","url":"https://www.reuters.com/legal/government/new-mexico-sues-jeffrey-epsteins-former-lawyer-accountant-2026-10-21/"}]}],"boston":[{"id":"boston-thursday-status-oct22","headline":"Thursday: Bruins host Nashville at 7; Patriots visit Chicago at 8:15","summary":"As of the Thursday morning refresh, UPCOMING: Bruins host Nashville at 7 p.m. EDT and Patriots visit Chicago at 8:15 p.m. EDT. No Red Sox or Celtics game is scheduled Thursday; the Red Sox season is complete and the Celtics next host the Knicks Friday at 7 p.m. EDT. FINAL Tuesday: Stars 3, Bruins 2 in overtime and Pistons 121, Celtics 113; none of the four teams played Wednesday.","sources":["Other"],"signal":"Consensus","links":[{"label":"NHL — Bruins-Stars official final","url":"https://www.nhl.com/gamecenter/bos-vs-dal/2026/10/20/2026020147"},{"label":"NBA — Celtics-Pistons official final","url":"https://www.nba.com/game/bos-vs-det-0022600001"},{"label":"Patriots — official schedule","url":"https://www.patriots.com/schedule/"},{"label":"MLB — Red Sox schedule","url":"https://www.mlb.com/redsox/schedule"},{"label":"NHL — Predators at Bruins, Oct. 22, 7 p.m. EDT","url":"https://www.nhl.com/gamecenter/nsh-vs-bos/2026/10/22/2026020154"}]},{"id":"boston-patriots-final-injuries-oct21","headline":"Patriots rule out five for Chicago; A.J. Brown has no designation","summary":"New England ruled out Ben Brown, Channing Canada, Carlton Davis III, Karon Prunty and Alijah Vera-Tucker. Kevin Byard III, Christian Elliss, Morgan Moses and Craig Woodson are questionable; A.J. Brown, Drake Maye and Will Campbell have no game designation. Thursday kickoff remains 8:15 p.m. EDT.","sources":["Other"],"signal":"Watch","links":[{"label":"Patriots — final Wednesday injury report, Oct. 21","url":"https://www.patriots.com/news/week-7-injury-report-patriots-at-bears"}]},{"id":"boston-khusnutdinov-extension-oct21","headline":"Bruins extend Khusnutdinov for three years at $3.95 million annually","summary":"Boston announced a three-year extension through 2029–30 with a $3.95 million annual cap hit. The 24-year-old forward has five points in 10 games this season, following a 33-point 2025–26 campaign.","sources":["Other"],"signal":"Watch","links":[{"label":"Bruins — signed extension, Oct. 21","url":"https://www.nhl.com/bruins/news/bruins-sign-marat-khusnutdinov-to-three-year-contract-extension"}]},{"id":"boston-patriots-defense-oct22","headline":"Patriots’ defense supplies a steady base for three-game surge","summary":"The Boston Globe’s Wednesday analysis credits New England’s defense for sustaining the rebound from a 1–2 start. It cites no 300-yard opposing passer or 100-yard rusher allowed this season; that assessment precedes Thursday’s game and does not predict its outcome.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.bostonglobe.com/2026/10/21/sports/patriots-unsung-defense/","label":"Boston Globe — defense analysis, Oct. 21; partly paywalled"}]},{"id":"boston-george-debut-record-oct21","headline":"Paul George sets Celtics debut scoring record with 38 points","summary":"George scored 38 points with seven three-pointers and five steals in Tuesday’s 121–113 loss at Detroit. Boston’s official review identifies it as the highest-scoring debut in franchise history, even as the late collapse overshadowed the individual milestone.","sources":["Other"],"signal":"Watch","links":[{"label":"Celtics — debut record, Oct. 20","url":"https://www.nba.com/celtics/news/sidebar-post-20261020-paul-george-makes-celtics-history-with-38-point-debut"}]},{"id":"boston-bruins-road-trip-review-oct21","headline":"Bruins’ 3–0–1 trip highlights gains from young players","summary":"NBC Sports Boston’s Wednesday review credits young contributors and offseason additions for a 7–2–1 start, while examining David Pastrnak and James Hagens after the Dallas loss. WEEI’s same-day commentary questions Marco Sturm’s deployment of younger players; that is analysis rather than a reported roster move.","sources":["Other"],"signal":"Watch","links":[{"label":"NBC Sports Boston — road-trip takeaways, Oct. 21","url":"https://www.nbcsportsboston.com/nhl/boston-bruins/bruins-takeaways-david-pastrnak-james-hagens/808711/"},{"label":"WEEI — Sturm’s handling of young players, Oct. 21","url":"https://www.audacy.com/weei/sports/bruins/marco-sturm-s-faith-in-the-kids-wavered-at-an-odd-time"}]},{"id":"boston-redsox-reemerge-oct22","headline":"Red Sox weigh injured players’ potential 2027 returns","summary":"MLB.com’s current offseason review examines Triston Casas, Tanner Houck, Johan Oviedo and Kutter Crawford. Contract-tender decisions and possible roles remain unresolved; the piece does not report a new signing or medical clearance.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.mlb.com/redsox/news/red-sox-players-who-could-re-emerge-in-2027-after-injuries","label":"MLB — injury-return review, Oct. 20 (date verified in official news index)"}]},{"id":"boston-redsox-base-coaches-oct21","headline":"Red Sox seek new base coaches as Epperson moves to Worcester","summary":"MLB.com reports Boston needs new first- and third-base coaches, with interim third-base coach Chad Epperson set to manage Triple-A Worcester in 2027. The report concerns the coaching staff, not a completed free-agent signing.","sources":["Other"],"signal":"Watch","links":[{"label":"MLB.com — coaching changes, Oct. 21","url":"https://www.mlb.com/redsox/news"}]},{"id":"boston-redsox-prospect-review-oct20","headline":"Red Sox farm review highlights Primera after deadline prospect trades","summa const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, international soccer, or WNBA coverage.',business:'7 unique business/markets stories refreshed only at 7 p.m. Eastern Monday through Friday, with independently confirmed figures for the latest completed U.S. cash session. Preserved unchanged at all other editions.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
</body></html>
