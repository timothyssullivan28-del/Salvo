<script id="briefing" type="application/json">{"date":"2026-10-17","lastUpdated":"October 17, 2026, 7:03:04 a.m. EDT Boston","dek":"Oregon searches for answers, Trump escalates conflicts with California and Ukraine, and Boston teams complete two comeback wins.","take":"Oregon’s school investigation, the Trump–Zelensky rupture, Pope Leo’s discharge and two Pacific storms lead Saturday morning. CNN foregrounded Oregon, Ukraine and the pope; Fox emphasized Oregon and midterms, while Drudge led with White House infighting and the Oregon father. Drudge is an aggregator rather than an independent reporting source, and military claims, legal threats and forecasts remain attributed.","sectionTakes":{"top":"Oregon’s school investigation, the Trump–Zelensky rupture, Pope Leo’s discharge and two Pacific storms lead Saturday morning. CNN foregrounded Oregon, Ukraine and the pope; Fox emphasized Oregon and midterms, while Drudge led with White House infighting and the Oregon father. Drudge is an aggregator rather than an independent reporting source, and military claims, legal threats and forecasts remain attributed.","usa":"The federal threat against California election workers and new detail on the Oregon attack lead the additional U.S. slate. Cornell’s fraternity suspension, Mississippi prison-health testimony and a new sunscreen ingredient are concrete developments, while allegations and criminal exposure remain unresolved.","boston":"FINAL Friday: Celtics 125, 76ers 120 in overtime, and Bruins 4, Ducks 2; Saturday brings Bruins at Kings at 9 p.m. EDT, with no Red Sox, Patriots or Celtics game. The Patriots host the Jets Sunday at 1 p.m., with seven questionable and two defensive backs out; the Red Sox remain in offseason mode. Boston Globe material was partly paywalled, while WEEI/Audacy offered current team hubs but limited accessible fresh article text.","business":"U.S. cash markets are closed Saturday; Friday, Oct. 16 is the latest completed session. The confirmed close ters — Oregon investigators seek answers, updated Oct. 17","url":"https://www.reuters.com/world/us/police-seek-answers-after-children-killed-oregon-school-shooting-2026-10-16/"},{"label":"CNN — how the Bend attack unfolded, updated Oct. 17","url":"https://www.cnn.com/2026/10/17/us/bend-oregon-school-shooting-how-it-unfolded"},{"label":"Fox News — Oct. 17 site map and Oregon framing","url":"https://www.foxnews.com/html-sitemap/2026/october/17/"}]},{"id":"top-trump-zelensky-rift-oct17","headline":"Trump–Zelensky rift threatens critical U.S. support for Kyiv","summary":"Reuters reported the rupture over Ukrainian refinery strikes and U.S. limits on Starshield could imperil military and communications support. AP said Trump called for Ukraine to choose a new president; the policy consequences remain unresolved.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"Reuters — rift threatens support for Kyiv, Oct. 17","url":"https://www.reuters.com/world/europe/trump-zelenskiy-rift-threatens-vital-support-kyiv-2026-10-17/"},{"label":"AP — Trump calls for a new Ukrainian president, Oct. 17","url":"https://apnews.com/article/russia-ukraine-war-trump-putin-diesel-228ccf74b2848c1ff0ac23f038b37512"}]},{"id":"top-pope-discharge-oct17","headline":"Pope Leo cleared to leave hospital after lung-cancer surgery","summary":"Vatican doctors said blood tests, a chest X-ray and the pope’s clinical condition supported discharge Saturday, four days after surgeons removed part of his right lung. CNN and Reuters reported the medical statement; recovery continues.","sources":["CNN","Other"],"signal":"Consensus","links":[{"label":"Reuters — Pope cleared for Saturday discharge, Oct. 17","url":"https://www.reuters.com/world/europe/pope-leo-be-discharged-hospital-vatican-2026-10-17/"},{"label":"CNN — doctors clear Pope Leo to leave hospital, updated 5:39 a.m. EDT","url":"https://www.cnn.com/2026/10/17/europe/pope-cancer-hospital-discharge-intl"}]},{"id":"top-trudy-champi-oct17","head ructure-2026-10-17/"}]},{"id":"top-trump-pickaxe-iran-oct16","headline":"Trump says U.S. may need to strike Iran’s Pickaxe Mountain site","summary":"President Donald Trump said Friday the United States may have to target Pickaxe Mountain, a site linked to Iran’s nuclear program. Reuters reported the statement; no new strike order or completed operation had been announced at the build.","sources":["Fox","CNN","Other"],"signal":"Consensus","links":[{"label":"Reuters — Trump threatens Pickaxe Mountain strike, Oct. 16","url":"https://www.reuters.com/world/trump-says-us-may-need-strike-irans-pickaxe-mountain-2026-10-16/"},{"label":"AP — Iran receives U.S. response, Oct. 16","url":"https://apnews.com/article/iran-war-hormuz-trump-proposal-2c42d71d8a4be3443147cd65a6ee9193"}]},{"id":"top-pakistan-school-collapse-oct15","headline":"Pakistan school roof collapse kills at least 32 children and a teacher","summary":"A school roof collapsed during class in Peshawar, killing at least 32 children and one teacher, Reuters reported. Rescue work and the casualty count were still developing.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"Reuters — Pakistan school collapse, Oct. 15","url":"https://www.reuters.com/world/asia-pacific/seventeen-students-one-teacher-killed-school-roof-collapse-pakistan-2026-10-15/"}]},{"id":"top-maduro-plea-oct16","headline":"Maduro and wife plead not guilty to new U.S. torture charges","summary":"Venezuelan leader Nicolás Maduro and his wife entered not-guilty pleas to new federal torture charges, advancing a case whose allegations remain unproved in court. The proceeding replaces Thursday’s pre-hearing status with a completed arraignment development.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"Reuters — Maduro torture-charge case, Oct. 15","url":"https://www.reuters.com/world/americas/maduro-due-court-new-us-torture-charge-2026-10-15/"},{"label":"West Hawaii Today — not-guilty pleas, Oct. 16","url":"https://www.westhawa spect, Oct. 17","url":"https://www.cnn.com/2026/10/17/us/bend-oregon-shooting-suspect-what-we-know"}]},{"id":"usa-cornell-fraternity-parties-oct17","headline":"Cornell suspends fraternity parties and adds state-police role in assault probes","summary":"The university halted fraternity social events while New York State Police gained a role in investigating campus assault reports. AP described administrative and investigative steps; allegations remain unresolved.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — Cornell suspends fraternity parties, Oct. 17","url":"https://apnews.com/article/cornell-rape-investigation-frat-party-ban-686aaca2c81878f8cd771a0e3bdf7fa4"}]},{"id":"usa-mississippi-prison-health-oct17","headline":"Mississippi lawmakers hear testimony on prison amputations and cancer delays","summary":"Witnesses told legislators that incarcerated people suffered severe consequences from delayed treatment. AP’s report concerns testimony before lawmakers, not a final finding on every allegation.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — Mississippi prison-health testimony, Oct. 17","url":"https://apnews.com/article/mississippi-lawmakers-testimony-prison-healthcare-477ef6e50de140a4b2da95be77e7919c"}]},{"id":"usa-new-sunscreen-ingredient-oct17","headline":"First new U.S. sunscreen ingredient in 25 years reaches stores","summary":"Bemotrizinol products began reaching U.S. shelves after federal approval, expanding broad-spectrum options already used overseas. AP explained the rollout and its regulatory significance.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — new sunscreen ingredient reaches U.S. stores, Oct. 17","url":"https://apnews.com/article/bemotrizinol-bemt-new-sunscreen-ingredient-fda-7892cc598c0b553b8c9c6715d7a36d6a"}]},{"id":"usa-norte-fire-orange-county-oct16","headline":"Fast-growing Norte Fire forces evacuations in Orange County","summary":"CNN reported the Norte Fire started shortly after noon Friday and quickly grew to about 465 acres as Santa Ana winds intensified. Officials ordered evacuations in parts of Orange County; acreage and containment remained subject to change.","sources":["CNN","Other"],"signal":"Watch","links":[{"label":"CNN — Norte Fire expands in Southern California, Oct. 16","url":"https://www.cnn.com/2026/10/16/weather/california-wildfires-santa-ana-winds-climate"}]},{"id":"usa-philadelphia-serial-probe-oct16","headline":"FBI and Philadelphia police excavate yard tied to seven missing women","summary":"Federal agents and Philadelphia police searched and excavated a residential property in a possible serial-killer investigation connected to seven missing women. Fox reported the search; authorities had not established that one offender was responsible.","sources":["Fox","Other"],"signal":"Watch","links":[{"label":"Fox News — Philadelphia property search, Oct. 16","url":"https://www.foxnews.com/us/fbi-philly-police-dig-up-horsch-backyard-home-tied-7-missing-women-possible-serial-killer-probe"}]},{"id":"usa-puerto-rico-head-start-oct16","headline":"Puerto Rico pushes back on English-only Head Start proposal","summary":"Puerto Rican officials objected to a Trump administration proposal that would make English the sole instructional language for Head Start programs. AP reported the dispute; the proposal had not become final policy.","sources":["Other"],"signal":"Watch","links":[{"label":"AP — Puerto Rico challenges Head Start proposal, Oct. 16","url":"https://apnews.com/article/head-start-english-puerto-rico-trump-spanish-4d2cabc5be4f776aae933382aa66ceea"}]},{"id":"usa-budget-deficit-oct16","headline":"U.S. annual budget deficit rises to nearly $2 trillion","summary":"The Treasury reported a $1.99 trillion fiscal 2026 deficit, the largest in five years, Reuters said. Higher interest and program costs outweighed stronger receipts, leaving the completed annual gap as a fresh measure of federal fiscal pressure.","sources":["Other"],"signal":"Watch","lin <script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, or international soccer.',business:'7 unique business/markets stories; on trading days at 7 a.m. show timestamped indicative Dow and Nasdaq-100 futures, clearly not cash indexes; on weekends and market holidays state cash markets are closed and show no live/premarket snapshot, while identifying the latest completed session. At 10 a.m. and 1 p.m. on trading days show timestamped Dow and Nasdaq Composite cash-index levels, point and percentage moves, and any provider delay; at 4 p.m. show timestamped closing moves as confirmed or clearly preliminary; at 7 p.m. use confirmed closes.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
