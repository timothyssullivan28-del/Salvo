y report. Dismissal with prejudice bars refiling the same claim in that court; it does not resolve every dispute about Epstein or eliminate ordinary appellate options. Trump has denied authorship of the disputed letter.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/trump-media-lawsuit-wall-street-journal-dismissed-f27c9fa832044f2f9edea9b1fbbba061","label":"AP — updated Oct. 31, 5:53 p.m. EDT"},{"url":"https://www.reuters.com/world/us-judge-dismisses-trumps-lawsuit-against-wall-street-journal-with-prejudice-2026-10-31/","label":"Reuters — Oct. 31"}]},{"id":"top-afghan-e31","headline":"Court documents describe planned Afghan deportations through Pakistan","summary":"AP’s Saturday update says the administration plans removals via Pakistan to Afghanistan, with flights potentially starting Monday. Reuters separately cites a U.S. official confirming the Pakistan route. Advocacy groups warn of Taliban retaliation; DHS declined to discuss future operations. These are reported plans and risks, not confirmation that the flights or onward removals have occurred.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/afghans-deportation-pakistan-trump-immigration-bfbc0e3dc2ee1c19fa5ec64d08468d98","label":"AP — updated Oct. 31, 6:40 p.m. EDT"},{"url":"https://www.reuters.com/legal/government/trump-administration-plans-deport-some-afghan-immigrants-afghanistan-2026-10-31/","label":"Reuters — Oct. 31 page; reporting dated Oct. 30"}]},{"id":"top-fairfield-e31","headline":"Police: Pregnant woman killed and six wounded in targeted Halloween-store shooting","summary":"Fairfield police identified the woman killed Friday night as Constance Hages, 31, and said family reported she was pregnant. AP and CNN independently report six additional people were wounded at Solano Town Center. Police describe a targeted incident involving one suspect; no arrest had been announced in the checked reports. Hospital-condition snapshots differ, so disputed precision is omitted.","sources":["Other","CNN"],"signal":"Watch","links":[{"url":"https://apnews.com/article/california-fairfield-shooting-solano-town-center-c531ed034832fa0558a246b18334f5bd","label":"AP — updated Oct. 31, 6:34 p.m. EDT"},{"url":"https://www.cnn.com/2026/10/31/us/shooting-spirit-halloween-store-california","label":"CNN — Oct. 31 police reporting"}]},{"id":"top-raids-o31","headline":"Reuters: Central Valley immigration surge stirs voter-intimidation allegations","summary":"Reuters’ Saturday investigation documents sharply increased immigration arrests in California’s Central Valley, including a planned surge described in an internal email. An unnamed U.S. official says the White House directed it. Latino residents and critics fear a chilling effect before a close House election; those concerns are not a court finding that the operation was designed to suppress votes.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/legal/government/ice-raids-california-toss-up-district-spark-accusations-voter-intimidation-2026-10-31/","label":"Reuters — Oct. 31 investigation"}]},{"id":"top-blacksea-e31","headline":"Rubio and Canada describe growing interest in limited Black Sea ceasefire","summary":"Reuters reports Rubio said Saturday the U.S. is reviewing Turkish and Indian proposals to protect grain and energy shipments. Canada’s Anita Anand described parallel talks but said Russia had not shown willingness to proceed. The G20 foreign ministers ended without a joint statement. Interest in a limited arrangement is not an agreed ceasefire or a settlement of the war.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/world/us-sees-growing-interest-limited-ceasefire-black-sea-2026-10-31/","label":"Reuters — Oct. 31 G20 reporting"}]},{"id":"top-asylum-o31","headline":"Judge temporarily blocks expedited asylum policies for unaccompanied children","summary":"Reuters reports Judge Brendan Hurson ordered prior procedures restored through Nov. 13 while considering a longer injunction. Legal-service groups challenged policies that shortened interview notice and limited their ability to represent children. The temporary order supplies immediate procedural protection, not a final resolution of every asylum claim or the full lawsuit.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/legal/government/us-judge-blocks-trump-policies-fast-tracking-childrens-asylum-cases-2026-10-30/","label":"Reuters — Oct. 30 court report"}]}],"usa":[{"id":"top-houston-e30","headline":"Attorney: Indicted Houston ICE officer will surrender Monday","summary":"Mario Alberto Morales plans to turn himself in Monday after Friday’s aggravated-assault indictment, his attorney told AP Saturday. Prosecutors allege he intentionally struck Miguel Parra Hernandez with an SUV; the defense calls it an accident. Hernandez is recovering from a broken leg while in federal custody. A surrender plan is not a completed booking or a conviction.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/houston-texas-ice-agent-charged-aggravated-assault-67bcdb11f7ed19aef2100e5c2a83f773","label":"AP — updated Oct. 31, 5:13 p.m. EDT"}]},{"id":"usa-idaho-e31","headline":"Appeals court pauses Idaho health-saving abortion ruling during appeal","summary":"Reuters reports a divided Ninth Circuit panel Friday stayed a judge’s ruling protecting health-saving abortions. The earlier relief had already been narrowed to the doctor who sued. The majority said the constitutional claim was unlikely to succeed; the dissent warned of serious health risks. This is interim appellate relief, not a final resolution of all Idaho emergency-care litigation.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/legal/government/us-court-lifts-ruling-requiring-idaho-allow-some-abortions-protect-womens-health-2026-10-30/","label":"Reuters — Oct. 30 court report"}]},{"id":"usa-patel-e31","headline":"Michigan man charged with threats against FBI director; hearing set Monday","summary":"CNN reports prosecutors charged Anthony Daniel Palazzolo with interstate communications involving threats against Kash Patel and an associate. The complaint attributes threatening messages to him and says he apologized while denying intent to harm. He was temporarily detained Friday without entering a plea; a Monday detention hearing is scheduled. The charges remain allegations.","sources":["CNN"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/31/us/michigan-threats-fbi-kash-patel","label":"CNN — Oct. 31; complaint and prosecutors cited"}]},{"id":"usa-visa-e31","headline":"Mamdani says Trump agreed to visa for slain Bronx teenager’s mother","summary":"AP’s report carried by CNN says Mayor Zohran Mamdani announced Saturday that Trump agreed to grant a visa to Javits Frimpong’s mother in Ghana. The White House had not independently confirmed issuance in the report. The 15-year-old was fatally shot Thursday; police had announced no arrest. Agreement as described by the mayor is not proof the visa was issued.","sources":["CNN"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/31/us/mamdani-javits-frimpong-visa-trump","label":"AP via CNN — Oct. 31"}]},{"id":"usa-preschool-o31","headline":"Colorado preschool case tests religious rights against equal-access rules","summary":"Reuters’ Saturday preview examines a Supreme Court dispute over Colorado’s publicly funded preschool program and its nondiscrimination conditions. Catholic entities argue those conditions burden religious exercise; the state requires equal enrollment opportunity regardless of families’ sexual orientation or gender identity. The upcoming case could change the balance of rights, but the Court has not yet resolved it.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/legal/government/preschool-case-tests-religious-conservatives-us-supreme-court-win-streak-2026-10-31/","label":"Reuters — Oct. 31 court preview"}]},{"id":"usa-measles-o31","headline":"Pennsylvania measles outbreak prompts new openness to vaccination","summary":"AP’s Friday field reporting describes a historic outbreak affecting Amish and conservative Mennonite communities, alongside increased willingness among some residents to receive vaccines. Attitudes vary across the communities and are not dictated by one universal religious prohibition. The reporting documents changing responses to a health emergency, not proof that transmission is contained.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/measles-outbreak-vaccination-amish-mennonite-pennsylvania-8f4fcd6e089e09a94c61a41d0ea474f4","label":"AP — Oct. 30, 12:13 p.m. EDT"}]},{"id":"usa-native-o31","headline":"Native Heritage Month opens with art and traditions that challenge stereotypes","summary":"AP’s Saturday report highlights Indigenous artists, cultural practices and community programs ahead of November’s National Native American Heritage Month. A Las Vegas gallery showcases work from different Indigenous communities and offers free art activities. The coverage emphasizes varied histories and contemporary creativity rather than treating Native Americans and Alaska Natives as one homogeneous group.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/native-american-heritage-month-november-alaska-native-e82ba5b13c597e84e5b8c61b7b2c9535","label":"AP — updated Oct. 31, 2:22 a.m. EDT"}]},{"id":"usa-clocks-o31","headline":"Clocks fall back overnight in most of the U.S.; sleep routines matter","summary":"Most participating U.S. jurisdictions return to standard time at 2 a.m. Sunday, Nov. 1. AP’s Oct. 26 service report explains the extra hour and darker afternoons, with Hawaii and most of Arizona exempt from the change. Health groups favor stable schedules and standard time year-round; that recommendation is not a newly enacted nationwide policy.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/daylight-saving-fall-back-time-change-003f56383585ec8abde704c9c205a8e7","label":"AP — Oct. 26, 6:02 a.m. EDT; relevant tonight"}]},{"id":"usa-roundup-e31","headline":"St. Louis jury rules for Monsanto in post-Supreme Court Roundup trial","summary":"Reuters’ Friday report says a jury rejected three women’s claims in a trial concluded Thursday. It was the first such trial after a Supreme Court decision restricted failure-to-warn arguments. A separate proposed $7.25 billion settlement remains under review. One verdict does not resolve all outstanding claims or settle the scientific debate about glyphosate.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/world/bayer-wins-us-trial-which-it-was-alleged-that-roundup-caused-cancer-three-women-2026-10-30/","label":"Reuters — Oct. 30; verdict Oct. 29"}]},{"id":"usa-comets-o31","headline":"New simulations challenge comet-delivery theory for life’s ingredients","summary":"CNN’s Saturday science report describes simulations suggesting fragile organic molecules would usually be destroyed when comets struck early Earth. The study challenges one mechanism for delivering prebiotic material; it does not explain the entire origin of life or disprove every extraterrestrial-source hypothesis. Researchers’ modeled outcomes are not direct observations of the ancient impacts.","sources":["CNN"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/31/science/origin-life-theory-comet-simulation","label":"CNN — published Oct. 31, 6 a.m. ET"}]}],"boston":[{"id":"boston-saturday-status-o31","headline":"Saturday Boston final: Bruins rally past Chicago 5–4 in overtime","summary":"FINAL Saturday, Oct. 31: Bruins 5, Blackhawks 4, OT. Celtics, Patriots and Red Sox are off today; Red Sox season is complete. FINAL Friday, Oct. 30: Celtics 125, Bulls 111; Bruins, Patriots and Red Sox did not play Friday. UPCOMING Sunday, Nov. 1: Celtics at Orlando, 3:30 p.m. EST; Patriots at Miami, 4:25 p.m. EST; Bruins and Red Sox off. Official NHL, NBA and Patriots schedules checked Saturday evening; no Boston game is in progress. Clocks fall back overnight.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.nhl.com/gamecenter/chi-vs-bos/2026/10/31/2026020217","label":"NHL — official Oct. 31 final; checked Saturday evening"},{"url":"https://www.nba.com/game/chi-vs-bos-0022600016","label":"NBA — official Oct. 30 final"},{"url":"https://www.nba.com/magic/game/0022600154-celtics-vs-magic-orlando-fl-11-01-2026","label":"NBA/Magic — official Sunday 3:30 p.m. EST fixture"},{"url":"https://www.patriots.com/schedule/","label":"Patriots — official Sunday 4:25 p.m. EST schedule"}]},{"id":"boston-brown-e30","headline":"Patriots rule Brown and Henderson out, add Larison and elevate Miller","summary":"New England’s Saturday roster analysis confirms A.J. Brown (ankle/knee) and TreVeyon Henderson (illness) did not travel and will not play Sunday. The team signed Lan Larison to its 53-man roster and elevated Ryan Miller from the practice squad. The Globe independently reports the downgrades. Friday’s questionable designations are superseded; no recovery date is promised.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.patriots.com/news/roster-analysis-patriots-downgrade-wr-a-j-brown-rb-treveyon-henderson-to-out-for-week-8-vs-dolphins","label":"Patriots — Oct. 31, 4 p.m."},{"url":"https://www.bostonglobe.com/2026/10/31/sports/patriots-aj-brown-treveyon-henderson-out-dolphins/","label":"Boston Globe — Oct. 31"},{"url":"https://www.audacy.com/weei/sports","label":"WEEI/Audacy — checked Oct. 31 evening; fresh full text limited"}]},{"id":"boston-bruins-rally-e31","headline":"Geekie’s late equalizer and Lindholm’s overtime goal rescue Bruins","summary":"Boston erased a 4–2 third-period deficit to beat Chicago 5–4 Saturday. Geekie tied it with 12 seconds left; L cago 125–111 Friday for its fourth consecutive victory. Pritchard scored 20 before halftime; Tatum added 26 and Paul George 18 with eight assists, AP’s ESPN recap confirms. The Globe focuses on Pritchard’s two-way work and Mazzulla’s praise after a first-half embrace. The win starts group play; it does not clinch a knockout berth.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.espn.com/nba/recap/_/gameId/401909278","label":"AP via ESPN — Oct. 30 final"},{"url":"https://www.bostonglobe.com/2026/10/30/sports/celtics-bulls-nba-cup-td-garden/","label":"Boston Globe — Oct. 30; readable with paywall elements"}]},{"id":"boston-miami-o31","headline":"Patriots prepare for rebuilding Miami team that Hafley has kept competitive","summary":"The Globe’s Saturday scouting report describes an unusually young, low-cost Dolphins roster after a sweeping teardown. Mike Vrabel credits Jeff Hafley’s work under difficult circumstances. Miami’s personnel changes make preparation less familiar, not an automatic New England victory. Sunday’s scheduled kickoff remains 4:25 p.m. EST.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.bostonglobe.com/2026/10/31/sports/dolphins-patriots-jeff-hafley/","label":"Boston Globe — Oct. 31; partly paywalled"}]},{"id":"boston-durbin-oct30","headline":"Durbin’s foot repair adds second operation to Red Sox offseason","summary":"Boston announced a partial excision of the fifth metatarsal base with tendon repair after Durbin’s earlier pinkie operation. MLB’s Thursday report says the foot injury predated the procedure and Boston expects a healthy start to 2027. An expected recovery is not completed rehabilitation.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.mlb.com/news/caleb-durbin-surgery-right-foot-fracture","label":"MLB — Oct. 29; rechecked Oct. 30"}]},{"id":"boston-eaton-eve29","headline":"Eaton and Cheng deals begin Boston’s 40-man roster squeeze","summary":"The Red Sox traded Nate Eaton to the mazon-e30","headline":"Amazon’s cautious holiday outlook meets accelerating cloud growth","summary":"AP’s Thursday-night earnings report says AWS sales rose 39.3% to $46 billion, while overall results missed expectations and fourth-quarter sales guidance was cautious. Friday’s market report records a 1.4% cash-session share decline. Strong cloud demand and large AI expenditures can coexist; the earlier after-hours decline is not Friday’s closing move.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/amazon-q3-earnings-amazon-web-services-2de72b65d63006a7ce85eab441e2d6b7","label":"AP — updated Oct. 29, 10:35 p.m. EDT"},{"url":"https://apnews.com/article/stock-markets-ai-alphabet-oil-16c266731fdf64178f38070af2b42497","label":"AP — Oct. 30 final market reaction"}]},{"id":"business-intel-e30","headline":"Intel’s weak forecast triggers 28.6% Friday plunge","summary":"Intel’s fourth-quarter adjusted earnings outlook of 25 cents a share fell short of the 43-cent estimate cited by CNBC. AP records a 28.6% completed-session drop Friday, despite better-than-expected third-quarter profit. A forecast is not an already realized quarterly result, and Thursday’s extended-trading quote is not the final Friday loss.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.cnbc.com/2026/10/29/intel-intc-q3-earnings-report-2026-.html","label":"CNBC — Oct. 29 earnings; rechecked Oct. 30"},{"url":"https://apnews.com/article/stock-markets-ai-alphabet-oil-16c266731fdf64178f38070af2b42497","label":"AP — Oct. 30 cash-close share move"}]},{"id":"business-oil-e30","headline":"Exxon and Chevron beat profit expectations as higher fuel prices bite","summary":"Both oil majors reported better-than-expected quarterly results Friday, AP says, helped by higher prices and production. Exxon cited strong Guyana and Permian output, while Chevron included a month of Venezuelan production. Corporate earnings gains do not represent relief for consumers paying eleva ated Oct. 30, 5:42 p.m. EDT"}]}],"world":[{"id":"world-ethiopia-e30","headline":"Rescue sources report at least 15 dead in Ethiopian camp strikes","summary":"Two sources involved in rescue efforts told Reuters drone strikes hit a displaced-persons camp in Amhara. The report says several victims were children and responsibility was unclear; an official reported 36 injured. These are attributed counts and accounts, not an independently established identification of the attacker.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/world/africa/strikes-camp-ethiopia-kill-least-15-sources-say-2026-10-30/","label":"Reuters — Oct. 30; attributed rescue-source toll"}]},{"id":"world-novaya-e30","headline":"Novaya Gazeta announces November closure, blaming Russian state pressure","summary":"Russia’s renowned independent paper says it will shut its office Nov. 9 after its final issue. AP and CNN independently report Friday’s announcement and the editors’ account of official pressure. The announced shutdown date should not be confused with a claim that all operations had already ended Friday.","sources":["Other","CNN"],"signal":"Watch","links":[{"url":"https://apnews.com/article/novaya-gazeta-muratov-russia-crackdown-putin-war-ukraine-f73ceb88bd2ef1c65e786a336e6e12db","label":"AP — updated Oct. 30, 11 a.m. EDT"},{"url":"https://www.cnn.com/2026/10/30/business/novaya-gazeta-russian-newspaper-shutdown-intl","label":"CNN — Oct. 30 independent report"}]},{"id":"world-oleshky-e30","headline":"Oleshky residents begin evacuation under rare joint relief operation","summary":"Reuters reports residents of the Russian-held town began leaving Friday through an arrangement involving both sides of the war. The operation offers localized humanitarian access after months of negotiations. It does not establish a wider ceasefire or resolve the war, despite political efforts to claim diplomatic credit.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.r urn immediately after it is not guaranteed.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/la-chargers-derwin-james-eec5360fc40f045d08819f9e6e7854c8","label":"AP — updated Oct. 31, 6:12 p.m. EDT"}]},{"id":"sports-sweat-e31","headline":"Jets put T’Vondre Sweat on injured reserve with knee injury","summary":"AP reports New York placed its run-stopping defensive tackle on IR Saturday after last week’s injury. The move requires at least four missed games, with Nov. 29 the earliest possible return. That is an eligibility boundary, not a medical promise that he will be ready then.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/jets-tvondre-sweat-c9a3e98121d3caa44a656642dfdb3d8e","label":"AP — updated Oct. 31, 5:07 p.m. EDT"}]},{"id":"sports-bech-e31","headline":"Raiders activate Jack Bech ahead of Jets game","summary":"Las Vegas activated the receiver Saturday after his recovery from a broken left forearm, AP reports. The move clears a roster path for Sunday and may bolster a thin receiving group. Activation is complete; his exact role and performance remain to be seen.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/bech-raiders-jets-thornton-8641406f9a827bb618cfd33f4b7f41ff","label":"AP — updated Oct. 31, 5:20 p.m. EDT"}]},{"id":"sports-curry-o31","headline":"Curry’s 31 helps Warriors erase 25-point deficit and beat Lakers 112–95","summary":"Golden State rallied from an early 25-point hole Friday to win its NBA Cup game. AP reports Curry added six assists and four rebounds; Luka Doncic scored 37 for Los Angeles. The 17-point final margin followed a major comeback, not a wire-to-wire victory.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/lakers-warriors-score-c6260b2281a6abea3b942ed4efe5c5d3","label":"AP — updated Oct. 31, 1:12 a.m. EDT"}]}],"politics":[{"id":"politics-voting-e30","headline":"Early voting outpaces 2022 in battlegroun this cycle","summary":"CNN reports federal committee contributions through mid-October exceed $445 million, making Musk an unusually large Republican benefactor. Analysts say the spending could matter in close races. The filings measure disclosed donations, not a guaranteed electoral effect or a complete tally of every undisclosed expenditure.","sources":["CNN"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/30/politics/elon-musk-midterm-spending-republicans","label":"CNN — updated Oct. 30, 10:58 a.m. ET"}]},{"id":"politics-comey-e30","headline":"Judge questions Comey leak prosecution but issues no ruling","summary":"Judge Trevor McFadden heard arguments Friday over whether prosecutors met a 10-year limitations deadline using a criminal information rather than an indictment. Politico reports he considered waiting to see whether a grand jury indicts. Comey denies guilt; judicial skepticism is not dismissal or acquittal.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.politico.com/news/2026/10/30/doj-comey-judge","label":"Politico — Oct. 30 hearing report"}]},{"id":"politics-ohio-e30","headline":"Ramaswamy ad featuring Acton’s estranged mother comes off air","summary":"AP’s Thursday-night report says the Ohio Republican spent about a quarter of the initially announced amount before the ad stopped running. The report describes criticism of its use of Acton’s family history. The withdrawal is a campaign advertising change, not a court finding about the candidates’ claims.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/ohio-ramaswamy-ad-acton-mother-365745259579371f41122b184254fdde","label":"AP — updated Oct. 29, 10:46 p.m. EDT"}]},{"id":"politics-voting-facts-eve29","headline":"AP debunks ballot-envelope and poll-worker marking claims","summary":"AP’s Thursday fact check explains that Ventura County envelope holes serve accessibility and processing purposes rather than revealing votes to rig the election. It also addresses other viral voting-process claims. The explanations rebut the specific examples examined; a social-media allegation alone is not proof of invalid ballots.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/fact-check-midterms-election-voting-ballot-5933df3747ceaf6091324959d8b9c59b","label":"AP — updated Oct. 29, 1:38 p.m. EDT"}]}],"entertainment":[{"id":"ent-qualley-e30","headline":"Margaret Qualley and Jack Antonoff file for divorce","summary":"Court records show an uncontested matrimonial action filed Friday in Brooklyn after three years of marriage, AP reports. Qualley is the plaintiff and Antonoff the defendant. Filing is not a final divorce judgment, and the records do not establish a public explanation for the separation.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/antonoff-qualley-divorce-a853342b11bf53867e103680d7b861ba","label":"AP — updated Oct. 30, 6:44 p.m. EDT"}]},{"id":"ent-ross-e30","headline":"Prosecutors drop Rick Ross felony count; misdemeanor case continues","summary":"Miami-Dade prosecutors dropped battery by strangulation for insufficient evidence, AP reports Friday. Ross still faces a misdemeanor domestic-battery charge and has pleaded not guilty. Dismissal of one count does not mean the entire case ended or that the remaining allegation has been proven.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/rick-ross-arrest-miami-beach-florida-9c5bb3af32cd3381dd95bb64e8e31ebf","label":"AP — updated Oct. 30, 12:45 p.m. EDT"}]},{"id":"ent-kirk-e30","headline":"Kirk Franklin embraces a less apologetic turn on new album","summary":"In AP’s Friday interview, the gospel star discusses “I Am What I Am,” collaborations and criticism of his work with artists outside gospel. The 14th studio album frames his current artistic outlook. His reflections are the artist’s perspective, not a universal assessment of the record’s reception.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/kirk-franklin-interview-fa06a5ef09722713549309789ee34eb7","label":"AP — updated Oct. 30, 6:52 p.m. EDT"}]},{"id":"ent-yankee-e30","headline":"Daddy Yankee’s “La Postal” turns reggaeton toward a concept album about love","summary":"AP’s Friday review describes 15 tracks built around romantic, familial and spiritual love. The release marks another move after his retirement announcement and subsequent faith-centered work. The evaluation is criticism, not evidence of commercial performance or a return to every aspect of his old touring career.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/daddy-yankee-la-postal-music-review-a872077854a18726532a5840b2dc097b","label":"AP — updated Oct. 30, 11:07 a.m. EDT; music review"}]},{"id":"ent-stewart-e30","headline":"Stewart appreciation traces the stage career behind his screen fame","summary":"AP’s Friday appreciation revisits Patrick Stewart’s Shakespearean work and repeated returns to theater after “Star Trek” and “X-Men.” The perspective adds substantive career context following his death rather than recycling an unverified medical explanation. It is a critical remembrance, not a new cause-of-death report.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/patrick-stewart-shakespeare-theater-appreciation-9fe4ffe6024a270aad3a456ae26a11b7","label":"AP — updated Oct. 30, 11:38 a.m. EDT"}]},{"id":"ent-addams-e30","headline":"Westfield turns Charles Addams’ hometown into Halloween destination","summary":"AP’s Thursday feature describes AddamsFest, transformed storefronts and the New Jersey landmarks that inspired the cartoonist’s macabre style. The seasonal celebration has immediate Halloween relevance. It is a local cultural event, not an announcement of a new film or television production.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/addams-family-author-hometown-new-jersey-halloween-3af3a0164d3a20996e2beeb0effdee83","label":"AP — updated Oct. 29, 10:26 a.m. EDT"}]},{"id":"entertainment-gentle-oct28eve","headline":"“Gentle Monster” review examines denial inside a family drama","summary":"AP critic Lindsey Bahr’s Wednesday review highlights Léa Seydoux’s restrained performance in Marie Kreutzer’s film about a family confronted by a criminal investigation. The review questions the excuses people make for loved ones. These are assessments of fiction, not allegations about the actors or filmmakers.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/gentle-monster-movie-review-918881df1a322ae09fc019c9fd0a57a5","label":"AP — updated Oct. 28, 11:52 a.m. EDT; film review"}]}]},"researchNotes":["Saturday Oct. 31 evening limited refresh. Four eligible tabs freshly researched/reranked. Business, World, Politics and Entertainment exactly preserved from verified Friday evening; no market research; schedule unchanged.","Fox, CNN and Drudge checked at runtime. AP/Reuters independently verify Alaska investigative developments and Journal dismissal; AP/CNN agree on Fairfield death and six wounded but differ on one hospital-condition snapshot, omitted. Reuters attributes Binance theft to FBI statement, advancing beyond the earlier private assessment. Drudge is an aggregator.","Boston Saturday FINAL Bruins 5–4 Blackhawks OT independently verified with NHL, AP/ESPN and Globe. Other three teams off. Friday Celtics 125–111 Bulls remains latest NBA result. Official NBA/Magic and CBS schedules independently match Sunday Orlando 3:30 p.m. EST; Patriots official schedule 4:25 p.m. EST. No game in progress; clocks fall back overnight.","Official Patriots Saturday roster analysis and Globe confirm Brown/Henderson downgraded to out, Larison signed and Miller elevated. Globe partly readable beneath paywall elements. WEEI/Audacy checked but fresh full text limited. Four-team substantive coverage rechecked, including Gray option, Durbin rehabilitation and roster-trade deadlines; actual original dates preserved.","AP hub surfaced older ballot fact-check and Addams story already preserved in Politics/Entertainment: excluded from refreshed tabs. Swift predicted weekday was ambiguous: omitted. Texas Tech article contains an Arizona State typo in a paragraph; used its unambiguous headline, opening and final score without that paragraph. General Sports excludes all Boston teams, auto racing, international soccer and WNBA."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, international soccer, or WNBA coverage.',business:'7 unique business/markets stories refreshed only at 7 p.m. Eastern Monday through Friday, with independently confirmed figures for the latest completed U.S. cash session. Preserved unchanged at all other editions.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
</body></html>
