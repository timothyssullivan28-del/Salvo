<script id="briefing" type="application/json">{"date":"2026-10-27","lastUpdated":"October 27, 2026, 7:09:39 a.m. EDT Boston","dek":"Tuesday morning limited refresh: Top News, USA, Boston Sports and Sports researched and re-ranked; Business, World, Politics and Entertainment retain Monday evening’s verified cards, links, original dates and Tells.","take":"Israel’s vote, California’s procedural ruling and the disputed federal prosecutions put security and institutional legitimacy at the center. Fox stresses Netanyahu’s survival and Iranian threats; CNN emphasizes voting safeguards and the Comey case, while Drudge leads with whether Netanyahu is on the brink. They share the stakes but not the framing; Drudge is an aggregator, not an independent reporting source, and allegations remain distinct from findings.","sectionTakes":{"top":"Israel’s vote, California’s procedural ruling and the disputed federal prosecutions put security and institutional legitimacy at the center. Fox stresses Netanyahu’s survival and Iranian threats; CNN emphasizes voting safeguards and the Comey case, while Drudge leads with whether Netanyahu is on the brink. They share the stakes but not the framing; Drudge is an aggregator, not an independent reporting source, and allegations remain distinct from findings.","usa":"The new scam report and FBI hearing highlight oversight and contested accountability, while hospital disruption, floods and measles keep public safety prominent. The golf injunction is an interim ruling, the hearing remains upcoming, and Monday’s incident reports retain their actual dates rather than posing as new Tuesday events.","boston":"The Celtics beat Chicago 134–99 and host Brooklyn tonight at 7:30; the Bruins visit Carolina at 8, with the other two teams off. Pritchard’s bench burst, Vrabel’s conditional fine and Adams’ catching-depth opportunity lead the substantive news. Globe reporting remains partly paywalled, while WEEI/Audacy hubs offered limited fresh full text; official sources supplied game and roster verification.","business":"CONFIRMED Monday, Oct. 26 close: Dow 52,361.58, up 146.42 points (+0.28%), and Nasdaq Composite 26,169.38, up 214.04 (+0.83%). AP and Reuters match closing levels and point moves, with Reuters supplying precise percentages. AI financing lifted sentiment while buyouts, alleged overcharging and uncompleted delivery and tariff talks show the broader economic trade-offs.","world":"Egypt’s authorization and Jordan’s strikes widen the regional-security stakes, while Kyiv’s casualty figures and Congo’s worker attack remain attributed to officials. China’s plenum and Japan’s succession law concern institutional power; the pope’s travel clearance and Phuket’s receding water are not guarantees against further complications.","sports":"Milwaukee’s 10–1 win leaves it one victory short of a championship, while Dallas, Golden State, Cleveland and Detroit have completed wins. Williams’ and Wallace’s surgeries remain major roster risks, and the NBA’s market safeguards and MLB’s positioning tests are not guarantees of integrity or future rule changes.","politics":"The new poll and Mississippi visit show Republican pressure, but district structure can limit the size of any Democratic gains. AI-targeted campaign messaging and the voter-tip reward raise verification questions, while CNN’s Noem report concerns an unauthorized presentation rather than false job-change content. Polls, strategies and promises are not election outcomes.","entertainment":"Koenig and Bauza’s deaths mark major losses, while Brown’s suspended sentence is a completed court outcome rather than an acquittal. Ministry’s farewell, the Disney–Channel 4 rollout and this week’s streaming remain forward-looking; the weekend box-office figures are estimates."},"sections":{"top":[{"id":"top-israel-election-oct26-eve","headline":"Israel votes with Netanyahu’s future and postwar direction at stake","summary":"AP reports Israelis are voting Tuesday in a tight contest centered on security and Netanyahu’s leadership after three years of war. Election officials reported almost 17% turnout in the first three hours. Voting is underway; no winner or governing coalition has been established, and coalition negotiations could follow the count.","sources":["Other","Fox","Drudge"],"signal":"Watch","links":[{"url":"https://apnews.com/article/israel-election-netanyahu-eisenkot-3b5a0fd078208155337ee9a0b9fbfde2","label":"AP — updated Oct. 27, 6:56 a.m. EDT"},{"url":"https://www.foxnews.com/world/netanyahu-fights-political-future-israel-heads-polls-iran-threat-looming","label":"Fox News — election coverage checked Oct. 27; article access limited"},{"url":"https://www.drudgereport.com/","label":"Drudge Report — aggregator checked Oct. 27 morning"}]},{"id":"top-comey-oct26-eve","headline":"Comey challenges DOJ’s third case as indictment and deadline remain disputed","summary":"CNN’s overnight update says DOJ describes its criminal information over an alleged 2016 national-security leak as not yet enforceable while it seeks formal charges. Comey argues an indictment was required before the ten-year deadline. A judge must decide the filing’s validity; allegations and a disputed deadline are not a conviction.","sources":["CNN","Other"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/26/politics/james-comey-charged","label":"CNN — updated Oct. 27, 12:40 a.m. ET"},{"url":"https://www.reuters.com/world/ex-fbi-director-comey-charged-again-by-us-justice-department-nbc-news-reports-2026-10-26/","label":"Reuters — Oct. 26"}]},{"id":"top-california-ruling-oct27","headline":"Appeals court declines California ballot intervention; district hearing comes next","summary":"The Ninth Circuit’s 2–1 decision refused emergency intervention over roughly 20,000 ballots DOJ alleges may belong to noncitizens. AP and CNN report the majority found appellate intervention premature before district-court consideration, with a Tuesday hearing next. It is a procedural setback, not proof the flagged voters are ineligible or a final merits ruling.","sources":["Other","CNN"],"signal":"Watch","links":[{"url":"https://apnews.com/article/california-noncitizen-voting-justice-department-lawsuit-ed14390afb8af8fde1c2d0f6a90a0761","label":"AP — updated Oct. 26, 9:49 p.m. EDT"},{"url":"https://www.cnn.com/2026/10/26/politics/california-mail-ballot-noncitizen-appeals-court-rejects","label":"CNN — updated Oct. 26, 8:22 p.m. ET"}]},{"id":"top-ice-citizenship-oct27","headline":"AP finds records supporting detained man’s claim to U.S. citizenship","summary":"AP’s investigation finds documents supporting lawyers’ and family claims that Phillip James was born in Florida, despite ICE seeking to deport him to Jamaica. DHS disputes his citizenship and alleges a fraudulent birth certificate without supplying evidence to AP. His lawyers are challenging the nearly ten-month detention and removal ruling; the federal petition remains unresolved.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/ice-immigration-wrongful-detention-indiana-3109797bea2b2102e130a82691d634af","label":"AP — updated Oct. 27, 3:08 a.m. EDT"}]},{"id":"top-iran-plans-oct26","headline":"CNN: U.S. forces prepared for major Iran strikes if Trump orders them","summary":"Two U.S. officials tell CNN forces could begin major operations within 96 hours of an order, with military, energy and nuclear targets under consideration. The report says Trump has not decided; planning is not a launch order. The Times of Israel relays CNN’s reporting and notes Netanyahu’s office denies the reported Israeli pressure; that relay is not independent confirmation.","sources":["CNN","Other"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/26/politics/us-iran-strike-plans-trump","label":"CNN — updated Oct. 26, 6:40 a.m. ET"},{"url":"https://www.timesofisrael.com/liveblog_entry/cnn-netanyahu-pushed-for-iran-strike-before-election-trump-refused-but-signaled-there-will-be-joint-action-soon-pmo-denies-report/","label":"Times of Israel — Oct. 26; reports PM office denial"}]},{"id":"top-fairford-charges-oct27","headline":"UK charges two men over Fairford incident; police allege Iran connection","summary":"Reuters reports prosecutors charged Mohmed Abdulkarim with conduct likely to materially assist a foreign intelligence service and Nouman Essghir with entering a prohibited place for a prejudicial purpose. Police identify Iran as the country allegedly assisted. The men are due in court Tuesday; these are allegations, not convictions.","sources":["CNN"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/27/uk/fairford-incident-charges-iran-intl","label":"Reuters via CNN — published Oct. 27, 6:30 a.m. ET"}]},{"id":"top-brazil-count-oct25-evening","headline":"Trump calls Brazil vote “rigged” without evidence as Lula’s win draws recognition","summary":"Reuters reports Trump backed Flávio Bolsonaro’s objections without offering evidence. Lula won by more than four million votes; an analysis cited by Reuters found fewer than 35,000 ballots were cast during the disputed extension. Bolsonaro seeks annulment, while global leaders recognize the result.","sources":["Other","Drudge"],"signal":"Watch","links":[{"url":"https://www.reuters.com/world/americas/brazil-heads-back-future-flavio-bolsonaro-refuses-recognize-lula-win-2026-10-26/","label":"Reuters — Oct. 26"},{"url":"https://apnews.com/article/brazil-election-lula-bolsonaro-runoff-vote-president-e2c9fe8fc4aa3e3675b9a8ec15405d93","label":"AP — Updated 2:56 AM EDT, October 26, 2026"},{"url":"https://www.drudgereport.com/","label":"Drudge Report — aggregator checked Oct. 26 evening"}]},{"id":"top-ukraine-energy-oct26-eve","headline":"UN-backed inquiry finds Russian energy attacks were war crimes","summary":"A UN-backed commission says deliberate attacks on Ukraine’s energy infrastructure constituted war crimes and crimes against humanity, leaving civilians without heat, power and critical services. Its Monday report also alleges coerced or deceptive recruitment from 29 countries. These are investigative findings, not completed criminal trials.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/un-russia-ukraine-commission-report-war-crimes-27ee6394694bb30a7f1eab9addced768","label":"AP — Updated 6:48 PM EDT, October 26, 2026"}]},{"id":"top-mink-birdflu-oct26","headline":"Utah mink outbreak raises pandemic-risk concerns, investigation finds","summary":"ProPublica’s investigation, republished by CNN, reports bird flu spreading for more than two months at a Utah mink farm and alleges authorities failed to contain it. Experts warn that mink could enable dangerous adaptation; the report does not establish sustained human-to-human spread or a new human pandemic. Its conclusions rely on records and attributed scientific assessments.","sources":["CNN"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/26/health/bird-flu-mink-farm-propublica","label":"CNN/ProPublica — Oct. 26, 6 a.m. ET"}]},{"id":"world-serbia-oct23-eve","headline":"Serbia’s student movement wins; governing agenda is the next test","summary":"Reuters reports the student-led movement won Sunday’s parliamentary election, ending Aleksandar Vucic’s long rule. Its yet-to-be-named leaders face difficult decisions on Kosovo, EU ties and entrenched institutions. The election victory is reported as completed; the identity and policies of the next government are not settled.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/world/serbias-new-leaders-face-host-tough-challenges-2026-10-26/","label":"Reuters — Oct. 26"}]}],"usa":[{"id":"usa-scams-report-oct27","headline":"Congressional investigation finds fragmented U.S. response to global scams","summary":"A report released by ranking Democrats on the Joint Economic Committee says agencies lack a unified accounting of seized scam proceeds or money returned to victims. AP reports its calls for stronger coordination and private-sector engagement after a yearlong investigation. The report identifies failures and recommendations, not a newly enacted compensation program.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/scams-us-congress-money-b807b60a2cecc4decd2632d488ffec18","label":"AP — updated Oct. 27, 5 a.m. EDT"}]},{"id":"usa-fbi-hearing-oct27","headline":"Former FBI officials face hearing in disputed Hunter Biden laptop case","summary":"AP reports Nikki Floris and Bradley Benavides are due in federal court Tuesday on charges of lying to Congress about their knowledge of Hunter Biden investigations. Their lawyers call the prosecution baseless and politically motivated and plan to challenge the criminal-complaint procedure. A scheduled preliminary hearing is not a ruling or conviction.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.kens5.com/article/news/nation-world/ex-fbi-officials-charged-hunter-biden-laptop-court-case/507-acfa2914-e710-43de-b2ca-b0267e826283","label":"AP via KENS 5 — Oct. 27 hearing preview"}]},{"id":"usa-unm-cyber-oct26-eve","headline":"Cybersecurity disruption diverts patients from New Mexico’s only top trauma center","summary":"UNM Health System diverted ambulances, canceled appointments at more than 30 clinics and told people not to arrive at its main hospital, AP reports. The network was working to resolve the issue Monday; its extent and nature were not immediately clear. Other providers were coordinating additional care.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/new-mexico-health-cybersecurity-hack-7a3593f8a3cee4ca895774ab1574919f","label":"AP — Updated 6:41 PM EDT, October 26, 2026"}]},{"id":"top-fourcorners-flood-oct25","headline":"Four Corners flooding spreads to Bluff as officials warn of more rain","summary":"AP’s late Monday update reports evacuations in Bluff, Utah, after San Juan River flooding moved downstream from Colorado and New Mexico. New Mexico’s governor estimates damage could total $300 million; that is an estimate, not an audited final loss. The report warns of further rain and lingering flood hazards rather than an all-clear.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/four-corners-flooding-storm-river-evacuations-a91e683f54e41eb3fe8c03863a502d21","label":"AP — updated Oct. 26, 8:55 p.m. EDT"}]},{"id":"usa-measles-oct26-eve","headline":"Pennsylvania reports 1,360 measles cases, up 22","summary":"Reuters cites the state health department’s Monday update showing 258 hospitalizations this year. Pennsylvania reports five measles-related deaths, while CDC has confirmed three; the differing counts should not be collapsed into one. The national CDC case total cited in the report is dated Oct. 22.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/legal/litigation/pennsylvania-measles-cases-rise-1360-state-health-department-says-2026-10-26/","label":"Reuters — Oct. 26"}]},{"id":"usa-golf-injunction-oct27","headline":"Judge extends block on tree removal at East Potomac golf course","summary":"Judge Ana Reyes issued a preliminary injunction barring further tree damage and requiring ten days’ written notice before irreparable changes while litigation continues. AP reports the order extends the earlier temporary pause on the administration’s renovation plans. This is an interim court restriction, not a final resolution of the project.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.wsls.com/news/politics/2026/10/27/judge-extends-court-ordered-block-on-trumps-renovation-plans-for-public-golf-course-in-washington/","label":"AP via WSLS — updated Oct. 27, 12:02 a.m."}]},{"id":"usa-tallahassee-oct26","headline":"Teen to face adult charges after Florida A&M shooting wounds 11","summary":"Authorities say an arrested 15-year-old will be charged as an adult after Saturday’s shooting near the homecoming game. Eleven people were hit by gunfire and another was injured while fleeing, AP clarifies. Police say none appeared to be intended targets; charges are not a finding of guilt.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/florida-am-shooting-arrest-tallahassee-e91b8d7e82eb8dee7a38df18771d0adf","label":"AP — Updated 2:15 PM EDT, October 26, 2026"}]},{"id":"usa-tennessee-escape-oct26-eve","headline":"Tennessee searches for escaped prisoner serving life for murder","summary":"Officials say Jacob Morley slipped through a fence at Northwest Correctional Complex and was discovered missing late Sunday. A regional search and reward were announced. AP’s Monday afternoon update reports the escape and search, not a recapture or a confirmed explanation of how he breached the fence.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/tennessee-man-escaped-prison-f59cae91a8075f5a464c416b4a8aca34","label":"AP — Updated 4:06 PM EDT, October 26, 2026"}]},{"id":"usa-cattle-port-oct26-eve","headline":"New Mexico cattle crossing reopens with tighter screwworm safeguards","summary":"Mexican cattle resumed crossing at Columbus after nearly two years, under layered treatments and inspections. AP reports it is the third port to reopen under the new safeguards. Officials say vigilance remains necessary because flies can cross independently; reopening does not promise an immediate drop in beef prices.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/screwworm-cattle-imports-mexico-agriculture-d3012f8391db129f099ef9000c9a796b","label":"AP — Updated 5:32 PM EDT, October 26, 2026"}]},{"id":"usa-schools-tech-oct26-eve","headline":"Parents and school districts reconsider device-heavy classrooms","summary":"CNN’s Monday report examines a growing push to remove screens and restore printed material after pandemic-era technology expansion. It describes parent activism and local policy debates, not a nationwide device ban or a single settled verdict on every classroom use. Changes depend on individual districts and implementation.","sources":["CNN"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/26/us/schools-anti-tech-parents-movement","label":"CNN — PUBLISHED Oct 26, 2026, 6:30 AM ET"}]}],"boston":[{"id":"boston-tuesday-status-oct27","headline":"Tuesday Boston scoreboard: Celtics host Nets; Bruins visit Carolina","summary":"FINAL Monday, Oct. 26: Celtics 134, Bulls 99. UPCOMING Tuesday, Oct. 27: Celtics host Brooklyn at 7:30 p.m. EDT; Bruins visit Carolina at 8 p.m. EDT. No Patriots or Red Sox game Tuesday; Red Sox season is complete. FINAL Saturday: Bruins 6, Sharks 4. FINAL Thursday: Bears 30, Patriots 24. NBA/ESPN, NHL and Patriots schedules checked Tuesday morning; no Boston game is in progress.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.nba.com/game/chi-vs-bos-0022600121","label":"NBA — official Monday final checked Oct. 27"},{"url":"https://www.espn.com/nba/team/schedule/_/name/bos/boston-celtics","label":"ESPN — Tuesday Celtics schedule checked Oct. 27"},{"url":"https://www.nhl.com/gamecenter/bos-vs-car/2026/10/27/2026020189","label":"NHL — official Tuesday Bruins game, 8 p.m. EDT"},{"url":"https://www.patriots.com/schedule/","label":"Patriots — official schedule checked Oct. 27"}]},{"id":"boston-pritchard-oct27","headline":"Pritchard’s 19-point third quarter powers 134–99 Celtics win","summary":"The official recap credits Pritchard with 28 points, seven threes and a career-high-tying 19-point quarter against Chicago Monday. Boston outscored the Bulls 36–11 over the final 7:31 of the third with Tatum on the bench. The completed win highlights bench production and spacing, not a prediction for Tuesday’s Brooklyn game.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.nba.com/celtics/news/game-recap-keys-20261026-chibos","label":"Celtics/NBA — Oct. 26, 11:29 p.m. EDT"},{"url":"https ractice-squad-release-ol-jacob-rizy-from-the-practice-squad-release-p-bryce-baringer-from-injured-reserve-list","label":"Patriots — Oct. 26, 4 p.m. EDT roster announcement"}]},{"id":"boston-geekie-oct26-eve","headline":"Geekie’s new line powers Bruins into demanding road trip","summary":"The Bruins enter Carolina with points in eight straight games and seven wins in that span. Monday’s practice report highlights Geekie alongside Fraser Minten and Marat Khusnutdinov; Geekie has nine points in 12 games. Tuesday’s meeting with the defending champions is upcoming, not a result.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.nhl.com/bruins/news/practice-report-geekie-bruins-gear-up-for-two-game-road-trip","label":"Bruins/NHL — Oct. 26, 2:37 p.m. EDT practice report"}]},{"id":"boston-vrabel-weei-oct26-eve","headline":"Vrabel tells WEEI Patriots were not good enough in all three phases","summary":"In Monday’s Greg Hill Show appearance, Vrabel reviewed the Thursday loss to Chicago and the improvements needed going forward. The official team page identifies the WEEI interview and date; it supports the coach’s assessment without supplying a new injury diagnosis or claiming another game was played.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.patriots.com/video/head-coach-mike-vrabel-on-weei-10-26-we-weren-t-good-in-enough-in-all-three-phases","label":"Patriots/WEEI — Oct. 26 Greg Hill Show interview"},{"url":"https://www.audacy.com/weei","label":"WEEI/Audacy — current hub checked Oct. 27 morning"}]},{"id":"boston-hagens-grit-oct25","headline":"Hagens’ net-front work shows a broader offensive toolkit","summary":"The Globe’s Sunday observations emphasize the rookie’s gritty rebound winner against San Jose. Boston’s official recap confirms his fourth goal and second point of the night, and quotes Marco Sturm on pushing him toward the crease. It is a development story about his role, not just a duplicate score recap.","sources":["Other"], ats, partisan sorting and other constraints on the size of potential gains. Low presidential approval does not automatically translate into a wave everywhere. These are scenarios and structural analysis before Nov. 3, not a settled forecast.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.reuters.com/world/us/six-reasons-democrats-may-fall-short-midterm-landslide-november-2026-10-26/","label":"Reuters — Oct. 26"}]}],"entertainment":[{"id":"ent-koenig-oct26-eve","headline":"Walter Koenig, Chekov of “Star Trek,” dies at 90","summary":"AP and CNN report the actor’s death, citing his agent, and trace his work from the original Enterprise crew to later films and “Babylon 5.” Their accounts differ on the calendar day of death, so this briefing does not resolve that discrepancy or state a specific day.","sources":["Other","CNN"],"signal":"Watch","links":[{"url":"https://apnews.com/article/walter-koenig-dies-ad6aed51fc41417a8812bffccec1393c","label":"AP — Updated 4:24 PM EDT, October 26, 2026"},{"url":"https://www.cnn.com/2026/10/26/entertainment/walter-koenig-death","label":"CNN — Updated Oct 26, 2026, 2:28 PM ET"}]},{"id":"ent-bauza-oct26-eve","headline":"Eric Bauza, modern voice of Looney Tunes characters, dies at 46","summary":"AP reports Bauza died late Sunday, citing his family, and says the medical examiner identified hypertensive cardiovascular disease. His performances included Bugs Bunny and Daffy Duck, alongside hundreds of other credits. The report celebrates his work without speculating about unreported circumstances.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/eric-bauza-dies-looney-tunes-8c1734613618286e454bd6cc17718b82","label":"AP — Updated 1:41 PM EDT, October 26, 2026"}]},{"id":"ent-chrisbrown-oct26-eve","headline":"Chris Brown receives suspended sentence for London nightclub attack","summary":"The singer was given an eight-month sentence suspended for a year after pleading guilty to affray over the ailability.","sources":["Other"],"signal":"Watch","links":[{"url":"https://variety.com/2026/tv/global/disney-landmark-content-deal-uk-channel-4-1236931195/","label":"Variety — Oct. 26, 4:01 p.m. PT"}]},{"id":"ent-streaming-oct26-eve","headline":"This week’s streaming includes Perry docuseries and “The Gilded Age”","summary":"AP’s Monday guide previews “Minions & Monsters,” Matthew Perry coverage, Daddy Yankee’s new album and the fourth season of “The Gilded Age,” among other releases. These are scheduled offerings and editorial recommendations, not a claim that every title is available on every platform or already released.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/october-2026-streaming-releases-movies-tv-music-386a371d5be49be209b4253b52881454","label":"AP — Updated 12:01 AM EDT, October 26, 2026"}]}]},"researchNotes":["Tuesday Oct. 27 morning limited refresh; schedule unchanged. Only Top News, USA, Boston Sports and Sports researched and re-ranked. Monday evening’s other four tabs preserved exactly; no market research performed.","Official NBA recap and ESPN establish Celtics 134, Bulls 99 Monday. NBA/ESPN list Brooklyn at Boston Tuesday 7:30 p.m. EDT; NHL game center confirms Bruins at Carolina 8 p.m. EDT. Patriots and Red Sox have no Tuesday game; Red Sox season complete.","WEEI/Audacy and Globe checked. Globe access varies: some full reporting readable with subscription overlays, some pages return subscription errors. WEEI offers current hubs with limited full article text; official Patriots page identifies the Oct. 26 interview.","AP and CNN agree on the California appellate procedural setback; no noncitizenship finding is inferred. AP’s ICE investigation reports records and competing citizenship claims. Reuters supplies the UK charging report.","Fox’s election article exposed limited body text; framing comparison uses the freshly checked Fox homepage. Drudge is an aggregator. Some Reuters direct scrapes failed; preserved source labels are not represented as new independent confirmations.","Older retained analysis and news are explicitly dated, including Red Sox coaching and MLB rule experiments. Bruins and Patriots previous finals retain their actual days."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, international soccer, or WNBA coverage.',business:'7 unique business/markets stories refreshed only at 7 p.m. Eastern Monday through Friday, with independently confirmed figures for the latest completed U.S. cash session. Preserved unchanged at all other editions.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
</body></html>
