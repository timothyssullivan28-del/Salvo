pitalized, one critically. Investigators say a fight preceded the shooting near Florida A&M’s homecoming celebration; motive and responsibility remain under investigation.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.durangoherald.com/articles/associated-press/police-in-florida-are-seeking-information-and-videos-after-a-shooting-injured-12-at-football-game/","label":"AP via Durango Herald — Oct. 25, 12:59 p.m. MT"},{"url":"https://www.reuters.com/world/us/least-12-injured-shooting-tallahassee-florida-2026-10-25/","label":"Reuters — Oct. 25"}]},{"id":"top-fourcorners-flood-oct25","headline":"More flooding and a tornado leave Four Corners crews checking hazards","summary":"AP’s Sunday evening update reports renewed flooding, a confirmed Santa Fe tornado and continued evacuations in the saturated Southwest. Officials warn about downed power lines, contaminated water and damaged gas lines; Navajo utility officials report sewage releases into the San Juan River. Damage totals remain incomplete, and New Mexico’s congressional delegation is seeking a federal emergency declaration.","sources":["Other"],"signal":"Watch","links":[{"url":"https://www.wsls.com/news/national/2026/10/25/more-flooding-possible-in-four-corners-region-after-days-of-heavy-rain/","label":"AP via WSLS — updated Oct. 25, 6:45 p.m. EDT"}]},{"id":"top-alaska-oct23-eve","headline":"Trump says he ordered suit to block Alaska Senate certification if Sullivan loses","summary":"DOJ asks a federal court to prevent certification of a Mary Peltola victory while a second Dan Sullivan remains on the ballot. Trump said Friday he directed the lawsuit; the second Sullivan denies being a Democratic plant. This is a requested remedy, not a court order or an election result.","sources":["Other","CNN","Drudge"],"signal":"Watch","links":[{"url":"https://apnews.com/article/alaska-senate-race-sullivan-name-lawsuit-certification-d8f4a3c7b5247cc427a05f796d7c0d82","label":"AP — updated Oct. 23, 10:44 p.m. EDT"},{"url":"https://www.cnn.com/2026/10/23/politics/doj-sues-alaska-dan-sullivan-us-senate","label":"CNN — Oct. 23, 2026"},{"url":"https://www.drudgereport.com/","label":"Drudge Report — aggregator checked Oct. 23"}]},{"id":"top-php-oct23","headline":"AI exploitation of long-known PHP weaknesses drives emergency patching","summary":"CNN’s new analysis traces the PHP emergency to vulnerabilities known for years that AI made practical to exploit quickly. A patch is available; widespread exposure and exploitation attempts do not establish that every vulnerable website was compromised.","sources":["CNN","Other","Drudge"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/23/tech/ai-cybersecurity-php2shell-explained","label":"CNN analysis — Oct. 23, 2026"},{"url":"https://www.reuters.com/world/asia-pacific/cloudflare-sees-millions-exploit-attempts-after-php-disclosure-2026-10-22/","label":"Reuters — Oct. 22, 2026"},{"url":"https://www.cnn.com/2026/10/21/tech/php2shell-vulnerability-ai-intl","label":"CNN — PHP vulnerabilities, updated Oct. 22, 5:55 a.m. ET"},{"url":"https://www.drudgereport.com/","label":"Drudge Report — aggregator framing checked Oct. 23"}]},{"id":"top-melanoma-vaccine-oct24","headline":"Personalized mRNA vaccine lowers melanoma recurrence risk in major study","summary":"Moderna and Merck report that adding an individualized vaccine to standard treatment reduced the risk of melanoma returning by 42% two years after surgery. AP describes the advanced trial and outside specialists’ reactions. The result concerns a specific studied regimen, not a universal cancer cure or an announced approval.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/moderna-cancer-vaccine-melanoma-mrna-intismeran-415ececd79c9411498751246742aafa2","label":"AP — Oct. 22, 6:23 p.m. EDT"}]}],"usa":[{"id":"usa-newport-fire-oct25-evening","headline":"Newport evacuation area shrinks as seafood-plant fire response continues","summary":"CNN reports low traces of ammonia in smoke and no reported injuries after the Pacific Seafood fire. KVAL’s later local update says most evacuation orders ended, with only a smaller nearby area remaining; the state fire marshal says the ammonia tank appears intact and is not believed to be leaking. The cause remains under investigation, and precautionary air-quality monitoring continues.","sources":["CNN"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/25/us/newport-oregon-seafood-plant-evacuation","label":"CNN — updated Oct. 25, 6:47 p.m. ET"},{"url":"https://kval.com/news/local/evacuation-orders-issued-for-mile-radius-around-newport-fire","label":"KVAL — updated Oct. 25, 3:59 p.m. local time"}]},{"id":"usa-woodland-ice-oct25","headline":"Video and local police challenge ICE’s account of SUV hitting pedestrian","summary":"CNN reports surveillance and other recordings contradict DHS’ claim that Antonio Moreida jumped onto an immigration vehicle’s hood in Woodland, California. Local police have opened a criminal investigation. The article contains inconsistent incident-date text, so this briefing does not assign a disputed calendar date or treat the investigation as a conviction.","sources":["CNN"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/25/us/woodland-man-struck-by-ice-vehicle","label":"CNN — updated Oct. 25, 11:18 a.m. ET"}]},{"id":"usa-bishops-apology-oct25-evening","headline":"Two bishops regret White House prayer photo they say was politicized","summary":"Milwaukee Archbishop Jeffrey Grob and Des Moines Bishop William Joensen say publicity around Thursday’s meeting exploited prayer for partisan purposes. AP reports the White House declined to answer its consent question and defended Trump’s record for Catholics. Their statements establish their objections, not a court finding about the meeting.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/donald-trump-catholic-bishops-photos-prayer-midterms-7ee124ae0462cf2fb550ffa41f296ab8","label":"AP — updated Oct. 25, 5:11 p.m. EDT"}]},{"id":"usa-guns-ballot-oct25-evening","headline":"Massachusetts gun-law referendum contrasts with Idaho state-gun vote","summary":"Massachusetts voters will decide whether to retain a 2024 law requiring firearm serialization and registration and broadening restrictions. Idaho’s nonbinding question asks voters which historic firearm to honor. AP’s Sunday report illustrates opposing policy approaches; neither November ballot question has yet been decided.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/gun-registry-firearms-massachusetts-montana-b47732768b4ec073d08f789e87f943c5","label":"AP — updated Oct. 25, 7:11 a.m. EDT"}]},{"id":"usa-alexander-sentencing-oct25","headline":"Alexander brothers face sentencing after sex-trafficking convictions","summary":"Tal, Alon and Oren Alexander are scheduled to be sentenced Tuesday after a jury convicted them on all counts earlier this year, CNN reports. Prosecutors seek life terms; defense lawyers seek 15 years and dispute the underlying allegations. The sentence has not yet been imposed.","sources":["CNN"],"signal":"Watch","links":[{"url":"https://www.cnn.com/2026/10/25/us/alexander-brothers-sentencing-sex-trafficking","label":"CNN — Oct. 25, 6 a.m. ET"}]},{"id":"usa-quaker-fire-oct25","headline":"Explosion and fire hit Quaker Oats plant; all workers escape safely","summary":"Cedar Rapids officials say an apparent explosion started Saturday’s fire at the major Iowa milling facility. The mayor says all workers were accounted for and nobody was injured. The cause was not immediately known; the available report does not establish the duration of any production interruption.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/cedar-rapids-fire-iowa-quaker-oats-205913f0edeac764a19bb2daabf3d911","label":"AP — updated Oct. 24, 7:48 p.m. EDT"}]},{"id":"usa-audi-georgia-oct25","headline":"Audi announces Georgia SUV plant with construction planned for 2027","summary":"Trump announced the investment at his Perry rally, and Audi’s chairman appeared with him. AP reports the company says the project would create approximately 4,500 jobs and begin production in the early 2030s. Those jobs and output are future plans, not an already operating factory or independent proof of Trump’s tariff claims.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/audi-georgia-trump-manufacturing-auto-plant-c1d49f2437c1d9cf349af399b8abe3a3","label":"AP — updated Oct. 24, 10:22 p.m. EDT"}]},{"id":"usa-medical-oct24","headline":"Medi-Cal’s tighter asset limit threatens coverage for seniors and disabled people","summary":"CalMatters reporting carried by AP examines a state budget change lowering the qualifying asset limit to $21,000 beginning July 2027. Patients face difficult spending decisions; estimates of future coverage losses are forecasts, not a count of people already disenrolled.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/health-benefits-cuts-california-7d0accf339933558327fe3f964a5053a","label":"CalMatters/AP — Oct. 23, 3:56 p.m. EDT"}]},{"id":"usa-nasa-moon-oct25-evening","headline":"NASA’s accelerated moon plan targets 2028 landing, not next summer","summary":"Administrator Jared Isaacman says Artemis III remains scheduled for an Earth-orbit docking exercise next summer, while Artemis IV’s astronaut moon landing is targeted for 2028. AP’s Friday report remains significant to the agency’s accelerated program. These are schedules and goals, not completed missions or a guarantee of on-time delivery.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/nasa-artemis-moon-astronauts-space-0a535368f718cb42f5b9c3378d3953c2","label":"AP — Oct. 23, 6 p.m. EDT"}]},{"id":"usa-caffeine-pouches-oct25-evening","headline":"School bans target caffeine pouches as pediatricians warn of high doses ly’s filmmaking record.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/making-marie-antoinette-documentary-sofia-coppola-6fbc00b9d6edec7965b35c2df9be83b1","label":"AP — 10:56 AM EDT, October 23, 2026"}]},{"id":"ent-rent-oct23-eve","headline":"“Rent” marks 30 years on Broadway with a starry celebration","summary":"AP’s Friday feature follows performers reflecting on the musical’s legacy and anniversary show. It is an anniversary event and cultural retrospective, not a newly announced original Broadway opening.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/rent-anniversary-2026-a5c52fdba5f3a6cf9b1209ca655dbb86","label":"AP — 10:57 AM EDT, October 23, 2026"}]},{"id":"ent-residencies-oct23-eve","headline":"Why stars from Harry Styles to Celine Dion choose residencies","summary":"AP’s Friday report examines the appeal of staying in one venue rather than continually touring. The business and creative advantages differ by artist; the trend does not mean all major acts are abandoning tours.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/music-residencies-harry-styles-celine-dion-6ffeeffb46fbc81a4c4a30f10babd4a1","label":"AP — 6:08 AM EDT, October 23, 2026"}]},{"id":"entertainment-skerritt-oct22-eve","headline":"Tom Skerritt, “Alien” and “Top Gun” actor, dies at 93","summary":"AP reports the death of the Emmy-winning “Picket Fences” star whose film roles ranged from “Alien” to “Top Gun.” The report celebrates a long career of authoritative character performances; no unsupported cause of death is supplied here.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/tom-skerritt-dies-598ccdd4849ea7fe3b72b71319a4ef9b","label":"AP — Oct. 22, 2026"}]},{"id":"entertainment-bioware-oct22-eve","headline":"EA shuts BioWare and cancels the next “Mass Effect”","summary":"BioWare announced its closure after more than three decades, and the next “Mass Effect” game was canceled. AP distinguishes the studio’s confirmation from Bloomberg’s broader layoff estimate; EA had not immediately answered AP’s request for comment.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/bioware-ea-electronic-arts-shutdown-mass-effect-6b6e5c930fe56dd2cd18985d89f6ef24","label":"AP — Oct. 22, 2026"}]},{"id":"ent-raffi-oct23-eve","headline":"Raffi reflects on 50 years, children’s screen time and new music","summary":"AP’s Oct. 22 interview revisits the singer’s breakthrough and his views on how children consume music today. His concerns about screens are attributed to the artist rather than presented as a newly proved medical finding.","sources":["Other"],"signal":"Watch","links":[{"url":"https://apnews.com/article/raffi-new-album-interview-d50d8f9ad50e6072ce5847324c7e5a6e","label":"AP — 6:11 AM EDT, October 22, 2026"}]}]},"researchNotes":["Oct. 25 evening weekend limited refresh; schedule unchanged. Only four eligible tabs researched and re-ranked; Friday evening Business, World, Politics and Entertainment preserved exactly.","Boston official results and official/ESPN schedules checked Sunday evening: all four teams off. WEEI/Audacy hubs checked; Globe reporting partly paywalled.","Fox intelligence-memo body had access limitations; Reuters directly reviewed the memo. California hearing cross-checked with the Los Angeles Times; Newport response cross-checked with local KVAL, including its narrower evacuation update.","Brazil card explicitly uses AP’s 6:46 p.m. EDT update rather than predicting a winner. Preserved World cards retain Friday’s pre-election source dates and were not refreshed.","Business preserved without new market research; latest verified session remains Friday Oct. 23."]}</script>
<script>
const edition=JSON.parse(document.getElementById('briefing').textContent);
const tabs=[['top','Top News'],['usa','USA'],['boston','Boston Sports'],['business','Business'],['world','World'],['sports','Sports'],['politics','Politics'],['entertainment','Entertainment']];
const notes={usa:'10 U.S. stories not repeated elsewhere.',boston:'10 Boston pro-team stories; only the Red Sox, Patriots, Bruins and Celtics. One same-day status card, at least seven substantive team-news cards when qualified; excludes Boston College and all other college sports.',world:'10 international stories not repeated elsewhere.',sports:'No Boston teams, auto racing, international soccer, or WNBA coverage.',business:'7 unique business/markets stories refreshed only at 7 p.m. Eastern Monday through Friday, with independently confirmed figures for the latest completed U.S. cash session. Preserved unchanged at all other editions.'};
let active='top';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(v){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>'<button class="tab '+(active===id?'active':'')+'" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function render(){renderTabs();const stories=edition.sections[active]||[];const label=tabs.find(t=>t[0]===active)[1];document.getElementById('tellLabel').textContent='The tell today · '+label;document.getElementById('take').textContent=edition.sectionTakes[active]||edition.take;document.getElementById('sectionTitle').textContent=label;document.getElementById('count').textContent=stories.length+' stories';const note=document.getElementById('note');note.textContent=notes[active]||'';note.classList.toggle('hidden',!notes[active]);document.getElementById('stories').innerHTML=stories.map((s,i)=>'<article class="story"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div><div class="badges"><span class="badge sig-'+esc(s.signal)+'">'+esc(s.signal)+'</span>'+s.sources.map(x=>'<span class="badge src-'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div><h3>'+esc(s.headline)+'</h3><p>'+esc(s.summary)+'</p><div class="links">'+s.links.map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>').join('')+'</div></div></article>').join('');scrollTo({top:0,behavior:'smooth'})}
document.getElementById('date').textContent=fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'');document.getElementById('dek').textContent=edition.dek;document.getElementById('foot').textContent='Point-in-time briefing for '+fmtDate(edition.date)+' · Updated '+(edition.lastUpdated||'')+'. Open source buttons for full reporting.';render();
</script>
